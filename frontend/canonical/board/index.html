<!-- SMPL_LIVE_BOARD v2 demo-ready May 2026 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMPL · We make finance simple · June 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Skin tokens — overwritten by applySkin() at runtime ── */
  --bg:      #18241b;
  --bg2:     #233326cc;
  --bg3:     #2b3c2e;
  --panel:   #233326cc;
  --text:    #dde8d6;
  --text2:   #aab8a2;
  --text3:   #72826a;
  --border:  #2e3f31;
  --border2: rgba(56,75,60,0.25);
  --accent:  #c4855a;
  --teal:    #5fa878;
  --red:     #b8705f;
  --amber:   #b89060;
  --navy:    #23332699;
  --blue:    #5fa878;
  --teal-light: rgba(95,168,120,0.12);
  --red-light:  rgba(184,112,95,0.1);
  --amber-light:rgba(184,144,96,0.1);
  --green:   #5fa878;
  --green-light: rgba(95,168,120,0.1);
  --gray:    #72826a;
  --lgray:   #2e3f31;
  --shadow:  0 1px 2px rgba(0,0,0,0.25), 0 12px 32px -8px rgba(0,0,0,0.35);
  --r:  12px;
  --r2: 18px;
  --font: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Inter', -apple-system, sans-serif;
  --serif: 'Inter', -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.25s, color 0.25s; }
/* TOPBAR */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 13px 24px; border-bottom: 0.5px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); transition: background 0.25s, border-color 0.25s; }
.logo { font-family: var(--font); font-size: 16px; font-weight: 600; letter-spacing: -0.4px; color: var(--text); }
.logo span { font-weight: 300; }
.period-badge { font-family: var(--mono); font-size: 11px; color: var(--text2); background: var(--bg2); padding: 4px 12px; border-radius: 20px; border: 0.5px solid var(--border); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.ai-global-btn { font-size: 11px; padding: 5px 12px; border: 0.5px solid var(--border); border-radius: 20px; background: none; cursor: pointer; color: var(--text2); display: flex; align-items: center; gap: 5px; transition: all .15s; font-family: var(--font); }
.ai-global-btn:hover { background: var(--bg2); color: var(--text); }
/* SKIN SWITCHER */
.skin-select { font-family: var(--font); font-size: 11px; font-weight: 500; padding: 5px 10px; border: 0.5px solid var(--border); border-radius: 20px; background: var(--bg2); color: var(--text2); cursor: pointer; outline: none; transition: all .15s; }
.skin-select:hover { color: var(--text); }
.skin-select option { background: #1a1a1a; color: #eee; }
/* NAV */
.nav { display: flex; padding: 0 24px; border-bottom: 0.5px solid var(--border); overflow-x: auto; background: var(--bg); transition: background 0.25s, border-color 0.25s; }
.nav-btn { padding: 11px 16px; font-size: 12px; color: var(--text3); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: color .15s; font-family: var(--font); letter-spacing: 0.01em; }
.nav-btn:hover:not(.active) { color: var(--text2); }
.nav-btn.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
/* TRUST STRIP + CONTINUITY + CITE-TO-CALC */
.smpl-trust-strip, .smpl-validated-stamp { font-size: 11px; padding: 5px 12px; border: 0.5px solid var(--border); border-radius: 20px; background: none; cursor: pointer; color: var(--text2); display: flex; align-items: center; gap: 7px; font-family: var(--font); max-width: 460px; text-decoration: none; }
.smpl-trust-strip:hover, .smpl-validated-stamp:hover { background: var(--bg2); }
.smpl-trust-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.smpl-trust-meta { opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.smpl-trust-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.smpl-trust-meta { color: var(--text3); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.smpl-cont-banner { margin-top: 8px; padding: 12px 14px; border: 0.5px solid var(--border); border-radius: var(--r); background: rgba(255,255,255,0.02); }
.smpl-cont-grid { display: grid; gap: 6px; margin-top: 8px; }
.smpl-cont-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--text2); border-bottom: 0.5px solid var(--border); padding: 5px 0; }
.smpl-cont-row strong { color: var(--text); font-weight: 500; text-align: right; }
.smpl-cont-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.smpl-cont-chip { font-size: 10px; font-weight: 600; padding: 4px 9px; border-radius: 14px; border: 0.5px solid; background: rgba(255,255,255,0.02); }
.smpl-cont-fail { margin-top: 8px; border: 0.5px solid var(--border); border-radius: var(--r); padding: 8px 10px; background: rgba(184,112,95,0.06); }
.smpl-cont-fail summary { cursor: pointer; font-size: 12px; color: var(--text); }
.smpl-cont-fail-body { margin-top: 8px; font-size: 11px; color: var(--text2); line-height: 1.45; }
.smpl-cont-ok { font-size: 12px; color: var(--teal); margin-top: 6px; }
.ve-checklist { list-style: none; padding: 0; margin: 0; }
.ve-checklist li { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
.ve-check { width: 18px; text-align: center; font-weight: 700; }
.ve-check-meta { color: var(--text3); font-size: 12px; margin-top: 2px; }
.ve-ok { color: var(--teal); }
.ve-warn { color: #c48a3a; }
.ve-bad { color: var(--red, #b8705f); }
.ve-foot { margin-top: 20px; font-size: 11px; color: var(--text3); }
.ve-map { width: 100%; border-collapse: collapse; font-size: 12px; }
.ve-map th, .ve-map td { border-bottom: 0.5px solid var(--border); padding: 8px 6px; text-align: left; vertical-align: middle; }
.ve-map th { color: var(--text3); font-weight: 600; }
.ve-map-sel, .ve-allow-by { background: var(--bg); color: var(--text); border: 0.5px solid var(--border); border-radius: 4px; padding: 6px 8px; font-size: 12px; font-family: var(--font); }
.ve-allow-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.smpl-cite-drawer { position: fixed; top: 0; right: 0; width: min(380px, 92vw); height: 100vh; background: var(--bg); border-left: 0.5px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,0.18); z-index: 80; transform: translateX(105%); transition: transform .2s ease; display: flex; flex-direction: column; }
.smpl-cite-drawer.open { transform: translateX(0); }
.smpl-cite-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 0.5px solid var(--border); font-size: 13px; }
.smpl-cite-close { background: none; border: none; color: var(--text2); font-size: 22px; cursor: pointer; line-height: 1; }
.smpl-cite-body { padding: 16px; overflow: auto; }
.smpl-cite-value { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 12px; color: var(--text); }
.smpl-cite-note { margin-top: 14px; font-size: 11px; color: var(--text3); line-height: 1.5; }
.kpi-val[data-source], .kpi-val[data-metric] { cursor: pointer; }
.kpi-val[data-source]:hover, .kpi-val[data-metric]:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
/* SLIDE */
.slide { padding: 22px 24px; max-width: 100%; }
.slide-title { font-family: var(--font); font-size: 20px; font-weight: 600; letter-spacing: -0.5px; color: var(--text); margin-bottom: 3px; }
.slide-sub { font-size: 11.5px; color: var(--text3); margin-bottom: 18px; font-weight: 400; }
/* KPI STRIP */
.kpi-strip { display: grid; gap: 10px; margin-bottom: 18px; }
.kpi-strip-5 { grid-template-columns: repeat(5,1fr); }
.kpi-strip-4 { grid-template-columns: repeat(4,1fr); }
.kpi-strip-6 { grid-template-columns: repeat(6,1fr); }
.kpi { background: var(--bg2); border-radius: var(--r2); padding: 14px 16px; border: 0.5px solid var(--border); box-shadow: var(--shadow); transition: background 0.25s, border-color 0.25s; }
.kpi-lbl { font-size: 9.5px; color: var(--text3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; font-weight: 500; }
.kpi-val { font-size: 22px; font-weight: 600; font-family: var(--font); line-height: 1; color: var(--text); letter-spacing: -0.5px; }
.kpi-delta { font-size: 10px; margin-top: 5px; font-family: var(--font); }
.pos { color: var(--teal); } .neg { color: var(--red); } .neu { color: var(--text3); }
/* GRID LAYOUTS */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.chart-wrap { position: relative; }
/* CARDS */
.card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--r2); padding: 16px 18px; box-shadow: var(--shadow); transition: background 0.25s, border-color 0.25s; }
.card-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; letter-spacing: -0.1px; }
.card-sub { font-size: 10px; color: var(--text3); margin-bottom: 12px; }
/* COMMENTARY */
.commentary { background: var(--bg2); border-radius: var(--r); padding: 14px 16px; margin-top: 14px; border-left: 2.5px solid var(--accent); box-shadow: var(--shadow); transition: all 0.25s; }
.commentary.risk { border-left-color: var(--red); }
.commentary-lbl { font-size: 9.5px; color: var(--text3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; font-weight: 500; }
.commentary-text { font-size: 12px; color: var(--text2); line-height: 1.7; }
.ai-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 6px 13px; border: 0.5px solid var(--border); background: var(--bg2); color: var(--text2); border-radius: 20px; cursor: pointer; margin-top: 9px; transition: all .15s; font-family: var(--font); }
.ai-btn:hover { background: var(--bg3); color: var(--text); }
.spin { display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--border2); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* VARIANCE ROWS */
.var-row { display: flex; align-items: center; padding: 7px 0; border-bottom: 0.5px solid var(--border); font-size: 12px; }
.var-row:last-child { border-bottom: none; }
.var-lbl { color: var(--text2); flex: 1; min-width: 0; }
.var-act { color: var(--text); font-family: var(--mono); font-weight: 500; width: 70px; text-align: right; flex-shrink: 0; }
.var-bud { color: var(--text3); font-family: var(--mono); font-size: 11px; width: 90px; text-align: right; flex-shrink: 0; }
.var-diff { font-family: var(--mono); font-size: 11px; font-weight: 500; width: 60px; text-align: right; flex-shrink: 0; }
.var-diff.pos { color: var(--teal); } .var-diff.neg { color: var(--red); } .var-diff.neu { color: var(--text3); }
/* SECTION LABEL */
.sec-lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--text3); padding: 10px 0 5px; font-weight: 500; }
/* CHANNEL BARS */
.ch-row { display: grid; grid-template-columns: 120px 1fr 70px 75px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 0.5px solid var(--border); font-size: 11px; }
.ch-row:last-child { border-bottom: none; }
.bar-bg { background: var(--bg2); border-radius: 2px; height: 5px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; }
/* CASH ROWS */
.cash-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 11px; border-radius: 5px; margin-bottom: 3px; font-size: 12px; }
.cash-row.in { background: var(--green-light); }
.cash-row.out { background: var(--red-light); }
.cash-row.tot { background: var(--bg2); font-weight: 500; }
/* HC GRID */
.hc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.hc-dept { background: var(--bg2); border-radius: var(--r); padding: 11px 13px; }
.hc-name { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.hc-val { font-size: 20px; font-weight: 500; font-family: var(--mono); color: var(--text); }
.hc-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }
/* RISK GRID */
.risk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.risk-card { border-radius: var(--r); padding: 13px 14px; border: 0.5px solid var(--border); }
.risk-card.rh { border-left: 3px solid var(--red); }
.risk-card.rm { border-left: 3px solid var(--amber); }
.risk-card.op { border-left: 3px solid var(--teal); }
.risk-type { font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: var(--text3); margin-bottom: 4px; }
.risk-title { font-size: 12px; font-weight: 500; margin-bottom: 4px; }
.risk-desc { font-size: 11px; color: var(--text2); line-height: 1.55; }
/* PL TABLE */
.pl-tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; table-layout: fixed; }
.pl-tbl th { text-align: center; padding: 5px 7px; font-size: 9.5px; color: var(--text3); font-weight: 500; border-bottom: 0.5px solid var(--border2); }
.pl-tbl th:first-child { text-align: left; }
.pl-tbl td { padding: 5px 7px; border-bottom: 0.5px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-tbl td:not(:first-child) { text-align: center; font-family: var(--mono); font-size: 11px; color: var(--text2); }
.pl-tbl th.al, .pl-tbl td.al { text-align: left; font-family: inherit; }
.pl-tbl td:first-child { color: var(--text); }
.pl-tbl tr.pl-sec td { background: var(--bg2); font-size: 9.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--text2); font-weight: 500; padding: 6px 7px; }
.pl-tbl tr.pl-sub td { font-weight: 500; color: var(--text); border-top: 0.5px solid var(--border2); }
.pl-tbl tr.pl-tot td { font-weight: 500; color: var(--text); border-top: 1.5px solid var(--border2); background: var(--bg2); }
.pl-tbl tr.pl-drill td { background: var(--bg2); font-size: 10.5px; }
.pl-tbl tr.pl-drill td:first-child { padding-left: 22px; color: var(--text2); }
.pl-tbl tr.pl-click td:first-child { cursor: pointer; }
.pl-tbl tr.pl-click:hover td:first-child { color: var(--teal); }
.pl-summary-tbl th { color: var(--text2); font-weight: 600; font-size: 10px; letter-spacing: .02em; border-bottom: 1px solid var(--border2); }
.pl-summary-tbl td:not(:first-child) { color: var(--text); font-size: 11.5px; }
.pl-summary-tbl tr.pl-sub td, .pl-summary-tbl tr.pl-tot td { background: rgba(255,255,255,0.04); }
.pl-summary-tbl tr.pl-drill td { background: rgba(255,255,255,0.025); }
.pl-summary-tbl tr.pl-drill td:first-child { color: var(--text2); }
.pl-summary-tbl td.vpos { color: var(--teal); font-weight: 600; }
.pl-summary-tbl td.vneg { color: var(--red); font-weight: 600; }
.pl-summary-tbl td.vneu { color: var(--text3); }
/* Beat .pl-sub/.pl-tot { color: var(--text) } so variance cells keep sign colors */
.pl-tbl tr.pl-sub td.vpos, .pl-tbl tr.pl-tot td.vpos,
.pl-summary-tbl tr.pl-sub td.vpos, .pl-summary-tbl tr.pl-tot td.vpos { color: var(--teal); font-weight: 600; }
.pl-tbl tr.pl-sub td.vneg, .pl-tbl tr.pl-tot td.vneg,
.pl-summary-tbl tr.pl-sub td.vneg, .pl-summary-tbl tr.pl-tot td.vneg { color: var(--red); font-weight: 600; }
.pl-tbl tr.pl-sub td.vneu, .pl-tbl tr.pl-tot td.vneu,
.pl-summary-tbl tr.pl-sub td.vneu, .pl-summary-tbl tr.pl-tot td.vneu { color: var(--text3); }
/* Provenance: origin tags jump to the statement a line comes from; amounts open a source popover */
.lock-link { display: inline-block; margin-left: 6px; padding: 0 5px; font-size: 9px; line-height: 14px; border-radius: 3px; border: 0.5px solid var(--border2); background: transparent; color: var(--text3); cursor: pointer; font-family: inherit; vertical-align: middle; }
.lock-link:hover { color: var(--teal); border-color: var(--teal); }
.src-amt { cursor: help; border-bottom: 1px dotted transparent; }
.src-amt:hover { border-bottom-color: var(--text3); }
.src-pop { position: fixed; z-index: 9999; max-width: 380px; background: var(--bg, #111); border: 0.5px solid var(--border2); border-radius: var(--r, 6px); box-shadow: 0 6px 24px rgba(0,0,0,0.35); padding: 10px 12px; font-size: 11px; color: var(--text2); }
.src-pop h4 { margin: 0 0 4px; font-size: 11.5px; color: var(--text); font-weight: 600; }
.src-pop .sp-meta { font-size: 10px; color: var(--text3); margin-bottom: 6px; }
.src-pop table { width: 100%; border-collapse: collapse; }
.src-pop td { padding: 2px 0; font-size: 10.5px; }
.src-pop td:last-child { text-align: right; font-family: var(--mono); }
.src-pop .sp-foot { margin-top: 6px; font-size: 10px; color: var(--text3); }
.ts-hl td { background: rgba(95,168,120,0.14) !important; transition: background 1.2s; }
.tie-pill { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 9.5px; font-weight: 500; }
.tie-pill.ok { background: rgba(95,168,120,0.16); color: var(--teal); }
.tie-pill.alloc { background: rgba(233,162,59,0.16); color: var(--amber); }
.tie-pill.brk { background: rgba(216,90,48,0.16); color: var(--red); }
.pl-expand { display: inline-block; width: 14px; font-size: 9px; opacity: .45; }
/* DEPT TABS */
.dtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.dtab { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 0.5px solid var(--border); cursor: pointer; background: none; color: var(--text2); font-family: var(--font); transition: all .15s; }
.dtab:hover { background: var(--bg2); }
.dtab.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
/* FOOTER */
.footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 24px; border-top: 0.5px solid var(--border); margin-top: 6px; background: var(--bg); transition: background 0.25s, border-color 0.25s; }
.footer-note { font-size: 10px; color: var(--text3); }
.export-btns { display: flex; gap: 8px; }
.exp-btn { font-size: 11px; padding: 5px 10px; border: 0.5px solid var(--border); border-radius: var(--r); background: none; cursor: pointer; color: var(--text2); display: flex; align-items: center; gap: 4px; font-family: var(--font); transition: all .15s; }
.exp-btn:hover { background: var(--bg2); }
/* LEGEND */
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.li { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text2); }
.ls { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.vpos { color: var(--teal); font-weight: 500; }
.vneg { color: var(--red); font-weight: 500; }
.vneu { color: var(--text3); }
/* PL SUB NAV */
.subnav { display: flex; gap: 6px; margin-bottom: 14px; }
.snav-btn { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 0.5px solid var(--border); cursor: pointer; background: none; color: var(--text2); font-family: var(--font); transition: all .15s; }
.snav-btn.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }

.wf-tab-bar{display:flex;gap:4px;margin-bottom:14px}
.wf-tab{font-size:11px;padding:4px 11px;border-radius:20px;border:0.5px solid var(--border);cursor:pointer;background:none;color:var(--text2);font-family:var(--font);transition:all .15s}
.wf-tab.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.roster-tbl{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.roster-tbl th{padding:4px 8px;font-size:9px;font-weight:500;color:var(--text3);border-bottom:0.5px solid var(--border2);text-align:right;white-space:nowrap}
.roster-tbl th:first-child{text-align:left}
.roster-tbl td{padding:4px 8px;border-bottom:0.5px solid var(--border);color:var(--text2);text-align:right;font-family:var(--mono);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster-tbl td:first-child{text-align:left;font-family:inherit;color:var(--text)}
.roster-tbl tr.dept-sep td{background:var(--bg2);font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);padding:5px 8px;font-family:inherit}
.roster-tbl tr:hover td{background:var(--bg2)}
.sc-impact{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.sc-card{background:var(--bg2);border-radius:var(--r);padding:10px 13px;border-left:3px solid}
.sc-card-title{font-size:11px;font-weight:500;color:var(--text);margin-bottom:6px}

.copilot-btn { color: var(--accent) !important; font-weight: 500; }

.cp-container { display: flex; flex-direction: column; height: calc(100vh - 160px); }
.cp-messages { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
.cp-msg { display: flex; gap: 10px; align-items: flex-start; }
.cp-msg.user { flex-direction: row-reverse; }
.cp-bubble { max-width: 75%; padding: 11px 14px; border-radius: 12px; font-size: 12.5px; line-height: 1.55; }
.cp-msg.user .cp-bubble { background: var(--accent); color: var(--bg); border-radius: 12px 12px 2px 12px; }
.cp-msg.assistant .cp-bubble { background: var(--bg2); color: var(--text); border: 0.5px solid var(--border); border-radius: 12px 12px 12px 2px; }
.cp-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; margin-top: 2px; }
.cp-msg.user .cp-avatar { background: var(--accent); color: var(--bg); }
.cp-msg.assistant .cp-avatar { background: var(--teal); color: var(--bg); font-size: 10px; }
.cp-input-row { display: flex; gap: 8px; padding: 12px 0 0; border-top: 0.5px solid var(--border); }
.cp-input { flex: 1; padding: 10px 14px; border: 0.5px solid var(--border); border-radius: 8px; font-size: 12.5px; font-family: var(--font); resize: none; background: var(--bg2); color: var(--text); outline: none; line-height: 1.4; transition: border-color .15s; }
.cp-input:focus { border-color: var(--accent); }
.cp-send { padding: 10px 18px; background: var(--accent); color: var(--bg); border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; font-family: var(--font); transition: opacity .15s; white-space: nowrap; }
.cp-send:hover { opacity: 0.85; }
.cp-send:disabled { opacity: 0.4; cursor: not-allowed; }
.cp-chip-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0 4px; }
.cp-chip { font-size: 11px; padding: 5px 11px; border: 0.5px solid var(--border); border-radius: 20px; cursor: pointer; background: var(--bg2); color: var(--text2); font-family: var(--font); transition: all .15s; }
.cp-chip:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }

.cp-dot:nth-child(2) { animation-delay: .2s; }
.cp-dot:nth-child(3) { animation-delay: .4s; }

// ─── DATA ─────────────────────────────────────────────────────────────────

// ══════════════════════════════════════════════════════════════════════════════
// SMPL BOARD PLATFORM — MONTHLY CLOSE ROLLOVER INSTRUCTIONS
// ══════════════════════════════════════════════════════════════════════════════
//
// STEP 1 — Update the three lines below (only manual step for most months):
//   CLOSE_MONTH : last period with confirmed actuals  e.g. '2026-07'
//   CLOSE_LABEL : display label                       e.g. 'Jul 2026'
//   CLOSE_MO    : short month name                    e.g. 'Jul'

//   REV_ACT, REV_BUD, GP_ACT, SM_ACT, RD_ACT, GA_ACT, EBITDA_ACT
//   CASH_ACT, CASH_BUD, COLL

//   SD.pipeline — add '2026-XX':{created,won,lost,ending,coverage}
//   TS_DATA.Actual — add period to .is / .cfs / .bs objects
//   Workforce has no arrays to edit: it reads the workforce payload (signed in) or WF_DEMO,
//   which build_demo_workforce_from_files.py rebuilds from the files.
//

//
// NEW YEAR ROLLOVER (Jan next year):
//   Reset CLOSE_MONTH to 'YYYY-01', update all arrays for new year,
//   replace TS_DATA with new Budget/Forecast files,
//   rebuild WF_DEMO for the new year.
//
// NEW FORECAST/BUDGET FILES:

//
// WHAT UPDATES AUTOMATICALLY FROM CLOSE_MONTH (no manual change needed):
//   - Period badge ("Jul 2026 · YTD Close")
//   - Footer label ("Jan-Jul 2026 Actuals")
//   - HC bridge bar colors (green actual / amber forecast)
//   - Open Reqs KPI period label ("Aug-Nov starts")
//   - FC column header in Management P&L ("FC Aug-Dec")
//   - Pipeline coverage chart period count
//   - Monthly pipeline creation teal/amber split
//   - Sales attainment chart period count
//   - EBITDA margin chart period count
//   - 3-Statement actual/forecast column styling
// ══════════════════════════════════════════════════════════════════════════════
let CLOSE_MONTH = '2026-06';  // <-- UPDATE EACH CLOSE

var HC_TOTAL_JAN = null, HC_TOTAL_MAY = null, HC_TOTAL_JUN = null, HC_TOTAL_BUD = null;

// ─── HELPERS ──────────────────────────────────────────────────────────────
let charts = {}, openRows = new Set(), curGLDept = 'Sales & Marketing', aiCache = {};
let _chartBuildGen = 0;
let _plChartBuildGen = 0;

function scheduleChartBuild(name, delay) {
  delay = delay == null ? 50 : delay;
  var gen = ++_chartBuildGen;
  setTimeout(function () {
    if (gen !== _chartBuildGen) return;
    buildCharts(name);
  }, delay);
}

function schedulePLCharts(delay) {
  delay = delay == null ? 30 : delay;
  var gen = ++_plChartBuildGen;
  setTimeout(function () {
    if (gen !== _plChartBuildGen) return;
    buildPLTable();
    buildPLMiniCharts();
  }, delay);
}
if (typeof window !== 'undefined') {
  window.schedulePLCharts = schedulePLCharts;
}

function boardChartScaleTokens() {
  var skin = (window.SMPLSkin && window.SMPLSkin.chartSkinTokens) ? window.SMPLSkin.chartSkinTokens() : null;
  var cs = getComputedStyle(document.documentElement);
  var cText2 = skin ? skin.cText2 : cs.getPropertyValue('--text2').trim();
  var tickFont = skin ? skin.tickFont : { size: 10, family: "'Inter',-apple-system,sans-serif", weight: '500' };
  var tickColor = skin ? skin.tickColor : cText2;
  var gridColor = skin ? skin.gridColor : 'rgba(255,255,255,0.14)';
  var baseScaleX = skin ? skin.baseScaleX : { ticks: { font: tickFont, color: tickColor }, grid: { display: false } };
  var baseScaleY = skin ? skin.baseScaleY : function(cb) {
    return { ticks: { callback: cb, font: tickFont, color: tickColor }, grid: { color: gridColor, drawTicks: false } };
  };
  return { tickFont, tickColor, gridColor, baseScaleX, baseScaleY };
}
const fM = (v, d=1) => {
  if (v===null || v===undefined || Number.isNaN(v)) return '—';
  if (typeof boardFmtM === 'function') return boardFmtM(v, d);
  d = Math.min(d, 2);
  const neg = v < 0, abs = Math.abs(v);
  if (abs >= 1e6) return (neg?'-$':'$') + (abs/1e6).toFixed(d) + 'M';
  if (abs >= 1e3) return (neg?'-$':'$') + (abs/1e3).toFixed(0) + 'K';
  return (neg?'-$':'$') + abs.toFixed(d) + 'M';
};
const fM1 = v => fM(v, 1);
const fV1 = v => {
  if (v==null || Number.isNaN(v)) return '—';
  if (typeof boardFmtVarM === 'function') return boardFmtVarM(v);
  var abs = Math.abs(v);
  var d = abs < 0.1 ? 2 : 1;
  return (v>=0?'+':'-') + '$' + abs.toFixed(d) + 'M';
};
const fV = v => {
  if (v==null || Number.isNaN(v)) return '—';
  if (typeof boardFmtVarM === 'function') return boardFmtVarM(v);
  var abs = Math.abs(v);
  var d = abs < 0.1 ? 2 : 1;
  return (v>=0?'+':'-') + '$' + abs.toFixed(d) + 'M';
};
const fP = (v,b) => b ? ((v-b)/Math.abs(b)*100).toFixed(1)+'%' : '—';
/** Signed variance % for P&L (always shows + / − from the numeric sign). */
const fVarPct = (vd, b) => {
  if (b == null || Number.isNaN(b) || Math.abs(b) < 1e-12) return '—';
  const pct = (vd / Math.abs(b)) * 100;
  if (Math.abs(pct) < 0.05) return '0.0%';
  return (pct > 0 ? '+' : '') + pct.toFixed(1) + '%';
};
/** Color by numeric sign only: green = positive, red = negative (ignore expense "favorable" invert). */
const vCls = (v, inv) => Math.abs(v)<0.005?'vneu':(inv?v<0:v>0)?'vpos':'vneg';
const vClsSign = (v) => vCls(v, false);
const vSign = (v,inv) => Math.abs(v)<0.005?'vneu':(inv?v<0:v>0)?'pos':'neg';
/** Provenance attrs for material metrics (data-source / title / aria). */
function ds(metricKey) {
  return (window.SMPLProvenance && typeof SMPLProvenance.attrString === 'function')

    : 'data-metric="' + metricKey + '"';
}
function boardAnnotateProvenance(root) {
  if (window.SMPLProvenance && typeof SMPLProvenance.annotateDom === 'function') {
    try { SMPLProvenance.annotateDom(root || document); } catch (e) { /* non-fatal */ }
  }
}

function destroyCharts() { Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}); charts={}; }

/** Executive summary KPI cards → primary nav tabs */
function boardExecNav(tab) {
  const btn = Array.from(document.querySelectorAll('.nav-btn')).find(function (b) {
    return (b.getAttribute('onclick') || '').indexOf("show('" + tab + "'") >= 0;
  });
  show(tab, btn || null);
}

function show(name, btn) {
  if (typeof boardRefreshAllSeries === 'function') boardRefreshAllSeries();
  if (typeof boardValidate === 'function') {
    var v = boardValidate();
    if (!v.ok) console.warn('[board] validation:', v.errors);
  }
  destroyCharts();
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  else document.querySelectorAll('.nav-btn').forEach(b=>{if(b.textContent.toLowerCase().includes(name.substr(0,3)))b.classList.add('active');});
  const area = document.getElementById('slideArea');
  area.innerHTML = '';
  window.SMPL_BOARD_VIEW = name;
  window.SMPL_VALIDATION_ENGINE = (name === 'validation');
  try {
    var u = new URL(location.href);
    if (name === 'validation') u.searchParams.set('view', 'validation');
    else u.searchParams.delete('view');
    history.replaceState({}, '', u.pathname + (u.searchParams.toString() ? '?' + u.searchParams.toString() : '') + u.hash);
  } catch (e) { /* ignore */ }
  var mainNav = document.getElementById('mainNav');
  if (mainNav) mainNav.style.display = name === 'validation' ? 'none' : '';
  const renders = {exec:renderExec,arr:renderARR,revenue:renderRevenue,cash:renderCash,threestmt:renderThreeStmt,pl:renderPL,gtm:renderGTM,sales:renderSales,workforce:renderWorkforce,risks:renderRisks,copilot:renderCopilot,validation:renderValidation};
  if(renders[name]) renders[name](area);
  boardAnnotateProvenance(area);
  if (window.SMPLContinuity && typeof SMPLContinuity.refreshValidatedStamp === 'function') {
    try { SMPLContinuity.refreshValidatedStamp(); } catch (e) { /* non-fatal */ }
  } else if (window.SMPLContinuity && typeof SMPLContinuity.refreshTrustStrip === 'function') {
    try { SMPLContinuity.refreshTrustStrip(); } catch (e) { /* non-fatal */ }
  }
  if (name === 'pl' || name === 'threestmt' || name === 'continuity' || name === 'validation') return;
  scheduleChartBuild(name, 50);
}

function renderValidation(area) {
  if (window.SMPLContinuity && typeof SMPLContinuity.renderValidationEngine === 'function') {
    SMPLContinuity.renderValidationEngine(area);
    return;
  }
  if (window.SMPLContinuity && typeof SMPLContinuity.renderContinuity === 'function') {
    SMPLContinuity.renderContinuity(area);
    return;
  }
  area.innerHTML = '<div class="slide-title">Validation Engine</div><div class="slide-sub">Loading…</div>';
}

function renderContinuity(area) {
  renderValidation(area);
}

// ─── EXEC ──────────────────────────────────────────────────────────────────
const MON_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function boardCloseParts() {
  const s = String(typeof CLOSE_MONTH !== 'undefined' ? CLOSE_MONTH : '2026-06');
  const y = parseInt(s.slice(0, 4), 10) || 2026;
  const m = parseInt(s.slice(5, 7), 10) || 6;
  return { year: y, month: m };

function boardExecVerdict(k) {
  const cp = boardCloseParts();
  const frame = cp.month === 12 ? 'FY closed'
    : cp.month === 6 ? 'H1 closed'
    : MON_FULL[cp.month - 1] + ' closed';

  // fM1 renders anything under $0.1M as "$0.0M"; drop to thousands so small variances
  // read as the numbers they are rather than as zero.
  const amt = v => Math.abs(v) < 0.1 ? '$' + Math.round(Math.abs(v) * 1000) + 'K' : fM1(Math.abs(v));

  const lead = [];
  if (k.arrVar != null) {
    lead.push(Math.abs(k.arrVar) < 0.005
      ? 'ARR on plan'
      : 'ARR ' + amt(k.arrVar) + (k.arrVar > 0 ? ' ahead of plan' : ' behind plan'));
  }
  // Only claim the superlative in a month where it is actually true.
  const nnSeries = (window.NN_ACT || []).slice(0, (k.idx != null ? k.idx : 0) + 1);
  if (k.nn != null && nnSeries.length > 1) {
    lead.push(k.nn >= Math.max.apply(null, nnSeries)
      ? 'the strongest net new ARR month of the year'
      : 'net new ARR of ' + fM1(k.nn));
  }

  const mid = [];
  let favourable = 0;
  if (k.gmVarPp != null) {
    if (k.gmVarPp > 0.05) { mid.push('margin expansion'); favourable++; }
    else if (k.gmVarPp < -0.05) { mid.push('margin compression'); favourable--; }
    else mid.push('flat margins');
  }
  if (k.cashAct != null && k.cashBud) {
    const ratio = k.cashAct / k.cashBud;
    if (ratio >= 1.15) { mid.push('a cash position ' + ratio.toFixed(1) + '\u00d7 budget'); favourable++; }
    else if (ratio <= 0.85) { mid.push('cash ' + Math.round((1 - ratio) * 100) + '% below budget'); favourable--; }
    else mid.push('cash in line with budget');
  }

  const horizon = cp.month < 6 ? 'H1' : cp.month < 12 ? 'H2' : 'FY' + String(cp.year + 1).slice(2);
  const outlook = favourable > 0 ? ' create ' + horizon + ' headroom'
    : favourable < 0 ? ' tighten ' + horizon + ' flexibility'
    : ' hold ' + horizon + ' to plan';

  let tail = '';
  if (k.ebitdaAct != null && k.ebitdaBud != null) {
    const ev = k.ebitdaAct - k.ebitdaBud;
    // Only narrate EBITDA when the miss or beat is material. A $14K variance on $661K of
    // budget is rounding, and calling it out crowds the line with noise.
    const material = Math.abs(ev) >= Math.max(0.05, Math.abs(k.ebitdaBud) * 0.05);
    if (material) {
      tail = ev < 0
        ? ', while EBITDA timing variance warrants monitoring'
        : ', with EBITDA ' + amt(ev) + ' ahead of plan';
    }
  }

  const first = lead.length ? frame + ' with ' + lead.join(' and ') : frame;
  return mid.length ? first + ' \u2014 ' + mid.join(' and ') + outlook + tail + '.' : first + tail + '.';
}

/**
 * Drivers / risks / actions for the executive summary, built only from close-month
 * actual vs budget values. Lines without a loaded budget are listed as missing, not estimated.
 */
function boardExecFindings(k) {
  const amt = v => Math.abs(v) < 0.1 ? '$' + Math.round(Math.abs(v) * 1000) + 'K' : fM1(Math.abs(v));
  const items = [
    ['ARR', k.arrEop, k.arrBud, 'm'],
    ['Net new ARR', k.nn, k.nnBud, 'm'],
    ['Revenue', k.revAct, k.revBud, 'm'],
    ['Gross margin', k.gmAct, k.gmBud, 'pp'],
    ['EBITDA', k.ebitdaAct, k.ebitdaBud, 'm'],
    ['Cash', k.cashAct, k.cashBud, 'm'],
  ].concat((k.drivers || []).map(d => [d.label + ' ARR', d.val, d.bud, 'm']));
  const good = [], bad = [], missing = [];
  items.forEach(([label, a, b, kind]) => {
    if (a == null) { missing.push(label + ' (actual)'); return; }
    if (b == null) { missing.push(label + ' (budget)'); return; }
    const v = a - b;
    const fmtV = kind === 'pp' ? a.toFixed(1) + '%' : fM1(a);
    const fmtB = kind === 'pp' ? b.toFixed(1) + '%' : fM1(b);
    const varTxt = kind === 'pp' ? (v >= 0 ? '+' : '') + v.toFixed(1) + 'pp' : (v >= 0 ? '+' : '-') + amt(v);
    const row = { label, varTxt, size: kind === 'pp' ? Math.abs(v) / 100 : Math.abs(v), text: label + ' ' + fmtV + ' vs ' + fmtB + ' budget (' + varTxt + ')' };
    if (Math.abs(v) < 0.005) return;
    (v > 0 ? good : bad).push(row);
  });
  const bySize = (x, y) => y.size - x.size;
  good.sort(bySize); bad.sort(bySize);
  return {
    drivers: good.slice(0, 4).map(r => r.text),
    risks: bad.slice(0, 4).map(r => r.text),
    actions: bad.slice(0, 4).map(r => 'Review the ' + r.label + ' shortfall (' + r.varTxt + ' vs budget)'),
    missing,
  };
}

// ─── GTM ──────────────────────────────────────────────────────────────────
function boardGtmChannels() {
  if (window.SMPL_LIVE_OUTLOOK) {
    const live = window.SMPL_OUTLOOK_PAYLOAD && window.SMPL_OUTLOOK_PAYLOAD.GTM;
    return live && typeof live === 'object' ? live : {};
  }
  return GTM;
}

function boardGtmPeriods() {
  const ts = boardTsSource();
  return (ts.Actual?.periods || []).filter(p => p <= CLOSE_MONTH).sort();
}

function boardGtmPeriodLabel(periods) {
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if (!periods.length) return 'YTD';
  const a = periods[0], b = periods[periods.length - 1];
  return `YTD ${mon[+a.slice(5,7)-1]}–${mon[+b.slice(5,7)-1]} ${b.slice(0,4)}`;
}

/** Marketing program spend by GL account, Actual vs Budget, over the closed months. */
function boardGtmSpend() {
  const ts = boardTsSource();
  const periods = boardGtmPeriods();
  const accounts = {};
  let loaded = false;
  [['Actual','act'],['Budget','bud']].forEach(([sc, field]) => {
    const block = ts[sc]?.gl_programs || {};
    periods.forEach(p => {
      const row = block[p];
      if (!row) return;
      if (sc === 'Actual') loaded = true;
      Object.keys(row).forEach(key => {
        const name = key.split('|').slice(2).join('|') || key;
        const acc = accounts[name] || (accounts[name] = { act: 0, bud: 0 });
        acc[field] += +row[key] || 0;
      });
    });
  });
  const rows = Object.keys(accounts).map(name => ({ name, act: accounts[name].act, bud: accounts[name].bud })).sort((a,b) => b.act - a.act);
  return { rows, loaded, act: rows.reduce((s,r) => s + r.act, 0), bud: rows.reduce((s,r) => s + r.bud, 0) };
}

function boardGtmSummary() {
  const ch = boardGtmChannels();
  const keys = Object.keys(ch).sort((a,b) => (+ch[b].pipe || 0) - (+ch[a].pipe || 0));
  const sum = f => keys.reduce((s,k) => s + (+ch[k][f] || 0), 0);
  const spend = boardGtmSpend();
  const pipe = sum('pipe');
  const wrs = keys.map(k => +ch[k].wr || 0);
  const maxWr = wrs.length ? Math.max(...wrs) : 0;
  const topWr = keys.filter(k => (+ch[k].wr || 0) === maxWr);
  return {
    ch, keys, spend, pipe,
    won: sum('won'),
    mqls: sum('mqls'),
    eff: spend.loaded && spend.act ? pipe * 1e6 / spend.act : null,
    maxWr, topWr,
    period: boardGtmPeriodLabel(boardGtmPeriods()),
  };
}

function boardGtmNarrative(s) {
  if (!s.keys.length) return `${s.period}: no marketing channel data is loaded.`;
  const m = v => '$' + v.toFixed(2) + 'M';
  const d = v => '$' + (v / 1e6).toFixed(2) + 'M';
  const top = s.keys[0];
  const parts = [`${s.period}: ${s.keys.length} channels created ${m(s.pipe)} of pipeline and ${m(s.won)} closed won from ${Math.round(s.mqls).toLocaleString()} MQLs. Largest pipeline source: ${top} (${m(+s.ch[top].pipe || 0)}).`];
  parts.push(s.topWr.length === s.keys.length
    ? `Win rate is ${s.maxWr.toFixed(1)}% in every channel.`
    : s.topWr.length > 1
      ? `Best win rate ${s.maxWr.toFixed(1)}%, shared by ${s.topWr.join(', ')}.`
      : `Best win rate: ${s.topWr[0]} (${s.maxWr.toFixed(1)}%).`);
  if (s.spend.loaded) {
    const delta = s.spend.act - s.spend.bud;
    parts.push(`Marketing program spend (GL) was ${d(s.spend.act)} vs ${d(s.spend.bud)} budget (${delta >= 0 ? d(delta) + ' over' : d(-delta) + ' under'}), or ${s.eff != null ? s.eff.toFixed(1) + 'x' : 'n/a'} pipeline per $1 of program spend. Spend is tracked by GL account, so pipeline per $1 is not available by channel.`);
  } else {
    parts.push('GL marketing program accounts are not loaded, so spend and pipeline per $1 are not shown.');
  }
  return parts.join(' ');
}

/** Cash floor ($M) from the loaded cash bridge rows; null when not loaded. */
function boardCashFloorM() {
  const bridge = window.SMPL_CASH_BRIDGE || (window.SMPL_OUTLOOK_PAYLOAD && window.SMPL_OUTLOOK_PAYLOAD.CASH_BRIDGE);
  if (!bridge) return null;
  for (const scen of Object.keys(bridge)) {
    const rows = bridge[scen] || {};
    for (const p of Object.keys(rows).sort()) {
      if (rows[p] && rows[p].cash_floor != null) return Number(rows[p].cash_floor) / 1e6;
    }
  }
  return null;
}
function boardCloseCfs(cm) {
  const ts = typeof SMPLBoardData !== 'undefined' && SMPLBoardData.boardTsSource ? SMPLBoardData.boardTsSource() : window.TS_DATA;
  const cfs = ts && ts.Actual && ts.Actual.cfs && ts.Actual.cfs[cm];
  if (!cfs) return null;
  const net = cfs.net_change != null ? cfs.net_change : cfs.net_change_cash != null ? cfs.net_change_cash
    : cfs.ending_cash != null && cfs.beginning_cash != null ? cfs.ending_cash - cfs.beginning_cash : null;
  return { net_change: net, cff: cfs.cff != null ? cfs.cff : null };
}

function plEsc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function plColScope(col) {
  const L = window.SMPLLedger;
  const cp = boardCloseParts();
  const mon = MON_ABBR[cp.month - 1];
  if (col === 'a') return { scenario: 'Actual', periods: L.periodsFor('Actual', 'month'), label: mon + ' ' + cp.year + ' Actual' };
  if (col === 'b') return { scenario: 'Budget', periods: L.periodsFor('Budget', 'month'), label: mon + ' ' + cp.year + ' Budget' };
  if (col === 'ytdA') return { scenario: 'Actual', periods: L.periodsFor('Actual', 'ytd'), label: 'YTD Jan–' + mon + ' ' + cp.year + ' Actual' };
  if (col === 'ytdB') return { scenario: 'Budget', periods: L.periodsFor('Budget', 'ytd'), label: 'YTD Jan–' + mon + ' ' + cp.year + ' Budget' };
  const fcP = L.periodsFor('Forecast', 'rest_of_year');
  const first = fcP.length ? MON_ABBR[parseInt(fcP[0].slice(5), 10) - 1] : '';
  return { scenario: 'Forecast', periods: fcP, label: 'Forecast ' + first + '–Dec ' + cp.year };

function plCloseSourcePop() {

}

/** Provenance popover: which ledger rows, allocations and Income Statement line build this amount. */
function plShowSource(el, label, col) {
  const L = window.SMPLLedger;
  if (!L || !label) return;
  plCloseSourcePop();
  const scope = plColScope(col);
  const ex = L.explain('mgmt', label, scope.scenario, scope.periods);
  if (!ex) return;
  const isLabel = PL_TO_IS_LABEL[label];
  const isRoll = L.rollup('is', scope.scenario, scope.periods);
  const totalKey = PL_TOTAL_KEYS[label];
  const isAmt = totalKey ? isRoll.totals[totalKey] : (isRoll.lines[label] ? isRoll.lines[label].amount : null);
  const same = isAmt != null && Math.abs(isAmt - ex.total) < 0.5;
  let body = '';
  if (ex.formula) {
    body += `<div class="sp-meta">${plEsc(ex.formula)}</div>`;
  } else {
    body += '<table>' + ex.accounts.map(a => `<tr><td>${plEsc(a.name)}<div style="font-size:9.5px;color:var(--text3)">${plEsc(a.source)}</div></td><td>${fM(a.amount / 1e6)}</td></tr>`).join('') + '</table>';
    body += `<div class="sp-foot">Allocations: ${ex.transfers.length ? ex.transfers.map(t => plEsc(t.label) + ' ' + fV((t.to === label ? t.amount : -t.amount) / 1e6)).join(', ') : 'none'}</div>`;
  }
  const pop = document.createElement('div');
  pop.id = 'srcPop';
  pop.className = 'src-pop';
  pop.innerHTML = `<h4>${plEsc(label)} · ${fM(ex.total / 1e6)}</h4>
    <div class="sp-meta">${plEsc(scope.label)} · Management basis · ${plEsc(ex.source.label)}</div>
    ${body}
    ${isLabel ? `<div class="sp-foot">Income Statement “${plEsc(isLabel)}”: ${isAmt == null ? '—' : fM(isAmt / 1e6)} · ${same ? 'same amount (no allocations)' : 'differs by allocations'} <button type="button" class="lock-link" onclick="plCloseSourcePop();boardGoToOrigin('is','${plEsc(isLabel)}')">Open IS</button></div>` : ''}`;
  document.body.appendChild(pop);
  const rect = el.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, rect.left)) + 'px';
  pop.style.top = (rect.bottom + h + 8 > window.innerHeight ? Math.max(8, rect.top - h - 6) : rect.bottom + 6) + 'px';
  setTimeout(() => {
    document.addEventListener('click', plPopOutside, true);
    document.addEventListener('keydown', plPopEsc, true);
  }, 0);
}

/** Jump to where a number comes from: 'is' → Income Statement row, 'pl' → Management P&L row, 'gl' → GL drilldown dept. */
function boardGoToOrigin(target, key) {
  function highlight(selector, match) {
    let tries = 0;
    const timer = setInterval(function () {
      tries++;
      const rows = Array.from(document.querySelectorAll(selector));
      const hit = rows.find(function (tr) { return match(tr); });
      if (hit || tries > 40) {
        clearInterval(timer);
        if (!hit) return;
        hit.classList.add('ts-hl');
        hit.scrollIntoView({ block: 'center', behavior: 'smooth' });
        setTimeout(function () { hit.classList.remove('ts-hl'); }, 2400);
      }
    }, 50);
  }
  if (target === 'is') {
    boardExecNav('threestmt');
    highlight('#tsContent table.ts-tbl tr', function (tr) {
      const td = tr.querySelector('td');
      return td && td.getAttribute('data-is-label') === key;
    });
  } else if (target === 'pl') {
    boardExecNav('pl');
    highlight('#plTbody tr', function (tr) { return tr.dataset.plLabel === key; });
  } else if (target === 'gl') {
    curGLDept = key;
    boardExecNav('pl');
    setTimeout(function () {
      const btn = Array.from(document.querySelectorAll('.snav-btn')).find(function (b) { return (b.getAttribute('onclick') || '').indexOf("'gl'") >= 0; });
      showPLView('gl', btn || null);
    }, 60);
  }
}

function tsSetScenario(sc, btn) {
  window._tsScenario = sc;
  document.querySelectorAll('.ts-sc-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const labels = {
    Combined: typeof boardArrPeriodLabel === 'function' ? boardArrPeriodLabel() : 'Jan–June Actual · Jul–Dec Forecast',
    Actual:   'Jan–'+CLOSE_MO+' '+CLOSE_MONTH.slice(0,4)+' Actuals only',
    Budget:   'Jan–Dec '+CLOSE_MONTH.slice(0,4)+' Full-Year Budget',
  };
  const lbl = document.getElementById('tsScenarioLabel');
  if(lbl) lbl.textContent = labels[sc] || sc;
  tsRender();
}

function boardTsSource() {
  if (window.SMPL_LIVE_OUTLOOK && window.SMPLOutlook && typeof window.SMPLOutlook.getOutlookTsData === "function") {
    var live = window.SMPLOutlook.getOutlookTsData();

function tsGetPeriods(sc) {
  const ts = boardTsSource();
  if(sc === 'Combined') {
    const act = ts.Actual?.periods || ['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'];
    const fc = ts.Forecast?.periods || ['2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'];
    const periods = act.concat(fc);
    return {
      periods,
      isFc: periods.map((_, i) => i >= act.length),
      sources: periods.map((_, i) => (i < act.length ? 'Actual' : 'Forecast')),
    };
  }
  const pd = ts[sc]?.periods || [];
  // Budget = plan, not forecast — isFc false so Bdgt label renders, not Fcst
  const isFcFlag = sc==='Budget' ? false : sc!=='Actual';
  return { periods: pd, isFc: pd.map(()=>isFcFlag), sources: pd.map(()=>sc) };
}

function tsGet(sc, src, period, stmt, key) {
  const ts = boardTsSource();
  const s = src || sc;
  return ts[s]?.[stmt]?.[period]?.[key] ?? null;
}

const tsFmt = (v, d=1) => {
  if(v===null||v===undefined) return '—';
  const d2=Math.min(d,2), abs=Math.abs(v), neg=v<0;
  let s;
  if(abs>=1e6) s='$'+(abs/1e6).toFixed(d2)+'M';

  else s='$'+abs.toFixed(0);
  return neg?'('+s+')':s;
};

  const good = inv ? v<0 : v>0;

function boardWf() {
  const d = (typeof boardWorkforce === 'function' ? boardWorkforce() : null) || {};
  const months = d.months || [];
  const close = d.close_month || CLOSE_MONTH;
  return {
    d, months, close,
    closeIdx: months.indexOf(close),
    labels: months.map(wfMo),
    depts: d.departments || [],
    heads: d.heads || {},
    total: d.heads_total || [],
    payroll: d.payroll || [],
    teams: d.payroll_by_team || {},
    parts: d.payroll_parts || {},
    quota: d.quota || [],
    quotaRamped: d.quota_ramped || [],
    reqs: d.reqs || [],
    ramp: d.ramp || {},
    roster: d.roster || [],
    check: d.payroll_check || {span:null, rows:[]},
    s: d.summary || {},
    loaded: (d.heads_total || []).some(v => v > 0),
  };
}

function wfTab(name, btn) {
  document.querySelectorAll('.wf-tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  _wfTab = name;
  wfBuildTab(name);
}

function wfBuildTab(name) {
  destroyCharts();
  const el = document.getElementById('wfContent');
  if(!el) return;
  const w = boardWf();
  if(!w.months.length) { el.innerHTML = wfEmpty('No workforce data loaded. Load the Employees, Headcount Plan and GL files.'); return; }
  if(name==='overview') wfOverview(el, w);
  else if(name==='bridge') wfBridge(el, w);
  else if(name==='capacity') wfCapacity(el, w);
  else if(name==='payroll') wfPayroll(el, w);
  else if(name==='reqs') wfReqs(el, w);
  else if(name==='roster') wfRoster(el, w);
}

/** Monthly revenue (Actual through close, Forecast after) and ending ARR for the workforce months. */
function wfRevArr(w) {
  const ts = boardTsSource();
  const wf = typeof boardWfTable === 'function' ? boardWfTable() : null;
  return w.months.map((p, i) => {
    const sc = p <= w.close ? 'Actual' : 'Forecast';
    const rev = ts?.[sc]?.is?.[p]?.revenue;
    const arr = wf && wf.Ending ? wf.Ending[i] : null;
    return { rev: rev ?? null, arr: arr ?? null };
  });
}

  for(let i=1;i<n;i++){
    const adds = w.total[i]-w.total[i-1];
    BRIDGE.push({label:`${w.labels[i]} ${adds>=0?'+':''}${adds}`, hc:w.total[i], adds, actual:w.months[i] <= w.close});
  }
  BRIDGE.push({label:`${w.labels[n-1]} end`, hc:w.total[n-1], adds:w.total[n-1], isBase:true});
  const offsets=[],bars=[],colors=[],borders=[];
  BRIDGE.forEach((b,i)=>{
    if(b.isBase){offsets.push(0);bars.push(b.hc);colors.push('#185FA5');borders.push('#185FA5');}
    else{const prior=BRIDGE[i-1].hc;offsets.push(Math.min(prior,b.hc));bars.push(Math.abs(b.adds));
      colors.push(b.actual?'#1D9E75':'#BA7517');borders.push(b.actual?'#0F6E56':'#854F0B');}
  });
  const lo = Math.min(...w.total), hi = Math.max(...w.total);
  const yMin = Math.max(0, Math.floor((lo - Math.max(5,(hi-lo)*0.5))/5)*5), yMax = Math.ceil((hi + Math.max(3,(hi-lo)*0.15))/5)*5;
  const after = w.months.map((p,i)=>i).filter(i=>w.months[i] > w.close);
  const aria = BRIDGE.map(b=>b.isBase?`${b.label} ${b.hc}`:`${b.label}=${b.hc}`).join(', ');
  el.innerHTML = `
  <div class="card" style="margin-bottom:12px">
    <div class="card-title">Headcount bridge — ${w.labels[0]} → ${w.labels[n-1]} ${w.close.slice(0,4)}</div>
    <div class="card-sub">Monthly net change in roster heads &middot; green = actual (Jan–${CLOSE_MO}) &middot; amber = forecast &middot; blue = totals</div>
    <div class="legend">
      <span class="li"><span class="ls" style="background:#185FA5"></span>Start / end total</span>
      <span class="li"><span class="ls" style="background:#1D9E75"></span>Actual net change</span>
      <span class="li"><span class="ls" style="background:#BA7517"></span>Forecast net change</span>
    </div>
    <div class="chart-wrap" style="height:240px"><canvas id="wfBridgeChart" role="img" aria-label="Headcount bridge. ${aria}.">Headcount ${w.total[0]} to ${w.total[n-1]}.</canvas></div>
  </div>
  <div class="two-col">
    <div class="card">
      <div class="card-title">HC adds by department — forecast period</div>
      <div class="card-sub">Monthly net adds after ${CLOSE_MO} · employee roster planned starts</div>
      ${after.length?`<div class="chart-wrap" style="height:180px"><canvas id="wfDeptAdds" role="img" aria-label="Monthly headcount adds by department after close">Department adds after close.</canvas></div>`:'<div class="card-sub">No forecast months after close.</div>'}
    </div>
    <div class="card">
      <div class="card-title">Department mix — ${w.labels[0]} vs ${w.labels[n-1]}</div>
      <div class="card-sub">Start vs end heads by department</div>
      ${w.depts.map((d,i)=>{const a=w.heads[d][0],b=w.heads[d][n-1],delta=b-a;
        return `<div class="var-row"><span class="var-lbl"><span class="ls" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${wfColor(d,i)};margin-right:5px;vertical-align:middle"></span>${d}</span><span class="var-act">${b}</span><span class="var-bud">${a} ${w.labels[0]}</span><span class="var-diff ${delta>0?'pos':delta<0?'neg':'neu'}">${delta>0?'+':''}${delta}</span></div>`;}).join('')}
    </div>
  </div>`;
  setTimeout(()=>{
    charts.wfBridge = boardMkChart(document.getElementById('wfBridgeChart'),{
      type:'bar',data:{labels:BRIDGE.map(b=>b.label),datasets:[
        {data:offsets,backgroundColor:'rgba(0,0,0,0)',borderColor:'rgba(0,0,0,0)',borderWidth:0,stack:'b'},
        {data:bars,backgroundColor:colors,borderColor:borders,borderWidth:1,
          borderRadius:{topLeft:3,topRight:3,bottomLeft:0,bottomRight:0},stack:'b'},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
        tooltip:{filter:item=>item.datasetIndex===1,callbacks:{label:ctx=>{const b=BRIDGE[ctx.dataIndex];return b.isBase?`Total: ${b.hc}`:`${b.adds>=0?'+':''}${b.adds} → ${b.hc}`;}}},
      },scales:{x:{stacked:true,ticks:{font:{size:9},maxRotation:30},grid:{display:false}},
        y:{stacked:true,min:yMin,max:yMax,ticks:{font:{size:9}},grid:{color:'rgba(0,0,0,0.04)'}}}},
      plugins:[{id:'wfVals',afterDatasetsDraw(chart){
        const ctx2=chart.ctx,meta=chart.getDatasetMeta(1);
        ctx2.save();ctx2.textAlign='center';
        meta.data.forEach((bar,i)=>{
          const b=BRIDGE[i];
          ctx2.font='bold 10px system-ui,sans-serif';
          ctx2.fillStyle=b.isBase?'#185FA5':b.actual?'#0F6E56':'#854F0B';
          ctx2.fillText(b.isBase?String(b.hc):`${b.adds>=0?'+':''}${b.adds}`,bar.x,bar.y-4);
        });ctx2.restore();
      }}]
    });
    if(!after.length) return;
    charts.wfDeptAdds = boardMkChart(document.getElementById('wfDeptAdds'),{type:'bar',data:{labels:after.map(i=>w.labels[i]),
      datasets:w.depts.map((d,di)=>({label:d,data:after.map(i=>Math.max(0,w.heads[d][i]-w.heads[d][i-1])),backgroundColor:wfColor(d,di)+'bb',stack:'a',borderWidth:0}))},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{stacked:true,ticks:{font:{size:9}},grid:{display:false}},y:{stacked:true,ticks:{font:{size:9},stepSize:1},grid:{color:'rgba(0,0,0,0.04)'}}}}});
  }, 50);
}

function _salesTerritoryMapColors() {
  const cs = getComputedStyle(document.documentElement);
  const C = k => cs.getPropertyValue(k).trim();
  return {
    cBg: C('--bg') || '#18241b',
    cBg2: C('--bg2') || '#233326',
    cBg3: C('--bg3') || '#3a4d3e',
    cBorder: C('--border') || '#2e3f31',
    cText: C('--text') || '#dde8d6',
    cHighlightStroke: '#5a7a64',
  };
}

function _salesTerritoryPinColor(attPct) {
  const cs = getComputedStyle(document.documentElement);
  const C = k => cs.getPropertyValue(k).trim();
  if (attPct >= 100) return C('--teal') || '#5fa878';
  if (attPct >= 90) return C('--accent') || '#c4855a';
  return C('--red') || '#b8705f';
}

function _salesTerritoryPinData() {
  return ['West', 'Central', 'East', 'EMEA', 'APAC'].map(function(name) {
    const d = SD.regions[name];
    const att = d && d.jun_quota ? (d.jun_attained / d.jun_quota) * 100 : 0;
    const xy = SALES_TERRITORY_PIN_XY[name];
    return {
      name: name,
      x: xy.x,
      y: xy.y,
      reps: d ? d.reps : 0,
      att: att,
      color: _salesTerritoryPinColor(att),
    };
  });
}

function _salesTerritoryApplySkin(svgRoot) {
  const colors = _salesTerritoryMapColors();
  svgRoot.querySelectorAll('path[data-country]').forEach(function(path) {
    const n = path.getAttribute('data-country');
    const highlight = n === 'United States of America' || SALES_TERRITORY_EU_NAMES.has(n) || SALES_TERRITORY_APAC_NAMES.has(n);
    path.setAttribute('fill', highlight ? colors.cBg3 : colors.cBg2);
    path.setAttribute('stroke', highlight ? colors.cHighlightStroke : colors.cBorder);
    path.setAttribute('stroke-width', highlight ? '0.9' : '0.5');
  });
}

function _salesTerritoryRenderPins(svgRoot, pins) {
  const colors = _salesTerritoryMapColors();
  const ns = 'http://www.w3.org/2000/svg';
  svgRoot.querySelectorAll('#territory-pins').forEach(function(node) { node.remove(); });
  const layer = document.createElementNS(ns, 'g');
  layer.setAttribute('id', 'territory-pins');
  pins.forEach(function(p) {
    const r = 14 + p.reps * 2.6;
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')');

    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('r', String(r));
    circle.setAttribute('fill', p.color);
    circle.setAttribute('fill-opacity', '0.92');
    circle.setAttribute('stroke', colors.cText);
    circle.setAttribute('stroke-width', '2.5');
    g.appendChild(circle);

    const count = document.createElementNS(ns, 'text');
    count.setAttribute('text-anchor', 'middle');
    count.setAttribute('dy', '0.35em');
    count.setAttribute('font-size', String(11 + Math.min(p.reps, 8)));
    count.setAttribute('font-weight', '600');
    count.setAttribute('fill', colors.cBg);
    count.textContent = String(p.reps);
    g.appendChild(count);

    const label = document.createElementNS(ns, 'text');
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('y', String(r + 20));
    label.setAttribute('font-size', '14');
    label.setAttribute('font-weight', '600');
    label.setAttribute('fill', colors.cText);
    label.textContent = p.name;
    g.appendChild(label);

    const att = document.createElementNS(ns, 'text');
    att.setAttribute('text-anchor', 'middle');
    att.setAttribute('y', String(r + 38));
    att.setAttribute('font-size', '13');
    att.setAttribute('font-family', 'monospace');
    att.setAttribute('fill', p.color);
    att.textContent = p.att.toFixed(1) + '%';
    g.appendChild(att);

    layer.appendChild(g);
  });
  svgRoot.appendChild(layer);
}

function _salesTerritoryMountBasemap(container, svgText, pins) {
  container.innerHTML = svgText;
  const svg = container.querySelector('svg');
  if (!svg) throw new Error('basemap missing svg root');
  // Keep visual style but zoom out enough to show APAC pin.
  svg.setAttribute('viewBox', '-30 -8 1810 680');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.setAttribute('width', '100%');
  svg.style.display = 'block';
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'US, EMEA, and APAC sales territory map with regional attainment pins');
  _salesTerritoryApplySkin(svg);
  _salesTerritoryRenderPins(svg, pins);
}

function renderSalesTerritoryMap(containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const pins = _salesTerritoryPinData();
  el.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:12px">Loading territory map…</div>';

  function done(svgText) {
    if (!document.getElementById(containerId)) return;
    try {
      _salesTerritoryMountBasemap(el, svgText, pins);
    } catch (err) {
      console.warn('[board] territory map mount failed', err);
      el.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:12px">Territory map unavailable</div>';
    }
  }

  if (_salesTerritoryBasemapCache) {
    done(_salesTerritoryBasemapCache);
    return;
  }

  fetch(SALES_TERRITORY_BASEMAP_URL)
    .then(function(res) {
      if (!res.ok) throw new Error('basemap HTTP ' + res.status);
      return res.text();
    })
    .then(function(svgText) {
      if (!svgText || svgText.indexOf('world-countries') < 0) throw new Error('invalid basemap payload');
      _salesTerritoryBasemapCache = svgText;
      done(svgText);
    })
    .catch(function(err) {
      console.warn('[board] territory basemap fetch failed', err);
      if (!document.getElementById(containerId)) return;
      el.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:12px">Territory map unavailable (basemap could not load)</div>';
    });
}

function boardSalesKpis() {
  const periods = Object.keys(SD.monthly || {}).filter(p => p <= CLOSE_MONTH).sort();
  const sum = key => periods.length && periods.every(p => SD.monthly[p][key] != null)
    ? periods.reduce((t, p) => t + SD.monthly[p][key], 0) : null;
  const close = (SD.monthly || {})[CLOSE_MONTH] || null;
  const pipe = (SD.pipeline || {})[CLOSE_MONTH] || null;
  const comm = (SD.reps || []).filter(r => r.comm != null && isFinite(r.comm));
  const regions = new Set((SD.reps || []).map(r => r.region).filter(Boolean));
  const q = sum('quota'), a = sum('attained');
  return {
    periods, quota: q, attained: a, pct: q && a != null ? a / q : null,
    closePct: close && close.pct != null ? close.pct : null,
    pipeline: pipe && pipe.ending != null ? pipe.ending : null,
    coverage: pipe && pipe.coverage != null ? pipe.coverage : null,
    comm: comm.length ? comm.reduce((t, r) => t + r.comm, 0) : null,
    commReps: comm.length, reps: (SD.reps || []).length, regions: regions.size,
  };
}

    .replace(/1\.\s*PRIMARY DRIVER[^:]*:/gi, '<div class="cp-section">1. Primary Driver + Variance Context</div>')
    .replace(/2\.\s*FINANCIAL AND OPERATIONAL[^:]*:/gi, '<div class="cp-section">2. Financial & Operational Root Cause</div>')
    .replace(/3\.\s*RECOMMENDED ACTION[^:]*:/gi, '<div class="cp-section">3. Recommended Action + Board Summary</div>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');

  // Extract source citations if present
  const srcMatch = out.match(/Source[s]?:([^<]+)/i);
  if(srcMatch) {
    out = out.replace(/Source[s]?:[^<]+/i, `<div class="cp-source">Sources: ${srcMatch[1].trim()}</div>`);
  }
  return out;
}

function applySkin(id) {
  const s = SKINS[id] || SKINS.canvas;
  const r = document.documentElement.style;
  r.setProperty('--bg',           s.bg);
  r.setProperty('--bg2',          s.bg2);
  r.setProperty('--bg3',          s.bg3);
  r.setProperty('--panel',        s.bg2);
  r.setProperty('--text',         s.text);
  r.setProperty('--text2',        s.text2);
  r.setProperty('--text3',        s.text3);
  r.setProperty('--border',       s.border);
  r.setProperty('--border2',      s.border2);
  r.setProperty('--accent',       s.accent);
  r.setProperty('--teal',         s.teal);
  r.setProperty('--red',          s.red);
  r.setProperty('--amber',        s.amber);
  r.setProperty('--navy',         s.bg2);
  r.setProperty('--blue',         s.teal);
  r.setProperty('--green',        s.teal);
  r.setProperty('--gray',         s.text3);
  r.setProperty('--lgray',        s.border);
  r.setProperty('--shadow',       s.shadow);
  r.setProperty('--teal-light',   s.teal + '22');
  r.setProperty('--red-light',    s.red  + '18');
  r.setProperty('--amber-light',  s.amber + '18');
  r.setProperty('--green-light',  s.teal + '18');
  // Persist selection
  localStorage.setItem('smpl-skin', id);
  // Rebuild charts so they pick up new colors
  if (typeof smplBoardRefreshView === 'function') {
    smplBoardRefreshView();
  } else {
    const activeTab = document.querySelector('.nav-btn.active');
    if(activeTab) {
      const tabName = activeTab.getAttribute('onclick')?.match(/show\('(\w+)'/)?.[1];
      if(tabName) { destroyCharts(); scheduleChartBuild(tabName, 30); }
    }
  }
}
