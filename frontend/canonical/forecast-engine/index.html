/**
 * Client packet Monte Carlo — mirrors backend run_packet_monte_carlo so Forecast
 * Generate scenarios works on localhost even when /simulate is unreachable.
 * Stress frequencies under stated priors — not calibrated PoA.
 */
function fcMcPctl(sorted, q) {
  if (!sorted || !sorted.length) return 0;
  if (sorted.length === 1) return sorted[0];
  const idx = q * (sorted.length - 1);
  const lo = Math.floor(idx);
  const hi = Math.ceil(idx);
  if (lo === hi) return sorted[lo];
  const w = idx - lo;
  return sorted[lo] * (1 - w) + sorted[hi] * w;
}
function fcMcMean(vals) {
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
}
function fcMcSd(vals, mu) {
  if (vals.length < 2) return 0;
  return Math.sqrt(vals.reduce((s, v) => s + (v - mu) * (v - mu), 0) / (vals.length - 1));
}
function fcMcHist(samples, bins) {
  bins = bins || 16;
  if (!samples.length) return { bins: [], counts: [], mean: 0, n: 0 };
  let lo = Math.min.apply(null, samples);
  let hi = Math.max.apply(null, samples);
  if (hi <= lo) hi = lo + 1;
  const width = (hi - lo) / bins;
  const counts = Array(bins).fill(0);
  samples.forEach(v => {
    const i = Math.min(bins - 1, Math.floor((v - lo) / width));
    counts[i] += 1;
  });
  const edges = Array.from({ length: bins + 1 }, (_, i) => lo + i * width);
  return { bins: edges, counts, mean: fcMcMean(samples), n: samples.length };
}
/** Mulberry32 seeded RNG — deterministic like Python random.Random(seed) enough for UI. */
function fcMcRng(seed) {
  let t = (seed >>> 0) || 1;
  return function() {
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function fcMcGauss(rand) {
  // Box-Muller
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

const FC_MC_METHOD = 'monte_carlo_packet_lever_identities_open_months';
const FC_DEMO_ORG_ID = '8571e520-0687-4516-bdee-379f37c58c1f';

const FC_PA_BINDING_KEY = 'smpl.forecastEngine.paVersionBinding.v1';

/** FNV-1a over the packet JSON — identifies the exact forecast an assessment describes. */
function fcPaPacketFingerprint(packet){
  const s = JSON.stringify(packet || {});
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return 'fp-' + h.toString(16).padStart(8, '0');
}

function fcSavePaBinding(versionId, packet, orgId){
  try {
    localStorage.setItem(FC_PA_BINDING_KEY, JSON.stringify({
      id: versionId, fp: fcPaPacketFingerprint(packet), orgId: orgId || null,
    }));
  } catch (e) { /* storage unavailable */ }
}

/**
 * Saved forecast version this packet still matches, else null. Assessments are
 * keyed to a version only while the forecast is exactly what was saved.
 */
function forecastVersionBinding(packet, orgId){
  let b = null;
  try { b = JSON.parse(localStorage.getItem(FC_PA_BINDING_KEY) || 'null'); } catch (e) { b = null; }
  if (!b || !b.id || !b.fp) return null;
  if (orgId && b.orgId && b.orgId !== orgId) return null;
  return b.fp === fcPaPacketFingerprint(packet) ? b.id : null;
}

function fcMcNum(packet, key) {
  const v = packet[key];
  if (v == null || v === '') return null;
  const f = Number(v);
  return isFinite(f) ? f : null;
}

function fcMcStats(samples) {
  if (!samples.length) return null;
  const sorted = samples.slice().sort((a, b) => a - b);
  const mu = fcMcMean(samples);
  return {
    hist: fcMcHist(samples),
    mean: mu,
    sd: fcMcSd(samples, mu),
    p10: fcMcPctl(sorted, 0.10),
    p50: fcMcPctl(sorted, 0.50),
    p90: fcMcPctl(sorted, 0.90),
  };
}

function runFcPacketMonteCarlo(packet, opts) {
  opts = opts || {};
  const n = opts.n || 1000;
  const seed = opts.seed != null ? opts.seed : 42;
  const mcLib = window.SMPLPlanMc;
  const sig = mcLib.drawnPriors(opts.priors);
  const has = k => Object.prototype.hasOwnProperty.call(sig, k);
  const priorSource = opts.prior_source || 'not_loaded';
  const rand = fcMcRng(seed);
  const notes = [];
  const undrawn = mcLib.undrawnLabels(sig);
  if (undrawn.length) notes.push(`Not drawn (no fitted prior): ${undrawn.join(', ')} — those shocks are left out.`);
  let corr = mcLib.drawnCorrelations(opts.correlations, sig);
  let lower;
  try {
    lower = mcLib.cholesky(mcLib.correlationMatrix(corr));
  } catch (e) {
    notes.push(`Lever correlations not applied (${e.message}) — levers drawn independently.`);
    corr = {};
    lower = mcLib.cholesky(mcLib.correlationMatrix(corr));
  }
  const corrKeys = Object.keys(corr).filter(k => Math.abs(Number(corr[k])) > 1e-9);

  const rawCash = packet.cashByMonth;
  const planCash = Array.isArray(rawCash) && rawCash.length === 12 && rawCash.every(v => v != null && isFinite(Number(v)))
    ? rawCash.map(Number) : null;
  if (!planCash) notes.push('No 12-month plan cash path in the packet — cash is not simulated.');
  const closeIdx = packet.closeMonthIdx != null ? Math.max(-1, Math.min(11, Math.trunc(Number(packet.closeMonthIdx)))) : -1;
  const openMonths = [];
  for (let m = closeIdx + 1; m < 12; m++) openMonths.push(m);
  const nOpen = openMonths.length;
  const rawProg = packet.programByMonth;
  const program = Array.isArray(rawProg) && rawProg.length === 12 ? rawProg.map(v => (v == null ? null : Number(v))) : null;
  if (!program) notes.push('Program spend by month not loaded — the cost-per-lead shock does not move cash.');
  const openNb = fcMcNum(packet, 'openNb');
  const basePipe = fcMcNum(packet, 'pipelineCoverage');
  if (openNb == null || basePipe == null) notes.push('Open-month new business or pipeline coverage not loaded — the coverage shock does not move ARR.');
  const residSd = fcMcNum(packet, 'cfoPlanErrorSd');
  if (residSd == null) notes.push('Actual-vs-budget monthly cash from operations not loaded — no residual cash noise; the fan is lever shocks only.');
  else notes.push(`Residual cash noise = measured sd of actual minus budget monthly cash from operations ($${(residSd / 1e6).toFixed(2)}M / month).`);
  const decArrPlan = fcMcNum(packet, 'decArr');
  const bop = fcMcNum(packet, 'bopArr');
  const target = fcMcNum(packet, 'targetArr');
  if (decArrPlan == null || bop == null) notes.push('Plan December or January beginning ARR not loaded — ARR is not simulated.');
  else if (target == null) notes.push('No plan ARR target loaded — ARR is simulated but the miss rate is not reported.');
  const salesEnd = fcMcNum(packet, 'salesEnd');
  const aeNeeded = fcMcNum(packet, 'aeNeeded');
  if (salesEnd == null || aeNeeded == null) notes.push('Ending AEs or AE need not sized — AE shortfall is not reported.');
  let endCash = fcMcNum(packet, 'endCash');
  if (endCash == null && planCash) endCash = planCash[11];
  const cashFloor = fcMcNum(packet, 'cashFloor');
  if (cashFloor == null) notes.push('Cash floor not loaded — floor breach and liquidity probabilities are not reported.');
  const arrTol = fcPolicy('arr_miss_tolerance');
  const watchCut = fcPolicy('cash_watch_shortfall');
  const alarmCut = fcPolicy('cash_alarm_shortfall');
  [[arrTol, 'arr_miss_tolerance', 'the ARR miss rate is not reported'],
    [watchCut, 'cash_watch_shortfall', 'the watch-band cash rate is not reported'],
    [alarmCut, 'cash_alarm_shortfall', 'the alarm-band and liquidity rates are not reported']]
    .forEach(([v, key, effect]) => { if (v == null) notes.push(`${fcPolicyNotSet(key)} — ${effect}.`); });

  const pipeMoves = has('pipe') && openNb != null && basePipe != null;
  const arrOn = decArrPlan != null && bop != null && nOpen > 0 && (has('yoyPp') || pipeMoves);
  const aeOn = salesEnd != null && aeNeeded != null && nOpen > 0 && has('attrPp');
  const cashOn = planCash != null && nOpen > 0;
  if (decArrPlan != null && bop != null && nOpen > 0 && !arrOn) notes.push('No ARR lever is drawn — the ARR miss rate is not reported.');
  if (salesEnd != null && aeNeeded != null && nOpen > 0 && !aeOn) notes.push('Sales attrition is not drawn — AE shortfall is not reported.');

  const arrSamples = [];
  const cashSamples = [];
  const troughSamples = [];
  const paths = [];
  let pArr = 0, pCash = 0, pAe = 0, pOps = 0, pTrough = 0, pWatch = 0, pAlarm = 0;

  for (let i = 0; i < n; i++) {
    const e = mcLib.LEVERS.map(() => fcMcGauss(rand));
    const z = {};
    mcLib.LEVERS.forEach((k, r) => {
      let acc = 0;
      for (let c = 0; c <= r; c++) acc += lower[r][c] * e[c];
      z[k] = acc;
    });
    const dy = has('yoyPp') ? z.yoyPp * sig.yoyPp : 0;
    const dcpl = has('cplLog') ? Math.exp(z.cplLog * sig.cplLog) : 1;
    const dattr = has('attrPp') ? z.attrPp * sig.attrPp : 0;
    // Coverage below 1x would mean closing more than the pipeline holds.
    const dpipe = pipeMoves ? Math.max(1, basePipe + z.pipe * sig.pipe) : null;

    const dArrGrowth = arrOn ? bop * dy / 100 * nOpen / 12 : 0;
    const dArrPipe = dpipe ? openNb * (basePipe / dpipe - 1) : 0;
    const dArr = dArrGrowth + dArrPipe;
    if (arrOn) {
      const decArr = decArrPlan + dArr;
      arrSamples.push(decArr);
      if (target != null && arrTol != null && decArr < target * (1 - arrTol)) pArr += 1;
    }

    if (aeOn) {
      const extraExits = Math.max(0, dattr) / 100 * salesEnd * nOpen / 12;
      if (salesEnd - extraExits < aeNeeded) pAe += 1;
    }

    if (!cashOn) continue;
    const path = planCash.slice();
    let shock = 0;
    openMonths.forEach((m, k) => {
      shock += dArr * (k + 1) / nOpen / 12;
      const spend = program ? program[m] : null;
      if (spend != null) shock -= spend * (dcpl - 1);
      if (residSd != null) shock += fcMcGauss(rand) * residSd;
      path[m] = Math.max(0, planCash[m] + shock);
    });
    const trialEnd = path[11];
    const trialTrough = Math.min.apply(null, path.slice(closeIdx + 1));
    cashSamples.push(trialEnd);
    troughSamples.push(trialTrough);
    paths.push(path);

    if (endCash != null && watchCut != null && trialEnd <= endCash * (1 - watchCut)) pWatch += 1;
    if (endCash != null && alarmCut != null && trialEnd <= endCash * (1 - alarmCut)) pAlarm += 1;
    if (cashFloor != null) {
      const drop = (endCash - trialEnd) / Math.max(1, endCash);
      if (trialEnd < cashFloor) pCash += 1;
      if (alarmCut != null && (trialEnd < cashFloor || drop >= alarmCut)) pOps += 1;
      if (trialTrough < cashFloor) pTrough += 1;
    }
  }

  const monthly = [];
  for (let m = 0; m < (paths.length ? 12 : 0); m++) {
    const col = paths.map(p => p[m]).sort((a, b) => a - b);
    monthly.push({
      month_index: m,
      p10: fcMcPctl(col, 0.10),
      p25: fcMcPctl(col, 0.25),
      p50: fcMcPctl(col, 0.50),
      p75: fcMcPctl(col, 0.75),
      p90: fcMcPctl(col, 0.90),
      pBelowFloor: cashFloor != null ? col.filter(v => v < cashFloor).length / n : null,
    });
  }

  const floorOn = cashFloor != null && paths.length > 0;
  const pArrMiss = arrOn && target != null && arrTol != null ? pArr / n : null;
  const pAeShort = aeOn ? pAe / n : null;
  const arr = fcMcStats(arrSamples);
  if (arr) arr.pMiss = pArrMiss;
  const cash = fcMcStats(cashSamples) || {};
  if (cashSamples.length) {
    cash.pBreak = floorOn ? pCash / n : null;
    cash.pWatch = endCash != null && watchCut != null ? pWatch / n : null;
    cash.pAlarm = endCash != null && alarmCut != null ? pAlarm / n : null;
  }
  const trough = fcMcStats(troughSamples);
  if (trough) trough.pBreachAnyMonth = floorOn ? pTrough / n : null;
  const sigOut = { ...sig };

  return {
    n,
    seed,
    sig: sigOut,
    correlations: corr,
    method: FC_MC_METHOD,
    prior_source: priorSource,
    p_arr_miss: pArrMiss,
    p_cash_below_floor: floorOn ? pCash / n : null,
    p_ops_liquidity: floorOn && alarmCut != null ? pOps / n : null,
    p_ae_short: pAeShort,
    p_trough_breach: floorOn ? pTrough / n : null,
    policy: { arr_miss_tolerance: arrTol, cash_watch_shortfall: watchCut, cash_alarm_shortfall: alarmCut },
    arr,
    cash,
    trough,
    cash_path: { monthly, trough },
    method_notes: [
      `Client packet Monte Carlo n=${n}, seed=${seed}, method=${FC_MC_METHOD}.`,
      `Priors source: ${priorSource}.`,
      corrKeys.length
        ? `Correlated levers: ${corrKeys.map(k => `${k} ρ=${(+corr[k]).toFixed(2)}`).join(', ')}.`
        : 'Independent lever draws.',
      'Stress frequency under stated priors — not calibrated Probability of Attainment.',
      'Closed months stay pinned to the plan packet; levers move the open months only.',
      ...notes,
    ],
    simulation_summary: {
      trials: n,
      breaks: [],
      watches: [],
      p_arr_miss: pArrMiss,
      p_cash_below_floor: floorOn ? pCash / n : null,
      p_ops_liquidity: floorOn && alarmCut != null ? pOps / n : null,
      p_ae_short: pAeShort,
      priors: { ...sigOut, source: priorSource, seed, method: FC_MC_METHOD, p_trough_breach: floorOn ? pTrough / n : null },
    },
  };
}

async function fetchForecastMonteCarlo(opts){
  opts = opts || {};
  const packet = opts.packet || buildFcAssurancePacket();
  const n = opts.n || 1000;
  const seed = opts.seed != null ? opts.seed : (window._forecastMcSeed || 42);
  const allowClient = opts.allowClient !== false;
  const serverTimeoutMs = opts.serverTimeoutMs != null ? opts.serverTimeoutMs : 8000;

  const applyResult = (result, methodCard, source) => {
    window._forecastMcSeed = seed;
    window._forecastServerMc = result;
    window._forecastMcMethodCard = methodCard || {
      source: source || 'client_packet_fallback',
      priors: (result && result.sig) || {},
      notes: (result && result.method_notes) || [],
      not_claimed: ['calibrated Probability of Attainment', 'AutoML forecasting'],
    };
    window._forecastMcAt = Date.now();
    window._forecastMcSource = source || 'server';
    window._forecastMcFp = fcPaPacketFingerprint(packet);
    return { result, method_card: window._forecastMcMethodCard, prior_source: source };
  };

  let orgId = opts.orgId;
  if (!orgId && window.SMPLOutlook && window.SMPLOutlook.resolveOrgId) {
    try { orgId = await window.SMPLOutlook.resolveOrgId({ waitForParent: false }); } catch (e) { orgId = null; }
  }
  if (!orgId) orgId = FC_DEMO_ORG_ID;

  try {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), serverTimeoutMs) : null;
    const res = await fetch('/api/v1/predictive-planning/simulate', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({
        plan_ref: {
          organization_id: orgId,
          forecast_version_id: forecastVersionBinding(packet, orgId),
          scenario: 'forecast',
          period_label: packet.period_label,
          budget_year: packet.budget_year,
        },
        packet,
        n_trials: n,
        seed,
        breaks: [],
        watches: [],
      }),
    });
    if (timer) clearTimeout(timer);
    if (res.ok) {
      const data = await res.json();
      return applyResult(data.result || null, data.method_card || null, data.prior_source || 'server');
    }
    console.warn('[forecast-assurance] /simulate failed — client MC fallback', res.status);
  } catch (e) {
    console.warn('[forecast-assurance] /simulate unreachable — client MC fallback', e && e.message);
  }

  if (!allowClient) return null;
  // Yield so progress UI can paint before sync MC work
  await new Promise(r => setTimeout(r, 20));
  const loaded = window.SMPLOutlook && window.SMPLOutlook.getLoadedMcPriors
    ? window.SMPLOutlook.getLoadedMcPriors() : null;
  const result = runFcPacketMonteCarlo(packet, {
    n,
    seed,
    priors: loaded ? loaded.priors : {},
    correlations: loaded ? loaded.correlations : {},
    prior_source: loaded ? `${loaded.prior_source}_from_loaded_outlook` : 'not_loaded',
  });
  return applyResult(result, null, 'client_packet_fallback');
}

function renderFcCorridorSvg(packet, mc){
  const plan = (packet.cashByMonth || []).map(v => Number(v) || 0);
  const monthly = (((mc || {}).cash_path || {}).monthly) || [];
  const floor = packet.cashFloor != null ? Number(packet.cashFloor) : null;
  if (!plan.length) return '<div class="pa-meta">No cash path on packet.</div>';

  const W = 900, H = 260, PL = 48, PR = 16, PT = 16, PB = 36;
  const n = Math.max(plan.length, 12);
  const p10 = [], p50 = [], p90 = [];
  for (let i = 0; i < n; i++) {
    const m = monthly[i] || {};
    p10.push(m.p10 != null ? m.p10 : plan[i]);
    p50.push(m.p50 != null ? m.p50 : plan[i]);
    p90.push(m.p90 != null ? m.p90 : plan[i]);
  }
  const all = plan.concat(p10, p90, floor != null ? [floor] : []);
  let lo = Math.min.apply(null, all.filter(v => v != null));
  let hi = Math.max.apply(null, all.filter(v => v != null));
  if (!(hi > lo)) { lo = lo * 0.9; hi = hi * 1.1 || 1; }
  const pad = (hi - lo) * 0.08;
  lo -= pad; hi += pad;
  const xAt = (i) => PL + (i / Math.max(1, n - 1)) * (W - PL - PR);
  const yAt = (v) => PT + (1 - ((v - lo) / (hi - lo || 1))) * (H - PT - PB);
  const linePath = (arr) => arr.map((v, i) => `${i ? 'L' : 'M'}${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
  const band = p90.map((v, i) => `${i ? 'L' : 'M'}${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ')
    + ' ' + p10.slice().reverse().map((v, j) => {
      const i = n - 1 - j;
      return `L${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`;
    }).join(' ') + ' Z';
  const labels = (typeof MO12 !== 'undefined' ? MO12 : ['J','F','M','A','M','J','J','A','S','O','N','D']).slice(0, n);
  const floorY = floor != null ? yAt(floor) : null;
  let ticks = '';
  labels.forEach((lab, i) => {
    ticks += `<text x="${xAt(i).toFixed(1)}" y="${H - 10}" text-anchor="middle" fill="var(--text3)" font-size="10">${lab}</text>`;
  });
  const hasMc = !!(monthly && monthly.length);
  return `<svg class="pa-corridor-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Forecast cash corridor">
    ${hasMc ? `<path d="${band}" fill="var(--accent)" opacity="0.12"></path>` : ''}
    ${floorY != null ? `<line x1="${PL}" x2="${W - PR}" y1="${floorY.toFixed(1)}" y2="${floorY.toFixed(1)}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="4,3"/>` : ''}
    ${hasMc ? `<path d="${linePath(p50)}" fill="none" stroke="var(--text3)" stroke-width="1.25" stroke-dasharray="3,2"/>` : ''}
    <path d="${linePath(plan)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    ${ticks}
    <text x="${W - PR}" y="${floorY != null ? Math.max(PT + 10, floorY - 4).toFixed(1) : PT + 10}" text-anchor="end" fill="var(--red)" font-size="10">${floor != null ? 'floor ' + fM(floor, 1) : 'no cash floor loaded'}</text>
  </svg>`;
}

/* Forecast Plan Assurance · lane 3 predictive suite (Budget craft parity, packet shocks).
   Plain JS globals — spliced into forecast-engine/index.html. Do not redefine fM/fV/fcPctLbl/MO12/
   buildFcAssurancePacket/fetchForecastMonteCarlo/curTab/renderAnalytics. */

const FC_PA_CHIP_ORDER = [
  'top_deal_slip', 'commit_slip', 'renewal_miss', 'nb_attain_soft',
  'exp_stall', 'churn_wave', 'late_book_miss', 'pipe_cover_thin',
];

/** Plan risk policy value (onboarding 7.43–7.58); null when the company has not set it. */
function fcPolicy(key) {
  return window.SMPLOutlook && window.SMPLOutlook.getRiskPolicyValue ? window.SMPLOutlook.getRiskPolicyValue(key) : null;
}
function fcPolicyNotSet(key) {
  return window.SMPLOutlook && window.SMPLOutlook.riskPolicyNotSet ? window.SMPLOutlook.riskPolicyNotSet(key) : 'Risk policy not set';
}
function fcPolicyPct(v) {
  return v == null ? 'not set' : Number((v * 100).toFixed(2)) + '%';
}
function fcPolicyAmt(v) {
  if (v == null) return 'not set';
  return v >= 1e6 ? '$' + Number((v / 1e6).toFixed(2)) + 'M' : '$' + Number((v / 1e3).toFixed(0)) + 'K';
}
/** Management levers from the risk policy (7.53 program cut, 7.54 DSO days) as short labels. */
function fcPolicyLeversTxt() {
  const cut = fcPolicy('program_cut');
  const dso = fcPolicy('dso_improvement_days');
  return {
    program: cut != null ? `Program spend −${fcPolicyPct(cut)}` : `Program cut — ${fcPolicyNotSet('program_cut')}`,
    dso: dso != null ? `DSO −${dso} days` : `DSO — ${fcPolicyNotSet('dso_improvement_days')}`,
  };
}
/** "Risk policy not set (onboarding 7.xx)" for each of these keys with no value; '' when all are set. */
function fcPolicyGaps(keys) {
  return keys.filter(k => fcPolicy(k) == null).map(fcPolicyNotSet).join(' · ');
}

function fcEsc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
}

function fcClonePacket(p) {
  try { return JSON.parse(JSON.stringify(p || {})); }
  catch (e) { return Object.assign({}, p || {}); }
}

function fcFmtDeal$(n) {
  const v = Number(n) || 0;
  if (Math.abs(v) >= 1e6) return '$' + (v / 1e6).toFixed(2) + 'M';
  if (Math.abs(v) >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'k';
  return '$' + v.toFixed(0);
}

function fcMoLbl(p) {
  const i = parseInt(String(p).slice(5), 10) - 1;
  return MO12[i] || String(p);
}

/** Open-month opportunity + renewal book — the Forecast SoT for PA scenarios. */
function fcCollectOpenDeals() {
  const close = getCloseMonth();
  const periods = FC_P.slice();
  const oppTypes = ['New Business', 'Expansion', 'Reactivation', 'Contraction', 'Churn'];
  const deals = [];
  const byPeriod = {};
  let wtdNb = 0, wtdExp = 0, wtdReact = 0, wtdCont = 0, wtdChurn = 0;
  let renGross = 0, renWtd = 0, renCount = 0;

  periods.forEach(p => {
    byPeriod[p] = { nb: 0, exp: 0, ren: 0, deals: [] };
    const opps = (typeof SRC !== 'undefined' && SRC.opp_pipeline && SRC.opp_pipeline[p]) || {};
    oppTypes.forEach(typ => {
      const bucket = opps[typ] || {};
      const w = Number(bucket.weighted) || 0;
      if (typ === 'New Business') { wtdNb += w; byPeriod[p].nb += w; }
      else if (typ === 'Expansion') { wtdExp += w; byPeriod[p].exp += w; }
      else if (typ === 'Reactivation') wtdReact += w;
      else if (typ === 'Contraction') wtdCont += w;
      else if (typ === 'Churn') wtdChurn += w;
      (bucket.deals || []).forEach(d => {
        const arr = Number(d.arr) || 0;
        const prob = d.prob != null && !isNaN(Number(d.prob)) ? Number(d.prob) : null;
        const weighted = d.weighted != null && !isNaN(Number(d.weighted)) ? Number(d.weighted)
          : (prob != null ? arr * (prob / 100) : null);
        // Risk $ = ARR we still need to win (or stop losing) — high ARR + low win prob.
        const loseRisk = typ === 'Churn' || typ === 'Contraction'
          ? (weighted != null ? weighted : 0)
          : (weighted != null ? Math.max(0, arr - weighted) : 0);
        const row = {
          period: p, periodLbl: fcMoLbl(p), type: typ,
          customer: d.customer || 'Deal', stage: d.stage || '',
          segment: d.segment || '', channel: d.channel || '',
          arr, prob, weighted, loseRisk,
          kind: 'opp',
        };
        deals.push(row);
        byPeriod[p].deals.push(row);
      });
    });
    const ren = (typeof SRC !== 'undefined' && SRC.renewals && SRC.renewals[p]) || {};
    renGross += Number(ren.arr) || 0;
    renWtd += Number(ren.weighted) || 0;
    renCount += Number(ren.count) || 0;
    byPeriod[p].ren = Number(ren.weighted) || 0;
    (ren.deals || []).forEach(d => {
      const arr = Number(d.arr) || 0;
      const prob = d.prob != null && !isNaN(Number(d.prob)) ? Number(d.prob) : null;
      const riskScore = d.risk != null && !isNaN(Number(d.risk)) ? Number(d.risk) : null;
      const health = d.health != null && !isNaN(Number(d.health)) ? Number(d.health) : null;
      const weighted = prob != null ? arr * (prob / 100) : null;
      const row = {
        period: p, periodLbl: fcMoLbl(p), type: 'Renewal',
        customer: d.customer || 'Renewal', stage: d.stage || 'Renewal',
        segment: '', channel: d.csm || '',
        arr, prob, weighted, loseRisk: weighted != null ? Math.max(0, arr - weighted) : 0,
        riskScore, health, kind: 'renewal',
      };
      deals.push(row);
      byPeriod[p].deals.push(row);
    });
  });

  const topByArr = deals.slice().sort((a, b) => b.arr - a.arr).slice(0, 8);
  // Win-path risk for scenario chips: NB/Exp/Renewal still to convert — not churn events.
  const topLoseRisk = deals
    .filter(d => d.type === 'New Business' || d.type === 'Expansion' || d.kind === 'renewal')
    .sort((a, b) => b.loseRisk - a.loseRisk).slice(0, 8);
  const topChurnRisk = deals
    .filter(d => d.type === 'Churn' || d.type === 'Contraction')
    .sort((a, b) => b.loseRisk - a.loseRisk).slice(0, 5);
  const commitSlip = deals.filter(d => /commit|negotiation|proposal/i.test(d.stage || '') && d.kind === 'opp' && (d.type === 'New Business' || d.type === 'Expansion'))
    .sort((a, b) => b.weighted - a.weighted).slice(0, 6);
  const peakPeriod = periods.slice().sort((a, b) => {
    const sa = (byPeriod[a].nb || 0) + (byPeriod[a].exp || 0);
    const sb = (byPeriod[b].nb || 0) + (byPeriod[b].exp || 0);
    return sb - sa;
  })[0] || periods[0];

  return {
    periods,
    close,
    deals,
    byPeriod,
    wtdNb, wtdExp, wtdReact, wtdCont, wtdChurn,
    renGross, renWtd, renCount,
    renRate: renGross > 0 ? renWtd / renGross : null,
    topByArr,
    topLoseRisk,
    topChurnRisk,
    commitSlip,
    peakPeriod,
    peakLbl: peakPeriod ? fcMoLbl(peakPeriod) : '',
    peakPipe: peakPeriod ? ((byPeriod[peakPeriod].nb || 0) + (byPeriod[peakPeriod].exp || 0)) : 0,
    openWtdPipe: wtdNb + wtdExp + wtdReact,
  };
}

function fcHorizonCtx(packet) {
  const ctx = fcCollectOpenDeals();
  ctx.packet = packet || {};
  ctx.coverX = packet && packet.pipelineCoverage != null ? Number(packet.pipelineCoverage) : null;
  ctx.decArr = Number((packet && packet.decArr) || 0);
  ctx.endCash = Number((packet && packet.endCash) || 0);
  return ctx;
}

function fcPathStats(cashByMonth) {
  const path = (cashByMonth || []).map(v => Number(v) || 0);
  let minCash = null, minIdx = 0;
  for (let i = 0; i < path.length; i++) {
    if (minCash == null || path[i] < minCash) { minCash = path[i]; minIdx = i; }
  }
  const endCash = path.length ? path[path.length - 1] : null;
  const mo = (typeof MO12 !== 'undefined' ? MO12 : null);
  return {
    endCash,
    minCash,
    minCashPeriod: mo && mo[minIdx] != null ? mo[minIdx] : String(minIdx + 1),
    cashByMonth: path,
  };
}

function fcMergeShock(base, fields) {
  const s = fcClonePacket(base);
  Object.keys(fields || {}).forEach(k => { s[k] = fields[k]; });
  if (fields && fields.cashByMonth) {
    const st = fcPathStats(fields.cashByMonth);
    if (fields.endCash == null) s.endCash = st.endCash;
    if (fields.minCash == null) s.minCash = st.minCash;
    if (fields.minCashPeriod == null) s.minCashPeriod = st.minCashPeriod;
  }
  return s;
}

/**
 * ARR → P&L and cash on the Forecast's own rules: subscription revenue moves by ΔARR ÷ 12 from the booking
 * month, recurring services at the loaded % of subscription, COGS at the COGS lever (loaded ratio when unset),
 * receivables at the DSO lever (Net 30 when not loaded), payables at the DPO lever (paid in the month when not loaded).
 */
function fcStressConversion() {
  const fcIs = FC_P.map(getOutlookIS).filter(Boolean);
  const rev = fcIs.reduce((s, r) => s + (Number(r.revenue) || 0), 0);
  const cogs = fcIs.reduce((s, r) => s + (Number(r.cogs) || 0), 0);
  const lv = getLevers();
  const cogsRatio = lv.cogs != null ? lv.cogs : (rev > 0 && fcIs.some(r => r.cogs != null) ? cogs / rev : null);
  return { cogsRatio, dso: fcWcState.dso, dpo: fcWcState.dpo };
}

/**
 * Shock the packet with ARR that does not land: misses = [{ period, arr, kind: 'nb'|'exp'|'react'|'churn' }],
 * each removing `arr` of ending ARR from its period onward. Returns null when the COGS ratio is not loaded.
 */
function fcShockFromArrMiss(base, misses, opts) {
  opts = opts || {};
  const conv = fcStressConversion();
  if (conv.cogsRatio == null) return null;
  const lv = getLevers();
  const counted = (m) => Math.max(0, Number(m.arr) || 0) * (m.kind === 'nb' ? lv.nb : m.kind === 'exp' ? lv.exp : 1);
  misses = (misses || []).map(m => Object.assign({}, m, { arr: counted(m) }));
  const src = (base.cashByMonth || []).map(v => Number(v) || 0);
  const lost = ALL_P.map(p => misses.reduce((s, m) => s + (m.period <= p ? m.arr : 0), 0));
  let cumGp = 0, ebitdaHit = 0;
  const path = src.map((v, i) => {
    const sub = lost[i] / 12;
    const rev = sub * (1 + fcRecSvcPct(ALL_P[i]));
    const cogs = rev * conv.cogsRatio;
    cumGp += rev - cogs;
    ebitdaHit += rev - cogs;
    const arRelease = conv.dso != null ? rev * conv.dso / 30 : rev;
    const apRelease = conv.dpo != null ? cogs * conv.dpo / 30 : 0;
    return v - cumGp + arRelease - apRelease;
  });
  const st = fcPathStats(path);
  const total = misses.reduce((s, m) => s + m.arr, 0);
  const byKind = (k) => misses.filter(m => m.kind === k).reduce((s, m) => s + m.arr, 0);
  const decArr = base.decArr != null ? Number(base.decArr) - total : null;
  return {
    decArr,
    endCash: st.endCash,
    minCash: st.minCash,
    minCashPeriod: st.minCashPeriod,
    cashByMonth: path,
    fyEbitda: base.fyEbitda != null ? Number(base.fyEbitda) - ebitdaHit : null,
    fyMkt: base.fyMkt != null ? Number(base.fyMkt) : null,
    yoyGrowthPct: base.yoyGrowthPct != null ? Number(base.yoyGrowthPct) : null,
    pipelineCoverage: opts.pipe != null ? opts.pipe : (base.pipelineCoverage != null ? Number(base.pipelineCoverage) : null),
    fyNn: decArr != null && base.bopArr != null ? decArr - Number(base.bopArr) : null,
    fyNb: base.fyNb != null ? Number(base.fyNb) - byKind('nb') : null,
    fyChurn: base.fyChurn != null ? Number(base.fyChurn) + byKind('churn') : null,
    evidence: opts.evidence || null,
  };
}

/** Closed-month history that sizes the stress cases and trip-wires (SMPLOutlook.measureHistory); null fields read "not computed". */
function fcMeasuredHistory() {
  const close = getCloseMonth();
  const live = !!(window.SMPLOutlook && typeof window.SMPLOutlook.isLiveOutlook === 'function'
    && window.SMPLOutlook.isLiveOutlook());
  const months = [];
  Object.keys(SRC.actuals || {}).sort().forEach(p => {
    if (p > close) return;
    const w = live && ALL_P.includes(p) ? getWarehouseARR(p) : null;
    const a = w || SRC.actuals[p] || {};
    const bop = Number(a.arr_bop);
    if (!(bop > 0) || a.arr_nb == null) return;
    const churn = a.arr_churn != null ? a.arr_churn : a.arr_nr_churn;
    const nb = Number(a.arr_nb) || 0;
    const exp = Number(a.arr_exp) || 0;
    const out = Math.abs(Number(churn) || 0) + Math.abs(Number(a.arr_cont) || 0);
    months.push({ p, bop, nb, exp, out, nn: nb + exp + (Number(a.arr_react) || 0) - out });
  });
  return window.SMPLOutlook.measureHistory(months, SRC.pipeline_book);
}

function fcSharePct(share) {
  return share == null ? null : (share * 100).toFixed(share < 0.1 ? 1 : 0) + '%';
}

function fcDealKind(type) {
  return type === 'New Business' ? 'nb' : type === 'Expansion' ? 'exp' : type === 'Reactivation' ? 'react' : 'churn';
}

/**
 * Forecast-native stress cases — built from this horizon's opp_pipeline + renewals. Each case removes ARR the
 * Forecast counts (probability-weighted) in the month it would book; a case with no loaded book is not built.
 * Severities are the named stresses on the chips.
 */
function buildFcScenarioCaseDefs(packet) {
  if (fcStressConversion().cogsRatio == null) return [];
  const ctx = fcHorizonCtx(packet);
  const top2 = ctx.topLoseRisk.slice(0, 3);
  const topRisk = top2[0];
  const asMiss = (d) => ({ period: d.period, arr: d.weighted, kind: d.kind === 'renewal' ? 'churn' : fcDealKind(d.type) });
  const sum = (ms) => ms.reduce((s, m) => s + (m.arr || 0), 0);
  const byPeriod = (field, share, kind) => ctx.periods.map(p => ({ period: p, arr: (ctx.byPeriod[p][field] || 0) * share, kind }));

  const topMisses = top2.filter(d => d.weighted != null).map(asMiss);
  const commitMisses = ctx.commitSlip.slice(0, 4).filter(d => d.weighted != null).map(asMiss);
  const renMisses = ctx.renRate != null
    ? ctx.deals.filter(d => d.kind === 'renewal' && d.prob != null && d.prob / 100 < ctx.renRate && d.weighted != null).map(asMiss)
    : [];
  const hist = fcMeasuredHistory();
  const histTxt = hist.span ? ' (worst closed quarter, ' + hist.span + ')' : '';
  const nbMisses = hist.nbShare ? byPeriod('nb', hist.nbShare, 'nb') : [];
  const expMisses = hist.expShare ? byPeriod('exp', hist.expShare, 'exp') : [];
  const churnMisses = ctx.deals
    .filter(d => (d.type === 'Churn' || d.type === 'Contraction') && d.weighted != null && d.arr > d.weighted)
    .map(d => ({ period: d.period, arr: d.arr - d.weighted, kind: 'churn' }));
  const peakMisses = ctx.peakPeriod && hist.peakShare
    ? [{ period: ctx.peakPeriod, arr: (ctx.byPeriod[ctx.peakPeriod].nb || 0) * hist.peakShare, kind: 'nb' },
      { period: ctx.peakPeriod, arr: (ctx.byPeriod[ctx.peakPeriod].exp || 0) * hist.peakShare, kind: 'exp' }]
    : [];
  const coverNow = ctx.coverX;
  const coverShare = coverNow != null && coverNow > 0 && hist.coverShare ? Math.min(1, hist.coverShare) : null;
  const coverMisses = coverShare != null ? byPeriod('nb', coverShare, 'nb') : [];

  const nameTop = topRisk
    ? (topRisk.customer.length > 28 ? topRisk.customer.slice(0, 26) + '…' : topRisk.customer)
    : '';

  return [
    sum(topMisses) > 0 && {
      id: 'top_deal_slip', family: 'pipeline',
      chipPlain: (topRisk.kind === 'renewal' ? 'Renewal at risk: ' : 'Miss ') + nameTop,
      chipTech: 'Top unconverted NB/Exp/Renewal weighted ARR',
      label: (topRisk.kind === 'renewal' ? 'Renewal at risk: ' : 'Miss ') + nameTop,
      plain: nameTop + ' (' + topRisk.type + ', ' + topRisk.periodLbl + (topRisk.prob != null ? ', ' + topRisk.prob + '% win' : '') +
        ') is the biggest unconverted ARR still in the open book. Stack the next-riskiest win-path deals and Dec ARR moves.',
      apply: (base) => fcShockFromArrMiss(base, topMisses, { evidence: { deals: top2, kind: 'top_lose_risk' } }),
    },
    sum(commitMisses) > 0 && {
      id: 'commit_slip', family: 'pipeline',
      chipPlain: 'Commit / late-stage slips',
      chipTech: 'Commit+Negotiation+Proposal weighted miss',
      label: 'Commit / late-stage slips',
      plain: 'Late-stage book (' + ctx.commitSlip.slice(0, 2).map(d => d.customer.split(' ')[0]).join(', ') +
        '…) looks won in the forecast — if stage slips, weighted ARR of ' + fcFmtDeal$(sum(commitMisses)) + ' does not land.',
      apply: (base) => fcShockFromArrMiss(base, commitMisses, { evidence: { deals: ctx.commitSlip.slice(0, 4), kind: 'commit' } }),
    },
    sum(renMisses) > 0 && {
      id: 'renewal_miss', family: 'retention',
      chipPlain: 'Renewal book softens',
      chipTech: 'Below-book-rate renewals do not renew',
      label: 'Renewal book softens',
      plain: 'Open-month renewals are ' + fcFmtDeal$(ctx.renGross) + ' gross / ' + fcFmtDeal$(ctx.renWtd) + ' weighted (' +
        (ctx.renRate * 100).toFixed(0) + '%). If every renewal below that rate walks, ' + fcFmtDeal$(sum(renMisses)) + ' of weighted ARR goes.',
      apply: (base) => fcShockFromArrMiss(base, renMisses, { evidence: { renGross: ctx.renGross, renWtd: ctx.renWtd, renRate: ctx.renRate } }),
    },
    sum(nbMisses) > 0 && {
      id: 'nb_attain_soft', family: 'pipeline',
      chipPlain: 'NB attainment −' + fcSharePct(hist.nbShare),
      chipTech: 'Weighted NB pipeline −' + fcSharePct(hist.nbShare) + ' by month (worst closed-quarter win rate vs average)',
      label: 'NB attainment −' + fcSharePct(hist.nbShare),
      plain: 'New-business weighted pipeline in open months is ' + fcFmtDeal$(ctx.wtdNb) +
        '. The worst closed quarter won ' + fcSharePct(hist.nbShare) + ' less of its decided pipeline than average' + histTxt +
        '; at that rate this much of the weighted book does not land.',
      apply: (base) => fcShockFromArrMiss(base, nbMisses, { evidence: { wtdNb: ctx.wtdNb, lever: 1 - hist.nbShare, span: hist.span } }),
    },
    sum(expMisses) > 0 && {
      id: 'exp_stall', family: 'pipeline',
      chipPlain: 'Expansion stalls',
      chipTech: 'Weighted expansion pipeline −' + fcSharePct(hist.expShare) + ' by month (worst closed-quarter expansion rate vs average)',
      label: 'Expansion stalls',
      plain: 'Expansion weighted book is ' + fcFmtDeal$(ctx.wtdExp) +
        ' across open months. The slowest closed quarter expanded ' + fcSharePct(hist.expShare) + ' less of its base than average' +
        histTxt + '; CS-led upsell slowing that much shows up in Dec ARR before the P&L fully feels it.',
      apply: (base) => fcShockFromArrMiss(base, expMisses, { evidence: { wtdExp: ctx.wtdExp, share: hist.expShare, span: hist.span } }),
    },
    sum(churnMisses) > 0 && {
      id: 'churn_wave', family: 'retention',
      chipPlain: 'Churn / contraction lands',
      chipTech: 'Open churn+contraction deals close in full',
      label: 'Churn / contraction lands',
      plain: 'Open churn/contraction weighted risk is about ' + fcFmtDeal$(ctx.wtdChurn + ctx.wtdCont) +
        '. If every one of those deals closes against us, ' + fcFmtDeal$(sum(churnMisses)) + ' more ARR goes and GRR and cash both move.',
      apply: (base) => fcShockFromArrMiss(base, churnMisses, { evidence: { wtdChurn: ctx.wtdChurn, wtdCont: ctx.wtdCont } }),
    },
    sum(peakMisses) > 0 && {
      id: 'late_book_miss', family: 'pipeline',
      chipPlain: ctx.peakLbl + ' book misses',
      chipTech: 'Peak open-month weighted NB+Exp −' + fcSharePct(hist.peakShare) + ' (worst closed month vs its trailing three)',
      label: ctx.peakLbl + ' book misses',
      plain: ctx.peakLbl + ' carries ' + fcFmtDeal$(ctx.peakPipe) +
        ' of weighted NB+Expansion — the heaviest single month in the remainder of the year. The worst closed month booked ' +
        fcSharePct(hist.peakShare) + ' less new business than the three months before it.',
      apply: (base) => fcShockFromArrMiss(base, peakMisses, { evidence: { peakPeriod: ctx.peakPeriod, peakPipe: ctx.peakPipe, share: hist.peakShare } }),
    },
    sum(coverMisses) > 0 && {
      id: 'pipe_cover_thin', family: 'pipeline',
      chipPlain: 'Coverage thins',
      chipTech: 'Pipeline cover −' + fcSharePct(coverShare) + ' vs ' + coverNow.toFixed(1) + '× (worst closed quarter vs average)',
      label: 'Coverage thins',
      plain: 'Horizon coverage is about ' + coverNow.toFixed(1) +
        '× on weighted open pipe of ' + fcFmtDeal$(ctx.openWtdPipe) +
        '. The thinnest closed quarter opened with ' + fcSharePct(coverShare) + ' less pipeline per dollar won than average' +
        histTxt + '; that takes the same share of weighted NB with it.',
      apply: (base) => fcShockFromArrMiss(base, coverMisses, {
        pipe: coverNow * (1 - coverShare),
        evidence: { coverFrom: coverNow, coverTo: coverNow * (1 - coverShare), span: hist.span },
      }),
    },
  ].filter(Boolean);
}

function fcClassifyScenarioOutcome(base, shock) {
  const breaks = [];
  const watches = [];
  const baseCash = Math.max(1, Number(base.endCash) || 1);
  const dCash = (Number(shock.endCash) || 0) - (Number(base.endCash) || 0);
  const cashDropPct = -dCash / baseCash; // positive = cash down vs plan
  const dArr = (Number(shock.decArr) || 0) - (Number(base.decArr) || 0);
  const dEbitda = (Number(shock.fyEbitda) || 0) - (Number(base.fyEbitda) || 0);
  const floor = base.cashFloor != null ? Number(base.cashFloor) : null;
  const impact$ = Math.max(Math.abs(dCash), Math.abs(dArr), Math.abs(dEbitda));
  const alarmCut = fcPolicy('cash_alarm_shortfall');
  const caseCashWatch = fcPolicy('case_cash_watch');
  const watch$ = fcPolicy('case_watch_amount');
  const break$ = fcPolicy('case_break_amount');
  const material = watch$ != null && impact$ >= watch$;

  if (floor != null && (Number(shock.endCash) || 0) < floor) {
    breaks.push('Dec cash floor');
  } else if (floor != null && shock.minCash != null && Number(shock.minCash) < floor) {
    watches.push('Mid-year cash trough vs floor');
  }
  if (alarmCut != null && cashDropPct >= alarmCut) {
    breaks.push(`Cash down ≥${fcPolicyPct(alarmCut)} vs plan`);
  }

  // Material $ bands from the risk policy — not every small ARR miss is a watch.
  if (break$ != null && impact$ >= break$) {
    if (Math.abs(dCash) >= break$) breaks.push(`Dec cash move ≥${fcPolicyAmt(break$)}`);
    else if (Math.abs(dArr) >= break$) breaks.push(`Dec ARR move ≥${fcPolicyAmt(break$)}`);
    else breaks.push(`FY EBITDA move ≥${fcPolicyAmt(break$)}`);
  } else if (material || (caseCashWatch != null && cashDropPct >= caseCashWatch)) {
    if (watch$ != null && Math.abs(dCash) >= watch$) watches.push(`Dec cash move ≥${fcPolicyAmt(watch$)}`);
    else if (watch$ != null && Math.abs(dArr) >= watch$) watches.push(`Dec ARR move ≥${fcPolicyAmt(watch$)}`);
    else if (watch$ != null && Math.abs(dEbitda) >= watch$) watches.push(`FY EBITDA move ≥${fcPolicyAmt(watch$)}`);
    else watches.push(`Cash down ≥${fcPolicyPct(caseCashWatch)} vs plan`);
  }

  if (shock.salesEnd != null && shock.aeNeeded != null && shock.salesEnd < shock.aeNeeded) breaks.push('NB AE cover');
  if (shock.csEnd != null && shock.csNeeded != null && shock.csEnd < shock.csNeeded) breaks.push('CS cover');
  if ((Number(shock.fyEbitda) || 0) < 0 && (Number(base.fyEbitda) || 0) >= 0 && material) {
    watches.push('EBITDA turns negative');
  }
  // Pipeline cover alone is a watch only when the $ impact already clears the bar.
  if (material &&
      shock.pipelineCoverage != null && base.pipelineMin != null &&
      Number(shock.pipelineCoverage) + 1e-9 < Number(base.pipelineMin)) {
    watches.push('Pipeline cover vs min');
  }

  let status = 'ok';
  if (breaks.length) status = 'break';
  else if (watches.length) status = 'watch';
  return { status, breaks, watches, cashDropPct, dCash, dArr, dEbitda, impact$ };
}

function fcExplainScenarioCase(base, c, def) {
  const bits = [];
  if (def && def.plain) bits.push(def.plain);
  if (c.yoyGrowthPct != null && base.yoyGrowthPct != null &&
      Math.abs(c.yoyGrowthPct - base.yoyGrowthPct) >= 0.05) {
    const d = c.yoyGrowthPct - base.yoyGrowthPct;
    bits.push(
      `YoY ending-ARR growth moves from ${Number(base.yoyGrowthPct).toFixed(1)}% to ${Number(c.yoyGrowthPct).toFixed(1)}% ` +
      `(${d > 0 ? '+' : ''}${d.toFixed(1)} percentage points — not a −5% cut to revenue).`
    );
  }
  if (Math.abs(c.dArr || 0) >= 1000) {
    bits.push(`Dec ARR ${fM(base.decArr, 1)} → ${fM(c.decArr, 1)} (${fV(c.dArr)} vs plan).`);
  }
  if (Math.abs(c.dCash || 0) >= 1000) {
    const vsFloor = base.cashFloor != null ? (c.endCash || 0) - base.cashFloor : null;
    const dropPct = base.endCash > 0 ? (base.endCash - c.endCash) / base.endCash : 0;
    bits.push(
      `Dec cash ${fM(base.endCash, 1)} → ${fM(c.endCash, 1)} (${fV(c.dCash)}, ${(dropPct * 100).toFixed(0)}% vs plan); ` +
      (vsFloor == null ? 'no cash floor loaded'
        : `${vsFloor >= 0 ? fM(vsFloor, 1) + ' above' : fM(Math.abs(vsFloor), 1) + ' below'} the ${fM(base.cashFloor, 1)} floor`) +
      (c.minCash < c.endCash ? `; trough ${fM(c.minCash, 1)}` : '') + '.'
    );
  }
  if (Math.abs(c.dMkt || 0) >= 1000) {
    bits.push(`Marketing program spend ${fM(c.fyMkt - c.dMkt, 1)} → ${fM(c.fyMkt, 1)} (${fV(c.dMkt)}).`);
  }
  if (Math.abs(c.dEbitda || 0) >= 1000) {
    bits.push(`FY EBITDA ${fM(c.fyEbitda - c.dEbitda, 1)} → ${fM(c.fyEbitda, 1)} (${fV(c.dEbitda)}).`);
  }
  if (c.breaks && c.breaks.length) bits.push(`Flags: ${c.breaks.join('; ')}.`);
  else if (c.watches && c.watches.length) bits.push(`Watch: ${c.watches.join('; ')}.`);
  return bits.join(' ');
}

function evaluateFcScenarioShock(def, base) {
  const fields = def.apply(base) || {};
  const shock = fcMergeShock(base, fields);
  const cls = fcClassifyScenarioOutcome(base, shock);
  const row = {
    id: def.id,
    label: def.label,
    family: def.family,
    status: cls.status,
    breaks: cls.breaks,
    watches: cls.watches,
    cashDropPct: cls.cashDropPct,
    decArr: shock.decArr,
    dArr: (shock.decArr || 0) - (base.decArr || 0),
    endCash: shock.endCash,
    dCash: (shock.endCash || 0) - (base.endCash || 0),
    minCash: shock.minCash,
    cashByMonth: (shock.cashByMonth || []).slice(),
    cashPathM: (shock.cashByMonth || []).map(v => Number(v || 0) / 1e6),
    fyEbitda: shock.fyEbitda,
    dEbitda: (shock.fyEbitda || 0) - (base.fyEbitda || 0),
    fyMkt: shock.fyMkt,
    dMkt: (shock.fyMkt || 0) - (base.fyMkt || 0),
    yoyGrowthPct: shock.yoyGrowthPct,
    pipelineCoverage: shock.pipelineCoverage,
    fyNn: shock.fyNn,
    fyNb: shock.fyNb,
    fyChurn: shock.fyChurn,
    chipPlain: def.chipPlain || def.label,
    chipTech: def.chipTech || def.label,
    evidence: shock.evidence || null,
    xp: def.plain || '',
    plain: def.plain || '',
  };
  row.explain = fcExplainScenarioCase(base, row, def);
  return row;
}

function buildFcScenarioNarrativeFromSuite(suite) {
  const cases = (suite && suite.cases) || [];
  const base = (suite && suite.base) || {};
  const ctx = fcCollectOpenDeals();
  const lines = [];
  const top = ctx.topLoseRisk[0];
  lines.push(
    'This Forecast stress run uses the open-month opportunity pipeline and renewal book ' +
    '(not Budget growth/CPL levers). Weighted open NB+Exp is ' + fcFmtDeal$(ctx.openWtdPipe) +
    '; renewals ' + fcFmtDeal$(ctx.renGross) + ' gross / ' + fcFmtDeal$(ctx.renWtd) + ' weighted.'
  );
  if (top) {
    lines.push(
      'Highest single miss on the board: ' + top.customer + ' — ' + top.type + ' in ' + top.periodLbl +
      ', ' + fcFmtDeal$(top.arr) + ' ARR' + (top.prob != null ? ' at ' + top.prob + '% win' : '') + ' (risk $ ' + fcFmtDeal$(top.loseRisk) + ').'
    );
  }
  if (ctx.peakPeriod) {
    lines.push(
      'Heaviest remaining month: ' + ctx.peakLbl + ' with ' + fcFmtDeal$(ctx.peakPipe) + ' weighted NB+Expansion.'
    );
  }
  const breaks = cases.filter(c => c.status === 'break');
  const watches = cases.filter(c => c.status === 'watch');
  if (breaks.length) {
    lines.push('Break cases (' + breaks.length + '): ' + breaks.map(c => (c.chipPlain || c.label) +
      ((c.breaks || []).length ? ' (' + c.breaks.join(', ') + ')' : '')).join('; ') + '.');
  } else if (watches.length) {
    lines.push('No floor breaks. Watch cases: ' + watches.map(c => c.chipPlain || c.label).join('; ') + '.');
  } else {
    lines.push('Named pipeline/renewal shocks stayed inside cash rails on this plan path.');
  }
  const ranked = cases.slice().sort((a, b) => Math.abs(b.dCash || 0) - Math.abs(a.dCash || 0)).slice(0, 3);
  if (ranked.length) {
    lines.push(
      'Largest cash movers: ' +
      ranked.map(c => (c.chipPlain || c.label) + ' ' +
        ((c.dCash || 0) >= 0 ? '+' : '') + ((c.dCash || 0) / 1e6).toFixed(1) + 'M').join(', ') + '.'
    );
  }
  if (suite.mc) {
    const mc = suite.mc;
    const pArr = mc.arr && mc.arr.pMiss != null ? mc.arr.pMiss : mc.p_arr_miss;
    const pCash = mc.cash && mc.cash.pBreak != null ? mc.cash.pBreak : mc.p_cash_below_floor;
    lines.push(
      'Monte Carlo (' + ((mc.n || 0).toLocaleString()) + ' draws) under Forecast priors: P(ARR miss) ' +
      fcPctTxt(pArr, 1) + ', P(cash < floor) ' + fcPctTxt(pCash, 1) +
      '. Stress frequency — not calibrated PoA.'
    );
  }
  lines.push('Cases are diagnostic on the live Forecast packet — nothing is written into the operating forecast.');
  return lines.join('\n\n');
}

function fcNormalizeMc(mc) {
  if (!mc) return null;
  const out = Object.assign({}, mc);
  out.arr = out.arr || {};
  out.cash = out.cash || {};
  if (out.arr.pMiss == null && out.p_arr_miss != null) out.arr.pMiss = out.p_arr_miss;
  if (out.cash.pBreak == null && out.p_cash_below_floor != null) out.cash.pBreak = out.p_cash_below_floor;
  if (out.pOpsRisk == null) out.pOpsRisk = out.p_ops_liquidity != null ? out.p_ops_liquidity : null;
  return out;
}


function fcCaseSeverityRank(c) {
  if (!c) return 9;
  if (c.status === 'break') return 0;
  if (c.status === 'watch') return 1;
  return 2;
}
/** Same $ impact the status bands read: the largest of |Δ cash|, |Δ ARR|, |Δ EBITDA|. */
function fcCaseImpactScore(c) {
  return Math.max(
    Math.abs(c.dCash || 0),
    Math.abs(c.dArr || 0),
    Math.abs(c.dEbitda || 0)
  );
}
/** Worst → best: breaks, then watches by |impact|, then holds. */
function fcSortCasesWorstFirst(cases) {
  return (cases || []).slice().sort((a, b) => {
    const rd = fcCaseSeverityRank(a) - fcCaseSeverityRank(b);
    if (rd) return rd;
    const sa = fcCaseImpactScore(a);
    const sb = fcCaseImpactScore(b);
    if (Math.abs(sb - sa) > 1) return sb - sa;
    // Within similar impact, more negative cash first
    return (a.dCash || 0) - (b.dCash || 0);
  });
}

async function runFcScenarioStressSuite(opts) {
  opts = opts || {};
  const onProgress = opts.onProgress;
  const base = opts.packet || (typeof buildFcAssurancePacket === 'function' ? buildFcAssurancePacket() : {});
  const defs = buildFcScenarioCaseDefs(base);
  const cases = [];
  if (onProgress) onProgress('cases', 0, defs.length);
  for (let i = 0; i < defs.length; i++) {
    cases.push(evaluateFcScenarioShock(defs[i], base));
    if (onProgress) onProgress('cases', i + 1, defs.length);
    await new Promise(r => setTimeout(r, 0));
  }
  let mc = null;
  if (opts.monteCarlo !== false && typeof fetchForecastMonteCarlo === 'function') {
    if (onProgress) onProgress('mc', 0, opts.mcN || 1000);
    const data = await fetchForecastMonteCarlo({ packet: base, n: opts.mcN || 1000 });
    mc = fcNormalizeMc(data && data.result);
    if (onProgress) onProgress('mc', opts.mcN || 1000, opts.mcN || 1000);
  } else if (window._forecastServerMc) {
    mc = fcNormalizeMc(window._forecastServerMc);
  }
  const suite = {
    at: Date.now(),
    surface: 'forecast',
    base: {
      decArr: base.decArr,
      targetArr: base.targetArr,
      endCash: base.endCash,
      cashFloor: base.cashFloor,
      fyEbitda: base.fyEbitda,
      fyMkt: base.fyMkt,
      yoyGrowthPct: base.yoyGrowthPct,
      pipelineCoverage: base.pipelineCoverage,
      cashByMonth: (base.cashByMonth || []).slice(),
    },
    cases: fcSortCasesWorstFirst(cases),
    mc,
  };
  suite.narrative = buildFcScenarioNarrativeFromSuite(suite);
  window._forecastScenarioSuite = suite;
  window._forecastScenarioNarrative = suite.narrative;
  if (mc) {
    window._forecastServerMc = mc;
    window._forecastMcAt = suite.at;
  }
  return suite;
}

/** Share of trials clearing every rail this run measured; null when none was measured. */
function fcMcHoldShare(mc) {
  if (!mc) return null;
  const parts = [
    (mc.arr && mc.arr.pMiss != null) ? mc.arr.pMiss : mc.p_arr_miss,
    (mc.cash && mc.cash.pBreak != null) ? mc.cash.pBreak : mc.p_cash_below_floor,
    mc.pOpsRisk != null ? mc.pOpsRisk : mc.p_ops_liquidity,
    mc.cash ? mc.cash.pWatch : null,
  ].filter(v => v != null);
  return parts.length ? Math.max(0, 1 - Math.max.apply(null, parts)) : null;
}

function fcPaAnalyticsVerdict(suite, packet) {
  if (!suite || !suite.mc) {
    return {
      sev: 'watch',
      big: 'Run scenarios to stress this forecast.',
      small: 'Named packet shocks + Monte Carlo populate likelihoods, the corridor fan, and stress chips.',
    };
  }
  const mc = suite.mc;
  const breakN = (suite.cases || []).filter(c => c.status === 'break').length;
  const pWatchRaw = mc.cash && mc.cash.pWatch != null ? mc.cash.pWatch : null;
  const pArrRaw = (mc.arr && mc.arr.pMiss != null) ? mc.arr.pMiss : mc.p_arr_miss;
  const pCashRaw = (mc.cash && mc.cash.pBreak != null) ? mc.cash.pBreak : mc.p_cash_below_floor;
  const pHold = fcMcHoldShare(mc);
  const sev = fcPolicySeverity(breakN, pCashRaw, pWatchRaw, pArrRaw);
  const gaps = fcPolicyGaps(FC_SEVERITY_POLICY);
  const cplCase = (suite.cases || []).find(c => /cpl|lead|paid/i.test(c.label || '') || /cpl|ops_cash/i.test(c.id || ''));
  const lean = cplCase && (cplCase.status === 'break' || cplCase.status === 'watch')
    ? 'what it costs to buy demand'
    : 'a few named lever shocks';
  return {
    sev,
    big: sev === 'hold'
      ? 'The forecast holds under stated priors — still watch the levers that swing cash.'
      : `The forecast works, but it leans on ${lean}.`,
    small: (pHold != null ? `In about ${(pHold * 100).toFixed(0)}% of tested years the main rails hold. ` : 'No rail could be tested on this run. ') +
      `P(cash ≥${fcPolicyPct(fcPolicy('cash_watch_shortfall'))} below plan) ${fcPctTxt(pWatchRaw, 0)} · P(cash under floor) ${fcPctTxt(pCashRaw, 0)} · P(ARR miss) ${fcPctTxt(pArrRaw, 0)}` +
      (breakN ? ` · ${breakN} named case${breakN === 1 ? '' : 's'} break` : '') +
      `. Dec cash plan ${fM(packet.endCash, 1)} vs floor ${fcFloorTxt(packet)}.` +
      (gaps ? ` ${gaps}.` : ''),
  };
}

/** Risk policy keys the Healthy / Watch / Break verdict reads. */
const FC_SEVERITY_POLICY = ['named_breaks_for_break', 'p_floor_break', 'p_cash_watch_break',
  'p_floor_watch', 'p_cash_watch_watch', 'p_arr_miss_watch'];

/**
 * Break when named breaks reach the policy count or a break probability is reached; watch on any named
 * break or a watch probability. A cutoff the company has not set is not tested; a rate this run did not
 * measure (null) is not tested either.
 */
function fcPolicySeverity(breakN, pCash, pWatch, pArr) {
  const at = (p, key) => p != null && fcPolicy(key) != null && p >= fcPolicy(key);
  const nBreak = fcPolicy('named_breaks_for_break');
  if ((nBreak != null && breakN >= nBreak) || at(pCash, 'p_floor_break') || at(pWatch, 'p_cash_watch_break')) return 'break';
  if (breakN >= 1 || at(pCash, 'p_floor_watch') || at(pWatch, 'p_cash_watch_watch') || at(pArr, 'p_arr_miss_watch')) return 'watch';
  return 'hold';
}

function renderFcScenarioTable(suite) {
  if (!suite || !suite.cases) {
    return '<div class="pa-meta">Generate scenarios to run named stress cases.</div>';
  }
  const breakN = suite.cases.filter(c => c.status === 'break').length;
  const watchN = suite.cases.filter(c => c.status === 'watch').length;
  const okN = suite.cases.filter(c => c.status === 'ok').length;
  const rows = suite.cases.map(c => {
    const cls = c.status === 'break' ? 'break' : c.status === 'watch' ? 'watch' : 'ok';
    const why = ((c.breaks && c.breaks.length) ? c.breaks : (c.watches || [])).slice(0, 2).join(', ') || '—';
    return `<tr class="${cls}"><td><div style="font-weight:500;color:var(--text)">${fcEsc(c.label)}</div>` +
      `<div style="font-size:9.5px;color:var(--text3);line-height:1.35;margin-top:3px">${fcEsc(c.explain)}</div></td>` +
      `<td class="num">${fV(c.dArr)}</td><td class="num">${fV(c.dCash)}</td><td class="num">${fV(c.dEbitda)}</td>` +
      `<td><span class="assure-sc-chip ${c.status === 'ok' ? 'ok' : c.status}">${fcEsc(c.status === 'ok' ? 'hold' : c.status)}</span>` +
      `<div style="font-size:9.5px;color:var(--text3);margin-top:3px">${fcEsc(why)}</div></td></tr>`;
  }).join('');
  return `
    <div style="margin-bottom:6px">
      <span class="assure-sc-chip break">${breakN} break</span>
      <span class="assure-sc-chip watch">${watchN} watch</span>
      <span class="assure-sc-chip ok">${okN} hold</span>
      ${suite.mc ? `<span style="font-size:10px;color:var(--text3);margin-left:6px">MC n=${(suite.mc.n || 0).toLocaleString()}</span>` : ''}
    </div>
    <div style="overflow:auto">
      <table class="assure-sc-table">
        <thead><tr><th>Case &amp; plain-English read</th><th class="num">Δ ARR</th><th class="num">Δ Cash</th><th class="num">Δ EBITDA</th><th>Result</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

/** Plan path less the policy watch / alarm shortfalls; a band the company has not set is null. */
function fcCashRailsM(planM, floorM) {
  const watchCut = fcPolicy('cash_watch_shortfall');
  const alarmCut = fcPolicy('cash_alarm_shortfall');
  return {
    plan: planM,
    floor: floorM,
    watchCut,
    alarmCut,
    watch: watchCut != null ? planM.map(v => +(v * (1 - watchCut)).toFixed(2)) : null,
    alarm: alarmCut != null ? planM.map(v => +(v * (1 - alarmCut)).toFixed(2)) : null,
  };
}


function fcCashToM(v) {
  if (v == null || isNaN(Number(v))) return null;
  const n = Number(v);
  // Dollars (≥ ~$1k) → $M; already-$M stay as-is.
  return Math.abs(n) >= 1000 ? n / 1e6 : n;
}

/** Resolve the corridor fan + display P(cash in the policy watch band) so readouts match the chart. */
function fcResolveCorridorBands(packet, suite) {
  const planFull$ = (packet.cashByMonth || []).map(v => Number(v) || 0);
  const planFull = planFull$.map(v => v / 1e6);
  const floor = packet.cashFloor != null ? Number(packet.cashFloor) / 1e6 : null;
  const empty = { ok: false, planFull, floor, plan: [], p10: null, p25: null, p75: null, p90: null, usedMcPath: false, pWatch: null, i0: 0, n: 0, last: 0, horizon: 'fc', closeIdx: CLOSE_MO_IDX };
  if (!planFull.length) return empty;

  const horizon = window._fcPaCashHorizon === 'fy' ? 'fy' : 'fc';
  const closeIdx = CLOSE_MO_IDX;
  const i0 = horizon === 'fc' ? Math.min(closeIdx + 1, planFull.length - 1) : 0;
  const n = planFull.length - i0;
  const last = n - 1;
  const plan = planFull.slice(i0);
  const mc = suite && suite.mc;
  const monthlyFull = (((mc || {}).cash_path || {}).monthly) || (((mc || {}).cashPath || {}).monthly) || [];

  let p10 = null, p25 = null, p75 = null, p90 = null;
  if (monthlyFull.length >= planFull.length) {
    const col = (k) => {
      const out = [];
      for (let j = 0; j < n; j++) {
        const v = fcCashToM((monthlyFull[i0 + j] || {})[k]);
        if (v == null) return null;
        out.push(v);
      }
      return out;
    };
    p10 = col('p10'); p90 = col('p90');
    if (!p10 || !p90) { p10 = null; p90 = null; }
    else {
      p25 = col('p25'); p75 = col('p75');
      if (!p25 || !p75) { p25 = null; p75 = null; }
    }
  }
  const usedMcPath = !!p10;
  const pWatch = mc && mc.cash && mc.cash.pWatch != null ? Number(mc.cash.pWatch) : null;

  return {
    ok: true, planFull, floor, plan, p10, p25, p75, p90,
    usedMcPath, pWatch, i0, n, last, horizon, closeIdx,
  };
}

function renderFcPredictiveCorridor(packet, suite, selectedIdx) {
  const bands = fcResolveCorridorBands(packet, suite);
  if (!bands.ok) return '<div class="pa-meta">No cash path on packet.</div>';
  const { planFull, floor, plan, p10, p25, p75, p90, usedMcPath, pWatch, i0, n, last, horizon, closeIdx } = bands;
  const monthsAll = (typeof MO12 !== 'undefined' ? MO12 : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']);
  const months = monthsAll.slice(i0);
  const mc = suite && suite.mc;
  window._fcPaCorridorMeta = { usedMcPath, pWatch };

  const rails = fcCashRailsM(plan, floor);
  const W = 900, H = 320, PL = 52, PR = 168, PT = 18, PB = 30;
  const ymax = Math.max((floor || 0) * 1.5, Math.max.apply(null, plan.concat(p90 || [], rails.watch || [])) * 1.08, 1);
  const denom = Math.max(1, n - 1);
  const xs = (j) => PL + j * (W - PL - PR) / denom;
  const ys = (v) => PT + (1 - v / ymax) * (H - PT - PB);
  const pts = (a) => a.map((v, j) => `${xs(j)},${ys(v)}`).join(' ');
  const band = (lo, hi) => {
    const top = hi.map((v, j) => `${xs(j)},${ys(v)}`).join('L');
    const bot = lo.slice().reverse().map((v, j) => `${xs(n - 1 - j)},${ys(v)}`).join('L');
    return `M${top}L${bot}Z`;
  };

  const cs = getComputedStyle(document.documentElement);
  const teal = (cs.getPropertyValue('--teal').trim() || cs.getPropertyValue('--accent').trim() || '#5fa878');
  const red = cs.getPropertyValue('--red').trim() || '#b8705f';
  const amber = cs.getPropertyValue('--amber').trim() || '#b89060';
  const muted = cs.getPropertyValue('--text3').trim() || '#72826a';
  const border = cs.getPropertyValue('--border').trim() || '#2e3f31';

  let g = '';
  const tickStep = ymax > 80 ? 20 : 10;
  for (let v = 0; v <= ymax * 1.01; v += tickStep) {
    g += `<line x1="${PL}" y1="${ys(v)}" x2="${W - PR}" y2="${ys(v)}" stroke="${border}" stroke-width="1"/>`;
    g += `<text x="${PL - 8}" y="${ys(v) + 4}" fill="${muted}" font-size="12" text-anchor="end">$${v}M</text>`;
  }
  if (p10 && p90) g += `<path d="${band(p10, p90)}" fill="${teal}" fill-opacity="0.17"/>`;
  if (p25 && p75) g += `<path d="${band(p25, p75)}" fill="${teal}" fill-opacity="0.42"/>`;
  if (rails.watch) {
    g += `<polyline points="${pts(rails.watch)}" fill="none" stroke="${amber}" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.9"/>`;
    g += `<text x="${PL + 6}" y="${ys(rails.watch[0]) - 6}" fill="${amber}" font-size="11">${fcPolicyPct(rails.watchCut)} below plan</text>`;
  }
  if (rails.alarm) {
    g += `<polyline points="${pts(rails.alarm)}" fill="none" stroke="${red}" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.75"/>`;
    g += `<text x="${PL + 6}" y="${ys(rails.alarm[0]) - 6}" fill="${red}" font-size="11">${fcPolicyPct(rails.alarmCut)} below plan</text>`;
  }
  const railGaps = fcPolicyGaps(['cash_watch_shortfall', 'cash_alarm_shortfall']);
  if (railGaps) g += `<text x="${PL + 8}" y="${H - PB - 8}" fill="${muted}" font-size="11">${fcEsc(railGaps)} — rail not drawn</text>`;
  if (floor != null) {
    const fy = ys(floor);
    g += `<line x1="${PL}" y1="${fy}" x2="${W - PR}" y2="${fy}" stroke="${red}" stroke-width="2.2" stroke-dasharray="7 5"/>`;
    g += `<text x="${W - PR}" y="${fy - 8}" fill="${red}" font-size="12" text-anchor="end">Cash floor $${floor.toFixed(1)}M</text>`;
  } else {
    g += `<text x="${W - PR}" y="${PT + 12}" fill="${red}" font-size="12" text-anchor="end">No cash floor loaded</text>`;
  }
  g += `<polyline points="${pts(plan)}" fill="none" stroke="${teal}" stroke-width="2.5" stroke-linejoin="round"/>`;
  g += `<circle cx="${xs(last)}" cy="${ys(plan[last])}" r="4" fill="${teal}"/>`;
  g += `<text x="${xs(last) + 10}" y="${ys(plan[last]) + 4}" fill="${teal}" font-size="12">Plan Dec $${plan[last].toFixed(1)}M</text>`;
  g += `<polyline id="fcPaCaseLine" points="" fill="none" stroke="none" stroke-width="2.5" stroke-linejoin="round"/>`;
  g += `<g id="fcPaCaseMark"></g><g id="fcPaCaseEoy"></g>`;
  months.forEach((m, j) => {
    g += `<text x="${xs(j)}" y="${H - 8}" fill="${muted}" font-size="12" text-anchor="middle">${m}</text>`;
  });
  if (!usedMcPath) {
    g += `<text x="${PL + 8}" y="${PT + 12}" fill="${muted}" font-size="11">${mc ? 'No monthly cash percentiles on this Monte Carlo run — no fan drawn' : 'No likelihood fan yet — Generate scenarios to draw Monte Carlo bands'}</text>`;
  }
  if (horizon === 'fc' && i0 > 0) {
    g += `<text x="${PL + 8}" y="${PT + (usedMcPath && mc ? 12 : 26)}" fill="${muted}" font-size="11">Open months only · actuals through ${monthsAll[closeIdx]}</text>`;
  }

  window._fcPaCorridor = { plan, planFull, floor, rails, ymax, W, H, PL, PR, PT, PB, xs, ys, i0, n, last, labels: months, horizon, p10, p90 };
  const sel = selectedIdx != null ? selectedIdx : window._fcPaCaseSel;
  if (sel != null) setTimeout(() => { try { selectFcPaCase(sel, true); } catch (e) { /* */ } }, 0);

  return `<svg id="fcPaCorridorSvg" class="pa-corridor-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Forecast cash corridor">${g}</svg>`;
}

function renderFcLeverLedger(suite, mode) {
  const modeKey = mode === 'tech' ? 'tech' : 'plain';
  const cases = (suite && suite.cases) || [];
  if (!cases.length) return '<div style="color:var(--text3);font-size:12px">Generate scenarios to rank levers.</div>';
  const watch$ = fcPolicy('case_watch_amount');
  const caseCash = fcPolicyPct(fcPolicy('case_cash_watch'));
  // Worst → best by multi-metric impact (cash / ARR / EBITDA).
  const levers = cases.slice().sort((a, b) => {
    const ia = Math.max(Math.abs(a.dCash || 0), Math.abs(a.dArr || 0), Math.abs(a.dEbitda || 0));
    const ib = Math.max(Math.abs(b.dCash || 0), Math.abs(b.dArr || 0), Math.abs(b.dEbitda || 0));
    if (Math.abs(ib - ia) > 1) return ib - ia;
    return (a.dCash || 0) - (b.dCash || 0);
  }).map(c => {
    const dn = Math.min(0, (c.dCash || 0) / 1e6);
    const up = (c.dCash || 0) > 0 ? c.dCash / 1e6 : null;
    const impactM = Math.max(
      Math.abs(c.dCash || 0),
      Math.abs(c.dArr || 0),
      Math.abs(c.dEbitda || 0)
    ) / 1e6;
    // Watch these = break + watch, or a downside at the policy watch amount; Stop worrying = hold below it.
    let tier = 'flat';
    if (c.status === 'break' || c.status === 'watch' || (up == null && watch$ != null && impactM * 1e6 >= watch$)) tier = 'break';
    else if (up != null) tier = 'up';
    return {
      plain: c.chipPlain || c.label,
      tech: c.chipTech || c.label,
      mp: c.plain || c.explain || '',
      mt: ((c.breaks || []).concat(c.watches || [])).slice(0, 2).join(', ') || c.id,
      dn, up, tier, impactM,
      status: c.status,
    };
  });
  const maxSwing = Math.max(0.1, ...levers.map(l => Math.max(Math.abs(l.dn || 0), Math.abs(l.up || 0))));
  const ledger = `<div class="pa-ledger-head">
      <div>Lever</div>
      <div style="text-align:center">${modeKey === 'tech' ? 'Δ Dec cash' : 'Worse ← plan → better'}</div>
      <div style="text-align:right">Cash swing</div>
    </div>
    <div class="pa-lever-ledger">${levers.map(l => {
      const name = modeKey === 'tech' ? l.tech : l.plain;
      const meta = modeKey === 'tech' ? l.mt : l.mp;
      const dnPct = Math.min(50, Math.abs(l.dn || 0) / maxSwing * 50);
      const upPct = Math.min(50, Math.abs(l.up || 0) / maxSwing * 50);
      return `<div class="pa-lrow"><div class="pa-lname">${fcEsc(name)}
        <span class="meta">${fcEsc(meta)}</span></div>
        <div class="pa-ltrack"><div class="pa-laxis"></div>
        ${dnPct ? `<div class="pa-lbar dn" style="width:${dnPct}%"></div>` : ''}
        ${upPct ? `<div class="pa-lbar up" style="width:${upPct}%"></div>` : ''}
        </div><div class="pa-lval"><b>${(l.dn || 0).toFixed(1)}M</b> / ${l.up != null ? '+' + l.up.toFixed(1) + 'M' : '—'}</div></div>`;
    }).join('')}</div>`;

  const by = (t) => levers.filter(l => l.tier === t);
  const watchItems = by('break').slice(0, 4);
  const nWatch = watchItems.length;
  const watchWord = nWatch === 4 ? ' four' : nWatch === 3 ? ' three' : nWatch === 2 ? ' two' : '';
  const G = [
    { c: 'g-break', h: { plain: 'Watch these' + watchWord, tech: 'Load-bearing levers' },
      s: { plain: 'These cases breach or trip a watch rail in the stress run. They deserve a named owner and a monthly read.',
        tech: 'Downside Δ Dec cash / ARR / EBITDA dominates the break and watch set.' },
      items: watchItems,
      val: (l) => `−$${Math.abs(l.dn).toFixed(1)}M at risk` },
    { c: 'g-up', h: { plain: 'Pull these to get ahead', tech: 'Upside levers' },
      s: { plain: 'These cases raise Dec cash in the stress run. If we need to buy room, this is where to look first.',
        tech: 'Cases with positive Δ Dec cash in the live suite.' },
      items: by('up'),
      val: (l) => `+$${l.up.toFixed(1)}M upside` },
    { c: 'g-flat', h: { plain: 'Stop worrying about these', tech: 'Immaterial levers' },
      s: { plain: watch$ != null
          ? `Worth less than ${fcPolicyAmt(watch$)} either way. Whatever we decide here, the year lands the same.`
          : `Cases that hold every band. ${fcPolicyNotSet('case_watch_amount')}.`,
        tech: `Total swing below the ${fcPolicyAmt(watch$)} / ${caseCash} watch bar (risk policy).` },
      items: by('flat'),
      val: (l) => `±$${Math.max(Math.abs(l.dn), l.up || 0).toFixed(1)}M` },
  ];
  const groups = `<div class="pa-groups">${G.map(g => {
    if (!g.items.length) return '';
    return `<div class="pa-group ${g.c}"><h4>${g.h[modeKey]}</h4><p class="gs">${g.s[modeKey]}</p>
      <ul>${g.items.map(l => {
        const liCls = (g.c === 'g-break' && l.status === 'watch') ? ' class="watch"' : '';
        return `<li${liCls}><span>${fcEsc(modeKey === 'tech' ? l.tech : l.plain)}</span><span>${g.val(l)}</span></li>`;
      }).join('')}</ul></div>`;
  }).join('')}</div>`;
  return ledger + groups;
}

/** Program spend the GTM plan still runs in the open months, $. */
function fcOpenProgramSpend() {
  return FC_P.reduce((s, p) => s + Number(fcGtmAllocate(p).spendTot), 0);

function buildFcTheRead(packet, suite, mode) {
  const modeKey = mode === 'tech' ? 'tech' : 'plain';
  const ctx = fcHorizonCtx(packet);
  const plan$ = (packet.cashByMonth || []).map(v => Number(v) || 0);
  const closeIdx = packet.closeMonthIdx != null ? Number(packet.closeMonthIdx) : CLOSE_MO_IDX;
  const open0 = plan$[Math.min(closeIdx + 1, plan$.length - 1)] || plan$[0] || 0;
  const dec = (plan$[11] != null ? plan$[11] : Number(packet.endCash) || 0) / 1e6;
  const open0M = open0 / 1e6;
  const floor = packet.cashFloor != null ? Number(packet.cashFloor) / 1e6 : null;
  const watchCut = fcPolicy('cash_watch_shortfall');
  const alarmCut = fcPolicy('cash_alarm_shortfall');
  const railTxt = (cut, key) => cut != null
    ? `−${fcPolicyPct(cut)} = $${(dec * cut).toFixed(1)}M`
    : fcPolicyNotSet(key);
  const mc = suite && suite.mc;
  const breakN = suite ? suite.cases.filter(c => c.status === 'break').length : 0;
  const pCash = mc ? fcPctTxt((mc.cash && mc.cash.pBreak) != null ? mc.cash.pBreak : mc.p_cash_below_floor, 0).replace('%', '') : '—';
  const pWatchNum = mc && mc.cash && mc.cash.pWatch != null ? mc.cash.pWatch : null;
  const pWatch = pWatchNum != null ? (pWatchNum * 100).toFixed(0) : '—';
  const pArr = mc ? fcPctTxt((mc.arr && mc.arr.pMiss) != null ? mc.arr.pMiss : mc.p_arr_miss, 1).replace('%', '') : '—';
  const pHoldShare = fcMcHoldShare(mc);
  const pHold = pHoldShare != null ? (pHoldShare * 100).toFixed(0) : '—';
  const narr = (window._forecastScenarioNarrative || (suite && suite.narrative) || '').trim();
  const top = ctx.topLoseRisk[0];
  const topDealLine = top
    ? (top.customer + ' · ' + top.type + ' · ' + top.periodLbl + ' · ' + fcFmtDeal$(top.arr) + (top.prob != null ? ' at ' + top.prob + '%' : ''))
    : 'No open deals loaded';

  if (modeKey === 'tech') {
    return [
      ['Forecast book',
        'Open-month weighted NB ' + fcFmtDeal$(ctx.wtdNb) + ' · Exp ' + fcFmtDeal$(ctx.wtdExp) +
        ' · Renewals ' + fcFmtDeal$(ctx.renWtd) + ' / ' + fcFmtDeal$(ctx.renGross) +
        ' · Cover ' + (ctx.coverX != null ? ctx.coverX.toFixed(2) + '×' : 'not loaded') + '. Peak month ' + (ctx.peakLbl || '—') + ' ' + fcFmtDeal$(ctx.peakPipe) + '.'],
      ['Plan cash',
        'Open path ' + fM(open0, 1) + ' → Dec ' + fM(dec * 1e6, 1) + ' vs floor ' + fcFloorTxt(packet) +
        '. Rails ' + railTxt(watchCut, 'cash_watch_shortfall') + ' · ' + railTxt(alarmCut, 'cash_alarm_shortfall') + '.'],
      ['Top miss', topDealLine],
      ['Distribution',
        mc
          ? ('MC n=' + ((mc.n || 0).toLocaleString()) + ': P(cash ≤' + fcPolicyPct(watchCut != null ? 1 - watchCut : null) + ' plan) ' + pWatch + '%, P(floor) ' + pCash +
            '%, P(ARR miss) ' + pArr + '%. Named breaks: ' + breakN + '. Shocks are pipeline/renewal packet moves.')
          : 'Generate scenarios for MC frequencies and deal-linked shocks.'],
      ['Response', narr ? fcEsc(narr).slice(0, 900) : 'Offsets scale to this forecast cushion; concurrent deal slips share one cushion.'],
    ];
  }
  const sections = [
    ['What this forecast is built from',
      'Remainder-of-year ARR comes from <b>weighted open pipeline</b> (' + fcFmtDeal$(ctx.openWtdPipe) +
      ' NB+Exp) and ' + (ctx.renRate != null
        ? 'the <b>renewal book</b> (' + fcFmtDeal$(ctx.renGross) + ' gross, ' + (ctx.renRate * 100).toFixed(0) + '% weighted)'
        : 'no renewal book (not loaded)') + '. Cash rides the CFS from about <b>$' +
      open0M.toFixed(1) + 'M</b> after close to <b>$' + dec.toFixed(1) + 'M</b> in Dec (floor <b>' +
      fcFloorTxt(packet) + '</b>).'],
    ['Where the risk sits in the book',
      top
        ? ('Biggest miss on the board is <b>' + fcEsc(top.customer) + '</b> — ' + top.type + ' in ' +
          top.periodLbl + ', ' + fcFmtDeal$(top.arr) + (top.prob != null ? ' at ' + top.prob + '% win' : '') +
          '. Heaviest month still open: <b>' + (ctx.peakLbl || '—') + '</b> (' +
          fcFmtDeal$(ctx.peakPipe) + ' weighted).')
        : 'Generate with live SRC.opp_pipeline / renewals to rank deals by period.'],
    ['What the stress run says',
      mc
        ? ('About <b>' + pHold + '%</b> of tested years hold the main rails. Cash falls hard in roughly <b>' +
          pWatch + '%</b> of draws; floor breach ~<b>' + pCash + '%</b>. <b>' + breakN +
          '</b> named deal/pipeline scenario' + (breakN === 1 ? '' : 's') + ' break.')
        : 'Generate scenarios to shock this horizon’s deals, renewals, and coverage — not Budget lead-cost cases.'],
    ['What to watch',
      'Trip-wires that match this engine: late-stage win rate, NB attainment vs weighted pipe, ' +
      (ctx.renRate != null ? 'renewal rate vs ' + (ctx.renRate * 100).toFixed(0) + '%' : 'renewal rate (renewal book not loaded)') + ', and coverage staying near ' + (ctx.coverX != null ? ctx.coverX.toFixed(1) + '×' : 'the loaded level') +
      '. Paid-channel CPL is a Budget lever — here the book is opportunities and renewals.'],
  ];
  if (narr) sections.push(['From this stress run', fcEsc(narr).replace(/\n/g, '<br>')]);
  return sections;
}
