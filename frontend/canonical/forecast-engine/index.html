// \u2500\u2500 PIPELINE DETAIL \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// ── GTM / Pipeline (top-down: CRM pipe first, marketing MQLs overlay) ─────────
const FC_GTM_RATE_MONTHS = 12;

// Program spend is not GTM state: it is the GL marketing program accounts on the P&L
// (Actual GL through close, Forecast GL after, plus forecast account edits in fcPlSpend).
let fcGtmState = {
  cpl: null,           // { period: { programKey: $/MQL } } — forecast edits over the loaded cost per MQL
};

function fcGtmPriorMonth(p) {
  const y = Number(p.slice(0, 4)), m = Number(p.slice(5, 7));
  return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`;
}

/** Loaded funnel row for a month (history, then Actual / Forecast); null when not loaded. */
function fcGtmLoadedFunnel(p) {
  const SO = window.SMPLOutlook;
  return SO && typeof SO.getLoadedFunnel === 'function' ? SO.getLoadedFunnel(p, getCloseMonth()) : null;
}

/** New Business ARR booked in a closed month (outlook actuals, else the loaded history). */
function fcGtmBookedNb(p) {
  const a = SRC.actuals && SRC.actuals[p];
  if (a && a.arr_nb != null) return Number(a.arr_nb);
  const h = window.SMPL_HISTORY && window.SMPL_HISTORY.arr && window.SMPL_HISTORY.arr[p];
  return h && h.arr_nb != null ? Number(h.arr_nb) : null;
}

/**
 * Funnel rates over the last FC_GTM_RATE_MONTHS closed months with loaded funnel, GL program spend and
 * booked New Business: cost per MQL, MQL→opportunity, win rate on pipeline, MQLs per $ of New Business.
 * Fields are null when the months are not loaded.
 */
function fcGtmFunnelRates() {
  const cache = fcPlCache();
  if (cache.gtmRates) return cache.gtmRates;
  const SO = window.SMPLOutlook;
  const months = [];
  let p = getCloseMonth();
  const sum = { spend: 0, mqls: 0, opps: 0, pipe: 0, won: 0, nb: 0 };
  for (let i = 0; i < FC_GTM_RATE_MONTHS; i++, p = fcGtmPriorMonth(p)) {
    const f = fcGtmLoadedFunnel(p);
    const spend = SO && typeof SO.getLoadedProgramSpend === 'function' ? SO.getLoadedProgramSpend(p, getCloseMonth()) : null;
    const nb = fcGtmBookedNb(p);
    if (!f || f.mqls == null || spend == null || nb == null) continue;
    months.push(p);
    sum.spend += Number(spend) || 0;
    sum.mqls += Number(f.mqls) || 0;
    sum.opps += Number(f.opportunities_created) || 0;
    sum.pipe += Number(f.pipeline_arr_created) || 0;
    sum.won += Number(f.closed_won_arr) || 0;
    sum.nb += nb;
  }
  months.sort();
  const div = (a, b) => (b > 0 ? a / b : null);
  cache.gtmRates = {
    months,
    from: months[0] || null,
    to: months[months.length - 1] || null,
    cpl: div(sum.spend, sum.mqls),
    mqlOpp: div(sum.opps, sum.mqls),
    winRate: div(sum.won, sum.pipe),
    mqlPerNb: div(sum.mqls, sum.nb),
  };
  return cache.gtmRates;
}

/** Coverage floor = the closed months' pipeline created ÷ closed-won ARR (1 ÷ win rate); null when not loaded. */
function fcLoadedCoverageMin() {
  const r = fcGtmFunnelRates();
  return r.winRate > 0 ? 1 / r.winRate : null;
}

function fcGtmRatesLabel(r) {
  if (!r.months.length) return 'no closed months with loaded funnel, program spend and bookings';
  const lbl = p => `${MO12[parseInt(p.slice(5), 10) - 1]} ${p.slice(0, 4)}`;
  return `${r.months.length} closed months ${lbl(r.from)}–${lbl(r.to)}`;
}

/** CRM buckets carry `expected`; the engine's built-in demo pipeline does not. */
function fcGtmIsCrmBucket(bucket) {
  return !!(bucket && bucket.expected != null);
}

/** Closed New Business deals through the close month: { total, count } from the CRM deal book. */
function fcGtmClosedNb() {
  const close = getCloseMonth();
  let total = 0;
  let count = 0;
  Object.keys(SRC.opp_pipeline || {}).forEach(p => {
    const nb = p <= close ? SRC.opp_pipeline[p]['New Business'] : null;
    if (!fcGtmIsCrmBucket(nb)) return;
    total += Number(nb.total) || 0;
    count += Number(nb.count) || 0;
  });
  return { total, count };
}

/** Average ARR of closed New Business deals through the close month (warehouse, else the deal book). */
function fcGtmAcv() {
  const live = SRC.gtm && Number(SRC.gtm.avg_acv);
  if (live > 0) return live;
  const nb = fcGtmClosedNb();
  return nb.count ? nb.total / nb.count : null;
}

function fcGtmAcvSource() {
  if (SRC.gtm && Number(SRC.gtm.avg_acv) > 0) return 'Closed new business deals · warehouse';
  const nb = fcGtmClosedNb();
  if (nb.count) return `${nb.count} closed deals Jan–${getCloseMoLabel()} · CRM`;
  return 'Not loaded — no closed CRM deals';
}

/** GL marketing program accounts for a month (expense type "Marketing Programs"): { key: GL amount }. */
function fcGtmGlPrograms(period) {
  const SO = window.SMPLOutlook;
  const row = SO && typeof SO.getWarehouseGlPrograms === 'function'
    ? SO.getWarehouseGlPrograms(period, getCloseMonth()) : null;
  return row || {};
}

/** Program channels = the GL program accounts across the horizon, largest first. */
function fcGtmChannels() {
  const cache = fcPlCache();
  if (cache.gtmChannels) return cache.gtmChannels;
  const fy = {};
  ALL_P.forEach(p => {
    const row = fcGtmGlPrograms(p);
    Object.keys(row).forEach(k => { fy[k] = (fy[k] || 0) + (Number(row[k]) || 0); });
  });
  cache.gtmChannels = Object.keys(fy)
    .sort((a, b) => fy[b] - fy[a] || a.localeCompare(b))
    .map(key => ({ key, label: fcPlSplitKey(key).account }));
  return cache.gtmChannels;
}

/** Program spend for a month: the account's P&L amount (GL, or the forecast edit). */
function fcGtmChannelSpend(period, key) {
  const k = fcPlSplitKey(key);
  const ln = computeFcDeptPlPeriod(period).lines[k.line];
  const team = ln && ln.teams[k.team];
  const acct = team && team.accounts[k.account];
  return acct ? acct.amt : 0;
}

function ensureFcGtmState() {
  if (!fcGtmState.cpl) fcGtmState.cpl = {};
}

/** Program spend edits are P&L account edits; the GL amount (within $500) clears the edit. */
function fcGtmSetChannelSpend(period, key, dollars) {
  ensureFcPlState();
  const gl = Number(fcGlOpexBase(period).detail[key]) || 0;
  if (!fcPlSpend[key]) fcPlSpend[key] = {};
  if (Math.abs(dollars - gl) < 500) delete fcPlSpend[key][period];
  else fcPlSpend[key][period] = Math.round(dollars);
  if (!Object.keys(fcPlSpend[key]).length) delete fcPlSpend[key];
}

function updateFcGtmChannelSpend(period, idx, raw) {
  const ch = fcGtmChannels()[idx];
  if (!ch || period <= getCloseMonth()) return;
  fcGtmSetChannelSpend(period, ch.key, Math.max(0, (Number(raw) || 0) * 1e6));
  refresh();
}

/** Total program spend edit: scales each account in proportion (even split when all are zero). */
function updateFcGtmSpend(period, raw) {
  const chans = fcGtmChannels();
  if (!chans.length || period <= getCloseMonth()) return;
  const newTot = Math.max(0, (Number(raw) || 0) * 1e6);
  const cur = chans.map(ch => fcGtmChannelSpend(period, ch.key));
  const oldTot = cur.reduce((s, v) => s + v, 0);
  chans.forEach((ch, i) => {
    fcGtmSetChannelSpend(period, ch.key, oldTot > 0 ? cur[i] * newTot / oldTot : newTot / chans.length);
  });
  refresh();
}

function updateFcGtmCpl(period, idx, raw) {
  const ch = fcGtmChannels()[idx];
  if (!ch || period <= getCloseMonth()) return;
  ensureFcGtmState();
  if (!fcGtmState.cpl[period]) fcGtmState.cpl[period] = {};
  fcGtmState.cpl[period][ch.key] = Math.max(1, Math.round(Number(raw) || 0));
  refresh();
}

function fcGtmPipeMonth(p) {
  ensureFcGtmState();
  const close = getCloseMonth();
  const lv = getLevers();

  // Actual months: booked ARR waterfall (realized = 100% weighted).
  if (p <= close) {
    const a = (SRC.actuals && SRC.actuals[p]) || {};
    const wtdNb = Number(a.arr_nb) || 0;
    const wtdExp = Number(a.arr_exp) || 0;
    const wtdReact = Number(a.arr_react) || 0;
    const wtdCont = Number(a.arr_cont) || 0;
    const wtdChurn = Number(a.arr_churn) || 0;
    const crm = (SRC.opp_pipeline && SRC.opp_pipeline[p]) || {};
    const crmNb = crm['New Business'];
    const logos = fcGtmIsCrmBucket(crmNb) ? Number(crmNb.count) || 0 : null;
    const crmBuckets = Object.values(crm).filter(fcGtmIsCrmBucket);
    const crmDeals = crmBuckets.length ? crmBuckets.reduce((s, b) => s + (Number(b.count) || 0), 0) : null;
    const netWtd = wtdNb + wtdExp + wtdReact - wtdCont - wtdChurn;
    return {
      isActual: true,
      nb: { total: wtdNb, weighted: wtdNb, count: logos },
      exp: { total: wtdExp, weighted: wtdExp, count: 0 },
      cont: { total: wtdCont, weighted: wtdCont, count: 0 },
      churn: { total: wtdChurn, weighted: wtdChurn, count: 0 },
      react: { total: wtdReact, weighted: wtdReact, count: 0 },
      ren: { arr: 0, weighted: 0, count: 0 },
      wtdNb, wtdExp, wtdCont, wtdChurn, wtdReact, wtdRen: 0,
      grossRen: 0, renN: 0, dealN: crmDeals, logos, netWtd,
    };
  }

  const opps = SRC.opp_pipeline[p] || {};
  const ren = SRC.renewals[p] || {};
  const pick = (t) => opps[t] || { total: 0, weighted: 0, count: 0 };
  const nb = pick('New Business');
  const exp = pick('Expansion');
  const cont = pick('Contraction');
  const churn = pick('Churn');
  const react = pick('Reactivation');
  const wtdNb = (nb.weighted || 0) * (lv.nb || 1);
  const wtdExp = (exp.weighted || 0) * (lv.exp || 1);
  const wtdCont = (cont.weighted || 0) * (lv.churn || 1);
  const wtdChurn = (churn.weighted || 0) * (lv.churn || 1);
  const wtdReact = (react.weighted || 0);
  const wtdRen = (ren.weighted || 0) * (1 + (lv.ren_adj || 0));
  const dealN = (nb.count || 0) + (exp.count || 0) + (cont.count || 0) + (churn.count || 0) + (react.count || 0);
  const netWtd = wtdNb + wtdExp + wtdReact - wtdCont - wtdChurn;
  // Expected new logos = sum of open New Business win probabilities, scaled by the NB attainment lever.
  const logos = fcGtmIsCrmBucket(nb) ? (Number(nb.expected) || 0) * (lv.nb || 1) : 0;
  return {
    isActual: false,
    nb, exp, cont, churn, react, ren,
    wtdNb, wtdExp, wtdCont, wtdChurn, wtdReact, wtdRen,
    grossRen: ren.arr || 0, renN: ren.count || 0, dealN, logos, netWtd,
  };
}

const FC_GTM_BOOKING_TYPES = ['New Business', 'Expansion', 'Reactivation'];

/**
 * Pipeline book for New Business + Expansion + Reactivation, by month.
 * Closed months: the actual pipeline waterfall (SRC.pipeline_book); without it, booked ARR as won
 *   and closed-lost CRM deals as lost, open pipe unknown.
 * Forecast months: open pipe rolls from the prior month end; won = weighted deals × attainment
 *   levers (same as contract events); created / lost / slipped from the forecast pipeline waterfall.
 */
function fcGtmPipelineBooks(periods) {
  ensureFcGtmHistOpps();
  const close = getCloseMonth();
  const book = SRC.pipeline_book || {};
  const out = {};
  let prevEnd = null;
  periods.forEach(p => {
    const row = book[p] || {};
    const pipe = fcGtmPipeMonth(p);
    const opps = SRC.opp_pipeline[p] || {};
    const crmLost = FC_GTM_BOOKING_TYPES.reduce((s, t) => s + (Number((opps[t] || {}).lost_total) || 0), 0);
    const bookedWon = (pipe.wtdNb || 0) + (pipe.wtdExp || 0) + (pipe.wtdReact || 0);
    const num = v => (v != null ? Number(v) || 0 : null);
    let r;
    if (p <= close) {
      const has = row.end != null;
      r = {
        begin: has ? num(row.begin) : null,
        created: has ? num(row.created) : null,
        won: has ? num(row.won) : bookedWon,
        lost: has ? num(row.lost) : (crmLost || null),
        slipped: has ? num(row.slipped) : null,
        end: has ? num(row.end) : null,
      };
    } else {
      const created = num(row.created);
      const lost = row.lost != null ? num(row.lost) : (crmLost || null);
      const slipped = num(row.slipped);
      const end = prevEnd != null ? prevEnd + (created || 0) - bookedWon - (lost || 0) - (slipped || 0) : null;
      r = { begin: prevEnd, created, won: bookedWon, lost, slipped, end };
    }
    out[p] = r;
    prevEnd = r.end;
  });
  return out;
}

/**
 * Program spend and MQLs for a month by GL program account.
 * Closed months: the loaded MQLs, spread over accounts by spend (MQLs are loaded by marketing channel,
 * not by GL account). Forecast months: spend ÷ cost per MQL (an edit, else the loaded rate).
 * mqlSum is null when the month's MQLs or the cost per MQL are not loaded.
 */
function fcGtmAllocate(period) {
  ensureFcGtmState();
  const closed = period <= getCloseMonth();
  const cpls = fcGtmState.cpl[period] || {};
  const rates = fcGtmFunnelRates();
  const loaded = closed ? fcGtmLoadedFunnel(period) : null;
  const loadedMqls = loaded && loaded.mqls != null ? Number(loaded.mqls) : null;
  const channels = {};
  let spendTot = 0;
  fcGtmChannels().forEach(ch => { spendTot += fcGtmChannelSpend(period, ch.key); });
  let mqlSum = closed ? loadedMqls : 0;
  fcGtmChannels().forEach(ch => {
    const spend = fcGtmChannelSpend(period, ch.key);
    const mix = spendTot > 0 ? spend / spendTot : 0;
    let cpl, mqls;
    if (closed) {
      mqls = loadedMqls != null ? loadedMqls * mix : null;
      cpl = mqls ? spend / mqls : null;
    } else {
      cpl = Number(cpls[ch.key]) > 0 ? Number(cpls[ch.key]) : rates.cpl;
      mqls = cpl ? Math.max(0, spend) / cpl : null;
      if (mqls == null) mqlSum = null;
      else if (mqlSum != null) mqlSum += mqls;
    }
    channels[ch.key] = { spend, cpl, mqls, mix };
  });
  return { spendTot, channels, mqlSum };
}

/**
 * MQLs implied by New Business ARR at the loaded funnel's MQLs per $ of New Business
 * (fcGtmFunnelRates): closed months from booked New Business, forecast months from weighted New Business.
 */
function fcGtmImpliedMqls(pipe) {
  const r = fcGtmFunnelRates();
  if (r.mqlPerNb == null) return null;
  return (Number(pipe && pipe.wtdNb) || 0) * r.mqlPerNb;
}

let fcGtmSelectedMonth = null;

function fcGtmMonthHeaders(periods, opts) {
  opts = opts || {};
  const selected = opts.selected || fcGtmSelectedMonth;
  return periods.map(p => {
    const mo = MO12[parseInt(p.slice(5), 10) - 1];
    const isFc = p > getCloseMonth();
    const sel = (opts.selectable && selected === p) ? ' sel' : '';
    const click = opts.selectable
      ? ` onclick="selectFcGtmMonth('${p}')" title="Show ${mo} deal detail"`
      : '';
    return `<th class="${isFc ? 'fc-h' : 'act-h'}${sel}"${click}><span class="hc-mo">${mo}</span><span class="hc-tag">${isFc ? 'Fcst' : 'Act'}</span></th>`;
  }).join('') + '<th class="fy-h">FY</th>';
}

function selectFcGtmMonth(p) {
  fcGtmSelectedMonth = p;
  document.querySelectorAll('.hc-tbl.gtm-pipe th.act-h, .hc-tbl.gtm-pipe th.fc-h').forEach(th => {
    th.classList.toggle('sel', th.getAttribute('onclick') === `selectFcGtmMonth('${p}')`);
  });
  showPipeMonth(p);
}

function fcGtmOppBand(prob) {
  const n = Number(prob) || 0;
  if (n >= 80) return { label: 'Must close', cls: 'must' };
  if (n >= 50) return { label: 'On the fence', cls: 'fence' };
  return { label: 'Stretch / generate', cls: 'stretch' };
}

/** Closed months without CRM deals show booked ARR only — deals are never invented. */
function ensureFcGtmHistOpps() {
  if (!SRC.opp_pipeline) SRC.opp_pipeline = {};
}


function fcGtmMoneyCells(periods, getter, { editable, onchange, cls, units, fy: fyMode } = {}) {
  const toDisp = (v) => {
    const n = Number(v) || 0;
    if (units === 'm') return Math.round((n / 1e6) * 100) / 100;
    if (units === 'k') return Math.round(n / 1000);
    return Math.round(n);
  };
  const fmt = (v) => {
    if (!v) return '—';
    if (units === 'usd') return '$' + Math.round(v).toLocaleString();
    if (units === 'm') return fM(v, 2);
    if (units === 'k') return toDisp(v).toLocaleString();
    return fM(v, 1);
  };
  const cells = periods.map(p => {
    const v = getter(p);
    const c = cls ? cls(p) : (p > getCloseMonth() ? 'fc-c' : 'act-c');
    if (editable && editable(p)) {
      const step = units === 'm' ? 0.05 : (units === 'k' ? 1 : 1000);
      const tip = units === 'm' ? 'Enter $ millions' : (units === 'k' ? 'Enter $ thousands' : 'Enter dollars');
      return `<td class="${c}"><input class="hc-hire" style="width:52px;max-width:100%" type="number" min="0" step="${step}" value="${toDisp(v)}"
        onchange="${onchange(p)}" title="${tip}"></td>`;
    }
    return `<td class="${c}">${fmt(v)}</td>`;
  }).join('');
  const vals = periods.map(getter);
  let fy;
  if (typeof fyMode === 'function') fy = fyMode();
  else if (fyMode === 'first') fy = vals.find(v => v != null);
  else if (fyMode === 'last') fy = vals.slice().reverse().find(v => v != null);
  else fy = vals.reduce((s, v) => s + (Number(v) || 0), 0);
  return cells + `<td class="fy-c">${fmt(fy)}</td>`;
}

function fcGtmNumCells(periods, getter, fmt) {
  const cells = periods.map(p => {
    const v = getter(p);
    const c = p > getCloseMonth() ? 'fc-c' : 'act-c';
    return `<td class="${c}">${fmt(v)}</td>`;
  }).join('');
  const vals = periods.map(getter);
  const fy = vals.some(v => v == null) ? null : vals.reduce((s, v) => s + (Number(v) || 0), 0);
  return cells + `<td class="fy-c">${fmt(fy)}</td>`;
}

/** Services tab: recurring services (% of the ARR-bridge subscription) and implementation (new logos × fee by customer type). */
function renderRevenue(area) {
  const periods = ALL_P.slice();
  const close = getCloseMonth();
  const actP = periods.filter(p => p <= close);
  const fcP = periods.filter(p => p > close);
  const colSpan = periods.length + 2;
  const segs = fcImplSegments();
  const isByP = {}, logosByP = {}, segImplByP = {}, implByP = {};
  periods.forEach(p => {
    isByP[p] = getDisplayIS(p);
    logosByP[p] = fcImplLogos(p);
    segImplByP[p] = fcImplBySegment(p);
    implByP[p] = fcImplRevenue(p);
  });
  const sum = (ps, f) => ps.reduce((s, p) => s + (Number(f(p)) || 0), 0);
  const cellCls = p => (p > close ? 'fc-c' : 'act-c');
  const sub = p => fcRowSub(isByP[p]);
  const recPct = p => (p > close ? fcRecSvcPct(p) : (sub(p) ? fcRowRecSvc(isByP[p]) / sub(p) : null));
  const recSvc = p => (p > close ? sub(p) * fcRecSvcPct(p) : fcRowRecSvc(isByP[p]));
  const recurring = p => sub(p) + recSvc(p);
  const impl = p => implByP[p] || 0;
  const total = p => recurring(p) + impl(p);
  const logos = p => (logosByP[p] ? Object.values(logosByP[p]).reduce((s, v) => s + v, 0) : null);
  const segLogos = (p, seg) => (logosByP[p] ? logosByP[p][seg] || 0 : null);
  const segImpl = (p, seg) => (segImplByP[p] ? segImplByP[p][seg] || 0 : null);
  const collected = p => { const i = periods.indexOf(p); return i > 0 ? impl(periods[i - 1]) : null; };
  const fySub = sum(periods, sub);
  const fyRecSvc = sum(periods, recSvc);
  const fyRec = sum(periods, recurring);
  const fyImpl = sum(periods, impl);
  const fyTotal = sum(periods, total);
  const fcTab = sum(fcP, total);
  const fcIs = sum(fcP, p => (isByP[p] && isByP[p].revenue) || 0);
  const recEdited = Object.keys(fcRecSvcPctEdits).length > 0;
  const feeEdited = Object.keys(fcImplFeeEdits).length > 0;

  const tile = (lbl, val, subTxt) => `<div class="gtm-tile"><div class="gtm-tile-lbl">${lbl}</div><div class="gtm-tile-val">${val}</div><div class="gtm-tile-sub">${subTxt}</div></div>`;
  let html = `<div class="slide">
    <div class="slide-title">Services</div>
    <div class="slide-sub">Subscription comes from the ${originTag('ARR', 'arr', { scrollTo: 'rev-bridge', title: 'Open the ARR revenue bridge' })} revenue bridge. Recurring services are a percent of that subscription. Implementation is new logos by segment times the fee. Amber rows are editable for forecast months; an edit carries forward until you change it again, and flows to the Income Statement, P&amp;L, Cash Flow and Balance Sheet. Link chips open the matching line on the ${originTag('Income Statement', 'is', { scrollTo: 'is-row-revenue', title: 'Open Income Statement' })} or ${originTag('P&amp;L', 'pnl', { scrollTo: 'pl-row-revenue', plDept: 'total', title: 'Open P&L' })}.</div>
    <div class="gtm-strip">
      ${tile('Total revenue', fM(fyTotal, 1), `FY · Act through ${getCloseMoLabel()} + Fcst`)}
      ${tile('Subscription', fM(fySub, 1), fyTotal ? `${(fySub / fyTotal * 100).toFixed(1)}% of revenue` : '—')}
      ${tile('Recurring services', fM(fyRecSvc, 1), fySub ? `${(fyRecSvc / fySub * 100).toFixed(1)}% of subscription · support &amp; TAMs` : '—')}
      ${tile('Implementation &amp; onboarding', fM(fyImpl, 1), `Non-recurring · Act ${fM(sum(actP, impl), 1)} · Fcst ${fM(sum(fcP, impl), 1)}`)}
      ${tile('Recurring % of revenue', fyTotal ? (fyRec / fyTotal * 100).toFixed(1) + '%' : '—', `Recurring ${fM(fyRec, 1)} FY`)}
    </div>`;
  if (Math.abs(fcTab - fcIs) >= 1) {
    html += `<div class="hc-banner">Forecast revenue here is <strong>${fM(fcTab, 1)}</strong>; the Income Statement shows <strong>${fM(fcIs, 1)}</strong>. They should match; check the loaded Forecast.</div>`;
  }

  const countFmt = v => (v ? (Math.round(v * 10) / 10).toLocaleString() : '—');
  const pctTxt = v => (v != null ? (v * 100).toFixed(1) + '%' : '—');
  const usdTxt = v => (v ? '$' + Math.round(v).toLocaleString() : '—');
  const row = (label, cells, opts) => {
    opts = opts || {};
    return `<tr${opts.id ? ` id="${opts.id}"` : ''}${opts.cls ? ` class="${opts.cls}"` : ''}><td>${label}${opts.tag || ''}</td>${cells}</tr>`;
  };
  const sec = (label, extra) => `<tr class="sec"><td colspan="${colSpan}">${label}${extra || ''}</td></tr>`;
  const resetBtn = fn => `<button type="button" class="lock-tag lock-link" onclick="${fn}()" title="Clear forecast edits">Reset to data</button>`;
  const isTag = (id, what) => originTag('IS', 'is', { scrollTo: id, title: `Open ${what} on the Income Statement` });
  const plTag = originTag('P&amp;L', 'pnl', { scrollTo: 'pl-row-revenue', plDept: 'total', title: 'Open total revenue on the P&L' });

  const recPctCells = periods.map(p => {
    if (p <= close) return `<td class="act-c">${pctTxt(recPct(p))}</td>`;
    const v = Math.round(fcRecSvcPct(p) * 1000) / 10;
    const own = fcRecSvcPctEdits[p] != null ? ' pos' : '';
    return `<td class="fc-c"><input class="hc-hire${own}" style="width:52px;max-width:100%" type="number" min="0" max="100" step="0.5" value="${v}"
      onchange="updateFcRecSvcPct('${p}',this.value)" title="Recurring services % of subscription from this month on"></td>`;
  }).join('') + `<td class="fy-c">${pctTxt(fySub ? fyRecSvc / fySub : null)}</td>`;

  const feeCells = seg => periods.map(p => {
    if (p <= close) return `<td class="act-c">${usdTxt(fcImplDataFee(seg))}</td>`;
    const own = fcImplFeeEdits[seg] && fcImplFeeEdits[seg][p] != null ? ' pos' : '';
    return `<td class="fc-c"><input class="hc-hire${own}" style="width:60px;max-width:100%" type="number" min="0" step="250" value="${Math.round(fcImplFee(seg, p))}"
      onchange="updateFcImplFee('${seg}','${p}',this.value)" title="${seg} fee per new logo from this month on"></td>`;
  }).join('') + (() => {
    const n = sum(periods, p => segLogos(p, seg));
    return `<td class="fy-c">${usdTxt(n ? sum(periods, p => segImpl(p, seg)) / n : null)}</td>`;
  })();

  let body = `<thead><tr><th class="act-h line-h" aria-hidden="true"></th>${fcGtmMonthHeaders(periods)}</tr></thead><tbody>`;

  body += sec('1 · Recurring services — support &amp; TAMs · subscription from ARR · Act = books · Fcst = subscription × %', recEdited ? resetBtn('resetFcRecSvcPct') : '');
  body += row('Subscription revenue', fcGtmMoneyCells(periods, sub),
    { id: 'rev-row-sub', tag: originTag('ARR', 'arr', { scrollTo: 'rev-bridge', title: 'Open the ARR revenue bridge' }) + isTag('is-row-sub', 'Subscription Revenue') });
  body += row('Recurring services % of subscription', recPctCells, { cls: 'adj' });
  body += row('Recurring services revenue', fcGtmMoneyCells(periods, recSvc),
    { cls: 'tot', id: 'rev-row-rsvc', tag: isTag('is-row-rsvc', 'Recurring Services') });
  body += row('Total recurring revenue', fcGtmMoneyCells(periods, recurring),
    { cls: 'tot', tag: isTag('is-row-recurring', 'Recurring Revenue') });

  body += sec('2 · Non-recurring — implementation &amp; onboarding · Act = books · Fcst = new logos × fee', feeEdited ? resetBtn('resetFcImplFees') : '');
  segs.forEach(seg => { body += row(`New logos — ${seg}`, fcGtmNumCells(periods, p => segLogos(p, seg), countFmt)); });
  body += row('New logos — total', fcGtmNumCells(periods, logos, countFmt), { cls: 'tot' });
  segs.forEach(seg => { body += row(`Fee per new logo — ${seg}`, feeCells(seg), { cls: 'adj' }); });
  segs.forEach(seg => { body += row(`Implementation — ${seg}`, fcGtmMoneyCells(periods, p => segImpl(p, seg))); });
  body += row('Implementation &amp; onboarding revenue', fcGtmMoneyCells(periods, impl),
    { cls: 'tot', id: 'rev-row-impl', tag: isTag('is-row-impl', 'Implementation &amp; Onboarding') });

  body += sec('Total revenue');
  body += row('Total revenue', fcGtmMoneyCells(periods, total),
    { cls: 'tot', id: 'rev-row-total', tag: isTag('is-row-revenue', 'Total Revenue') + plTag });

function fcGtmDisplayCustomer(name, idx) {
  const raw = String(name || '');
  const m = raw.match(/^Forecast Customer\s+(\d+)/i);
  if (!m) return raw;
  const pool = [
    'Harbor Logistics','Northwind Health','Cascade Analytics','Redwood Legal',
    'Summit Works','BlueRiver Cloud','Pioneer Systems','Evergreen Group',
    'Apex Solutions','Nimbus Labs','Vertex Partners','Catalyst Media',
    'Lumen Retail','Oakridge Finance','Brightpath Services','Cedarline Tech',
  ];
  return pool[(Number(m[1]) + (idx || 0)) % pool.length];
}

/** Renewal focus band — At Risk / low health escalate; Commit+high prob = must retain. */
function fcGtmRenewalBand(r) {
  const stage = String(r.stage || '');
  const prob = Number(r.prob) || 0;
  const risk = Number(r.risk) || 0;
  const health = r.health != null && !isNaN(Number(r.health)) ? Number(r.health) : null;
  if (/at\s*risk/i.test(stage) || risk >= 70 || (health != null && health <= 40)) {
    return { label: 'At risk — save', cls: 'stretch' };
  }
  if (/commit/i.test(stage) || prob >= 90) {
    return { label: 'Must retain', cls: 'must' };
  }
  if (prob >= 70 || /likely/i.test(stage)) {
    return { label: 'Watch', cls: 'fence' };
  }
  return { label: 'At risk — save', cls: 'stretch' };
}

// ── Sales: quota carriers vs the ARR book. Heads here feed the Headcount tab. ──

const FC_SALES_GROUPS = [
  { key: 'sales', label: 'New Business', book: 'nb', dept: 'Sales' },
  { key: 'cs', label: 'Customer Success', book: 'exp', dept: 'Customer Success' },
];

/** Annual quota of people who carry a quota, from the close roster. */
function fcSalesQuotaBase() {
  const out = { sales: { carriers: 0, annual: 0 }, cs: { carriers: 0, annual: 0 } };
  (fcWorkforce().roster || []).forEach(r => {
    const g = FC_SALES_GROUPS.find(x => x.dept === r.dept);
    if (!g || !(Number(r.quota) > 0)) return;
    out[g.key].carriers += 1;
    out[g.key].annual += Number(r.quota);
  });
  return out;
}

function fcSalesArr(p) {
  const a = getForecastARR(p);
  return {
    nb: a && a.arr_nb != null ? Number(a.arr_nb) : null,
    exp: a && a.arr_exp != null ? Number(a.arr_exp) : null,
  };
}

/**
 * Monthly quota capacity. The roster quota is the close team's annual book.
 * Other months scale with that team's ending heads, then divide by 12.
 */
function fcSalesCapacity(plan) {
  const base = fcSalesQuotaBase();
  const close = getCloseMonth();
  const by = {};
  ALL_P.forEach(p => { by[p] = { sales: null, cs: null }; });
  FC_SALES_GROUPS.forEach(g => {
    const closeHeads = plan[close] && plan[close].ending ? (plan[close].ending[g.key] || 0) : 0;
    ALL_P.forEach(p => {
      const heads = plan[p] && plan[p].ending ? (plan[p].ending[g.key] || 0) : 0;
      by[p][g.key] = closeHeads > 0 ? (base[g.key].annual * (heads / closeHeads)) / 12 : null;
    });
  });
  return { base, by };
}

function fcSalesSum(periods, fn) {
  let s = 0;
  let any = false;
  periods.forEach(p => {
    const v = fn(p);
    if (v == null) return;
    any = true;
    s += v;
  });
  return any ? s : null;
}

function fcSalesEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

/** June roster, quota carriers only, by territory, team, and role. */
function fcSalesSegments() {
  const rows = [];
  const index = {};
  (fcWorkforce().roster || []).forEach(r => {
    const g = FC_SALES_GROUPS.find(x => x.dept === r.dept);
    if (!g || !(Number(r.quota) > 0)) return;
    const region = r.region || 'No territory';
    const id = g.key + '|' + region + '|' + r.role;
    let s = index[id];
    if (!s) {
      s = index[id] = { id, group: g.key, team: g.label, region, role: r.role, heads: 0, annual: 0 };
      rows.push(s);
    }
    s.heads += 1;
    s.annual += Number(r.quota);
  });
  rows.sort((a, b) => a.region.localeCompare(b.region)
    || (a.group === b.group ? 0 : a.group === 'sales' ? -1 : 1)
    || a.role.localeCompare(b.role));
  return rows;
}

function fcSalesRoleQuota(dept, role) {
  const hits = (fcWorkforce().roster || []).filter(r => r.dept === dept && r.role === role && Number(r.quota) > 0);
  if (!hits.length) return null;
  return hits.reduce((s, r) => s + Number(r.quota), 0) / hits.length;
}


function fcOpenMonthHeaders(fyLabel) {
  return FC_P.map(p => {
    const mo = MO12[parseInt(p.slice(5), 10) - 1];
    return `<th class="fc-h"><span class="hc-mo">${mo}</span><span class="hc-tag">Fcst</span></th>`;
  }).join('') + `<th class="fy-h">${fyLabel}</th>`;
}

/** People on staff at the close, plus each open requisition from its start month, by territory and role. */
function fcSalesRestPlan() {
  const segments = {};
  const ensure = (region, group, role) => {
    const id = region + '|' + group.key + '|' + role;
    if (!segments[id]) {
      segments[id] = { id, region, group: group.key, team: group.label, role, baseHeads: 0, baseQuota: 0, hires: {} };
    }
    return segments[id];
  };
  (fcWorkforce().roster || []).forEach(r => {
    const g = FC_SALES_GROUPS.find(x => x.dept === r.dept);
    if (!g) return;
    const seat = ensure(r.region || 'No territory', g, r.role || 'Role');
    seat.baseHeads += 1;
    if (Number(r.quota) > 0) seat.baseQuota += Number(r.quota);
  });
  const reqs = (fcWorkforce().reqs || []).filter(r => FC_SALES_GROUPS.some(g => g.dept === r.dept))
    .slice().sort((a, b) => String(a.start).localeCompare(String(b.start)) || String(a.id).localeCompare(String(b.id)));
  const unplaced = [];
  reqs.forEach(r => {
    const g = FC_SALES_GROUPS.find(x => x.dept === r.dept);
    if (!r.region) { unplaced.push(r); return; }
    const seat = ensure(r.region, g, r.role || 'Role');
    const start = String(r.start).slice(0, 7);
    const add = seat.hires[start] || (seat.hires[start] = { heads: 0, quota: 0 });
    add.heads += 1;
    const named = Number(r.quota);
    const quota = named > 0 ? named : (fcSalesRoleQuota(r.dept, r.role) || 0);
    add.quota += quota;
  });
  const rows = Object.values(segments).sort((a, b) => a.region.localeCompare(b.region)
    || (a.group === b.group ? 0 : a.group === 'sales' ? -1 : 1)
    || a.role.localeCompare(b.role));
  return { segments: rows, reqs, unplaced };
}

function fcSalesSeatCount(seat, period) {
  return seat.baseHeads + Object.entries(seat.hires).reduce((n, [start, add]) => n + (start <= period ? add.heads : 0), 0);
}

function fcSalesSeatQuota(seat, period) {
  const annual = seat.baseQuota + Object.entries(seat.hires).reduce((n, [start, add]) => n + (start <= period ? add.quota : 0), 0);
  return annual / 12;
}


function renderSales(area) {
  if (!fcHcHasData()) {
    area.innerHTML = `<div class="slide">
      <div class="slide-title">Sales</div>
      <div class="hc-banner">No headcount roster is loaded, so quota capacity and sales heads are not available.</div>
    </div>`;
    return;
  }
  ensureFcHcState();
  const plan = computeFcHcPlan();
  const cap = fcSalesCapacity(plan);
  const close = getCloseMonth();
  const act = ALL_P.filter(p => p <= close);
  const open = ALL_P.filter(p => p > close);
  const colSpan = ALL_P.length + 2;
  const cell = (p, text) => `<td class="${p > close ? 'fc-c' : 'act-c'}">${text}</td>`;
  const fyCell = v => `<td class="fy-c">${v == null ? '\u2014' : fM(v)}</td>`;
  const pct = (booked, capacity) => (booked != null && capacity > 0 ? fP(booked / capacity) : '\u2014');
  const leftHtml = (booked, capacity) => {
    if (booked == null || capacity == null) return '\u2014';
    const v = capacity - booked;
    const cls = Math.abs(v) < 0.5 ? '' : (v > 0 ? 'pos' : 'neg');
    return `<span class="${cls}">${fM(v)}</span>`;
  };

  const planRows = fcSalesRestPlan();
  const monthQuota = (p, key) => {
    if (p <= close) return cap.by[p][key];
    return planRows.segments.filter(s => s.group === key).reduce((n, s) => n + fcSalesSeatQuota(s, p), 0);
  };
  const block = (g, periods) => {
    const booked = fcSalesSum(periods, p => fcSalesArr(p)[g.book]);
    const capacity = fcSalesSum(periods, p => monthQuota(p, g.key));
    return {
      booked,
      capacity,
      attain: booked != null && capacity > 0 ? booked / capacity : null,
      left: booked != null && capacity != null ? capacity - booked : null,
    };
  };

  let html = `<div class="slide">
    <div class="slide-title">Sales \u00b7 plan check</div>
    <div class="slide-sub">${FC_START_LABEL} through December is the plan for the rest of the year, month by month. Bookings sit against the quota of the people on staff. Heads by territory add each open requisition in the month it starts, in the territory that hire is for.</div>`;

  html += `<div class="kpi-strip ks4">`;
  FC_SALES_GROUPS.forEach(g => {
    const ytd = block(g, act);
    const rest = block(g, open);
    html += `<div class="kpi"><div class="kpi-lbl">${g.label} YTD attainment</div><div class="kpi-val">${ytd.attain != null ? fP(ytd.attain) : '\u2014'}</div><div class="kpi-delta neu">${fM(ytd.booked)} booked \u00b7 ${fM(ytd.capacity)} quota</div></div>`;
    html += `<div class="kpi"><div class="kpi-lbl">${g.label} rest of year</div><div class="kpi-val">${rest.attain != null ? fP(rest.attain) : '\u2014'}</div><div class="kpi-delta neu">${fM(rest.booked)} forecast \u00b7 ${fM(rest.capacity)} quota</div></div>`;
  });
  html += `</div>`;

  const gaps = [];
  FC_SALES_GROUPS.forEach(g => {
    const rest = block(g, open);
    const hires = open.reduce((s, p) => s + ((plan[p].hires && plan[p].hires[g.key]) || 0), 0);
    gaps.push({ g, rest, hires, carriers: cap.base[g.key].carriers, annual: cap.base[g.key].annual });
  });
  html += `<div class="hc-banner">Open requisitions are the hiring plan (${gaps.map(x => `${x.g.label} ${x.hires >= 0 ? '+' : ''}${x.hires}`).join(' · ')} after close). A forecast hire cell is a what-if against those requisitions.</div>`;

  const head = `<thead><tr><th class="act-h line-h" aria-hidden="true"></th>${fcHcMonthHeaders()}</tr></thead>`;
  let body = head + '<tbody>';
  body += `<tr class="sec"><td colspan="${colSpan}">Bookings against the quota plan</td></tr>`;
  FC_SALES_GROUPS.forEach(g => {
    const bookedFy = fcSalesSum(ALL_P, p => fcSalesArr(p)[g.book]);
    const capFy = fcSalesSum(ALL_P, p => monthQuota(p, g.key));
    body += `<tr><td>${g.label} booked</td>${ALL_P.map(p => cell(p, fcSalesArr(p)[g.book] == null ? '\u2014' : fM(fcSalesArr(p)[g.book]))).join('')}${fyCell(bookedFy)}</tr>`;
    body += `<tr><td>${g.label} quota capacity</td>${ALL_P.map(p => cell(p, monthQuota(p, g.key) == null ? '\u2014' : fM(monthQuota(p, g.key)))).join('')}${fyCell(capFy)}</tr>`;
    body += `<tr><td>${g.label} over / under</td>${ALL_P.map(p => cell(p, leftHtml(fcSalesArr(p)[g.book], monthQuota(p, g.key)))).join('')}<td class="fy-c">${leftHtml(bookedFy, capFy)}</td></tr>`;
    body += `<tr class="tot"><td>${g.label} attainment</td>${ALL_P.map(p => cell(p, pct(fcSalesArr(p)[g.book], monthQuota(p, g.key)))).join('')}<td class="fy-c">${pct(bookedFy, capFy)}</td></tr>`;
  });
  body += `<tr class="sec"><td colspan="${colSpan}">Heads against the hiring plan</td></tr>`;
  FC_SALES_GROUPS.forEach(g => {
    body += `<tr class="tot"><td>${g.label} ending heads</td>${ALL_P.map(p => cell(p, String((plan[p].ending && plan[p].ending[g.key]) || 0))).join('')}<td class="fy-c">${plan[ALL_P[11]].ending[g.key]}</td></tr>`;
    body += renderFcHcHireRow(`${g.label} hires`, g.key, plan, true);
  });
  body += '</tbody>';
  html += `<div class="hc-wrap sales-flow"><table class="hc-tbl">${body}</table></div>`;

  const monthHead = (fyLabel) => `<thead><tr><th class="fc-h line-h" aria-hidden="true"></th>${fcOpenMonthHeaders(fyLabel)}</tr></thead>`;
  const openSpan = FC_P.length + 2;
  const numCell = (text) => `<td class="fc-c">${text}</td>`;

  let headsBy = monthHead('Ending') + '<tbody>';
  headsBy += `<tr class="sec"><td colspan="${openSpan}">Ending heads by territory \u00b7 team \u00b7 role \u2014 ${FC_START_LABEL} through December. Ending is the December team.</td></tr>`;
  if (!planRows.segments.length) {
    headsBy += `<tr><td colspan="${openSpan}">No Sales or Customer Success roster is loaded.</td></tr>`;
  }
  planRows.segments.forEach(s => {
    const months = FC_P.map(p => fcSalesSeatCount(s, p));
    headsBy += `<tr><td>${fcSalesEsc(s.region)} \u00b7 ${fcSalesEsc(s.team)} \u00b7 ${fcSalesEsc(s.role)}</td>${months.map(n => numCell(String(n))).join('')}<td class="fy-c">${months.length ? months[months.length - 1] : '\u2014'}</td></tr>`;
  });
  if (planRows.segments.length) {
    const totals = FC_P.map(p => planRows.segments.reduce((n, s) => n + fcSalesSeatCount(s, p), 0));
    headsBy += `<tr class="tot"><td>Ending heads</td>${totals.map(n => numCell(String(n))).join('')}<td class="fy-c">${totals[totals.length - 1]}</td></tr>`;
  }
  headsBy += '</tbody>';
  html += `<div class="hc-wrap sales-flow"><table class="hc-tbl">${headsBy}</table></div>`;

  let quotaBy = monthHead('Rest') + '<tbody>';
  quotaBy += `<tr class="sec"><td colspan="${openSpan}">Quota capacity by territory \u2014 ${FC_START_LABEL} through December. Rest is the sum of these months.</td></tr>`;
  const regions = [...new Set(planRows.segments.map(s => s.region))];
  regions.forEach(region => {
    const rows = planRows.segments.filter(s => s.region === region);
    const months = FC_P.map(p => rows.reduce((n, s) => n + fcSalesSeatQuota(s, p), 0));
    const rest = months.reduce((n, v) => n + v, 0);
    quotaBy += `<tr><td>${fcSalesEsc(region)}</td>${months.map(v => numCell(fM(v))).join('')}<td class="fy-c">${fM(rest)}</td></tr>`;
  });
  if (regions.length) {
    const quotaTotals = FC_P.map(p => planRows.segments.reduce((n, s) => n + fcSalesSeatQuota(s, p), 0));
    quotaBy += `<tr class="tot"><td>Quota capacity</td>${quotaTotals.map(v => numCell(fM(v))).join('')}<td class="fy-c">${fM(quotaTotals.reduce((n, v) => n + v, 0))}</td></tr>`;
  }
  quotaBy += '</tbody>';
  html += `<div class="hc-wrap sales-flow"><table class="hc-tbl">${quotaBy}</table></div>`;
  if (planRows.unplaced.length) {
    html += `<div class="hc-banner">These open requisitions have no territory, so they are not in the monthly territory tables: ${planRows.unplaced.map(r => fcSalesEsc(r.id)).join(', ')}.</div>`;
  }

  const reqs = planRows.reqs;
  let hireRows = `<thead><tr><th>Open requisition</th><th>Start</th><th>Territory</th><th>Team</th><th>Role</th><th>Level</th><th>Quota</th></tr></thead><tbody>`;
  hireRows += `<tr class="sec"><td colspan="7">Hiring plan. Each row is the territory the requisition adds from its start month through December.</td></tr>`;
  if (!reqs.length) {
    hireRows += `<tr><td colspan="7">No open Sales or Customer Success requisitions.</td></tr>`;
  }
  reqs.forEach(r => {
    const q = Number(r.quota) > 0 ? Number(r.quota) : fcSalesRoleQuota(r.dept, r.role);
    const mo = MO12[parseInt(String(r.start).slice(5), 10) - 1] || r.start;
    hireRows += `<tr><td>${fcSalesEsc(r.id)}</td><td>${fcSalesEsc(mo)}</td><td>${r.region ? fcSalesEsc(r.region) : '\u2014'}</td><td>${fcSalesEsc(r.dept)}</td><td>${fcSalesEsc(r.role)}</td><td>${fcSalesEsc(r.level || '\u2014')}</td><td>${q ? fM(q) : '\u2014'}</td></tr>`;
  });
  hireRows += '</tbody>';
  html += `<div class="hc-wrap sales-flow"><table class="hc-tbl sales-snap">${hireRows}</table></div></div>`;
  area.innerHTML = html;

}

// ── Forecast HC plan. Sales and Customer Success heads come from the Sales tab. ──
// Groups follow the income statement's department → P&L line map (Support is G&A).
const FC_HC_DEPTS = [
  { key: 'sales', label: 'Sales - New Business', locked: true, srcDepts: ['Sales'] },
  { key: 'cs', label: 'Sales - Customer Success', locked: true, srcDepts: ['Customer Success'] },
  { key: 'marketing', label: 'Marketing', srcDepts: ['Marketing'] },
  { key: 'rd', label: 'R&D / Product', srcDepts: ['R&D', 'Product', 'Engineering'] },
  { key: 'ga', label: 'G&A / Support', srcDepts: ['G&A', 'Finance', 'Support'] },
];
const FC_HC_EDITABLE = FC_HC_DEPTS.filter(d => !d.locked);

/** Loaded heads by group and month ({ group: [heads by ALL_P] }), plus departments no group covers. */
function fcHcMonthly() {
  const heads = fcWorkforce().heads || {};
  const out = { _unmapped: [] };
  FC_HC_DEPTS.forEach(d => { out[d.key] = ALL_P.map(() => null); });
  Object.keys(heads).forEach(dept => {
    const key = fcHcMapDept(dept);
    if (!key) { out._unmapped.push(dept); return; }
    ALL_P.forEach((p, i) => {
      const v = fcWfMonthValue(heads[dept], p);
      if (v != null) out[key][i] = (out[key][i] || 0) + v;
    });
  });
  return out;
}

function fcHcHasData() {
  const total = fcWorkforce().heads_total || [];
  return total.some(v => v != null);
}

let fcHcState = {
  focus: 'total', // total | marketing | rd | ga
  hires: null,    // { period: { dept: netHires } }
  rifs: [],       // { id, period, dept, heads, weeks }
  attritionPct: null, // { dept: annual % } — exits spread across forecast months
  freeze: { marketing: false, rd: false, ga: false },
  seededFrom: null,
};

function fcHcMapDept(dept) {
  const d = String(dept || '');
  for (const row of FC_HC_DEPTS) {
    if (row.srcDepts.some(x => x === d)) return row.key;
  }
  return null;
}

function fcHcEmptyHires() {
  const out = {};
  ALL_P.forEach(p => {
    out[p] = {};
    FC_HC_DEPTS.forEach(d => { out[p][d.key] = 0; });
  });
  return out;
}

function fcHcHistHires(monthly, dept, monthIdx) {
  const series = monthly[dept];
  if (!series || monthIdx <= 0) return 0;
  return (series[monthIdx] || 0) - (series[monthIdx - 1] || 0);
}

function fcHcCloseBop() {
  const idx = ALL_P.indexOf(getCloseMonth());
  const monthly = fcHcMonthly();
  const bop = {};
  let sum = 0;
  FC_HC_DEPTS.forEach(d => {
    const v = idx >= 0 && monthly[d.key][idx] != null ? monthly[d.key][idx] : 0;
    bop[d.key] = v;
    sum += v;
  });
  bop._total = sum;
  bop._closeHc = getCloseHc();
  bop._unmapped = monthly._unmapped;
  return bop;
}

/** Actual months: net change in loaded heads. Forecast months: one hire per loaded open req in its start month. */
function seedFcHcFromData(force) {
  if (fcHcState.hires && !force) return;
  const monthly = fcHcMonthly();
  const hires = fcHcEmptyHires();
  const close = getCloseMonth();
  ALL_P.forEach((p, i) => {
    if (p > close) return;
    FC_HC_DEPTS.forEach(d => {
      hires[p][d.key] = fcHcHistHires(monthly, d.key, i);
    });
  });
  reqActive = {};
  (fcWorkforce().reqs || []).forEach(r => {
    const key = fcHcMapDept(r.dept);
    if (!key || !r.start || !hires[r.start] || r.start <= close) return;
    hires[r.start][key] += 1;
    reqActive[r.id] = true;
  });
  fcHcState.hires = hires;
  fcHcState.seededFrom = 'reqs+' + close;
}

/** Forecast months where close heads + loaded open reqs differ from the loaded headcount plan, by group. */
function fcHcReqPlanGaps() {
  const monthly = fcHcMonthly();
  const close = getCloseMonth();
  const closeIdx = ALL_P.indexOf(close);
  const adds = {};
  (fcWorkforce().reqs || []).forEach(r => {
    const key = fcHcMapDept(r.dept);
    if (!key || !r.start || r.start <= close) return;
    adds[r.start + '|' + key] = (adds[r.start + '|' + key] || 0) + 1;
  });
  const gaps = [];
  FC_HC_DEPTS.forEach(d => {
    let running = closeIdx >= 0 ? monthly[d.key][closeIdx] : null;
    if (running == null) return;
    ALL_P.forEach((p, i) => {
      if (p <= close) return;
      running += adds[p + '|' + d.key] || 0;
      const loaded = monthly[d.key][i];
      if (loaded != null && loaded !== running) gaps.push({ period: p, label: d.label, reqs: running, plan: loaded });
    });
  });
  return gaps;
}

function ensureFcHcState() {
  seedFcHcFromData(false);
  if (!Array.isArray(fcHcState.rifs)) fcHcState.rifs = [];
  if (!fcHcState.attritionPct || typeof fcHcState.attritionPct !== 'object') {
    fcHcState.attritionPct = {};
  }
  FC_HC_DEPTS.forEach(d => {
    if (fcHcState.attritionPct[d.key] == null) fcHcState.attritionPct[d.key] = 0;
  });
  if (!fcHcState.freeze || typeof fcHcState.freeze !== 'object') {
    fcHcState.freeze = { marketing: false, rd: false, ga: false };
  }
  FC_HC_EDITABLE.forEach(d => {
    if (fcHcState.freeze[d.key] == null) fcHcState.freeze[d.key] = false;
  });
}

function setFcHcFreeze(dept, on) {
  ensureFcHcState();
  if (!FC_HC_EDITABLE.some(d => d.key === dept)) return;
  fcHcState.freeze[dept] = !!on;
  markScenarioDirty();
  refresh();
}

function updateFcHcAttritionPct(dept, raw) {
  ensureFcHcState();
  fcHcState.attritionPct[dept] = Math.max(0, Math.min(40, Math.round(Number(raw) || 0)));
  refresh();
}

/** Spread ceil(BOP × annual%) across forecast months (actuals stay locked). */
function fcHcAttritionSchedule(bop) {
  const sched = {};
  ALL_P.forEach(p => {
    sched[p] = {};
    FC_HC_DEPTS.forEach(d => { sched[p][d.key] = 0; });
  });
  const nFc = Math.max(1, FC_P.length);
  FC_HC_DEPTS.forEach(d => {
    const pct = Math.max(0, Number(fcHcState.attritionPct[d.key]) || 0) / 100;
    const annual = Math.ceil((bop[d.key] || 0) * pct);
    if (!annual) return;
    const base = Math.floor(annual / nFc);
    let rem = annual - base * nFc;
    FC_P.forEach((p, i) => {
      sched[p][d.key] = base + (i < rem ? 1 : 0);
    });
  });
  return sched;
}

function fcHcRifsForPeriod(period) {
  return (fcHcState.rifs || []).filter(r => r.period === period);
}

function computeFcHcPlan() {
  ensureFcHcState();
  const bop = fcHcCloseBop();
  const monthly = fcHcMonthly();
  const close = getCloseMonth();
  const closeIdx = ALL_P.indexOf(close);
  const attrSched = fcHcAttritionSchedule(bop);
  const plan = {};
  let running = {};
  FC_HC_DEPTS.forEach(d => { running[d.key] = bop[d.key]; });

  ALL_P.forEach((p, i) => {
    const hires = {};
    const rifExits = {};
    const attrition = {};
    const ending = {};
    let hireTot = 0;
    let rifTot = 0;
    let attrTot = 0;

    FC_HC_DEPTS.forEach(d => {
      let h = 0;
      let rifH = 0;
      let attrH = 0;
      if (p <= close) {
        h = fcHcHistHires(monthly, d.key, i);
        ending[d.key] = monthly[d.key][i] || 0;
        if (i === closeIdx) running[d.key] = ending[d.key];
      } else {
        h = Number((fcHcState.hires[p] && fcHcState.hires[p][d.key]) || 0);
        // Hire freeze: block growth hires; exits / RIF / attrition still apply
        if (fcHcState.freeze && fcHcState.freeze[d.key] && h > 0) h = 0;
        rifH = fcHcRifsForPeriod(p)
          .filter(r => r.dept === d.key)
          .reduce((s, r) => s + (Number(r.heads) || 0), 0);
        attrH = Number((attrSched[p] && attrSched[p][d.key]) || 0);
        running[d.key] = Math.max(0, (running[d.key] || 0) + h - rifH - attrH);
        ending[d.key] = running[d.key];
      }
      hires[d.key] = h;
      rifExits[d.key] = rifH;
      attrition[d.key] = attrH;
      hireTot += h;
      rifTot += rifH;
      attrTot += attrH;
    });

    const headsTotal = FC_HC_DEPTS.reduce((s, d) => s + (ending[d.key] || 0), 0);
    plan[p] = { hires, rifExits, attrition, ending, hireTot, rifTot, attrTot, headsTotal, isActual: p <= close };
  });
  plan._bop = bop;
  return plan;
}

function setFcHcFocus(focus) {
  fcHcState.focus = focus || 'total';
  refresh();
}

function updateFcHcHire(period, dept, raw) {
  ensureFcHcState();
  if (period <= getCloseMonth()) return;
  const n = Math.max(-20, Math.min(20, Math.round(Number(raw) || 0)));
  if (!fcHcState.hires[period]) fcHcState.hires[period] = {};
  fcHcState.hires[period][dept] = n;
  if (fcHcState.hiresByLevel && fcHcState.hiresByLevel[period]) delete fcHcState.hiresByLevel[period][dept];
  refresh();
}

function addFcHcRif() {
  ensureFcHcState();
  const id = 'rif_' + Date.now();
  const period = FC_P[0] || ALL_P[ALL_P.length - 1];
  fcHcState.rifs.push({ id, period, dept: 'rd', heads: 3, weeks: null });
  refresh();
}

function updateFcHcRif(id, field, value) {
  const rif = (fcHcState.rifs || []).find(r => r.id === id);
  if (!rif) return;
  if (field === 'heads') rif.heads = Math.max(0, Math.round(Number(value) || 0));
  else if (field === 'weeks') {
    const text = String(value == null ? '' : value).trim();
    rif.weeks = text === '' ? null : Math.max(0, Math.round((Number(text) || 0) * 10) / 10);
  } else rif[field] = value;
  refresh();
}

function removeFcHcRif(id) {
  fcHcState.rifs = (fcHcState.rifs || []).filter(r => r.id !== id);
  refresh();
}

function fcHcHireClass(n) {
  if (n > 0) return 'pos';
  if (n < 0) return 'neg';
  return '';
}

function fcHcHireInput(period, dept, value) {
  const locked = period <= getCloseMonth();
  const n = Number(value) || 0;
  if (locked) {
    const text = n > 0 ? ('+' + n) : String(n);
    return `<span class="act-c">${text}</span>`;
  }
  return `<input class="hc-hire ${fcHcHireClass(n)}" type="number" min="-20" max="20" step="1" value="${n}"
    onchange="updateFcHcHire('${period}','${dept}',this.value)" title="Positive = hire, negative = exit" />`;
}

function fcHcMonthHeaders() {
  return ALL_P.map(p => {
    const mo = MO12[parseInt(p.slice(5), 10) - 1];
    const isFc = p > getCloseMonth();
    return `<th class="${isFc ? 'fc-h' : 'act-h'}"><span class="hc-mo">${mo}</span><span class="hc-tag">${isFc ? 'Fcst' : 'Act'}</span></th>`;
  }).join('') + '<th class="fy-h">FY</th>';
}

function fcHcForecastHeaders() {
  return FC_P.map(p => {
    const mo = MO12[parseInt(p.slice(5), 10) - 1];
    return `<th class="fc-h"><span class="hc-mo">${mo}</span><span class="hc-tag">Fcst</span></th>`;
  }).join('') + '<th class="fy-h">Rest</th>';
}

function fcHcSum(vals) {
  return vals.reduce((s, v) => s + (Number(v) || 0), 0);
}

function renderFcHcHireRow(label, dept, plan, editable) {
  const cells = ALL_P.map(p => {
    const v = plan[p].hires[dept] || 0;
    if (editable) return `<td class="fc-c">${fcHcHireInput(p, dept, v)}</td>`;
    const cls = p > getCloseMonth() ? 'fc-c' : 'act-c';
    return `<td class="${cls}">${v ? ((v > 0 ? '+' : '') + v) : '—'}</td>`;
  }).join('');
  const fy = fcHcSum(ALL_P.map(p => plan[p].hires[dept] || 0));
  return `<tr class="${editable ? 'adj' : ''}"><td>${label}</td>${cells}<td class="fy-c">${fy ? ((fy > 0 ? '+' : '') + fy) : '—'}</td></tr>`;
}

function fcHcTable(inner) {
  return `<div class="hc-wrap sales-flow hc-tight"><table class="hc-tbl hc-tight">${inner}</table></div>`;
}

function fcHcBridgeTable(inner) {
  return `<div class="hc-wrap sales-flow bridge"><table class="hc-tbl bridge">${inner}</table></div>`;
}

  editable.forEach(d => {

  hiring += '</tbody>';

    const levels = (table && table.levels[dept.key]) || [];
    let body = head + '<tbody>';
    body += `<tr class="sec"><td colspan="${colSpan}">${dept.label} — monthly hires by level. January through ${getCloseMoLabel()} is the department net on the total row. Those months were not stored by level.</td></tr>`;
    if (!levels.length) {
      body += `<tr><td colspan="${colSpan}" style="text-align:left;color:var(--amber)">No close-roster levels for ${dept.label}.</td></tr>`;
    }
    levels.forEach(lv => {
      const cells = ALL_P.map(p => {
        if (p <= close) return `<td class="act-c">—</td>`;
        const n = (plan[p].hiresByLevel[dept.key] && plan[p].hiresByLevel[dept.key][lv]) || 0;
        return `<td class="fc-c"><input class="hc-hire ${fcHcHireClass(n)}" type="number" min="-20" max="20" step="1" value="${n}" onchange="updateFcHcHireLevel('${p}','${dept.key}','${lv}',this.value)"></td>`;
      }).join('');
      const fy = FC_P.reduce((s, p) => s + ((plan[p].hiresByLevel[dept.key] && plan[p].hiresByLevel[dept.key][lv]) || 0), 0);
      body += `<tr class="adj"><td>${lv}</td>${cells}<td class="fy-c">${fy ? ((fy > 0 ? '+' : '') + fy) : '—'}</td></tr>`;
    });
    body += `<tr class="tot"><td>${dept.label} hires</td>${fcHcCountCells(plan, row => (row.hires && row.hires[dept.key]) || 0, false)}</tr></tbody>`;
    html += fcHcTable(body);
  }

  FC_HC_DEPTS.forEach(d => {
    let body = head + '<tbody>';
    body += `<tr class="sec"><td colspan="${colSpan}">${d.label}. January through ${getCloseMoLabel()} loaded payroll is this group's GL. Wages, benefits, and bonus for those months are booked on the company total.</td></tr>`;
    const endCells = ALL_P.map(p => `<td class="${p > close ? 'fc-c' : 'act-c'}">${plan[p].ending[d.key] || 0}</td>`).join('');
    body += `<tr class="tot"><td>Ending headcount</td>${endCells}<td class="fy-c">${plan[decP].ending[d.key]}</td></tr>`;
    body += renderFcHcHireRow(d.locked ? `Hires ${originTag('from Sales', 'sales', { title: 'Open the Sales tab' })}` : 'Net hires / (exits)', d.key, plan, !d.locked);
    body += `<tr><td>Attrition exits</td>${fcHcCountCells(plan, row => (row.attrition && row.attrition[d.key]) || 0, true)}</tr>`;
    if (!d.locked) {
      body += `<tr><td>RIF exits</td>${fcHcCountCells(plan, row => (row.rifExits && row.rifExits[d.key]) || 0, true)}</tr>`;
      body += moneyRow('Severance (cash + P&amp;L)', d.key, 'severance');
    }
    body += moneyRow('Salaries &amp; wages', d.key, 'wages');
    body += moneyRow('Employee benefits', d.key, 'employeeBenefits');
    body += moneyRow('·· Payroll taxes', d.key, 'payrollTax');
    body += moneyRow('·· Health benefits', d.key, 'benefits');
    body += moneyRow('·· 401(k) match', d.key, 'k401');
    body += moneyRow('Bonus', d.key, 'bonusAccrual');
    body += loadedRow(loadedLabel[d.key], d.key);
    body += '</tbody>';
    html += fcHcTable(body);
  });

  const coEnd = ALL_P.map(p => `<td class="${p > close ? 'fc-c' : 'act-c'}">${plan[p].headsTotal || 0}</td>`).join('');
  const bookedOrPlan = (part, field) => (row, p) => {
    if (p <= close) return fcHcCompanyPart(p, part);
    const vals = FC_HC_DEPTS.map(d => row[field] && row[field][d.key]);
    return vals.some(x => x == null) ? null : fcHcSum(vals);
  };
  let company = head + `<tbody><tr class="sec"><td colspan="${colSpan}">Company total. January through ${getCloseMoLabel()} wages, benefits, and bonus are the booked payroll. Tax, health, and 401(k) are not split in those months.</td></tr>
    <tr class="tot"><td>Ending headcount</td>${coEnd}<td class="fy-c">${decHc}</td></tr>
    <tr><td>Net hires / (exits)</td>${fcHcCountCells(plan, row => row.hireTot || 0, false)}</tr>
    <tr><td>Attrition exits</td>${fcHcCountCells(plan, row => row.attrTot || 0, true)}</tr>
    <tr><td>RIF exits</td>${fcHcCountCells(plan, row => row.rifTot || 0, true)}</tr>
    <tr><td>Severance (cash + P&amp;L)</td>${fcHcMoneyCells(plan, (row, p) => p <= close ? null : FC_HC_DEPTS.reduce((s, d) => s + (Number(row.severance && row.severance[d.key]) || 0), 0))}</tr>
    <tr><td>Salaries &amp; wages</td>${fcHcMoneyCells(plan, bookedOrPlan('wages', 'wages'))}</tr>
    <tr><td>Employee benefits</td>${fcHcMoneyCells(plan, bookedOrPlan('benefits', 'employeeBenefits'))}</tr>
    <tr><td>Bonus</td>${fcHcMoneyCells(plan, bookedOrPlan('bonus', 'bonusAccrual'))}</tr>`;
  company += `<tr class="tot"><td>Loaded Total Payroll</td>${fcHcMoneyCells(plan, (row, p) => {
    const parts = FC_HC_DEPTS.map(d => (p <= close ? (row.glPayroll && row.glPayroll[d.key]) : (row.planPayroll && row.planPayroll[d.key] != null ? row.planPayroll[d.key] : (row.glPayroll && row.glPayroll[d.key]))));
    return parts.some(v => v == null) ? null : fcHcSum(parts);
  })}</tr></tbody>`;
  html += fcHcTable(company);
  html += `</div>`;
  area.innerHTML = html;
}

// ── SENSITIVITY ──────────────────────────────────────────────────────────────
function renderSens(area){
  const baseRes=getResults();
  const dec=FC_P[FC_P.length-1];
  const decP=ALL_P[11];
  const base_arr=(baseRes[dec]&&baseRes[dec].arr&&baseRes[dec].arr.arr_eop!=null)
    ? baseRes[dec].arr.arr_eop
    : ((getForecastARR(decP)||{}).arr_eop||0);
  const base_cash=(getDisplayCFS(decP)||{}).end_cash||0;
  const base_ebitda=FC_P.reduce((s,p)=>s+((getDisplayIS(p)||{}).ebitda||0),0);

  /** Apply temporary lever overrides via state (sidebar DOM may be unmounted on this tab). */
  function runScenario(ovr){
    const snapArr=Object.assign({},fcArrState);
    const snapCost=Object.assign({},fcCostState);
    const snapWc=Object.assign({},fcWcState);
    try{
      if(ovr.nb!=null) fcArrState.nb=ovr.nb;
      if(ovr.exp!=null) fcArrState.exp=ovr.exp;
      if(ovr.churn!=null) fcArrState.churn=ovr.churn;
      if(ovr.ren!=null) fcArrState.ren=ovr.ren;
      if(ovr.cogs!=null) fcCostState.cogs=ovr.cogs;
      if(ovr.sm!=null) fcCostState.sm=ovr.sm;
      if(ovr.rd!=null) fcCostState.rd=ovr.rd;
      if(ovr.ga!=null) fcCostState.ga=ovr.ga;
      if(ovr.dso!=null) fcWcState.dso=ovr.dso;
      if(ovr.dpo!=null) fcWcState.dpo=ovr.dpo;
      if(ovr.capexPct!=null) fcWcState.capexPct=ovr.capexPct;
      markScenarioDirty();
      const decArr=getForecastARR(decP);
      return{
        arr:decArr&&decArr.arr_eop!=null?decArr.arr_eop:0,
        cash:(getDisplayCFS(decP)||{}).end_cash||0,
        ebitda:FC_P.reduce((s,p)=>s+((getDisplayIS(p)||{}).ebitda||0),0),
      };
    } finally {
      Object.assign(fcArrState,snapArr);
      Object.assign(fcCostState,snapCost);
      Object.assign(fcWcState,snapWc);
      markScenarioDirty();
    }
  }
  const seed=fcLeverSeed();
  const plus3=k=>seed[k]!=null?seed[k]+3:null;

  const scenarios=[
    {name:'Base forecast',ovr:{},is_base:true},
    {name:'NB +10%',ovr:{nb:110}},
    {name:'NB -20%',ovr:{nb:80}},
    {name:'Churn stress +30%',ovr:{churn:130}},
    {name:'Churn reduced -20%',ovr:{churn:80}},
    {name:'Best case (NB+10, Churn-20)',ovr:{nb:110,churn:80}},
    {name:'Stress (NB-20, Churn+30)',ovr:{nb:80,churn:130}},
    {name:'Renewal rate +5pp',ovr:{ren:5}},
    {name:'All costs +3pp',ovr:{cogs:plus3('cogs'),sm:plus3('sm'),rd:plus3('rd'),ga:plus3('ga')}},
  ].filter(s=>!s.ovr.hasOwnProperty('ren')||fcRenewalsLoaded());

  const results=scenarios.map(s=>{
    if(s.is_base) return{...s,arr:base_arr,cash:base_cash,ebitda:base_ebitda};
    return{...s,...runScenario(s.ovr)};
  });

  area.innerHTML=`<div class="slide">
    <div class="slide-title">Sensitivity Analysis</div>
    <div class="slide-sub">Run scenarios on top of current assumptions without affecting saved versions · Dec ${String(YEAR).slice(2)} outcomes</div>
    ${buildKPIs(baseRes)}
    <div class="two-col">
      <div class="card">
        <div class="card-title">Scenario comparison -- Dec ARR</div>
        <div class="chart-wrap" style="height:280px"><canvas id="sensArrC" role="img" aria-label="Scenario comparison bar chart for Dec ARR">Dec ARR comparison across scenarios.</canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Scenario comparison -- H2 EBITDA</div>
        <div class="chart-wrap" style="height:280px"><canvas id="sensEbitC" role="img" aria-label="Scenario comparison for H2 EBITDA">H2 EBITDA comparison across scenarios.</canvas></div>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-title" style="margin-bottom:8px">Full scenario table</div>
      <table class="sens-tbl">
        <thead><tr><th style="text-align:left">Scenario</th><th>Dec ARR</th><th>vs Base</th><th>H2 EBITDA</th><th>vs Base</th><th>Dec Cash</th><th>vs Base</th></tr></thead>
        <tbody>${results.map(s=>{
          const ad=s.arr-base_arr, ed=s.ebitda-base_ebitda, cd=s.cash-base_cash;
          return `<tr class="${s.is_base?'base-row':''}">
            <td>${s.name}</td>
            <td>${fM(s.arr,1)}</td>
            <td class="${s.is_base?'':''+( ad>0?'pos-v':'neg-v')}">${s.is_base?'--':fV(ad)}</td>
            <td class="${s.ebitda>=0?'pos-v':'neg-v'}">${fM(s.ebitda,1)}</td>
            <td class="${s.is_base?'':''+( ed>0?'pos-v':'neg-v')}">${s.is_base?'--':fV(ed)}</td>
            <td>${fM(s.cash,1)}</td>
            <td class="${s.is_base?'':''+( cd>0?'pos-v':'neg-v')}">${s.is_base?'--':fV(cd)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>
  </div>`;
  setTimeout(()=>{
    const { cPos, cNeg, cBlue, fade, baseScaleX, baseScaleY } = chartSkinTokens();
    const cols=results.map(s=>s.is_base?fade(cPos,0.4):s.arr>base_arr?fade(cBlue,0.4):fade(cNeg,0.4));
    mk('sensArrC',{type:'bar',data:{labels:results.map(s=>s.name),datasets:[{data:results.map(s=>+(s.arr/1e6).toFixed(2)),backgroundColor:cols,borderRadius:3}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'$'+ctx.raw.toFixed(2)+'M'}}},scales:{x:{min:(base_arr*0.98)/1e6,...baseScaleY(v=>'$'+v.toFixed(0)+'M')},y:baseScaleX}}});
    const ebitCols=results.map(s=>s.ebitda>=0?fade(cPos,0.4):fade(cNeg,0.4));
    mk('sensEbitC',{type:'bar',data:{labels:results.map(s=>s.name),datasets:[{data:results.map(s=>+(s.ebitda/1e6).toFixed(2)),backgroundColor:ebitCols,borderRadius:3}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:baseScaleY(v=>'$'+v.toFixed(2)+'M'),y:baseScaleX}}});
  },40);
}

function buildForecastTableRows(res, lv, vid, orgId, asOf){
  const n=v=>(v==null||isNaN(v)?null:v);
  const rowsFor=fn=>FC_P.map(p=>{
    const r=res[p], v=r?fn(r):null;
    return v?Object.assign({forecast_version_id:vid,organization_id:orgId,version:'Forecast',period:p,as_of_period:asOf},v):null;
  }).filter(Boolean);
  const arrMoves=a=>({new_business_arr:n(a.arr_nb),expansion_arr:n(a.arr_exp),reactivation_arr:n(a.arr_react),
    contraction_arr:n(a.arr_cont),churn_arr:n(a.arr_churn),gross_renewal_arr:n(a.gross_ren),renewal_arr:n(a.arr_ren),
    net_new_arr:n(a.arr_nn),ending_arr:n(a.arr_eop)});
  return{
    forecast_mrr_waterfall:rowsFor(r=>r.arr&&Object.assign({beginning_arr:n(r.arr.arr_bop)},arrMoves(r.arr),
      {gross_retention_rate:n(r.arr.grr),net_dollar_retention_rate:n(r.arr.nrr)})),
    forecast_income_statement:rowsFor(r=>{const i=r.is;return i&&{revenue:n(i.revenue),cost_of_revenue:n(i.cogs),
      gross_profit:n(i.gross_profit),sales_and_marketing:n(i.sm),research_and_development:n(i.rd),
      general_and_administrative:n(i.ga),ebitda:n(i.ebitda),depreciation_and_amortization:n(i.da),
      interest_expense:n(i.interest),tax_expense:n(i.tax),net_income:n(i.net_income)};}),
    forecast_cash_flow_statement:rowsFor(r=>{const c=r.cfs;return c&&{beginning_cash:n(c.beg_cash),net_income:n(c.ni),
      depreciation_and_amortization:n(c.da),stock_based_compensation:n(c.sbc),change_in_accounts_receivable:n(c.chg_ar),
      change_in_deferred_revenue:n(c.chg_dr),change_in_accounts_payable:n(c.chg_ap),change_in_prepaids:n(c.chg_pre),
      net_cash_from_operating_activities:n(c.cfo),capital_expenditures:n(c.capex),net_cash_from_investing_activities:n(c.cfi),
      net_cash_from_financing_activities:n(c.cff),net_change_in_cash:n(c.net_change),ending_cash:n(c.end_cash)};}),
    forecast_balance_sheet:rowsFor(r=>{const b=r.bs;return b&&{cash:n(b.cash),accounts_receivable:n(b.ar),ppe_net:n(b.ppe),
      prepaids_and_other_current:n(b.prepaids),total_assets:n(b.total_assets),accounts_payable:n(b.ap),
      deferred_revenue:n(b.dr),debt:n(b.debt),other_liabilities:n(b.other_liab),total_liabilities:n(b.total_liab),
      equity:n(b.equity),total_liabilities_and_equity:n(b.total_le)};}),
    forecast_bookings_summary:rowsFor(r=>r.arr&&arrMoves(r.arr)),
  };
}

async function fcLoadVersionList(){
  const el=()=>document.getElementById('fcVersionList');
  const show=html=>{ const e=el(); if(e) e.outerHTML='<div id="fcVersionList">'+html+'</div>'; };
  const msg=t=>`<div style="padding:30px;text-align:center;color:var(--text3);font-size:13px">${t}</div>`;
  let orgId=null;
  try{ orgId=window.SMPLOutlook&&await window.SMPLOutlook.resolveOrgId({waitForParent:true}); }catch(e){ orgId=null; }
  if(!orgId){ show(msg('Sign in to see saved versions.')); return; }
  let list;
  try{
    const r=await fetch('/api/v1/forecast/versions?organization_id='+encodeURIComponent(orgId),{credentials:'include'});
    if(!r.ok) throw new Error(r.status);
    list=await r.json();
  }catch(e){ show(msg('Could not load saved versions.')); return; }
  if(!Array.isArray(list)||!list.length){ show(msg('No versions saved yet.<br>Save a draft to iterate, or promote to final when you\u2019re ready to report.')); return; }
  const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const when=t=>t?new Date(t).toLocaleString():'';
  const pct=v=>v==null?'—':Math.round(v*100)+'%';
  show(list.map(v=>{
    const lv=v.levers||{};
    const badge=v.status==='final'?'badge-final':v.status==='superseded'?'badge-super':'badge-draft';
    const label=v.status==='final'?'\u2713 Final':v.status==='superseded'?'Superseded':'Draft';
    return `<div class="ver-row"><div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="ver-name">${esc(v.version_name)}</span><span class="badge ${badge}">${label}</span>
        <span style="font-size:9.5px;color:var(--text3)">as of ${esc(v.as_of_period)}</span>
      </div>
      <div class="ver-meta">Saved ${esc(when(v.updated_at||v.created_at))}${v.promoted_at?' · promoted '+esc(when(v.promoted_at)):''} · NB ${pct(lv.nb)} · Churn ${pct(lv.churn)} · Exp ${pct(lv.exp)}</div>
    </div></div>`;
  }).join(''));
}

<script>
/* SMPL warehouse hydration + draft/promote API wiring */
(function(){
  async function smplOrgId(){
    return window.SMPLOutlook.resolveOrgId({ waitForParent: true });
  }
  function setWarehouseStatus(text, tone) {
    var el = document.getElementById('warehouseStatus');
    if (!el) return;
    el.textContent = text;
    el.style.color = tone === 'ok' ? 'var(--teal)' : tone === 'warn' ? 'var(--amber)' : 'var(--text2)';
  }
  async function smplHydrate(){
    if (!outlookDataReady()) {
      setWarehouseStatus('Demo seed unavailable — hard refresh (Ctrl+Shift+R)', 'warn');
    } else {
      setWarehouseStatus('Demo data (embedded seed)', 'warn');
    }
    await window.SMPLOutlook.hydrate({
      endpoint: 'reporting/outlook',
      hooks: {
        SRC: SRC,
        TS_DATA: window.SMPL_DEMO_TS_DATA,
        WF_TABLE: window.SMPL_DEMO_WF_TABLE,
      },
      onStatus: setWarehouseStatus,
      onApplied: function (data) {
        if (window.SMPLProvenance && typeof window.SMPLProvenance.ingestOutlook === 'function') {
          window.SMPLProvenance.ingestOutlook(data);
        }
        // Warehouse actuals (e.g. June ARR) land in SRC after first paint — must
        // bust the compute cache or Overview keeps the demo-seed Dec ARR ($91.1M).
        if (typeof fcHcState === 'object' && fcHcState) fcHcState.hires = null;
        fcApplyCloseMonth(data && data.meta && data.meta.close_month);
        fcSeedLevers();
        markScenarioDirty();
        refresh({ skipDirty: true });
        if (window.SMPLProvenance) {
          try {
            window.SMPLProvenance.annotateDom(document);
            window.SMPLProvenance.runTieOut();
          } catch (e) { console.warn('[forecast-engine] provenance', e); }
        }
        if (window.SMPLOutlook && window.SMPLOutlook.buildAlignmentReport) {
          console.info('[forecast-engine] alignment', window.SMPLOutlook.buildAlignmentReport(ALL_P, getCloseMonth()));
        }
      },
    });
  }
  window.saveVersion=async function(status){
    const orgId=await smplOrgId();
    if(!orgId){alert('Sign in to save forecast versions.');return;}
    if (status === 'final' && window.SMPLProvenance && typeof window.SMPLProvenance.gatePublish === 'function') {
      var gate = window.SMPLProvenance.gatePublish({ closeMonth: getCloseMonth() });
      if (gate.blocked) {
        alert('FINAL promote blocked — tie-out failed (forceBlock).\n\n' + (gate.message || '') + '\n\nClient HTML tie-out report downloaded when available.');
        return;
      }
      if (gate.result && !gate.result.passed) {
        console.warn('[forecast-engine] tie-out advisory (FINAL promote proceeds)', gate.message);
        alert(
          'FINAL promote proceeding.\n\nClient tie-out report downloaded (advisory). ' +
            'Forecast gaps are OK to review; production actuals should be fixed at import/close.\n\n' +
            (gate.message || ''),
        );
      }
    }
    const res=getResults();
    const lv=getLevers();
    const name=prompt('Name this '+(status==='final'?'FINAL':'draft')+' version:','Forecast '+new Date().toLocaleDateString());
    if(!name) return;
    const vid='V'+Date.now();
    const asOf=getCloseMonth();
    const savedPacket=typeof window.buildForecastAssurancePacket==='function'?window.buildForecastAssurancePacket():null;
    const tables=typeof buildForecastTableRows==='function'?buildForecastTableRows(res,lv,vid,orgId,asOf):{};
    const body={
      version_name:name,
      as_of_period:asOf,
      levers:lv,
      req_active:reqActive,
      results:{engine:res},
      tables:tables
    };
    const draftRes=await fetch('/api/v1/forecast/versions/draft?organization_id='+encodeURIComponent(orgId),{
      method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
    });
    if(!draftRes.ok){alert('Draft save failed: '+await draftRes.text());return;}
    const draft=await draftRes.json();
    if (savedPacket) fcSavePaBinding(draft.id, savedPacket, orgId);
    if(status==='final'){
      const promoteRes=await fetch('/api/v1/forecast/versions/'+draft.id+'/promote?organization_id='+encodeURIComponent(orgId),{
        method:'POST',credentials:'include'
      });
      if(!promoteRes.ok){alert('Promote failed: '+await promoteRes.text());return;}
    }
    // Assess the forecast exactly as saved, before hydrate reloads warehouse data.
    let paNote = '';
    if (savedPacket) {
      try {
        const sim = await fetchForecastMonteCarlo({ packet: savedPacket, orgId });
        const a = await window.runForecastPlanAssessment({
          packet: savedPacket,
          orgId,
          forecast_version_id: draft.id,
          simulation: fcSimulationSummaryFromMc(sim && sim.result),
        });
        if (a && (a.persisted || a.version_assessment_id)) paNote = '\n\nPlan Assurance assessment saved against this version.';
      } catch (e) { console.warn('[forecast-assurance] version assessment', e); }
    }
    if(status==='final'){
      alert('Promoted to FINAL and loaded into warehouse.'+paNote);
      await smplHydrate();
    } else {
      alert('Draft saved server-side.'+paNote);
    }
    if(typeof showTab==='function') showTab('versions',null);
  };
  window.SMPL_ON_ORG_READY=function(){void smplHydrate();};
  window.addEventListener('load',()=>{void smplHydrate();});

  /**
   * Plan Assurance Forecast adapter — same /assess engine as Budget.
   * Packet built from live Forecast SoT (see buildForecastAssurancePacket).
   */
  window.buildForecastAssurancePacket = function() {
    if (typeof buildFcAssurancePacket === 'function') return buildFcAssurancePacket();
    return null;
  };

  window.runForecastPlanAssessment = async function(opts) {
    opts = opts || {};
    const packet = opts.packet || window.buildForecastAssurancePacket();
    if (!packet) { console.warn('[forecast-assurance] no packet'); return null; }
    let orgId = opts.orgId;
    if (!orgId && window.SMPLOutlook && window.SMPLOutlook.resolveOrgId) {
      try { orgId = await window.SMPLOutlook.resolveOrgId({ waitForParent: true }); } catch (e) { orgId = null; }
    }
    if (!orgId) { console.warn('[forecast-assurance] no org'); return null; }
    const planFp = fcPaPacketFingerprint(packet);
    const forecastVersionId = opts.forecast_version_id != null
      ? opts.forecast_version_id
      : forecastVersionBinding(packet, orgId);
    const simulation = opts.simulation !== undefined
      ? opts.simulation
      : (window._forecastMcFp === planFp ? fcSimulationSummaryFromMc(window._forecastServerMc) : null);
    // One persisted row per (version, simulation): re-assessing the same saved
    // forecast with the same draws does not write a duplicate.
    const persistKey = forecastVersionId ? forecastVersionId + '|' + JSON.stringify(simulation || null) : null;
    const prior = window._fcPaPersisted && window._fcPaPersisted.key === persistKey ? window._fcPaPersisted.id : null;
    const body = {
      plan_ref: {
        organization_id: orgId,
        forecast_version_id: forecastVersionId,
        scenario: 'forecast',
        period_label: packet.period_label,
        budget_year: packet.budget_year,
      },
      packet,
      persist: !!forecastVersionId && !prior,
      plan_fingerprint: planFp,
      include_passing_conditions: false,
    };
    if (simulation) body.simulation = simulation;
    const res = await fetch('/api/v1/predictive-planning/assess', {
      method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) { console.warn('[forecast-assurance] /assess failed', res.status, await res.text()); return null; }
    const assessment = await res.json();
    if (assessment.persisted && assessment.assessment_id) {
      window._fcPaPersisted = { key: persistKey, id: assessment.assessment_id };
    } else if (prior) {
      assessment.version_assessment_id = prior;
    }
    window._forecastPlanAssessment = assessment;
    window._forecastPlanAssessmentAt = Date.now();
    return assessment;
  };
})();
</script>
