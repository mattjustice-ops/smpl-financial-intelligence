        ? ` Dec NB includes a <strong>${fmtM(plan._yoYPlug)}</strong> plug so ending ARR hits ${fmtM(plan._targetDec)}.`
        : ''
    }</div>`;
  if (histScaled) {
    html += `<div class="ctx-banner warn"><strong>FY26 hist aligned to Jan lock</strong> · context path scaled ×${histScale.toFixed(4)} so Dec '26 ends at <strong>${fmtM(BOP_LOCK)}</strong> (was demo/warehouse ~$97.56M). Live outlook hydrate should supply the board forecast series directly.</div>`;
  } else if (dec26 != null && Math.abs(dec26 - BOP_LOCK) > 5e4) {
    html += `<div class="ctx-banner warn"><strong>FY26 hist ≠ Jan lock</strong> · Dec '26 ending is <strong>${fmtM(dec26)}</strong> vs lock <strong>${fmtM(BOP_LOCK)}</strong>.</div>`;
  }

  const sections = [
    { sec: 'Component mix (% of beginning ARR)', rows: [
      { k: 'mix_nb', label: 'New business % of BOP', mix: 'nb' },
      { k: 'mix_exp', label: 'Expansion % of BOP', mix: 'exp' },
      { k: 'mix_react', label: 'Reactivation % of BOP', mix: 'react' },
      { k: 'mix_cont', label: 'Contraction % of BOP', mix: 'cont' },
      { k: 'mix_churn', label: 'Churn % of BOP', mix: 'churn' },
    ], mix: true },
    { sec: 'Waterfall detail ($)', rows: [
      { k: 'bop', label: 'Beginning ARR', f: r => r.bop },
      { k: 'nb', label: '+ New business', f: r => r.nb },
      { k: 'exp', label: '+ Expansion', f: r => r.exp },
      { k: 'react', label: '+ Reactivation', f: r => r.react },
      { k: 'cont', label: '− Contraction', f: r => r.cont, neg: true },
      { k: 'churn', label: '− Churn', f: r => r.churn, neg: true },
      { k: 'nn', label: '= Net new ARR', f: r => r.nn, tot: true },
      { k: 'eop', label: 'Ending ARR', f: r => r.eop, tot: true },
      { k: 'grr', label: 'GRR', f: r => r.grr, pct: true },
      { k: 'nrr', label: 'NDR', f: r => r.nrr, pct: true },
    ]},
  ];

  for (const sec of sections) {
    html += `<table class="bud-tbl"><thead><tr>${buildTableHeaders()}</tr></thead><tbody>`;
    html += `<tr class="sec"><td colspan="${colSpan}">${sec.sec}</td></tr>`;
    for (const row of sec.rows) {
      html += `<tr${rowClassAttr({ tot: row.tot, adj: !!(sec.mix && row.mix) })}><td>${row.label}${row.k === 'bop' ? '<span class="lock-tag">Jan locked</span>' : ''}</td>`;
      for (const q of CTX_QUARTERS) {
        html += `<td class="ctx-c">${quarterCtxCell(q, row)}</td>`;
      }
      for (const p of BUD_P) {
        const r = plan[p];
        let val = '—';
        if (sec.mix && row.mix) {
          val = mixInput(p, row.mix, getMix(p)[row.mix]);
        } else if (r && row.f) {
          const v = row.f(r);
          val = row.pct ? fmtPct(v) : fmtM(row.neg ? -Math.abs(v) : v);
        }
        html += `<td class="bud-c">${val}</td>`;
      }
      html += `<td class="fy-c">${fyPlanValue(plan, row)}</td>`;
      html += `<td class="notes-c">${noteInput(row.k)}</td></tr>`;
    }
    html += '</tbody></table>';
  }

  // ARR → Billings → Deferred → Subscription revenue (feeds IS)
  html += `<div id="rev-bridge" style="margin-top:22px"></div>`;
  html += `
    <div class="slide-title" style="font-size:18px;margin-top:8px">Revenue bridge · ARR ≠ subscription revenue</div>
    <div class="slide-sub">Billings from the ARR book (monthly run-rate + annual NB upfront). Deferred rolls from Dec close with ARR, plus unearned annual NB. <strong>Subscription revenue = Beg DR + Billings − End DR</strong> → ${originTag('Income Statement', 'is', { title: 'Open Income Statement' })}.</div>
    <div class="ctx-banner">FY billings ${fmtM(fyBill)} · FY subscription ${fmtM(fySub)} · Δ (billings − sub) ${fmtM(fyBill - fySub)} = FY Δ deferred. Annual NB billing ${annualPct.toFixed(0)}%${STATE.annualBillPct == null ? ' (from Dec DR depth)' : ''}.</div>`;

  const bridgeRows = [
    { type: 'sec', label: 'From ARR book' },
    { k: 'bopArr', label: 'Beginning ARR', f: r => r.bopArr },
    { k: 'eopArr', label: 'Ending ARR', f: r => r.eopArr },
    { k: 'runRate', label: 'Ending ARR ÷ 12 (run-rate)', f: r => r.runRate },
    { type: 'sec', label: 'Billings' },
    { k: 'billingsRecurring', label: 'Recurring billings (BOP ÷ 12)', f: r => r.billingsRecurring, indent: true },
    { k: 'billingsNbMonthly', label: '+ NB monthly billings', f: r => r.billingsNbMonthly, indent: true },
    { k: 'billingsNbAnnual', label: '+ NB annual upfront billings', f: r => r.billingsNbAnnual, indent: true },
    { k: 'billings', label: 'Total billings', f: r => r.billings, tot: true },
    { type: 'sec', label: 'Deferred revenue' },
    { k: 'begDR', label: 'Beginning deferred', f: r => r.begDR, indent: true },
    { k: 'chg_dr', label: 'Δ Deferred (billings − sub rev)', f: r => r.chg_dr, indent: true },
    { k: 'endDR', label: 'Ending deferred', f: r => r.endDR, indent: true },
    { type: 'sec', label: 'Recognized revenue' },
    { k: 'sub', label: 'Subscription revenue → IS', f: r => r.sub, tot: true },
  ];

  html += `<table class="bud-tbl"><thead><tr>${buildTableHeaders()}</tr></thead><tbody>`;
  for (const row of bridgeRows) {
    if (row.type === 'sec') {
      html += `<tr class="sec"><td colspan="${colSpan}">${row.label}</td></tr>`;
      continue;
    }
    const cls = [row.tot ? 'tot' : '', row.indent ? 'is-indent' : ''].filter(Boolean).join(' ');
    html += `<tr${cls ? ` class="${cls}"` : ''}><td>${row.label}${row.k === 'sub' ? originTag('→ IS', 'is', { title: 'Open Income Statement' }) : ''}</td>`;
    for (const q of CTX_QUARTERS) html += `<td class="ctx-c"><span style="color:var(--text3)">—</span></td>`;
    for (const p of BUD_P) html += `<td class="bud-c">${fmtM(row.f(bridge[p]))}</td>`;
    const fy = row.k === 'endDR' || row.k === 'begDR' || row.k === 'bopArr' || row.k === 'eopArr' || row.k === 'runRate'
      ? (row.k === 'begDR' ? fmtM(bridge[BUD_P[0]].begDR) : row.k === 'endDR' || row.k === 'eopArr' || row.k === 'runRate' ? fmtM(row.f(bridge[BUD_P[11]])) : fmtM(bridge[BUD_P[0]].bopArr))
      : fmtM(BUD_P.reduce((s, p) => s + (row.f(bridge[p]) || 0), 0));
    html += `<td class="fy-c">${fy}</td>`;
    html += `<td class="notes-c">${noteInput('bridge_' + row.k)}</td></tr>`;
  }
  html += '</tbody></table>';
  return html;
}

function quarterGtmCtxCell(q, row) {
  const qg = buildQuarterGtm(q);
  if (!qg.nb && !qg.spend) return '<span style="color:var(--text3)">—</span>';
  if (row.channel || row.channelMix || row.channelCpl || row.channelSpend || row.channelMql) {
    return '<span style="color:var(--text3)">—</span>';
  }
  if (row.rate) {
    const v = qg.rates[row.rate];
    if (row.pct) return fmtPct(v);
    if (row.rate === 'cpl') return fmtK(v, 1);
    if (row.rate === 'avgAcv') return fmtK(v, 0);
    return fmtK(v);
  }
  if (row.k === 'nb') return fmtM(qg.nb);
  if (row.k === 'closedLogos') return fmtN(qg.closedLogos);
  if (row.k === 'oppsToClose') return fmtN(qg.oppsToClose);
  if (row.k === 'pipelineDollar') return fmtM(qg.pipelineDollar);
  if (row.k === 'pipelineOpps') return fmtN(qg.pipelineOpps);
  if (row.k === 'mqls') return fmtN(qg.mqls);
  if (row.k === 'channelMqls') return '<span style="color:var(--text3)">—</span>';
  if (row.k === 'spend') return fmtM(qg.spend);
  if (row.k === 'smTotal') return fmtM(qg.smTotal);
  return '—';
}

function fyGtmValue(plan, arrPlan, row) {
  if (row.channelMix) {
    const avg = BUD_P.reduce((s, p) => s + (plan[p].channels[row.channel]?.mix || 0), 0) / BUD_P.length;
    return (avg * 100).toFixed(1) + '% avg';
  }
  if (row.channelCpl) {
    const avg = BUD_P.reduce((s, p) => s + (plan[p].channels[row.channel]?.cpl || 0), 0) / BUD_P.length;
    return fmtK(avg, 1) + ' avg';
  }
  if (row.channelSpend) {
    return fmtM(BUD_P.reduce((s, p) => s + (plan[p].channels[row.channel]?.spend || 0), 0));
  }
  if (row.channelMql) {
    return fmtN(BUD_P.reduce((s, p) => s + (plan[p].channels[row.channel]?.mqls || 0), 0));
  }
  if (row.rate) {
    const avg = BUD_P.reduce((s, p) => s + plan[p].rates[row.rate], 0) / BUD_P.length;
    if (row.pct) return (avg * 100).toFixed(1) + '% avg';
    if (row.rate === 'cpl') return fmtK(avg, 1) + ' avg';
    if (row.rate === 'avgAcv') return fmtK(avg, 0) + ' avg';
    return fmtK(avg) + ' avg';
  }
  if (row.k === 'nb') return fmtM(BUD_P.reduce((s, p) => s + arrPlan[p].nb, 0));
  if (row.k === 'closedLogos') return fmtN(BUD_P.reduce((s, p) => s + plan[p].closedLogos, 0));
  if (row.k === 'oppsToClose') return fmtN(BUD_P.reduce((s, p) => s + plan[p].oppsToClose, 0));
  if (row.k === 'pipelineDollar') return fmtM(BUD_P.reduce((s, p) => s + plan[p].pipelineDollar, 0));
  if (row.k === 'pipelineOpps') return fmtN(BUD_P.reduce((s, p) => s + plan[p].pipelineOpps, 0));
  if (row.k === 'mqls') return fmtN(BUD_P.reduce((s, p) => s + plan[p].mqls, 0));
  if (row.k === 'channelMqls') return fmtN(BUD_P.reduce((s, p) => s + (plan[p].channelMqls || 0), 0));
  if (row.k === 'spend') return fmtM(BUD_P.reduce((s, p) => s + plan[p].spend, 0));
  if (row.k === 'smTotal') return fmtM(BUD_P.reduce((s, p) => s + plan[p].smTotal, 0));
  if (row.k === 'mix_tot') {
    const avg = BUD_P.reduce((s, p) => s + (plan[p].mixRawSum || 0), 0) / BUD_P.length;
    return (avg * 100).toFixed(1) + '% avg';
  }
  return '—';
}

function gtmCountOrMoney(row, v) {
  if (row.k === 'mqls' || row.k === 'channelMqls' || row.k === 'oppsToClose' || row.k === 'pipelineOpps' || row.k === 'closedLogos' || row.channelMql) return fmtN(v);
  return fmtM(v);
}

function renderGTM() {
  const plan = computeGtmPlan();
  const arrPlan = computeBudgetArr();
  const colSpan = 1 + CTX_QUARTERS.length + BUD_P.length + 2;
  const fySpend = BUD_P.reduce((s, p) => s + plan[p].spend, 0);
  const fyChMql = BUD_P.reduce((s, p) => s + (plan[p].channelMqls || 0), 0);
  const fyReqMql = BUD_P.reduce((s, p) => s + plan[p].mqls, 0);
  const fyRawMql = BUD_P.reduce((s, p) => s + (plan[p].channelMqlsRaw || 0), 0);

  let html = `
    <div class="slide-title">GTM / Pipeline · FY${BUDGET_YEAR} Plan</div>
    <div class="slide-sub">Funnel sets <strong>MQLs required</strong>. Program spend = MQLs × blended CPL. Channel mix splits $, and channel CPL allocates the <em>same</em> required MQLs by relative efficiency (totals match).</div>
    ${adjLegend()}
    <div class="ctx-banner">Demand from ${originTag('ARR', 'arr', { title: 'Open ARR' })}. FY program ${fmtM(fySpend)} · MQLs required ${fmtN(fyReqMql)} · channel MQLs ${fmtN(fyChMql)}${fyRawMql > 0 && Math.abs(fyRawMql - fyReqMql) > 1 ? ` <span style="color:var(--text3)">(raw spend÷CPL would be ${fmtN(fyRawMql)} — scaled to funnel)</span>` : ''}.</div>`;

  const sections = [
    { sec: 'Funnel assumptions (editable per month)', rows: [
      { k: 'gtm_acv', label: 'Avg new logo ACV ($k)', rate: 'avgAcv', editable: true },
      { k: 'gtm_opp_close', label: 'Opportunity → Closed %', rate: 'oppClose', pct: true, editable: true },
      { k: 'gtm_mql_opp', label: 'MQL → Opportunity %', rate: 'mqlOpp', pct: true, editable: true },
      { k: 'gtm_cpl', label: 'Blended cost per MQL ($k)', rate: 'cpl', editable: true },
    ], rates: true },
    { sec: 'Demand anchor (from ARR)', rows: [
      { k: 'nb', label: 'New business ARR ($)', fromArr: true, tot: true },
    ]},
    { sec: 'Derived funnel', rows: [
      { k: 'closedLogos', label: 'Closed won (logos)', f: r => r.closedLogos },
      { k: 'oppsToClose', label: 'Opportunities to close', f: r => r.oppsToClose },
      { k: 'pipelineDollar', label: 'Pipeline required ($)', f: r => r.pipelineDollar, hint: `${STATE.pipelineCoverageMult.toFixed(1)}× NB` },
      { k: 'pipelineOpps', label: 'Pipeline opps (count)', f: r => r.pipelineOpps },
      { k: 'mqls', label: 'MQLs required', f: r => r.mqls, tot: true },
      { k: 'spend', label: 'Marketing spend total ($)', f: r => r.spend, tot: true },
    ]},
    { sec: 'Channel mix (% of total spend)', channelMix: true, rows: [
      ...GTM_CHANNELS.map(ch => ({ k: 'mix_' + ch.key, label: ch.label, channel: ch.key, channelMix: true })),
      { k: 'mix_tot', label: 'Mix total (raw)', tot: true, mixTot: true },
    ]},
    { sec: 'Channel CPL ($k) — efficiency', channelCpl: true, rows: [
      ...GTM_CHANNELS.map(ch => ({ k: 'cpl_' + ch.key, label: ch.label + ' CPL', channel: ch.key, channelCpl: true })),
    ]},
    { sec: 'Channel spend (→ Marketing P&L)', channelSpend: true, rows: [
      ...GTM_CHANNELS.map(ch => ({ k: 'spend_' + ch.key, label: ch.label, channel: ch.key, channelSpend: true, f: r => r.channels[ch.key].spend })),
      { k: 'spend', label: 'Total program spend', f: r => r.spend, tot: true },
    ]},
    { sec: 'Channel MQLs (allocate funnel required by spend÷CPL efficiency)', channelMql: true, rows: [
      ...GTM_CHANNELS.map(ch => ({ k: 'mql_' + ch.key, label: ch.label + ' MQLs', channel: ch.key, channelMql: true, f: r => r.channels[ch.key].mqls })),
      { k: 'channelMqls', label: 'Total channel MQLs (= required)', f: r => r.channelMqls, tot: true },
      { k: 'mqls', label: 'MQLs required (funnel)', f: r => r.mqls },
    ]},
    { sec: 'Implied S&M (reference)', rows: [
      { k: 'smTotal', label: 'Implied S&M ($)', f: r => r.smTotal, tot: true },
    ]},
  ];

  for (const sec of sections) {
    html += `<table class="bud-tbl gtm-tbl"><thead><tr>${buildTableHeaders({ lineWidth: 220 })}</tr></thead><tbody>`;
    html += `<tr class="sec"><td colspan="${colSpan}">${sec.sec}</td></tr>`;
    for (const row of sec.rows) {
      const hint = row.fromArr ? originTag('from ARR', 'arr', { title: 'Open ARR' })
        : row.hint ? `<span class="lock-tag">${row.hint}</span>`
        : row.channelSpend ? originTag('→ P&L', 'pnl', { plDept: 'marketing', title: 'Open Marketing P&L' })
        : '';
      html += `<tr${rowClassAttr({
        tot: row.tot,
        adj: !!(row.editable || row.channelMix || row.channelCpl),
      })}><td>${row.label}${hint}</td>`;
      for (const q of CTX_QUARTERS) {
        html += `<td class="ctx-c">${quarterGtmCtxCell(q, row)}</td>`;
      }
      for (const p of BUD_P) {
        const r = plan[p];
        let val = '—';
        if (sec.rates && row.editable && row.rate) {
          val = rateInput(p, row.rate, getGtmRates(p)[row.rate], row.pct);
        } else if (row.channelMix) {
          val = channelMixInput(p, row.channel, getGtmChannelMix(p)[row.channel]);
        } else if (row.mixTot) {
          val = ((r.mixRawSum || 0) * 100).toFixed(1) + '%';
        } else if (row.channelCpl) {
          val = channelCplInput(p, row.channel, getGtmChannelCpl(p)[row.channel]);
        } else if (row.fromArr) {
          val = fmtM(arrPlan[p].nb);
        } else if (row.rate && r && r.rates) {
          const v = r.rates[row.rate];
          if (row.pct) val = fmtPct(v);
          else if (row.rate === 'cpl' || row.rate === 'avgAcv') val = fmtK(v, row.rate === 'cpl' ? 1 : 0);
          else val = fmtK(v);
        } else if (r && row.f) {
          val = gtmCountOrMoney(row, row.f(r));
        }
        html += `<td class="bud-c">${val}</td>`;
      }
      html += `<td class="fy-c">${fyGtmValue(plan, arrPlan, row)}</td>`;
      html += `<td class="notes-c">${noteInput(row.k)}</td></tr>`;
    }
    html += '</tbody></table>';
  }
  return html;
}

function hireInput(period, dept, val) {
  const esc = period.replace(/'/g, "\\'");
  return `<input type="number" class="hire-input ${hireDeltaClass(val)}" step="1" min="-20" max="20" value="${Math.round(val)}"
    onchange="updateHcHire('${esc}','${dept}', this.value)">`;
}

function hireLevelInput(period, dept, level, val) {
  const esc = period.replace(/'/g, "\\'");
  return `<input type="number" class="hire-input ${hireDeltaClass(val)}" step="1" min="-20" max="20" value="${Math.round(val)}"
    onchange="updateHcHireLevel('${esc}','${dept}','${level}', this.value)">`;
}

function hcNumInput(value, onchange, step, min) {
  return `<input type="number" class="mix-input" step="${step == null ? 1 : step}" min="${min == null ? 0 : min}" value="${value}"
    onchange="${onchange}">`;
}

function salesHireInput(period, group, val) {
  const esc = period.replace(/'/g, "\\'");
  return `<input type="number" class="hire-input ${hireDeltaClass(val)}" step="1" min="0" max="20" value="${Math.round(val)}"
    onchange="updateSalesHire('${esc}','${group}', this.value)">`;
}

function salesSegmentLabel(s) {
  return `${s.region} · ${s.group === 'nb' ? 'NB' : 'CS'} · ${s.role}`;
}

function sumSegments(segs, pred) {
  return segs.filter(pred).reduce((n, s) => n + s.fy26Annual, 0);
}

function sumSegmentsFy27(segs, pred) {
  return segs.filter(pred).reduce((n, s) => n + s.fy27Existing, 0);
}

function sumHeads(segs, pred) {
  return segs.filter(pred).reduce((n, s) => n + s.heads, 0);
}

/** Book or per-head quota across FY26 Q + FY27 months. */
function renderSalesQuotaRow(label, fy26Annual, fy27Annual, opts) {
  const tot = opts && opts.tot;
  const noteKey = opts && opts.noteKey ? opts.noteKey : ('sq_' + label);
  const hint = opts && opts.hint ? `<span class="lock-tag">${opts.hint}</span>` : '';
  let html = `<tr${tot ? ' class="tot"' : ''}><td>${label}${hint}</td>`;
  const q = fy26Annual / 4;
  for (const _ of CTX_QUARTERS) html += `<td class="ctx-c">${fmtM(q)}</td>`;
  const m = fy27Annual / 12;
  for (const _ of BUD_P) html += `<td class="bud-c">${fmtM(m)}</td>`;
  html += `<td class="fy-c">${fmtM(fy27Annual)}</td>`;
  html += `<td class="notes-c">${noteInput(noteKey)}</td></tr>`;
  return html;
}

/** Ending-head ramp: FY26 quarters + FY27 months. */
function renderSalesHeadRampRow(label, fy26QEnds, fy27Months, opts) {
  const tot = opts && opts.tot;
  const noteKey = opts && opts.noteKey ? opts.noteKey : ('sh_' + label);
  let html = `<tr${tot ? ' class="tot"' : ''}><td>${label}</td>`;
  for (let i = 0; i < CTX_QUARTERS.length; i++) {
    html += `<td class="ctx-c">${fmtN(fy26QEnds[i] || 0)}</td>`;
  }
  for (let i = 0; i < BUD_P.length; i++) {
    html += `<td class="bud-c">${fmtN(fy27Months[i] || 0)}</td>`;
  }
  const fyEnd = fy27Months.length ? fy27Months[fy27Months.length - 1] : 0;
  html += `<td class="fy-c">${fmtN(fyEnd)}</td>`;
  html += `<td class="notes-c">${noteInput(noteKey)}</td></tr>`;
  return html;
}

function renderSalesQuotaMonthsRow(label, months12, opts) {
  const tot = opts && opts.tot;
  const cls = opts && opts.cls ? opts.cls : '';
  const noteKey = opts && opts.noteKey ? opts.noteKey : ('sqm_' + label);
  const hint = opts && opts.hint ? `<span class="lock-tag">${opts.hint}</span>` : '';
  const fy = months12.reduce((a, b) => a + b, 0);
  const classes = [cls, tot ? 'tot' : ''].filter(Boolean).join(' ');
  let html = `<tr${classes ? ` class="${classes}"` : ''}><td>${label}${hint}</td>`;
  for (const _ of CTX_QUARTERS) html += `<td class="ctx-c"><span style="color:var(--text3)">—</span></td>`;
  for (let i = 0; i < BUD_P.length; i++) {
    const v = months12[i] || 0;
    html += `<td class="bud-c">${v ? fmtM(v) : '<span style="color:var(--text3)">—</span>'}</td>`;
  }
  html += `<td class="fy-c">${fy ? fmtM(fy) : '—'}</td>`;
  html += `<td class="notes-c">${noteInput(noteKey)}</td></tr>`;
  return html;
}

function fmtOuInline(v) {
  if (v == null || isNaN(v)) return '—';
  if (Math.abs(v) < 0.5) return fmtM(0);
  return (v > 0 ? '+' : '') + fmtM(v);
}

function renderSales() {
  const sales = computeSalesPlan();
  const m = sales.meta;
  const tie = salesTieOutDrivers();
  const colSpan = 1 + CTX_QUARTERS.length + BUD_P.length + 2;
  const segs = sales.segments;
  const autoTag = !STATE._salesHireManual ? '<span class="lock-tag">auto from gap</span>' : '';
  const rampTag = `${Math.round(HIRE_QUOTA_RAMP[0] * 100)}/${Math.round(HIRE_QUOTA_RAMP[1] * 100)}/100`;
  const fmtSignedGap = (signed) => signed < 0 ? `(${fmtM(-signed)}) surplus` : fmtM(signed);
  const tieWarn = tie.usedDemoFallback || tie.histThin;

  let html = `
    <div class="slide-title">Sales · FY${BUDGET_YEAR} Plan</div>
    <div class="slide-sub">Hires = (budget − existing full quota book) ÷ avg $/head. Ramp ${rampTag} shapes capacity in the waterfall only — it does not multiply headcount. Quotas ${m.quotaYoyLiftPct ? `+${m.quotaYoyLiftPct.toFixed(0)}% vs FY26` : 'flat vs FY26'}.</div>
    ${adjLegend()}
    <div class="ctx-banner tie${tieWarn ? ' warn' : ''}">
      <strong>Sales tie-out</strong> · hist <code>${tie.histSource}</code>
      (${tie.monthsWithArr}/12 mo${tie.monthsDemoFallback ? `, ${tie.monthsDemoFallback} demo-fallback` : ''})
      · FY26 NB <strong>${fmtM(tie.fy26Nb)}</strong>
      · Exp <strong>${fmtM(tie.fy26Exp)}</strong>
      · churn+cont <strong>${fmtM(tie.churnBase)}</strong>
      · scale NB/CS <strong>${(m.scaleNb26 || 0).toFixed(2)}× / ${(m.scaleCs26 || 0).toFixed(2)}×</strong>
      · books NB/CS <strong>${fmtM(tie.existingNbQuota)}</strong> / <strong>${fmtM(tie.existingCsQuota)}</strong>
      · demand NB/CS <strong>${fmtM(tie.fyNb)}</strong> / <strong>${fmtM(tie.csDemand)}</strong>
      (CS floor ${fmtM(tie.csFloor)})
      · annual gap NB/CS <strong>${fmtSignedGap(tie.nbGapSigned)}</strong> / <strong>${fmtSignedGap(tie.csGapSigned)}</strong>
      → hires <strong>${tie.nbGrowthHires}</strong> / <strong>${tie.csGrowthHires}</strong>
      · monthly O/U FY <strong>${fmtOuInline(tie.nbOuFy)}</strong> / <strong>${fmtOuInline(tie.csOuFy)}</strong>
      ${tieWarn ? '<span style="display:block;margin-top:4px">⚠ Live warehouse had empty NB/Exp for some months — using demo hist so quota scale is not forced to 1× (unscaled ~$33M seed book). Match this banner on localhost vs /app after deploy.</span>' : ''}
    </div>
    <div class="ctx-banner">
      NB budget <strong>${fmtM(m.fyNb)}</strong>
      − book <strong>${fmtM(m.existingNbQuota)}</strong> (avg <strong>${fmtM(m.avgNbQuota)}</strong>/AE)
      = gap <strong>${(m.nbGapSigned != null ? m.nbGapSigned : m.hireNbTarget) < 0 ? '(' + fmtM(-(m.nbGapSigned != null ? m.nbGapSigned : 0)) + ') surplus' : fmtM(m.hireNbTarget)}</strong>
      → <strong>${m.nbGrowthHires} NB growth</strong>
      (+${m.nbAttritionReplace} backfill) · need <strong>${fmtN(m.aeNeeded)}</strong> AEs.
      CS: gap <strong>${(m.csGapSigned != null ? m.csGapSigned : m.hireCsTarget) < 0 ? '(' + fmtM(-(m.csGapSigned != null ? m.csGapSigned : 0)) + ') surplus' : fmtM(m.hireCsTarget)}</strong> ÷ <strong>${fmtM(m.avgCsQuota)}</strong>
      → <strong>${m.csGrowthHires} CS growth</strong>
      (+${m.csAttritionReplace} backfill) · need <strong>${fmtN(m.csNeeded)}</strong> CS.
      Combined growth <strong>${m.nbGrowthHires + m.csGrowthHires}</strong>
      · with attrition <strong>${m.nbHiresNeed + m.csHiresNeed}</strong>.
      Dec NB/CS <strong>${fmtN(m.decAes)}</strong> / <strong>${fmtN(m.decCs)}</strong>.
      <span style="display:block;margin-top:4px;font-size:10px;color:var(--text3)">Seed role-card book (unscaled) ${fmtM(m.seedNbBook)} · FY26 NB hist ${fmtM(m.fy26Nb)}${m.fy26Nb > 0 ? '' : ' (hist missing → seed used as-is)'}.</span>
    </div>`;

  // 1 —— By group
  html += `<table class="bud-tbl sales-tbl"><thead><tr>${buildTableHeaders({ lineWidth: 280 })}</tr></thead><tbody>`;
  html += `<tr class="sec"><td colspan="${colSpan}">Total quota by sales group (existing bench = full watermark book)</td></tr>`;
  html += renderSalesQuotaRow('New Business', sumSegments(segs, s => s.group === 'nb'), sumSegmentsFy27(segs, s => s.group === 'nb'), { tot: true, noteKey: 'grp_nb' });
  html += renderSalesQuotaRow('Customer Success (expansion)', sumSegments(segs, s => s.group === 'cs'), sumSegmentsFy27(segs, s => s.group === 'cs'), { tot: true, noteKey: 'grp_cs' });
  html += renderSalesQuotaRow('Total quota', sumSegments(segs, () => true), sumSegmentsFy27(segs, () => true), { tot: true, noteKey: 'grp_tot' });
  html += '</tbody></table>';

  // 2 —— By region
  html += `<table class="bud-tbl sales-tbl"><thead><tr>${buildTableHeaders({ lineWidth: 280 })}</tr></thead><tbody>`;
  html += `<tr class="sec"><td colspan="${colSpan}">Total quota by region</td></tr>`;
  for (const region of ['NAM', 'EMEA', 'APAC']) {
    html += renderSalesQuotaRow(region, sumSegments(segs, s => s.region === region), sumSegmentsFy27(segs, s => s.region === region), { noteKey: 'reg_' + region });
  }
  html += renderSalesQuotaRow('Total quota', sumSegments(segs, () => true), sumSegmentsFy27(segs, () => true), { tot: true, noteKey: 'reg_tot' });
  html += '</tbody></table>';

  // 3 —— Per-head detail
  html += `<table class="bud-tbl sales-tbl"><thead><tr>${buildTableHeaders({ lineWidth: 280 })}</tr></thead><tbody>`;
  html += `<tr class="sec"><td colspan="${colSpan}">Quota per head by region · group · role (FY27 = FY26 watermark${m.quotaYoyLiftPct ? ` + ${m.quotaYoyLiftPct.toFixed(0)}%` : ' · flat YoY'})</td></tr>`;
  for (const s of segs) {
    html += renderSalesQuotaRow(
      salesSegmentLabel(s),
      s.fy25Quota,
      s.fy27PerHead,
      { noteKey: 'ph_' + s.id }
    );
  }
  html += '</tbody></table>';

  // 4 —— Headcount ramp
  html += `<table class="bud-tbl sales-tbl"><thead><tr>${buildTableHeaders({ lineWidth: 280 })}</tr></thead><tbody>`;
  html += `<tr class="sec"><td colspan="${colSpan}">Ending heads by region · group · role — FY26 ramp into Dec bench · FY27 = hires − ${m.attritionPct.toFixed(0)}% attrition</td></tr>`;
  for (const s of segs) {
    const fy27Months = BUD_P.map(p => sales.byPeriod[p].segEnds[s.id] || 0);
    html += renderSalesHeadRampRow(salesSegmentLabel(s), s.fy26QEnds, fy27Months, { noteKey: 'hd_' + s.id });
  }
  const nbFy26Q = CTX_QUARTERS.map((_, qi) => quarterEndFromRamp(sales.fy26NbRamp, qi));
  const csFy26Q = CTX_QUARTERS.map((_, qi) => quarterEndFromRamp(sales.fy26CsRamp, qi));
  html += renderSalesHeadRampRow('New Business heads', nbFy26Q, BUD_P.map(p => sales.byPeriod[p].endingAes), { tot: true, noteKey: 'hd_nb' });
  html += renderSalesHeadRampRow('Customer Success heads', csFy26Q, BUD_P.map(p => sales.byPeriod[p].endingCs), { tot: true, noteKey: 'hd_cs' });
  html += renderSalesHeadRampRow(
    'Total heads',
    nbFy26Q.map((n, i) => n + csFy26Q[i]),
    BUD_P.map(p => sales.byPeriod[p].endingAes + sales.byPeriod[p].endingCs),
    { tot: true, noteKey: 'hd_tot' }
  );
  html += '</tbody></table>';

  // 5 —— Quota capacity waterfall (existing + ramped new hires)
  const wf = sales.waterfall || { existing: [], hires: [] };
  html += `<table class="bud-tbl sales-tbl"><thead><tr>${buildTableHeaders({ lineWidth: 280 })}</tr></thead><tbody>`;
  html += `<tr class="sec"><td colspan="${colSpan}">Quota capacity waterfall — existing = remaining bench HC × full quota (drops on attrition) + backfill / growth (${rampTag} ramp)</td></tr>`;
  html += `<tr class="sec"><td colspan="${colSpan}">Existing bench</td></tr>`;
  for (const row of wf.existing) {
    html += renderSalesQuotaMonthsRow(row.label, row.months, { cls: 'wf-exist', noteKey: 'wf_' + row.id });
  }
  const existTot = BUD_P.map((_, i) => wf.existing.reduce((s, r) => s + (r.months[i] || 0), 0));
  html += renderSalesQuotaMonthsRow('Existing bench total', existTot, { tot: true, noteKey: 'wf_exist_tot' });

  html += `<tr class="sec"><td colspan="${colSpan}">Hires (quota ramp ${rampTag}) · backfill = attrition replacement · growth = net add</td></tr>`;
  if (!wf.hires.length) {
    html += `<tr><td colspan="${colSpan}" style="color:var(--text3);font-family:inherit">No growth or backfill hires in plan</td></tr>`;
  } else {
    for (const row of wf.hires) {
      html += renderSalesQuotaMonthsRow(row.label, row.months, {
        cls: row.kind === 'backfill' ? 'wf-backfill' : 'wf-hire',
        noteKey: 'wf_' + row.key,
      });
    }
  }
  const hireTot = BUD_P.map((_, i) => wf.hires.reduce((s, r) => s + (r.months[i] || 0), 0));
  html += renderSalesQuotaMonthsRow('Hire capacity total', hireTot, { tot: true, cls: 'wf-hire', noteKey: 'wf_hire_tot' });

  const allTot = BUD_P.map((_, i) => (existTot[i] || 0) + (hireTot[i] || 0));
  html += renderSalesQuotaMonthsRow('Total team quota capacity', allTot, { tot: true, cls: 'wf-tot', noteKey: 'wf_all_tot' });
  html += '</tbody></table>';

  // 6 —— Team quota capacity summary
  html += `<table class="bud-tbl sales-tbl"><thead><tr>${buildTableHeaders({ lineWidth: 280 })}</tr></thead><tbody>`;
  html += `<tr class="sec"><td colspan="${colSpan}">Team quota capacity summary (existing + ramped hires)</td></tr>`;
  const teamRows = [
    { k: 'nb_ex', label: 'NB existing capacity ($)', f: r => r.nbExistQuota, fy: () => m.existingCapNbFy },
    { k: 'nb_hi', label: 'NB new-hire capacity (ramped) ($)', f: r => r.nbHireQuota, fy: () => m.rampedHireNbFy },
    { k: 'nb_q', label: 'NB quota capacity ($)', f: r => r.nbMonthQuota, fy: () => BUD_P.reduce((acc, p) => acc + sales.byPeriod[p].nbMonthQuota, 0) },
    { k: 'cs_ex', label: 'CS existing capacity ($)', f: r => r.csExistQuota, fy: () => m.existingCapCsFy },
    { k: 'cs_hi', label: 'CS new-hire capacity (ramped) ($)', f: r => r.csHireQuota, fy: () => m.rampedHireCsFy },
    { k: 'cs_q', label: 'CS quota capacity ($)', f: r => r.csMonthQuota, fy: () => BUD_P.reduce((acc, p) => acc + sales.byPeriod[p].csMonthQuota, 0) },
    { k: 'tot_q', label: 'Total team quota capacity ($)', f: r => r.totalMonthQuota, tot: true, fy: () => BUD_P.reduce((acc, p) => acc + sales.byPeriod[p].totalMonthQuota, 0) },
  ];
  for (const row of teamRows) {
    html += `<tr${row.tot ? ' class="tot"' : ''}><td>${row.label}</td>`;
    for (const _ of CTX_QUARTERS) html += `<td class="ctx-c"><span style="color:var(--text3)">—</span></td>`;
    for (const p of BUD_P) html += `<td class="bud-c">${fmtM(row.f(sales.byPeriod[p]))}</td>`;
    html += `<td class="fy-c">${fmtM(row.fy())}</td>`;
    html += `<td class="notes-c">${noteInput('sales_' + row.k)}</td></tr>`;
  }
  html += '</tbody></table>';

  // 7 —— Monthly ARR demand vs team capacity (FY = sum of months)
  const sumF = (f) => BUD_P.reduce((acc, p) => acc + f(sales.byPeriod[p]), 0);
  const fmtOu = (v) => {
    if (v == null || isNaN(v)) return '—';
    if (Math.abs(v) < 0.5) return '<span class="delta-zero">' + fmtM(0) + '</span>';
    const cls = v > 0 ? 'delta-pos' : 'delta-neg';
    const sign = v > 0 ? '+' : '';
    return `<span class="${cls}">${sign}${fmtM(v)}</span>`;
  };
  html += `<table class="bud-tbl sales-tbl"><thead><tr>${buildTableHeaders({ lineWidth: 280 })}</tr></thead><tbody>`;
  html += `<tr class="sec"><td colspan="${colSpan}">Monthly ARR vs team quota capacity (FY = sum of months) · Over/Under = capacity − demand · CS demand = max(expansion, churn cover)</td></tr>`;
  const csDemTag = m.csDemand > m.fyExp + 1
    ? `churn cover ${STATE.csChurnCoverageMult.toFixed(2)}×`
    : 'from expansion';
  const monthRows = [
    { k: 'nb_dem', label: 'NB ARR demand ($)', f: r => r.nb, tag: 'from ARR' },
    { k: 'nb_cap', label: 'NB team capacity ($)', f: r => r.nbMonthQuota },
    { k: 'nb_gap', label: 'NB Over/Under (net) ($)', f: r => r.nbMonthGap, ou: true },
    { k: 'cs_dem', label: 'CS demand ($)', f: r => r.csDemandMonth, tag: csDemTag },
    { k: 'cs_cap', label: 'CS team capacity ($)', f: r => r.csMonthQuota },
    { k: 'cs_gap', label: 'CS Over/Under (net) ($)', f: r => r.csMonthGap, ou: true },
  ];
  for (const row of monthRows) {
    html += `<tr><td>${row.label}${row.tag ? `<span class="lock-tag">${row.tag}</span>` : ''}</td>`;
    for (const _ of CTX_QUARTERS) html += `<td class="ctx-c"><span style="color:var(--text3)">—</span></td>`;
    for (const p of BUD_P) {
      const v = row.f(sales.byPeriod[p]);
      html += `<td class="bud-c">${row.ou ? fmtOu(v) : fmtM(v)}</td>`;
    }
    const fy = sumF(row.f);
    html += `<td class="fy-c">${row.ou ? fmtOu(fy) : fmtM(fy)}</td>`;
    html += `<td class="notes-c">${noteInput('sales_' + row.k)}</td></tr>`;
  }
  html += '</tbody></table>';

  // 8 —— Headcount plan
  html += `<table class="bud-tbl sales-tbl"><thead><tr>${buildTableHeaders({ lineWidth: 280 })}</tr></thead><tbody>`;
  html += `<tr class="sec"><td colspan="${colSpan}">Headcount plan (feeds HC tab) — growth + attrition (${m.attritionPct.toFixed(0)}%/yr spread across months)</td></tr>`;
  const hcRows = [
    { k: 'bop_nb', label: 'Beginning NB AEs', f: r => r.bopAes, n: true },
    { k: 'hire_nb', label: 'NB AE hires', editable: 'nb', fy: BUD_P.reduce((s, p) => s + sales.byPeriod[p].nbHire, 0), delta: 'hire' },
    { k: 'attr_nb', label: 'NB attrition', f: r => r.nbAttrition, n: true, fy: m.nbAttritionYtd, delta: 'exit' },
    { k: 'end_nb', label: 'Ending NB AEs', f: r => r.endingAes, n: true, tot: true, fy: m.decAes },
    { k: 'bop_cs', label: 'Beginning CS', f: r => r.bopCs, n: true },
    { k: 'hire_cs', label: 'CS hires', editable: 'cs', fy: BUD_P.reduce((s, p) => s + sales.byPeriod[p].csHire, 0), delta: 'hire' },
    { k: 'attr_cs', label: 'CS attrition', f: r => r.csAttrition, n: true, fy: m.csAttritionYtd, delta: 'exit' },
    { k: 'end_cs', label: 'Ending CS', f: r => r.endingCs, n: true, tot: true, fy: m.decCs },
  ];
  for (const row of hcRows) {
    html += `<tr${rowClassAttr({ tot: row.tot, adj: !!row.editable })}><td>${row.label}${row.editable ? autoTag : ''}</td>`;
    for (const _ of CTX_QUARTERS) html += `<td class="ctx-c"><span style="color:var(--text3)">—</span></td>`;
    for (const p of BUD_P) {
      const r = sales.byPeriod[p];
      let val = '—';
      if (row.editable === 'nb') val = salesHireInput(p, 'nb', r.nbHire);
      else if (row.editable === 'cs') val = salesHireInput(p, 'cs', r.csHire);
      else if (row.f) {
        val = row.n
          ? (row.delta ? fmtHcFlow(row.f(r), row.delta) : fmtN(row.f(r)))
          : fmtM(row.f(r));
      }
      html += `<td class="bud-c">${val}</td>`;
    }
    const fyVal = row.fy != null
      ? (row.delta ? fmtHcFlow(row.fy, row.delta) : (row.n || row.editable ? fmtN(row.fy) : fmtM(row.fy)))
      : (row.k === 'bop_nb' ? fmtN(SALES_START_AE) : row.k === 'bop_cs' ? fmtN(SALES_START_CS) : '—');
    html += `<td class="fy-c">${fyVal}</td>`;
    html += `<td class="notes-c">${noteInput('sales_' + row.k)}</td></tr>`;
  }
  html += '</tbody></table>';

  // Last —— Annual hire bridge (reference)
  const csHireDriver = m.csDemand > m.fyExp + 1
    ? `churn cover ${STATE.csChurnCoverageMult.toFixed(2)}×`
    : 'from expansion ARR';
  html += `<table class="bud-tbl bridge-tbl"><thead><tr>
    <th style="text-align:left">Annual hire bridge</th>
    <th class="fy-h">FY</th>
    <th class="notes-h" style="width:140px">Notes</th>
  </tr></thead><tbody>`;
  html += `<tr class="sec"><td colspan="3">Reference · demand − existing watermark book (drives HC; not monthly shortfalls)</td></tr>`;
  const fmtGap = (signed, growthHires, avgQ) => {
    if (signed > 0) {
      return {
        fy: signed,
        tip: `shortfall · ${growthHires} growth @ avg ${fmtM(avgQ)}`,
        cls: 'color:var(--amber)',
      };
    }
    if (signed < 0) {
      return {
        fy: signed,
        tip: `surplus ${fmtM(-signed)} · book exceeds demand · 0 growth hires from gap`,
        cls: 'color:var(--teal)',
      };
    }
    return { fy: 0, tip: `covered exactly · 0 growth hires from gap`, cls: '' };
  };
  const nbGapUi = fmtGap(m.nbGapSigned != null ? m.nbGapSigned : m.hireNbTarget, m.nbGrowthHires, m.avgNbQuota);
  const csGapUi = fmtGap(m.csGapSigned != null ? m.csGapSigned : m.hireCsTarget, m.csGrowthHires, m.avgCsQuota);
  const bridgeRows = [
    { k: 'br_nb_bud', label: 'NB budget (ARR year)', fy: m.fyNb },
    { k: 'br_nb_book', label: 'NB existing watermark book', fy: m.existingNbQuota },
    { k: 'br_nb_gap', label: 'NB hire gap (= budget − book)', fy: nbGapUi.fy, tip: nbGapUi.tip, style: nbGapUi.cls },
    { k: 'br_cs_exp', label: 'Expansion ARR (year)', fy: m.fyExp },
    { k: 'br_cs_dem', label: 'CS hire demand (max expansion, churn floor)', fy: m.csDemand, tip: csHireDriver },
    { k: 'br_cs_book', label: 'CS existing watermark book', fy: m.existingCsQuota },
    { k: 'br_cs_gap', label: 'CS hire gap (= demand − book)', fy: csGapUi.fy, tip: csGapUi.tip, style: csGapUi.cls },
  ];
  for (const row of bridgeRows) {
    html += `<tr><td>${row.label}${row.tip ? `<span class="lock-tag">${row.tip}</span>` : ''}</td>`;
    const fyTxt = row.fy < 0 ? `(${fmtM(-row.fy)})` : fmtM(row.fy);
    html += `<td class="fy-c"${row.style ? ` style="${row.style}"` : ''}>${fyTxt}</td>`;
    html += `<td class="notes-c">${noteInput('sales_' + row.k)}</td></tr>`;
  }
  html += '</tbody></table>';

  return html;
}

function fyHcValue(hc, row) {
  const kind = hcFlowKind(row);
  if (row.ending) return fmtN(hc[BUD_P[11]].ending[row.ending]);
  if (row.hire) {
    const n = BUD_P.reduce((s, p) => s + hc[p].hires[row.hire], 0);
    return kind ? fmtHcFlow(n, kind) : fmtN(n);
  }
  if (row.payroll) return fmtM(BUD_P.reduce((s, p) => s + hc[p].payroll[row.payroll], 0));
  if (row.wages) return fmtM(BUD_P.reduce((s, p) => s + hc[p].wages[row.wages], 0));
  if (row.empBen) return fmtM(BUD_P.reduce((s, p) => s + hc[p].employeeBenefits[row.empBen], 0));
  if (row.payrollTax) return fmtM(BUD_P.reduce((s, p) => s + hc[p].payrollTax[row.payrollTax], 0));
  if (row.medBen) return fmtM(BUD_P.reduce((s, p) => s + hc[p].benefits[row.medBen], 0));
  if (row.k401) return fmtM(BUD_P.reduce((s, p) => s + hc[p].k401[row.k401], 0));
  if (row.bonusAcc) return fmtM(BUD_P.reduce((s, p) => s + hc[p].bonusAccrual[row.bonusAcc], 0));
  if (row.bonusCash) return fmtM(BUD_P.reduce((s, p) => s + hc[p].bonusCash[row.bonusCash], 0));
  if (row.attrition) {
    return fmtHcFlow(BUD_P.reduce((s, p) => s + (hc[p].attrition[row.attrition] || 0), 0), 'exit');
  }
  if (row.net) {
    const n = BUD_P.reduce((s, p) => s + (hc[p].hires[row.net] || 0) - (hc[p].attrition[row.net] || 0) - (hc[p].rifExits[row.net] || 0), 0);
    return fmtHcFlow(n, 'net');
  }
  if (row.rifExits) {
    return fmtHcFlow(BUD_P.reduce((s, p) => s + (hc[p].rifExits[row.rifExits] || 0), 0), 'exit');
  }
  if (row.severance) return fmtM(BUD_P.reduce((s, p) => s + (hc[p].severance[row.severance] || 0), 0));
  if (row.sumKey) {
    return fmtM(BUD_P.reduce((s, p) =>
      s + HC_DEPTS.reduce((t, d) => t + (hc[p][row.sumKey][d.key] || 0), 0), 0));
  }
  if (row.k === 'heads_tot') return fmtN(hc[BUD_P[11]].headsTotal);
  if (row.k === 'hires_tot') return fmtHcFlow(BUD_P.reduce((s, p) => s + hc[p].hiresTotal, 0), 'hire');
  if (row.k === 'attr_tot') return fmtHcFlow(BUD_P.reduce((s, p) => s + hc[p].attritionTotal, 0), 'exit');
  if (row.k === 'rif_tot') return fmtHcFlow(BUD_P.reduce((s, p) => s + hc[p].rifExitsTotal, 0), 'exit');
  if (row.k === 'sev_tot') return fmtM(BUD_P.reduce((s, p) => s + hc[p].severanceTotal, 0));
  if (row.k === 'pay_tot') return fmtM(BUD_P.reduce((s, p) => s + hc[p].payrollTotal, 0));
  if (row.k === 'wages_tot') return fmtM(BUD_P.reduce((s, p) => s + hc[p].wagesTotal, 0));
  if (row.k === 'emp_ben_tot') return fmtM(BUD_P.reduce((s, p) => s + hc[p].employeeBenefitsTotal, 0));
  if (row.k === 'bonus_acc_tot') return fmtM(BUD_P.reduce((s, p) => s + hc[p].bonusAccrualTotal, 0));
  if (row.k === 'bonus_cash_tot') return fmtM(BUD_P.reduce((s, p) => s + hc[p].bonusCashTotal, 0));
  return '—';
}

function fy26HcMonth(dept, moIdx) {
  const s = HC_FY26_MONTHLY[dept];
  if (!s || moIdx < 0 || moIdx > 11) return 0;
  return s[moIdx] || 0;
}

function fy26HcTotalMonth(moIdx) {
  return HC_DEPTS.reduce((s, d) => s + fy26HcMonth(d.key, moIdx), 0);
}

function fy26HcQuarterEnd(dept, qIdx) {
  return fy26HcMonth(dept, qIdx * 3 + 2);
}

function fy26HcQuarterFlow(dept, qIdx) {
  let hires = 0, attr = 0;
  for (let i = 0; i < 3; i++) {
    const m = qIdx * 3 + i;
    const cur = fy26HcMonth(dept, m);
    const prev = m === 0 ? cur : fy26HcMonth(dept, m - 1);
    const dlt = cur - prev;
    if (dlt > 0) hires += dlt;
    else attr += -dlt;
  }
  return { hires, attr, net: hires - attr };
}

function fy26PayrollQuarter(dept, qIdx) {
  let sum = 0;
  for (let i = 0; i < 3; i++) {
    const m = qIdx * 3 + i;
    const tot = fy26HcTotalMonth(m);
    const pay = HC_FY26_PAYROLL[m] || 0;
    if (!dept) sum += pay;
    else sum += tot ? pay * (fy26HcMonth(dept, m) / tot) : 0;
  }
  return sum;
}

function hcCtxCell(q, row) {
  const qi = CTX_QUARTERS.indexOf(q);
  if (qi < 0) return '<span style="color:var(--text3)">—</span>';
  if (row.ending) return fmtN(fy26HcQuarterEnd(row.ending, qi));
  if (row.k === 'heads_tot') return fmtN(fy26HcTotalMonth(qi * 3 + 2));
  if (row.hire) {
    const f = fy26HcQuarterFlow(row.hire, qi);
    return fmtHcFlow(f.hires, 'hire');
  }
  if (row.attrition) {
    const f = fy26HcQuarterFlow(row.attrition, qi);
    return fmtHcFlow(f.attr, 'exit');
  }
  if (row.net) {
    const f = fy26HcQuarterFlow(row.net, qi);
    return fmtHcFlow(f.net, 'net');
  }
  if (row.k === 'hires_tot') {
    return fmtHcFlow(HC_DEPTS.reduce((s, d) => s + fy26HcQuarterFlow(d.key, qi).hires, 0), 'hire');
  }
  if (row.k === 'attr_tot') {
    return fmtHcFlow(HC_DEPTS.reduce((s, d) => s + fy26HcQuarterFlow(d.key, qi).attr, 0), 'exit');
  }
  if (row.payroll) return fmtM(fy26PayrollQuarter(row.payroll, qi));
  if (row.wages) return fmtM(fy26PayrollQuarter(row.wages, qi));
  if (row.k === 'pay_tot' || row.k === 'wages_tot') return fmtM(fy26PayrollQuarter(null, qi));
  return '<span style="color:var(--text3)">—</span>';
}

function hcMonthCells(hc, row) {
  let html = '';
  for (const q of CTX_QUARTERS) html += `<td class="ctx-c">${hcCtxCell(q, row)}</td>`;
  for (const p of BUD_P) {
    const r = hc[p];
    let val = '—';
    if (row.editableHireLevel) {
      val = hireLevelInput(p, row.dept, row.level, r.hiresByLevel[row.dept][row.level] || 0);
    } else if (row.hire && row.editable) {
      val = hireInput(p, row.hire, r.hires[row.hire]);
    } else if (row.hire) val = fmtHcFlow(r.hires[row.hire], 'hire');
    else if (row.ending) val = fmtN(r.ending[row.ending]);
    else if (row.wages) val = fmtM(r.wages[row.wages]);
    else if (row.empBen) val = fmtM(r.employeeBenefits[row.empBen]);
    else if (row.payrollTax) val = fmtM(r.payrollTax[row.payrollTax]);
    else if (row.medBen) val = fmtM(r.benefits[row.medBen]);
    else if (row.k401) val = fmtM(r.k401[row.k401]);
    else if (row.bonusAcc) val = fmtM(r.bonusAccrual[row.bonusAcc]);
    else if (row.bonusCash) val = fmtM(r.bonusCash[row.bonusCash]);
    else if (row.attrition) val = fmtHcFlow(r.attrition[row.attrition] || 0, 'exit');
    else if (row.net) val = fmtHcFlow((r.hires[row.net] || 0) - (r.attrition[row.net] || 0) - (r.rifExits[row.net] || 0), 'net');
    else if (row.rifExits) val = fmtHcFlow(r.rifExits[row.rifExits] || 0, 'exit');
    else if (row.severance) val = fmtM(r.severance[row.severance] || 0);
    else if (row.payroll) val = fmtM(r.payroll[row.payroll]);
    else if (row.k === 'heads_tot') val = fmtN(r.headsTotal);
    else if (row.k === 'hires_tot') val = fmtHcFlow(r.hiresTotal, 'hire');
    else if (row.k === 'attr_tot') val = fmtHcFlow(r.attritionTotal, 'exit');
    else if (row.k === 'rif_tot') val = fmtHcFlow(r.rifExitsTotal, 'exit');
    else if (row.k === 'sev_tot') val = fmtM(r.severanceTotal);
    else if (row.k === 'wages_tot') val = fmtM(r.wagesTotal);
    else if (row.k === 'emp_ben_tot') val = fmtM(r.employeeBenefitsTotal);
    else if (row.k === 'bonus_acc_tot') val = fmtM(r.bonusAccrualTotal);
    else if (row.k === 'bonus_cash_tot') val = fmtM(r.bonusCashTotal);
    else if (row.k === 'pay_tot') val = fmtM(r.payrollTotal);
    html += `<td class="bud-c">${val}</td>`;
  }
  html += `<td class="fy-c">${fyHcValue(hc, row)}</td>`;
  html += `<td class="notes-c">${noteInput(row.k)}</td>`;
  return html;
}

        return s + h * (comp.salary / 12) * hcMeritFactor(BUD_P.indexOf(p));
      }, 0);
      const fyB = d.corpBonus
        ? BUD_P.reduce((s, p) => {

            return s + h * (comp.salary / 12) * hcMeritFactor(BUD_P.indexOf(p)) * (comp.bonusPct / 100);
          }, 0)
        : 0;
      const oteAnnual = d.oteKey === 'nb' ? STATE.nbOteVarAnnual : (d.oteKey === 'cs' ? STATE.csOteVarAnnual : 0);
      const bonusCell = d.corpBonus

        <td class="fy-c"><span class="k-input">${hcNumInput(Math.round(comp.salary / 1000), `updateHcSalary('${d.key}','${lv.key}',this.value)`, 1, 0)}<span class="k-suf">k</span></span></td>

      : (d.oteKey === 'cs'

  // —— Hire views: Total | Marketing | R&D | G&A ——
  html += `

  if (focus === 'total') {

    html += `<tr class="sec"><td colspan="${colSpan}">${focusDept.label} — monthly hires by level</td></tr>`;
    for (const lv of HC_LEVELS) {
      const row = {
        k: 'hc_hire_' + focusDept.key + '_' + lv.key,

        dept: focusDept.key,
        level: lv.key,
        hire: focusDept.key,

      // FY for level hires

      for (const q of CTX_QUARTERS) html += `<td class="ctx-c"><span style="color:var(--text3)">—</span></td>`;
      for (const p of BUD_P) {
        html += `<td class="bud-c">${hireLevelInput(p, focusDept.key, lv.key, hc[p].hiresByLevel[focusDept.key][lv.key] || 0)}</td>`;

    }
    html += `<tr class="tot"><td>${focusDept.label} hires</td>${hcMonthCells(hc, { k: 'hire_' + focusDept.key, hire: focusDept.key })}</tr>`;
    html += '</tbody></table>';
  }

  // —— Department groups: ending HC, hires, salary, employee benefits, bonus ——
  for (const d of HC_DEPTS) {
    html += `<table class="bud-tbl"><thead><tr>${buildTableHeaders()}</tr></thead><tbody>`;
    html += `<tr class="sec"><td colspan="${colSpan}">${d.label}</td></tr>`;

    const deptRows = [
      { k: 'end_' + d.key, label: 'Ending headcount', ending: d.key, tot: true },
      {
        k: 'hire_' + d.key + '_dept',
        label: d.fromSales ? 'Hires' : 'Net hires / (exits)',
        hire: d.key,
        editable: !d.fromSales,
        readonly: !!d.fromSales,
      },
    ];
    if (d.fromSales) {
      deptRows.push({ k: 'attr_' + d.key, label: 'Attrition exits', attrition: d.key, readonly: true });
      deptRows.push({ k: 'net_' + d.key, label: 'Net change', net: d.key });
    } else {
      deptRows.push({ k: 'attr_' + d.key, label: 'Attrition exits', attrition: d.key });
      deptRows.push({ k: 'rif_' + d.key, label: 'RIF exits', rifExits: d.key });
      deptRows.push({ k: 'sev_' + d.key, label: 'Severance (cash + P&L)', severance: d.key });
    }
    deptRows.push(
      { k: 'w_' + d.key, label: 'Salaries & wages', wages: d.key },
      { k: 'eb_' + d.key, label: 'Employee benefits', empBen: d.key },
      { k: 'eb_tax_' + d.key, label: '·· Payroll taxes', payrollTax: d.key },
      { k: 'eb_med_' + d.key, label: '·· Medical / other benefits', medBen: d.key },
      { k: 'eb_401_' + d.key, label: '·· 401(k) match', k401: d.key },
    );
    if (d.corpBonus) {
      deptRows.push({ k: 'ba_' + d.key, label: 'Bonus', bonusAcc: d.key });
    } else if (d.oteKey) {
      deptRows.push({ k: 'ote_' + d.key, label: 'Variable OTE', ote: d.oteKey });
    }
    deptRows.push({ k: 'pay_' + d.key, label: d.loadedLabel || ('Loaded ' + d.label + ' Payroll'), payroll: d.key, tot: true });

    for (const row of deptRows) {
      if (row.ote) {
        const ote = row.ote === 'nb' ? STATE.nbOteVarAnnual : STATE.csOteVarAnnual;
        html += `<tr><td>${row.label}<span class="lock-tag">$${Math.round(ote / 1000)}k / head × attain · in loaded</span></td>`;
        for (const q of CTX_QUARTERS) html += `<td class="ctx-c"><span style="color:var(--text3)">—</span></td>`;
        for (const p of BUD_P) {
          const heads = hc[p].ending[d.key] || 0;
          const attain = Math.max(0, Math.min(120, STATE.existingBenchCoverPct)) / 100;
          html += `<td class="bud-c">${fmtM(heads * (ote / 12) * attain)}</td>`;
        }
        const fyOte = BUD_P.reduce((s, p) => {
          const heads = hc[p].ending[d.key] || 0;
          const attain = Math.max(0, Math.min(120, STATE.existingBenchCoverPct)) / 100;
          return s + heads * (ote / 12) * attain;
        }, 0);
        html += `<td class="fy-c">${fmtM(fyOte)}</td><td class="notes-c">${noteInput(row.k)}</td></tr>`;
        continue;
      }
      const tag = row.readonly ? originTag('from Sales', 'sales', { title: 'Open Sales' }) : '';
      html += `<tr${row.tot ? ' class="tot"' : ''}><td>${row.label}${tag}</td>${hcMonthCells(hc, row)}</tr>`;
    }
    html += '</tbody></table>';
  }

  // —— Company total ——
  html += `<table class="bud-tbl"><thead><tr>${buildTableHeaders()}</tr></thead><tbody>`;
  html += `<tr class="sec"><td colspan="${colSpan}">Company total</td></tr>`;
  const totRows = [
    { k: 'heads_tot', label: 'Ending headcount', tot: true },
    { k: 'hires_tot', label: 'Net hires / (exits)' },
    { k: 'attr_tot', label: 'Attrition exits' },
    { k: 'rif_tot', label: 'RIF exits' },
    { k: 'sev_tot', label: 'Severance (cash + P&L)' },
    { k: 'wages_tot', label: 'Salaries & wages' },
    { k: 'emp_ben_tot', label: 'Employee benefits' },
    { k: 'bonus_acc_tot', label: 'Bonus' },
    { k: 'pay_tot', label: 'Loaded Total Payroll', tot: true },
  ];
  for (const row of totRows) {
    html += `<tr${row.tot ? ' class="tot"' : ''}><td>${row.label}${row.k === 'heads_tot' ? '<span class="lock-tag">Jan locked</span>' : ''}</td>${hcMonthCells(hc, row)}</tr>`;
  }
  html += '</tbody></table>';

  return html;
}

function quarterIsCtxCell(q, row) {
  let sum = 0, n = 0, last = null;
  const keyMap = {
    sub: 'sub_rev', svc: 'svc_rev', revenue: 'revenue', cogs: 'cogs', gp: 'gross_profit',
    sm: 'sm', rd: 'rd', ga: 'ga', opex: 'total_opex', ebitda: 'ebitda',
    da: 'da', interest: 'interest', opIncome: 'op_income', pretax: 'pretax',
    tax: 'tax', ni: 'net_income', gm: 'gm_pct',
  };
  const tsKey = keyMap[row.k] || row.k;
  for (const p of q.months) {
    const sm = getIsSm(p);
    const arr = getHistRow(p);
    const ts = window.SMPL_DEMO_TS_DATA || window.TS_DATA;
    let isRow = null;
    if (ts) {
      for (const b of ['Actual', 'Forecast']) {
        if (ts[b] && ts[b].is && ts[b].is[p]) { isRow = ts[b].is[p]; break; }
      }
    }
    if (!isRow && !arr) continue;
    n += 1;
    if (row.k === 'gm') {
      last = isRow && isRow.gm_pct != null ? isRow.gm_pct : null;
      continue;
    }
    if (isRow && isRow[tsKey] != null) sum += Number(isRow[tsKey]) || 0;
    else if (row.k === 'revenue') sum += arr ? arr.eop / 12 : 0;
    else if (row.k === 'sm') sum += sm || 0;
  }
  if (row.k === 'gm') return last != null ? fmtPct(last) : '—';
  if (!n && !sum) return '<span style="color:var(--text3)">—</span>';
  return fmtM(sum);
}

function fyIsValue(is, row) {
  if (row.k === 'gm' || row.pct) {
    const rev = BUD_P.reduce((s, p) => s + is[p].revenue, 0);
    const gp = BUD_P.reduce((s, p) => s + is[p].gp, 0);
    if (row.k === 'gm') return rev ? fmtPct(gp / rev) : '—';
  }
  const key = row.fKey || row.k;
  return fmtM(BUD_P.reduce((s, p) => s + (is[p][key] || 0), 0));
}

function fyPlDeptValue(pl, spec, line, secKey) {
  if (line.from === 'hc' || line.from === 'hc_share' || line.k === 'payroll') {
    return fmtM(BUD_P.reduce((s, p) => {
      const sec = pl[p].depts[spec.key].sections[secKey];
      return s + (sec && sec.lines[line.k] || 0);
    }, 0));
  }
  return fmtM(BUD_P.reduce((s, p) => {
    const sec = pl[p].depts[spec.key].sections[secKey];
    return s + (sec && sec.lines[line.k] || 0);
  }, 0));
}

function plLineTag(spec, line, sec) {
  const hcKey = (sec && sec.hcKey) || (spec.key === 'rd' ? 'rd' : spec.key === 'ga' ? 'ga' : spec.key === 'marketing' ? 'marketing' : 'total');
  const hcFocus = (hcKey === 'sales' || hcKey === 'cs') ? 'total' : hcKey;
  if (line.from && String(line.from).startsWith('hc')) {
    return originTag('from HC', 'hc', { hcFocus, title: 'Open Headcount' });
  }
  if (line.from === 'gtm' || line.from === 'gtm_channel') {
    return originTag('from GTM', 'gtm', { title: 'Open GTM / Pipeline' });
  }
  if (line.from === 'ote_nb' || line.from === 'ote_cs') {
    const ote = line.from === 'ote_nb' ? STATE.nbOteVarAnnual : STATE.csOteVarAnnual;
    return originTag(
      `$${Math.round(ote / 1000)}k OTE × ${(plAttainFactor() * 100).toFixed(0)}% attain`,
      'hc',
      { hcFocus: 'total', title: 'Open Headcount (OTE / attain)' }
    );
  }
  if (line.from === 'flat') return '';
  return `<span class="lock-tag">${plLineRate(spec.key, line.k, line.pctPay).toFixed(0)}% of pay</span>`;
}

function quarterCfCtxCell(q, row) {
  let sum = 0, n = 0, last = null;
  for (const p of q.months) {
    const r = tsStmtRow(p, 'cfs');
    if (!r) continue;
    n += 1;
    if (row.k === 'ending_cash' || row.k === 'beginning_cash') last = r[row.k];
    else if (r[row.k] != null) sum += Number(r[row.k]) || 0;
  }
  if (row.k === 'ending_cash' || row.k === 'beginning_cash') {
    return last != null ? fmtM(last) : '<span style="color:var(--text3)">—</span>';
  }
  if (!n) return '<span style="color:var(--text3)">—</span>';
  return fmtM(sum);
}

function quarterBsCtxCell(q, row) {
  let last = null;
  for (const p of q.months) {
    const r = tsStmtRow(p, 'bs');
    if (!r) continue;
    if (row.k === 'current_assets') {
      last = (r.cash || 0) + (r.ar || 0) + (r.prepaids || 0);
    } else if (r[row.k] != null) last = r[row.k];
  }
  return last != null ? fmtM(last) : '<span style="color:var(--text3)">—</span>';
}

function fyCfValue(cfs, row) {
  if (row.k === 'ending_cash') return fmtM(cfs[BUD_P[11]].ending_cash);

function padMo(i) {
  return String(i).padStart(2, '0');
}

function yearPeriods(year) {
  return MO.map((_, i) => `${year}-${padMo(i + 1)}`);
}

function tsIsRow(period) {
  const ts = window.SMPLOutlook && window.SMPLOutlook.getOutlookTsData
    ? window.SMPLOutlook.getOutlookTsData()
    : (window.TS_DATA || window.SMPL_DEMO_TS_DATA);
  if (!ts) return null;
  for (const b of ['Actual', 'Forecast', 'Budget']) {
    if (ts[b] && ts[b].is && ts[b].is[period]) return ts[b].is[period];
  }
  return null;
}

function backcastFromLater(laterEop, laterJanBop) {
  const mom = [];
  let prev = laterJanBop > 0 ? laterJanBop : (laterEop[0] || 1);
  for (let i = 0; i < 12; i++) {
    const cur = laterEop[i] != null ? laterEop[i] : prev;
    mom.push(prev > 0 ? cur / prev : 1);
    prev = cur;
  }
  let prod = mom.reduce((a, b) => a * b, 1) || 1;
  const start = laterJanBop / prod;
  const eop = [];
  let x = start;
  for (let i = 0; i < 12; i++) {
    x *= mom[i];
    eop.push(x);
  }
  eop[11] = laterJanBop;
  const nn = eop.map((v, i) => v - (i === 0 ? start : eop[i - 1]));
  return { eop, nn, bop0: start };
}

function scaleSeries(base, factor) {
  return base.map(v => v == null ? null : v * factor);
}

function buildYoyCompare() {
  const fy26p = yearPeriods(BUDGET_YEAR - 1);
  const fy26Eop = fy26p.map(p => {
    const r = getHistRow(p);
    return r && r.eop != null ? r.eop : null;
  });
  const fy26Nn = fy26p.map(p => {
    const r = getHistRow(p);
    return r && r.nn != null ? r.nn : null;
  });
  const fy26Bop0 = (getHistRow(fy26p[0]) || {}).bop || fy26Eop[0] || BOP_LOCK;
  const fy26Rev = fy26p.map(p => {
    const row = tsIsRow(p);
    return row && row.revenue != null ? row.revenue : null;
  });
  const fy26Hc = (window.WF_TOTAL_HC || [121, 124, 126, 128, 130, 137, 140, 142, 145, 146, 147, 147]).slice(0, 12);

  const plan = computeBudgetArr();
  const is = computeIsPlan();
  const hc = computeHcPlan();
  const gtm = computeGtmPlan();
  const fy27Eop = BUD_P.map(p => plan[p].eop);
  const fy27Nn = BUD_P.map(p => plan[p].nn);
  const fy27Rev = BUD_P.map(p => is[p].revenue);
  const fy27Hc = BUD_P.map(p => hc[p].headsTotal);
  const fy27Ebitda = BUD_P.map(p => is[p].ebitda);
  const fy27Opex = BUD_P.map(p => is[p].opex);
  const fy27Mkt = BUD_P.map(p => gtm[p].spend);
  const fy27Mqls = BUD_P.map(p => gtm[p].mqls);
  const { cfs: fy27Cfs } = computeCfBsPlan();
  const fy27Cash = BUD_P.map(p => fy27Cfs[p].ending_cash);

  const fy26Ebitda = fy26p.map(p => {
    const row = tsIsRow(p);
    return row && row.ebitda != null ? row.ebitda : null;
  });
  const fy26Opex = fy26p.map(p => {
    const row = tsIsRow(p);
    return row && row.total_opex != null ? row.total_opex : null;
  });
  const fy26Mkt = fy26p.map(p => {
    const r = getGtmHistRow(p);
    return r && r.spend != null ? r.spend : null;
  });
  const fy26Mqls = fy26p.map(p => {
    const r = getGtmHistRow(p);
    return r && r.mqls != null ? r.mqls : null;
  });
  const fy26Cash = fy26p.map(p => {
    const cfs = tsStmtRow(p, 'cfs');
    if (cfs && cfs.ending_cash != null) return cfs.ending_cash;
    const bs = tsStmtRow(p, 'bs');
    return bs && bs.cash != null ? bs.cash : null;
  });

  const fy26Complete = fy26Eop.every(v => v != null && v > 0);
  const fy25 = fy26Complete
    ? backcastFromLater(fy26Eop, fy26Bop0)
    : { eop: scaleSeries(fy27Eop, fy26Bop0 / (fy27Eop[11] || 1)), nn: scaleSeries(fy27Nn, 0.86), bop0: fy26Bop0 / 1.16 };
  const fy24 = backcastFromLater(fy25.eop, fy25.bop0);

  const fy26RevFill = fy26Rev.map((v, i) => v != null ? v : (fy27Rev[i] * (fy26Eop[i] || fy26Bop0) / (fy27Eop[i] || 1)));
  const fy25Rev = scaleSeries(fy26RevFill, fy25.eop[11] / (fy26Eop[11] || fy25.eop[11] || 1));
  const fy24Rev = scaleSeries(fy26RevFill, fy24.eop[11] / (fy26Eop[11] || fy24.eop[11] || 1));
  const fy25Hc = fy26Hc.map(v => Math.max(1, Math.round(v * (fy25.bop0 / fy26Bop0))));
  const fy24Hc = fy26Hc.map(v => Math.max(1, Math.round(v * (fy24.bop0 / fy26Bop0))));
  fy25Hc[11] = Math.round(fy26Hc[0] || 121);
  fy24Hc[11] = fy25Hc[0];

  const scalePrior = (fy26Series, fy27Series, factor) =>
    fy26Series.map((v, i) => (v != null ? v : (fy27Series[i] || 0)) * factor);

  const fy26EbitdaFill = fy26Ebitda.map((v, i) => v != null ? v : fy27Ebitda[i]);
  const fy26OpexFill = fy26Opex.map((v, i) => v != null ? v : fy27Opex[i]);
  const fy26MktFill = fy26Mkt.map((v, i) => v != null ? v : fy27Mkt[i] * 0.9);
  const fy26MqlsFill = fy26Mqls.map((v, i) => v != null ? v : fy27Mqls[i] * 0.9);
  const openCash = bsBopLock().cash;
  const fy26CashFill = fy26Cash.map((v, i) => v != null ? v : openCash);
  const arrScale25 = fy25.eop[11] / (fy26Eop[11] || fy25.eop[11] || 1);
  const arrScale24 = fy24.eop[11] / (fy26Eop[11] || fy24.eop[11] || 1);

  const years = [
    {
      id: 'fy24', label: 'FY24', color: '#72826a', dash: [4, 3], width: 1.5, optional: true,
      eop: fy24.eop, nn: fy24.nn, rev: fy24Rev, hc: fy24Hc,
      ebitda: scalePrior(fy26EbitdaFill, fy27Ebitda, arrScale24),
      opex: scalePrior(fy26OpexFill, fy27Opex, arrScale24),
      mkt: scalePrior(fy26MktFill, fy27Mkt, arrScale24),
      mqls: scalePrior(fy26MqlsFill, fy27Mqls, arrScale24),
      cash: scalePrior(fy26CashFill, fy27Cash, arrScale24),
    },
    {
      id: 'fy25', label: 'FY25', color: '#5fa878', dash: [], width: 1.8,
      eop: fy25.eop, nn: fy25.nn, rev: fy25Rev, hc: fy25Hc,
      ebitda: scalePrior(fy26EbitdaFill, fy27Ebitda, arrScale25),
      opex: scalePrior(fy26OpexFill, fy27Opex, arrScale25),
      mkt: scalePrior(fy26MktFill, fy27Mkt, arrScale25),
      mqls: scalePrior(fy26MqlsFill, fy27Mqls, arrScale25),
      cash: scalePrior(fy26CashFill, fy27Cash, arrScale25),
    },
    {
      id: 'fy26', label: 'FY26', color: '#b89060', dash: [], width: 2,
      eop: fy26Eop.map((v, i) => v != null ? v : fy26Bop0),
      nn: fy26Nn.map((v, i) => v != null ? v : 0),
      rev: fy26RevFill, hc: fy26Hc,
      ebitda: fy26EbitdaFill, opex: fy26OpexFill, mkt: fy26MktFill, mqls: fy26MqlsFill,
      cash: fy26CashFill,
    },
    {
      id: 'fy27', label: 'FY27B', color: '#3d7ea6', dash: [], width: 2.6,
      eop: fy27Eop, nn: fy27Nn, rev: fy27Rev, hc: fy27Hc,
      ebitda: fy27Ebitda, opex: fy27Opex, mkt: fy27Mkt, mqls: fy27Mqls,
      cash: fy27Cash,
    },
  ];
  return years;
}

function grainSeries(monthly12, grain, mode) {
  if (grain === 'm') return monthly12;
  const out = [];
  for (let q = 0; q < 4; q++) {
    const slice = monthly12.slice(q * 3, q * 3 + 3);
    if (mode === 'end') out.push(slice[2]);
    else out.push(slice.reduce((a, b) => a + (b || 0), 0));
  }
  return out;
}

let ovCharts = [];

function destroyOvCharts() {
  ovCharts.forEach(c => { try { c.destroy(); } catch (e) {} });
  ovCharts = [];
}

function ovChartDefaults() {
  const tick = { color: 'rgba(170,184,162,0.85)', font: { size: 10 } };
  const grid = { color: 'rgba(255,255,255,0.06)' };
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 }, color: 'rgba(170,184,162,0.9)' } },
      tooltip: {
        callbacks: {
          label: function (ctx) {
            const v = ctx.parsed.y;
            if (ctx.dataset.yAxisID === 'hc' || ctx.chart.canvas.id === 'ovHcC') return ` ${ctx.dataset.label}: ${Math.round(v).toLocaleString()}`;
            return ` ${ctx.dataset.label}: ${fmtM(v)}`;
          },
        },
      },
    },
    scales: {
      x: { ticks: tick, grid: { display: false } },
      y: { ticks: Object.assign({ callback: v => fmtM(v) }, tick), grid },
    },
  };
}

function paintOverviewCharts() {
  destroyOvCharts();
  if (typeof Chart !== 'function') return;
  const grain = STATE.ovGrain === 'm' ? 'm' : 'q';
  const labels = grain === 'm' ? MO.map(m => m) : ['Q1', 'Q2', 'Q3', 'Q4'];
  let years = buildYoyCompare();
  if (!STATE.ovShowFy24) years = years.filter(y => y.id !== 'fy24');
  const mkLine = (canvasId, field, mode, yFmt) => {
    const el = document.getElementById(canvasId);
    if (!el) return;
    const opts = ovChartDefaults();
    if (yFmt === 'n') {
      opts.scales.y.ticks.callback = v => Math.round(v).toLocaleString();
      opts.plugins.tooltip.callbacks.label = function (ctx) {
        return ` ${ctx.dataset.label}: ${Math.round(ctx.parsed.y).toLocaleString()}`;
      };
    }
    const ch = new Chart(el, {
      type: 'line',
      data: {
        labels,
        datasets: years.map(y => ({
          label: y.label,
          data: grainSeries(y[field], grain, mode),
          borderColor: y.color,
          backgroundColor: y.color + '22',
          borderWidth: y.width,
          borderDash: y.dash,
          tension: 0.22,
          pointRadius: grain === 'q' ? 3 : 2,
          pointHoverRadius: 4,
          fill: false,
        })),
      },
      options: opts,
    });
    ovCharts.push(ch);
  };
  mkLine('ovArrC', 'eop', 'end', 'm');
  mkLine('ovNnC', 'nn', 'sum', 'm');
  mkLine('ovRevC', 'rev', 'sum', 'm');
  mkLine('ovEbitdaC', 'ebitda', 'sum', 'm');
  mkLine('ovOpexC', 'opex', 'sum', 'm');
  mkLine('ovMktC', 'mkt', 'sum', 'm');
  mkLine('ovMqlC', 'mqls', 'sum', 'n');
  mkLine('ovCashC', 'cash', 'end', 'm');
  mkLine('ovHcC', 'hc', 'end', 'n');
}
