function distributeHires(n) {
  const out = {};
  for (const p of BUD_P) out[p] = 0;
  for (let i = 0; i < n; i++) {
    const idx = n === 1 ? 0 : Math.floor((i * BUD_P.length) / n) % BUD_P.length;
    out[BUD_P[idx]] += 1;
  }
  return out;
}

/** Linear FY26 head ramp ending at Dec (known BOP into FY27). janRatio < 1 ⇒ net hiring during FY26. */
function fy26HeadRamp(decEnd, janRatio) {
  const jan = Math.max(0, Math.round(decEnd * janRatio));
  const out = [];
  for (let i = 0; i < 12; i++) {
    out.push(Math.round(jan + (decEnd - jan) * (i / 11)));
  }
  return out;
}

function quarterEndFromRamp(ramp, qIdx) {
  return ramp[qIdx * 3 + 2];
}

function hireQuotaRampFactor(tenureMonths) {
  if (tenureMonths < 0) return 0;
  if (tenureMonths === 0) return HIRE_QUOTA_RAMP[0];
  if (tenureMonths === 1) return HIRE_QUOTA_RAMP[1];
  return HIRE_QUOTA_RAMP[2];
}

function splitHireVsBackfill(totalHire, remainingBackfill) {
  const hire = Math.max(0, Math.round(totalHire || 0));
  const backfill = Math.min(hire, Math.max(0, remainingBackfill));
  return { backfill, growth: hire - backfill };
}

function pushSalesHireCohorts(opts) {
  const { n, kind, group, segs, mi, p, moLbl, hireRowByKey, waterfallHires, cohorts, allocBySeg } = opts;
  if (n <= 0) return;
  const alloc = allocBySeg || allocateHeadsByShare(n, segs);
  const prefix = kind === 'backfill' ? 'Backfill' : 'Growth hire';
  for (const s of segs) {
    const count = alloc[s.id] || 0;
    if (!count) continue;
    const key = p + ':' + s.id + ':' + kind;
    const row = {
      key,
      label: `${prefix} · ${salesSegmentLabel(s)} · ${moLbl} (×${count})`,
      group,
      kind,
      hirePeriod: p,
      count,
      months: Array(BUD_P.length).fill(0),
    };
    hireRowByKey[key] = row;
    waterfallHires.push(row);
    cohorts.push({
      startMi: mi, segId: s.id, group, hired: count, remaining: count,
      monthlyFull: s.monthlyFull, key,
    });
  }
}

/** Prefer putting backfills into the seats attrition just emptied; leftover by BOP mix. */
function allocateBackfillToExits(n, segs, exitBySeg) {
  const out = {};
  for (const s of segs) out[s.id] = 0;
  let left = Math.max(0, Math.round(n || 0));
  if (left <= 0 || !segs.length) return out;
  const exits = segs
    .map(s => ({ id: s.id, n: Math.max(0, (exitBySeg && exitBySeg[s.id]) || 0) }))
    .filter(e => e.n > 0)
    .sort((a, b) => b.n - a.n || a.id.localeCompare(b.id));
  for (const e of exits) {
    if (left <= 0) break;
    const t = Math.min(e.n, left);
    out[e.id] += t;
    left -= t;
  }
  if (left > 0) {
    const rest = allocateHeadsByShare(left, segs);
    for (const s of segs) out[s.id] += rest[s.id] || 0;
  }
  return out;
}

/** Largest-remainder allocation of integer heads across segments. */
function allocateHeadsByShare(n, segs) {
  const out = {};
  for (const s of segs) out[s.id] = 0;
  if (n <= 0 || !segs.length) return out;
  const parts = segs.map(s => {
    const exact = n * s.share;
    const base = Math.floor(exact);
    return { id: s.id, base, frac: exact - base };
  });
  let left = n - parts.reduce((sum, p) => sum + p.base, 0);
  parts.sort((a, b) => b.frac - a.frac || a.id.localeCompare(b.id));
  for (const p of parts) out[p.id] = p.base;
  for (let i = 0; i < parts.length && left > 0; i++) {
    out[parts[i].id] += 1;
    left -= 1;
  }
  return out;
}

/** Distribute locked Dec'26 sales/cs bench across segments by template mix. */
function lockedSalesBench() {
  const nbSegs = SALES_SEGMENTS.filter(s => s.group === 'nb');
  const csSegs = SALES_SEGMENTS.filter(s => s.group === 'cs');
  const nb = allocateHeadsByShare(
    HC_BOP_LOCK.sales,
    nbSegs.map(s => ({ id: s.id, share: SALES_START_AE > 0 ? s.heads / SALES_START_AE : 0 }))
  );
  const cs = allocateHeadsByShare(
    HC_BOP_LOCK.cs,
    csSegs.map(s => ({ id: s.id, share: SALES_START_CS > 0 ? s.heads / SALES_START_CS : 0 }))
  );
  return { ...nb, ...cs };
}

/**
 * Apply attrition: existing bench first (so waterfall existing quota = remaining HC × full quota),
 * then oldest hire cohorts. Returns { exits, bySeg } for pairing same-month backfills.
 */
function applyAttritionToPool(existingMap, cohorts, group, attrCount, segById) {
  let left = attrCount;
  const bySeg = {};
  const groupSegs = SALES_SEGMENTS.filter(s => s.group === group);
  for (const s of groupSegs) bySeg[s.id] = 0;
  // Prefer existing bench first — drops existing-bench capacity immediately.
  while (left > 0) {
    const existingTotal = groupSegs.reduce((sum, s) => sum + (existingMap[s.id] || 0), 0);
    if (existingTotal <= 0) break;
    const takeTotal = Math.min(left, existingTotal);
    const takeBySeg = allocateHeadsByShare(
      takeTotal,
      groupSegs.map(s => ({ id: s.id, share: existingTotal > 0 ? (existingMap[s.id] || 0) / existingTotal : 0 }))
    );
    let took = 0;
    for (const s of groupSegs) {
      const t = Math.min(existingMap[s.id] || 0, takeBySeg[s.id] || 0);
      existingMap[s.id] = (existingMap[s.id] || 0) - t;
      bySeg[s.id] = (bySeg[s.id] || 0) + t;
      took += t;
    }
    if (took <= 0) break;
    left -= took;
  }
  // Then oldest hire cohorts.
  for (const c of cohorts) {
    if (left <= 0) break;
    if (c.group !== group || c.remaining <= 0) continue;
    const t = Math.min(c.remaining, left);
    c.remaining -= t;
    bySeg[c.segId] = (bySeg[c.segId] || 0) + t;
    left -= t;
  }
  return { exits: attrCount - left, bySeg };
}

/**
 * Sales capacity from FY27 budget demand (annual $):
 *   Per-head FY27 = FY26 watermark × (1 + YoY lift).
 *   Hire count = ceil(max(0, demand − full existing book) / avg annual quota)
 *     — ramp is for capacity display only, not headcount oversizing.
 *   Attrition replacement layered on top; new-hire quota ramps 33/66/100 in waterfall.
 */
function buildSalesPlanFromDemand(fyNb, fyExp, fyChurnContAnnual) {
  const histChurnCont = fy26ChurnContTotal();
  const churnBase = histChurnCont > 0 ? histChurnCont : fyChurnContAnnual;
  const csFloor = churnBase * STATE.csChurnCoverageMult;
  const csDemand = Math.max(fyExp, csFloor);

  const attainPct = Math.max(0, Math.min(100, STATE.existingBenchCoverPct)) / 100;
  const attritionPct = Math.max(0, STATE.salesAttritionPct) / 100;
  const benchHeads = lockedSalesBench();
  const lockedNb = HC_BOP_LOCK.sales;
  const lockedCs = HC_BOP_LOCK.cs;

  const raw = rawSeedQuotaTotals();
  const fy26Nb = fy26NbTotal();
  const fy26Exp = fy26ExpTotal();
  const scaleNb26 = raw.nb > 0 && fy26Nb > 0 ? fy26Nb / raw.nb : 1;
  const scaleCs26 = raw.cs > 0 && fy26Exp > 0 ? fy26Exp / raw.cs : 1;
  const quotaLift = Math.max(0, STATE.quotaYoyLiftPct || 0) / 100;
  // FY27 per-head = FY26 watermark × (1 + YoY lift). Never below FY26.
  const scaleNb27 = scaleNb26 * (1 + quotaLift);
  const scaleCs27 = scaleCs26 * (1 + quotaLift);

  const fy26NbRamp = fy26HeadRamp(lockedNb, 0.88);
  const fy26CsRamp = fy26HeadRamp(lockedCs, 0.90);

  const segments = SALES_SEGMENTS.map(s => {
    const scale27 = s.group === 'nb' ? scaleNb27 : scaleCs27;
    const scale26 = s.group === 'nb' ? scaleNb26 : scaleCs26;
    const fy26PerHead = s.fy25Quota * scale26;
    const fy27PerHead = Math.max(fy26PerHead, s.fy25Quota * scale27);
    const bench = benchHeads[s.id] ?? s.heads;
    const groupStart = s.group === 'nb' ? lockedNb : lockedCs;
    const share = groupStart > 0 ? bench / groupStart : 0;
    const fy26Ramp = s.group === 'nb' ? fy26NbRamp : fy26CsRamp;
    const fy26QEnds = CTX_QUARTERS.map((_, qi) => Math.max(0, Math.round(quarterEndFromRamp(fy26Ramp, qi) * share)));
    const fy26Annual = bench * fy26PerHead;
    const fy27Existing = bench * fy27PerHead;
    return {
      ...s,
      heads: bench,
      share,
      fy25Quota: fy26PerHead,
      fy26Annual,
      fy26Q: fy26Annual / 4,
      fy27PerHead,
      fy27Existing,
      fy27Month: fy27Existing / 12,
      monthlyFull: fy27PerHead / 12,
      fy26QEnds,
      groupLabel: s.group === 'nb' ? 'New Business' : 'Customer Success',
    };
  });
  const segById = {};
  for (const s of segments) segById[s.id] = s;

  const existingNbQuota = segments.filter(s => s.group === 'nb').reduce((n, s) => n + s.fy27Existing, 0);
  const existingCsQuota = segments.filter(s => s.group === 'cs').reduce((n, s) => n + s.fy27Existing, 0);
  const avgNbQuota = lockedNb > 0 ? existingNbQuota / lockedNb : 0;
  const avgCsQuota = lockedCs > 0 ? existingCsQuota / lockedCs : 0;

  // Attainment is expected delivery vs quota — does NOT invent extra seats.
  // Hire *count* uses shortfall only (max with 0). Reference bridge shows the signed gap.
  const existingNbEffective = existingNbQuota * attainPct;
  const existingCsEffective = existingCsQuota * attainPct;
  const nbGapSigned = fyNb - existingNbQuota;
  const csGapSigned = csDemand - existingCsQuota;
  const hireNbTarget = Math.max(0, nbGapSigned);
  const hireCsTarget = Math.max(0, csGapSigned);

  const nbGrowthHires = avgNbQuota > 0 ? Math.ceil(hireNbTarget / avgNbQuota) : 0;
  const csGrowthHires = avgCsQuota > 0 ? Math.ceil(hireCsTarget / avgCsQuota) : 0;
  const nbAttritionReplace = Math.ceil(lockedNb * attritionPct);
  const csAttritionReplace = Math.ceil(lockedCs * attritionPct);
  const nbHiresNeed = nbGrowthHires + nbAttritionReplace;
  const csHiresNeed = csGrowthHires + csAttritionReplace;
  // Heads required to deliver demand (never below locked Dec'26 bench).
  const aeNeeded = avgNbQuota > 0
    ? Math.max(lockedNb, Math.ceil(fyNb / avgNbQuota))
    : lockedNb;
  const csNeeded = avgCsQuota > 0
    ? Math.max(lockedCs, Math.ceil(csDemand / avgCsQuota))
    : lockedCs;

  const autoNbGrowth = distributeHires(nbGrowthHires);
  const autoCsGrowth = distributeHires(csGrowthHires);
  const autoNbBackfill = distributeHires(nbAttritionReplace);
  const autoCsBackfill = distributeHires(csAttritionReplace);
  // Spread annual attrition events across months (rate×heads/12 rounds to 0 at our HC size).
  const autoNbAttr = distributeHires(nbAttritionReplace);
  const autoCsAttr = distributeHires(csAttritionReplace);

  const coverPctActual = fyNb > 0 ? (existingNbQuota / fyNb) * 100 : 0;
  const coverPctCsActual = csDemand > 0 ? (existingCsQuota / csDemand) * 100 : 0;
  const coverPct = attainPct * 100;
  const hirePct = fyNb > 0 ? (hireNbTarget / fyNb) * 100 : 0;

  const existingHeads = { ...benchHeads };

  const cohorts = []; // { startMi, segId, group, hired, remaining, monthlyFull, label }
  const waterfallExisting = segments.map(s => ({
    id: s.id,
    label: 'Existing · ' + salesSegmentLabel(s),
    group: s.group,
    kind: 'exist',
    months: Array(BUD_P.length).fill(0),
  }));
  const waterfallHires = [];
  const hireRowByKey = {};

  const byPeriod = {};
  let nbAttritionYtd = 0;
  let csAttritionYtd = 0;
  let nbBackfillHiredYtd = 0;
  let csBackfillHiredYtd = 0;
  let rampedHireNbFy = 0;
  let rampedHireCsFy = 0;
  let existingCapNbFy = 0;
  let existingCapCsFy = 0;

  for (let mi = 0; mi < BUD_P.length; mi++) {
    const p = BUD_P[mi];
    const ov = STATE.salesHireOverride[p] || {};
    let nbGrowthHire;
    let nbBackfillHire;
    let csGrowthHire;
    let csBackfillHire;
    if (STATE._salesHireManual && ov.nb != null) {
      const split = splitHireVsBackfill(ov.nb, nbAttritionReplace - nbBackfillHiredYtd);
      nbBackfillHire = split.backfill;
      nbGrowthHire = split.growth;
    } else {
      nbGrowthHire = autoNbGrowth[p] || 0;
      nbBackfillHire = autoNbBackfill[p] || 0;
    }
    if (STATE._salesHireManual && ov.cs != null) {
      const split = splitHireVsBackfill(ov.cs, csAttritionReplace - csBackfillHiredYtd);
      csBackfillHire = split.backfill;
      csGrowthHire = split.growth;
    } else {
      csGrowthHire = autoCsGrowth[p] || 0;
      csBackfillHire = autoCsBackfill[p] || 0;
    }
    const nbHire = nbGrowthHire + nbBackfillHire;
    const csHire = csGrowthHire + csBackfillHire;
    nbBackfillHiredYtd += nbBackfillHire;
    csBackfillHiredYtd += csBackfillHire;

    const existingNbBop = segments.filter(s => s.group === 'nb').reduce((n, s) => n + (existingHeads[s.id] || 0), 0);
    const existingCsBop = segments.filter(s => s.group === 'cs').reduce((n, s) => n + (existingHeads[s.id] || 0), 0);
    const hireNbBop = cohorts.filter(c => c.group === 'nb').reduce((n, c) => n + c.remaining, 0);
    const hireCsBop = cohorts.filter(c => c.group === 'cs').reduce((n, c) => n + c.remaining, 0);
    const bopAes = existingNbBop + hireNbBop;
    const bopCs = existingCsBop + hireCsBop;

    const nbAttr = Math.min(bopAes, autoNbAttr[p] || 0);
    const csAttr = Math.min(bopCs, autoCsAttr[p] || 0);
    const nbAttrRes = applyAttritionToPool(existingHeads, cohorts, 'nb', nbAttr, segById);
    const csAttrRes = applyAttritionToPool(existingHeads, cohorts, 'cs', csAttr, segById);
    nbAttritionYtd += nbAttrRes.exits;
    csAttritionYtd += csAttrRes.exits;

    const nbSegs = segments.filter(s => s.group === 'nb');
    const csSegs = segments.filter(s => s.group === 'cs');
    const moLbl = MO[mi];
    const hireArgs = { mi, p, moLbl, hireRowByKey, waterfallHires, cohorts };
    // Backfill into the same seats attrition emptied → existing HC×quota drops; ramp replaces it.
    pushSalesHireCohorts({
      ...hireArgs, n: nbBackfillHire, kind: 'backfill', group: 'nb', segs: nbSegs,
      allocBySeg: allocateBackfillToExits(nbBackfillHire, nbSegs, nbAttrRes.bySeg),
    });
    pushSalesHireCohorts({ ...hireArgs, n: nbGrowthHire, kind: 'growth', group: 'nb', segs: nbSegs });
    pushSalesHireCohorts({
      ...hireArgs, n: csBackfillHire, kind: 'backfill', group: 'cs', segs: csSegs,
      allocBySeg: allocateBackfillToExits(csBackfillHire, csSegs, csAttrRes.bySeg),
    });
    pushSalesHireCohorts({ ...hireArgs, n: csGrowthHire, kind: 'growth', group: 'cs', segs: csSegs });

    let nbExistCap = 0;
    let csExistCap = 0;
    let nbHireCap = 0;
    let csHireCap = 0;

    for (const s of segments) {
      const heads = existingHeads[s.id] || 0;
      const cap = heads * s.monthlyFull;
      const wf = waterfallExisting.find(r => r.id === s.id);
      if (wf) wf.months[mi] = cap;
      if (s.group === 'nb') nbExistCap += cap;
      else csExistCap += cap;
    }

    for (const c of cohorts) {
      if (c.remaining <= 0) continue;
      const factor = hireQuotaRampFactor(mi - c.startMi);
      const cap = c.remaining * c.monthlyFull * factor;
      const row = hireRowByKey[c.key];
      if (row) row.months[mi] = cap;
      if (c.group === 'nb') nbHireCap += cap;
      else csHireCap += cap;
    }

    existingCapNbFy += nbExistCap;
    existingCapCsFy += csExistCap;
    rampedHireNbFy += nbHireCap;
    rampedHireCsFy += csHireCap;

    const nbMonthQuota = nbExistCap + nbHireCap;
    const csMonthQuota = csExistCap + csHireCap;

    const endingNbExist = nbSegs.reduce((n, s) => n + (existingHeads[s.id] || 0), 0);
    const endingCsExist = csSegs.reduce((n, s) => n + (existingHeads[s.id] || 0), 0);
    const endingNbHire = cohorts.filter(c => c.group === 'nb').reduce((n, c) => n + c.remaining, 0);
    const endingCsHire = cohorts.filter(c => c.group === 'cs').reduce((n, c) => n + c.remaining, 0);
    const aes = endingNbExist + endingNbHire;
    const cs = endingCsExist + endingCsHire;

    const segEnds = {};
    for (const s of segments) {
      const exist = existingHeads[s.id] || 0;
      const hired = cohorts.filter(c => c.segId === s.id).reduce((n, c) => n + c.remaining, 0);
      segEnds[s.id] = exist + hired;
    }

    byPeriod[p] = {
      nb: 0,
      exp: 0,
      churnCont: 0,
      nbHire,
      csHire,
      nbAttrition: nbAttr,
      csAttrition: csAttr,
      bopAes,
      bopCs,
      endingAes: aes,
      endingCs: cs,
      endingNbExist,
      endingCsExist,
      endingNbHire,
      endingCsHire,
      segEnds,
      nbMonthQuota,
      csMonthQuota,
      nbExistQuota: nbExistCap,
      csExistQuota: csExistCap,
      nbHireQuota: nbHireCap,
      csHireQuota: csHireCap,
      totalMonthQuota: nbMonthQuota + csMonthQuota,
      nbMonthCap: nbMonthQuota,
      csMonthCap: csMonthQuota,
      nbMonthGap: 0,
      csMonthGap: 0,
    };
  }

  for (const row of waterfallExisting) {
    row.fy = row.months.reduce((a, b) => a + b, 0);
  }
  for (const row of waterfallHires) {
    row.fy = row.months.reduce((a, b) => a + b, 0);
  }

  return {
    byPeriod,
    segments,
    fy26NbRamp,
    fy26CsRamp,
    waterfall: {
      existing: waterfallExisting,
      hires: waterfallHires,
      rampLabel: '33% / 66% / 100%',
    },
    meta: {
      fyNb, fyExp, csFloor, csDemand, churnBase,
      fy26Nb, fy26Exp,
      existingNbQuota, existingCsQuota,
      existingNbEffective, existingCsEffective,
      existingNbCap: existingNbQuota,
      existingCsCap: existingCsQuota,
      hireNbTarget, hireCsTarget,
      nbGapSigned, csGapSigned,
      nbGap$: hireNbTarget,
      csGap$: hireCsTarget,
      nbGrowthHires, csGrowthHires,
      nbAttritionReplace, csAttritionReplace,
      nbHiresNeed, csHiresNeed,
      nbAttritionYtd, csAttritionYtd,
      avgNbQuota, avgCsQuota,
      coverPct, hirePct,
      coverPctActual, coverPctCsActual,
      quotaYoyLiftPct: STATE.quotaYoyLiftPct || 0,
      seedNbBook: raw.nb,
      seedCsBook: raw.cs,
      scaleNb26, scaleCs26,
      attainPct: coverPct,
      existingCapNbFy, existingCapCsFy,
      rampedHireNbFy, rampedHireCsFy,
      attritionPct: STATE.salesAttritionPct,
      growthGoal: 100,
      benchShare: coverPct,
      hireShare: hirePct,
      attain: attainPct,
      qGrowth: 0,
      priorNb: existingNbQuota,
      priorCs: existingCsQuota,
      priorTotal: existingNbQuota + existingCsQuota,
      decAes: byPeriod[BUD_P[11]].endingAes,
      decCs: byPeriod[BUD_P[11]].endingCs,
      aeNeeded,
      csNeeded,
      hireRamp: HIRE_QUOTA_RAMP,
    },
  };
}

function computeSalesPlan() {
  const arrPlan = computeBudgetArr();
  const annual = computeArrAnnualTargets();
  const sales = buildSalesPlanFromDemand(annual.nb, annual.exp, annual.cont + annual.churn);
  const fyExp = annual.exp || 0;
  const csDemand = sales.meta.csDemand || 0;
  for (const p of BUD_P) {
    const a = arrPlan[p];
    const r = sales.byPeriod[p];
    r.nb = a.nb;
    r.exp = a.exp;
    r.churnCont = (a.churn || 0) + (a.cont || 0);
    // CS Over/Under uses the same demand we hire to (max expansion, churn floor),
    // spread with the same monthly shape as expansion ARR.
    const expShare = fyExp > 0 ? (a.exp || 0) / fyExp : (1 / BUD_P.length);
    r.csDemandMonth = csDemand * expShare;
    r.nbMonthGap = r.nbMonthQuota - a.nb;
    r.csMonthGap = r.csMonthQuota - r.csDemandMonth;
  }
  return sales;
}

function salesHcRequiredFromGtm() {
  return computeSalesPlan().meta.aeNeeded;
}

function salesHiresPlan() {
  const sales = computeSalesPlan();
  const out = {};
  for (const p of BUD_P) {
    const r = sales.byPeriod[p];
    out[p] = {
      sales: r.nbHire,
      cs: r.csHire,
      salesAttr: r.nbAttrition || 0,
      csAttr: r.csAttrition || 0,
    };
  }
  return out;
}

function computeHcPlan() {
  seedHcDefaults();
  seedHcOps();
  const salesAuto = salesHiresPlan();
  const salesPlan = computeSalesPlan();
  const cfg = activeHcCfg();
  const attritionPlan = hcAttritionByMonth();
  const taxPct = (STATE.payrollTaxPct || 0) / 100;
  const benPct = (STATE.benefitsPct || 0) / 100;
  const k401Pct = (STATE.k401Pct || 0) / 100;
  const out = {};
  const headsByLevel = {};
  const startWeights = {};
  for (const d of HC_DEPTS) {
    headsByLevel[d.key] = {};
    startWeights[d.key] = {};
    for (const lv of HC_LEVELS) {
      headsByLevel[d.key][lv.key] = hcLevelStart(d.key, lv.key);
      startWeights[d.key][lv.key] = hcLevelStart(d.key, lv.key);
    }
  }

  // Prior-year bonus cash (Feb payout) ≈ BOP heads × salary × bonus% for corp-bonus depts
  const priorBonusCash = {};
  for (const d of HC_DEPTS) {
    let cash = 0;
    if (d.corpBonus) {
      for (const lv of HC_LEVELS) {
        const comp = hcLevelComp(d.key, lv.key);
        cash += hcLevelStart(d.key, lv.key) * comp.salary * (comp.bonusPct / 100);
      }
    }
    priorBonusCash[d.key] = cash;
  }

  for (const p of BUD_P) {
    const moIdx = BUD_P.indexOf(p);
    const hiresDept = { ...getHcHires(p) };
    hiresDept.sales = salesAuto[p] ? salesAuto[p].sales : 0;
    hiresDept.cs = salesAuto[p] ? salesAuto[p].cs : 0;
    const periodRifs = hcRifsForPeriod(p);

    const row = {
      hires: {},
      hiresByLevel: {},
      attrition: {},
      rifExits: {},
      severance: {},
      ending: {},
      endingByLevel: {},
      wages: {},
      payrollTax: {},
      benefits: {},
      k401: {},
      employeeBenefits: {},
      bonusAccrual: {},
      bonusCash: {},
      ote: {},
      payroll: {},
      payrollTotal: 0,
      wagesTotal: 0,
      employeeBenefitsTotal: 0,
      bonusAccrualTotal: 0,
      bonusCashTotal: 0,
      oteTotal: 0,
      severanceTotal: 0,
      attritionTotal: 0,
      rifExitsTotal: 0,
      hiresTotal: 0,
      headsTotal: 0,
    };

    for (const d of HC_DEPTS) {
      const levelHires = {};
      let hireTot = 0;
      let attrExits = 0;
      let rifExitCount = 0;
      let severanceAmt = 0;

      if (d.key === 'sales') {
        const endingTot = salesPlan.byPeriod[p].endingAes;
        const alloc = allocateByMix(endingTot, startWeights.sales);
        for (const lv of HC_LEVELS) {
          headsByLevel.sales[lv.key] = alloc[lv.key];
          levelHires[lv.key] = 0;
        }
        hireTot = hiresDept.sales;
        attrExits = salesAuto[p] ? (salesAuto[p].salesAttr || 0) : 0;
      } else if (d.key === 'cs') {
        const endingTot = salesPlan.byPeriod[p].endingCs;
        const alloc = allocateByMix(endingTot, startWeights.cs);
        for (const lv of HC_LEVELS) {
          headsByLevel.cs[lv.key] = alloc[lv.key];
          levelHires[lv.key] = 0;
        }
        hireTot = hiresDept.cs;
        attrExits = salesAuto[p] ? (salesAuto[p].csAttr || 0) : 0;
      } else {
        const frozen = !!(cfg.freeze && cfg.freeze[d.key]);
        const hl = getHcHiresByLevel(p, d.key);
        for (const lv of HC_LEVELS) {
          let hire = hl[lv.key] || 0;
          // Hire freeze: block growth hires; still allow planned exits (negatives)
          if (frozen && hire > 0) hire = 0;
          levelHires[lv.key] = hire;
          headsByLevel[d.key][lv.key] = Math.max(0, headsByLevel[d.key][lv.key] + hire);
          hireTot += hire;
        }

        // Attrition exits (distributed from annual % of BOP)
        const attrN = (attritionPlan[d.key] && attritionPlan[d.key][p]) || 0;
        if (attrN > 0) {
          const taken = hcTakeExitsByMix(headsByLevel[d.key], attrN);
          attrExits = HC_LEVELS.reduce((s, lv) => s + taken[lv.key], 0);
        }

        // RIF exits + severance (cash / P&L restructuring)
        const deptRifs = periodRifs.filter(r => r.dept === d.key);
        for (const rif of deptRifs) {
          const n = Math.max(0, Math.round(Number(rif.heads) || 0));
          if (n <= 0) continue;
          const before = {};
          HC_LEVELS.forEach(lv => { before[lv.key] = headsByLevel[d.key][lv.key]; });
          const avgSal = hcWeightedAvgSalary(d.key, before);
          const taken = hcTakeExitsByMix(headsByLevel[d.key], n);
          const actually = HC_LEVELS.reduce((s, lv) => s + taken[lv.key], 0);
          rifExitCount += actually;
          const weeks = Math.max(0, Number(rif.weeks) || 0);
          severanceAmt += actually * avgSal * (weeks / 52);
        }
      }

      let wages = 0;
      let bonusAccrual = 0;
      const endingByLevel = {};
      let ending = 0;
      for (const lv of HC_LEVELS) {
        const heads = headsByLevel[d.key][lv.key];
        const comp = hcLevelComp(d.key, lv.key);
        endingByLevel[lv.key] = heads;
        ending += heads;
        const monthlyBase = heads * (comp.salary / 12) * hcMeritFactor(moIdx);
        wages += monthlyBase;
        if (d.corpBonus) bonusAccrual += monthlyBase * (comp.bonusPct / 100);
      }

      const payrollTax = wages * taxPct;
      const benefits = wages * benPct;
      const k401 = wages * k401Pct;
      const employeeBenefits = payrollTax + benefits + k401;
      const bonusCash = (d.corpBonus && moIdx === hcBonusPayoutMonth()) ? priorBonusCash[d.key] : 0;
      // Variable OTE (Sales NB/CS) — same monthly cost as P&L commissions / incentives
      let oteAmt = 0;
      if (d.oteKey === 'nb') {
        oteAmt = ending * ((STATE.nbOteVarAnnual || 0) / 12) * plAttainFactor();
      } else if (d.oteKey === 'cs') {
        oteAmt = ending * ((STATE.csOteVarAnnual || 0) / 12) * plAttainFactor();
      }
      // Loaded = wages + employee benefits + corp bonus + variable OTE (Sales)
      const payroll = wages + employeeBenefits + bonusAccrual + oteAmt;

      row.hires[d.key] = hireTot;
      row.hiresByLevel[d.key] = levelHires;
      row.attrition[d.key] = attrExits;
      row.rifExits[d.key] = rifExitCount;
      row.severance[d.key] = severanceAmt;
      row.ending[d.key] = ending;
      row.endingByLevel[d.key] = endingByLevel;
      row.wages[d.key] = wages;
      row.payrollTax[d.key] = payrollTax;
      row.benefits[d.key] = benefits;
      row.k401[d.key] = k401;
      row.employeeBenefits[d.key] = employeeBenefits;
      row.bonusAccrual[d.key] = bonusAccrual;
      row.bonusCash[d.key] = bonusCash;
      row.ote[d.key] = oteAmt;
      row.payroll[d.key] = payroll;
      row.payrollTotal += payroll;
      row.wagesTotal += wages;
      row.employeeBenefitsTotal += employeeBenefits;
      row.bonusAccrualTotal += bonusAccrual;
      row.bonusCashTotal += bonusCash;
      row.oteTotal += oteAmt;
      row.severanceTotal += severanceAmt;
      row.attritionTotal += attrExits;
      row.rifExitsTotal += rifExitCount;
      row.hiresTotal += hireTot;
      row.headsTotal += ending;
    }
    row.salesRequired = salesHcRequiredFromGtm();
    row.priorBonusCash = priorBonusCash;
    out[p] = row;
  }
  return out;
}

function getBudgetPayroll(period) {
  const plan = computeHcPlan();
  return plan[period] ? plan[period].payrollTotal : 0;
}

function seedPlRates() {
  if (!STATE.plRates) STATE.plRates = {};
  if (!STATE.plFlat) STATE.plFlat = {};
  for (const d of PL_DEPTS) {
    if (!STATE.plRates[d.key]) STATE.plRates[d.key] = {};
    if (!STATE.plFlat[d.key]) STATE.plFlat[d.key] = {};
    for (const line of plAllLines(d)) {
      if (line.pctPay != null && STATE.plRates[d.key][line.k] == null) {
        STATE.plRates[d.key][line.k] = line.pctPay;
      }
      if (line.from === 'flat') {
        STATE.plFlat[d.key][line.k] = normalizePlFlatLine(STATE.plFlat[d.key][line.k], line.flatMonthly);
      }
    }
  }
}

/** Expand legacy scalar $/mo (or partial maps) into a full FY period map. */
function normalizePlFlatLine(raw, fallbackMonthly) {
  const base = Math.max(0, Number(fallbackMonthly) || 0);
  const out = {};
  if (raw != null && typeof raw === 'object' && !Array.isArray(raw)) {
    let fill = base;
    for (const p of BUD_P) {
      if (raw[p] != null && !isNaN(Number(raw[p]))) { fill = Math.max(0, Number(raw[p])); break; }
    }
    for (const p of BUD_P) {
      out[p] = raw[p] != null && !isNaN(Number(raw[p])) ? Math.max(0, Number(raw[p])) : fill;
    }
    return out;
  }
  const flat = raw != null && !isNaN(Number(raw)) ? Math.max(0, Number(raw)) : base;
  for (const p of BUD_P) out[p] = flat;
  return out;
}

function plLineRate(deptKey, lineKey, fallback) {
  seedPlRates();
  const v = STATE.plRates[deptKey] && STATE.plRates[deptKey][lineKey];
  return v == null ? fallback : v;
}

function plFlatPeriod(deptKey, lineKey, period, fallback) {
  seedPlRates();
  const row = STATE.plFlat[deptKey] && STATE.plFlat[deptKey][lineKey];
  if (row && typeof row === 'object' && row[period] != null) return Math.max(0, Number(row[period]) || 0);
  return Math.max(0, Number(fallback) || 0);
}

function plAttainFactor() {
  return Math.max(0, Math.min(120, STATE.existingBenchCoverPct)) / 100;
}

/**
 * Department books.
 * Comp from HC breakouts (wages, employee benefits, bonus); NB/CS OTE × attain;
 * discretionary spend per month (seeded flat YoY; edit cells for seasonality).
 */
function computeDeptPl() {
  seedPlRates();
  const hc = computeHcPlan();
  const gtm = computeGtmPlan();
  const attain = plAttainFactor();
  const out = {};
  for (const p of BUD_P) {
    const depts = {};
    let sm = 0, rd = 0, ga = 0;
    const headsNb = hc[p].ending.sales || 0;
    const headsCs = hc[p].ending.cs || 0;
    const hcRow = hc[p];
    for (const d of PL_DEPTS) {
      const lines = {};
      const sections = {};
      let total = 0;
      let nbTotal = 0;
      let csTotal = 0;
      for (const sec of d.sections) {
        const share = sec.payShare != null && sec.payShare > 0
          ? sec.payShare
          : (sec.payShare === 0 ? 0 : 1);
        const wagesFull = hcRow.wages[sec.hcKey] || 0;
        const benFull = hcRow.employeeBenefits[sec.hcKey] || 0;
        const bonusFull = hcRow.bonusAccrual[sec.hcKey] || 0;
        const sevFull = hcRow.severance[sec.hcKey] || 0;
        const payFull = hcRow.payroll[sec.hcKey] || 0;
        const secLines = {};
        let secTot = 0;
        for (const line of sec.lines) {
          let amt = 0;
          if (line.from === 'hc_wages') amt = wagesFull;
          else if (line.from === 'hc_benefits') amt = benFull;
          else if (line.from === 'hc_bonus') amt = bonusFull;
          else if (line.from === 'hc_severance') amt = sevFull;
          else if (line.from === 'hc_wages_share') amt = wagesFull * share;
          else if (line.from === 'hc_benefits_share') amt = benFull * share;
          else if (line.from === 'hc_bonus_share') amt = bonusFull * share;
          else if (line.from === 'hc_severance_share') amt = sevFull * share;
          else if (line.from === 'hc' || line.from === 'hc_share') {
            amt = line.from === 'hc_share' ? payFull * share : payFull;
          } else if (line.from === 'gtm') amt = gtm[p].spend || 0;
          else if (line.from === 'gtm_channel') {
            const ch = line.channel && gtm[p].channels && gtm[p].channels[line.channel];
            amt = ch ? (ch.spend || 0) : 0;
          } else if (line.from === 'ote_nb') {
            amt = headsNb * ((STATE.nbOteVarAnnual || 0) / 12) * attain;
          } else if (line.from === 'ote_cs') {
            amt = headsCs * ((STATE.csOteVarAnnual || 0) / 12) * attain;
          } else if (line.from === 'flat') {
            amt = plFlatPeriod(d.key, line.k, p, line.flatMonthly);
          } else {
            amt = payFull * (plLineRate(d.key, line.k, line.pctPay || 0) / 100);
          }
          secLines[line.k] = amt;
          lines[line.k] = (lines[line.k] || 0) + amt;
          secTot += amt;
          total += amt;
        }
        sections[sec.key] = { label: sec.label, total: secTot, lines: secLines };
        if (sec.key === 'nb') nbTotal = secTot;
        if (sec.key === 'cs') csTotal = secTot;
      }
      depts[d.key] = {
        lines,
        sections,
        total,
        nbTotal,
        csTotal,
        payroll: d.sections.reduce((s, sec) => s + (hcRow.payroll[sec.hcKey] || 0), 0),
      };
      if (d.isLine === 'sm') sm += total;
      else if (d.isLine === 'rd') rd += total;
      else if (d.isLine === 'ga') ga += total;
    }
    depts.cs = {
      total: depts.sales.csTotal,
      lines: depts.sales.sections.cs ? depts.sales.sections.cs.lines : {},
      payroll: hcRow.payroll.cs || 0,
    };
    out[p] = { depts, sm, rd, ga, opex: sm + rd + ga };
  }
  return out;
}

/**
 * SaaS revenue bridge: ARR → Billings → Δ Deferred → Subscription revenue.
 * Identity: Sub revenue = Beg DR + Billings − End DR (ARR ≠ revenue).
 */
function planAnnualBillPct(open) {
  if (STATE.annualBillPct != null && !isNaN(STATE.annualBillPct)) return STATE.annualBillPct;
  const mo = open && open._decDrMonths != null ? open._decDrMonths : 0.16;
  // Dec deferred months of run-rate: ~0.16 ≈ monthly book; ~6 ≈ annual-in-advance
  return Math.max(0, Math.min(100, ((mo - 0.16) / (6 - 0.16)) * 100));
}

function computeRevenueBridge() {
  const arr = computeBudgetArr();
  const open = bsBopLock();
  const annualPct = planAnnualBillPct(open) / 100;
  let deferred = open.deferred_rev;
  let prevEopArr = BOP_LOCK; // Dec'26 ending ARR
  const out = {};
  for (const p of BUD_P) {
    const a = arr[p];
    const bop = a.bop || 0;
    const eop = a.eop || 0;
    const nb = a.nb || 0;
    const monthlyPct = 1 - annualPct;

    // Billings: existing book run-rate + NB (annual bills full ACV; monthly bills 1/12)
    const billingsRecurring = bop / 12;
    const billingsNbMonthly = (nb * monthlyPct) / 12;
    const billingsNbAnnual = nb * annualPct;
    const billingsNb = billingsNbMonthly + billingsNbAnnual;
    const billings = billingsRecurring + billingsNb;

    const begDR = deferred;
    // End DR: scale prior deferred with ARR, plus unearned from annual NB billed this month
    const endDRBase = prevEopArr > 0 ? begDR * (eop / prevEopArr) : begDR;
    const unearnedNb = billingsNbAnnual * (11 / 12);
    const endDR = Math.max(0, endDRBase + unearnedNb);
    const chg_dr = endDR - begDR;
    // Recognized subscription revenue (not ARR÷12)
    const sub = begDR + billings - endDR;

    out[p] = {
      bopArr: bop,
      eopArr: eop,
      nb,
      annualPct,
      billingsRecurring,
      billingsNbMonthly,
      billingsNbAnnual,
      billingsNb,
      billings,
      begDR,
      endDR,
      chg_dr,
      unearnedNb,
      sub,
      runRate: eop / 12,
    };
    deferred = endDR;
    prevEopArr = eop;
  }
  return out;
}

/** IS: subscription from revenue bridge; opex from department P&Ls. */
function computeIsPlan() {
  const bridge = computeRevenueBridge();
  const hc = computeHcPlan();
  const gtm = computeGtmPlan();
  const pl = computeDeptPl();
  const out = {};
  for (const p of BUD_P) {
    const sub = bridge[p].sub;
    const svc = sub * (STATE.svcPctSub / 100);
    const revenue = sub + svc;
    const cogs = revenue * (STATE.cogsPctRev / 100);
    const gp = revenue - cogs;
    const mktProgram = gtm[p].spend;
    const salesPay = hc[p].payroll.sales || 0;
    const csPay = hc[p].payroll.cs || 0;
    const mktPay = hc[p].payroll.marketing || 0;
    const sm = pl[p].sm;
    const rd = pl[p].rd;
    const ga = pl[p].ga;
    const opex = sm + rd + ga;
    const ebitda = gp - opex;
    const da = 125000;
    const interest = 35000;
    const opIncome = ebitda - da;
    const pretax = opIncome - interest;
    const tax = pretax > 0 ? pretax * 0.21 : 0;
    const ni = pretax - tax;
    const salesPl = pl[p].depts.sales.nbTotal;
    const csPl = pl[p].depts.sales.csTotal;
    const mktPl = pl[p].depts.marketing.total;
    out[p] = {
      sub, svc, revenue, cogs, gp, gm: revenue > 0 ? gp / revenue : null,
      billings: bridge[p].billings,
      chg_dr: bridge[p].chg_dr,
      begDR: bridge[p].begDR,
      endDR: bridge[p].endDR,
      mktProgram, salesPay, csPay, mktPay,
      salesPl, csPl, mktPl,
      sm, rd, ga, opex, ebitda, da, interest, opIncome, pretax, tax, ni,
      smPct: revenue > 0 ? sm / revenue : null,
      rdPct: revenue > 0 ? rd / revenue : null,
      gaPct: revenue > 0 ? ga / revenue : null,
      ebitdaPct: revenue > 0 ? ebitda / revenue : null,
    };
  }
  return out;
}

/** Pull a statement row from demo/outlook TS_DATA (Actual → Forecast → Budget). */
function tsStmtRow(period, stmt) {
  const ts = window.SMPLOutlook && window.SMPLOutlook.getOutlookTsData
    ? window.SMPLOutlook.getOutlookTsData()
    : (window.TS_DATA || window.SMPL_DEMO_TS_DATA);
  if (!ts) return null;
  for (const b of ['Actual', 'Forecast', 'Budget']) {
    if (ts[b] && ts[b][stmt] && ts[b][stmt][period]) return ts[b][stmt][period];
  }
  return null;
}

/**
 * Jan'27 BOP — exact Dec'26 close (cash from CFS; WC from BS).
 * Never relevel AR/AP/DR to a "steady-state %" that disagrees with the Dec balances
 * shown in the context columns — that cliffs Jan WC and plugs equity down.
 */
function bsBopLock() {
  const dec = `${BUDGET_YEAR - 1}-12`;
  const jun = `${BUDGET_YEAR - 1}-06`;
  const bsDec = tsStmtRow(dec, 'bs');
  const bsJun = tsStmtRow(jun, 'bs');
  const cfsDec = tsStmtRow(dec, 'cfs');
  const isDec = tsIsRow(dec);
  const decRev = isDec && isDec.revenue != null ? isDec.revenue : 8578200;
  const decOpex = isDec && isDec.total_opex != null
    ? isDec.total_opex
    : (isDec && isDec.opex != null ? isDec.opex : 5389683);
  const cash = (cfsDec && cfsDec.ending_cash != null)
    ? cfsDec.ending_cash
    : (bsDec && bsDec.cash != null ? bsDec.cash : 72636321);
  // Prefer Dec BS; only fall back to June if Dec row is missing entirely
  const wc = bsDec || bsJun || {};
  const ar = wc.ar != null ? Number(wc.ar) : Math.round(decRev * 0.12);
  const ap = wc.ap != null ? Number(wc.ap) : Math.round(decOpex * 0.13);
  const deferred = wc.deferred_rev != null ? Number(wc.deferred_rev) : Math.round(decRev * 0.16);
  const prepaids = wc.prepaids != null ? Number(wc.prepaids) : 6000000;
  const ppe = wc.ppe != null ? Number(wc.ppe) : 2500000;
  const debt = wc.debt != null ? Number(wc.debt) : 5000000;
  const assets0 = cash + ar + prepaids + ppe;
  const liab0 = ap + deferred + debt;
  // Prefer reported Dec equity when it ties; otherwise plug from components
  let equity0 = wc.equity != null ? Number(wc.equity) : (assets0 - liab0);
  if (Math.abs((liab0 + equity0) - assets0) > 1) equity0 = assets0 - liab0;

  return {
    cash,
    ar,
    prepaids,
    ppe,
    ap,
    deferred_rev: deferred,
    debt,
    equity: equity0,
    _decRev: decRev,
    _decOpex: decOpex,
    _decArPct: decRev > 0 ? (ar / decRev) * 100 : 12,
    _decApPct: decOpex > 0 ? (ap / decOpex) * 100 : 13,
    _decDrMonths: decRev > 0 ? deferred / decRev : 0.16,
  };
}

/**
 * WC policy ratios — must follow Dec close implied ratios.
 * Legacy levers (AR 12%, AP 13–18%, DR 0.16–6.5) are ignored when Dec book is elevated.
 */
function planDrMonths(open) {
  const decRatio = open && open._decDrMonths > 0 ? open._decDrMonths : 0.16;
  const lever = STATE.drMonthsRev;
  if (lever == null) return decRatio;
  // Legacy annual-billing (6+) or thin H2 default (≤0.25) while Dec differs → follow Dec
  if (lever >= 2 && Math.abs(lever - decRatio) > 0.5) return decRatio;
  if (decRatio > 0.5 && lever < 1) return decRatio;
  if (lever > 0) return lever;
  return decRatio;
}

function planArPct(open) {
  const dec = open && open._decArPct > 0 ? open._decArPct : 12;
  const lever = STATE.arPctRev;
  // Steady-state lever (≤40%) cannot represent Dec AR that is months of revenue
  if (dec > 40) return dec;
  if (lever != null && lever > 0) return lever;
  return dec;
}

function planApPct(open) {
  const dec = open && open._decApPct > 0 ? open._decApPct : 13;
  const lever = STATE.apPctOpex;
  if (dec > 40) return dec;
  if (lever != null && Math.abs(lever - 18) < 0.05 && Math.abs(dec - 18) > 2) return dec;
  if (lever != null && lever > 0) return lever;
  return dec;
}

/**
 * Linked Cash Flow (indirect) + Balance Sheet for FY plan.
 * Deferred from revenue bridge (ARR→Billings→DR→Sub); AR/AP roll with activity.
 */
function computeCfBsPlan() {
  const is = computeIsPlan();
  const bridge = computeRevenueBridge();
  const open = bsBopLock();
  let cash = open.cash;
  let ar = open.ar;
  let prepaids = open.prepaids;
  let ppe = open.ppe;
  let ap = open.ap;
  let deferred = open.deferred_rev;
  let debt = open.debt;
  let equity = open.equity;
  let prevRev = open._decRev;
  let prevOpex = open._decOpex;

  const sbcPct = (STATE.sbcPctRev != null ? STATE.sbcPctRev : 1) / 100;
  const arPct = planArPct(open) / 100;
  const apPct = planApPct(open) / 100;
  const prepaidDelta = STATE.prepaidMonthlyDelta != null ? STATE.prepaidMonthlyDelta : -15000;
  const capexPct = (STATE.capexPctRev != null ? STATE.capexPctRev : 2) / 100;

  const cfs = {};
  const bs = {};
  for (let i = 0; i < BUD_P.length; i++) {
    const p = BUD_P[i];
    const r = is[p];
    const br = bridge[p];
    const rev = r.revenue || 0;
    const opex = r.opex || 0;
    const ni = r.ni || 0;
    const da = r.da || 0;
    const sbc = rev * sbcPct;

    const arEnd = prevRev > 0 ? ar * (rev / prevRev) : rev * arPct;
    const drEnd = br.endDR;
    const apEnd = prevOpex > 0 ? ap * (opex / prevOpex) : opex * apPct;
    const prepaidEnd = Math.max(0, prepaids + prepaidDelta);

    const chg_ar = ar - arEnd;
    const chg_dr = br.chg_dr; // = Billings − Sub revenue (bridge identity)
    const chg_ap = apEnd - ap;
    const chg_prepaids = prepaids - prepaidEnd;

    const cfo = ni + da + sbc + chg_ar + chg_dr + chg_ap + chg_prepaids;
    const capex = -(rev * capexPct);
    const cfi = capex;
    const debtFlow = 0;
    const cff = debtFlow;
    const net_change = cfo + cfi + cff;
    const beginning_cash = cash;
    const ending_cash = beginning_cash + net_change;

    ar = arEnd;
    deferred = drEnd;
    ap = apEnd;
    prepaids = prepaidEnd;
    ppe = Math.max(0, ppe - capex - da);
    cash = ending_cash;
    debt = debt + debtFlow;
    equity = equity + ni + sbc;
    prevRev = rev;
    prevOpex = opex;

    const current_assets = cash + ar + prepaids;
    const total_assets = current_assets + ppe;
    const total_liabilities = ap + deferred + debt;
    const total_le = total_liabilities + equity;
    const imbalance = total_assets - total_le;
    if (Math.abs(imbalance) > 0.01) equity += imbalance;

    cfs[p] = {
      beginning_cash, net_income: ni, da, sbc,
      chg_ar, chg_dr, chg_ap, chg_prepaids,
      billings: br.billings, sub_rev: br.sub,
      cfo, capex, cfi, debt: debtFlow, cff, net_change, ending_cash,
    };
    bs[p] = {
      cash, ar, prepaids, current_assets, ppe, total_assets,
      ap, deferred_rev: deferred, debt, total_liabilities,
      equity, total_le: total_liabilities + equity,
    };
  }
  return { cfs, bs, open };
}

function computeCashFlowPlan() {
  return computeCfBsPlan().cfs;
}

function computeBalanceSheetPlan() {
  return computeCfBsPlan().bs;
}

function buildQuarterGtm(q) {
  let nb = 0, spend = 0, smTotal = 0, mqls = 0, pipelineDollar = 0;
  let oppsToClose = 0, pipelineOpps = 0, closedLogos = 0;
  let cplSum = 0, mqlOppSum = 0, oppCloseSum = 0, avgAcvSum = 0, n = 0;
  for (const p of q.months) {
    const arr = getHistRow(p);
    const r = getGtmHistRow(p);
    if (!r && !arr) continue;
    if (arr) nb += arr.nb || 0;
    if (!r) continue;
    spend += r.spend;
    smTotal += r.smTotal;
    mqls += r.mqls;
    pipelineDollar += r.pipelineDollar;
    oppsToClose += r.oppsToClose;
    pipelineOpps += r.pipelineOpps;
    closedLogos += r.closedLogos;
    cplSum += r.rates.cpl;
    mqlOppSum += r.rates.mqlOpp;
    oppCloseSum += r.rates.oppClose;
    avgAcvSum += r.rates.avgAcv;
    n += 1;
  }
  return {
    nb, spend, smTotal, mqls, pipelineDollar, oppsToClose, pipelineOpps, closedLogos,
    rates: n ? {
      cpl: cplSum / n,
      mqlOpp: mqlOppSum / n,
      oppClose: oppCloseSum / n,
      avgAcv: avgAcvSum / n,
    } : { ...DEFAULT_GTM_RATES },
  };
}

function renderSidebar() {
  const el = document.getElementById('sidebar');
  const layout = document.querySelector('.layout');
  if (layout) layout.classList.toggle('no-sidebar', curTab === 'overview');
  if (curTab === 'overview') {
    el.innerHTML = '';
    return;
  }
  if (curTab === 'promote') {

function buildQuarterMix(q) {
  let nb = 0, exp = 0, react = 0, cont = 0, churn = 0;
  const first = getHistRow(q.months[0]);
  const bop = first ? (first.bop || 0) : 0;
  for (const p of q.months) {
    const r = getHistRow(p);
    if (!r) continue;
    nb += r.nb || 0;
    exp += r.exp || 0;
    react += r.react || 0;
    cont += r.cont || 0;
    churn += r.churn || 0;
  }
  if (bop <= 0) return { nb: 0, exp: 0, react: 0, cont: 0, churn: 0 };
  return {
    nb: nb / bop,
    exp: exp / bop,
    react: react / bop,
    cont: cont / bop,
    churn: churn / bop,
  };
}

function quarterCtxCell(q, row) {
  let hasData = false;
  for (const p of q.months) {
    if (getHistRow(p)) { hasData = true; break; }
  }
  if (!hasData) return '<span style="color:var(--text3)">—</span>';
  if (row.mix) {
    const m = buildQuarterMix(q);
    return fmtPct(m[row.mix]);
  }
  if (row.pct) {
    const qs = buildQuarterSummary(q);
    return fmtPct(row.k === 'grr' ? qs.grr : qs.nrr);
  }
  if (row.k === 'bop') {
    const first = getHistRow(q.months[0]);
    return first ? fmtM(first.bop) : '—';
  }
  if (row.k === 'eop') {
    const last = getHistRow(q.months[q.months.length - 1]);
    return last ? fmtM(last.eop) : '—';
  }
  if (row.k === 'nn') {
    let nn = 0;
    for (const p of q.months) {
      const r = getHistRow(p);
      if (r) nn += r.nn || 0;
    }
    return fmtM(nn);
  }
  const field = row.k;
  let sum = 0;
  for (const p of q.months) {
    const r = getHistRow(p);
    if (r && r[field] != null) sum += r[field];
  }
  return fmtM(row.neg ? -Math.abs(sum) : sum);
}

function buildTableHeaders(opts) {
  const lineW = (opts && opts.lineWidth) || 220;
  let h = `<th class="line-h" style="width:${lineW}px;min-width:${lineW}px">Line</th>`;
  for (const q of CTX_QUARTERS) {
    const cls = q.source === 'forecast' ? 'ctx-h fcst-h' : 'ctx-h';
    h += `<th class="${cls}">${q.key}${q.source === 'forecast' ? '<br><span style="font-size:8px">Fcst</span>' : ''}</th>`;
  }
  for (let i = 0; i < 12; i++) h += `<th class="bud-h">${MO[i]} '${String(BUDGET_YEAR).slice(2)}</th>`;
  h += '<th class="bud-h fy-h">FY</th><th class="notes-h" style="width:140px">Notes</th>';
  return h;
}

  const defs = getMetricDefinitions();

  const dom = STATE.defDomain || 'all';
  const overlay = companyMetricDefsOverlay();
  const filtered = defs.filter(d => {
    if (dom !== 'all' && d.domain !== dom) return false;
    if (!q) return true;
    const hay = [d.id, d.label, d.description, d.formula, d.notes, d.domain, d.formula_id].join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  });

  let html = `
    <div class="slide-title">Definitions · calculated fields</div>
    <div class="slide-sub">Canonical descriptions and calculation logic for the operating plan. Companies can supply their own glossary via hydrate <code style="color:var(--text3)">metric_definitions</code> — same overlay pattern as the Board platform and forecast model.</div>

  if (!filtered.length) {
    html += `<div class="ctx-banner">No metrics match this filter.</div>`;
    return html;
  }

  const byDomain = {};
  for (const d of filtered) {
    const key = d.domain || 'Other';
    if (!byDomain[key]) byDomain[key] = [];
    byDomain[key].push(d);
  }
  const order = domains.filter(d => byDomain[d]);
  for (const domain of order) {
    html += `<div class="panel-lbl" style="margin:14px 0 8px;border:none;padding:0">${domain}</div>`;
    for (const d of byDomain[domain]) {
      const src = (d.source_type || 'COMPUTED').toLowerCase();
      const srcCls = src.indexOf('input') >= 0 ? 'input' : src.indexOf('assum') >= 0 ? 'assumption' : 'computed';
      const openBtn = d.tab
        ? originTag('Open', d.tab, { scrollTo: d.scrollTo, plDept: d.plDept, hcFocus: d.hcFocus, title: 'Open ' + (d.label || d.tab) })
        : '';
      html += `
        <div class="def-block" id="def-${d.id}">
          <div class="def-block-hd">

              <span class="def-src ${srcCls}">${d.source_type || 'COMPUTED'}</span>

              <span class="def-meta">${d.id}${d.formula_id ? ' · ' + d.formula_id : ''}</span>

          ${d.notes ? `<div class="def-notes">${d.notes}</div>` : ''}

  }
  return html;
}
