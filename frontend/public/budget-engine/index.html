// ─── PLAN ASSURANCE (status · risk · context) ──────────────────────────────
function renderAssureFindingRows(items) {
  if (!items || !items.length) return '';
  return items.map(r => {
    const sev = r.severity === 'high' ? 'high'
      : r.severity === 'ok' ? 'ok'
      : r.severity === 'low' ? 'low'
      : r.severity === 'info' ? 'info'
      : 'med';
    const label = r.severity === 'ok' ? 'OK'
      : r.severity === 'info' ? 'note'
      : r.severity;
    const cite = r.citation ? `<div class="assure-cite">${String(r.citation).replace(/</g, '&lt;')}</div>` : '';
    return `<div class="assure-risk"><span class="assure-sev ${sev}">${label}</span><div><strong>${String(r.title).replace(/</g, '&lt;')}</strong><br><span style="color:var(--text3)">${String(r.detail).replace(/</g, '&lt;')}</span>${cite}</div></div>`;
  }).join('');
}

/** Half-year totals for intra-year shape checks. */
function halfYearTotals(series) {
  const h1 = (series || []).slice(0, 6).reduce((s, v) => s + (v != null && !isNaN(v) ? v : 0), 0);
  const h2 = (series || []).slice(6, 12).reduce((s, v) => s + (v != null && !isNaN(v) ? v : 0), 0);
  return { h1, h2, delta: h2 - h1, pct: h1 > 0 ? (h2 - h1) / h1 : null, total: h1 + h2, h2Share: (h1 + h2) > 0 ? h2 / (h1 + h2) : null };
}

function quarterTotals(series) {
  return [0, 1, 2, 3].map(q => (series || []).slice(q * 3, q * 3 + 3).reduce((s, v) => s + (v != null && !isNaN(v) ? v : 0), 0));
}

function peakQuarterIndex(qTotals) {
  let best = 0;
  for (let i = 1; i < qTotals.length; i++) if (qTotals[i] > qTotals[best]) best = i;
  return best;
}

function fyRatio(numSeries, denSeries) {
  const n = sumSeries(numSeries);
  const d = sumSeries(denSeries);
  return d ? n / d : null;
}

/**
 * Systematic outlier review: plan vs history + intra-year vs other periods.
 * Surfaces review items (not a fixed checklist of pet themes).
 */
function runHistoryOutlierReview(fy25, fy26, fy27, prior25, prior26, budget, deltas, plan) {
  const findings = [];
  const pp = (r) => r == null ? '—' : `${(r * 100).toFixed(1)}%`;
  const fmtVal = (v, kind) => kind === 'count' ? fmtN(v) : fmtM(v);
  let inLine = 0;

  const push = (f) => findings.push(f);
  const noteInLine = () => { inLine += 1; };

  // ── A. YoY growth vs prior-year growth (step-up / step-down outliers) ──
  const yoyMetrics = [
    { id: 'arr', label: 'Ending ARR', bud: budget.decArr, hist: prior26.decArr, prior: prior25.decArr, budYoy: deltas.arrYoyBudget, priorYoy: deltas.arrYoyPrior, kind: 'money', highPp: 8, medPp: 5 },
    { id: 'nn', label: 'Net new ARR', bud: budget.fyNn, hist: prior26.fyNn, prior: prior25 ? sumSeries(fy25.nn) : null, budYoy: deltas.nnYoyBudget, priorYoy: prior25 ? yoyPct(prior26.fyNn, sumSeries(fy25.nn)) : null, kind: 'money', highPp: 15, medPp: 8 },
    { id: 'rev', label: 'Revenue', bud: budget.fyRev, hist: prior26.fyRev, prior: prior25 ? prior25.fyRev : null, budYoy: deltas.revYoyBudget, priorYoy: prior25 ? yoyPct(prior26.fyRev, prior25.fyRev) : null, kind: 'money', highPp: 12, medPp: 6 },
    { id: 'ebitda', label: 'EBITDA', bud: budget.fyEbitda, hist: prior26.fyEbitda, prior: prior25 ? prior25.fyEbitda : null, budYoy: deltas.ebitdaYoyBudget, priorYoy: prior25 ? yoyPct(prior26.fyEbitda, prior25.fyEbitda) : null, kind: 'money', highPp: 20, medPp: 10 },
    { id: 'mkt', label: 'Marketing spend', bud: budget.fyMkt, hist: prior26.fyMkt, prior: prior25 ? prior25.fyMkt : null, budYoy: deltas.mktYoyBudget, priorYoy: prior25 ? yoyPct(prior26.fyMkt, prior25.fyMkt) : null, kind: 'money', highPp: 15, medPp: 8 },
    { id: 'mqls', label: 'MQLs', bud: sumSeries(fy27.mqls), hist: sumSeries(fy26.mqls), prior: sumSeries(fy25.mqls), budYoy: yoyPct(sumSeries(fy27.mqls), sumSeries(fy26.mqls)), priorYoy: yoyPct(sumSeries(fy26.mqls), sumSeries(fy25.mqls)), kind: 'count', highPp: 15, medPp: 8 },
    { id: 'cash', label: 'Dec cash', bud: budget.decCash, hist: prior26.decCash, prior: prior25 ? prior25.decCash : null, budYoy: deltas.cashYoyBudget, priorYoy: prior25 ? yoyPct(prior26.decCash, prior25.decCash) : null, kind: 'money', highPp: 15, medPp: 8 },
    { id: 'hc', label: 'Dec HC', bud: budget.decHc, hist: prior26.decHc, prior: prior25 ? prior25.decHc : null, budYoy: deltas.hcYoyBudget, priorYoy: prior25 ? yoyPct(prior26.decHc, prior25.decHc) : null, kind: 'count', highPp: 12, medPp: 6 },
  ];

  yoyMetrics.forEach(m => {
    if (m.budYoy == null || m.priorYoy == null) return;
    const stepPp = (m.budYoy - m.priorYoy) * 100;
    const abs = Math.abs(stepPp);
    if (abs >= m.highPp) {
      push({
        id: `yoy_step_${m.id}`,
        severity: abs >= m.highPp + 5 ? 'high' : 'medium',
        title: `${m.label}: YoY ${stepPp > 0 ? 'accelerates' : 'decelerates'} vs prior year`,
        detail: `Plan YoY ${pp(m.budYoy)} vs prior-year ${pp(m.priorYoy)} (${stepPp > 0 ? '+' : ''}${stepPp.toFixed(1)}pp). ${fmtVal(m.hist, m.kind)} → ${fmtVal(m.bud, m.kind)}.`,
        citation: `YoY step-up · ${m.label} · FY26 vs FY25 · FY27B vs FY26`,
        lens: 'vs_history',
      });
    } else if (abs >= m.medPp) {
      push({
        id: `yoy_tilt_${m.id}`,
        severity: 'info',
        title: `${m.label}: mild YoY pace shift`,
        detail: `Plan ${pp(m.budYoy)} vs prior ${pp(m.priorYoy)} (${stepPp > 0 ? '+' : ''}${stepPp.toFixed(1)}pp).`,
        citation: `YoY · ${m.label}`,
        lens: 'vs_history',
      });
    } else {
      noteInLine();
    }
  });

  // ── B. Intra-year shape: H1/H2 tilt vs FY26 ──
  const shapeMetrics = [
    { id: 'nn', label: 'Net new', series: 'nn', kind: 'money', ppThresh: 8 },
    { id: 'rev', label: 'Revenue', series: 'rev', kind: 'money', ppThresh: 6 },
    { id: 'ebitda', label: 'EBITDA', series: 'ebitda', kind: 'money', ppThresh: 8 },
    { id: 'opex', label: 'OpEx', series: 'opex', kind: 'money', ppThresh: 6 },
    { id: 'mkt', label: 'Marketing spend', series: 'mkt', kind: 'money', ppThresh: 6 },
    { id: 'mqls', label: 'MQLs', series: 'mqls', kind: 'count', ppThresh: 6 },
  ];

  shapeMetrics.forEach(m => {
    const bud = halfYearTotals(fy27[m.series]);
    const hist = halfYearTotals(fy26[m.series]);
    if (bud.h2Share == null || hist.h2Share == null) return;
    const sharePp = (bud.h2Share - hist.h2Share) * 100;
    const budTilt = bud.pct;
    const histTilt = hist.pct;
    const opposite = budTilt != null && histTilt != null && budTilt * histTilt < 0 && Math.abs(budTilt) > 0.08 && Math.abs(histTilt) > 0.08;

    if (Math.abs(sharePp) >= m.ppThresh || opposite) {
      push({
        id: `shape_${m.id}`,
        severity: Math.abs(sharePp) >= m.ppThresh + 4 || opposite ? 'medium' : 'info',
        title: `${m.label}: intra-year shape differs from FY26`,
        detail: `H2 share of year ${ (hist.h2Share * 100).toFixed(0)}% → ${(bud.h2Share * 100).toFixed(0)}% (${sharePp > 0 ? '+' : ''}${sharePp.toFixed(1)}pp). ` +
          `H1→H2: plan ${budTilt != null ? (budTilt * 100).toFixed(0) + '%' : '—'} vs hist ${histTilt != null ? (histTilt * 100).toFixed(0) + '%' : '—'}` +
          (opposite ? ' — direction flips vs history.' : '.'),
        citation: `H1/H2 · ${m.label} · FY27B vs FY26`,
        lens: 'intra_year',
      });
    } else {
      noteInLine();
    }

    // Peak quarter concentration vs hist
    const bQ = quarterTotals(fy27[m.series]);
    const hQ = quarterTotals(fy26[m.series]);
    const bPeak = peakQuarterIndex(bQ);
    const hPeak = peakQuarterIndex(hQ);
    const bTot = bQ.reduce((a, b) => a + b, 0);
    const hTot = hQ.reduce((a, b) => a + b, 0);
    const bConc = bTot > 0 ? bQ[bPeak] / bTot : 0;
    const hConc = hTot > 0 ? hQ[hPeak] / hTot : 0;
    if (bPeak !== hPeak && Math.abs(bConc - hConc) >= 0.06) {
      push({
        id: `peakq_${m.id}`,
        severity: 'info',
        title: `${m.label}: peak quarter shifts vs FY26`,
        detail: `Plan peaks Q${bPeak + 1} (${(bConc * 100).toFixed(0)}% of year) vs hist Q${hPeak + 1} (${(hConc * 100).toFixed(0)}%).`,
        citation: `Quarter totals · ${m.label}`,
        lens: 'intra_year',
      });
    }
  });

  // Stock path Jun→Dec vs hist
  [['eop', 'Ending ARR', 'money'], ['cash', 'Cash', 'money'], ['hc', 'HC', 'count']].forEach(([key, label, kind]) => {
    const bJun = fy27[key][5], bDec = fy27[key][11];
    const hJun = fy26[key][5], hDec = fy26[key][11];
    const bPct = bJun ? (bDec - bJun) / bJun : null;
    const hPct = hJun ? (hDec - hJun) / hJun : null;
    if (bPct == null || hPct == null) return;
    const gapPp = (bPct - hPct) * 100;
    if (Math.abs(gapPp) >= 8) {
      push({
        id: `h2path_${key}`,
        severity: Math.abs(gapPp) >= 15 ? 'medium' : 'info',
        title: `${label}: H2 path (Jun→Dec) diverges from FY26`,
        detail: `Plan ${(bPct * 100).toFixed(1)}% vs hist ${(hPct * 100).toFixed(1)}% (${gapPp > 0 ? '+' : ''}${gapPp.toFixed(1)}pp) · Jun ${fmtVal(bJun, kind)} → Dec ${fmtVal(bDec, kind)}.`,
        citation: `Jun/Dec · ${label} · FY27B vs FY26`,
        lens: 'intra_year',
      });
    } else {
      noteInLine();
    }
  });

  // ── C. Cross-metric: one rises while the other falls (H1→H2), vs hist co-movement ──
  const crossPairs = [
    { id: 'mkt_mql', a: 'mkt', b: 'mqls', aLabel: 'Marketing spend', bLabel: 'MQLs', aKind: 'money', bKind: 'count' },
    { id: 'mkt_nn', a: 'mkt', b: 'nn', aLabel: 'Marketing spend', bLabel: 'Net new', aKind: 'money', bKind: 'money' },
    { id: 'opex_rev', a: 'opex', b: 'rev', aLabel: 'OpEx', bLabel: 'Revenue', aKind: 'money', bKind: 'money' },
    { id: 'ebitda_rev', a: 'ebitda', b: 'rev', aLabel: 'EBITDA', bLabel: 'Revenue', aKind: 'money', bKind: 'money' },
    { id: 'hc_nn', a: 'hc', b: 'nn', aLabel: 'HC (stock path)', bLabel: 'Net new', aKind: 'count', bKind: 'money', aStock: true },
  ];

  crossPairs.forEach(p => {
    const aBud = p.aStock
      ? { h1: fy27[p.a][5], h2: fy27[p.a][11], pct: fy27[p.a][5] ? (fy27[p.a][11] - fy27[p.a][5]) / fy27[p.a][5] : null }
      : halfYearTotals(fy27[p.a]);
    const bBud = halfYearTotals(fy27[p.b]);
    const aHist = p.aStock
      ? { h1: fy26[p.a][5], h2: fy26[p.a][11], pct: fy26[p.a][5] ? (fy26[p.a][11] - fy26[p.a][5]) / fy26[p.a][5] : null }
      : halfYearTotals(fy26[p.a]);
    const bHist = halfYearTotals(fy26[p.b]);
    if (aBud.pct == null || bBud.pct == null) return;

    const inverse = (aBud.pct > 0.05 && bBud.pct < -0.05) || (aBud.pct < -0.05 && bBud.pct > 0.05);
    const histInverse = aHist.pct != null && bHist.pct != null &&
      ((aHist.pct > 0.05 && bHist.pct < -0.05) || (aHist.pct < -0.05 && bHist.pct > 0.05));
    const histSameDir = aHist.pct != null && bHist.pct != null && aHist.pct * bHist.pct > 0;

    if (inverse) {
      push({
        id: `cross_${p.id}`,
        severity: histSameDir ? 'high' : (histInverse ? 'medium' : 'high'),
        title: `${p.aLabel} vs ${p.bLabel}: inverse H1→H2 move`,
        detail: `Plan H1→H2: ${p.aLabel} ${(aBud.pct * 100).toFixed(0)}%, ${p.bLabel} ${(bBud.pct * 100).toFixed(0)}%. ` +
          (histInverse
            ? 'Same inverse shape in FY26 — inherited pattern, still a review item.'
            : histSameDir
              ? 'FY26 moved together — plan breaks historical co-movement.'
              : 'Check whether drivers justify the split.'),
        citation: `H1/H2 cross · ${p.aLabel} / ${p.bLabel} · FY27B vs FY26`,
        lens: 'cross_metric',
      });
    } else {
      noteInLine();
    }
  });

  // ── D. Derived efficiency / intensity ratios ──
  const budCpl = fyRatio(fy27.mkt, fy27.mqls);
  const histCpl = fyRatio(fy26.mkt, fy26.mqls);
  const cplYoy = yoyPct(budCpl, histCpl);
  if (cplYoy != null && Math.abs(cplYoy) >= 0.1) {
    push({
      id: 'ratio_cpl',
      severity: Math.abs(cplYoy) >= 0.2 ? 'medium' : 'info',
      title: `Blended CPL ${cplYoy > 0 ? 'rises' : 'falls'} vs FY26`,
      detail: `${fmtM(histCpl)} → ${fmtM(budCpl)} (${pp(cplYoy)}).`,
      citation: 'FY mkt / FY MQLs · GTM',
      lens: 'vs_history',
    });
  } else if (cplYoy != null) {
    noteInLine();
  }

  const cplH1 = (() => {
    const s = halfYearTotals(fy27.mkt), m = halfYearTotals(fy27.mqls);
    return m.h1 > 0 ? s.h1 / m.h1 : null;
  })();
  const cplH2 = (() => {
    const s = halfYearTotals(fy27.mkt), m = halfYearTotals(fy27.mqls);
    return m.h2 > 0 ? s.h2 / m.h2 : null;
  })();
  if (cplH1 != null && cplH2 != null && cplH1 > 0) {
    const cplIntra = (cplH2 - cplH1) / cplH1;
    const histCplH1 = (() => {
      const s = halfYearTotals(fy26.mkt), m = halfYearTotals(fy26.mqls);
      return m.h1 > 0 ? s.h1 / m.h1 : null;
    })();
    const histCplH2 = (() => {
      const s = halfYearTotals(fy26.mkt), m = halfYearTotals(fy26.mqls);
      return m.h2 > 0 ? s.h2 / m.h2 : null;
    })();
    const histIntra = histCplH1 && histCplH2 ? (histCplH2 - histCplH1) / histCplH1 : null;
    if (Math.abs(cplIntra) >= 0.12) {
      push({
        id: 'ratio_cpl_intra',
        severity: Math.abs(cplIntra) >= 0.25 ? 'medium' : 'info',
        title: 'CPL shifts intra-year (H1→H2)',
        detail: `${fmtM(cplH1)} → ${fmtM(cplH2)} (${(cplIntra * 100).toFixed(0)}%)` +
          (histIntra != null ? ` · FY26 was ${(histIntra * 100).toFixed(0)}%` : '') + '.',
        citation: 'H1/H2 mkt÷MQLs',
        lens: 'intra_year',
      });
    } else {
      noteInLine();
    }
  }

  if (prior26.ebitdaMargin != null && budget.ebitdaMargin != null) {
    const marginDelta = (budget.ebitdaMargin - prior26.ebitdaMargin) * 100;
    if (Math.abs(marginDelta) >= 3) {
      push({
        id: 'ratio_ebitda_margin',
        severity: marginDelta <= -5 ? 'medium' : 'info',
        title: `EBITDA margin ${marginDelta < 0 ? 'compresses' : 'expands'} vs FY26`,
        detail: `${(prior26.ebitdaMargin * 100).toFixed(1)}% → ${(budget.ebitdaMargin * 100).toFixed(1)}% (${marginDelta > 0 ? '+' : ''}${marginDelta.toFixed(1)}pp).`,
        citation: 'FY EBITDA / revenue',
        lens: 'vs_history',
      });
    } else {
      noteInLine();
    }
  }

  const budMktInt = budget.fyRev ? budget.fyMkt / budget.fyRev : null;
  const histMktInt = prior26.fyRev ? prior26.fyMkt / prior26.fyRev : null;
  if (budMktInt != null && histMktInt != null) {
    const intPp = (budMktInt - histMktInt) * 100;
    if (Math.abs(intPp) >= 1.5) {
      push({
        id: 'ratio_mkt_intensity',
        severity: intPp >= 3 ? 'medium' : 'info',
        title: `Marketing intensity ${intPp > 0 ? 'up' : 'down'} vs FY26`,
        detail: `Mkt / rev ${(histMktInt * 100).toFixed(1)}% → ${(budMktInt * 100).toFixed(1)}% (${intPp > 0 ? '+' : ''}${intPp.toFixed(1)}pp).`,
        citation: 'FY mkt / FY revenue',
        lens: 'vs_history',
      });
    } else {
      noteInLine();
    }
  }

  if (prior26.arrPerFte != null && budget.arrPerFte != null) {
    const prodYoy = yoyPct(budget.arrPerFte, prior26.arrPerFte);
    if (prodYoy != null && Math.abs(prodYoy) >= 0.08) {
      push({
        id: 'ratio_arr_fte',
        severity: prodYoy < -0.08 ? 'medium' : 'info',
        title: `ARR / FTE ${prodYoy < 0 ? 'declines' : 'improves'} vs FY26`,
        detail: `${fmtM(prior26.arrPerFte)} → ${fmtM(budget.arrPerFte)} (${pp(prodYoy)}).`,
        citation: 'Dec ARR / Dec HC',
        lens: 'vs_history',
      });
    } else {
      noteInLine();
    }
  }

  // Cash down while ARR up (level YoY) — classic review flag
  if (deltas.cashYoyBudget != null && deltas.arrYoyBudget != null && deltas.cashYoyBudget < -0.1 && deltas.arrYoyBudget > 0.05) {
    push({
      id: 'cross_cash_arr_yoy',
      severity: 'high',
      title: 'Cash declines YoY while ARR grows',
      detail: `Dec cash ${pp(deltas.cashYoyBudget)}, ARR ${pp(deltas.arrYoyBudget)} · floor ${fmtM(plan.cashFloor)}.`,
      citation: 'Dec cash vs Dec ARR YoY',
      lens: 'cross_metric',
    });
  }

  // Marketing grows much faster than ARR
  if (deltas.mktYoyBudget != null && deltas.arrYoyBudget != null && deltas.mktYoyBudget > deltas.arrYoyBudget + 0.15) {
    push({
      id: 'cross_mkt_arr_yoy',
      severity: 'medium',
      title: 'Marketing spend grows faster than ARR',
      detail: `Mkt YoY ${pp(deltas.mktYoyBudget)} vs ARR YoY ${pp(deltas.arrYoyBudget)}.`,
      citation: 'FY mkt YoY vs Dec ARR YoY',
      lens: 'cross_metric',
    });
  }

  push({
    id: 'fy26_split',
    severity: 'info',
    title: 'Review basis',
    detail: `Scanned YoY step-ups, H1/H2 & quarterly shape, and cross-metric co-movement vs FY26 (H1 Actual through ${CLOSE_MONTH}; H2 Forecast). FY25 used where available for prior-year pace.`,
    citation: 'runHistoryOutlierReview · buildYoyCompare',
    lens: 'meta',
  });

  if (inLine > 0) {
    push({
      id: 'in_line_summary',
      severity: 'ok',
      title: `${inLine} checks in line with history / intra-year shape`,
      detail: 'Suppressed from the list above — no material outlier vs thresholds.',
      citation: 'Outlier thresholds in runHistoryOutlierReview',
      lens: 'meta',
    });
  }

  // Sort: high → medium → info → ok; meta last among same sev
  const rank = { high: 0, medium: 1, info: 2, low: 3, ok: 4 };
  findings.sort((a, b) => (rank[a.severity] ?? 9) - (rank[b.severity] ?? 9));
  return findings;
}

/**
 * History packet for Plan Assurance — outliers vs hist + intra-year.
 * Citations point at outlook hist / TS rows — no invented bridges.
 */
function buildAssuranceHistoryPacket(planPacket) {
  const plan = planPacket || buildBudgetAssurancePacket();
  const years = buildYoyCompare();
  const byId = Object.fromEntries(years.map(y => [y.id, y]));
  const fy25 = byId.fy25;
  const fy26 = byId.fy26;
  const fy27 = byId.fy27;

  const snap = (y, label, source) => {
    if (!y) return null;
    const decArr = y.eop[11];
    const fyNn = sumSeries(y.nn);
    const fyRev = sumSeries(y.rev);
    const fyEbitda = sumSeries(y.ebitda);
    const fyMkt = sumSeries(y.mkt);
    const decCash = y.cash[11];
    const decHc = y.hc[11];
    return {
      label, source,
      decArr, fyNn, fyRev, fyEbitda, fyMkt, decCash, decHc,
      ebitdaMargin: fyRev ? fyEbitda / fyRev : null,
      arrPerFte: decHc ? decArr / decHc : null,
    };
  };

  const prior25 = snap(fy25, 'FY25', 'Backcast / scaled from FY26 where hist thin');
  const prior26 = snap(fy26, 'FY26', `Outlook hist · H1 Actual through ${CLOSE_MONTH} · H2 Forecast`);
  const budget = {
    label: `FY${BUDGET_YEAR}B`,
    source: 'Budget Engine linked plan',
    decArr: plan.decArr,
    fyNn: plan.fyNn,
    fyRev: plan.fyRev,
    fyEbitda: plan.fyEbitda,
    fyMkt: plan.fyMkt,
    decCash: plan.endCash,
    decHc: plan.decHc,
    ebitdaMargin: plan.fyRev ? plan.fyEbitda / plan.fyRev : null,
    arrPerFte: plan.decHc ? plan.decArr / plan.decHc : null,
  };

  const deltas = {
    arrYoyBudget: yoyPct(budget.decArr, prior26.decArr),
    arrYoyPrior: yoyPct(prior26.decArr, prior25.decArr),
    nnYoyBudget: yoyPct(budget.fyNn, prior26.fyNn),
    revYoyBudget: yoyPct(budget.fyRev, prior26.fyRev),
    ebitdaYoyBudget: yoyPct(budget.fyEbitda, prior26.fyEbitda),
    mktYoyBudget: yoyPct(budget.fyMkt, prior26.fyMkt),
    cashYoyBudget: yoyPct(budget.decCash, prior26.decCash),
    hcYoyBudget: yoyPct(budget.decHc, prior26.decHc),
  };

  const findings = runHistoryOutlierReview(fy25, fy26, fy27, prior25, prior26, budget, deltas, plan);

  return {
    closeMonth: CLOSE_MONTH,
    prior25,
    prior26,
    budget,
    deltas,
    findings,
    plan,
  };
}

/** Structured packet models may reason over — closed formula graph snapshot. */
function buildBudgetAssurancePacket() {
  const arr = computeBudgetArr();
  const gtm = computeGtmPlan();
  const hc = computeHcPlan();
  const is = computeIsPlan();
  const sales = computeSalesPlan();
  const { cfs } = computeCfBsPlan();
  const dec = BUD_P[11];
  const jan = BUD_P[0];
  const m = sales.meta;
  const decArr = arr[dec].eop;
  const targetArr = BOP_LOCK * (1 + STATE.yoyEndingArrGrowthPct / 100);
  const fyRev = BUD_P.reduce((s, p) => s + is[p].revenue, 0);
  const fyEbitda = BUD_P.reduce((s, p) => s + is[p].ebitda, 0);
  const fyNn = BUD_P.reduce((s, p) => s + arr[p].nn, 0);
  const fyMkt = BUD_P.reduce((s, p) => s + gtm[p].spend, 0);
  const fyMql = BUD_P.reduce((s, p) => s + gtm[p].mqls, 0);
  const fyChMql = BUD_P.reduce((s, p) => s + (gtm[p].channelMqls || 0), 0);
  const fySpendId = BUD_P.reduce((s, p) => {
    const r = gtm[p];
    const cpl = r && r.rates ? Number(r.rates.cpl) || 0 : 0;
    return s + (r.mqls || 0) * cpl;
  }, 0);
  const mixDevMax = BUD_P.reduce((mx, p) => {
    const raw = gtm[p].mixRawSum;
    if (raw == null) return mx;
    return Math.max(mx, Math.abs(raw - 1));
  }, 0);
  const grrVals = BUD_P.map(p => arr[p].grr).filter(v => v != null && !isNaN(v));
  const avgGrr = grrVals.length ? grrVals.reduce((a, b) => a + b, 0) / grrVals.length : null;
  const minGrr = grrVals.length ? Math.min(...grrVals) : null;
  const cashByMonth = BUD_P.map(p => cfs[p].ending_cash);
  const minCash = Math.min(...cashByMonth);
  const minCashPeriod = BUD_P[cashByMonth.indexOf(minCash)];
  const endCash = cfs[dec].ending_cash;
  const cashFloor = STATE.cashFloorDec != null ? STATE.cashFloorDec : 30000000;
  const janHc = hc[jan].headsTotal;
  const janHcExpected = HC_BOP_TOTAL;
  const fyIsSm = BUD_P.reduce((s, p) => s + is[p].sm, 0);
  const fyGtmSm = BUD_P.reduce((s, p) => s + (gtm[p].smTotal || 0), 0);
  return {
    period_label: `FY${BUDGET_YEAR} Budget`,
    budget_year: BUDGET_YEAR,
    yoyGrowthPct: STATE.yoyEndingArrGrowthPct,
    bopArr: BOP_LOCK,
    decArr,
    targetArr,
    fyNn,
    fyRev,
    fyEbitda,
    endCash,
    cashFloor,
    minCash,
    minCashPeriod,
    fyMkt,
    fyMql,
    fyChMql,
    fySpendId,
    mixDevMax,
    avgGrr,
    minGrr,
    salesEnd: hc[dec].ending.sales,
    csEnd: hc[dec].ending.cs,
    aeNeeded: m.aeNeeded,
    csNeeded: m.csNeeded,
    coverPct: m.coverPct,
    hirePct: m.hirePct,
    benchTarget: STATE.existingBenchCoverPct,
    janHc,
    janHcExpected,
    decHc: hc[dec].headsTotal,
    pipelineCoverage: STATE.pipelineCoverageMult,
    pipelineMin: 2.5,
    fyIsSm,
    fyGtmSm,
  };
}

function runBudgetRiskChecks(packet) {
  const p = packet || buildBudgetAssurancePacket();
  const out = [];

  // ── ARR / growth path ──
  const arrGap = p.decArr - p.targetArr;
  if (Math.abs(arrGap) <= Math.max(1000, p.targetArr * 0.002)) {
    out.push({ id: 'arr_path', severity: 'ok', title: 'Dec ARR path', detail: `Hits YoY target ${fmtM(p.targetArr)} (${p.yoyGrowthPct.toFixed(1)}%).` });
  } else if (arrGap < 0) {
    out.push({ id: 'arr_path', severity: 'high', title: 'Dec ARR short of YoY target', detail: `${fmtM(p.decArr)} vs target ${fmtM(p.targetArr)} (${fmtM(arrGap)}).` });
  } else {
    out.push({ id: 'arr_path', severity: 'low', title: 'Dec ARR above YoY target', detail: `${fmtM(p.decArr)} vs ${fmtM(p.targetArr)} — confirm intentional upside.` });
  }

  const bridge = p.bopArr + p.fyNn;
  const bridgeGap = Math.abs(bridge - p.decArr);
  if (bridgeGap <= Math.max(500, p.decArr * 0.001)) {
    out.push({ id: 'arr_bridge', severity: 'ok', title: 'ARR bridge identity', detail: `BOP ${fmtM(p.bopArr)} + NN ${fmtM(p.fyNn)} = Dec ${fmtM(p.decArr)}.` });
  } else {
    out.push({ id: 'arr_bridge', severity: 'high', title: 'ARR bridge broken', detail: `BOP+NN ${fmtM(bridge)} vs Dec EOP ${fmtM(p.decArr)} (gap ${fmtM(bridge - p.decArr)}).` });
  }

  if (p.avgGrr != null) {
    if (p.minGrr >= 0.90 && p.avgGrr >= 0.92) {
      out.push({ id: 'grr_floor', severity: 'ok', title: 'GRR floor', detail: `Avg ${(p.avgGrr * 100).toFixed(1)}% · min month ${(p.minGrr * 100).toFixed(1)}%.` });
    } else if (p.minGrr >= 0.85) {
      out.push({ id: 'grr_floor', severity: 'medium', title: 'GRR soft vs floor', detail: `Avg ${(p.avgGrr * 100).toFixed(1)}% · min ${(p.minGrr * 100).toFixed(1)}% (policy ≥90% min).` });
    } else {
      out.push({ id: 'grr_floor', severity: 'high', title: 'GRR below floor', detail: `Min month ${(p.minGrr * 100).toFixed(1)}% · avg ${(p.avgGrr * 100).toFixed(1)}%.` });
    }
  }

  // ── Cash ──
  if (p.endCash >= p.cashFloor) {
    out.push({ id: 'cash_floor', severity: 'ok', title: 'Dec cash floor', detail: `${fmtM(p.endCash)} ≥ floor ${fmtM(p.cashFloor)}.` });
  } else {
    const sev = p.endCash < p.cashFloor * 0.85 ? 'high' : 'medium';
    out.push({ id: 'cash_floor', severity: sev, title: 'Dec cash below floor', detail: `${fmtM(p.endCash)} vs floor ${fmtM(p.cashFloor)} (${fmtM(p.endCash - p.cashFloor)}).` });
  }

  if (p.minCash >= p.cashFloor) {
    out.push({ id: 'cash_path', severity: 'ok', title: 'Intra-year cash path', detail: `All months ≥ floor · trough ${fmtM(p.minCash)} (${p.minCashPeriod}).` });
  } else if (p.endCash >= p.cashFloor) {
    out.push({ id: 'cash_path', severity: 'medium', title: 'Mid-year cash dip below floor', detail: `Trough ${fmtM(p.minCash)} in ${p.minCashPeriod} · Dec recovers to ${fmtM(p.endCash)}.` });
  } else {
    out.push({ id: 'cash_path', severity: 'high', title: 'Cash path breaches floor', detail: `Trough ${fmtM(p.minCash)} (${p.minCashPeriod}) · Dec ${fmtM(p.endCash)}.` });
  }

  // ── Sales / CS capacity ──
  if (p.salesEnd >= p.aeNeeded) {
    out.push({ id: 'nb_cover', severity: 'ok', title: 'NB AE coverage', detail: `${fmtN(p.salesEnd)} ending AEs cover need ${fmtN(p.aeNeeded)}.` });
  } else {
    out.push({ id: 'nb_cover', severity: 'high', title: 'NB AE shortfall', detail: `${fmtN(p.salesEnd)} ending vs ${fmtN(p.aeNeeded)} needed for budget NB.` });
  }

  if (p.csEnd >= p.csNeeded) {
    out.push({ id: 'cs_cover', severity: 'ok', title: 'CS coverage', detail: `${fmtN(p.csEnd)} ending CS cover need ${fmtN(p.csNeeded)}.` });
  } else {
    out.push({ id: 'cs_cover', severity: 'high', title: 'CS headcount shortfall', detail: `${fmtN(p.csEnd)} ending vs ${fmtN(p.csNeeded)} needed (expansion + churn cover).` });
  }

  if (p.coverPct + 0.5 >= p.benchTarget) {
    out.push({ id: 'bench', severity: 'ok', title: 'Existing bench cover', detail: `Bench covers ${p.coverPct.toFixed(0)}% of budget (target ${p.benchTarget.toFixed(0)}%).` });
  } else {
    out.push({ id: 'bench', severity: 'medium', title: 'Bench cover below expectation', detail: `${p.coverPct.toFixed(0)}% bench / ${p.hirePct.toFixed(0)}% from hires (target bench ${p.benchTarget.toFixed(0)}%).` });
  }

  // ── GTM / funnel ──
  if (p.pipelineCoverage + 1e-9 >= p.pipelineMin) {
    out.push({ id: 'pipeline', severity: 'ok', title: 'Pipeline coverage', detail: `${p.pipelineCoverage.toFixed(1)}× on NB funnel (min ${p.pipelineMin.toFixed(1)}×).` });
  } else {
    out.push({ id: 'pipeline', severity: 'medium', title: 'Pipeline coverage thin', detail: `${p.pipelineCoverage.toFixed(1)}× vs min ${p.pipelineMin.toFixed(1)}× — funnel may understate required MQLs.` });
  }

  const mqlGap = Math.abs((p.fyChMql || 0) - (p.fyMql || 0));
  if (mqlGap <= 2) {
    out.push({ id: 'gtm_mql', severity: 'ok', title: 'GTM MQL identity', detail: `Channel MQLs ${fmtN(p.fyChMql)} match funnel required ${fmtN(p.fyMql)}.` });
  } else {
    out.push({ id: 'gtm_mql', severity: 'medium', title: 'GTM MQL mismatch', detail: `Channel ${fmtN(p.fyChMql)} vs required ${fmtN(p.fyMql)} — check allocation.` });
  }

  const spendGap = Math.abs((p.fySpendId || 0) - (p.fyMkt || 0));
  if (spendGap <= Math.max(100, (p.fyMkt || 0) * 0.005)) {
    out.push({ id: 'gtm_spend', severity: 'ok', title: 'GTM spend = MQL × CPL', detail: `Program ${fmtM(p.fyMkt)} ties to funnel × blended CPL.` });
  } else {
    out.push({ id: 'gtm_spend', severity: 'medium', title: 'GTM spend identity off', detail: `Spend ${fmtM(p.fyMkt)} vs MQL×CPL ${fmtM(p.fySpendId)} (gap ${fmtM(spendGap)}).` });
  }

  if (p.mixDevMax <= 0.02) {
    out.push({ id: 'gtm_mix', severity: 'ok', title: 'Channel mix sums to 100%', detail: `Max period mix drift ${(p.mixDevMax * 100).toFixed(1)}pp.` });
  } else {
    out.push({ id: 'gtm_mix', severity: 'medium', title: 'Channel mix not normalized', detail: `Max |mix−100%| ${(p.mixDevMax * 100).toFixed(1)}pp — renormalize channel weights.` });
  }

  // ── HC / P&L ──
  if (Math.abs(p.janHc - p.janHcExpected) <= 1) {
    out.push({ id: 'jan_hc', severity: 'ok', title: 'Jan HC lock', detail: `Jan ${fmtN(p.janHc)} matches Dec'26 forecast lock ${fmtN(p.janHcExpected)}.` });
  } else {
    out.push({ id: 'jan_hc', severity: 'high', title: 'Jan HC unlocked from Dec\'26', detail: `Jan ${fmtN(p.janHc)} vs lock ${fmtN(p.janHcExpected)}.` });
  }

  if (p.fyEbitda >= 0) {
    out.push({ id: 'ebitda', severity: 'ok', title: 'FY EBITDA', detail: `${fmtM(p.fyEbitda)} on ${fmtM(p.fyRev)} revenue.` });
  } else {
    out.push({ id: 'ebitda', severity: 'medium', title: 'FY EBITDA negative', detail: `${fmtM(p.fyEbitda)} — confirm burn vs cash floor and growth case.` });
  }

  // GTM program is a component of IS S&M (not the whole line) — flag only if program > IS S&M
  if (p.fyGtmSm <= p.fyIsSm * 1.02) {
    out.push({ id: 'sm_tie', severity: 'ok', title: 'GTM inside IS S&M', detail: `Implied GTM S&M ${fmtM(p.fyGtmSm)} ≤ IS S&M ${fmtM(p.fyIsSm)}.` });
  } else {
    out.push({ id: 'sm_tie', severity: 'medium', title: 'GTM S&M exceeds IS S&M', detail: `GTM implied ${fmtM(p.fyGtmSm)} vs IS ${fmtM(p.fyIsSm)} — check MKT_SM_RATIO / dept P&L.` });
  }

  return out;
}

function buildDeterministicAssuranceNarrative(packet, risks) {
  const p = packet || buildBudgetAssurancePacket();
  const r = risks || runBudgetRiskChecks(p);
  const highs = r.filter(x => x.severity === 'high');
  const meds = r.filter(x => x.severity === 'medium');
  const lines = [];
  lines.push(
    `FY${p.budget_year} operating plan targets ${p.yoyGrowthPct.toFixed(1)}% YoY ending ARR ` +
    `(${fmtM(p.bopArr)} → ${fmtM(p.targetArr)}). Current Dec path is ${fmtM(p.decArr)} ` +
    `with FY net new ${fmtM(p.fyNn)}, FY revenue ${fmtM(p.fyRev)}, and FY EBITDA ${fmtM(p.fyEbitda)}.`,
  );
  lines.push(
    `GTM sizes ${fmtN(p.fyMql)} MQLs on ${fmtM(p.fyMkt)} program spend at ${p.pipelineCoverage.toFixed(1)}× pipeline cover. ` +
    `Sales ends at ${fmtN(p.salesEnd)} NB AEs / ${fmtN(p.csEnd)} CS ` +
    `(${p.coverPct.toFixed(0)}% bench / ${p.hirePct.toFixed(0)}% hires). ` +
    `HC ${fmtN(p.janHc)} → ${fmtN(p.decHc)}. Dec cash ${fmtM(p.endCash)} vs floor ${fmtM(p.cashFloor)}.`,
  );
  if (highs.length) {
    lines.push(`Priority risks: ${highs.map(x => x.title).join('; ')}.`);
  } else if (meds.length) {
    lines.push(`Watch items: ${meds.map(x => x.title).join('; ')}. No high-severity blockers on hard checks.`);
  } else {
    lines.push('Hard checks are clear against current commitments. Review History for YoY shape vs FY26.');
  }
  return lines.join('\n\n');
}

/** Sum a 12-length series ignoring nulls. */
function sumSeries(arr) {
  let s = 0;
  let n = 0;
  for (const v of arr || []) {
    if (v != null && !isNaN(v)) { s += v; n += 1; }
  }
  return n ? s : null;
}

function yoyPct(curr, prior) {
  if (prior == null || prior === 0 || curr == null) return null;
  return (curr - prior) / Math.abs(prior);
}

function buildDeterministicHistoryNarrative(hist) {
  const h = hist || buildAssuranceHistoryPacket();

    `net new ${fmtM(h.prior26.fyNn)} → ${fmtM(h.budget.fyNn)}, revenue ${fmtM(h.prior26.fyRev)} → ${fmtM(h.budget.fyRev)} (${pp(d.revYoyBudget)}).`,
  );
  lines.push(
    `Prior-year ARR growth was ${pp(d.arrYoyPrior)} (FY25 ${fmtM(h.prior25.decArr)} → FY26). ` +
    `Cash ${fmtM(h.prior26.decCash)} → ${fmtM(h.budget.decCash)}; EBITDA ${fmtM(h.prior26.fyEbitda)} → ${fmtM(h.budget.fyEbitda)}; ` +
    `marketing ${fmtM(h.prior26.fyMkt)} → ${fmtM(h.budget.fyMkt)}.`,
  );
  const flags = (h.findings || []).filter(f => f.severity === 'high' || f.severity === 'medium');
  const infos = (h.findings || []).filter(f => f.severity === 'info' && f.lens !== 'meta');
  if (flags.length) {

  if (infos.length) {
    lines.push(`${infos.length} milder notes (shape / peak-quarter / ratio) also listed for optional review.`);
  }
  return lines.join('\n\n');
}

function snapshotScenarioLevers() {
  for (const p of BUD_P) {
    getGtmRates(p);

  }
  const snap = {};
  for (const k of SCENARIO_LEVER_KEYS) snap[k] = cloneScenarioJson(STATE[k]);
  return snap;
}

function restoreScenarioLevers(snap) {
  for (const k of SCENARIO_LEVER_KEYS) {
    if (Object.prototype.hasOwnProperty.call(snap, k)) STATE[k] = cloneScenarioJson(snap[k]);
  }
}

function scenarioPlanFingerprint(p) {
  p = p || buildBudgetAssurancePacket();
  return [
    p.yoyGrowthPct, Math.round(p.decArr), Math.round(p.endCash), Math.round(p.fyMkt),
    Math.round(p.fyMql), p.salesEnd, p.csEnd, p.pipelineCoverage, STATE.salesAttritionPct,
  ].join('|');
}

function scaleAllGtmCpl(factor) {
  for (const p of BUD_P) {
    const r = getGtmRates(p);
    r.cpl = Math.max(1, (Number(r.cpl) || DEFAULT_GTM_RATES.cpl) * factor);
    STATE.gtmRatesByPeriod[p] = { ...r };
  }
  for (const p of BUD_P) {
    const c = getGtmChannelCpl(p);
    for (const k of Object.keys(c)) c[k] = Math.max(1, (Number(c[k]) || 1) * factor);
  }
}

function bumpChurnMix(factor) {
  for (const p of BUD_P) {
    const m = { ...getMix(p) };
    m.churn = (m.churn || 0) * factor;
    m.cont = (m.cont || 0) * Math.sqrt(factor);
    STATE.mixByPeriod[p] = m;
  }
}

function classifyScenarioOutcome(base, shock) {
  const breaks = [];
  const watches = [];
  if (shock.decArr < base.targetArr * 0.995) breaks.push('Dec ARR vs YoY target');
  if (shock.endCash < base.cashFloor) breaks.push('Dec cash floor');
  else if (shock.minCash < base.cashFloor) watches.push('Mid-year cash trough');
  // Operating liquidity: deep drawdown even if still above formal floor, or floor crushed
  const cashDrop = base.endCash - shock.endCash;
  if (shock.endCash < base.cashFloor * 0.55 || cashDrop >= Math.max(12e6, base.endCash * 0.35)) {
    breaks.push('Operating liquidity at risk');
  } else if (cashDrop >= Math.max(6e6, base.endCash * 0.18)) {
    watches.push('Material cash drawdown');
  }
  if (shock.salesEnd < shock.aeNeeded) breaks.push('NB AE cover');
  if (shock.csEnd < shock.csNeeded) breaks.push('CS cover');
  if (shock.fyEbitda < 0 && base.fyEbitda >= 0) watches.push('EBITDA turns negative');
  if (shock.fyMkt > base.fyMkt * 1.2) watches.push('Marketing spend +20%');
  let status = 'ok';
  if (breaks.length) status = 'break';
  else if (watches.length) status = 'watch';
  return { status, breaks, watches };
}

function explainScenarioCase(base, c, def) {
  const bits = [];
  if (def && def.plain) bits.push(def.plain);
  if (c.yoyGrowthPct != null && Math.abs(c.yoyGrowthPct - base.yoyGrowthPct) >= 0.05) {
    bits.push(
      `YoY ending-ARR growth moves from ${base.yoyGrowthPct.toFixed(1)}% to ${c.yoyGrowthPct.toFixed(1)}% ` +
      `(${(c.yoyGrowthPct - base.yoyGrowthPct) > 0 ? '+' : ''}${(c.yoyGrowthPct - base.yoyGrowthPct).toFixed(1)} percentage points — not a −5% cut to revenue).`
    );
  }
  if (Math.abs(c.dArr) >= 1000) {
    bits.push(`Dec ARR ${fmtM(base.decArr)} → ${fmtM(c.decArr)} (${fmtM(c.dArr)} vs plan).`);
  }
  if (Math.abs(c.dCash) >= 1000) {
    const vsFloor = c.endCash - base.cashFloor;
    bits.push(
      `Dec cash ${fmtM(base.endCash)} → ${fmtM(c.endCash)} (${fmtM(c.dCash)}); ` +
      `${vsFloor >= 0 ? fmtM(vsFloor) + ' above' : fmtM(Math.abs(vsFloor)) + ' below'} the ${fmtM(base.cashFloor)} floor` +
      (c.minCash < c.endCash ? `; trough ${fmtM(c.minCash)}` : '') + '.'
    );
  }
  if (Math.abs(c.dMkt) >= 1000) {
    bits.push(`Marketing program spend ${fmtM(c.fyMkt - c.dMkt)} → ${fmtM(c.fyMkt)} (${fmtM(c.dMkt)}).`);
  }
  if (Math.abs(c.dEbitda) >= 1000) {
    bits.push(`FY EBITDA ${fmtM(c.fyEbitda - c.dEbitda)} → ${fmtM(c.fyEbitda)} (${fmtM(c.dEbitda)}).`);
  }
  if (c.breaks && c.breaks.length) bits.push(`Flags: ${c.breaks.join('; ')}.`);
  else if (c.watches && c.watches.length) bits.push(`Watch: ${c.watches.join('; ')}.`);
  return bits.join(' ');
}

function evaluateScenarioShock(label, family, applyFn, base, snap, def) {
  restoreScenarioLevers(snap);
  applyFn();
  const shock = buildBudgetAssurancePacket();
  const cls = classifyScenarioOutcome(base, shock);
  const row = {
    id: def && def.id,
    label,
    family,
    status: cls.status,
    breaks: cls.breaks,
    watches: cls.watches,
    decArr: shock.decArr,
    dArr: shock.decArr - base.decArr,
    endCash: shock.endCash,
    dCash: shock.endCash - base.endCash,
    minCash: shock.minCash,
    fyEbitda: shock.fyEbitda,
    dEbitda: shock.fyEbitda - base.fyEbitda,
    fyMkt: shock.fyMkt,
    dMkt: shock.fyMkt - base.fyMkt,
    salesEnd: shock.salesEnd,
    aeNeeded: shock.aeNeeded,
    csEnd: shock.csEnd,
    csNeeded: shock.csNeeded,
    yoyGrowthPct: shock.yoyGrowthPct,
  };
  row.explain = explainScenarioCase(base, row, def);
  return row;
}

/** Box-Muller normal sample. */
function randn() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function normalPdf(x, mu, sigma) {
  if (sigma <= 0) return 0;
  const z = (x - mu) / sigma;
  return Math.exp(-0.5 * z * z) / (sigma * Math.sqrt(2 * Math.PI));
}

function erfApprox(x) {
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x);
  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
  const t = 1 / (1 + p * x);
  const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
  return sign * y;
}

function normalCdf(x, mu, sigma) {
  if (sigma <= 0) return x >= mu ? 1 : 0;
  return 0.5 * (1 + erfApprox((x - mu) / (sigma * Math.SQRT2)));
}

function histogram(values, bins) {
  if (!values.length) return { edges: [], counts: [], density: [] };
  let lo = Math.min(...values), hi = Math.max(...values);
  if (hi <= lo) { hi = lo + 1; }
  const width = (hi - lo) / bins;
  const counts = Array(bins).fill(0);
  for (const v of values) {
    let i = Math.floor((v - lo) / width);
    if (i >= bins) i = bins - 1;
    if (i < 0) i = 0;
    counts[i] += 1;
  }
  const edges = [];
  for (let i = 0; i <= bins; i++) edges.push(lo + i * width);
  const density = counts.map(c => c / (values.length * width));
  return { edges, counts, density, lo, hi, width, n: values.length, mean: values.reduce((a, b) => a + b, 0) / values.length };
}

function svgHistogramWithNormal(hist, mu, sigma, fmtTick) {
  const W = 280, H = 72, pad = 4;
  const maxD = Math.max(...hist.density, normalPdf(mu, mu, sigma), 1e-12);
  const xScale = (v) => pad + ((v - hist.lo) / (hist.hi - hist.lo || 1)) * (W - 2 * pad);
  const yScale = (d) => H - pad - (d / maxD) * (H - 2 * pad);
  let bars = '';
  for (let i = 0; i < hist.density.length; i++) {
    const x0 = xScale(hist.edges[i]);
    const x1 = xScale(hist.edges[i + 1]);
    const y = yScale(hist.density[i]);
    bars += `<rect x="${x0.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, x1 - x0 - 0.5).toFixed(1)}" height="${(H - pad - y).toFixed(1)}" fill="rgba(61,126,166,0.35)"/>`;
  }
  let curve = '';
  const steps = 40;
  for (let i = 0; i <= steps; i++) {
    const x = hist.lo + (i / steps) * (hist.hi - hist.lo);
    const y = normalPdf(x, mu, sigma);
    const cmd = i === 0 ? 'M' : 'L';
    curve += `${cmd}${xScale(x).toFixed(1)},${yScale(y).toFixed(1)} `;
  }
  const mid = fmtTick ? fmtTick(mu) : String(Math.round(mu));
  return `<svg class="assure-nerd-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}<path d="${curve}" fill="none" stroke="#3d7ea6" stroke-width="1.5"/>` +
    `<text x="${W / 2}" y="${H - 1}" text-anchor="middle" fill="rgba(170,184,162,0.75)" font-size="9" font-family="var(--mono)">${mid} · n=${hist.n}</text></svg>`;
}

function runScenarioMonteCarlo(base, snap, n) {
  // Sync helper kept for small n; prefer runScenarioMonteCarloAsync for large n.
  n = n || 200;
  const arrSamples = [];
  const cashSamples = [];
  const ebitdaSamples = [];
  let pArrMiss = 0, pCashBreak = 0, pAeShort = 0, pOpsRisk = 0;
  const sig = { yoyPp: 2.0, cplLog: 0.12, attrPp: 1.5, pipe: 0.35 };
  for (let i = 0; i < n; i++) {
    restoreScenarioLevers(snap);
    const dy = randn() * sig.yoyPp;
    const dcpl = Math.exp(randn() * sig.cplLog);
    const dattr = Math.max(0, (snap.salesAttritionPct || 0) + randn() * sig.attrPp);
    const dpipe = Math.max(1.0, (snap.pipelineCoverageMult || 3) + randn() * sig.pipe);
    STATE.yoyEndingArrGrowthPct = Math.max(0, snap.yoyEndingArrGrowthPct + dy);
    scaleAllGtmCpl(dcpl);
    STATE.salesAttritionPct = dattr;
    STATE.pipelineCoverageMult = dpipe;
    const s = buildBudgetAssurancePacket();
    arrSamples.push(s.decArr);
    cashSamples.push(s.endCash);
    ebitdaSamples.push(s.fyEbitda);
    if (s.decArr < base.targetArr * 0.995) pArrMiss += 1;
    if (s.endCash < base.cashFloor) pCashBreak += 1;
    if (s.salesEnd < s.aeNeeded) pAeShort += 1;
    if (s.endCash < base.cashFloor * 0.55 || (base.endCash - s.endCash) >= Math.max(12e6, base.endCash * 0.35)) pOpsRisk += 1;
  }
  restoreScenarioLevers(snap);
  return finalizeMonteCarlo(base, n, sig, arrSamples, cashSamples, ebitdaSamples, pArrMiss, pCashBreak, pAeShort, pOpsRisk);
}

function finalizeMonteCarlo(base, n, sig, arrSamples, cashSamples, ebitdaSamples, pArrMiss, pCashBreak, pAeShort, pOpsRisk) {
  const arrHist = histogram(arrSamples, 16);
  const cashHist = histogram(cashSamples, 16);
  const arrMean = arrHist.mean;
  const cashMean = cashHist.mean;
  const arrSd = Math.sqrt(arrSamples.reduce((a, v) => a + (v - arrMean) ** 2, 0) / Math.max(1, n - 1));
  const cashSd = Math.sqrt(cashSamples.reduce((a, v) => a + (v - cashMean) ** 2, 0) / Math.max(1, n - 1));
  return {
    n,
    sig,
    method: 'monte_carlo_annual_lever_shocks',
    whatItIs: [
      `${n} independent draws of a full-year plan.`,
      'Each draw shocks 4 annual levers once (YoY growth, CPL, attrition, pipeline cover), then recomputes the closed formula graph.',
      'This is NOT a combinatorial grid of every lever×month path, and NOT a day-by-day simulation through the year.',
      'It estimates the distribution of year-end outcomes under the stated uncertainty priors.',
    ],
    assumptions: [
      `Δ YoY ARR growth ~ N(0, ${sig.yoyPp}pp)`,
      `CPL multiplier ~ LogNormal(0, ${sig.cplLog})`,
      `Attrition ~ N(base, ${sig.attrPp}pp) truncated ≥0`,
      `Pipeline cover ~ N(base, ${sig.pipe}×) truncated ≥1×`,
      'Levers drawn independently per sample.',
    ],
    arr: { hist: arrHist, mean: arrMean, sd: arrSd, pMiss: pArrMiss / n },
    cash: { hist: cashHist, mean: cashMean, sd: cashSd, pBreak: pCashBreak / n },
    ebitda: { mean: ebitdaSamples.reduce((a, b) => a + b, 0) / n },
    pAeShort: pAeShort / n,
    pOpsRisk: pOpsRisk / n,
    pArrMissAnalytic: 1 - normalCdf(base.targetArr * 0.995, arrMean, arrSd || 1),
    pCashBreakAnalytic: normalCdf(base.cashFloor, cashMean, cashSd || 1),
  };
}

async function runScenarioMonteCarloAsync(base, snap, n, onProgress) {
  n = n || 1000;
  const arrSamples = [];
  const cashSamples = [];
  const ebitdaSamples = [];
  let pArrMiss = 0, pCashBreak = 0, pAeShort = 0, pOpsRisk = 0;
  const sig = { yoyPp: 2.0, cplLog: 0.12, attrPp: 1.5, pipe: 0.35 };
  const chunk = 20;
  for (let i = 0; i < n; i++) {
    restoreScenarioLevers(snap);
    const dy = randn() * sig.yoyPp;
    const dcpl = Math.exp(randn() * sig.cplLog);
    const dattr = Math.max(0, (snap.salesAttritionPct || 0) + randn() * sig.attrPp);
    const dpipe = Math.max(1.0, (snap.pipelineCoverageMult || 3) + randn() * sig.pipe);
    STATE.yoyEndingArrGrowthPct = Math.max(0, snap.yoyEndingArrGrowthPct + dy);
    scaleAllGtmCpl(dcpl);
    STATE.salesAttritionPct = dattr;
    STATE.pipelineCoverageMult = dpipe;
    const s = buildBudgetAssurancePacket();
    arrSamples.push(s.decArr);
    cashSamples.push(s.endCash);
    ebitdaSamples.push(s.fyEbitda);
    if (s.decArr < base.targetArr * 0.995) pArrMiss += 1;
    if (s.endCash < base.cashFloor) pCashBreak += 1;
    if (s.salesEnd < s.aeNeeded) pAeShort += 1;
    if (s.endCash < base.cashFloor * 0.55 || (base.endCash - s.endCash) >= Math.max(12e6, base.endCash * 0.35)) pOpsRisk += 1;
    if (onProgress && ((i + 1) % chunk === 0 || i + 1 === n)) {
      onProgress(i + 1, n);
      await new Promise(r => setTimeout(r, 0));
    }
  }
  restoreScenarioLevers(snap);
  return finalizeMonteCarlo(base, n, sig, arrSamples, cashSamples, ebitdaSamples, pArrMiss, pCashBreak, pAeShort, pOpsRisk);
}

function runScenarioSensitivity(base, snap, leverId) {
  const points = [];
  let grid, applyAt;
  if (leverId === 'yoy') {
    grid = [-5, -3, -1, 0, 1, 3];
    applyAt = (d) => { STATE.yoyEndingArrGrowthPct = snap.yoyEndingArrGrowthPct + d; };
  } else if (leverId === 'cpl') {
    grid = [0.85, 1.0, 1.15, 1.3, 1.5];
    applyAt = (d) => { scaleAllGtmCpl(d); };
  } else {
    return points;
  }
  for (const d of grid) {
    restoreScenarioLevers(snap);
    applyAt(d);
    const s = buildBudgetAssurancePacket();
    points.push({
      x: d,
      decArr: s.decArr,
      endCash: s.endCash,
      fyEbitda: s.fyEbitda,
      fyMkt: s.fyMkt,
      dArr: s.decArr - base.decArr,
      dCash: s.endCash - base.endCash,
    });
  }
  restoreScenarioLevers(snap);
  return points;
}

function buildScenarioNarrativeFromSuite(suite) {
  const b = suite.base;
  const breaks = suite.cases.filter(c => c.status === 'break');
  const watches = suite.cases.filter(c => c.status === 'watch');
  const lines = [];
  lines.push(
    `We ran ${suite.cases.length} named stress cases through the live formula graph against the committed plan ` +
    `(Dec ARR ${fmtM(b.decArr)} at ${b.yoyGrowthPct.toFixed(1)}% YoY, Dec cash ${fmtM(b.endCash)} vs ${fmtM(b.cashFloor)} floor, ` +
    `NB cover ${fmtN(b.salesEnd)}/${fmtN(b.aeNeeded)}). ` +
    `“pp” means percentage points on the growth rate (e.g. 16% → 11% is −5pp), not a −5% cut to dollars.`,
  );

  const growth = suite.cases.find(c => c.id === 'growth_m5') || suite.cases.find(c => c.id === 'growth_m3');
  if (growth) {
    lines.push(`Growth translation: ${growth.explain}`);
  }

  const liq = suite.cases.filter(c => c.family === 'liquidity' || (c.breaks || []).includes('Operating liquidity at risk'));
  if (liq.length) {
    lines.push(
      `Liquidity / ops risk: ` +
      liq.map(c => `${c.label} moves cash ${fmtM(c.dCash)} to ${fmtM(c.endCash)}` +
        (c.breaks.includes('Operating liquidity at risk') || c.breaks.includes('Dec cash floor')
          ? ' — this is the “operations at risk” shape we care about.'
          : '.'))
        .join(' ')
    );
  }

  if (breaks.length) {
    lines.push(
      `Break cases (${breaks.length}):\n` +
      breaks.map(c => `• ${c.label}\n  ${c.explain || (fmtM(c.dArr) + ' ARR / ' + fmtM(c.dCash) + ' cash')}`).join('\n')
    );
  } else {
    lines.push('No discrete case breached Dec ARR target, cash floor, AE/CS cover, or the ops-liquidity threshold.');
  }

  if (watches.length) {
    lines.push(
      `Watch cases (${watches.length}): ` +
      watches.map(c => `${c.label} (${(c.watches || []).join(', ') || 'soft pressure'})`).join('; ') + '.'
    );
  }

  if (suite.mc) {
    const mc = suite.mc;
    lines.push(
      `Monte Carlo (${mc.n.toLocaleString()} draws): each draw shocks four annual levers once and recomputes the full plan — ` +
      `it is a distribution estimate, not thousands of month-by-month path combinations. ` +
      `P(ARR miss) ${(mc.arr.pMiss * 100).toFixed(1)}%, P(cash < floor) ${(mc.cash.pBreak * 100).toFixed(1)}%, ` +
      `P(ops liquidity risk) ${((mc.pOpsRisk || 0) * 100).toFixed(1)}%, P(AE short) ${(mc.pAeShort * 100).toFixed(1)}%.`,
    );
  }

  lines.push('Cases are diagnostic only — levers are restored; nothing is written into the operating plan.');
  return lines.join('\n\n');
}

/**
 * Full predictive stress: discrete cases (+ optional MC / sensitivity for nerd view).
 * Always restores STATE levers afterward.
 */
async function runScenarioStressSuite(opts) {
  opts = opts || {};
  const withMc = !!opts.monteCarlo;
  const hist = opts.hist || buildAssuranceHistoryPacket();
  const onProgress = opts.onProgress;
  const snap = snapshotScenarioLevers();
  const base = buildBudgetAssurancePacket();
  // attach fyMkt onto base for explain helpers
  base.fyMkt = base.fyMkt;
  const defs = buildScenarioCaseDefs(hist);
  const cases = [];
  try {
    if (onProgress) onProgress('cases', 0, defs.length);
    for (let i = 0; i < defs.length; i++) {
      const d = defs[i];
      cases.push(evaluateScenarioShock(d.label, d.family, d.apply, base, snap, d));
      if (onProgress) onProgress('cases', i + 1, defs.length);
      await new Promise(r => setTimeout(r, 0));
    }
    restoreScenarioLevers(snap);
    let mc = null;
    let sens = null;
    if (withMc) {
      mc = await runScenarioMonteCarloAsync(base, snap, opts.mcN || 1000, (done, total) => {
        if (onProgress) onProgress('mc', done, total);
      });
      if (onProgress) onProgress('sens', 0, 2);
      sens = {
        yoy: runScenarioSensitivity(base, snap, 'yoy'),
        cpl: runScenarioSensitivity(base, snap, 'cpl'),
      };
      if (onProgress) onProgress('sens', 2, 2);
    }
    restoreScenarioLevers(snap);
    const suite = {
      fp: scenarioPlanFingerprint(base),
      at: Date.now(),
      base: {
        decArr: base.decArr,
        targetArr: base.targetArr,
        endCash: base.endCash,
        cashFloor: base.cashFloor,
        fyEbitda: base.fyEbitda,
        fyMkt: base.fyMkt,
        salesEnd: base.salesEnd,
        aeNeeded: base.aeNeeded,
        csEnd: base.csEnd,
        csNeeded: base.csNeeded,
        yoyGrowthPct: base.yoyGrowthPct,
      },
      cases,
      mc,
      sens,
      seedTitles: (hist.findings || []).filter(f => f.severity === 'high' || f.severity === 'medium').map(f => f.title),
    };
    suite.narrative = buildScenarioNarrativeFromSuite(suite);
    STATE._assureScenarioSuite = suite;
    STATE._assureScenarioNarrative = suite.narrative;
    return suite;
  } catch (e) {
    restoreScenarioLevers(snap);
    throw e;
  }
}

function renderSensMini(points, key) {
  if (!points || !points.length) return '';
  const vals = points.map(p => p[key]);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const W = 280, H = 56, pad = 6;
  const xScale = (i) => pad + (i / Math.max(1, points.length - 1)) * (W - 2 * pad);
  const yScale = (v) => H - pad - ((v - lo) / (hi - lo || 1)) * (H - 2 * pad);
  let d = '';
  points.forEach((p, i) => {
    d += `${i ? 'L' : 'M'}${xScale(i).toFixed(1)},${yScale(p[key]).toFixed(1)} `;
  });
  const zeroY = yScale(0);
  return `<svg class="assure-nerd-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">` +
    `<line x1="${pad}" x2="${W - pad}" y1="${zeroY.toFixed(1)}" y2="${zeroY.toFixed(1)}" stroke="rgba(170,184,162,0.25)" stroke-dasharray="3,2"/>` +
    `<path d="${d}" fill="none" stroke="#b89060" stroke-width="1.6"/></svg>`;
}

window.refreshAssuranceScenarios = async function(useLlm) {
  const body = document.getElementById('assureScenarioBody');
  const setProg = (msg) => { if (body) body.innerHTML = `<span style="color:var(--text3)">${msg}</span>`; };
  setProg('Running named stress cases…');
  await new Promise(r => setTimeout(r, 30));

  let suite;
  try {
    suite = await runScenarioStressSuite({
      monteCarlo: true,
      mcN: 1000,
      onProgress: (phase, done, total) => {
        if (phase === 'cases') setProg(`Named stress cases ${done}/${total}…`);
        else if (phase === 'mc') setProg(`Monte Carlo ${done.toLocaleString()}/${total.toLocaleString()} full-plan draws…`);
        else if (phase === 'sens') setProg('Building sensitivity curves…');
      },
    });
  } catch (e) {
    if (body) body.innerHTML = `<span style="color:var(--red)">Scenario stress failed: ${String(e.message || e)}</span>`;
    return;
  }

  let text = suite.narrative;
  if (useLlm) {
    setProg('Drafting commentary from stress packet…');
    try {
      const breakLines = suite.cases.filter(c => c.status !== 'ok').map(c =>
        `[${c.status}] ${c.label}: ${c.explain || ''} dARR ${Math.round(c.dArr)}, dCash ${Math.round(c.dCash)}`
      );
      const mc = suite.mc;
      const res = await fetch('/api/v1/commentary/generate', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          period_label: `FY${BUDGET_YEAR} Budget scenarios`,
          organization_name: 'SMPL',
          currency: 'USD',
          kpi_trends: [{ period_label: `FY${BUDGET_YEAR}B`, arr: suite.base.decArr, pipeline_coverage: STATE.pipelineCoverageMult }],
          additional_notes: [
            'BUDGET ENGINE Plan Assurance — SCENARIO lane. Numbers are from live formula-graph stress.',
            'Explain percentage points vs percent; translate shocks into $ ARR and cash vs floor; call out ops liquidity risk clearly.',
            `Baseline Dec ARR ${Math.round(suite.base.decArr)}, YoY ${suite.base.yoyGrowthPct}%, cash ${Math.round(suite.base.endCash)}, floor ${Math.round(suite.base.cashFloor)}.`,
            `Cases: ${breakLines.join(' | ') || 'all held'}`,
            mc ? `MC n=${mc.n}: annual lever shocks (not month-path combinatorial). P(ARR miss)=${(mc.arr.pMiss * 100).toFixed(1)}%, P(cash break)=${(mc.cash.pBreak * 100).toFixed(1)}%, P(ops liquidity)=${((mc.pOpsRisk || 0) * 100).toFixed(1)}%.` : '',
            'Write a concise CFO scenario briefing in plain English. Cite only provided deltas. Do not apply changes.',
          ].filter(Boolean).join('\n'),
        }),
      });
      if (res.ok) {
        const data = await res.json();
        const exec = data.executive_summary && data.executive_summary.narrative;
        if (exec) text = exec;
      } else {
        text = suite.narrative + '\n\n(LLM unavailable — deterministic stress narrative. ' + (await res.text()).slice(0, 100) + ')';
      }
    } catch (e) {
      text = suite.narrative + '\n\n(LLM unreachable — deterministic stress narrative.)';
    }
  }

  STATE._assureScenarioNarrative = text;
  suite.narrative = text;
  if (body) body.innerHTML = renderAssureScenarioHtml(suite);
  else refresh();
};

function budgetRowsToCSV(rows) {
  if (!rows.length) return '';
  const keys = Object.keys(rows[0]);
  const esc = v => {
    const s = String(v ?? '');
    return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return [keys.join(','), ...rows.map(r => keys.map(k => esc(r[k])).join(','))].join('\n');
}

    version_id: v.id, version_name: v.name, status: v.status, budget_year: BUDGET_YEAR,
    as_of_period: CLOSE_MONTH, created_at: v.ts,
    dec_arr: Math.round(v.dec_arr), dec_cash: Math.round(v.dec_cash), fy_ebitda: Math.round(v.fy_ebitda),
  })));
  Object.entries(csvs).forEach(([filename, content], i) => {
    setTimeout(() => {
      const blob = new Blob([content], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }, i * 250);
  });
  return Object.keys(csvs).length;
}

async function pushBudgetVersionToWarehouse(status, name, tables) {
  if (!window.SMPLOutlook || typeof window.SMPLOutlook.resolveOrgId !== 'function') return { ok: false, reason: 'no_outlook' };
  let orgId;
  try {
    orgId = await window.SMPLOutlook.resolveOrgId({ waitForParent: true });
  } catch (e) {
    return { ok: false, reason: 'org' };
  }
  if (!orgId) return { ok: false, reason: 'signin' };
  const body = {
    version_name: name,
    as_of_period: CLOSE_MONTH,
    budget_year: BUDGET_YEAR,
    levers: JSON.parse(JSON.stringify(STATE)),
    results: { engine: 'budget', year: BUDGET_YEAR },
    tables,
  };
  const draftRes = await fetch('/api/v1/budget/versions/draft?organization_id=' + encodeURIComponent(orgId), {
    method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!draftRes.ok) return { ok: false, reason: 'draft', detail: await draftRes.text() };
  const draft = await draftRes.json();
  if (status !== 'final') return { ok: true, draft: true, id: draft.id };
  const promoteRes = await fetch('/api/v1/budget/versions/' + draft.id + '/promote?organization_id=' + encodeURIComponent(orgId), {
    method: 'POST', credentials: 'include',
  });
  if (!promoteRes.ok) return { ok: false, reason: 'promote', detail: await promoteRes.text() };
  return { ok: true, promoted: true, id: draft.id };
}

window.saveBudgetVersion = async function(status) {
  const name = prompt(
    `Name this ${status === 'final' ? 'FINAL' : 'draft'} budget version:`,
    `FY${BUDGET_YEAR} ${status === 'final' ? 'Final' : 'Draft'} ${new Date().toLocaleDateString()}`,
  );
  if (!name) return;
  const snap = budgetVersionSnapshot();
  const vid = 'B' + Date.now();
  if (status === 'final') {
    budgetVersions.forEach(v => { if (v.status === 'final') v.status = 'superseded'; });
  }
  const entry = {
    id: vid, name, status, ts: new Date().toLocaleString(),
    budget_year: BUDGET_YEAR, ...snap,
  };
  budgetVersions.unshift(entry);
  persistBudgetVersions();

  const tables = buildBudgetTableRows(vid);
  let warehouseNote = '';
  try {
    const wh = await pushBudgetVersionToWarehouse(status, name, tables);
    if (wh.ok && wh.promoted) warehouseNote = '\n\nLoaded into Neon/Postgres warehouse.';
    else if (wh.ok && wh.draft) warehouseNote = '\n\nDraft saved server-side.';
    else if (wh.reason === 'signin') warehouseNote = '\n\nSign in to push to warehouse (CSVs still downloaded).';
    else if (wh.reason === 'draft' || wh.reason === 'promote') {
      warehouseNote = `\n\nWarehouse API: ${wh.detail || wh.reason}. CSVs downloaded for manual load.`;
    } else {
      warehouseNote = '\n\nWarehouse API unavailable — CSVs downloaded for load via Budget_* manifest.';
    }
  } catch (e) {
    warehouseNote = '\n\nWarehouse push skipped — CSVs downloaded.';
  }

  if (status === 'final') {
    const n = downloadBudgetCSVs(tables, vid, name);
    alert(`✓ Promoted to FINAL: "${name}"\n\n${n} CSV files downloading.\nUse budget_versions_registry.csv as the manifest.${warehouseNote}`);
  } else {
    alert(`Draft saved: "${name}"${warehouseNote}`);
  }
  showTab('promote');
};

window.promoteBudgetVersion = async function(id) {
  const v = budgetVersions.find(x => x.id === id);
  if (!v || !confirm(`Promote "${v.name}" to FINAL? This supersedes the current final and loads Budget_* tables.`)) return;
  budgetVersions.forEach(x => { if (x.status === 'final') x.status = 'superseded'; });
  v.status = 'final';
  persistBudgetVersions();
  const tables = buildBudgetTableRows(id);
  try { await pushBudgetVersionToWarehouse('final', v.name, tables); } catch (e) { /* CSVs still go */ }
  downloadBudgetCSVs(tables, id, v.name);
  showTab('promote');
};

window.deleteBudgetVersion = function(id) {
  const v = budgetVersions.find(x => x.id === id);
  if (!v || v.status === 'final') return;
  if (!confirm('Delete this draft version?')) return;
  budgetVersions = budgetVersions.filter(x => x.id !== id);
  persistBudgetVersions();
  showTab('promote');
};

window.downloadBudgetVersionCSVs = function(id) {
  const v = budgetVersions.find(x => x.id === id);
  if (!v) return;
  downloadBudgetCSVs(buildBudgetTableRows(id), id, v.name);
};

    <div class="ctx-banner">
      <strong>Current plan:</strong>
      Dec ARR ${fmtM(snap.dec_arr)} ·
      Dec cash ${fmtM(snap.dec_cash)} ·
      FY EBITDA ${fmtM(snap.fy_ebitda)} ·
      FY net new ${fmtM(snap.fy_nn)} ·
      FY revenue ${fmtM(snap.fy_rev)}
    </div>
    <div style="display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap">
      <button class="act-btn" onclick="saveBudgetVersion('draft')">💾 Save working draft</button>
      <button class="act-btn success" onclick="saveBudgetVersion('final')">✓ Promote to final — warehouse + CSVs</button>
      <span style="font-size:10px;color:var(--text3)">Final versions lock the plan into Neon (budget_* tables) and download Budget_* CSVs</span>
    </div>
    ${budgetVersions.length === 0
      ? `<div style="padding:30px;text-align:center;color:var(--text3);font-size:13px">No versions saved yet.<br>Save a draft to iterate, or promote to final when the FY${BUDGET_YEAR} budget is ready for reporting.</div>`
      : `<div>${budgetVersions.map(v => `<div class="ver-row">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="ver-name">${String(v.name).replace(/</g, '&lt;')}</span>
            <span class="badge ${v.status === 'final' ? 'badge-final' : v.status === 'superseded' ? 'badge-super' : 'badge-draft'}">${v.status === 'final' ? '✓ Final' : v.status === 'superseded' ? 'Superseded' : 'Draft'}</span>
            <span style="font-size:9.5px;padding:2px 7px;border-radius:10px;background:var(--bg2);border:0.5px solid var(--border);color:var(--text3)">FY${v.budget_year || BUDGET_YEAR}</span>
          </div>
          <div class="ver-meta">${v.ts} · net new ${fmtM(v.fy_nn)} · revenue ${fmtM(v.fy_rev)}</div>
        </div>
        <div class="ver-stats">
          <div style="color:var(--teal)">${fmtM(v.dec_arr)} ARR</div>
          <div>${fmtM(v.dec_cash)} cash</div>
          <div style="color:${v.fy_ebitda >= 0 ? 'var(--teal)' : 'var(--red)'}">${fmtM(v.fy_ebitda)} EBITDA</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;margin-left:8px">
          ${v.status !== 'final' ? `<button class="act-btn success" style="font-size:10px;padding:4px 10px" onclick="promoteBudgetVersion('${v.id}')">↑ Promote</button>` : ''}
          <button class="act-btn" style="font-size:10px;padding:4px 10px" onclick="downloadBudgetVersionCSVs('${v.id}')">↓ CSVs</button>
          ${v.status !== 'final' ? `<button class="act-btn" style="font-size:10px;padding:4px 10px;color:var(--red)" onclick="deleteBudgetVersion('${v.id}')">✕</button>` : ''}
        </div>
      </div>`).join('')}</div>`}
  </div>`;
}

function refresh() {
  renderSidebar();
  const main = document.getElementById('main');
  const footerBtn = document.getElementById('footerResetBtn');
  if (footerBtn) {
    footerBtn.textContent = curTab === 'gtm' ? '↺ Reset GTM from history'
      : curTab === 'sales' ? '↺ Reset Sales hires (auto gap)'
      : curTab === 'hc' ? '↺ Reset HC hires & levers'
      : curTab === 'pnl' ? '↺ Reset P&L rates'
      : (curTab === 'cf' || curTab === 'bs') ? '↺ Reset WC / cash drivers'
      : '↺ Reset mix from history';
    footerBtn.style.display = (curTab === 'promote' || curTab === 'defs') ? 'none' : '';
  }
  main.innerHTML = curTab === 'arr' ? renderARR()
    : curTab === 'gtm' ? renderGTM()
    : curTab === 'sales' ? renderSales()
    : curTab === 'hc' ? renderHC()
    : curTab === 'pnl' ? renderPnL()
    : curTab === 'is' ? renderIS()
    : curTab === 'cf' ? renderCF()
    : curTab === 'bs' ? renderBS()
    : curTab === 'defs' ? renderDefinitions()
    : curTab === 'promote' ? renderPromote()
    : renderOverview();
  if (curTab === 'overview') paintOverviewCharts();
  else destroyOvCharts();
  const fpEl = document.getElementById('assumeFp');
  if (fpEl) fpEl.textContent = budgetAssumptionFingerprint();
  persistBudgetState();
}

window.refresh = refresh;

window.showTab = function(tab) {
  if (document.querySelector(`.nav-btn[data-tab="${tab}"]`)?.classList.contains('disabled')) return;
  curTab = tab;
  document.querySelectorAll('.nav-btn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  refresh();
};

/** Jump to a source tab (and optional dept focus) from a provenance chip. */
window.goToOrigin = function(tab, opts) {
  opts = opts || {};
  if (opts.hcFocus != null) STATE.hcFocusDept = opts.hcFocus;
  if (opts.plDept != null) STATE.plDept = opts.plDept;
  showTab(tab);
  const main = document.getElementById('main');
  if (main) {
    if (opts.scrollTo) {
      requestAnimationFrame(() => {
        const el = document.getElementById(opts.scrollTo);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        else main.scrollTop = 0;
      });
    } else {
      main.scrollTop = 0;
    }
  }
};

/**
 * Clickable provenance chip. opts: { hcFocus, plDept, scrollTo, title }
 * Example: originTag('from HC', 'hc', { hcFocus: 'marketing' })
 */
function originTag(label, tab, opts) {
  opts = opts || {};
  const o = [];
  if (opts.hcFocus != null) o.push(`hcFocus:'${String(opts.hcFocus).replace(/'/g, "\\'")}'`);
  if (opts.plDept != null) o.push(`plDept:'${String(opts.plDept).replace(/'/g, "\\'")}'`);
  if (opts.scrollTo != null) o.push(`scrollTo:'${String(opts.scrollTo).replace(/'/g, "\\'")}'`);
  const arg = o.length ? `, {${o.join(',')}}` : '';
  const title = opts.title || ('Open ' + tab);
  const safe = String(label).replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return `<button type="button" class="lock-tag lock-link" title="${title.replace(/"/g, '&quot;')}" onclick="event.stopPropagation();goToOrigin('${tab}'${arg})">${safe}</button>`;
}

async function init() {
  loadBudgetVersions();
  const restored = loadBudgetState();
  if (window.SMPLBootstrapDemo) {
    try { await window.SMPLBootstrapDemo.load(); } catch (e) { console.warn(e); }
  }
  const setStatus = (t) => { const el = document.getElementById('statusLine'); if (el) el.textContent = t; };
  // Wait for parent shell to post smpl:org (Forecast/Board pattern).
  // Without this, /app often stays on demo FY26 Ending $97.56M instead of lock $90.29M.
  if (window.SMPLOutlook && typeof window.SMPLOutlook.resolveOrgId === 'function') {
    try {
      await window.SMPLOutlook.resolveOrgId({ waitForParent: true, parentWaitMs: 6000 });
    } catch (e) { console.warn('[budget-engine] org wait', e); }
  }
  await new Promise((r) => setTimeout(r, 50));
  if (window.SMPLOutlook && window.SMPLOutlook.hydrate) {
    await window.SMPLOutlook.hydrate({
      endpoint: 'reporting/outlook',
      waitForParent: true,
      parentWaitMs: 6000,
      hooks: { TS_DATA: window.SMPL_DEMO_TS_DATA, WF_TABLE: window.SMPL_DEMO_WF_TABLE },
      onStatus: setStatus,
      onApplied: function () {
        reseedPlanFromHistory('outlook-hydrate');
        refresh();
      },
    });
  }
  reseedPlanFromHistory('init');
  seedHcDefaults();
  seedHcOps();
  if (restored) {
    document.querySelectorAll('.nav-btn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === curTab));
  }
  const dec26 = fy26DecEndingArr();
  if (dec26 != null && Math.abs(dec26 - BOP_LOCK) > 5e4) {
    setStatus('FY26 hist Dec ' + fmtM(dec26) + ' ≠ Jan lock ' + fmtM(BOP_LOCK) + ' — check outlook hydrate');
  } else if (restored) {
    setStatus('Levers restored · mix seeded from ' + STATE.yoyEndingArrGrowthPct.toFixed(0) + '% YoY plan dollars (rev ' + BUDGET_PLAN_REV + ')');
  } else {
    setStatus('Base plan · mix seeded from ' + STATE.yoyEndingArrGrowthPct.toFixed(0) + '% YoY plan dollars (rev ' + BUDGET_PLAN_REV + ')');
  }
  if (window.SMPLSkin) window.SMPLSkin.init('skinSelect', refresh);
  else refresh();
}

init();
})();
