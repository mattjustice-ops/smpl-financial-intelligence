<!DOCTYPE html>
<html lang="en" style="height:100%">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMPL · Budget Engine · FY2027</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#18241b;--bg2:#23332699;--text:#dde8d6;--text2:#aab8a2;--text3:#72826a;--border:#2e3f31;--border2:rgba(56,75,60,0.25);--teal:#5fa878;--red:#b8705f;--amber:#b89060;--accent:#c4855a;--r:12px;--mono:'Inter',-apple-system,sans-serif;--serif:'Inter',-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 24px;border-bottom:0.5px solid var(--border);background:var(--bg)}
.logo{font-size:17px;font-weight:300}.logo span{color:var(--text3);font-size:13px}
.period-badge{font-size:11px;color:var(--text2);background:var(--bg2);padding:4px 12px;border-radius:20px;border:0.5px solid var(--border)}
.skin-select{font-family:inherit;font-size:11px;font-weight:500;padding:5px 10px;border:0.5px solid var(--border);border-radius:20px;background:var(--bg2);color:var(--text2);cursor:pointer;outline:none}
.skin-select:hover{color:var(--text)}
.skin-select option{background:#1a1a1a;color:#eee}
.nav{display:flex;padding:0 24px;border-bottom:0.5px solid var(--border);background:var(--bg);overflow-x:auto}
.nav-btn{padding:10px 15px;font-size:12px;color:var(--text2);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit}
.nav-btn.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.nav-btn.disabled{opacity:.45;cursor:not-allowed}
.act-btn.success{background:var(--teal);color:var(--bg);border:none}
.act-btn.success:hover{opacity:.85}
.badge{font-size:10px;padding:3px 9px;border-radius:10px;display:inline-block}
.badge-final{background:var(--teal-light,rgba(95,168,120,.18));color:var(--teal)}
.badge-draft{background:var(--bg3,#2b3c2e);color:var(--text2);border:0.5px solid var(--border)}
.badge-super{background:var(--bg2);color:var(--text3);border:0.5px solid var(--border)}
.ver-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.ver-row:last-child{border-bottom:none}
.ver-name{font-size:13px;font-weight:500;color:var(--text)}
.ver-meta{font-size:10px;color:var(--text3);margin-top:4px}
.ver-stats{text-align:right;font-family:var(--mono);font-size:11px;color:var(--text2);line-height:1.45;min-width:110px}
.layout{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 96px)}
.layout.no-sidebar{grid-template-columns:1fr}
.layout.no-sidebar .sidebar{display:none}
.sidebar{border-right:0.5px solid var(--border);padding:14px;overflow-y:auto;background:var(--bg2)}
.panel-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);font-weight:500;padding:8px 0;border-bottom:0.5px solid var(--border);margin-bottom:8px}
.lever{margin-bottom:10px}
.lever-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.lever-lbl{color:var(--text2)}.lever-val{font-family:var(--mono);font-weight:500;color:var(--text)}
input[type=range]{width:100%;height:4px;appearance:none;background:#2e3f31;border-radius:2px}
input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}
.main{overflow:auto;padding:18px 22px;scrollbar-gutter:stable}
.slide-title{font-size:20px;font-weight:300;font-style:italic;margin-bottom:4px}
.slide-sub{font-size:11.5px;color:var(--text2);margin-bottom:14px}
.ctx-banner{font-size:11px;color:var(--text2);background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:8px 12px;margin-bottom:12px}
.ctx-banner strong{color:var(--amber);font-family:var(--mono)}
.ctx-banner.warn{border-color:var(--amber);background:rgba(212,160,64,0.08)}
.ctx-banner.tie{font-size:10.5px;line-height:1.45}
.bud-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:10.5px;table-layout:fixed;margin-bottom:16px}
.bud-tbl th{padding:4px 6px;font-size:9px;font-weight:500;color:var(--text3);border-bottom:1px solid var(--border2);text-align:right;white-space:nowrap}
.bud-tbl thead th{position:sticky;top:0;z-index:5;background:var(--bg);box-shadow:inset 0 -1px 0 var(--border2)}
.bud-tbl thead th.ctx-h{background:#1c281f}
.bud-tbl thead th.bud-h,.bud-tbl thead th.fy-h{background:var(--bg)}
.bud-tbl thead th:first-child{z-index:6;left:0;box-shadow:inset -1px 0 0 var(--border2),inset 0 -1px 0 var(--border2)}
.bud-tbl th:first-child,.bud-tbl th.notes-h{text-align:left}
.bud-tbl th.ctx-h{background:rgba(114,130,106,0.08);color:var(--text3);min-width:72px}
.bud-tbl th.fcst-h{color:var(--amber)}
.bud-tbl th.bud-h{color:var(--teal);min-width:64px}
.bud-tbl th.fy-h{min-width:92px;color:var(--teal)}
.bud-tbl td{padding:3px 6px;border-bottom:0.5px solid var(--border);text-align:right;font-family:var(--mono);font-size:10px;color:var(--text2)}
.bud-tbl td:first-child{text-align:left;font-family:inherit;font-size:11px;color:var(--text);width:220px;min-width:220px;max-width:260px;white-space:normal;line-height:1.25;overflow-wrap:break-word;word-break:break-word;position:sticky;left:0;z-index:2;background:var(--bg)}
.bud-tbl th:first-child{width:220px;min-width:220px;max-width:260px;white-space:normal}
.bud-tbl.sales-tbl td:first-child,.bud-tbl.sales-tbl th:first-child{width:280px;min-width:280px;max-width:300px}
.bud-tbl tr.sec td{background:var(--bg2);font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);font-weight:500;padding:6px}
.bud-tbl tr.sec td:first-child{background:var(--bg2)}
.bud-tbl tr.tot td:first-child{background:var(--bg)}
.bud-tbl tr.wf-hire td:first-child{color:var(--amber);padding-left:14px;background:var(--bg)}
.bud-tbl tr.wf-backfill td:first-child{color:var(--text2);padding-left:14px;background:var(--bg)}
.bud-tbl tr.wf-exist td:first-child{color:var(--text2);background:var(--bg)}
.bud-tbl tr.wf-tot td{border-top:1px solid var(--border2)}
.bud-tbl.bridge-tbl{width:auto;max-width:720px;table-layout:auto}
.bud-tbl.bridge-tbl td:first-child,.bud-tbl.bridge-tbl th:first-child{width:340px;min-width:280px;max-width:420px;position:static}
.bud-tbl.bridge-tbl th.fy-h,.bud-tbl.bridge-tbl td.fy-c{min-width:110px}
.bud-tbl.gtm-tbl th.bud-h,.bud-tbl.gtm-tbl td.bud-c{min-width:58px;width:58px}
.bud-tbl.gtm-tbl th.ctx-h,.bud-tbl.gtm-tbl td.ctx-c{min-width:64px;width:64px}
.bud-tbl.gtm-tbl th.fy-h,.bud-tbl.gtm-tbl td.fy-c{min-width:78px;width:78px}
.bud-tbl.gtm-tbl input.mix-input{min-width:0;width:100%;max-width:100%;box-sizing:border-box;padding:2px 1px;-moz-appearance:textfield;appearance:textfield}
.bud-tbl.gtm-tbl input.mix-input::-webkit-outer-spin-button,.bud-tbl.gtm-tbl input.mix-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.bud-tbl .k-input{display:inline-flex;align-items:baseline;justify-content:flex-end;gap:0;width:100%}
.bud-tbl .k-input input{width:100%;min-width:0;max-width:none;flex:1 1 auto;padding-right:0}
.bud-tbl .k-suf{font-family:var(--mono);font-size:10px;color:var(--text2);flex:0 0 auto}
.bud-tbl tr.tot td{font-weight:600;color:var(--text);border-top:1px solid var(--border2)}
.bud-tbl tr.is-indent td:first-child{padding-left:18px;color:var(--text2)}
.bud-tbl tr.is-sub td{font-weight:600;color:var(--text);border-top:0.5px solid var(--border)}
.bud-tbl tr.is-hi td{font-weight:600;color:var(--text);background:rgba(114,130,106,0.08)}
.bud-tbl tr.is-ni td{font-weight:700;color:var(--text);border-top:1.5px solid var(--border2)}
/* Adjustable / editable assumption rows — stand out for reviewers */
.bud-tbl tbody tr.adj td,
.bud-tbl tbody tr:has(input.mix-input) td,
.bud-tbl tbody tr:has(input.hire-input) td,
.bud-tbl tbody tr:has(input[type=checkbox]) td,
.bud-tbl tbody tr:has(td.fy-c select) td,
.bud-tbl tbody tr:has(td.fy-c input.mix-input) td{
  background:rgba(184,144,96,0.11);
  color:#e8c48a;
}
.bud-tbl tbody tr.adj td:first-child,
.bud-tbl tbody tr:has(input.mix-input) td:first-child,
.bud-tbl tbody tr:has(input.hire-input) td:first-child,
.bud-tbl tbody tr:has(input[type=checkbox]) td:first-child,
.bud-tbl tbody tr:has(td.fy-c select) td:first-child,
.bud-tbl tbody tr:has(td.fy-c input.mix-input) td:first-child{
  background:rgba(184,144,96,0.18);
  color:#f0d4a0;
  font-weight:600;
}
.bud-tbl tbody tr.adj td.ctx-c,
.bud-tbl tbody tr:has(input.mix-input) td.ctx-c,
.bud-tbl tbody tr:has(input.hire-input) td.ctx-c,
.bud-tbl tbody tr:has(td.fy-c select) td.ctx-c,
.bud-tbl tbody tr:has(td.fy-c input.mix-input) td.ctx-c{
  background:rgba(184,144,96,0.07);
  color:var(--text3);
}
.bud-tbl tbody tr.adj td.bud-c,
.bud-tbl tbody tr.adj td.fy-c,
.bud-tbl tbody tr:has(input.mix-input) td.bud-c,
.bud-tbl tbody tr:has(input.mix-input) td.fy-c,
.bud-tbl tbody tr:has(input.hire-input) td.bud-c,
.bud-tbl tbody tr:has(input.hire-input) td.fy-c,
.bud-tbl tbody tr:has(td.fy-c select) td.fy-c,
.bud-tbl tbody tr:has(td.fy-c input.mix-input) td.fy-c{
  color:#f0d4a0;
}
.bud-tbl tbody tr.adj input.mix-input,
.bud-tbl tbody tr.adj input.hire-input,
.bud-tbl tbody tr:has(input.mix-input) input.mix-input,
.bud-tbl tbody tr:has(input.hire-input) input.hire-input{
  color:#f5e0b8;
  border-color:rgba(184,144,96,0.5);
  background:rgba(184,144,96,0.1);
  border-radius:4px;
  font-weight:500;
}
.bud-tbl tbody tr.adj .k-suf,
.bud-tbl tbody tr:has(input.mix-input) .k-suf{color:#e8c48a}
.bud-tbl tbody tr.adj select,
.bud-tbl tbody tr:has(td.fy-c select) select{
  color:#f0d4a0;
  border-color:rgba(184,144,96,0.5);
  background:rgba(184,144,96,0.1);
}
.adj-legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2);margin:0 0 12px;padding:7px 11px;border-radius:8px;border:0.5px solid rgba(184,144,96,0.4);background:rgba(184,144,96,0.1)}
.adj-legend-swatch{width:14px;height:14px;border-radius:3px;background:rgba(184,144,96,0.35);border:1px solid rgba(184,144,96,0.7);flex:0 0 auto}
.adj-legend strong{color:#f0d4a0;font-weight:600}
.assure-panel{border:0.5px solid var(--border);border-radius:var(--r);background:var(--bg2);padding:14px 16px;margin-bottom:18px}
.assure-hd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.assure-title{font-size:15px;font-weight:500}
.assure-sub{font-size:11px;color:var(--text2)}
.assure-lanes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:1100px){.assure-lanes{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.assure-lanes{grid-template-columns:1fr}}
.assure-lane{border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--bg);min-height:140px;display:flex;flex-direction:column}
.assure-lane-hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;padding-bottom:8px;border-bottom:0.5px solid var(--border)}
.assure-lane-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:500;margin:0}
.assure-lane-acts{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.assure-lane-acts .act-btn{font-size:10px;padding:3px 8px}
.assure-lane-body{font-size:12px;color:var(--text2);line-height:1.55;flex:1}
.assure-lane-body strong{color:var(--text);font-weight:500}
.assure-wide{border:0.5px solid var(--border);border-radius:8px;padding:12px 14px;background:var(--bg);margin-bottom:12px}
.assure-wide:last-child{margin-bottom:0}
.assure-wide-hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;padding-bottom:8px;border-bottom:0.5px solid var(--border)}
.assure-wide-hd .assure-lane-lbl{margin:0}
.assure-risk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 14px}
.assure-risk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:11.5px;line-height:1.4}
.assure-risk:last-child{border-bottom:none}
.assure-sev{font-size:9px;text-transform:uppercase;letter-spacing:.3px;padding:2px 6px;border-radius:4px;flex:0 0 auto;margin-top:1px}
.assure-sev.high{background:rgba(184,112,95,0.2);color:var(--red)}
.assure-sev.med{background:rgba(184,144,96,0.2);color:var(--amber)}
.assure-sev.low{background:rgba(95,168,120,0.15);color:var(--teal)}
.assure-sev.ok{background:rgba(95,168,120,0.12);color:var(--teal)}
.assure-sev.info{background:rgba(61,126,166,0.15);color:#7a9fc2}
.assure-cite{font-size:9.5px;color:var(--text3);margin-top:2px}
.ov-section-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:500;margin:4px 0 10px;padding-top:4px;border-top:0.5px solid var(--border)}
.assure-scenario-stub{font-size:11.5px;color:var(--text3);line-height:1.5;padding:4px 0}
.assure-sc-table{width:100%;border-collapse:collapse;font-size:10.5px;margin:8px 0 4px}
.assure-sc-table th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);font-weight:500;padding:4px 6px;border-bottom:0.5px solid var(--border)}
.assure-sc-table td{padding:5px 6px;border-bottom:0.5px solid var(--border);vertical-align:top;color:var(--text2)}
.assure-sc-table td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.assure-sc-table tr.break td{background:rgba(184,112,95,0.08)}
.assure-sc-table tr.watch td{background:rgba(184,144,96,0.06)}
.assure-sc-chip{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;margin-right:4px;text-transform:uppercase;letter-spacing:.3px}
.assure-sc-chip.break{background:rgba(184,112,95,0.2);color:var(--red)}
.assure-sc-chip.watch{background:rgba(184,144,96,0.2);color:var(--amber)}
.assure-sc-chip.ok{background:rgba(95,168,120,0.12);color:var(--teal)}
.assure-nerd{margin-top:10px;padding-top:10px;border-top:0.5px dashed var(--border)}
.assure-nerd-hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.assure-nerd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){.assure-nerd-grid{grid-template-columns:1fr}}
.assure-nerd-card{border:0.5px solid var(--border);border-radius:6px;padding:8px 10px;background:var(--bg2)}
.assure-nerd-card h4{margin:0 0 4px;font-size:11px;font-weight:500;color:var(--text)}
.assure-nerd-card p{margin:0 0 6px;font-size:10px;color:var(--text3);line-height:1.4}
.assure-nerd-svg{width:100%;height:72px;display:block}
.bud-tbl td.ctx-c{background:rgba(114,130,106,0.05);font-size:9px;line-height:1.35;vertical-align:top}
.bud-tbl td.bud-c{color:var(--text)}
.bud-tbl td.fy-c{font-weight:600;color:var(--text);min-width:92px;white-space:nowrap}
.bud-tbl td.notes-c{padding:2px 4px}
.bud-tbl input[type=text],.bud-tbl input[type=number]{width:100%;background:transparent;border:0.5px solid transparent;border-radius:4px;color:var(--text);font-family:var(--mono);font-size:10px;text-align:right;padding:2px 4px}
.bud-tbl input:focus{border-color:var(--accent);outline:none;background:rgba(196,133,90,0.08)}
.bud-tbl input.mix-input{text-align:right}
.bud-tbl input.hire-input{width:40px;max-width:100%;margin-left:auto;display:block;text-align:right;padding:2px 0;border:0.5px solid transparent;background:transparent;color:var(--text);font-family:var(--mono);font-size:10px;-moz-appearance:textfield;appearance:textfield}
.bud-tbl input.hire-input::-webkit-outer-spin-button,.bud-tbl input.hire-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.bud-tbl input.hire-input:focus{border-color:var(--accent);outline:none;background:rgba(196,133,90,0.08);border-radius:4px;padding:2px 4px}
.bud-tbl input.note-input{text-align:left;font-family:inherit;font-size:10px;color:var(--text2)}
.bud-tbl td.var-ok{color:var(--teal)}
.bud-tbl td.var-warn{color:var(--amber)}
.bud-tbl .delta-pos,.bud-tbl input.hire-input.delta-pos{color:var(--teal)}
.bud-tbl .delta-neg,.bud-tbl input.hire-input.delta-neg{color:var(--red)}
.bud-tbl .delta-zero,.bud-tbl input.hire-input.delta-zero{color:var(--text3)}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:10px 12px}
.kpi-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.kpi-val{font-size:18px;font-family:var(--mono);margin-top:4px}
.lock-tag{display:inline-block;margin-left:6px;font-size:8px;text-transform:uppercase;letter-spacing:.3px;color:var(--text3);border:0.5px solid var(--border);border-radius:4px;padding:1px 5px;vertical-align:middle}
button.lock-tag.lock-link{cursor:pointer;font-family:inherit;background:transparent;transition:border-color .12s,color .12s,background .12s}
button.lock-tag.lock-link:hover{color:var(--accent);border-color:var(--accent);background:rgba(196,133,90,0.1)}
button.lock-tag.lock-link:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
.ov-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.ov-tog{font-size:11px;padding:4px 11px;border-radius:16px;cursor:pointer;border:0.5px solid var(--border);background:var(--bg2);color:var(--text2);font-family:inherit}
.ov-tog.on{border-color:var(--accent);color:var(--text);background:rgba(196,133,90,0.12)}
.ov-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.ov-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px}
.ov-card-title{font-size:13px;font-weight:500}
.ov-card-sub{font-size:10px;color:var(--text3);margin:2px 0 8px}
.chart-wrap{position:relative;height:220px}
.footer{display:flex;justify-content:space-between;padding:8px 24px;border-top:0.5px solid var(--border);font-size:10px;color:var(--text3)}
.act-btn{font-size:11px;padding:6px 14px;border-radius:20px;cursor:pointer;border:0.5px solid var(--border);background:var(--bg2);color:var(--text2);font-family:inherit}
.act-btn.primary{background:var(--accent);color:var(--bg);border:none}
.def-search{width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:12px;padding:8px 12px;margin-bottom:12px}
.def-search:focus{outline:none;border-color:var(--accent)}
.def-block{border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.def-block-hd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.def-name{font-size:14px;font-weight:500;color:var(--text)}
.def-meta{font-size:10px;color:var(--text3)}
.def-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:8px}
.def-formula{font-family:var(--mono);font-size:11px;color:var(--teal);background:rgba(95,168,120,0.08);border:0.5px solid rgba(95,168,120,0.25);border-radius:6px;padding:8px 10px;line-height:1.45;white-space:pre-wrap}

      <option value="canvas">Canvas</option>

<nav class="nav">

  <button class="nav-btn" data-tab="arr" onclick="showTab('arr')">ARR</button>

  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
    <span id="assumeFp" style="font-size:10px;color:var(--text3);font-family:var(--mono)" title="Canonical lever fingerprint — should match on localhost and /app after hard refresh"></span>
    <button class="act-btn" id="footerResetBtn" onclick="footerReset()">↺ Reset mix from history</button>
    <button class="act-btn" id="footerResetAllBtn" onclick="resetAllAssumptions()" title="Clear saved edits and restore base plan defaults">↺ Reset all to base</button>
    <button class="act-btn" onclick="saveBudgetVersion('draft')">💾 Save draft</button>
    <button class="act-btn success" onclick="saveBudgetVersion('final')">✓ Promote to Final</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<script>
(function(){
'use strict';

const CLOSE_MONTH = '2026-06';
const BUDGET_YEAR = 2027;
const BOP_LOCK = 90291801.85; // Dec 2026 Forecast ending ARR

/**
 * Dec'26 Forecast ending HC — locked Jan'27 BOP (from board WF_HC_ALL / Forecast_Employees).
 * sales + cs = WF Sales + Customer Success; rd = R&D + Product + Support.
 */
const HC_BOP_LOCK = {
  sales: 31,
  cs: 18,
  marketing: 16,
  rd: 65,
  ga: 17,
};
const HC_BOP_TOTAL = Object.values(HC_BOP_LOCK).reduce((a, b) => a + b, 0);

/**
 * FY26 month-end HC (Jan–Dec). H1 actual / H2 forecast from board WF_HC_ALL.
 * rd = R&D + Product + Support (same rollup as HC_BOP_LOCK).
 */
const HC_FY26_MONTHLY = {
  sales:     [26, 27, 28, 28, 28, 29, 31, 31, 31, 31, 31, 31],
  cs:        [15, 15, 15, 16, 16, 17, 17, 17, 18, 18, 18, 18],
  marketing: [13, 13, 13, 14, 14, 15, 15, 15, 16, 16, 16, 16],
  rd:        [54, 55, 56, 56, 58, 61, 62, 64, 64, 65, 65, 65],
  ga:        [13, 14, 14, 14, 14, 15, 15, 15, 16, 16, 17, 17],
};
/** FY26 monthly loaded payroll cash ($), company total — allocated to depts by head share. */
const HC_FY26_PAYROLL = [1.71, 1.75, 1.78, 1.80, 1.83, 1.94, 1.98, 2.01, 2.04, 2.06, 2.08, 2.08].map(m => m * 1e6);
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const BUD_P = MO.map((_, i) => `${BUDGET_YEAR}-${String(i + 1).padStart(2, '0')}`);

/** FY26 context only — actual H1 + forecast H2 */
const CTX_QUARTERS = [
  { key: "Q1'26", months: ['2026-01','2026-02','2026-03'], source: 'actual' },
  { key: "Q2'26", months: ['2026-04','2026-05','2026-06'], source: 'actual' },
  { key: "Q3'26", months: ['2026-07','2026-08','2026-09'], source: 'forecast' },
  { key: "Q4'26", months: ['2026-10','2026-11','2026-12'], source: 'forecast' },
];

const MIX_KEYS = ['nb', 'exp', 'react', 'cont', 'churn'];

/** Share of S&M line attributed to marketing spend (remainder ≈ sales payroll). */
const MKT_SM_RATIO = 0.65;
const DEFAULT_GTM_RATES = { cpl: 380, mqlOpp: 0.28, oppClose: 0.14, avgAcv: 125000 };

/** Marketing channels — mix % of total program spend; CPL drives MQLs per channel. */
const GTM_CHANNELS = [
  { key: 'paid_search', label: 'Paid search', defaultMix: 0.28, defaultCpl: 450 },
  { key: 'paid_social', label: 'Paid social', defaultMix: 0.18, defaultCpl: 320 },
  { key: 'content', label: 'Content / SEO', defaultMix: 0.14, defaultCpl: 160 },
  { key: 'events', label: 'Events / field', defaultMix: 0.22, defaultCpl: 650 },
  { key: 'partners', label: 'Partners', defaultMix: 0.10, defaultCpl: 280 },
  { key: 'other', label: 'Brand / other', defaultMix: 0.08, defaultCpl: 500 },
];

/**
 * Follow-ups (not blocking advisor review) — revisit after IS/CF/BS pass.
 * - GTM: rename/clarify MQL→Opp vs Opps-to-close vs Pipeline opps (intuitive funnel labels + check row)
 * - GTM: Board channel names (Paid Search, Paid Social, Field Event, Content Synd., etc.)
 * - Period notes UX polish
 * - Cash Flow + Balance Sheet tabs
 * - COGS delivery book (replace % of revenue)
 * - Board vs operating overlay
 */
const BUDGET_ENGINE_BACKLOG = [
  'GTM funnel labels: MQL→Opp vs pipeline opps vs opps-to-close',
  'Align GTM channel names to Board GTM slide',
  'COGS breakout on IS (Hosting / Support labor / 3rd party) — derived from P&L delivery book (eng compute + customer support), not editable %; wait for data + internal allocation rules',
  'Board vs operating plan overlay',
  'EBITDA / OpEx calibration vs Board (review blended CPL, COGS %, services) — needed to land Dec cash near ~$30M from Dec\'26 open',
  'CF/BS: debt schedule + bonus payout month cash timing; prepaid delta lever in sidebar',
  'H2 Forecast deferred is steady-state (~0.16 mo rev), not H1 annual-billing stock — keep FY27 continuous with Dec close',
  'Revenue bridge: cohort renewal calendar for annual book (beyond NB annual-% uplift)',
  'Definitions: pull company metric_definitions from outlook/hydrate overlay (same pattern as board _sources)',
  'Budget promote: expand warehouse tables (HC, GTM channels, GL) beyond core statements',
  'Plan Assurance: scenario stress sweeps (NB/CPL/attrition/churn) — DONE (Monte Carlo + nerd view)',
  'Goals → Draft: targets packet generates draft version inside formula graph',
  'Plan Assurance: optional dedicated tab separate from Overview visuals',
];

/**
 * Operating-plan metric definitions (description + calculation logic).
 * Company overlay: SMPL_OUTLOOK_PAYLOAD.metric_definitions or window.SMPL_METRIC_DEFINITIONS
 * merges by id (same idea as board provenance FIELD_CATALOG / _sources).
 */
const BUDGET_METRIC_DEFS = [
  // ARR
  { id: 'beginning_arr', domain: 'ARR', label: 'Beginning ARR', source_type: 'INPUT', tab: 'arr',
    description: 'ARR at the start of the month. January is locked to Dec\'26 Forecast ending ARR.',
    formula: 'Jan: BOP_LOCK (Dec\'26 Fcst EOP ARR)\nLater months: prior month Ending ARR',
    formula_id: 'arr_bop' },
  { id: 'ending_arr', domain: 'ARR', label: 'Ending ARR', source_type: 'COMPUTED', tab: 'arr',
    description: 'Contracted annual recurring revenue at month-end after the waterfall.',
    formula: 'Beginning ARR + NB + Expansion + Reactivation − Contraction − Churn',
    formula_id: 'arr_eop' },
  { id: 'net_new_arr', domain: 'ARR', label: 'Net new ARR', source_type: 'COMPUTED', tab: 'arr',
    description: 'Net change in contracted ARR in the period (not cash, not recognized revenue).',
    formula: 'NB + Expansion + Reactivation − Contraction − Churn',
    formula_id: 'arr_net_new' },
  { id: 'grr', domain: 'ARR', label: 'GRR (Gross Revenue Retention)', source_type: 'COMPUTED', tab: 'arr',
    description: 'Retention of beginning ARR after contraction and churn only (no expansion).',
    formula: '(Beginning ARR − Contraction − Churn) / Beginning ARR',
    formula_id: 'grr_arr_bridge' },
  { id: 'nrr', domain: 'ARR', label: 'NDR / NRR', source_type: 'COMPUTED', tab: 'arr',
    description: 'Net dollar retention including expansion and reactivation on the beginning book.',
    formula: '(Beginning ARR + Expansion + Reactivation − Contraction − Churn) / Beginning ARR',
    formula_id: 'nrr_arr_bridge' },
  { id: 'arr_mix_pct', domain: 'ARR', label: 'Component mix % of BOP', source_type: 'ASSUMPTION', tab: 'arr',
    description: 'Monthly ARR component as % of beginning ARR. Dollar row = BOP × this %. Dec may include a small NB plug so ending ARR hits the YoY target.',
    formula: 'nb_m = BOP_m × mix_nb_m\n(same for exp / react / cont / churn)\nDec NB += plug so Dec EOP = YoY target',
    formula_id: 'arr_mix_bop' },

  // Revenue bridge
  { id: 'billings', domain: 'Revenue bridge', label: 'Billings', source_type: 'COMPUTED', tab: 'arr', scrollTo: 'rev-bridge',
    description: 'Invoiced subscription amounts in the period. Not the same as ARR or recognized revenue.',
    formula: 'Recurring (BOP ARR ÷ 12)\n+ NB monthly × (1 − annual%) ÷ 12\n+ NB annual × annual%',
    formula_id: 'saas_billings',
    notes: 'Annual % defaults from Dec deferred depth; override on ARR sidebar.' },
  { id: 'deferred_rev', domain: 'Revenue bridge', label: 'Deferred revenue (ending)', source_type: 'COMPUTED', tab: 'arr', scrollTo: 'rev-bridge',
    description: 'Unearned subscription balance. Opens at Dec\'26 close; rolls with ARR and annual NB unearned.',
    formula: 'End DR = Beg DR × (EOP ARR / prior EOP ARR)\n+ (NB annual billings × 11/12)',
    formula_id: 'saas_end_deferred' },
  { id: 'chg_dr', domain: 'Revenue bridge', label: 'Δ Deferred revenue', source_type: 'COMPUTED', tab: 'arr', scrollTo: 'rev-bridge',
    description: 'Change in deferred — also Billings − Subscription revenue (identity).',
    formula: 'End DR − Beg DR\n≡ Billings − Subscription revenue',
    formula_id: 'saas_delta_deferred' },
  { id: 'subscription_revenue', domain: 'Revenue bridge', label: 'Subscription revenue', source_type: 'COMPUTED', tab: 'arr', scrollTo: 'rev-bridge',
    description: 'Recognized subscription revenue for the IS. ARR ≠ revenue — this is the SaaS recognition identity.',
    formula: 'Beg Deferred + Billings − End Deferred',
    formula_id: 'saas_sub_rev_identity',
    notes: 'Feeds Income Statement Subscription Revenue. Do not use Ending ARR ÷ 12 as revenue.' },
  { id: 'annual_bill_pct', domain: 'Revenue bridge', label: 'NB annual billing %', source_type: 'ASSUMPTION', tab: 'arr', scrollTo: 'rev-bridge',
    description: 'Share of new ARR billed annually in advance (remainder monthly).',
    formula: 'If unset: calibrate from Dec DR months of run-rate\n0.16 mo ≈ 0% annual · 6 mo ≈ 100% annual',
    formula_id: 'annual_bill_pct_calibrate' },

  // GTM
  { id: 'mqls_required', domain: 'GTM', label: 'MQLs required', source_type: 'COMPUTED', tab: 'gtm',
    description: 'Funnel MQLs needed to support NB ARR demand given conversion rates and ACV.',
    formula: 'Closed logos = NB ARR ÷ Avg ACV\nOpps to close = logos ÷ Opp→Close %\nPipeline opps = opps × pipeline coverage\nMQLs = pipeline opps ÷ MQL→Opp %',
    formula_id: 'gtm_mqls_required',
    notes: 'MQL→Opp applies to pipeline opps ↔ MQLs, not “opps to close” vs MQLs.' },
  { id: 'marketing_spend', domain: 'GTM', label: 'Marketing program spend', source_type: 'COMPUTED', tab: 'gtm',
    description: 'Total program spend sized from required MQLs × blended CPL, then split by channel mix.',
    formula: 'Spend = MQLs required × blended CPL\nChannel $ = mix% × total (mix renormalizes to 100%)',
    formula_id: 'gtm_spend_mqls_cpl' },
  { id: 'channel_mqls', domain: 'GTM', label: 'Channel MQLs', source_type: 'COMPUTED', tab: 'gtm',
    description: 'Allocation of funnel-required MQLs across channels by relative efficiency (spend÷channel CPL). Totals always match MQLs required.',
    formula: 'raw_i = channel_spend_i ÷ channel_CPL_i\nshare_i = raw_i / Σ raw\nchannel_MQLs_i = MQLs required × share_i',
    formula_id: 'gtm_channel_mql_allocate',
    notes: 'Channel CPL is relative efficiency only — it does not create a second absolute MQL budget.' },
  { id: 'blended_cpl', domain: 'GTM', label: 'Blended cost per MQL', source_type: 'ASSUMPTION', tab: 'gtm',
    description: 'Company-level $/MQL used to size total program spend. Hist-seeded; editable per month.',
    formula: 'Program spend = MQLs required × blended CPL',
    formula_id: 'gtm_blended_cpl' },
  { id: 'gtm_sm_implied', domain: 'GTM', label: 'Implied S&M (from marketing)', source_type: 'COMPUTED', tab: 'gtm',
    description: 'Marketing spend grossed up to S&M using the marketing share of S&M.',
    formula: 'Marketing spend / MKT_SM_RATIO (default 65%)',
    formula_id: 'gtm_sm_implied' },

  // Sales
  { id: 'quota', domain: 'Sales', label: 'Quota (annual $)', source_type: 'ASSUMPTION', tab: 'sales',
    description: 'Annual $ assigned to a seller (AE or CSM) as their attainment book. Segment base quotas are relative weights; dollars are scaled to history then lifted.',
    formula: 'Segment seed (fy25Quota × heads) → scale to FY26 hist NB/Exp\nFY27 per-head = FY26 watermark × (1 + YoY lift)  [never below FY26]',
    formula_id: 'sales_quota_per_head',
    notes: 'Quota is a capacity/coverage construct — not the same as ARR booked or revenue recognized.' },
  { id: 'quota_watermark', domain: 'Sales', label: 'Quota watermark (FY26)', source_type: 'COMPUTED', tab: 'sales',
    description: 'FY26 per-head quota after scaling segment seeds to actual FY26 NB (AEs) or Expansion (CS). Floor for FY27 quotas.',
    formula: 'scale_NB = FY26_NB_hist / Σ(heads × fy25Quota)_NB\nFY26 per-head = fy25Quota × scale_NB\n(same pattern for CS using FY26 Expansion)',
    formula_id: 'sales_quota_watermark' },
  { id: 'quota_yoy_lift', domain: 'Sales', label: 'Quota YoY lift %', source_type: 'ASSUMPTION', tab: 'sales',
    description: 'Optional increase in per-head quota vs FY26 watermark (0 = flat). Higher lift shrinks hire need.',
    formula: 'FY27 per-head = watermark × (1 + lift%)',
    formula_id: 'sales_quota_yoy_lift' },
  { id: 'nb_vs_cs', domain: 'Sales', label: 'New Business vs Customer Success', source_type: 'INPUT', tab: 'sales',
    description: 'Two selling motions. NB AEs own new logos / new ARR. CSMs own expansion on customers ≥1 year (and coverage vs churn+contraction on that book).',
    formula: 'NB segments: group = nb (Enterprise / MM / SMB AE by region)\nCS segments: group = cs (CSM by region)\nCS demand = max(FY Expansion ARR, FY26 churn+contraction × CS cover mult)',
    formula_id: 'sales_nb_vs_cs',
    notes: 'CS is not “all expansion everywhere” — it is the retained ≥1yr book motion in this plan.' },
  { id: 'sales_regions', domain: 'Sales', label: 'Sales regions', source_type: 'INPUT', tab: 'sales',
    description: 'Geographic quota pools: NAM, EMEA, APAC. Each region × role has a relative quota seed and Dec\'26 starting heads.',
    formula: 'SALES_SEGMENTS: region ∈ {NAM, EMEA, APAC} × role\nHeads locked from Dec\'26 HC BOP (sales / cs)',
    formula_id: 'sales_regions' },
  { id: 'hire_quota_ramp', domain: 'Sales', label: 'New-hire quota ramp', source_type: 'ASSUMPTION', tab: 'sales',
    description: 'Productivity of a new hire by tenure month. Applied in the quota waterfall for capacity display — hire count still uses full annual quota (no oversizing for ramp).',
    formula: 'Month 1 of tenure: 33% of full quota\nMonth 2: 66%\nMonth 3+: 100%\n(HIRE_QUOTA_RAMP = [0.33, 0.66, 1.0])',
    formula_id: 'sales_hire_ramp',
    notes: 'Same ramp curve for AE and CSM today; segment type changes quota $, not the ramp shape.' },
  { id: 'existing_bench_cover', domain: 'Sales', label: 'Expected attain (existing bench)', source_type: 'ASSUMPTION', tab: 'sales',
    description: 'Expected delivery on the existing full quota book (informational). Does not change hire count — hires use full watermark book vs demand.',
    formula: 'Effective existing $ = existing quota book × attain %\nHire gap = max(0, demand − full existing book) / avg quota',
    formula_id: 'sales_bench_attain' },
  { id: 'cs_churn_cover', domain: 'Sales', label: 'CS vs churn + contraction cover', source_type: 'ASSUMPTION', tab: 'sales',
    description: 'CS demand floor: CSM quota book must cover at least this multiple of FY26 churn+contraction on the retained book (in addition to expansion demand).',
    formula: 'CS demand = max(FY Expansion ARR, FY26 churn+contraction × cover mult)\nDefault cover mult = 1.15×',
    formula_id: 'sales_cs_churn_cover' },
  { id: 'sales_attrition', domain: 'Sales', label: 'Sales / CS attrition', source_type: 'ASSUMPTION', tab: 'sales',
    description: 'Annual attrition rate on AE and CSM benches. Drives replacement (backfill) hires on top of growth hires.',
    formula: 'Backfill hires = ceil(starting heads × attrition %)\nSpread across months; existing bench reduced first in waterfall',
    formula_id: 'sales_attrition' },
  { id: 'sales_quota_coverage', domain: 'Sales', label: 'Budget coverage (bench / hires)', source_type: 'COMPUTED', tab: 'sales',
    description: 'How FY27 NB (and CS) demand is covered by existing watermark quota vs hire gap.',
    formula: 'Existing cover % = existing quota book / demand\nHire % = hire gap / demand\nNeeded heads = ceil(hire gap / avg annual quota) + attrition backfill',
    formula_id: 'sales_quota_cover' },
  { id: 'quarter_close_weight', domain: 'Sales', label: 'Within-quarter close pattern', source_type: 'ASSUMPTION', tab: 'sales',
    description: 'Quota is thought of as quarterly; month 3 of each quarter gets the bulk of closes (M3 >> M1).',
    formula: 'CLOSE_WEIGHTS within quarter applied to monthly NB/Exp pacing',
    formula_id: 'sales_close_weights' },

  // Headcount
  { id: 'hc_payroll', domain: 'Headcount', label: 'Payroll (by dept)', source_type: 'COMPUTED', tab: 'hc',
    description: 'Monthly comp: wages, burden, bonus accrual, variable OTE (Sales), severance.',
    formula: 'Wages from heads × rate cards\n+ payroll tax / benefits / 401k %\n+ bonus accrual · OTE (NB/CS variable)',
    formula_id: 'hc_payroll_roll' },
  { id: 'hc_bop_lock', domain: 'Headcount', label: 'Jan HC BOP lock', source_type: 'INPUT', tab: 'hc',
    description: 'January beginning heads locked to Dec\'26 forecast ending HC by dept (sales / cs / marketing / rd / ga).',
    formula: 'HC_BOP_LOCK[dept] = Dec\'26 Forecast ending heads',
    formula_id: 'hc_bop_lock' },
  { id: 'nb_ote_var', domain: 'Headcount', label: 'NB / CS variable OTE', source_type: 'ASSUMPTION', tab: 'hc',
    description: 'Variable on-target earnings at 100% attain for AEs and CSMs — commissions/incentives, not a % of base.',
    formula: 'Monthly OTE accrual from nbOteVarAnnual / csOteVarAnnual',
    formula_id: 'hc_ote_variable' },

  // P&L / IS
  { id: 'pnl_dept_total', domain: 'P&L', label: 'Department P&L total', source_type: 'COMPUTED', tab: 'pnl',
    description: 'Dept book = HC-linked comp + discretionary spend (editable $k) + GTM channels (Marketing).',
    formula: 'Comp (from HC) + discretionary lines + (Marketing: GTM channel $)',
    formula_id: 'pnl_dept_rollup' },
  { id: 'services_revenue', domain: 'Income Statement', label: 'Services revenue', source_type: 'COMPUTED', tab: 'is',
    description: 'Non-subscription services attached to the subscription book.',
    formula: 'Subscription revenue × Services % of sub (lever)',
    formula_id: 'is_services_pct_sub' },
  { id: 'total_revenue', domain: 'Income Statement', label: 'Total revenue', source_type: 'COMPUTED', tab: 'is',
    description: 'Company revenue for the period.',
    formula: 'Subscription revenue + Services revenue',
    formula_id: 'is_total_revenue' },
  { id: 'cogs', domain: 'Income Statement', label: 'Cost of revenue', source_type: 'ASSUMPTION', tab: 'is',
    description: 'Single COGS line until a delivery book exists (hosting / support / 3rd party later).',
    formula: 'Total revenue × COGS % of revenue',
    formula_id: 'is_cogs_pct_rev' },
  { id: 'gross_profit', domain: 'Income Statement', label: 'Gross profit', source_type: 'COMPUTED', tab: 'is',
    description: 'Revenue after cost of revenue.',
    formula: 'Total revenue − COGS',
    formula_id: 'is_gross_profit' },
  { id: 'gm_pct', domain: 'Income Statement', label: 'Gross margin %', source_type: 'COMPUTED', tab: 'is',
    description: 'Gross profit as a share of revenue.',
    formula: 'Gross profit / Total revenue',
    formula_id: 'gross_profit_div_revenue' },
  { id: 'total_opex', domain: 'Income Statement', label: 'Total OpEx', source_type: 'COMPUTED', tab: 'is',
    description: 'Operating expenses from department P&Ls mapped to S&M / R&D / G&A.',
    formula: 'S&M + R&D + G&A',
    formula_id: 'total_opex_sm_rd_ga' },
  { id: 'ebitda', domain: 'Income Statement', label: 'EBITDA', source_type: 'COMPUTED', tab: 'is',
    description: 'Earnings before interest, tax, D&A.',
    formula: 'Gross profit − Total OpEx',
    formula_id: 'is_ebitda' },
  { id: 'net_income', domain: 'Income Statement', label: 'Net income', source_type: 'COMPUTED', tab: 'is',
    description: 'Bottom line after D&A, interest, and tax.',
    formula: 'EBITDA − D&A − Interest − Tax\nTax = 21% × pretax when pretax > 0',
    formula_id: 'is_net_income' },

  // BS / CF
  { id: 'ar', domain: 'Balance Sheet', label: 'Accounts receivable', source_type: 'COMPUTED', tab: 'bs',
    description: 'AR stock opens at Dec close and rolls with revenue activity (no % relevel cliff).',
    formula: 'End AR = Beg AR × (Revenue / prior Revenue)',

function companyMetricDefsOverlay() {
  const payload = window.SMPL_OUTLOOK_PAYLOAD
    || (window.SMPLOutlook && typeof window.SMPLOutlook.getPayload === 'function' && window.SMPLOutlook.getPayload())
    || null;
  if (payload && Array.isArray(payload.metric_definitions)) return payload.metric_definitions;
  if (payload && payload.metric_definitions && typeof payload.metric_definitions === 'object' && !Array.isArray(payload.metric_definitions)) {
    return Object.keys(payload.metric_definitions).map(id => Object.assign({ id }, payload.metric_definitions[id]));
  }
  if (Array.isArray(window.SMPL_METRIC_DEFINITIONS)) return window.SMPL_METRIC_DEFINITIONS;
  return null;
}

/** Base catalog merged with company overlay by id (company wins on conflict). */
function getMetricDefinitions() {
  const byId = {};
  for (const d of BUDGET_METRIC_DEFS) byId[d.id] = Object.assign({}, d);
  const overlay = companyMetricDefsOverlay();
  if (overlay) {
    for (const d of overlay) {
      if (!d || !d.id) continue;
      byId[d.id] = Object.assign({}, byId[d.id] || {}, d);
    }
  }
  // Optional: enrich formula from shared provenance catalog when present
  try {
    const cat = window.SMPLProvenance && window.SMPLProvenance.FIELD_CATALOG;
    if (cat) {
      for (const id of Object.keys(byId)) {
        const rec = cat[id];
        if (rec && rec.formula && !byId[id].formula) {
          byId[id].formula = rec.formula;
          byId[id].formula_id = byId[id].formula_id || rec.formula_id;
          byId[id].source_type = byId[id].source_type || rec.source_type;
        }
      }
    }
  } catch (e) { /* ignore */ }
  return Object.keys(byId).map(k => byId[k]);
}

function metricDefDomains(defs) {
  const seen = [];
  for (const d of defs) {
    if (d.domain && seen.indexOf(d.domain) < 0) seen.push(d.domain);

}

function hcMeritImpactMonth() {

/** Merit multiplier for a FY month index (0 = Jan). No month / 0% → 1.0. Pre-impact months stay last-year rate. */

  const start = hcMeritImpactMonth();

  if (start == null || pct <= 0) return 1;
  return moIdx >= start ? (1 + pct / 100) : 1;
}

function persistBudgetState() {
  try {
    const out = { _planRev: BUDGET_PLAN_REV };
    for (const k of Object.keys(STATE)) {
      if (BUDGET_PERSIST_SKIP.has(k)) continue;
      if (BUDGET_EPHEMERAL_SEED_KEYS.has(k)) continue;
      out[k] = STATE[k];
    }
    out.curTab = curTab;
    // Never persist manual hire overrides — they are the #1 Sales tab drift source.
    out._salesHireManual = false;
    localStorage.setItem(BUDGET_STATE_KEY, JSON.stringify(out));
  } catch (e) {
    console.warn('Budget engine: could not save assumptions', e);
  }
}

    const raw = localStorage.getItem(BUDGET_STATE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (!saved || typeof saved !== 'object') return false;
    if (saved._planRev != null && saved._planRev !== BUDGET_PLAN_REV) return false;
    for (const k of Object.keys(saved)) {
      if (k === '_planRev' || k === '_salesHireManual') continue;
      if (BUDGET_PERSIST_SKIP.has(k) || BUDGET_EPHEMERAL_SEED_KEYS.has(k)) continue;
      if (k === 'curTab') {
        curTab = saved.curTab || 'overview';
        continue;
      }
      if (Object.prototype.hasOwnProperty.call(STATE, k)) {
        STATE[k] = saved[k];
      }
    }
    STATE._salesHireManual = false;
    STATE.salesHireOverride = {};
    if (STATE.drMonthsRev != null && STATE.drMonthsRev >= 2) {
      STATE.drMonthsRev = STATE_DEFAULTS.drMonthsRev;
    }
    if (STATE.apPctOpex != null && Math.abs(STATE.apPctOpex - 18) < 0.05) {
      STATE.apPctOpex = STATE_DEFAULTS.apPctOpex;
    }
    return true;
  } catch (e) {
    console.warn('Budget engine: could not restore assumptions', e);
    return false;
  }
}

function clearBudgetState() {
  try {
    localStorage.removeItem(BUDGET_STATE_KEY);
    localStorage.removeItem('smpl.budgetEngine.fy2027.v1');
    localStorage.removeItem('smpl.budgetEngine.fy2027.v2');
    localStorage.removeItem('smpl.budgetEngine.fy2027.v3');
    localStorage.removeItem('smpl.budgetEngine.fy2027.v4');
  } catch (e) { /* ignore */ }
}

/** Compact fingerprint so localhost vs /app assumption drift is visible. */
function budgetAssumptionFingerprint() {
  let salesBit = '';
  try {
    const t = salesTieOutDrivers();
    salesBit = [
      'fy26nb' + Math.round((t.fy26Nb || 0) / 1e6) + 'M',
      'fy26exp' + Math.round((t.fy26Exp || 0) / 1e6) + 'M',
      'ch' + Math.round((t.churnBase || 0) / 1e6) + 'M',
      'nbb' + Math.round((t.existingNbQuota || 0) / 1e6) + 'M',
      'csb' + Math.round((t.existingCsQuota || 0) / 1e6) + 'M',
      'csd' + Math.round((t.csDemand || 0) / 1e6) + 'M',
      'csh' + (t.csGrowthHires || 0),
      'src' + (t.histSource || '?'),
    ].join(' · ');
  } catch (e) { /* sales not ready */ }
  return [
    'r' + BUDGET_PLAN_REV,
    'yoy' + STATE.yoyEndingArrGrowthPct,
    'pipe' + STATE.pipelineCoverageMult,
    'attr' + STATE.salesAttritionPct,
    'qlift' + (STATE.quotaYoyLiftPct || 0),
    'csc' + STATE.csChurnCoverageMult,
    salesBit,
  ].filter(Boolean).join(' · ');
}

/** Hist + demand drivers behind Sales Over/Under and hire counts. */
function salesTieOutDrivers() {
  const sales = computeSalesPlan();
  const m = sales.meta;
  const fy26Nb = fy26NbTotal();
  const fy26Exp = fy26ExpTotal();
  const churnBase = fy26ChurnContTotal();
  let monthsWithArr = 0;
  let monthsDemoFallback = 0;
  let monthsOutlook = 0;
  for (const q of CTX_QUARTERS) {
    for (const p of q.months) {
      const r = getHistRow(p);
      if (!r) continue;
      monthsWithArr += 1;
      if (r._src === 'demo' || r._fallback) monthsDemoFallback += 1;
      else if (r._src === 'outlook') monthsOutlook += 1;
    }
  }
  const histSource = monthsDemoFallback > 0 && monthsDemoFallback >= monthsOutlook
    ? (monthsOutlook ? 'mixed-demo-fallback' : 'demo')
    : (monthsOutlook ? 'outlook' : (monthsWithArr ? 'wf' : 'empty'));
  const nbOuFy = BUD_P.reduce((s, p) => s + (sales.byPeriod[p].nbMonthGap || 0), 0);
  const csOuFy = BUD_P.reduce((s, p) => s + (sales.byPeriod[p].csMonthGap || 0), 0);
  const seedUnscaled = (m.scaleNb26 == null || Math.abs(m.scaleNb26 - 1) < 1e-9) && fy26Nb <= 0;
  return {
    histSource,
    monthsWithArr,
    monthsDemoFallback,
    monthsOutlook,
    fy26Nb,
    fy26Exp,
    churnBase,
    fyNb: m.fyNb,
    fyExp: m.fyExp,
    csDemand: m.csDemand,
    csFloor: m.csFloor,
    existingNbQuota: m.existingNbQuota,
    existingCsQuota: m.existingCsQuota,
    nbGapSigned: m.nbGapSigned,
    csGapSigned: m.csGapSigned,
    nbGrowthHires: m.nbGrowthHires,
    csGrowthHires: m.csGrowthHires,
    scaleNb26: m.scaleNb26,
    scaleCs26: m.scaleCs26,
    nbOuFy,
    csOuFy,
    histThin: monthsWithArr < 12 || fy26Nb <= 0 || fy26Exp <= 0 || seedUnscaled,
    usedDemoFallback: monthsDemoFallback > 0,
  };
}

function reseedPlanFromHistory(reason) {
  _budgetHistScale = null;
  STATE.histRows = {};
  STATE.gtmHistRows = {};
  STATE.mixByPeriod = {};
  STATE.gtmRatesByPeriod = {};
  STATE.gtmChannelMixByPeriod = {};
  STATE.gtmChannelCplByPeriod = {};
  STATE.salesHireOverride = {};
  STATE._salesHireManual = false;
  seedMixFromHistory();
  seedGtmFromHistory();
  return reason || 'reseeding';
}

/** Monthly compound rate that achieves YoY ending ARR growth Dec'27 vs Dec'26. */
function monthlyRateFromYoy(yoyPct) {
  return Math.pow(1 + yoyPct / 100, 1 / 12) - 1;
}

let curTab = 'overview';

function fmtM(v) {
  if (v == null || isNaN(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e6) return (v < 0 ? '-' : '') + '$' + (a / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return (v < 0 ? '-' : '') + '$' + Math.round(a / 1e3) + 'k';
  return '$' + Math.round(v);
}

function fmtPct(v) {
  if (v == null || isNaN(v)) return '—';
  return (v * 100).toFixed(1) + '%';
}

function fmtN(v, d) {
  if (v == null || isNaN(v)) return '—';
  d = d == null ? 0 : d;
  return Math.round(v).toLocaleString('en-US');
}

/** Headcount flow: hires/net keep sign; attrition/RIF counts display as negatives. */
function hcFlowKind(row) {
  if (!row) return null;
  if (row.attrition || row.rifExits || row.k === 'attr_tot' || row.k === 'rif_tot') return 'exit';
  if (row.net) return 'net';
  if (row.hire || row.editableHireLevel || row.k === 'hires_tot') return 'hire';
  return null;
}

function fmtHcFlow(n, kind) {
  if (n == null || isNaN(n)) return '—';
  const shown = kind === 'exit' ? -Math.abs(n) : n;
  if (!shown) return '<span class="delta-zero">0</span>';
  const cls = shown > 0 ? 'delta-pos' : 'delta-neg';
  const txt = (shown > 0 ? '+' : '') + Math.round(shown).toLocaleString('en-US');
  return `<span class="${cls}">${txt}</span>`;
}

function hireDeltaClass(val) {
  const n = Math.round(Number(val) || 0);
  if (n > 0) return 'delta-pos';
  if (n < 0) return 'delta-neg';
  return 'delta-zero';
}

function fmtK(v, decimals) {
  if (v == null || isNaN(v)) return '—';
  const d = decimals == null ? 0 : decimals;
  const a = Math.abs(v);
  const signed = v < 0 ? '-' : '';
  if (a >= 1e3 || d > 0) {
    const k = a / 1e3;
    return signed + '$' + (d > 0 ? k.toFixed(d) : Math.round(k).toLocaleString('en-US')) + 'k';
  }
  return signed + '$' + Math.round(a).toLocaleString('en-US');
}

function allOutlookPeriods() {
  // Prefer explicit period labels from live hydrate — Beginning[i] must map to the
  // same YYYY-MM the board/forecast engines use. Guessing "Jan of CLOSE year" from
  // array length alone shifts FY26 when the warehouse range is not calendar-aligned.
  const payload = window.SMPL_OUTLOOK_PAYLOAD;
  const meta = payload && payload.meta;
  if (meta && meta.start_period && meta.end_period) {
    const out = [];
    const [sy, sm] = meta.start_period.split('-').map(Number);
    const [ey, em] = meta.end_period.split('-').map(Number);
    let y = sy;
    let m = sm;
    while (y < ey || (y === ey && m <= em)) {
      out.push(`${y}-${String(m).padStart(2, '0')}`);
      m += 1;
      if (m > 12) { m = 1; y += 1; }
      if (out.length > 36) break;
    }
    if (out.length) return out;
  }
  const wf = window.SMPL_ARR_WATERFALL || window.SMPL_DEMO_WF_TABLE || window.WF_TABLE;
  if (wf && wf.periods && wf.periods.length) return wf.periods.slice();
  if (window.SMPLOutlook && typeof window.SMPLOutlook.getOutlookYearPeriods === 'function') {
    try {
      const fromOutlook = window.SMPLOutlook.getOutlookYearPeriods(payload || { meta: { close_month: CLOSE_MONTH } });
      if (fromOutlook && fromOutlook.length) return fromOutlook;
    } catch (e) { /* ignore */ }
  }
  const year = CLOSE_MONTH.slice(0, 4);
  const len = wf && wf.Beginning ? wf.Beginning.length : 12;
  return Array.from({ length: Math.min(len, 12) }, (_, i) => `${year}-${String(i + 1).padStart(2, '0')}`);
}

function histRowHasMovement(row) {
  if (!row) return false;
  return ((row.nb || 0) + (row.exp || 0)) > 0;
}

/** Raw Dec'26 ending from outlook/demo WF — never go through getHistRow (avoids cache/scale loops). */
function peekUnscaledDecEndingArr() {
  const decPeriod = `${BUDGET_YEAR - 1}-12`;
  const allP = allOutlookPeriods();
  const num = (v) => {
    if (v == null || v === '') return null;
    const n = Number(String(v).replace(/,/g, ''));
    return Number.isFinite(n) ? n : null;
  };
  if (window.SMPLOutlook && typeof window.SMPLOutlook.getCombinedArr === 'function') {
    try {
      const raw = window.SMPLOutlook.getCombinedArr(decPeriod, allP, CLOSE_MONTH);
      const eop = raw ? num(raw.arr_eop) : null;
      if (eop != null && eop > 0) return eop;
    } catch (e) { /* ignore */ }
  }
  const wf = window.SMPL_ARR_WATERFALL || window.SMPL_DEMO_WF_TABLE || window.WF_TABLE;
  if (wf && wf.Ending && wf.Ending.length) {
    const periods = (wf.periods && wf.periods.length) ? wf.periods : allP;
    let i = periods.indexOf(decPeriod);
    if (i < 0 && wf.Ending.length >= 12) i = 11;
    if (i >= 0) {
      const eop = num(wf.Ending[i]);
      if (eop != null && eop > 0) return eop;
    }
  }
  // Embedded demo seed Dec fingerprint (what /app was stuck on).
  return 97560000;
}

/**
 * Scale FY26 hist so Dec ending matches Jan BOP_LOCK ($90.29M).
 * Always recompute from raw Dec — do not trust a stale scale=1 cache after hydrate.
 */
let _budgetHistScale = null;
function budgetHistScaleToBopLock() {
  const dec = peekUnscaledDecEndingArr();
  const next = dec > 0 && Math.abs(dec - BOP_LOCK) > 1000 ? BOP_LOCK / dec : 1;
  // If hydrate/demo flipped under us, invalidate cached hist rows so UI cannot keep $97.56M.
  if (_budgetHistScale != null && Math.abs(_budgetHistScale - next) > 1e-9) {
    STATE.histRows = {};
    STATE.gtmHistRows = {};
  }
  _budgetHistScale = next;
  return _budgetHistScale;
}

function applyBudgetHistScale(row) {
  if (!row) return row;
  const scale = budgetHistScaleToBopLock();
  if (Math.abs(scale - 1) < 1e-12) return row;
  if (row._budgetScaled && Math.abs((row._budgetScale || 1) - scale) < 1e-12) return row;
  return {
    bop: (row.bop || 0) * scale,
    eop: (row.eop || 0) * scale,
    nb: (row.nb || 0) * scale,
    exp: (row.exp || 0) * scale,
    react: (row.react || 0) * scale,
    cont: (row.cont || 0) * scale,
    churn: (row.churn || 0) * scale,
    nn: (row.nn || 0) * scale,
    grr: row.grr,
    nrr: row.nrr,
    _src: row._src,
    _fallback: row._fallback,
    _budgetScaled: true,
    _budgetScale: scale,
  };
}

/** Build a hist row from a waterfall table + period index. */
function histRowFromWfAt(wf, i) {
  if (!wf || !wf.Beginning || i < 0 || i >= wf.Beginning.length) return null;
  const num = (arr) => (arr && arr[i] != null ? Number(String(arr[i]).replace(/,/g, '')) : 0);
  const nb = num(wf['New Business'] || wf.New_Business);
  const exp = num(wf.Expansion);
  const react = num(wf.Reactivation);
  const cont = Math.abs(num(wf.Contraction));
  const churn = Math.abs(num(wf.Churn));
  const bop = num(wf.Beginning);
  const eop = num(wf.Ending);
  if (bop == null && eop == null && nb === 0 && exp === 0) return null;
  const nn = nb + exp + react - cont - churn;
  return {
    bop, nb, exp, react, cont, churn, eop, nn,
    grr: bop > 0 ? (bop - churn - cont) / bop : null,
    nrr: bop > 0 ? (bop + nn - nb) / bop : null,
  };
}

/**
 * Embedded demo waterfall for FY of CLOSE_MONTH (always Jan–Dec index 0..11).
 * Dollar alignment to BOP_LOCK is applied once in applyBudgetHistScale (raw demo Dec is $97.56M).
 */
function getDemoHistRow(period) {
  const wf = window.SMPL_DEMO_WF_TABLE;
  if (!wf || !wf.Beginning) return null;
  const year = CLOSE_MONTH.slice(0, 4);
  if (!period || period.slice(0, 4) !== year) return null;
  const mo = parseInt(period.slice(5, 7), 10);
  if (!mo || mo < 1 || mo > wf.Beginning.length) return null;
  const row = histRowFromWfAt(wf, mo - 1);
  if (row) row._src = 'demo';
  return row;
}

/** Keep live BOP/EOP (board lock path); borrow demo movement only when live NB/Exp are empty. */
function mergeHistLiveAnchors(live, demo) {
  if (!live) return demo || null;
  if (!demo || histRowHasMovement(live)) return live;
  const nb = (live.nb || 0) > 0 ? live.nb : (demo.nb || 0);
  const exp = (live.exp || 0) > 0 ? live.exp : (demo.exp || 0);
  const react = (live.react || 0) > 0 ? live.react : (demo.react || 0);
  const cont = (live.cont || 0) > 0 ? live.cont : (demo.cont || 0);
  const churn = (live.churn || 0) > 0 ? live.churn : (demo.churn || 0);
  const bop = live.bop != null ? live.bop : demo.bop;
  const eop = live.eop != null ? live.eop : demo.eop;
  const nn = nb + exp + react - cont - churn;
  return {
    bop, eop, nb, exp, react, cont, churn, nn,
    grr: bop > 0 ? (bop - churn - cont) / bop : live.grr,
    nrr: bop > 0 ? (bop + nn - nb) / bop : live.nrr,
    _src: live._src || 'outlook',
    _fallback: 'demo-movement-only',
  };
}

function getHistRowFromWfTable(period) {
  const wf = window.SMPL_ARR_WATERFALL || window.SMPL_DEMO_WF_TABLE || window.WF_TABLE;
  if (!wf || !wf.Beginning) return getDemoHistRow(period);
  const periods = allOutlookPeriods();
  const i = periods.indexOf(period);
  if (i < 0) return getDemoHistRow(period);
  const row = histRowFromWfAt(wf, i);
  if (!row) return getDemoHistRow(period);
  if (histRowHasMovement(row)) return row;
  // Live/warehouse row has Ending but no NB/Exp — do not replace Ending with raw demo $97.56M.
  return mergeHistLiveAnchors(row, getDemoHistRow(period));
}

function getHistRow(period) {
  if (STATE.histRows[period]) return STATE.histRows[period];
  const allP = allOutlookPeriods();
  let row = null;
  if (window.SMPLOutlook && window.SMPLOutlook.getCombinedArr) {
    const raw = window.SMPLOutlook.getCombinedArr(period, allP, CLOSE_MONTH);
    if (raw && (raw.arr_bop != null || raw.arr_eop != null || raw.arr_nb != null || raw.arr_exp != null)) {
      const nb = raw.arr_nb || 0;
      const exp = raw.arr_exp || 0;
      const react = raw.arr_react || 0;
      const cont = raw.arr_cont || 0;
      const churn = raw.arr_nr_churn || 0;
      const bop = raw.arr_bop;
      const nn = nb + exp + react - cont - churn;
      row = {
        bop, nb, exp, react, cont, churn, eop: raw.arr_eop, nn,
        grr: raw.grr, nrr: raw.nrr,
        _src: 'outlook',
      };
    }
  }
  if (!histRowHasMovement(row)) {
    const fallback = getHistRowFromWfTable(period);
    row = mergeHistLiveAnchors(row, fallback);
  }
  if (!row) row = getDemoHistRow(period);
  row = applyBudgetHistScale(row);
  // Dec must land exactly on the Jan'27 lock — no $97.56M next to a $90.29M BOP.
  if (row && period === `${BUDGET_YEAR - 1}-12` && Math.abs((row.eop || 0) - BOP_LOCK) > 1) {
    row = { ...row, eop: BOP_LOCK, _eopForcedToBopLock: true };
  }
  if (row) STATE.histRows[period] = row;
  return row;
}

function buildQuarterSummary(q) {
  let nn = 0, bop = null, eop = null, grrSum = 0, nrrSum = 0, n = 0;
  for (const p of q.months) {
    const row = getHistRow(p);
    if (!row) continue;
    if (bop == null) bop = row.bop;
    eop = row.eop;
    nn += row.nn || 0;
    if (row.grr != null) { grrSum += row.grr; n += 1; }
    if (row.nrr != null) nrrSum += row.nrr;
  }
  return {
    label: q.key + (q.source === 'forecast' ? ' Fcst' : ''),
    eop, nn,
    grr: n ? grrSum / n : null,
    nrr: n ? nrrSum / n : null,
  };
}

/** Component rates as % of beginning ARR (monthly). Used as relative weights to allocate FY net new. */
function mixFromHistRow(row) {
  if (!row || !row.bop || row.bop <= 0) {
    // Fallback ~monthly % of BOP if history missing
    return { nb: 0.014, exp: 0.007, react: 0.001, cont: 0.002, churn: 0.001 };
  }
  return {
    nb: (row.nb || 0) / row.bop,
    exp: (row.exp || 0) / row.bop,
    react: (row.react || 0) / row.bop,
    cont: (row.cont || 0) / row.bop,
    churn: (row.churn || 0) / row.bop,
  };
}

function getMix(period) {
  if (!STATE.mixByPeriod[period]) {
    const mo = period.slice(5, 7);
    const hist = getHistRow(`${BUDGET_YEAR - 1}-${mo}`);
    STATE.mixByPeriod[period] = mixFromHistRow(hist);
  }
  return STATE.mixByPeriod[period];
}

function computeArrAnnualTargets() {
  const g = monthlyRateFromYoy(STATE.yoyEndingArrGrowthPct);
  const targetDec = BOP_LOCK * Math.pow(1 + g, 12);
  const fyNn = targetDec - BOP_LOCK;
  const mix = { nb: 0, exp: 0, react: 0, cont: 0, churn: 0 };
  for (const p of BUD_P) {
    const m = getMix(p);
    for (const k of MIX_KEYS) mix[k] += m[k] || 0;
  }
  for (const k of MIX_KEYS) mix[k] /= BUD_P.length;
  const mixSum = mix.nb + mix.exp + mix.react - mix.cont - mix.churn;
  const scale = mixSum > 0 ? 1 / mixSum : 1;
  return {
    g,
    targetDec,
    fyNn,
    mix,
    nb: fyNn * mix.nb * scale,
    exp: fyNn * mix.exp * scale,
    react: fyNn * mix.react * scale,
    cont: fyNn * mix.cont * scale,
    churn: fyNn * mix.churn * scale,
  };
}

function normalizeWeights(arr) {
  const s = arr.reduce((a, b) => a + b, 0);
  if (s <= 0) return arr.map(() => 1 / Math.max(1, arr.length));
  return arr.map(x => x / s);
}

/** Combine headcount ramp with quarter-end close weights (M3 >> M1). */
function monthWeightsFromHeads(heads12) {
  const qW = STATE.quarterCloseWeights || [0.22, 0.30, 0.48];
  const raw = heads12.map((h, i) => Math.max(0.25, Number(h) || 0) * qW[i % 3]);
  return normalizeWeights(raw);
}

function smoothYearWeights() {
  const qW = STATE.quarterCloseWeights || [0.22, 0.30, 0.48];
  // Mild H2 tilt + quarter-end pattern (used for react/cont/churn)
  const raw = BUD_P.map((_, i) => (1 + 0.035 * i) * qW[i % 3]);
  return normalizeWeights(raw);
}

function histQuarterWeights(field) {
  const q = [0, 0, 0, 0];
  for (let i = 0; i < 12; i++) {
    const r = getHistRow(`${BUDGET_YEAR - 1}-${padMo(i + 1)}`);
    if (!r) continue;
    const v = field === 'nn' ? r.nn : r[field];
    q[Math.floor(i / 3)] += Math.max(0, Number(v) || 0);
  }
  if (q.every(v => v <= 0)) return null;
  return normalizeWeights(q);
}

/**
 * Within each quarter: 22 / 30 / 48 close weights.
 * Across quarters: prior-year high/low mix (plus a light HC tilt).
 */
function monthWeightsCloseByHistQuarter(heads12, histField) {
  const close = STATE.quarterCloseWeights || [0.22, 0.30, 0.48];
  const qHeads = [0, 0, 0, 0];
  for (let i = 0; i < 12; i++) qHeads[Math.floor(i / 3)] += Math.max(0.25, Number(heads12[i]) || 0);
  const qHc = normalizeWeights(qHeads);
  const qHist = histQuarterWeights(histField);
  const qMix = qHist
    ? normalizeWeights(qHist.map((s, qi) => 0.85 * s + 0.15 * qHc[qi]))
    : qHc;
  const raw = [];
  for (let i = 0; i < 12; i++) raw.push(qMix[Math.floor(i / 3)] * close[i % 3]);
  return normalizeWeights(raw);
}

/**
 * FY27 ARR path: monthly component $ = Beginning ARR × editable mix %.
 * YoY Dec target is hit with a Dec NB plug only — Jan–Nov always tie to BOP × %.
 * (Previously annual $ were reshaped by Sales HC / hist weights, so 1.6% × BOP
 * did not equal the New business $ row — and localhost vs /app diverged.)
 */
function computeBudgetArr() {
  const annual = computeArrAnnualTargets();
  const out = {};
  let prior = BOP_LOCK;
  for (let i = 0; i < BUD_P.length; i++) {
    const p = BUD_P[i];
    const m = getMix(p);
    const bop = prior;
    const nb = bop * (m.nb || 0);
    const exp = bop * (m.exp || 0);
    const react = bop * (m.react || 0);
    const cont = bop * (m.cont || 0);
    const churn = bop * (m.churn || 0);
    const nn = nb + exp + react - cont - churn;
    const eop = bop + nn;
    out[p] = {
      bop, nb, exp, react, cont, churn, nn, eop,
      grr: bop > 0 ? (bop - churn - cont) / bop : null,
      nrr: bop > 0 ? (bop + nn - nb) / bop : null,
      check: null,
    };
    prior = eop;
  }
  // Dec plug on NB only so ending ARR hits YoY target — leaves Jan–Nov BOP×mix exact.
  const drift = annual.targetDec - out[BUD_P[11]].eop;
  if (Math.abs(drift) > 1) {
    out[BUD_P[11]].nb += drift;
    out[BUD_P[11]].nn += drift;
    out[BUD_P[11]].eop = annual.targetDec;
  }
  out[BUD_P[11]].check = 0;
  out._yoYPlug = drift;
  out._targetDec = annual.targetDec;
  return out;
}

function fy26DecEndingArr() {
  const r = getHistRow(`${BUDGET_YEAR - 1}-12`);
  return r && r.eop != null ? Number(r.eop) : null;
}

function fyPlanValue(plan, row) {
  if (row.mix) {
    const avg = BUD_P.reduce((s, p) => s + getMix(p)[row.mix], 0) / BUD_P.length;
    return (avg * 100).toFixed(2) + '% avg';
  }
  if (row.k === 'bop') return fmtM(BOP_LOCK);
  if (row.k === 'eop') return fmtM(plan[BUD_P[11]].eop);
  if (row.k === 'nn') return fmtM(BUD_P.reduce((s, p) => s + (plan[p].nn || 0), 0));
  if (row.pct) {
    const avg = BUD_P.reduce((s, p) => s + (plan[p][row.k] || 0), 0) / BUD_P.length;
    return fmtPct(avg);
  }
  const sum = BUD_P.reduce((s, p) => s + (plan[p][row.k] || 0), 0);
  return fmtM(row.neg ? -Math.abs(sum) : sum);
}

/**
 * Seed editable mix % so BOP × mix reproduces the canonical YoY plan dollars
 * (annual net-new allocated with hist/HC month weights — the pre-tie-out path).
 * Displayed % then matches the $ row; localhost and /app share the same seed policy.
 */
function seedMixFromHistory() {
  STATE.mixByPeriod = {};
  // 1) Hist relative component weights → annual NB/exp/… at current YoY target
  for (const p of BUD_P) getMix(p);
  const annual = computeArrAnnualTargets();
  const sales = buildSalesPlanFromDemand(annual.nb, annual.exp, annual.cont + annual.churn);
  const nbW = monthWeightsCloseByHistQuarter(BUD_P.map(p => sales.byPeriod[p].endingAes), 'nb');
  const expW = monthWeightsCloseByHistQuarter(BUD_P.map(p => sales.byPeriod[p].endingCs), 'exp');
  const otherHeads = BUD_P.map((_, i) => 1 + 0.035 * i);
  const reactW = monthWeightsCloseByHistQuarter(otherHeads, 'react');
  const contW = monthWeightsCloseByHistQuarter(otherHeads, 'cont');
  const churnW = monthWeightsCloseByHistQuarter(otherHeads, 'churn');

  // 2) Convert those monthly $ into % of beginning ARR (what the grid edits)
  let prior = BOP_LOCK;
  for (let i = 0; i < BUD_P.length; i++) {
    const p = BUD_P[i];
    const bop = prior > 0 ? prior : 1;
    const nb = annual.nb * nbW[i];
    const exp = annual.exp * expW[i];
    const react = annual.react * reactW[i];
    const cont = annual.cont * contW[i];
    const churn = annual.churn * churnW[i];
    STATE.mixByPeriod[p] = {
      nb: nb / bop,
      exp: exp / bop,
      react: react / bop,
      cont: cont / bop,
      churn: churn / bop,
    };
    prior = prior + nb + exp + react - cont - churn;
  }
}

function getIsSm(period) {
  const ts = window.SMPL_DEMO_TS_DATA || (window.SMPLOutlook && window.SMPLOutlook.tsData && window.SMPLOutlook.tsData());
  if (!ts) return null;
  for (const bucket of ['Actual', 'Forecast', 'Budget']) {
    const row = ts[bucket] && ts[bucket].is && ts[bucket].is[period];
    if (row && row.sm != null) return Number(row.sm);
  }
  return null;
}

function gtmRatesFromHist(period) {
  const arr = getHistRow(period);
  const sm = getIsSm(period);
  const nb = arr ? arr.nb : 0;
  const spend = sm ? sm * MKT_SM_RATIO : 0;
  const rates = { ...DEFAULT_GTM_RATES };
  if (nb > 0) {
    const probe = computeGtmFromNb(nb, rates, STATE.pipelineCoverageMult);
    if (probe.closedLogos > 0) rates.avgAcv = nb / probe.closedLogos;
    if (probe.mqls > 0 && spend > 0) rates.cpl = spend / probe.mqls;
  }
  return rates;
}

/** Top-down funnel to MQL demand. Spend is applied later from channel mix × CPL (see allocateGtmChannels). */
function computeGtmFromNb(nb, rates, coverageMult) {
  const avgAcv = rates.avgAcv || DEFAULT_GTM_RATES.avgAcv;
  const oppClose = rates.oppClose || DEFAULT_GTM_RATES.oppClose;
  const mqlOpp = rates.mqlOpp || DEFAULT_GTM_RATES.mqlOpp;
  const cpl = rates.cpl || DEFAULT_GTM_RATES.cpl;
  const cov = coverageMult || STATE.pipelineCoverageMult;
  const closedLogos = avgAcv > 0 ? nb / avgAcv : 0;
  const oppsToClose = oppClose > 0 ? closedLogos / oppClose : 0;
  const pipelineDollar = nb * cov;
  const pipelineOpps = avgAcv > 0 ? pipelineDollar / avgAcv : 0;
  const mqls = mqlOpp > 0 ? pipelineOpps / mqlOpp : 0;
  // Placeholder spend from blended CPL — overwritten for FY plan by channel allocation.
  const spend = mqls * cpl;
  const smTotal = MKT_SM_RATIO > 0 ? spend / MKT_SM_RATIO : spend;
  return {
    nb, closedLogos, oppsToClose, pipelineDollar, pipelineOpps, mqls, spend, smTotal,
    rates: { avgAcv, oppClose, mqlOpp, cpl },
  };
}

function getGtmHistRow(period) {
  if (STATE.gtmHistRows[period]) return STATE.gtmHistRows[period];
  const arr = getHistRow(period);
  if (!arr) return null;
  const nb = arr.nb || 0;
  const rates = gtmRatesFromHist(period);
  const row = computeGtmFromNb(nb, rates, STATE.pipelineCoverageMult);
  const sm = getIsSm(period);
  if (sm && row.mqls > 0) {
    row.spend = sm * MKT_SM_RATIO;
    row.smTotal = sm;
    row.rates = { ...row.rates, cpl: row.spend / row.mqls };
  }
  STATE.gtmHistRows[period] = row;
  return row;
}

function getGtmRates(period) {
  if (!STATE.gtmRatesByPeriod[period]) {
    const mo = period.slice(5, 7);
    STATE.gtmRatesByPeriod[period] = gtmRatesFromHist(`${BUDGET_YEAR - 1}-${mo}`);
  }
  return STATE.gtmRatesByPeriod[period];
}

function defaultGtmChannelMix() {
  const out = {};
  for (const ch of GTM_CHANNELS) out[ch.key] = ch.defaultMix;
  return out;
}

function defaultGtmChannelCpl() {
  const out = {};
  for (const ch of GTM_CHANNELS) out[ch.key] = ch.defaultCpl;
  return out;
}

function getGtmChannelMix(period) {
  if (!STATE.gtmChannelMixByPeriod) STATE.gtmChannelMixByPeriod = {};
  if (!STATE.gtmChannelMixByPeriod[period]) {
    STATE.gtmChannelMixByPeriod[period] = defaultGtmChannelMix();
  }
  const raw = STATE.gtmChannelMixByPeriod[period];
  for (const ch of GTM_CHANNELS) {
    if (raw[ch.key] == null) raw[ch.key] = ch.defaultMix;
  }
  return raw;
}

function getGtmChannelCpl(period) {
  if (!STATE.gtmChannelCplByPeriod) STATE.gtmChannelCplByPeriod = {};
  if (!STATE.gtmChannelCplByPeriod[period]) {
    STATE.gtmChannelCplByPeriod[period] = defaultGtmChannelCpl();
  }
  const raw = STATE.gtmChannelCplByPeriod[period];
  for (const ch of GTM_CHANNELS) {
    if (raw[ch.key] == null) raw[ch.key] = ch.defaultCpl;
  }
  return raw;
}

/** Normalize mix weights to sum 1; returns { weights, rawSum }. */
function normalizeGtmChannelMix(period) {
  const raw = getGtmChannelMix(period);
  let rawSum = 0;
  for (const ch of GTM_CHANNELS) rawSum += Math.max(0, Number(raw[ch.key]) || 0);
  const weights = {};
  if (rawSum <= 0) {
    for (const ch of GTM_CHANNELS) weights[ch.key] = ch.defaultMix;
    return { weights, rawSum: 0 };
  }
  for (const ch of GTM_CHANNELS) {
    weights[ch.key] = Math.max(0, Number(raw[ch.key]) || 0) / rawSum;
  }
  return { weights, rawSum };
}

/**
 * Split total program spend across channels by mix %.
 * Channel MQLs allocate funnel-required MQLs by relative spend÷CPL efficiency
 * so Total channel MQLs === MQLs required (no second conflicting absolute).
 */
function allocateGtmChannels(totalSpend, period, requiredMqls) {
  const { weights, rawSum } = normalizeGtmChannelMix(period);
  const cpls = getGtmChannelCpl(period);
  const channels = {};
  const spendTot = Math.max(0, Number(totalSpend) || 0);
  const req = Math.max(0, Number(requiredMqls) || 0);
  let rawMqlSum = 0;
  for (const ch of GTM_CHANNELS) {
    const spend = spendTot * (weights[ch.key] || 0);
    const cpl = Math.max(1, Number(cpls[ch.key]) || ch.defaultCpl);
    const mqlsRaw = cpl > 0 ? spend / cpl : 0;
    channels[ch.key] = {
      key: ch.key,
      label: ch.label,
      mix: weights[ch.key] || 0,
      mixRaw: Math.max(0, Number(getGtmChannelMix(period)[ch.key]) || 0),
      cpl,
      spend,
      mqlsRaw,
    };
    rawMqlSum += mqlsRaw;
  }
  let mqlSum = 0;
  for (const ch of GTM_CHANNELS) {
    const share = rawMqlSum > 0 ? channels[ch.key].mqlsRaw / rawMqlSum : (weights[ch.key] || 0);
    const mqls = req > 0 ? req * share : channels[ch.key].mqlsRaw;
    channels[ch.key].mqls = mqls;
    channels[ch.key].mqlShare = share;
    mqlSum += mqls;
  }
  return { channels, mqlSum, mqlsRawSum: rawMqlSum, mixRawSum: rawSum, totalSpend: spendTot };
}

function computeGtmPlan() {
  const arrPlan = computeBudgetArr();
  const out = {};
  for (const p of BUD_P) {
    const rates = getGtmRates(p);
    const row = computeGtmFromNb(arrPlan[p].nb, rates, STATE.pipelineCoverageMult);
    // Program $ = funnel MQLs × blended CPL (hist-seeded / editable).
    // Channel CPL only allocates that MQL budget across channels (efficiency share).
    const blendedCpl = Math.max(0, Number(rates.cpl) || DEFAULT_GTM_RATES.cpl);
    const totalSpend = (row.mqls || 0) * blendedCpl;
    const alloc = allocateGtmChannels(totalSpend, p, row.mqls || 0);
    row.channels = alloc.channels;
    row.channelMqls = alloc.mqlSum;
    row.channelMqlsRaw = alloc.mqlsRawSum;
    row.mixRawSum = alloc.mixRawSum;
    row.spend = alloc.totalSpend;
    row.smTotal = MKT_SM_RATIO > 0 ? row.spend / MKT_SM_RATIO : row.spend;
    row.rates = { ...row.rates, cpl: blendedCpl };
    out[p] = row;
  }
  return out;
}

function getBudgetSm(period) {
  const plan = computeGtmPlan();
  return plan[period] ? plan[period].smTotal : 0;
}

function seedGtmFromHistory() {
  STATE.gtmRatesByPeriod = {};

function seedHcComp() {
  if (!STATE.hcStartByLevel) STATE.hcStartByLevel = {};
  if (!STATE.hcCompByLevel) STATE.hcCompByLevel = {};

    if (!STATE.hcCompByLevel[d.key]) STATE.hcCompByLevel[d.key] = {};
    for (const lv of HC_LEVELS) {
      const def = defs[lv.key] || { start: 0, salary: d.avgCost, bonusPct: d.corpBonus ? 10 : 0 };
      if (STATE.hcStartByLevel[d.key][lv.key] == null) {

      }

          bonusPct: d.corpBonus ? def.bonusPct : 0,
        };
      } else {

        if (c.salary == null) c.salary = def.salary;
        if (c.bonusPct == null) c.bonusPct = d.corpBonus ? def.bonusPct : 0;
        if (!d.corpBonus) c.bonusPct = 0;
      }
    }
  }
}

function hcLevelStart(dept, level) {

function hcLevelComp(dept, level) {

    bonusPct: Math.max(0, Number(c.bonusPct) || 0),
  };
}

function hcDeptStartTotal(dept) {
  return HC_LEVELS.reduce((s, lv) => s + hcLevelStart(dept, lv.key), 0);
}

/** Allocate integer total across levels by mix weights (largest remainder). */
function allocateByMix(total, weights) {
  const keys = HC_LEVELS.map(lv => lv.key);
  const wSum = keys.reduce((s, k) => s + Math.max(0, weights[k] || 0), 0);
  const out = {};
  if (total <= 0 || wSum <= 0) {
    keys.forEach(k => { out[k] = 0; });
    return out;
  }
  const raw = keys.map(k => {
    const exact = total * (Math.max(0, weights[k] || 0) / wSum);
    return { k, floor: Math.floor(exact), frac: exact - Math.floor(exact) };
  });
  let used = raw.reduce((s, r) => s + r.floor, 0);
  raw.sort((a, b) => b.frac - a.frac);
  for (const r of raw) out[r.k] = r.floor;
  let i = 0;
  while (used < total && i < raw.length) {
    out[raw[i].k] += 1;
    used += 1;
    i += 1;
  }
  return out;
}

function seedHcOps() {

function hcOtherDepts() {

/** Precompute annual attrition exits by month for non-sales depts (from BOP × attrition %). */
function hcAttritionByMonth() {
  const cfg = activeHcCfg();
  const out = {};
  for (const d of hcOtherDepts()) {
    const pct = Math.max(0, Number(cfg.attrition[d.key]) || 0) / 100;
    const bop = hcDeptStartTotal(d.key);
    const annual = Math.ceil(bop * pct);
    out[d.key] = distributeHires(annual);

function hcWeightedAvgSalary(dept, levelHeads) {
  let heads = 0, pay = 0;
  for (const lv of HC_LEVELS) {
    const h = levelHeads[lv.key] || 0;
    const sal = hcLevelComp(dept, lv.key).salary;
    heads += h;
    pay += h * sal;
  }
  return heads > 0 ? pay / heads : (HC_DEPTS.find(d => d.key === dept) || {}).avgCost || 120000;
}

/** Remove `n` heads from dept level map by mix; returns exits by level. */
function hcTakeExitsByMix(levelHeads, n) {
  const exits = {};
  HC_LEVELS.forEach(lv => { exits[lv.key] = 0; });
  let remaining = Math.max(0, Math.round(n));
  if (remaining <= 0) return exits;
  const weights = {};
  HC_LEVELS.forEach(lv => { weights[lv.key] = levelHeads[lv.key] || 0; });
  const alloc = allocateByMix(remaining, weights);
  for (const lv of HC_LEVELS) {
    const take = Math.min(levelHeads[lv.key] || 0, alloc[lv.key] || 0);
    exits[lv.key] = take;
    levelHeads[lv.key] = Math.max(0, (levelHeads[lv.key] || 0) - take);
  }
  // If mix couldn't place all (empty levels), drain remaining from any remaining heads
  let took = HC_LEVELS.reduce((s, lv) => s + exits[lv.key], 0);
  let left = remaining - took;
  if (left > 0) {
    for (const lv of HC_LEVELS) {
      if (left <= 0) break;
      const avail = levelHeads[lv.key] || 0;
      const take = Math.min(avail, left);
      exits[lv.key] += take;
      levelHeads[lv.key] = avail - take;
      left -= take;
    }
  }
  return exits;
}
