<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMPL · Validation Engine</title>
  <style>
    :root {
      --bg: #0f1410; --bg2: #161c18; --surface: #1a221c; --border: #2e3f31;
      --text: #dde8d6; --text2: #c5d4bc; --text3: #72826a; --teal: #5fa878;
      --amber: #c48a3a; --red: #b8705f; --font: ui-sans-serif, system-ui, Segoe UI, sans-serif;
      --r: 8px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; border-bottom: 1px solid var(--border); background: var(--bg2); }
    .brand { font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
    .brand span { color: var(--text3); font-weight: 500; margin-left: 8px; }
    .topbar a { color: var(--text2); text-decoration: none; font-size: 12px; margin-left: 14px; }
    .topbar a:hover { color: var(--teal); }
    .layout { display: grid; grid-template-columns: 200px 1fr; min-height: calc(100vh - 52px); }
    .side { border-right: 1px solid var(--border); padding: 16px 10px; background: var(--bg2); }
    .side button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text2); padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; }
    .side button.active, .side button:hover { background: var(--surface); color: var(--text); }
    .main { padding: 22px 28px 48px; max-width: 960px; }
    .slide-title, .ve-panel-title { font-size: 22px; font-weight: 650; margin: 0 0 6px; }
    .slide-sub, .ve-panel-sub { font-size: 13px; color: var(--text3); margin: 0 0 18px; line-height: 1.45; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; }
    .card-title { font-size: 12px; font-weight: 650; color: var(--text3); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
    .smpl-cont-banner { border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; }
    .smpl-cont-grid { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 12px; }
    .smpl-cont-row span { color: var(--text3); }
    .smpl-cont-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .smpl-cont-chip { font-size: 10px; font-weight: 600; padding: 4px 9px; border-radius: 14px; border: 0.5px solid; }
    .smpl-cont-ok { font-size: 12px; color: var(--teal); }
    .smpl-cont-fail { margin: 6px 0; font-size: 12px; }
    .smpl-cont-fail-body { padding: 8px 4px 4px; color: var(--text2); }
    .ai-global-btn, .btn { font-size: 12px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-family: inherit; }
    .btn-primary { background: var(--teal); color: #0b120e; border-color: var(--teal); font-weight: 650; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    table.map { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.map th, table.map td { border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: left; vertical-align: middle; }
    table.map th { color: var(--text3); font-weight: 600; }
    select.map-sel { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; font-size: 12px; }
    .checklist { list-style: none; padding: 0; margin: 0; }
    .checklist li { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .check-mark { width: 18px; text-align: center; font-weight: 700; }
    .ok { color: var(--teal); } .warn { color: var(--amber); } .bad { color: var(--red); }
    .foot { margin-top: 28px; font-size: 11px; color: var(--text3); }
    input[type=text] { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 6px 8px; font-size: 12px; width: 220px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">SMPL Validation Engine<span>owner workshop · not the Board</span></div>
    <div>
      <span id="periodLabel" style="font-size:12px;color:var(--text3);margin-right:8px"></span>
      <a href="/board/">← Board (outcomes)</a>
    </div>
  </div>
  <div class="layout">
    <nav class="side" id="veNav">
      <button type="button" class="active" data-panel="status">1 · Close status</button>
      <button type="button" data-panel="ties">2 · Ties</button>
      <button type="button" data-panel="mapping">3 · Mapping</button>
      <button type="button" data-panel="align">4 · Monthly Align</button>
    </nav>
    <main class="main" id="veMain"></main>
  </div>
  <script>window.SMPL_VALIDATION_ENGINE = true; window.SMPL_OWNER_MODE = true;</script>
  <script src="/shared/smpl-provenance.js?v=5"></script>
  <script src="/shared/smpl-outlook.js"></script>
  <script src="/shared/board-continuity.js?v=2"></script>
  <script src="/shared/board-hydrate.js"></script>
  <script>
(function () {
  var period = (location.search.match(/[?&]period=(20\d{2}-\d{2})/) || [])[1] || "2026-06";
  window.CLOSE_MONTH = period;
  document.getElementById("periodLabel").textContent = "Close " + period;

  var state = { panel: "status", status: null, busy: false };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function money(n) {
    var v = Number(n) || 0;
    return "$" + Math.abs(v).toLocaleString(undefined, { maximumFractionDigits: 0 });
  }

  function loadStatus() {
    return SMPLContinuity.fetchValidationStatus({ seedDemoQueue: true }).then(function (s) {
      state.status = s || window.SMPL_VALIDATION_STATUS;
      render();
      return state.status;
    });
  }

  function renderStatus() {
    var s = state.status || {};
    var allow = s.validation_allow || {};
    var align = s.monthly_align || {};
    var ready = !!align.ready_for_board;
    return (
      '<div class="ve-panel-title">Close status</div>' +
      '<div class="ve-panel-sub">Freeze pack + last Allow. Leadership Board reads this as a one-line stamp.</div>' +
      '<div class="card"><div class="card-title">Stamps</div><div class="smpl-cont-grid">' +
      '<div class="smpl-cont-row"><span>As-of</span><strong>' + esc(s.as_of_period || period) + '</strong></div>' +
      '<div class="smpl-cont-row"><span>Freeze</span><strong>' + esc(s.freeze_status || "—") + '</strong></div>' +
      '<div class="smpl-cont-row"><span>Built</span><strong>' + esc(s.freeze_built_at || "—") + '</strong></div>' +
      '<div class="smpl-cont-row"><span>Allow</span><strong class="' + (allow.allowed ? "ok" : "warn") + '">' +
      (allow.allowed ? ("Allowed by " + esc(allow.allowed_by || "owner")) : "Not yet Allowed") +
      '</strong></div>' +
      '<div class="smpl-cont-row"><span>Mapping open</span><strong>' + esc(String(s.mapping_material_open_count || 0)) + ' material</strong></div>' +
      '<div class="smpl-cont-row"><span>Board ready</span><strong class="' + (ready ? "ok" : "warn") + '">' +
      (ready ? "Yes — outcomes stamp green" : "No — finish Align") +
      '</strong></div>' +
      '</div></div>' +
      '<p class="foot">Not SOC 2 certified. Hard ID for production actuals is import/close; this Engine is where owners verify and Allow.</p>'
    );
  }

  function renderMapping() {
    var s = state.status || {};
    var queue = s.mapping_queue || [];
    var lines = s.management_lines || [];
    var rows = queue.map(function (q) {
      var open = q.status === "open";
      var opts = lines.map(function (l) {
        return '<option value="' + esc(l) + '"' + (q.mapped_to === l ? " selected" : "") + ">" + esc(l) + "</option>";
      }).join("");
      return (
        "<tr>" +
        "<td><code>" + esc(q.account_number || q.account_id) + "</code></td>" +
        "<td>" + esc(q.name) + "</td>" +
        "<td>" + money(q.amount) + "</td>" +
        "<td>" + esc(q.status) + (q.mapped_to ? " → " + esc(q.mapped_to) : "") + "</td>" +
        "<td>" +
        (open
          ? '<select class="map-sel" data-acct="' + esc(q.account_id) + '">' + opts + "</select> " +
            '<button type="button" class="btn map-btn" data-acct="' + esc(q.account_id) + '">Map</button>'
          : "—") +
        "</td></tr>"
      );
    }).join("");
    return (
      '<div class="ve-panel-title">Mapping</div>' +
      '<div class="ve-panel-sub">New GL / dimension accounts since last Allow — map to management IS / BS / CFS / ARR before they distort statements. This is the maintenance Adaptive leaves invisible.</div>' +
      '<div class="card"><div class="card-title">Unmapped / needs review</div>' +
      (queue.length
        ? '<table class="map"><thead><tr><th>Acct</th><th>Name</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>' +
          rows +
          "</tbody></table>"
        : '<div class="smpl-cont-ok">Queue clear — no open material accounts.</div>') +
      "</div>" +
      (s.import_hard_id_blocked
        ? '<p class="bad" style="margin-top:12px;font-size:12px">Import/close hard-ID: material open items will block close lock until mapped.</p>'
        : "")
    );
  }

  function renderAlign() {
    var s = state.status || {};
    var align = s.monthly_align || {};
    var ts = SMPLContinuity.trustSummary();
    var tiesOk = ts.passed;
    var mapOk = !!align.mapping_clear;
    var allowOk = !!align.allow;
    var canAllow = tiesOk && mapOk && (s.freeze_status === "COMPLETE" || s.freeze_status === "STALE") && !allowOk;
    return (
      '<div class="ve-panel-title">Monthly Align</div>' +
      '<div class="ve-panel-sub">Owner ritual (~15–30 min): ties → mapping → deck fidelity → Allow. Board stamp turns green only after Allow.</div>' +
      '<div class="card"><ul class="checklist">' +
      '<li><span class="check-mark ' + (tiesOk ? "ok" : "bad") + '">' + (tiesOk ? "✓" : "!") + '</span><div><strong>Ties</strong><div style="color:var(--text3);font-size:12px">' +
      esc(SMPLContinuity.trustSummary && statusLabelSafe(ts)) +
      " — review Ties panel</div></div></li>" +
      '<li><span class="check-mark ' + (mapOk ? "ok" : "bad") + '">' + (mapOk ? "✓" : "!") + '</span><div><strong>Mapping queue</strong><div style="color:var(--text3);font-size:12px">' +
      (mapOk ? "Clear" : (s.mapping_material_open_count || 0) + " material open") +
      "</div></div></li>" +
      '<li><span class="check-mark ' + ((ts.fidelityIssues || 0) === 0 ? "ok" : "warn") + '">' +
      ((ts.fidelityIssues || 0) === 0 ? "✓" : "~") +
      '</span><div><strong>Deck fidelity</strong><div style="color:var(--text3);font-size:12px">Evidence Pack / post-render — soft-warn OK; review before Allow</div></div></li>' +
      '<li><span class="check-mark ' + (allowOk ? "ok" : "warn") + '">' + (allowOk ? "✓" : "○") + '</span><div><strong>Allow for Board</strong><div style="color:var(--text3);font-size:12px">' +
      (allowOk ? ("Recorded " + esc((s.validation_allow && s.validation_allow.allowed_at) || "")) : "Not recorded") +
      "</div></div></li>" +
      "</ul>" +
      '<div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      '<input type="text" id="allowBy" placeholder="Your name" value="FP&A Owner" />' +
      '<button type="button" class="btn btn-primary" id="allowBtn"' + (canAllow ? "" : " disabled") + ">Allow close for Board</button>" +
      "</div>" +
      (!canAllow && !allowOk
        ? '<p style="font-size:11px;color:var(--text3);margin-top:8px">Resolve ties + mapping + freeze COMPLETE before Allow.</p>'
        : "") +
      "</div>"
    );
  }

  function statusLabelSafe(s) {
    if (!s) return "—";
    if (s.status === "ok") return "Ties pass";
    if (s.status === "warn") return "Ties pass · advisories";
    return (s.failN || 0) + " open";
  }

  function render() {
    var main = document.getElementById("veMain");
    if (state.panel === "ties") {
      SMPLContinuity.renderTiesPanel(main);
      return;
    }
    if (state.panel === "mapping") {
      main.innerHTML = renderMapping();
      main.querySelectorAll(".map-btn").forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute("data-acct");
          var sel = main.querySelector('select.map-sel[data-acct="' + id + '"]');
          var line = sel && sel.value;
          if (!line) return;
          btn.disabled = true;
          SMPLContinuity.postMapAccount(id, line, "FP&A Owner")
            .then(function (st) {
              state.status = st;
              render();
            })
            .catch(function (err) {
              alert(String(err.message || err));
              btn.disabled = false;
            });
        };
      });
      return;
    }
    if (state.panel === "align") {
      main.innerHTML = renderAlign();
      var allowBtn = document.getElementById("allowBtn");
      if (allowBtn) {
        allowBtn.onclick = function () {
          var who = (document.getElementById("allowBy") || {}).value || "owner";
          allowBtn.disabled = true;
          SMPLContinuity.postAllow(who, "Monthly Align")
            .then(function (st) {
              state.status = st;
              render();
            })
            .catch(function (err) {
              alert(String(err.message || err));
              allowBtn.disabled = false;
            });
        };
      }
      return;
    }
    main.innerHTML = renderStatus();
  }

  document.getElementById("veNav").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-panel]");
    if (!btn) return;
    state.panel = btn.getAttribute("data-panel");
    document.querySelectorAll("#veNav button").forEach(function (b) {
      b.classList.toggle("active", b === btn);
    });
    render();
  });

  // Hydrate outlook if board hydrate is available (ties need payload).
  function boot() {
    var p = Promise.resolve();
    if (window.SMPLOutlook && typeof SMPLOutlook.resolveOrganizationId === "function") {
      p = SMPLOutlook.resolveOrganizationId().catch(function () { return null; });
    } else if (typeof window.smplHydrateBoard === "function") {
      p = Promise.resolve(window.smplHydrateBoard()).catch(function () {});
    }
    p.then(function () {
      if (window.SMPLBoardHydrate && typeof SMPLBoardHydrate === "function") {
        return SMPLBoardHydrate().catch(function () {});
      }
      if (window.hydrateBoardOutlook && typeof window.hydrateBoardOutlook === "function") {
        return window.hydrateBoardOutlook().catch(function () {});
      }
    }).then(loadStatus);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
  </script>
</body>
</html>
