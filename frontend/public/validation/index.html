<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMPL · Validation Engine</title>
  <meta http-equiv="refresh" content="0;url=/board/?view=validation" />
  <script>
    (function () {
      var q = location.search || "";
      var period = (q.match(/[?&]period=(20\d{2}-\d{2})/) || [])[1];
      var dest = "/board/?view=validation";
      if (period) dest += "&period=" + encodeURIComponent(period);
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>Validation Engine lives on the Board. <a href="/board/?view=validation">Continue →</a></p>
</body>
</html>
