<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMPL · We make finance simple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#F4F3EF; --bg2:#fff; --surface:#fff; --border:#D9D6CE;
      --text:#16181A; --text2:#3d4348; --text3:#5F6469; --teal:#0E5A5F;
      --accent:#0E5A5F; --red:#b42318; --amber:#8a5a12;
      --tint:#E7EEF0; --on-accent:#fff; --radius:6px;
      --font:'Inter', -apple-system, 'Segoe UI', sans-serif; --r:8px; --r2:10px; --mono:ui-monospace,monospace;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--font); background:var(--bg); color:var(--text); }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:13px 24px; border-bottom:0.5px solid var(--border); background:var(--bg); position:sticky; top:0; z-index:30; min-width:0; width:100%; }
    .logo { font-family:var(--font); font-size:16px; font-weight:600; letter-spacing:-0.4px; color:var(--text); }
    .logo span { color:var(--text3); font-weight:300; font-size:13px; }
    .topbar-right { display:flex; align-items:center; gap:10px; }
    .period-badge { font-size:11px; color:var(--text2); background:var(--bg); padding:4px 12px; border-radius:20px; border:0.5px solid var(--border); }
    .skin-select { font:inherit; font-size:11px; font-weight:500; padding:5px 10px; border:0.5px solid var(--border); border-radius:20px; background:var(--bg); color:var(--text2); cursor:pointer; outline:none; }
    .skin-select:hover { color:var(--text); }
    .smpl-validated-stamp { font-size:11px; padding:5px 12px; border:0.5px solid var(--border); border-radius:20px; background:none; cursor:pointer; color:var(--text2); display:flex; align-items:center; gap:7px; text-decoration:none; }
    .smpl-trust-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .smpl-trust-meta { color:var(--text3); font-weight:400; }
    .close-period { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text2); }
    .close-period select { font:inherit; font-size:12px; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:4px 10px; height:32px; }
    main { padding:22px 28px 64px; max-width:1760px; }
    .slide-title { font-size:22px; font-weight:650; margin:0 0 6px; }
    .slide-sub { font-size:13px; color:var(--text3); margin:0 0 16px; line-height:1.45; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; }
    .card-title { font-size:12px; font-weight:650; color:var(--text3); text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px; }
    .subnav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .snav-btn { font-size:12px; padding:6px 10px; border-radius:16px; border:1px solid var(--border); background:transparent; color:var(--text2); cursor:pointer; font-family:inherit; }
    .snav-btn.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
    .ve-checklist { list-style:none; padding:0; margin:0; }
    .ve-checklist li { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
    .ve-check { width:18px; font-weight:700; }
    .ve-ok { color:var(--teal); } .ve-bad { color:var(--red); } .ve-warn { color:var(--amber); }
    .ve-check-meta, .ve-foot { color:var(--text3); font-size:12px; }
    .ai-global-btn, .ve-allow-btn { font-size:12px; padding:7px 12px; border-radius:6px; border:1px solid var(--teal); background:var(--teal); color:#fff; font-weight:650; cursor:pointer; }
    .ai-global-btn:disabled { opacity:.45; cursor:not-allowed; }
    .ve-allow-by, .ve-map-sel { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 8px; }
    table.ve-map { width:100%; border-collapse:collapse; font-size:12px; }
    table.ve-map th, table.ve-map td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
    h2 { font-size:15px; margin:28px 0 8px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">SMPL <span>· We make finance simple</span></div>
    <div class="topbar-right">
      <span class="period-badge" id="warehouseStatus">Loading warehouse…</span>
      <span class="period-badge" id="periodBadge">Prelim</span>
      <select class="skin-select" id="skinSelect" aria-label="Design skin" onchange="if(window.SMPLSkin)SMPLSkin.apply(this.value)"></select>
    </div>
  </div>
  <main>
    <div id="story">
      <div style="padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text)">Loading the books for this close.</div>
    </div>
  </main>
  <script>window.SMPL_REPORTING_ENGINE = true; window.SMPL_OWNER_MODE = true; window.SMPL_SUPPRESS_LIVE_COVER = true;</script>
  <script src="/shared/smpl-skin.js?v=8"></script>
  <script src="/shared/smpl-outlook.js?v=34"></script>
  <script src="/shared/smpl-provenance.js?v=6"></script>
  <script src="/shared/board-continuity.js?v=25"></script>
  <script src="/shared/source-trace.js?v=3"></script>
  <script src="/shared/board-commentary.js?v=68"></script>
  <script src="/shared/board-hydrate.js?v=47"></script>
  <script>
    if (window.SMPLSkin) window.SMPLSkin.init("skinSelect");
    function closeLabel(period) {
      var names = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      var month = parseInt(String(period).slice(5), 10);
      return (names[month - 1] || period) + " " + String(period).slice(0, 4);
    }
    function fillCloseSelect() {
      var sel = document.getElementById("closePeriod");
      var meta = window.SMPL_OUTLOOK_PAYLOAD && window.SMPL_OUTLOOK_PAYLOAD.meta;
      if (!sel || !meta || !meta.close_month) return;
      var periods = meta.close_periods && meta.close_periods.length ? meta.close_periods.slice() : [meta.close_month];
      if (periods.indexOf(meta.close_month) < 0) periods.push(meta.close_month);
      var markup = periods.map(function (period) {
        return '<option value="' + period + '">' + closeLabel(period) + "</option>";
      }).join("");
      if (sel.getAttribute("data-options") !== markup) {
        sel.innerHTML = markup;
        sel.setAttribute("data-options", markup);
      }
      sel.value = meta.close_month;
    }
    window.fillReportingClose = fillCloseSelect;
    function showLoading(period) {
      var story = document.getElementById("story");
      if (!story) return;
      var text = period ? "Loading the " + period + " books." : "Loading the books for this close.";
      story.innerHTML =
        '<div style="padding:14px 16px;border:1px solid #D9D6CE;border-radius:8px;background:#fff;color:#16181A">' +
        String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;") +
        "</div>";
    }
    function paintReporting() {
      var story = document.getElementById("story");
      fillCloseSelect();
      if (!story || !window.boardMountStatementStory) return false;
      boardMountStatementStory(story, { mode: "grid" });
      var badge = document.getElementById("periodBadge");
      if (badge && window.SMPLContinuity && SMPLContinuity.publicationLabel) {
        badge.textContent = SMPLContinuity.publicationLabel() || "Prelim";
      }
      return !!story.querySelector("[data-testid=variance-grid], table");
    }
    function waitNote() {
      var story = document.getElementById("story");
      if (!story || story.querySelector("[data-testid=variance-grid], table")) return;
      var close = window.CLOSE_MONTH || window.SMPL_CLOSE_MONTH;
      var text = close
        ? "Loading the " + close + " books."
        : "Loading the books for this close.";
      if (window.SMPL_LIVE_FAILED && window.SMPL_LIVE_DETAIL) {
        text = "The request for this close did not finish. " + window.SMPL_LIVE_DETAIL;
      }
      story.innerHTML =
        '<div style="padding:14px 16px;border:1px solid #D9D6CE;border-radius:8px;background:#fff;color:#16181A">' +
        text.replace(/&/g, "&amp;").replace(/</g, "&lt;") +
        "</div>";
    }
    window.addEventListener("smpl-outlook-ready", function () {
      paintReporting();
    });
    document.addEventListener("change", function (event) {
      if (!event.target || event.target.id !== "closePeriod") return;
      var period = event.target.value;
      if (!period || period === window.CLOSE_MONTH) return;
      window.SMPL_REPORTING_AS_OF = period;
      showLoading(period);
      if (window.SMPLBoardLive && window.SMPLBoardLive.hydrate) window.SMPLBoardLive.hydrate();
    });
    window.addEventListener("load", function () {
      var retried = false;
      var timer = setInterval(function () {
        if (paintReporting()) {
          clearInterval(timer);
          return;
        }
        var payload = window.SMPL_OUTLOOK_PAYLOAD;
        if (payload && payload.TS_DATA) return;
        if (window.SMPL_LIVE_FAILED && !retried && window.SMPLBoardLive && window.SMPLBoardLive.hydrate) {
          retried = true;
          window.SMPL_LIVE_FAILED = false;
          waitNote();
          window.SMPLBoardLive.hydrate();
          return;
        }
        waitNote();
      }, 400);
    });
  </script>
</body>
</html>
