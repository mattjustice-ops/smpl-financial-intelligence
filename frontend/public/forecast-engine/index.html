    : `<span style="font-size:12px;color:var(--text3)">Generate scenarios to pick a year and draw it on the corridor.</span>`;

  const cashHz = window._fcPaCashHorizon === 'fy' ? 'fy' : 'fc';
  const fcLbl = (typeof FC_START_LABEL !== 'undefined' && FC_START_LABEL) ? FC_START_LABEL : 'Jul';
  const closeLbl = (typeof CLOSE_MO_LABEL !== 'undefined' && CLOSE_MO_LABEL) ? CLOSE_MO_LABEL : 'Jun';
  const planDecM = ((Number(packet.endCash) || 0) / 1e6).toFixed(1);
  const cashSrc = packet.cashSrc || ((packet.endCfsSrc) || 'plan');
  const corrSub = modeKey === 'tech'
    ? (cashHz === 'fc'
      ? `Open months ${fcLbl}–Dec only (actuals through ${closeLbl}). Plan Dec $${planDecM}M (${cashSrc}). Fan = MC P10–P90 on open-month cash flows (not a flat stock scale). Rails = −25% / −50% / floor ${fcFloorTxt(packet)}.`
      : `Full-year path. Plan Dec $${planDecM}M (${cashSrc}). Fan = MC P10–P90 on open-month cash flows. Rails = −25% / −50% / floor ${fcFloorTxt(packet)}.`)
    : (cashHz === 'fc'
      ? `Looking at ${fcLbl}–Dec only — actuals already closed. Plan finishes Dec at $${planDecM}M. The green band is how far draws usually land around that plan (same grammar as Budget). Amber / red dashes are 25% and 50% below plan; solid red is the cash floor.`
      : `Full year shown. Plan finishes Dec at $${planDecM}M. Fan opens on open months; closed months stay near the plan. Amber / red dashes are 25% and 50% below plan; solid red is the cash floor.`);

  const srcNote = window._forecastMcSource === 'client_packet_fallback'
    ? 'Local MC (server /simulate unavailable)'
    : (window._forecastMcSource || 'packet');

  return `
    <div class="pa-verdict">
      <span class="pa-dot ${verdict.tone || 'watch'}"></span>
      <div>
        <p class="pa-big">${fcEsc(verdict.big)}</p>
        <p class="pa-small">${fcEsc(verdict.small)}</p>
      </div>
    </div>
    ${mc ? `<div class="pa-banner"><strong>${fcEsc(srcNote)}</strong> · MC n=${(mc.n || 0).toLocaleString()}` +
      `${mc.seed != null ? ` · seed ${mc.seed}` : ''} · last run ${window._forecastMcAt ? new Date(window._forecastMcAt).toLocaleTimeString() : '—'}</div>` : ''}
    ${readoutHtml}
    ${banner}

    ${renderFcBookAtRiskHtml(packet)}

    <div class="pa-section pa-h1" style="margin-top:8px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div>
          <h3 class="pa-section-hd">${modeKey === 'tech'
            ? (cashHz === 'fc' ? 'Open-month cash corridor — plan vs draw' : 'FY Dec cash corridor — plan vs draw distribution')
            : (cashHz === 'fc' ? 'Cash for the rest of the year' : 'Cash through the year')}</h3>
          <p class="pa-section-sub">${corrSub}</p>
        </div>
        <div class="pa-toggle" role="group" aria-label="Cash corridor horizon">
          <button type="button" aria-pressed="${cashHz === 'fc'}" onclick="setFcPaCashHorizon('fc')">Open months</button>
          <button type="button" aria-pressed="${cashHz === 'fy'}" onclick="setFcPaCashHorizon('fy')">Full year</button>
        </div>
      </div>
      <div class="pa-corridor-card">
        <div class="pa-corridor-legend">
          <span><i class="pa-sw"></i>Plan</span>
          ${(() => {
            const fb = fcResolveCorridorBands(packet, suite);
            return (fb.p25 ? '<span><i class="pa-sw band" style="opacity:.9"></i>P25–P75 of draws</span>' : '')
              + (fb.p10 ? '<span><i class="pa-sw band" style="opacity:.45"></i>P10–P90 of draws</span>' : '');
          })()}
          <span><i class="pa-sw watch"></i>25% below plan</span>
          <span><i class="pa-sw alarm"></i>50% below plan</span>
          <span><i class="pa-sw floor"></i>Cash floor</span>
        </div>
        ${renderFcPredictiveCorridor(packet, suite, window._fcPaCaseSel)}
        <div class="pa-chips" id="fcPaCaseChips">${chipHtml}</div>
        <div class="pa-callout" id="fcPaCaseCallout">Pick a scenario below to see how that year would have gone.</div>
      </div>
    </div>

    <div class="pa-section pa-h1" style="margin-top:22px">
      <h3 class="pa-section-hd">${modeKey === 'tech' ? 'Named stress cases' : 'What happens if…'}</h3>
      <p class="pa-section-sub">${modeKey === 'tech'
        ? 'Packet-field shocks ranked worst → best. Break ≥$2.5M · watch ≥$1M / ≥3% cash · else hold — on ARR / Dec cash / FY EBITDA.'
        : 'Cases ranked worst → best. Red ≥$2.5M, amber ≥$1M (or ≥3% cash), green under that — on ARR, Dec cash, and EBITDA.'}</p>
      ${renderFcScenarioTable(suite)}
    </div>

    <div class="pa-section pa-h1" style="margin-top:22px">
      <h3 class="pa-section-hd">${modeKey === 'tech' ? 'Lever sensitivity — Δ Dec cash' : 'Which levers actually move the year'}</h3>
      <p class="pa-section-sub">${modeKey === 'tech'
        ? 'Ranked from named shocks; left downside, right measured upside (— where none was run).'
        : 'Each row is a named stress. Left is how much cash we lose. Right is cash gained, only where a case raised it.'}</p>
      ${renderFcLeverLedger(suite, modeKey)}
    </div>

    <div class="pa-section pa-h1" style="margin-top:22px">
      <h3 class="pa-section-hd">${modeKey === 'tech' ? 'Trip-wires and decision windows' : 'What to watch, and when to act'}</h3>
      <p class="pa-section-sub">A threshold is only useful if we know when we would see it and how long we have to do something.</p>
      ${renderFcPaTrips(packet, modeKey)}
    </div>

    <div class="pa-section pa-h1" style="margin-top:22px">
      <h3 class="pa-section-hd">${modeKey === 'tech' ? 'Offsetting actions' : 'If a trip-wire fires, here is what buys the year back'}</h3>
      <p class="pa-section-sub">Levers that give cash back, scaled to this forecast’s cushion.</p>

    <div class="pa-section pa-h1" style="margin-top:22px">
      <h3 class="pa-section-hd">${modeKey === 'tech' ? 'Commentary' : 'The read'}</h3>

  `;
}


async function refreshForecastScenarios(useLlm){
  const setProg = (msg, pct) => {
    const el = document.getElementById('fcAssureScenarioProg');
    if (!el) return;
    el.hidden = false;
    el.innerHTML = `${String(msg || '').replace(/</g, '&lt;')}${
      pct != null ? `<span class="bar"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></span>` : ''
    }`;
  };
  const paintAnalytics = () => {
    if (curTab === 'analytics') {
      const area = document.getElementById('slideArea');
      if (area) renderAnalytics(area);
    }
  };
  try {
    window._forecastScenarioRunning = { msg: 'Starting named stress cases…', pct: 5 };
    paintAnalytics();
    const suite = await runFcScenarioStressSuite({
      monteCarlo: true,
      mcN: 1000,
      onProgress: (phase, done, total) => {
        if (phase === 'cases') {
          const pct = 5 + (done / Math.max(1, total)) * 35;
          window._forecastScenarioRunning = { msg: `Named stress cases ${done}/${total}…`, pct };
          setProg(`Named stress cases ${done}/${total}…`, pct);
        } else if (phase === 'mc') {
          const pct = 40 + (done / Math.max(1, total)) * 45;
          window._forecastScenarioRunning = { msg: `Monte Carlo ${done}/${total}…`, pct };
          setProg(`Monte Carlo ${done.toLocaleString()} / ${total.toLocaleString()}…`, pct);
        }
      },
    });
    let textNarr = suite.narrative;
    if (useLlm) {
      setProg('Drafting commentary from stress packet…', 92);
      const allow = buildFcAssuranceEvidenceAllowlist({
        soT: textNarr,
        packet: buildFcAssurancePacket(),
        mc: suite.mc,
        lane: 'predictive',
      });
      // include case money moves
      (suite.cases || []).forEach(c => {
        [c.dArr, c.dCash, c.dEbitda, c.decArr, c.endCash].forEach(v => {
          if (typeof fcAssurePushMoney === 'function') fcAssurePushMoney(allow.money, v);
        });
      });
      textNarr = await resolveFcAssuranceGenerate(
        textNarr,
        allow,
        (buildFcAssurancePacket().period_label || 'Forecast') + ' scenarios'
      );
      suite.narrative = textNarr;
      window._forecastScenarioNarrative = textNarr;
    }
    window._forecastScenarioRunning = null;
    window._forecastMcAt = Date.now();
    paintAnalytics();
    try {
      const sim = fcSimulationSummaryFromMc(suite.mc);
      await ensureForecastAssessment({ render: false, simulation: sim });
    } catch (e) {
      console.warn('[forecast-assurance] post-suite assess skipped', e && e.message);
    }
    paintAnalytics();
    return suite;
  } catch (e) {
    console.warn('[forecast-assurance] scenarios', e);
    window._forecastScenarioRunning = null;
    setProg('Scenario run failed: ' + String(e.message || e), null);
    paintAnalytics();
    return null;
  }
}
window.refreshForecastScenarios = refreshForecastScenarios;


function fcSumSeries(arr) {
  let s = 0, n = 0;
  for (const v of arr || []) {
    if (v != null && !isNaN(v)) { s += v; n += 1; }
  }
  return n ? s : null;
}

function fcYoyPct(curr, prior) {
  if (prior == null || prior === 0 || curr == null) return null;
  return (curr - prior) / Math.abs(prior);
}

/**
 * Outlier review: actuals-through-close vs open-month forecast pace + Dec vs base plan.
 * Forecast-surface framing — not Budget prior-year vs plan.
 */
function runFcHistoryOutlierReview(h1, h2, fy, deltas, plan) {
  const findings = [];
  const pp = (r) => r == null ? '—' : `${(r * 100).toFixed(1)}%`;
  let inLine = 0;
  const push = (f) => findings.push(f);
  const noteInLine = () => { inLine += 1; };

  const paceChecks = [
    { id: 'nn', label: 'Net new ARR', h1: h1.nn, h2: h2.nn, d: deltas.nnH2vsH1, highPp: 40, medPp: 20 },
    { id: 'rev', label: 'Revenue', h1: h1.rev, h2: h2.rev, d: deltas.revH2vsH1, highPp: 35, medPp: 18 },
    { id: 'ebitda', label: 'EBITDA', h1: h1.ebitda, h2: h2.ebitda, d: deltas.ebitdaH2vsH1, highPp: 50, medPp: 25 },
    { id: 'mkt', label: 'Marketing spend', h1: h1.mkt, h2: h2.mkt, d: deltas.mktH2vsH1, highPp: 40, medPp: 20 },
    { id: 'nb', label: 'New Business ARR', h1: h1.nb, h2: h2.nb, d: deltas.nbH2vsH1, highPp: 45, medPp: 22 },
  ];
  paceChecks.forEach(m => {
    if (m.d == null || m.h1 == null) return;
    const stepPp = m.d * 100;
    const abs = Math.abs(stepPp);
    if (abs >= m.highPp) {
      push({
        id: `pace_${m.id}`,
        severity: abs >= m.highPp + 15 ? 'high' : 'medium',
        title: `${m.label}: H2 forecast pace ${stepPp > 0 ? 'accelerates' : 'decelerates'} vs H1 actuals`,
        detail: `H2 ${fM(m.h2, 1)} vs H1 ${fM(m.h1, 1)} (${stepPp > 0 ? '+' : ''}${stepPp.toFixed(1)}pp).`,
        citation: `H1 actuals through close · H2 open-month forecast · ${m.label}`,
        lens: 'intra_year',
      });
    } else if (abs >= m.medPp) {
      push({
        id: `pace_tilt_${m.id}`,
        severity: 'info',
        title: `${m.label}: mild H1→H2 pace shift`,
        detail: `H2 vs H1 ${pp(m.d)}.`,
        citation: `Intra-year · ${m.label}`,
        lens: 'intra_year',
      });
    } else {
      noteInLine();
    }
  });

  if (deltas.arrVsPlan != null) {
    const gapPp = deltas.arrVsPlan * 100;
    const abs = Math.abs(gapPp);
    if (abs >= 3) {
      push({
        id: 'dec_vs_base',
        severity: abs >= 6 ? 'high' : 'medium',
        title: gapPp < 0
          ? 'Dec ARR path short of base plan'
          : 'Dec ARR path above base plan',
        detail: `Forecast Dec ${fM(fy.decArr, 1)} vs base ${fM(fy.targetArr, 1)} (${gapPp > 0 ? '+' : ''}${gapPp.toFixed(1)}%).`,
        citation: 'Forecast Dec EOP vs Plan Summary base-plan line',
        lens: 'vs_plan',
      });
    } else {
      noteInLine();
    }
  }

  if (deltas.arrFromClose != null) {
    const g = deltas.arrFromClose * 100;
    if (Math.abs(g) >= 12) {
      push({
        id: 'close_to_dec',
        severity: Math.abs(g) >= 18 ? 'high' : 'medium',
        title: `Close→Dec ARR move ${g > 0 ? 'steep' : 'compressed'}`,
        detail: `${fM(h1.endArr, 1)} at close → Dec ${fM(fy.decArr, 1)} (${g > 0 ? '+' : ''}${g.toFixed(1)}%).`,
        citation: 'Ending ARR at close vs Dec forecast',
        lens: 'intra_year',
      });
    } else {
      noteInLine();
    }
  }

  if (plan.minCash != null && plan.cashFloor != null && plan.minCash < plan.cashFloor) {
    push({
      id: 'hist_cash_floor',
      severity: 'high',
      title: 'Cash trough below floor on linked path',
      detail: `Min ${fM(plan.minCash, 1)} in ${plan.minCashPeriod || '—'} vs floor ${fM(plan.cashFloor, 1)}.`,
      citation: 'Display CFS ending cash · Plan Assurance floor',
      lens: 'cross_metric',
    });
  } else {
    noteInLine();
  }

  if (deltas.mktH2vsH1 != null && deltas.nnH2vsH1 != null && deltas.mktH2vsH1 > deltas.nnH2vsH1 + 0.20) {
    push({
      id: 'cross_mkt_nn',
      severity: 'medium',
      title: 'Marketing H2 pace outruns net-new ARR',
      detail: `Mkt H2vsH1 ${pp(deltas.mktH2vsH1)} vs net-new ${pp(deltas.nnH2vsH1)}.`,
      citation: 'Program spend vs ARR net new · H1/H2',
      lens: 'cross_metric',
    });
  }

  if (plan.pipelineCoverage != null && plan.pipelineMin != null && plan.pipelineCoverage + 1e-9 < plan.pipelineMin) {
    push({
      id: 'hist_pipe',
      severity: 'medium',
      title: 'Pipeline / NB coverage thin vs min',
      detail: `${Number(plan.pipelineCoverage).toFixed(1)}× vs min ${Number(plan.pipelineMin).toFixed(1)}×.`,
      citation: 'GTM horizon · Pipeline $ / NB ARR',
      lens: 'cross_metric',
    });
  } else if (plan.pipelineCoverage != null) {
    noteInLine();
  }

  push({
    id: 'fc_review_basis',
    severity: 'info',
    title: 'Review basis',
    detail: `Scanned H1 actuals through ${h1.label.replace(/^Actuals through /, '')} vs H2 forecast pace, Dec path vs base plan, cash floor, and pipeline cover. This is actuals↔forecast shape — not prior-year vs next-year plan.`,
    citation: 'runFcHistoryOutlierReview · buildFcAssuranceHistoryPacket',
    lens: 'meta',
  });

  if (inLine > 0) {
    push({
      id: 'in_line_summary',
      severity: 'ok',
      title: `${inLine} checks in line with history / intra-year shape`,
      detail: 'Suppressed from the list above — no material outlier vs thresholds.',
      citation: 'Outlier thresholds in runFcHistoryOutlierReview',
      lens: 'meta',
    });
  }

  const rank = { high: 0, medium: 1, info: 2, low: 3, ok: 4 };
  findings.sort((a, b) => (rank[a.severity] ?? 9) - (rank[b.severity] ?? 9));
  return findings;
}

function buildFcAssuranceHistoryPacket(planPacket) {
  const plan = planPacket || buildFcAssurancePacket();
  const close = getCloseMonth();
  const closeLbl = typeof getCloseMoLabel === 'function' ? getCloseMoLabel() : CLOSE_MO_LABEL;
  const actN = ACT_P.length;

  if (typeof ensureFcGtmState === 'function') {
    try { ensureFcGtmState(); } catch (e) { /* optional */ }
  }

  const nn = ALL_P.map(p => fcArrComponent(p, 'nn'));
  const nb = ALL_P.map(p => fcArrComponent(p, 'nb'));
  const rev = ALL_P.map(p => Number((getDisplayIS(p) || {}).revenue) || 0);
  const ebitda = ALL_P.map(p => Number((getDisplayIS(p) || {}).ebitda) || 0);
  const mkt = ALL_P.map(p => {
    try {
      if (typeof fcGtmAllocate === 'function') return Number(fcGtmAllocate(p).spendTot) || 0;
    } catch (e) { /* optional */ }
    return 0;
  });
  const cash = ALL_P.map(p => {
    const cfs = getDisplayCFS(p) || {};
    return cfs.end_cash != null ? Number(cfs.end_cash) : null;
  });
  const eop = ALL_P.map(p => {
    const a = getForecastARR(p);
    return a && a.arr_eop != null ? Number(a.arr_eop) : null;
  });

  const h1 = {
    label: `Actuals through ${closeLbl}`,
    source: `Locked actuals · Jan–${closeLbl}`,
    nn: fcSumSeries(nn.slice(0, actN)),
    nb: fcSumSeries(nb.slice(0, actN)),
    rev: fcSumSeries(rev.slice(0, actN)),
    ebitda: fcSumSeries(ebitda.slice(0, actN)),
    mkt: fcSumSeries(mkt.slice(0, actN)),
    endArr: eop[actN - 1],
    endCash: cash[actN - 1],
  };
  const h2 = {
    label: `Forecast ${FC_START_LABEL}–Dec`,
    source: 'Open-month forecast path',
    nn: fcSumSeries(nn.slice(actN)),
    nb: fcSumSeries(nb.slice(actN)),
    rev: fcSumSeries(rev.slice(actN)),
    ebitda: fcSumSeries(ebitda.slice(actN)),
    mkt: fcSumSeries(mkt.slice(actN)),
    endArr: plan.decArr,
    endCash: plan.endCash,
  };
  const fy = {
    label: plan.period_label,
    source: 'Actual + Forecast linked path',
    decArr: plan.decArr,
    fyNn: plan.fyNn,
    fyNb: plan.fyNb,
    fyRev: plan.fyRev,
    fyEbitda: plan.fyEbitda,
    fyMkt: plan.fyMkt,
    decCash: plan.endCash,
    targetArr: plan.targetArr,
  };
  const deltas = {
    nnH2vsH1: fcYoyPct(h2.nn, h1.nn),
    nbH2vsH1: fcYoyPct(h2.nb, h1.nb),
    revH2vsH1: fcYoyPct(h2.rev, h1.rev),
    ebitdaH2vsH1: fcYoyPct(h2.ebitda, h1.ebitda),
    mktH2vsH1: fcYoyPct(h2.mkt, h1.mkt),
    arrVsPlan: fcYoyPct(plan.decArr, plan.targetArr),
    arrFromClose: fcYoyPct(plan.decArr, h1.endArr),
  };
  const findings = runFcHistoryOutlierReview(h1, h2, fy, deltas, plan);
  return { closeMonth: close, closeLbl, h1, h2, fy, deltas, findings, plan };
}

function buildDeterministicFcHistoryNarrative(hist) {
  const h = hist || buildFcAssuranceHistoryPacket();
  const d = h.deltas;
  const pp = (r) => r == null ? '—' : `${(r * 100).toFixed(1)}%`;
  const lines = [];
  lines.push(
    `Outlier review vs locked actuals (${h.h1.source}): close ending ARR ${fM(h.h1.endArr, 1)} → Dec forecast ${fM(h.fy.decArr, 1)} (${pp(d.arrFromClose)}), ` +
    `H1 net new ${fM(h.h1.nn, 1)} → H2 ${fM(h.h2.nn, 1)} (${pp(d.nnH2vsH1)}), revenue ${fM(h.h1.rev, 1)} → ${fM(h.h2.rev, 1)} (${pp(d.revH2vsH1)}).`,
  );
  lines.push(
    `Base plan Dec ${fM(h.fy.targetArr, 1)} vs forecast path ${fM(h.fy.decArr, 1)} (${pp(d.arrVsPlan)}). ` +
    `Cash at close ${fM(h.h1.endCash, 1)} → Dec ${fM(h.fy.decCash, 1)}; H1 EBITDA ${fM(h.h1.ebitda, 1)} → H2 ${fM(h.h2.ebitda, 1)}; ` +
    `marketing ${fM(h.h1.mkt, 1)} → ${fM(h.h2.mkt, 1)}. This is actuals-through-close vs open-month forecast — not prior year vs next-year plan.`,
  );
  const flags = (h.findings || []).filter(f => f.severity === 'high' || f.severity === 'medium');
  const infos = (h.findings || []).filter(f => f.severity === 'info' && f.lens !== 'meta');
  if (flags.length) {
    lines.push(`Review items (${flags.length}): ${flags.map(f => f.title).join('; ')}.`);
  } else {
    lines.push('No high/medium outliers vs actuals / forecast shape thresholds.');
  }
  if (infos.length) {
    lines.push(`${infos.length} milder notes (pace / ratio) also listed for optional review.`);
  }
  return lines.join('\n\n');
}

function buildDeterministicFcAssuranceNarrative(packet, risks) {

    `${p.period_label} targets Dec ARR ${fM(p.targetArr, 1)} from Jan BOP ${fM(p.bopArr, 1)}` +

    `reactivation ${fM(p.fyReact || 0, 1)}, contraction ${fM(p.fyCont || 0, 1)}, ` +
    `churn ${fM(p.fyChurn || 0, 1)}` +
    (p.avgGrr != null ? `; avg GRR ${(p.avgGrr * 100).toFixed(1)}%` : '') +
    (p.minGrr != null ? ` (min month ${(p.minGrr * 100).toFixed(1)}%)` : '') +
    '.',
  );
  const cover = p.pipelineCoverage != null ? Number(p.pipelineCoverage).toFixed(1) + '×' : '—';
  const mktBit = p.fyMkt != null
    ? `GTM sizes ${p.fyMql != null ? Math.round(p.fyMql).toLocaleString() : '—'} MQLs on ${fM(p.fyMkt, 1)} program spend at ${cover} pipeline cover. `

    ? `HC ${p.janHc != null ? Math.round(p.janHc) : '—'} → ${p.decHc != null ? Math.round(p.decHc) : '—'}. `
    : '';
  lines.push(
    mktBit + hcBit +
    `Dec ending cash ${fM(p.endCash, 1)} vs floor ${fcFloorTxt(p)} (liquidity cushion, not collections)` +
    (p.minCash != null ? `; trough ${fM(p.minCash, 1)}${p.minCashPeriod ? ' in ' + p.minCashPeriod : ''}` : '') +

  } else {

  return lines.join('\n\n');

const FC_ASSURE_TOL_MONEY = 1.0;
const FC_ASSURE_TOL_RATIO = 0.0005;
const FC_ASSURE_TOL_PP = 0.05;

function fcAssurePushMoney(list, v) {
  const n = Number(v);
  if (v == null || isNaN(n)) return;
  list.push(n);
  list.push(Math.abs(n));
}

function fcAssurePushPct(list, v) {
  const n = Number(v);
  if (v == null || isNaN(n)) return;
  if (Math.abs(n) <= 1.5) {
    list.push(n * 100);
    list.push(n);
  } else {
    list.push(n);
    list.push(n / 100);
  }
}

function buildFcAssuranceEvidenceAllowlist(opts) {
  const money = [];
  const pct = [];
  const mult = [];
  const soT = String(opts.soT || '');
  const lane = opts.lane || 'status';
  const packet = opts.packet || null;
  const hist = opts.hist || null;
  const mc = opts.mc || null;

  const addFromText = (text) => {
    const reMoney = /\$?\s*(-?\d{1,3}(?:,\d{3})*(?:\.\d+)?|\d+(?:\.\d+)?)\s*([KkMmBb])?\b/g;
    let m;
    while ((m = reMoney.exec(text))) {
      let v = parseFloat(String(m[1]).replace(/,/g, ''));
      if (isNaN(v)) continue;
      const u = (m[2] || '').toUpperCase();
      if (u === 'K') v *= 1e3;
      else if (u === 'M') v *= 1e6;
      else if (u === 'B') v *= 1e9;
      fcAssurePushMoney(money, v);
    }
    const rePct = /(-?\d+(?:\.\d+)?)\s*%/g;
    while ((m = rePct.exec(text))) fcAssurePushPct(pct, parseFloat(m[1]));
    const reNx = /(-?\d+(?:\.\d+)?)\s*[×xX]\b/g;
    while ((m = reNx.exec(text))) {
      const v = parseFloat(m[1]);
      if (!isNaN(v)) mult.push(v);
    }
  };

  addFromText(soT);

  if (packet) {
    [
      packet.bopArr, packet.decArr, packet.targetArr, packet.fyNn, packet.fyNb, packet.fyExp,
      packet.fyReact, packet.fyCont, packet.fyChurn, packet.fyRev, packet.fyEbitda, packet.endCash,
      packet.cashFloor, packet.fyMkt, packet.minCash,
    ].forEach(v => fcAssurePushMoney(money, v));
    fcAssurePushPct(pct, packet.yoyGrowthPct);
    fcAssurePushPct(pct, packet.avgGrr != null ? packet.avgGrr * 100 : null);
    fcAssurePushPct(pct, packet.minGrr != null ? packet.minGrr * 100 : null);
    if (packet.pipelineCoverage != null) mult.push(Number(packet.pipelineCoverage));
    money.push(packet.fyMql, packet.salesEnd, packet.csEnd, packet.janHc, packet.decHc);
  }

  if (hist) {
    [
      hist.h1 && hist.h1.endArr, hist.h1 && hist.h1.nn, hist.h1 && hist.h1.rev, hist.h1 && hist.h1.ebitda,
      hist.h1 && hist.h1.mkt, hist.h1 && hist.h1.endCash,
      hist.h2 && hist.h2.nn, hist.h2 && hist.h2.rev, hist.h2 && hist.h2.ebitda, hist.h2 && hist.h2.mkt,
      hist.fy && hist.fy.decArr, hist.fy && hist.fy.targetArr, hist.fy && hist.fy.decCash,
    ].forEach(v => fcAssurePushMoney(money, v));
    if (hist.deltas) {
      Object.keys(hist.deltas).forEach(k => {
        fcAssurePushPct(pct, hist.deltas[k] != null ? hist.deltas[k] * 100 : null);
      });
    }
  }

  if (mc) {
    fcAssurePushPct(pct, mc.p_arr_miss != null ? mc.p_arr_miss * 100 : null);
    fcAssurePushPct(pct, mc.p_cash_below_floor != null ? mc.p_cash_below_floor * 100 : null);
    fcAssurePushPct(pct, mc.p_trough_breach != null ? mc.p_trough_breach * 100 : null);
    money.push(mc.n);
    if (mc.cash && mc.cash.p50 != null) fcAssurePushMoney(money, mc.cash.p50);
    if (mc.arr && mc.arr.p50 != null) fcAssurePushMoney(money, mc.arr.p50);
  }

  return { lane, money: money.filter(v => v != null && !isNaN(v)), pct, mult, packet, soT };
}

function extractFcAssuranceMoneyClaims(text) {
  const out = [];
  const re = /\$\s*(-?\d{1,3}(?:,\d{3})*(?:\.\d+)?|\d+(?:\.\d+)?)\s*([KkMmBb])?\b/g;
  let m;
  while ((m = re.exec(text))) {
    let v = parseFloat(String(m[1]).replace(/,/g, ''));
    if (isNaN(v)) continue;
    const u = (m[2] || '').toUpperCase();
    if (u === 'K') v *= 1e3;
    else if (u === 'M') v *= 1e6;
    else if (u === 'B') v *= 1e9;
    out.push(v);
  }
  return out;
}

function extractFcAssurancePctClaims(text) {
  const out = [];
  const re = /(-?\d+(?:\.\d+)?)\s*%/g;
  let m;
  while ((m = re.exec(text))) {
    const v = parseFloat(m[1]);
    if (!isNaN(v)) out.push(v);
  }
  return out;
}

function extractFcAssuranceMultClaims(text) {
  const out = [];
  const re = /(-?\d+(?:\.\d+)?)\s*[×xX]\b/g;
  let m;
  while ((m = re.exec(text))) {
    const v = parseFloat(m[1]);
    if (!isNaN(v)) out.push(v);
  }
  return out;
}

function fcAssureMoneyMatches(claim, allow) {
  for (let i = 0; i < allow.length; i++) {
    const a = allow[i];
    if (Math.abs(a - claim) <= FC_ASSURE_TOL_MONEY) return true;
    const denom = Math.max(1, Math.abs(a));
    if (Math.abs(a - claim) / denom <= FC_ASSURE_TOL_RATIO) return true;
  }
  return false;
}

function fcAssurePctMatches(claim, allow) {
  for (let i = 0; i < allow.length; i++) {
    const a = allow[i];
    if (Math.abs(a - claim) <= FC_ASSURE_TOL_PP) return true;
    if (Math.abs(a * 100 - claim) <= FC_ASSURE_TOL_PP) return true;
    if (Math.abs(a - claim * 100) <= FC_ASSURE_TOL_PP) return true;
  }
  return false;
}

function fcAssuranceStructuralOk(text, allowlist) {
  const t = String(text || '');
  const p = allowlist && allowlist.packet;
  if (p) {
    if ((p.fyChurn || 0) > 1 && /zero\s+churn|no\s+churn|churn[^.!?]{0,48}\b(zero|0(?:\.0+)?)\b/i.test(t)) return false;
    if ((p.fyExp || 0) > 1 && /zero\s+expansion|no\s+expansion|expansion[^.!?]{0,48}\b(zero|0(?:\.0+)?)\b/i.test(t)) return false;
    if ((p.fyCont || 0) > 1 && /zero\s+contraction|no\s+contraction|contraction[^.!?]{0,48}\b(zero|0(?:\.0+)?)\b/i.test(t)) return false;
    if (/collections\s+of\s*\$/i.test(t) && /% of (forecasted )?revenue/i.test(t)) return false;
  }
  if (allowlist.lane === 'history' && /\bprior\s+year\s+vs\s+plan\b/i.test(t) && !/not prior year/i.test(t)) return false;
  return true;
}

function fcAssuranceClaimsVerified(text, allowlist) {
  if (!text || !allowlist) return false;
  if (!fcAssuranceStructuralOk(text, allowlist)) return false;
  const moneyClaims = extractFcAssuranceMoneyClaims(text);
  for (let i = 0; i < moneyClaims.length; i++) {
    if (!fcAssureMoneyMatches(moneyClaims[i], allowlist.money)) return false;
  }
  const pctClaims = extractFcAssurancePctClaims(text);
  for (let i = 0; i < pctClaims.length; i++) {
    if (!fcAssurePctMatches(pctClaims[i], allowlist.pct)) return false;
  }
  const multClaims = extractFcAssuranceMultClaims(text);
  for (let i = 0; i < multClaims.length; i++) {
    const claim = multClaims[i];
    const ok = (allowlist.mult || []).some(a => Math.abs(a - claim) <= FC_ASSURE_TOL_PP || Math.abs(a - claim) / Math.max(0.01, Math.abs(a)) <= FC_ASSURE_TOL_RATIO);
    if (!ok) return false;
  }
  return true;
}

function polishFcAssuranceCommentaryInputs(soT, allowlist, laneLabel) {
  const notes = [
    `FORECAST ENGINE Plan Assurance — ${laneLabel}.`,
    'POLISH ONLY. Rewrite ENGINE_STATUS in concise CFO English.',
    'Every dollar, percent, and multiple in your rewrite must already appear in ENGINE_STATUS or EVIDENCE.',
    'Do not invent metrics, bridges, collections/DSO claims, or zero churn/expansion/contraction unless ENGINE_STATUS states that.',
    'Frame as actuals-through-close vs open-month forecast (or Dec vs base plan). Do not reframe as prior-year budget vs next-year plan.',
    '',
    'ENGINE_STATUS:',
    soT,
    '',
    'EVIDENCE (absolute $ / % / multiples already cited above):',
    `money_sample=${(allowlist.money || []).slice(0, 40).map(v => Math.round(v)).join(',')}`,
    `pct_sample=${(allowlist.pct || []).slice(0, 20).map(v => Number(v).toFixed(2)).join(',')}`,
  ].join('\n');
  return {
    period_label: laneLabel,
    organization_name: 'SMPL',
    currency: 'USD',
    kpi_trends: allowlist.packet ? [{
      period_label: allowlist.packet.period_label || 'Forecast',
      arr: allowlist.packet.decArr,
      grr: allowlist.packet.avgGrr,
      pipeline_coverage: allowlist.packet.pipelineCoverage,
    }] : [],
    additional_notes: notes,
  };
}

async function polishFcAssuranceNarrative(soT, allowlist, laneLabel) {
  const res = await fetch('/api/v1/commentary/generate', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(polishFcAssuranceCommentaryInputs(soT, allowlist, laneLabel)),
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err.slice(0, 160) || `HTTP ${res.status}`);
  }
  const data = await res.json();
  const exec = data.executive_summary && data.executive_summary.narrative;
  if (exec) return exec;
  if (data.revenue_commentary && data.revenue_commentary.narrative) return data.revenue_commentary.narrative;
  throw new Error('empty_polish');
}

async function resolveFcAssuranceGenerate(soT, allowlist, laneLabel) {
  try {
    const polished = await polishFcAssuranceNarrative(soT, allowlist, laneLabel);
    if (fcAssuranceClaimsVerified(polished, allowlist)) return polished;
    console.warn('[forecast-assurance] polish failed claim verify — keeping engine SoT', laneLabel);
    return soT;
  } catch (e) {
    console.warn('[forecast-assurance] polish unavailable — keeping engine SoT', laneLabel, e && e.message);
    return soT;
  }
}

// ── OVERVIEW · risk strip + same-month YoY (Budget parity) ───────────────────

function fcOvPadMo(i) {
  return String(i).padStart(2, '0');
}
function fcOvYearPeriods(year) {
  return MO12.map((_, i) => `${year}-${fcOvPadMo(i + 1)}`);
}
function fcOvTsIsRow(period) {
  const ts = window.SMPLOutlook && window.SMPLOutlook.getOutlookTsData
    ? window.SMPLOutlook.getOutlookTsData()
    : (window.SMPL_DEMO_TS_DATA || window.TS_DATA);
  if (!ts) return null;
  for (const b of ['Actual', 'Forecast', 'Budget']) {
    if (ts[b] && ts[b].is && ts[b].is[period]) return ts[b].is[period];
  }
  return null;
}
function fcOvTsStmtRow(period, kind) {
  const ts = window.SMPLOutlook && window.SMPLOutlook.getOutlookTsData
    ? window.SMPLOutlook.getOutlookTsData()
    : (window.SMPL_DEMO_TS_DATA || window.TS_DATA);
  if (!ts) return null;
  for (const b of ['Actual', 'Forecast', 'Budget']) {
    if (ts[b] && ts[b][kind] && ts[b][kind][period]) return ts[b][kind][period];
  }
  return null;
}
function fcOvGrainSeries(monthly12, grain, mode) {
  if (grain === 'm') return monthly12;
  const out = [];
  for (let q = 0; q < 4; q++) {
    const slice = monthly12.slice(q * 3, q * 3 + 3);
    if (slice.some(v => v == null)) { out.push(null); continue; }
    if (mode === 'end') out.push(slice[2]);
    else out.push(slice.reduce((a, b) => a + b, 0));
  }
  return out;
}

/**
 * ARR for a period from loaded data. Prior years only when the loaded waterfall
 * lists that exact period — never mapped by month index from another year.
 */
function fcOvHistArrRow(period) {
  const y = parseInt(String(period).slice(0, 4), 10);
  const closeY = parseInt(String(getCloseMonth()).slice(0, 4), 10);
  if (y === closeY) {
    try {
      if (window.SMPLOutlook && window.SMPLOutlook.getCombinedArr) {
        const raw = window.SMPLOutlook.getCombinedArr(period, ALL_P, getCloseMonth());
        if (raw && raw.arr_eop != null) {
          return { bop: raw.arr_bop != null ? raw.arr_bop : null, eop: raw.arr_eop, nn: raw.arr_nn != null ? raw.arr_nn : null };
        }
      }
    } catch (e) { /* fall through to the loaded waterfall */ }
  }
  const wf = window.SMPL_ARR_WATERFALL || window.SMPL_DEMO_WF_TABLE || window.WF_TABLE;
  if (!wf || !wf.Ending) return null;
  let i = wf.periods ? wf.periods.indexOf(period) : -1;
  if (i < 0 && !wf.periods && y === closeY) i = parseInt(String(period).slice(5, 7), 10) - 1;
  if (i < 0 || i >= wf.Ending.length || wf.Ending[i] == null) return null;
  const eop = Number(wf.Ending[i]);
  const bop = wf.Beginning && wf.Beginning[i] != null ? Number(wf.Beginning[i]) : null;
  return { bop, eop, nn: bop != null ? eop - bop : null };
}

const FC_OV_FIELDS = {
  eop: 'ending ARR', nn: 'net new ARR', rev: 'revenue', ebitda: 'EBITDA', opex: 'OpEx',
  mkt: 'marketing spend', mqls: 'MQLs', cash: 'cash', hc: 'headcount',
};

/** Loaded history for one prior calendar year. Missing months stay null. */
function fcOvPriorYear(year) {
  const hist = window.SMPLOutlook && window.SMPLOutlook.getHistoryYear
    ? window.SMPLOutlook.getHistoryYear(year)
    : null;
  if (hist) {
    const out = Object.assign({}, hist);
    delete out.periods;
    return out;
  }
  const periods = fcOvYearPeriods(year);
  const arr = periods.map(fcOvHistArrRow);
  const isRows = periods.map(fcOvTsIsRow);
  const num = v => (v == null || v === '' ? null : Number(v));
  return {
    eop: arr.map(r => (r ? r.eop : null)),
    nn: arr.map(r => (r ? r.nn : null)),
    rev: isRows.map(r => (r ? num(r.revenue) : null)),
    ebitda: isRows.map(r => (r ? num(r.ebitda) : null)),
    opex: isRows.map(r => {
      if (!r) return null;
      if (r.total_opex != null) return Number(r.total_opex);
      if (r.sm == null && r.rd == null && r.ga == null) return null;
      return (Number(r.sm) || 0) + (Number(r.rd) || 0) + (Number(r.ga) || 0);
    }),
    mkt: periods.map(() => null),
    mqls: periods.map(() => null),
    cash: periods.map(p => {
      const cfs = fcOvTsStmtRow(p, 'cfs');
      if (cfs && cfs.ending_cash != null) return Number(cfs.ending_cash);
      if (cfs && cfs.end_cash != null) return Number(cfs.end_cash);
      const bs = fcOvTsStmtRow(p, 'bs');
      return bs && bs.cash != null ? Number(bs.cash) : null;
    }),
    hc: periods.map(p => fcWfMonthValue(fcWorkforce().heads_total, p)),
  };
}

/** Which metrics have no loaded months / some missing months in a year's series. */
function fcOvMissing(series) {
  const none = [], partial = [];
  Object.keys(FC_OV_FIELDS).forEach(k => {
    const vals = series[k] || [];
    const n = vals.filter(v => v != null).length;
    if (n === 0) none.push(FC_OV_FIELDS[k]);
    else if (n < 12) partial.push(FC_OV_FIELDS[k]);
  });
  return { none, partial, empty: none.length === Object.keys(FC_OV_FIELDS).length };
}

/**
 * Same-month YoY series for Overview charts. Every point is loaded data:
 * FY{year} = actuals + current forecast; prior years = loaded history only.
 * Missing history is reported in `missing`, never filled.
 */
function buildFcYoyCompare() {
  const year = parseInt(YEAR, 10);
  const isOf = p => getDisplayIS(p);
  const cur = {
    eop: ALL_P.map(p => {
      const a = getForecastARR(p);
      return a && a.arr_eop != null ? Number(a.arr_eop) : null;
    }),
    nn: ALL_P.map(p => fcArrComponent(p, 'nn')),
    rev: ALL_P.map(p => { const is = isOf(p); return is && is.revenue != null ? Number(is.revenue) : null; }),
    ebitda: ALL_P.map(p => { const is = isOf(p); return is && is.ebitda != null ? Number(is.ebitda) : null; }),
    opex: ALL_P.map(p => {
      const is = isOf(p);
      if (!is) return null;
      if (is.opex != null) return Number(is.opex);
      return (Number(is.sm) || 0) + (Number(is.rd) || 0) + (Number(is.ga) || 0);
    }),
    mkt: ALL_P.map(p => {
      try { return typeof fcGtmAllocate === 'function' ? Number(fcGtmAllocate(p).spendTot) : null; } catch (e) { return null; }
    }),
    mqls: ALL_P.map(p => {
      try {
        const v = typeof fcGtmAllocate === 'function' ? fcGtmAllocate(p).mqlSum : null;
        return v == null ? null : Number(v);
      } catch (e) { return null; }
    }),
    cash: ALL_P.map(p => {
      const cfs = getDisplayCFS(p) || {};
      return cfs.end_cash != null ? Number(cfs.end_cash) : null;
    }),
    hc: ALL_P.map(p => fcWfMonthValue(fcWorkforce().heads_total, p)),
  };
  if (typeof computeFcHcPlan === 'function' && fcHcHasData()) {
    try {
      const plan = computeFcHcPlan();
      cur.hc = ALL_P.map(p => (plan[p] && plan[p].headsTotal != null ? plan[p].headsTotal : null));
    } catch (e) { /* keep loaded heads */ }
  }

  const closeLbl = typeof getCloseMoLabel === 'function' ? getCloseMoLabel() : CLOSE_MO_LABEL;
  const prev = fcOvPriorYear(year - 1);
  const prev2 = fcOvPriorYear(year - 2);
  return [
    Object.assign({
      id: 'fy' + String(year - 2).slice(2), label: 'FY' + String(year - 2).slice(2), year: year - 2,
      color: '#72826a', dash: [4, 3], width: 1.5, optional: true, missing: fcOvMissing(prev2),
    }, prev2),
    Object.assign({
      id: 'fy' + String(year - 1).slice(2), label: 'FY' + String(year - 1).slice(2), year: year - 1,
      color: '#5fa878', dash: [], width: 1.8, missing: fcOvMissing(prev),
    }, prev),
    Object.assign({
      id: 'fy' + String(year).slice(2), label: 'FY' + String(year).slice(2), year,
      color: '#3d7ea6', dash: [], width: 2.6, missing: fcOvMissing(cur), current: true,
      note: `Actuals through ${closeLbl} + open-month forecast`,
    }, cur),
  ];
}

/** One line per year with no or partial loaded history, for the Overview flag. */
function fcOvHistoryFlags(years) {
  const out = [];
  years.forEach(y => {
    if (y.current && !y.missing.none.length && !y.missing.partial.length) return;
    if (y.missing.empty) {
      out.push(`No ${y.label} history loaded.`);
      return;
    }
    if (y.missing.none.length) out.push(`${y.label}: no ${y.missing.none.join(', ')} loaded.`);
    if (y.missing.partial.length) out.push(`${y.label}: some months missing for ${y.missing.partial.join(', ')}.`);
  });
  return out;
}

/** Plan/commit gaps are notes on Forecast; historical shape risks stay elevated. */
function fcRemapOverviewRisk(r) {
  if (!r) return r;
  const id = String(r.id || '');
  const title = String(r.title || '');
  const isPlanGap = id === 'arr_path'
    || /YoY target/i.test(title)
    || /vs base plan/i.test(title)
    || /short of base plan/i.test(title)
    || id === 'dec_vs_base';
  if (isPlanGap && (r.severity === 'high' || r.severity === 'medium' || r.severity === 'med')) {
    return Object.assign({}, r, {
      severity: 'info',
      title: /YoY target/i.test(title) ? 'Dec ARR vs base plan' : title.replace(/YoY target/i, 'base plan'),
      detail: (r.detail || '') + (/historical/i.test(r.detail || '') ? '' : ' · forecast vs plan (not a historical shape risk)'),
    });
  }
  return r;
}

/** Historical shape checks for Overview — run only on loaded prior-year history. */
function buildFcHistShapeRisks(packet) {
  const out = [];
  try {
    const years = buildFcYoyCompare();
    const cur = years.find(y => y.current);
    const prev = years.find(y => y.year === cur.year - 1);
    const prevDec = prev.eop[11];
    const prevJanBop = prev.eop[0] != null && prev.nn[0] != null ? prev.eop[0] - prev.nn[0] : null;
    if (prevDec == null || prevJanBop == null) {
      out.push({
        id: 'yoy_growth_shape',
        severity: 'medium',
        title: `No ${prev.label} ARR history loaded`,
        detail: `YoY ARR growth can't be checked: ${prev.label} ${prevDec == null ? 'December ending ARR' : 'January beginning ARR'} is not in the loaded data.`,
        citation: 'Loaded ARR waterfall',
      });
      return out;
    }
    const curDec = cur.eop[11];
    const curG = curDec != null && prevDec > 0 ? curDec / prevDec - 1 : null;
    const prevG = prevJanBop > 0 ? prevDec / prevJanBop - 1 : null;
    if (curG == null || prevG == null) return out;
    const deltaPp = (curG - prevG) * 100;
    out.push(Math.abs(deltaPp) >= 12
      ? {
          id: 'yoy_growth_shape',
          severity: Math.abs(deltaPp) >= 20 ? 'high' : 'medium',
          title: `YoY ARR growth ${deltaPp > 0 ? 'accelerates' : 'decelerates'} vs prior year`,
          detail: `FY path ${(curG * 100).toFixed(1)}% vs prior ${(prevG * 100).toFixed(1)}% (${deltaPp > 0 ? '+' : ''}${deltaPp.toFixed(1)}pp).`,
          citation: 'Same-month YoY · Ending ARR Dec / prior Dec',
        }
      : {
          id: 'yoy_growth_shape',
          severity: 'ok',
          title: 'YoY ARR growth vs prior',
          detail: `FY ${(curG * 100).toFixed(1)}% vs prior ${(prevG * 100).toFixed(1)}% — in line.`,
          citation: 'Same-month YoY · Ending ARR',
        });
  } catch (e) { /* optional */ }
  return out;
}

/** Priority order for Plan Assurance /assess risk strips: high → med → low → note → OK. */
function fcRiskSeverityRank(sev) {
  const s = String(sev || '').toLowerCase();
  if (s === 'high' || s === 'must_close') return 0;
  if (s === 'medium' || s === 'med' || s === 'must_confirm') return 1;
  if (s === 'low') return 2;
  if (s === 'info' || s === 'note' || s === 'advisory') return 3;
  if (s === 'ok' || s === 'must_hold' || s === 'pass') return 4;
  return 5;
}
function fcSortRisksBySeverity(risks) {
  return (risks || []).slice().sort((a, b) => {
    const d = fcRiskSeverityRank(a && a.severity) - fcRiskSeverityRank(b && b.severity);
    if (d !== 0) return d;
    return String((a && a.title) || '').localeCompare(String((b && b.title) || ''));
  });
}

function getFcOverviewRisks(packet) {
  const p = packet || buildFcAssurancePacket();
  const assess = (getForecastAssuranceRisks(p) || []).map(fcRemapOverviewRisk);
  let handoff = [];
  try {
    const hist = buildFcAssuranceHistoryPacket(p);
    handoff = (hist.findings || [])
      .filter(f => f && (f.severity === 'high' || f.severity === 'medium'))
      .map(fcRemapOverviewRisk);
  } catch (e) { /* optional */ }
  const shape = buildFcHistShapeRisks(p);
  const seen = new Set();
  const merged = [];
  [shape, assess, handoff].forEach(list => {
    (list || []).forEach(r => {
      const key = String(r.id || r.title);
      if (seen.has(key)) return;
      seen.add(key);
      merged.push({
        id: r.id,
        severity: r.severity,
        title: r.title,
        detail: r.detail,
        citation: r.citation || '',
      });
    });
  });
  return fcSortRisksBySeverity(merged);
}

function renderFcOverviewRiskRows(risks) {
  if (!risks || !risks.length) return '<div style="color:var(--text3)">No checks yet.</div>';
  return fcSortRisksBySeverity(risks).map(r => {
    const sev = r.severity === 'high' ? 'high'
      : r.severity === 'ok' ? 'ok'
      : r.severity === 'low' ? 'low'
      : r.severity === 'info' ? 'info'
      : 'med';
    const label = r.severity === 'ok' ? 'OK'
      : r.severity === 'info' ? 'note'
      : (r.severity === 'medium' || r.severity === 'med') ? 'medium'
      : r.severity;
    const cite = r.citation ? `<div class="assure-cite">${String(r.citation).replace(/</g, '&lt;')}</div>` : '';
    return `<div class="assure-risk"><span class="assure-sev ${sev}">${label}</span><div><strong>${String(r.title || '').replace(/</g, '&lt;')}</strong><br><span style="color:var(--text3)">${String(r.detail || '').replace(/</g, '&lt;')}</span>${cite}</div></div>`;
  }).join('');
}

function fcOvChartDefaults() {
  const tick = { color: 'rgba(170,184,162,0.85)', font: { size: 10 } };
  const grid = { color: 'rgba(255,255,255,0.06)' };
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 }, color: 'rgba(170,184,162,0.9)' } },
      tooltip: {
        callbacks: {
          label: function (ctx) {
            const v = ctx.parsed.y;
            if (ctx.dataset.yAxisID === 'hc' || (ctx.chart.canvas && ctx.chart.canvas.id === 'ovHcC')) {
              return ` ${ctx.dataset.label}: ${Math.round(v).toLocaleString()}`;
            }
            return ` ${ctx.dataset.label}: ${fM(v, 1)}`;
          },
        },
      },
    },
    scales: {
      x: { ticks: tick, grid: { display: false } },
      y: { ticks: Object.assign({ callback: v => fM(v, 1) }, tick), grid },
    },
  };
}

function paintFcOverviewCharts() {
  const grain = window._fcOvGrain === 'm' ? 'm' : 'q';
  const labels = grain === 'm' ? MO12.slice() : ['Q1', 'Q2', 'Q3', 'Q4'];
  let years = buildFcYoyCompare();

    years = years.filter(y => !y.optional);
  }

    if (yFmt === 'n') {
      opts.scales.y.ticks.callback = v => Math.round(v).toLocaleString();
      opts.plugins.tooltip.callbacks.label = function (ctx) {
        return ` ${ctx.dataset.label}: ${Math.round(ctx.parsed.y).toLocaleString()}`;
      };
    }
    mk(canvasId, {
      type: 'line',
      data: {
        labels,
        datasets: years.filter(y => (y[field] || []).some(v => v != null)).map(y => ({
          label: y.label,
          data: fcOvGrainSeries(y[field], grain, mode),
          borderColor: y.color,
          backgroundColor: y.color + '22',
          borderWidth: y.width,
          borderDash: y.dash || [],
          tension: 0.22,
          pointRadius: grain === 'q' ? 3 : 2,

  mkLine('ovEbitdaC', 'ebitda', 'sum', 'm');
  mkLine('ovOpexC', 'opex', 'sum', 'm');
  mkLine('ovMktC', 'mkt', 'sum', 'm');
  mkLine('ovMqlC', 'mqls', 'sum', 'n');
  mkLine('ovCashC', 'cash', 'end', 'm');
  mkLine('ovHcC', 'hc', 'end', 'n');
}

function buildGtmHorizonSummary(){
  const lv=getLevers();
  let wtdNb=0,wtdExp=0,grossRen=0,wtdRen=0,dealN=0,renN=0;
  let pipelineDollar=0; // gross NB CRM pipe — Budget: pipeline / NB ARR
  FC_P.forEach(p=>{
    const opps=SRC.opp_pipeline[p]||{};
    const nb=opps['New Business']||{};
    const exp=opps['Expansion']||{};
    pipelineDollar+=(nb.total||0);
    wtdNb+=(nb.weighted||0)*(lv.nb||1);
    wtdExp+=(exp.weighted||0)*(lv.exp||1);
    dealN+=(nb.count||0)+(exp.count||0);
    const ren=SRC.renewals[p]||{};
    grossRen+=ren.arr||0;
    wtdRen+=(ren.weighted||0)*(1+(lv.ren_adj||0));
    renN+=ren.count||0;
  });
  // Budget parity: coverage = Pipeline $ / New Business ARR (not vs Dec ARR gap).
  const coverX=wtdNb>0?pipelineDollar/wtdNb:null;
  return {wtdNb,wtdExp,grossRen,wtdRen,dealN,renN,pipelineDollar,coverX,coverPool:pipelineDollar};
}

    {lbl:'+ Reactivation',key:'arr_react',indent:true,fy:true},
    {lbl:'- Contraction',key:'arr_cont',indent:true,inv:true,fy:true},
    {lbl:'- Churn',compute:function(d){return (d.arr_nr_churn||0)+(d.ren_churn||0);},indent:true,inv:true,fy:true,churn:true},

  function fyArrRetention(key){
    var jan=getARR(ALL_P[0]);
    var janBop=jan&&jan.arr_bop;
    if(!janBop) return null;
    var totExp=0, totReact=0, totCont=0, totChurn=0;
    ALL_P.forEach(function(p){
      var d=getARR(p);
      if(!d) return;
      totExp+=d.arr_exp||0;
      totReact+=d.arr_react||0;
      totCont+=d.arr_cont||0;
      totChurn+=(d.arr_nr_churn||0)+(d.ren_churn||0);
    });
    if(key==='grr') return (janBop-totCont-totChurn)/janBop;
    if(key==='nrr') return (janBop+totExp+totReact-totCont-totChurn)/janBop;
    return null;
  }

  var stmtTable=buildStmtTable(allP,cfg,rows,getARR,{
    fyTotal:true,
    colorMode:'is',
    getFyTotal:function(r){
      if(r.pct&&(r.key==='nrr'||r.key==='grr')) return fyArrRetention(r.key);
      if(r.pct||r.color===false) return null;
      if(r.key==='arr_bop'){
        var jan=getARR(ALL_P[0]);
        return jan&&jan.arr_bop!=null?jan.arr_bop:null;

      if(r.key==='arr_eop'){
        var dec=getARR(FC_P[FC_P.length-1]);

      if(r.churn){
        return ALL_P.reduce(function(s,p){
          var d=getARR(p);
          return d?s+(d.arr_nr_churn||0)+(d.ren_churn||0):s;
        },0);
      }
      if(r.key){
        return ALL_P.reduce(function(s,p){
          var d=getARR(p);
          return d?s+(d[r.key]||0):s;
        },0);
      }
      return null;
    }
  });

  // Cumulative bridge — same pipeline source as ARR Waterfall Detail table
  var junArr=getForecastARR(CLOSE_MONTH);
  var bop_arr=junArr&&junArr.arr_eop!=null?junArr.arr_eop:0;
  function sumFcArr(field){
    return FC_P.reduce(function(s,p){
      var d=getForecastARR(p);
      if(!d) return s;
      if(field==='churn') return s+(d.arr_nr_churn||0)+(d.ren_churn||0);
      return s+(d[field]||0);
    },0);
  }
  var nb_cum=sumFcArr('arr_nb');
  var exp_cum=sumFcArr('arr_exp');
  var react_cum=sumFcArr('arr_react');
  var cont_cum=-sumFcArr('arr_cont');
  var churn_cum=-sumFcArr('churn');

  function addBar(lbl,val){var isNeg=val<0;var offset=isNeg?running+val:running;steps.push({lbl:lbl,val:val,running:running+val,offset:offset,isAnchor:false,isNeg:isNeg});running+=val;}
  addAnchor(CLOSE_MO_LABEL+'\nAct',bop_arr);

  addBar('Expansion',exp_cum);
  addBar('Reactivation',react_cum);
  addBar('Contraction',cont_cum);
  addBar('Churn',churn_cum);

        '<div>'+
          '<div class="card-title">ARR Bridge -- '+CLOSE_MO_LABEL+' Actual to Dec Forecast</div>'+
          '<div class="card-sub">Cumulative Jul–Dec pipeline movements (matches table below)</div>'+
        '</div>'+

        '</div>'+
      '</div>'+
      '<div class="chart-wrap" style="height:300px"><canvas id="arrBridgeC" role="img" aria-label="ARR bridge waterfall">ARR bridge: '+CLOSE_MO_LABEL+' '+fM(bop_arr,1)+' to Dec '+fM(dec_eop,1)+'.</canvas></div>'+
      '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">'+
        '<span style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text2)"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#1D9E75"></span>New Business</span>'+
        '<span style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text2)"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#185FA5"></span>Expansion</span>'+
        '<span style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text2)"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#534AB7"></span>Reactivation</span>'+
        '<span style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text2)"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#D85A30"></span>Churn / Contraction</span>'+
        
      '</div>'+
    '</div>'+
    '<div class="ts-stmt-hdr" style="margin-top:12px">'+
      '<div class="ts-stmt-title">ARR Waterfall Detail</div>'+
    '</div>'+
    stmtTable+
    '</div></div>';

  setTimeout(function(){
    var localSteps=steps;
    var tokens=chartSkinTokens();
    var barColors=localSteps.map(function(s,i){
      if(s.isAnchor) return i===0?tokens.fade(tokens.cPos,0.42):tokens.fade(tokens.cAmber,0.42);
      if(s.isNeg) return tokens.cNeg;
      if(s.lbl.indexOf('New')>=0) return tokens.cPos;
      if(s.lbl.indexOf('Exp')>=0) return tokens.cBlue;
      return '#534AB7';
    });
    var borderColors=localSteps.map(function(s,i){
      if(s.isAnchor) return i===0?tokens.cPos:tokens.cAmber;
      return barColors[i];
    });
    var labelPlugin={
      id:'wfLabels',
      afterDatasetsDraw:function(chart){
        var stps=localSteps;
        if(!stps||!stps.length) return;
        var ctx=chart.ctx;
        var meta=chart.getDatasetMeta(1);
        var yAxis=chart.scales.y;
        ctx.save();
        ctx.textAlign='center';
        ctx.font='bold 10px system-ui,sans-serif';
        stps.forEach(function(s,i){
          var bar=meta.data[i];
          if(!bar) return;
          var barTop=Math.min(bar.y,bar.base);
          var barBot=Math.max(bar.y,bar.base);
          var barH=barBot-barTop;
          var mid=(barTop+barBot)/2;
          var label=s.isAnchor?fM(Math.abs(s.val),1):(s.isNeg?'-':'+')+fM(Math.abs(s.val),1);
          if(s.isAnchor){
            ctx.textBaseline='top';
            ctx.fillStyle=i===0?tokens.cPos:tokens.cAmber;
            ctx.fillText(label,bar.x,barTop+8);
          } else if(barH>=18){
            ctx.textBaseline='middle';
            ctx.fillStyle='rgba(255,255,255,0.95)';
            ctx.fillText(label,bar.x,mid);
          } else {
            ctx.textBaseline='bottom';
            ctx.font='bold 9px system-ui,sans-serif';

            ctx.fillText(label,bar.x,s.isNeg?barBot+10:barTop-8);
            ctx.font='bold 10px system-ui,sans-serif';
          }
          if(i<stps.length-1){
            var nextBar=meta.data[i+1];
            if(nextBar){
              var runY=yAxis.getPixelForValue(s.running/1e6);
              ctx.beginPath();
              ctx.strokeStyle='rgba(120,120,120,0.3)';
              ctx.setLineDash([3,3]);
              ctx.lineWidth=1;
              ctx.moveTo(bar.x+bar.width/2+2,runY);
              ctx.lineTo(nextBar.x-nextBar.width/2-2,runY);

          }
        });
        ctx.restore();
      }

    mk('arrBridgeC',{

        }

}


// ── P&L by team (GL detail → IS S&M / R&D / G&A) ─────────────────────────────
// Every month starts from the GL: opex by team and account for Actual (through close) and the
// loaded Forecast (after close). In forecast months, headcount plan changes add visible adjustment
// lines, and edited account cells (here, or program spend on GTM / Pipeline) replace the GL amount.
// The same totals feed the Income Statement, so S&M / R&D / G&A are one number on every tab.

let fcPlDept = 'total';
let fcPlSpend = null; // { "line|department|account": { period: dollars } } — forecast account edits

const FC_PL_LINES = [
  { key: 'sm', label: 'Sales &amp; Marketing', short: 'S&amp;M' },
  { key: 'rd', label: 'Research &amp; Development', short: 'R&amp;D' },
  { key: 'ga', label: 'General &amp; Administrative', short: 'G&amp;A' },
  { key: 'unmapped', label: 'Unmapped opex', short: 'Unmapped' },
];
const FC_PL_HC_LINE = { sales: 'sm', cs: 'sm', marketing: 'sm', rd: 'rd', ga: 'ga' };

function ensureFcPlState() {
  if (!fcPlSpend) fcPlSpend = {};
}

function fcPlSplitKey(key) {
  const parts = String(key).split('|');
  return { line: parts[0], team: parts[1] || 'Unassigned', account: parts.slice(2).join('|') || 'Unassigned' };
}

/**
 * GL opex detail for a month: { "line|department|account": amount }.
 * source 'gl' = account detail; 'is' = statement line totals only (detail not loaded); null = no data.
 */
function fcGlOpexBase(period) {
  const SO = window.SMPLOutlook;
  const detail = SO && typeof SO.getWarehouseGlOpex === 'function'
    ? SO.getWarehouseGlOpex(period, getCloseMonth()) : null;
  if (detail && Object.keys(detail).length) return { detail, source: 'gl' };
  const is = getOutlookIS(period);
  if (!is) return { detail: {}, source: null };
  const out = {};
  FC_PL_LINES.forEach(l => {
    const v = Number(is[l.key]) || 0;
    if (v) out[`${l.key}|All teams|Statement total (account detail not loaded)`] = v;
  });
  return { detail: out, source: 'is' };
}

/**
 * Loaded monthly cost per head and annual base salary per HC group, from the loaded data:
 * GL payroll (wages, bonus, benefits, taxes, 401(k), commissions) ÷ month-end heads over the actual
 * months through close, and the average base of the close roster. Null where not loaded.
 */
function fcHcCostRates() {
  const wf = fcWorkforce();
  const pay = wf.payroll_by_team || {};
  const heads = wf.heads || {};
  const actual = ALL_P.filter(p => p <= getCloseMonth());
  const sums = {};
  FC_HC_DEPTS.forEach(d => { sums[d.key] = { pay: 0, heads: 0, base: 0, n: 0 }; });
  Object.keys(pay).forEach(team => {
    const key = fcHcMapDept(team);
    if (!key) return;
    actual.forEach(p => {
      const v = fcWfMonthValue(pay[team], p);
      const h = fcWfMonthValue(heads[team], p);
      if (v == null || h == null) return;
      sums[key].pay += Number(v);
      sums[key].heads += Number(h);
    });
  });
  (wf.roster || []).forEach(e => {
    const key = fcHcMapDept(e.dept);
    if (!key || !(Number(e.base) > 0)) return;
    sums[key].base += Number(e.base);
    sums[key].n += 1;
  });
  const out = {};
  FC_HC_DEPTS.forEach(d => {
    const s = sums[d.key];
    out[d.key] = {
      monthlyPerHead: s.heads > 0 ? s.pay / s.heads : null,
      annualBase: s.n > 0 ? s.base / s.n : null,
    };
  });
  return out;
}

/** HC groups whose plan changes can't be priced (named in the P&L and Headcount banners). */
function fcHcCostGaps() {
  const rates = fcHcCostRates();
  const gaps = [];
  FC_HC_DEPTS.forEach(d => {
    if (rates[d.key].monthlyPerHead == null) gaps.push(`${d.label}: no actual GL payroll and heads through ${getCloseMonth()} — head changes are priced at $0`);
    if (rates[d.key].annualBase == null) gaps.push(`${d.label}: no base salaries on the close roster — RIF severance is $0`);
  });
  return gaps;
}

/** Heads × loaded cost per head per HC group, plus RIF severance at the group's average base. */
function computeFcHcComp() {
  if (typeof computeFcHcPlan !== 'function') return null;
  const plan = computeFcHcPlan();
  const rates = fcHcCostRates();
  ALL_P.forEach(p => {
    const row = plan[p];
    if (!row) return;
    row.severance = {};
    row.payroll = {};
    FC_HC_DEPTS.forEach(d => {
      const heads = Number(row.ending && row.ending[d.key]) || 0;
      const r = rates[d.key];
      let sev = 0;
      if (r.annualBase != null) {
        fcHcRifsForPeriod(p).filter(x => x.dept === d.key).forEach(x => {
          sev += (Number(x.heads) || 0) * (r.annualBase / 52) * (Number(x.weeks) || 0);
        });
      }
      row.severance[d.key] = sev;
      row.payroll[d.key] = r.monthlyPerHead != null ? heads * r.monthlyPerHead : 0;
    });
  });
  return plan;
}

/** Headcount plan at data defaults: loaded plan hires, no RIFs / attrition / freezes. */
function computeFcHcCompBaseline() {
  const saved = fcHcState;
  fcHcState = {
    focus: saved.focus, hires: null, rifs: [], attritionPct: null,
    freeze: { marketing: false, rd: false, ga: false }, seededFrom: null,
  };
  try {
    return computeFcHcComp();
  } finally {
    fcHcState = saved;
  }
}

function fcPlCache() {
  if (!_fcPlCache) _fcPlCache = { periods: {}, hc: null, gtmChannels: null };
  return _fcPlCache;
}

/** Cost of headcount plan changes per HC dept for a forecast month (current plan − default plan). */
function fcPlHcDelta(period) {
  const cache = fcPlCache();
  if (!cache.hc) cache.hc = { cur: computeFcHcComp(), base: computeFcHcCompBaseline() };
  const c = cache.hc.cur && cache.hc.cur[period];
  const b = cache.hc.base && cache.hc.base[period];
  const out = {};
  if (!c || !b || !c.payroll || !b.payroll) return out;
  const cost = (r, k) => (Number(r.payroll[k]) || 0) + (Number(r.severance && r.severance[k]) || 0);
  FC_HC_DEPTS.forEach(d => { out[d.key] = cost(c, d.key) - cost(b, d.key); });
  return out;
}

/**
 * Opex for one month by P&L line → team → account, from the GL. Forecast months apply account
 * edits and add adjustment lines for plan changes. delta = change vs the GL (zero at defaults).
 */
function computeFcDeptPlPeriod(period) {
  const cache = fcPlCache();
  if (cache.periods[period]) return cache.periods[period];
  ensureFcPlState();
  const isAct = period <= getCloseMonth();
  const base = fcGlOpexBase(period);
  const lines = {};
  FC_PL_LINES.forEach(l => { lines[l.key] = { teams: {}, adj: [], glTotal: 0, total: 0 }; });
  const delta = { sm: 0, rd: 0, ga: 0, unmapped: 0 };

  Object.keys(base.detail).forEach(key => {
    const k = fcPlSplitKey(key);
    const lineKey = lines[k.line] ? k.line : 'unmapped';
    const ln = lines[lineKey];
    const gl = Number(base.detail[key]) || 0;
    const editRow = fcPlSpend[key];
    const edited = !isAct && base.source === 'gl' && editRow && editRow[period] != null;
    const amt = edited ? Number(editRow[period]) : gl;
    if (!ln.teams[k.team]) ln.teams[k.team] = { accounts: {}, total: 0 };
    ln.teams[k.team].accounts[k.account] = { key, gl, amt, edited };
    ln.teams[k.team].total += amt;
    ln.glTotal += gl;
    ln.total += amt;
    delta[lineKey] += amt - gl;
  });

  if (!isAct) {
    const addAdj = (lineKey, label, amt, origin) => {
      if (Math.abs(amt) < 0.5) return;
      lines[lineKey].adj.push({ label, amt, origin });
      lines[lineKey].total += amt;
      delta[lineKey] += amt;
    };
    const hc = fcPlHcDelta(period);
    FC_HC_DEPTS.forEach(d => {
      if (hc[d.key] != null) addAdj(FC_PL_HC_LINE[d.key] || 'ga', `Headcount plan changes — ${d.label}`, hc[d.key], 'headcount');
    });
  }

  const out = {
    is_actual: isAct, source: base.source, lines, delta,
    sm: lines.sm.total, rd: lines.rd.total, ga: lines.ga.total, unmapped: lines.unmapped.total,
  };
  out.opex = out.sm + out.rd + out.ga + out.unmapped;
  cache.periods[period] = out;
  return out;
}

function resolveFcPlOpex(period) {
  const pl = computeFcDeptPlPeriod(period);
  return { sm: pl.sm, rd: pl.rd, ga: pl.ga, unmapped: pl.unmapped, pl };
}

function setFcPlDept(key) {
  fcPlDept = key || 'total';
  showTab('pnl');
}

/** Edit one GL account for a forecast month ($M). Re-entering the GL amount clears the edit. */
function updateFcPlSpend(key, period, rawM) {
  ensureFcPlState();
  if (period <= getCloseMonth()) return;
  const v = Math.round((Number(rawM) || 0) * 1e6);
  const gl = Number(fcGlOpexBase(period).detail[key]) || 0;
  if (!fcPlSpend[key]) fcPlSpend[key] = {};
  // Inputs show $M to 3 decimals ($1K), so anything within $500 of the GL is the GL amount.
  if (Math.abs(v - gl) < 500) delete fcPlSpend[key][period];
  else fcPlSpend[key][period] = v;
  if (!Object.keys(fcPlSpend[key]).length) delete fcPlSpend[key];
  refresh();
}

function resetFcPlSpend() {
  fcPlSpend = {};
  refresh();
}

function fcPlEditCount() {
  ensureFcPlState();
  return Object.keys(fcPlSpend).reduce((n, k) => n + Object.keys(fcPlSpend[k]).length, 0);
}

function fcPlAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fcPlSpendInput(key, period, amt, edited) {
  const title = edited ? 'Edited — replaces the GL amount. Re-enter the GL amount to clear.' : 'Edit $M';
  return `<input class="hc-hire" style="width:58px;color:var(--amber)${edited ? ';font-weight:700;text-decoration:underline' : ''}" value="${((amt || 0) / 1e6).toFixed(3)}" title="${title}"
    data-key="${fcPlAttr(key)}" onchange="updateFcPlSpend(this.dataset.key,'${period}',this.value)"
    onclick="event.stopPropagation()">`;
}

function fcPlMonthHeaders(periods) {

}

function renderPnL(area) {

    html += `<div class="hc-banner" style="border-left-color:var(--amber)">GL account detail is not loaded for ${noDetail.map(moLabel).join(', ')}. Those months show statement totals only; nothing is estimated.</div>`;
  }
  const costGaps = fcHcCostGaps();
  if (costGaps.length) {
    html += `<div class="hc-banner" style="border-left-color:var(--amber)">Headcount plan changes: ${costGaps.join('; ')}.</div>`;
  }
  if (offIs.length) {
    html += `<div class="hc-banner" style="border-left-color:var(--red,#c0392b)">P&amp;L and Income Statement opex differ for ${offIs.map(moLabel).join(', ')}.</div>`;
  }

  if (dept === 'total') {

    const fyGp = fySum(p => isAll[p].gross_profit);

      <div class="kpi"><div class="kpi-lbl">S&amp;M % rev</div><div class="kpi-val">${fyRev ? fP(fyLine('sm') / fyRev) : '—'}</div></div>
      <div class="kpi"><div class="kpi-lbl">R&amp;D % rev</div><div class="kpi-val">${fyRev ? fP(fyLine('rd') / fyRev) : '—'}</div></div>
      <div class="kpi"><div class="kpi-lbl">G&amp;A % rev</div><div class="kpi-val">${fyRev ? fP(fyLine('ga') / fyRev) : '—'}</div></div>

    <div class="hc-wrap"><table class="hc-tbl"><thead><tr><th class="act-h line-h" aria-hidden="true"></th>${fcPlMonthHeaders(allP)}</tr></thead><tbody>`;

    html += secRow('Revenue &amp; gross profit');

    });
    html += moneyRow('Total OpEx', p => plAll[p].opex, 'tot');

    html += secRow('Bottom line');
    html += moneyRow('EBITDA', p => isAll[p].ebitda, 'tot');
    html += moneyRow('Net income', p => isAll[p].net_income, 'tot');
    html += '</tbody></table></div></div>';
    area.innerHTML = html;
    return;
  }

  const line = lineDefs.find(l => l.key === dept);

  const acctFy = {};
  allP.forEach(p => {
    const teams = plAll[p].lines[dept].teams;

  const byFyDesc = obj => Object.keys(obj).sort((a, b) => Math.abs(obj[b]) - Math.abs(obj[a]) || a.localeCompare(b));
  const adjLabels = [];
  allP.forEach(p => plAll[p].lines[dept].adj.forEach(a => {

  html += `
    <div class="hc-banner"><strong>${line.label}</strong> → Income Statement ${line.short} · FY ${fM(fyLineTot)}.

    html += moneyRow(`${fcPlAttr(team)} total`, p => {
      const t = plAll[p].lines[dept].teams[team];

        const hit = plAll[p].lines[dept].adj.find(x => x.label === a.label);
        return hit ? hit.amt : 0;

    });
  }

  html += moneyRow(`${line.label} total → Income Statement`, p => plAll[p].lines[dept].total, 'tot');
  html += '</tbody></table></div></div>';
  area.innerHTML = html;
}

function bsTotalAssets(d){

  if(d.total_assets!=null) return Number(d.total_assets);
  return (d.cash||0)+(d.ar||0)+(d.prepaids||0)+(d.ppe||0);
}
function bsTotalLiabilities(d){
  if(!d) return null;
  if(d.total_liab!=null) return d.total_liab;
  if(d.total_liabilities!=null) return d.total_liabilities;
  return (d.ap||0)+(d.dr||0)+(d.debt||0)+(d.other_liab||0);
}
function bsTotalLe(d){
  if(!d) return null;
  if(d.total_le!=null) return d.total_le;
  const tl=bsTotalLiabilities(d);
  if(tl==null && d.equity==null) return d.total_assets!=null?d.total_assets:null;
  return (tl||0)+(d.equity||0);
}
function renderBS(area){

    {lbl:'Accounts Receivable',key:'ar',indent:true},

// \u2500\u2500 PIPELINE DETAIL \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// ── GTM / Pipeline (top-down: CRM pipe first, marketing MQLs overlay) ─────────
const FC_GTM_RATE_MONTHS = 12;

// Program spend is not GTM state: it is the GL marketing program accounts on the P&L
// (Actual GL through close, Forecast GL after, plus forecast account edits in fcPlSpend).
let fcGtmState = {
  cpl: null,           // { period: { programKey: $/MQL } } — forecast edits over the loaded cost per MQL
};

function fcGtmPriorMonth(p) {
  const y = Number(p.slice(0, 4)), m = Number(p.slice(5, 7));
  return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`;
}

/** Loaded funnel row for a month (history, then Actual / Forecast); null when not loaded. */
function fcGtmLoadedFunnel(p) {
  const SO = window.SMPLOutlook;
  return SO && typeof SO.getLoadedFunnel === 'function' ? SO.getLoadedFunnel(p, getCloseMonth()) : null;
}

/** New Business ARR booked in a closed month (outlook actuals, else the loaded history). */
function fcGtmBookedNb(p) {
  const a = SRC.actuals && SRC.actuals[p];
  if (a && a.arr_nb != null) return Number(a.arr_nb);
  const h = window.SMPL_HISTORY && window.SMPL_HISTORY.arr && window.SMPL_HISTORY.arr[p];
  return h && h.arr_nb != null ? Number(h.arr_nb) : null;
}

/**
 * Funnel rates over the last FC_GTM_RATE_MONTHS closed months with loaded funnel, GL program spend and
 * booked New Business: cost per MQL, MQL→opportunity, win rate on pipeline, MQLs per $ of New Business.
 * Fields are null when the months are not loaded.
 */
function fcGtmFunnelRates() {
  const cache = fcPlCache();
  if (cache.gtmRates) return cache.gtmRates;
  const SO = window.SMPLOutlook;
  const months = [];
  let p = getCloseMonth();
  const sum = { spend: 0, mqls: 0, opps: 0, pipe: 0, won: 0, nb: 0 };
  for (let i = 0; i < FC_GTM_RATE_MONTHS; i++, p = fcGtmPriorMonth(p)) {
    const f = fcGtmLoadedFunnel(p);
    const spend = SO && typeof SO.getLoadedProgramSpend === 'function' ? SO.getLoadedProgramSpend(p, getCloseMonth()) : null;
    const nb = fcGtmBookedNb(p);
    if (!f || f.mqls == null || spend == null || nb == null) continue;
    months.push(p);
    sum.spend += Number(spend) || 0;
    sum.mqls += Number(f.mqls) || 0;
    sum.opps += Number(f.opportunities_created) || 0;
    sum.pipe += Number(f.pipeline_arr_created) || 0;
    sum.won += Number(f.closed_won_arr) || 0;
    sum.nb += nb;
  }
  months.sort();
  const div = (a, b) => (b > 0 ? a / b : null);
  cache.gtmRates = {
    months,
    from: months[0] || null,
    to: months[months.length - 1] || null,
    cpl: div(sum.spend, sum.mqls),
    mqlOpp: div(sum.opps, sum.mqls),
    winRate: div(sum.won, sum.pipe),
    mqlPerNb: div(sum.mqls, sum.nb),
  };
  return cache.gtmRates;
}

/** Coverage floor = the closed months' pipeline created ÷ closed-won ARR (1 ÷ win rate); null when not loaded. */
function fcLoadedCoverageMin() {
  const r = fcGtmFunnelRates();
  return r.winRate > 0 ? 1 / r.winRate : null;
}

function fcGtmRatesLabel(r) {
  if (!r.months.length) return 'no closed months with loaded funnel, program spend and bookings';
  const lbl = p => `${MO12[parseInt(p.slice(5), 10) - 1]} ${p.slice(0, 4)}`;
  return `${r.months.length} closed months ${lbl(r.from)}–${lbl(r.to)}`;
}

/** CRM buckets carry `expected`; the engine's built-in demo pipeline does not. */
function fcGtmIsCrmBucket(bucket) {
  return !!(bucket && bucket.expected != null);
}

/** Closed New Business deals through the close month: { total, count } from the CRM deal book. */
function fcGtmClosedNb() {
  const close = getCloseMonth();
  let total = 0;
  let count = 0;
  Object.keys(SRC.opp_pipeline || {}).forEach(p => {
    const nb = p <= close ? SRC.opp_pipeline[p]['New Business'] : null;
    if (!fcGtmIsCrmBucket(nb)) return;
    total += Number(nb.total) || 0;
    count += Number(nb.count) || 0;
  });
  return { total, count };
}

/** Average ARR of closed New Business deals through the close month (warehouse, else the deal book). */
function fcGtmAcv() {
  const live = SRC.gtm && Number(SRC.gtm.avg_acv);
  if (live > 0) return live;
  const nb = fcGtmClosedNb();
  return nb.count ? nb.total / nb.count : null;
}

function fcGtmAcvSource() {
  if (SRC.gtm && Number(SRC.gtm.avg_acv) > 0) return 'Closed new business deals · warehouse';
  const nb = fcGtmClosedNb();
  if (nb.count) return `${nb.count} closed deals Jan–${getCloseMoLabel()} · CRM`;
  return 'Not loaded — no closed CRM deals';
}

/** GL marketing program accounts for a month (expense type "Marketing Programs"): { key: GL amount }. */
function fcGtmGlPrograms(period) {
  const SO = window.SMPLOutlook;
  const row = SO && typeof SO.getWarehouseGlPrograms === 'function'
    ? SO.getWarehouseGlPrograms(period, getCloseMonth()) : null;
  return row || {};
}

/** Program channels = the GL program accounts across the horizon, largest first. */
function fcGtmChannels() {
  const cache = fcPlCache();
  if (cache.gtmChannels) return cache.gtmChannels;
  const fy = {};
  ALL_P.forEach(p => {
    const row = fcGtmGlPrograms(p);
    Object.keys(row).forEach(k => { fy[k] = (fy[k] || 0) + (Number(row[k]) || 0); });
  });
  cache.gtmChannels = Object.keys(fy)
    .sort((a, b) => fy[b] - fy[a] || a.localeCompare(b))
    .map(key => ({ key, label: fcPlSplitKey(key).account }));
  return cache.gtmChannels;
}

/** Program spend for a month: the account's P&L amount (GL, or the forecast edit). */
function fcGtmChannelSpend(period, key) {
  const k = fcPlSplitKey(key);
  const ln = computeFcDeptPlPeriod(period).lines[k.line];
  const team = ln && ln.teams[k.team];
  const acct = team && team.accounts[k.account];
  return acct ? acct.amt : 0;
}

function ensureFcGtmState() {
  if (!fcGtmState.cpl) fcGtmState.cpl = {};
}

/** Program spend edits are P&L account edits; the GL amount (within $500) clears the edit. */
function fcGtmSetChannelSpend(period, key, dollars) {
  ensureFcPlState();
  const gl = Number(fcGlOpexBase(period).detail[key]) || 0;
  if (!fcPlSpend[key]) fcPlSpend[key] = {};
  if (Math.abs(dollars - gl) < 500) delete fcPlSpend[key][period];
  else fcPlSpend[key][period] = Math.round(dollars);
  if (!Object.keys(fcPlSpend[key]).length) delete fcPlSpend[key];
}

function updateFcGtmChannelSpend(period, idx, raw) {
  const ch = fcGtmChannels()[idx];
  if (!ch || period <= getCloseMonth()) return;
  fcGtmSetChannelSpend(period, ch.key, Math.max(0, (Number(raw) || 0) * 1e6));
  refresh();
}

/** Total program spend edit: scales each account in proportion (even split when all are zero). */
function updateFcGtmSpend(period, raw) {
  const chans = fcGtmChannels();
  if (!chans.length || period <= getCloseMonth()) return;
  const newTot = Math.max(0, (Number(raw) || 0) * 1e6);
  const cur = chans.map(ch => fcGtmChannelSpend(period, ch.key));
  const oldTot = cur.reduce((s, v) => s + v, 0);
  chans.forEach((ch, i) => {
    fcGtmSetChannelSpend(period, ch.key, oldTot > 0 ? cur[i] * newTot / oldTot : newTot / chans.length);
  });
  refresh();
}

function updateFcGtmCpl(period, idx, raw) {
  const ch = fcGtmChannels()[idx];
  if (!ch || period <= getCloseMonth()) return;
  ensureFcGtmState();
  if (!fcGtmState.cpl[period]) fcGtmState.cpl[period] = {};
  fcGtmState.cpl[period][ch.key] = Math.max(1, Math.round(Number(raw) || 0));
  refresh();
}

function fcGtmPipeMonth(p) {
  ensureFcGtmState();
  const close = getCloseMonth();
  const lv = getLevers();

  // Actual months: booked ARR waterfall (realized = 100% weighted).
  if (p <= close) {
    const a = (SRC.actuals && SRC.actuals[p]) || {};
    const wtdNb = Number(a.arr_nb) || 0;
    const wtdExp = Number(a.arr_exp) || 0;
    const wtdReact = Number(a.arr_react) || 0;
    const wtdCont = Number(a.arr_cont) || 0;
    const wtdChurn = Number(a.arr_churn) || 0;
    const crm = (SRC.opp_pipeline && SRC.opp_pipeline[p]) || {};
    const crmNb = crm['New Business'];
    const logos = fcGtmIsCrmBucket(crmNb) ? Number(crmNb.count) || 0 : null;
    const crmBuckets = Object.values(crm).filter(fcGtmIsCrmBucket);
    const crmDeals = crmBuckets.length ? crmBuckets.reduce((s, b) => s + (Number(b.count) || 0), 0) : null;
    const netWtd = wtdNb + wtdExp + wtdReact - wtdCont - wtdChurn;
    return {
      isActual: true,
      nb: { total: wtdNb, weighted: wtdNb, count: logos },
      exp: { total: wtdExp, weighted: wtdExp, count: 0 },
      cont: { total: wtdCont, weighted: wtdCont, count: 0 },
      churn: { total: wtdChurn, weighted: wtdChurn, count: 0 },
      react: { total: wtdReact, weighted: wtdReact, count: 0 },
      ren: { arr: 0, weighted: 0, count: 0 },
      wtdNb, wtdExp, wtdCont, wtdChurn, wtdReact, wtdRen: 0,
      grossRen: 0, renN: 0, dealN: crmDeals, logos, netWtd,
    };
  }

  const opps = SRC.opp_pipeline[p] || {};
  const ren = SRC.renewals[p] || {};
  const pick = (t) => opps[t] || { total: 0, weighted: 0, count: 0 };
  const nb = pick('New Business');
  const exp = pick('Expansion');
  const cont = pick('Contraction');
  const churn = pick('Churn');
  const react = pick('Reactivation');
  const wtdNb = (nb.weighted || 0) * (lv.nb || 1);
  const wtdExp = (exp.weighted || 0) * (lv.exp || 1);
  const wtdCont = (cont.weighted || 0) * (lv.churn || 1);
  const wtdChurn = (churn.weighted || 0) * (lv.churn || 1);
  const wtdReact = (react.weighted || 0);
  const wtdRen = (ren.weighted || 0) * (1 + (lv.ren_adj || 0));
  const dealN = (nb.count || 0) + (exp.count || 0) + (cont.count || 0) + (churn.count || 0) + (react.count || 0);
  const netWtd = wtdNb + wtdExp + wtdReact - wtdCont - wtdChurn;
  // Expected new logos = sum of open New Business win probabilities, scaled by the NB attainment lever.
  const logos = fcGtmIsCrmBucket(nb) ? (Number(nb.expected) || 0) * (lv.nb || 1) : 0;
  return {
    isActual: false,
    nb, exp, cont, churn, react, ren,
    wtdNb, wtdExp, wtdCont, wtdChurn, wtdReact, wtdRen,
    grossRen: ren.arr || 0, renN: ren.count || 0, dealN, logos, netWtd,
  };
}

const FC_GTM_BOOKING_TYPES = ['New Business', 'Expansion', 'Reactivation'];

/**
 * Pipeline book for New Business + Expansion + Reactivation, by month.
 * Closed months: the actual pipeline waterfall (SRC.pipeline_book); without it, booked ARR as won
 *   and closed-lost CRM deals as lost, open pipe unknown.
 * Forecast months: open pipe rolls from the prior month end; won = weighted deals × attainment
 *   levers (same as contract events); created / lost / slipped from the forecast pipeline waterfall.
 */
function fcGtmPipelineBooks(periods) {
  ensureFcGtmHistOpps();
  const close = getCloseMonth();
  const book = SRC.pipeline_book || {};
  const out = {};
  let prevEnd = null;
  periods.forEach(p => {
    const row = book[p] || {};
    const pipe = fcGtmPipeMonth(p);
    const opps = SRC.opp_pipeline[p] || {};
    const crmLost = FC_GTM_BOOKING_TYPES.reduce((s, t) => s + (Number((opps[t] || {}).lost_total) || 0), 0);
    const bookedWon = (pipe.wtdNb || 0) + (pipe.wtdExp || 0) + (pipe.wtdReact || 0);
    const num = v => (v != null ? Number(v) || 0 : null);
    let r;
    if (p <= close) {
      const has = row.end != null;
      r = {
        begin: has ? num(row.begin) : null,
        created: has ? num(row.created) : null,
        won: has ? num(row.won) : bookedWon,
        lost: has ? num(row.lost) : (crmLost || null),
        slipped: has ? num(row.slipped) : null,
        end: has ? num(row.end) : null,
      };
    } else {
      const created = num(row.created);
      const lost = row.lost != null ? num(row.lost) : (crmLost || null);
      const slipped = num(row.slipped);
      const end = prevEnd != null ? prevEnd + (created || 0) - bookedWon - (lost || 0) - (slipped || 0) : null;
      r = { begin: prevEnd, created, won: bookedWon, lost, slipped, end };
    }
    out[p] = r;
    prevEnd = r.end;
  });
  return out;
}

/**
 * Program spend and MQLs for a month by GL program account.
 * Closed months: the loaded MQLs, spread over accounts by spend (MQLs are loaded by marketing channel,
 * not by GL account). Forecast months: spend ÷ cost per MQL (an edit, else the loaded rate).
 * mqlSum is null when the month's MQLs or the cost per MQL are not loaded.
 */
function fcGtmAllocate(period) {
  ensureFcGtmState();
  const closed = period <= getCloseMonth();
  const cpls = fcGtmState.cpl[period] || {};
  const rates = fcGtmFunnelRates();
  const loaded = closed ? fcGtmLoadedFunnel(period) : null;
  const loadedMqls = loaded && loaded.mqls != null ? Number(loaded.mqls) : null;
  const channels = {};
  let spendTot = 0;
  fcGtmChannels().forEach(ch => { spendTot += fcGtmChannelSpend(period, ch.key); });
  let mqlSum = closed ? loadedMqls : 0;
  fcGtmChannels().forEach(ch => {
    const spend = fcGtmChannelSpend(period, ch.key);
    const mix = spendTot > 0 ? spend / spendTot : 0;
    let cpl, mqls;
    if (closed) {
      mqls = loadedMqls != null ? loadedMqls * mix : null;
      cpl = mqls ? spend / mqls : null;
    } else {
      cpl = Number(cpls[ch.key]) > 0 ? Number(cpls[ch.key]) : rates.cpl;
      mqls = cpl ? Math.max(0, spend) / cpl : null;
      if (mqls == null) mqlSum = null;
      else if (mqlSum != null) mqlSum += mqls;
    }
    channels[ch.key] = { spend, cpl, mqls, mix };
  });
  return { spendTot, channels, mqlSum };
}

/**
 * MQLs implied by New Business ARR at the loaded funnel's MQLs per $ of New Business
 * (fcGtmFunnelRates): closed months from booked New Business, forecast months from weighted New Business.
 */
function fcGtmImpliedMqls(pipe) {
  const r = fcGtmFunnelRates();
  if (r.mqlPerNb == null) return null;
  return (Number(pipe && pipe.wtdNb) || 0) * r.mqlPerNb;
}
