// \u2500\u2500 BALANCE SHEET \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function bsTotalLiabilities(d){
  if(!d) return null;
  if(d.total_liab!=null) return d.total_liab;
  if(d.total_liabilities!=null) return d.total_liabilities;
  return (d.ap||0)+(d.dr||0)+(d.debt||0)+(d.other_liab||0);
}
function bsTotalLe(d){
  if(!d) return null;
  if(d.total_le!=null) return d.total_le;
  const tl=bsTotalLiabilities(d);
  if(tl==null && d.equity==null) return d.total_assets!=null?d.total_assets:null;
  return (tl||0)+(d.equity||0);
}
function renderBS(area){
  const res=getResults();
  const cfg=HORIZON[hz];
  const allP=[...cfg.act,...cfg.fc];
  function getBS(p){
    return getDisplayBS(p);
  }
  // Prove C1: every period's BS cash === CFS ending cash (after tieBsCashToCfs).
  let tieOk=true;
  let tieMiss=0;
  allP.forEach(p=>{
    const bs=getDisplayBS(p);
    const cfs=getDisplayCFS(p);
    if(!bs||!cfs||cfs.end_cash==null||bs.cash==null) return;
    if(Math.abs(Number(bs.cash)-Number(cfs.end_cash))>=1){ tieOk=false; tieMiss++; }
  });
  const rows=[
    {type:'sec',lbl:'Assets'},
    {lbl:'Cash & Cash Equivalents',key:'cash',indent:true},
    {lbl:'Accounts Receivable',key:'ar',indent:true},
    {lbl:'Prepaids & Other Current',compute:function(d){return d.prepaids!=null?d.prepaids:2100000;},indent:true},
    {lbl:'Total Current Assets',compute:function(d){return (d.cash||0)+(d.ar||0)+(d.prepaids!=null?d.prepaids:2100000);},type:'sub'},
    {lbl:'PPE (Net)',key:'ppe',indent:true},
    {lbl:'Total Assets',compute:function(d){
      const pre=d.prepaids!=null?d.prepaids:2100000;
      const summed=(d.cash||0)+(d.ar||0)+pre+(d.ppe||0);
      // Prefer component sum when cash was tied so Current + PPE foots.
      if(d._cashTiedToCfs || d.total_assets==null) return summed;
      return d.total_assets;
    },type:'tot'},
    {type:'sec',lbl:'Liabilities'},
    {lbl:'Accounts Payable',key:'ap',indent:true},
    {lbl:'Deferred Revenue',key:'dr',indent:true},
    {lbl:'Debt',key:'debt',indent:true},
    {lbl:'Other Liabilities',key:'other_liab',indent:true},
    {lbl:'Total Liabilities',compute:bsTotalLiabilities,type:'sub'},
    {type:'sec',lbl:"Shareholders' Equity"},
    {lbl:'Total Equity',compute:function(d){
      const pre=d.prepaids!=null?d.prepaids:2100000;
      const assets=(d.cash||0)+(d.ar||0)+pre+(d.ppe||0);
      const plugged=assets-(bsTotalLiabilities(d)||0);
      // With statement DR (not RPO), stored equity after cash-tie should be near the plug.
      if(d.equity!=null && Math.abs(plugged-Number(d.equity))<250000) return d.equity;
      return plugged;
    },type:'tot'},
    {lbl:'Total Liabilities & Equity',compute:function(d){
      const pre=d.prepaids!=null?d.prepaids:2100000;
      return (d.cash||0)+(d.ar||0)+pre+(d.ppe||0);
    },type:'tot'},
  ];

  const stmtTable=buildStmtTable(allP,cfg,rows,getBS,{colorMode:'bs'});
  const tieBadge=tieOk
    ? `<span class="ts-stmt-badge ts-tie-ok">✓ Cash = CFS ending</span>`
    : `<span class="ts-stmt-badge" style="color:var(--amber)">⚠ Cash ≠ CFS in ${tieMiss} period${tieMiss===1?'':'s'}</span>`;

  area.innerHTML=`<div class="slide">
    <div class="slide-title">Balance Sheet · ${hz.replace('p','+')} Horizon</div>
    <div class="slide-sub">Cash ties to CFS ending cash ${tieOk?'<span class="tie-ok">✓</span>':'<span style="color:var(--amber)">⚠</span>'} · Deferred revenue from DR waterfall · Balance check foots after cash tie</div>
    ${buildKPIs(res)}
    <div>
        <div class="ts-stmt-hdr">
          <div class="ts-stmt-title">Balance Sheet</div>
          <span class="ts-stmt-badge ts-tie-ok">✓ Assets = Liabilities + Equity</span>
          ${tieBadge}
        </div>
        ${stmtTable}
      </div>
    </div>`;
}

// \u2500\u2500 PIPELINE DETAIL \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// ── GTM / Pipeline (top-down: CRM pipe first, marketing MQLs overlay) ─────────
const FC_MKT_SM_RATIO = 0.65;
const FC_GTM_DEFAULT_ACV = 125000;
const FC_GTM_DEFAULT_MQL_OPP = 0.28;
const FC_GTM_CHANNELS = [
  { key: 'paid_search', label: 'Paid search', defaultMix: 0.28, defaultCpl: 450 },
  { key: 'paid_social', label: 'Paid social', defaultMix: 0.18, defaultCpl: 320 },
  { key: 'content', label: 'Content / SEO', defaultMix: 0.14, defaultCpl: 160 },
  { key: 'events', label: 'Events / field', defaultMix: 0.22, defaultCpl: 650 },
  { key: 'partners', label: 'Partners', defaultMix: 0.10, defaultCpl: 280 },
  { key: 'other', label: 'Brand / other', defaultMix: 0.08, defaultCpl: 500 },
];

let fcGtmState = {
  spend: null,         // { period: program $ } — sum of channelSpend
  channelSpend: null,  // { period: { channel: $ } } — primary editable by category
  mix: null,           // { period: { channel: mix 0–1 } } — synced from channelSpend
  cpl: null,           // { period: { channel: $/MQL } }
  mqlOpp: FC_GTM_DEFAULT_MQL_OPP,
  avgAcv: FC_GTM_DEFAULT_ACV,
  seededFrom: null,
};

function fcGtmDefaultMix() {
  const o = {};
  FC_GTM_CHANNELS.forEach(ch => { o[ch.key] = ch.defaultMix; });
  return o;
}
function fcGtmDefaultCpl() {
  const o = {};
  FC_GTM_CHANNELS.forEach(ch => { o[ch.key] = ch.defaultCpl; });
  return o;
}

function ensureFcGtmState() {
  if (!fcGtmState.spend) fcGtmState.spend = {};
  if (!fcGtmState.channelSpend) fcGtmState.channelSpend = {};
  if (!fcGtmState.mix) fcGtmState.mix = {};
  if (!fcGtmState.cpl) fcGtmState.cpl = {};
  ALL_P.forEach(p => {
    if (fcGtmState.mix[p] == null) fcGtmState.mix[p] = fcGtmDefaultMix();
    if (fcGtmState.cpl[p] == null) fcGtmState.cpl[p] = fcGtmDefaultCpl();
    if (fcGtmState.spend[p] == null) {
      // Seed program spend ≈ S&M × marketing share.
      // Do NOT call getDisplayIS/getResults here — that re-enters compute().
      let sm = 0;
      if (p <= getCloseMonth()) {
        const a = SRC.actuals && SRC.actuals[p];
        sm = a && a.sm != null ? a.sm : 0;
      } else {
        const close = getCloseMonth();
        const a = SRC.actuals && SRC.actuals[close];
        const baseSm = a && a.sm != null ? a.sm : 0;
        const lv = getLevers();
        sm = baseSm > 0 ? baseSm : 0;
        if (!sm && lv && lv.sm) {
          const rev = a && a.revenue != null ? a.revenue : 0;
          sm = rev * (lv.sm || 0.34);
        }
      }
      fcGtmState.spend[p] = Math.round(sm * FC_MKT_SM_RATIO);
    }
    if (fcGtmState.channelSpend[p] == null) {
      fcGtmSyncChannelSpendFromMix(p);
    }
  });
  if (fcGtmState.mqlOpp == null) fcGtmState.mqlOpp = FC_GTM_DEFAULT_MQL_OPP;
  if (fcGtmState.avgAcv == null) fcGtmState.avgAcv = FC_GTM_DEFAULT_ACV;
  fcGtmState.seededFrom = 'sm×' + FC_MKT_SM_RATIO + '+' + getCloseMonth();
}

/** Spread program total across channels by current mix weights. */
function fcGtmSyncChannelSpendFromMix(period) {
  const tot = Math.max(0, Number(fcGtmState.spend[period]) || 0);
  const mix = fcGtmState.mix[period] || fcGtmDefaultMix();
  let rawSum = 0;
  FC_GTM_CHANNELS.forEach(ch => { rawSum += Math.max(0, Number(mix[ch.key]) || 0); });
  fcGtmState.channelSpend[period] = {};
  let allocated = 0;
  FC_GTM_CHANNELS.forEach((ch, i) => {
    const w = rawSum > 0 ? Math.max(0, Number(mix[ch.key]) || 0) / rawSum : (1 / FC_GTM_CHANNELS.length);
    const last = i === FC_GTM_CHANNELS.length - 1;
    const amt = last ? Math.max(0, tot - allocated) : Math.round(tot * w);
    fcGtmState.channelSpend[period][ch.key] = amt;
    allocated += amt;
  });
}

/** After channel $ edits: total = Σ channels, mix = share of total. */
function fcGtmSyncMixFromChannelSpend(period) {
  const row = fcGtmState.channelSpend[period] || {};
  let tot = 0;
  FC_GTM_CHANNELS.forEach(ch => { tot += Math.max(0, Number(row[ch.key]) || 0); });
  fcGtmState.spend[period] = tot;
  if (!fcGtmState.mix[period]) fcGtmState.mix[period] = fcGtmDefaultMix();
  FC_GTM_CHANNELS.forEach(ch => {
    const s = Math.max(0, Number(row[ch.key]) || 0);
    fcGtmState.mix[period][ch.key] = tot > 0 ? s / tot : 0;
  });
}

function updateFcGtmSpend(period, raw) {
  ensureFcGtmState();
  const newTot = Math.max(0, Math.round((Number(raw) || 0) * 1e6)); // input is $M
  const oldTot = Math.max(0, Number(fcGtmState.spend[period]) || 0);
  fcGtmState.spend[period] = newTot;
  if (!fcGtmState.channelSpend[period]) fcGtmSyncChannelSpendFromMix(period);
  if (oldTot > 0) {
    const scale = newTot / oldTot;
    FC_GTM_CHANNELS.forEach(ch => {
      fcGtmState.channelSpend[period][ch.key] = Math.round(
        (Number(fcGtmState.channelSpend[period][ch.key]) || 0) * scale
      );
    });
    // Fix rounding drift onto last channel
    let sum = 0;
    FC_GTM_CHANNELS.forEach((ch, i) => {
      if (i < FC_GTM_CHANNELS.length - 1) sum += fcGtmState.channelSpend[period][ch.key];
      else fcGtmState.channelSpend[period][ch.key] = Math.max(0, newTot - sum);
    });
  } else {
    fcGtmSyncChannelSpendFromMix(period);
  }
  fcGtmSyncMixFromChannelSpend(period);
  refresh();
}
function updateFcGtmChannelSpend(period, channel, raw) {
  ensureFcGtmState();
  if (!fcGtmState.channelSpend[period]) fcGtmSyncChannelSpendFromMix(period);
  fcGtmState.channelSpend[period][channel] = Math.max(0, Math.round((Number(raw) || 0) * 1e6)); // input is $M
  fcGtmSyncMixFromChannelSpend(period);
  refresh();
}
function updateFcGtmMix(period, channel, raw) {
  ensureFcGtmState();
  if (!fcGtmState.mix[period]) fcGtmState.mix[period] = fcGtmDefaultMix();
  fcGtmState.mix[period][channel] = Math.max(0, Math.min(1, (Number(raw) || 0) / 100));
  fcGtmSyncChannelSpendFromMix(period);
  refresh();
}
function updateFcGtmCpl(period, channel, raw) {
  ensureFcGtmState();
  if (!fcGtmState.cpl[period]) fcGtmState.cpl[period] = fcGtmDefaultCpl();
  fcGtmState.cpl[period][channel] = Math.max(1, Math.round(Number(raw) || 0));
  refresh();
}
function updateFcGtmRate(field, raw) {
  ensureFcGtmState();
  if (field === 'mqlOpp') fcGtmState.mqlOpp = Math.max(0.01, Math.min(1, (Number(raw) || 0) / 100));
  if (field === 'avgAcv') fcGtmState.avgAcv = Math.max(1000, Math.round(Number(raw) || 0) * 1000);
  refresh();
}

function fcGtmNormalizeMix(period) {
  ensureFcGtmState();
  const raw = fcGtmState.mix[period] || fcGtmDefaultMix();
  let sum = 0;
  FC_GTM_CHANNELS.forEach(ch => { sum += Math.max(0, Number(raw[ch.key]) || 0); });
  const weights = {};
  FC_GTM_CHANNELS.forEach(ch => {
    const v = Math.max(0, Number(raw[ch.key]) || 0);
    weights[ch.key] = sum > 0 ? v / sum : (1 / FC_GTM_CHANNELS.length);
  });
  return { weights, rawSum: sum };
}

function fcGtmPipeMonth(p) {
  ensureFcGtmState();
  const close = getCloseMonth();
  const lv = getLevers();
  const acv = Math.max(1000, Number(fcGtmState.avgAcv) || FC_GTM_DEFAULT_ACV);

  // Actual months: booked ARR waterfall (realized = 100% weighted).
  if (p <= close) {
    const a = (SRC.actuals && SRC.actuals[p]) || {};
    const wtdNb = Number(a.arr_nb) || 0;
    const wtdExp = Number(a.arr_exp) || 0;
    const wtdReact = Number(a.arr_react) || 0;
    const wtdCont = Number(a.arr_cont) || 0;
    const wtdChurn = Number(a.arr_churn) || 0;
    const logos = acv > 0 ? Math.max(0, Math.round(wtdNb / acv)) : 0;
    const netWtd = wtdNb + wtdExp + wtdReact - wtdCont - wtdChurn;
    return {
      isActual: true,
      nb: { total: wtdNb, weighted: wtdNb, count: logos },
      exp: { total: wtdExp, weighted: wtdExp, count: 0 },
      cont: { total: wtdCont, weighted: wtdCont, count: 0 },
      churn: { total: wtdChurn, weighted: wtdChurn, count: 0 },
      react: { total: wtdReact, weighted: wtdReact, count: 0 },
      ren: { arr: 0, weighted: 0, count: 0 },
      wtdNb, wtdExp, wtdCont, wtdChurn, wtdReact, wtdRen: 0,
      grossRen: 0, renN: 0, dealN: logos, logos, netWtd,
    };
  }

  const opps = SRC.opp_pipeline[p] || {};
  const ren = SRC.renewals[p] || {};
  const pick = (t) => opps[t] || { total: 0, weighted: 0, count: 0 };
  const nb = pick('New Business');
  const exp = pick('Expansion');
  const cont = pick('Contraction');
  const churn = pick('Churn');
  const react = pick('Reactivation');
  const wtdNb = (nb.weighted || 0) * (lv.nb || 1);
  const wtdExp = (exp.weighted || 0) * (lv.exp || 1);
  const wtdCont = (cont.weighted || 0) * (lv.churn || 1);
  const wtdChurn = (churn.weighted || 0) * (lv.churn || 1);
  const wtdReact = (react.weighted || 0);
  const wtdRen = (ren.weighted || 0) * (1 + (lv.ren_adj || 0));
  const dealN = (nb.count || 0) + (exp.count || 0) + (cont.count || 0) + (churn.count || 0) + (react.count || 0);
  const netWtd = wtdNb + wtdExp + wtdReact - wtdCont - wtdChurn;
  return {
    isActual: false,
    nb, exp, cont, churn, react, ren,
    wtdNb, wtdExp, wtdCont, wtdChurn, wtdReact, wtdRen,
    grossRen: ren.arr || 0, renN: ren.count || 0, dealN, logos: 0, netWtd,
  };
}

/** CRM pipeline book: pushed / won / lost / ending open — above lever-adjusted contract events. */
function fcGtmPipelineBook(p) {
  ensureFcGtmHistOpps();
  const close = getCloseMonth();
  const opps = SRC.opp_pipeline[p] || {};
  const types = ['New Business', 'Expansion', 'Reactivation', 'Contraction', 'Churn'];
  let pushed = 0;
  let wonFcst = 0;
  let lost = 0;
  types.forEach(t => {
    const bucket = opps[t] || {};
    const deals = bucket.deals || [];
    if (deals.length) {
      deals.forEach(d => {
        const arr = Number(d.arr) || 0;
        const stage = String(d.stage || '');
        const outcome = String(d.outcome || '');
        pushed += arr;
        if (/lost|closed\s*lost/i.test(stage) || /lost/i.test(outcome)) lost += arr;
        else if (/^commit$/i.test(stage) || /closed\s*won|^won$/i.test(stage) || /won/i.test(outcome)) wonFcst += arr;
      });
    } else {
      pushed += Number(bucket.total) || 0;
    }
  });
  let won;
  if (p <= close) {
    const a = (SRC.actuals && SRC.actuals[p]) || {};
    won = (Number(a.arr_nb) || 0) + (Number(a.arr_exp) || 0) + (Number(a.arr_react) || 0);
  } else {
    won = wonFcst;
  }
  const ending = pushed - won - lost;
  return { pushed, won, lost, ending };
}

function fcGtmAllocate(period) {
  ensureFcGtmState();
  if (!fcGtmState.channelSpend[period]) fcGtmSyncChannelSpendFromMix(period);
  const cpls = fcGtmState.cpl[period] || fcGtmDefaultCpl();
  const channels = {};
  let spendTot = 0;
  let mqlSum = 0;
  FC_GTM_CHANNELS.forEach(ch => {
    const spend = Math.max(0, Number(fcGtmState.channelSpend[period][ch.key]) || 0);
    spendTot += spend;
  });
  FC_GTM_CHANNELS.forEach(ch => {
    const spend = Math.max(0, Number(fcGtmState.channelSpend[period][ch.key]) || 0);
    const cpl = Math.max(1, Number(cpls[ch.key]) || ch.defaultCpl);
    const mqls = spend / cpl;
    const mix = spendTot > 0 ? spend / spendTot : 0;
    channels[ch.key] = {
      spend, cpl, mqls, mix,
      mixRaw: Number((fcGtmState.mix[period] || {})[ch.key]) || 0,
    };
    mqlSum += mqls;
  });
  fcGtmState.spend[period] = spendTot;
  return { spendTot, channels, mqlSum, mixRawSum: spendTot > 0 ? 1 : 0 };
}

/** Pipeline coverage for Budget-aligned MQL implied (Budget default 3.0×). */
const FC_GTM_PIPE_COV = 3.0;

/**
 * MQLs implied — aligned with Budget "MQLs required" funnel math:
 *   pipelineOpps = (NB$ × coverage) / ACV
 *   mqls = pipelineOpps / (MQL→Opp %)
 * Actuals: closed logos / (mqlOpp × oppClose) — same back-solve as Budget hist.
 * Note: Forecast "MQLs bought" = raw spend÷CPL; Budget channel MQLs are scaled
 * to match required (not raw spend÷CPL), so bought can diverge even at same spend.
 */
function fcGtmImpliedMqls(pipe) {
  const mqlOpp = Math.max(0.01, Number(fcGtmState.mqlOpp) || FC_GTM_DEFAULT_MQL_OPP);
  const oppClose = 0.14;
  const avgAcv = Math.max(1000, Number(fcGtmState.avgAcv) || FC_GTM_DEFAULT_ACV);
  if (pipe && pipe.isActual) {
    const logos = pipe.logos != null ? pipe.logos : (pipe.dealN || 0);
    return logos / (mqlOpp * oppClose);
  }
  const nb = Number(pipe && pipe.wtdNb) || 0;
  const pipelineOpps = avgAcv > 0 ? (nb * FC_GTM_PIPE_COV) / avgAcv : 0;
  return pipelineOpps / mqlOpp;
}

let fcGtmSelectedMonth = null;

function fcGtmMonthHeaders(periods, opts) {
  opts = opts || {};
  const selected = opts.selected || fcGtmSelectedMonth;
  return periods.map(p => {
    const mo = MO12[parseInt(p.slice(5), 10) - 1];

  }).join('') + '<th class="fy-h">FY</th>';
}

function selectFcGtmMonth(p) {

  document.querySelectorAll('.hc-tbl.gtm-pipe th.act-h, .hc-tbl.gtm-pipe th.fc-h').forEach(th => {
    th.classList.toggle('sel', th.getAttribute('onclick') === `selectFcGtmMonth('${p}')`);
  });

}

function fcGtmOppBand(prob) {
  const n = Number(prob) || 0;
  if (n >= 80) return { label: 'Must close', cls: 'must' };
  if (n >= 50) return { label: 'On the fence', cls: 'fence' };
  return { label: 'Stretch / generate', cls: 'stretch' };
}

/** Seed Jan–close historical closed-won deals from booked ARR when CRM opps are missing. */
function ensureFcGtmHistOpps() {
  if (SRC._fcGtmHistOppsSeeded) return;
  const close = getCloseMonth();
  const acv = Math.max(1000, Number(fcGtmState && fcGtmState.avgAcv) || FC_GTM_DEFAULT_ACV);
  const cust = ['Acme','Vertex','Northstar','Pioneer','Catalyst','Summit','BlueRiver','Nimbus','Evergreen','Apex'];
  const segs = ['SMB','Mid-Market','Enterprise'];
  const chans = ['Paid Search','Content Syndication','Webinar','Outbound','Partner','Organic Search'];
  const owners = ['Riley Wilson','Jordan Smith','Casey Johnson','Alex Lee','Morgan Davis'];
  function mkDeals(totalArr, type, period, seed) {
    const tot = Math.max(0, Number(totalArr) || 0);
    if (!tot) return { total: 0, weighted: 0, count: 0, deals: [] };
    const n = Math.max(2, Math.min(8, Math.round(tot / acv) || 2));
    const deals = [];
    let left = tot;
    for (let i = 0; i < n; i++) {
      const last = i === n - 1;
      const arr = last ? left : Math.round(tot / n);
      left -= arr;
      const closed = period <= close;
      const prob = closed ? 100 : (35 + ((seed + i * 17) % 50));
      deals.push({
        customer: `${cust[(seed + i) % cust.length]} ${type.slice(0, 3)} ${100 + seed + i}`,
        stage: closed ? 'Closed Won' : (prob >= 80 ? 'Commit' : prob >= 50 ? 'Negotiation' : 'Discovery'),
        segment: segs[(seed + i) % segs.length],
        region: ['West','East','Central','South'][(seed + i) % 4],
        arr, weighted: closed ? arr : Math.round(arr * prob / 100),
        prob, owner: owners[(seed + i) % owners.length],
        channel: chans[(seed + i) % chans.length], billing: 'Annual',
        outcome: closed ? 'won' : 'open',
      });
    }
    return {
      total: tot,
      weighted: deals.reduce((s, d) => s + d.weighted, 0),
      count: deals.length,
      deals,
    };
  }
  if (!SRC.opp_pipeline) SRC.opp_pipeline = {};
  ALL_P.forEach((p, idx) => {
    if (p > close) return;
    const existing = SRC.opp_pipeline[p];
    // Keep real open pipe if already present (e.g. June); only fill empty months.
    if (existing && existing['New Business'] && (existing['New Business'].deals || []).length) return;
    const a = (SRC.actuals && SRC.actuals[p]) || {};
    const seed = idx * 11 + 3;
    SRC.opp_pipeline[p] = {
      'New Business': mkDeals(a.arr_nb, 'NB', p, seed),
      'Expansion': mkDeals(a.arr_exp, 'Exp', p, seed + 1),
      'Reactivation': mkDeals(a.arr_react, 'Rea', p, seed + 2),
      'Contraction': mkDeals(a.arr_cont, 'Con', p, seed + 3),
      'Churn': mkDeals(a.arr_churn, 'Chu', p, seed + 4),
    };
  });
  SRC._fcGtmHistOppsSeeded = true;
}


function fcGtmMoneyCells(periods, getter, { editable, onchange, cls, units } = {}) {
  const toDisp = (v) => {
    const n = Number(v) || 0;
    if (units === 'm') return Math.round((n / 1e6) * 100) / 100;
    if (units === 'k') return Math.round(n / 1000);
    return Math.round(n);
  };
  const fmt = (v) => {
    if (!v) return '—';
    if (units === 'm') return fM(v, 2);
    if (units === 'k') return toDisp(v).toLocaleString();
    return fM(v, 1);
  };
  const cells = periods.map(p => {
    const v = getter(p);
    const c = cls ? cls(p) : (p > getCloseMonth() ? 'fc-c' : 'act-c');
    if (editable && editable(p)) {
      const step = units === 'm' ? 0.05 : (units === 'k' ? 1 : 1000);
      const tip = units === 'm' ? 'Enter $ millions' : (units === 'k' ? 'Enter $ thousands' : 'Enter dollars');
      return `<td class="${c}"><input class="hc-hire" style="width:52px;max-width:100%" type="number" min="0" step="${step}" value="${toDisp(v)}"
        onchange="${onchange(p)}" title="${tip}"></td>`;
    }
    return `<td class="${c}">${fmt(v)}</td>`;
  }).join('');
  const fy = periods.reduce((s, p) => s + (Number(getter(p)) || 0), 0);
  return cells + `<td class="fy-c">${fmt(fy)}</td>`;
}

function fcGtmNumCells(periods, getter, fmt) {
  const cells = periods.map(p => {
    const v = getter(p);
    const c = p > getCloseMonth() ? 'fc-c' : 'act-c';
    return `<td class="${c}">${fmt(v)}</td>`;
  }).join('');
  const fy = periods.reduce((s, p) => s + (Number(getter(p)) || 0), 0);
  return cells + `<td class="fy-c">${fmt(fy)}</td>`;
}

}

/** Renewal focus band — At Risk / low health escalate; Commit+high prob = must retain. */
function fcGtmRenewalBand(r) {
  const stage = String(r.stage || '');
  const prob = Number(r.prob) || 0;
  const risk = Number(r.risk) || 0;
  const health = Number(r.health) != null ? Number(r.health) : 100;
  if (/at\s*risk/i.test(stage) || risk >= 70 || health <= 40) {
    return { label: 'At risk — save', cls: 'stretch' };
  }
  if (/commit/i.test(stage) || prob >= 90) {
    return { label: 'Must retain', cls: 'must' };
  }
  if (prob >= 70 || /likely/i.test(stage)) {
    return { label: 'Watch', cls: 'fence' };
  }
  return { label: 'At risk — save', cls: 'stretch' };
}

// ── Forecast HC plan (Budget-aligned tables; no operating levers / levels) ──
const FC_HC_FY26_MONTHLY = {
  sales:     [26, 27, 28, 28, 28, 29, 31, 31, 31, 31, 31, 31],
  cs:        [15, 15, 15, 16, 16, 17, 17, 17, 18, 18, 18, 18],
  marketing: [13, 13, 13, 14, 14, 15, 15, 15, 16, 16, 16, 16],
  rd:        [54, 55, 56, 56, 58, 61, 62, 64, 64, 65, 65, 65],
  ga:        [13, 14, 14, 14, 14, 15, 15, 15, 16, 16, 17, 17],
};
const FC_HC_DEPTS = [
  { key: 'sales', label: 'Sales - New Business', fromReqs: true, srcDepts: ['Sales'] },
  { key: 'cs', label: 'Sales - Customer Success', fromReqs: true, srcDepts: ['Customer Success', 'Support'] },
  { key: 'marketing', label: 'Marketing', srcDepts: ['Marketing'] },
  { key: 'rd', label: 'R&D / Product', srcDepts: ['R&D', 'Product'] },
  { key: 'ga', label: 'G&A', srcDepts: ['G&A', 'Finance'] },
];
const FC_HC_EDITABLE = FC_HC_DEPTS.filter(d => !d.fromReqs);

let fcHcState = {
  focus: 'total', // total | marketing | rd | ga
  hires: null,    // { period: { dept: netHires } }
  rifs: [],       // { id, period, dept, heads, weeks }
  attritionPct: null, // { dept: annual % } — exits spread across forecast months
  freeze: { marketing: false, rd: false, ga: false },
  seededFrom: null,
};

function fcHcMapReqDept(dept) {
  const d = String(dept || '');
  for (const row of FC_HC_DEPTS) {
    if (row.srcDepts.some(x => x === d)) return row.key;
  }
  return null;
}

function fcHcEmptyHires() {
  const out = {};
  ALL_P.forEach(p => {
    out[p] = {};
    FC_HC_DEPTS.forEach(d => { out[p][d.key] = 0; });
  });
  return out;
}

function fcHcHistHires(dept, monthIdx) {
  const series = FC_HC_FY26_MONTHLY[dept];
  if (!series || monthIdx <= 0) return 0;
  return (series[monthIdx] || 0) - (series[monthIdx - 1] || 0);
}

function fcHcCloseBop() {
  const idx = parseInt(getCloseMonth().slice(5), 10) - 1;
  const bop = {};
  let sum = 0;
  FC_HC_DEPTS.forEach(d => {
    const v = (FC_HC_FY26_MONTHLY[d.key] && FC_HC_FY26_MONTHLY[d.key][idx] != null)
      ? FC_HC_FY26_MONTHLY[d.key][idx]
      : 0;
    bop[d.key] = v;
    sum += v;
  });
  // If board WF total differs slightly, keep dept mix and note in UI via sum.
  bop._total = sum;
  bop._closeHc = getCloseHc();
  return bop;
}

function seedFcHcFromOpenReqs(force) {
  if (fcHcState.hires && !force) return;
  const hires = fcHcEmptyHires();
  // Actual months: MoM change from known FY26 path
  ALL_P.forEach((p, i) => {
    if (p > getCloseMonth()) return;
    FC_HC_DEPTS.forEach(d => {
      hires[p][d.key] = fcHcHistHires(d.key, i);
    });
  });
  // Forecast months: one head per active open req in start month
  (SRC.open_reqs || []).forEach(r => {
    if (!reqActive[r.id]) return;
    const key = fcHcMapReqDept(r.dept);
    if (!key || !r.start || !hires[r.start]) return;
    if (r.start <= getCloseMonth()) return;
    hires[r.start][key] = (hires[r.start][key] || 0) + 1;
  });
  fcHcState.hires = hires;
  fcHcState.seededFrom = 'open_reqs+' + getCloseMonth();
}

function ensureFcHcState() {
  seedFcHcFromOpenReqs(false);
  if (!Array.isArray(fcHcState.rifs)) fcHcState.rifs = [];
  if (!fcHcState.attritionPct || typeof fcHcState.attritionPct !== 'object') {
    fcHcState.attritionPct = {};
  }
  FC_HC_DEPTS.forEach(d => {
    if (fcHcState.attritionPct[d.key] == null) fcHcState.attritionPct[d.key] = 0;
  });
  if (!fcHcState.freeze || typeof fcHcState.freeze !== 'object') {
    fcHcState.freeze = { marketing: false, rd: false, ga: false };
  }
  FC_HC_EDITABLE.forEach(d => {
    if (fcHcState.freeze[d.key] == null) fcHcState.freeze[d.key] = false;
  });
}

function setFcHcFreeze(dept, on) {
  ensureFcHcState();
  if (!FC_HC_EDITABLE.some(d => d.key === dept)) return;
  fcHcState.freeze[dept] = !!on;
  markScenarioDirty();
  refresh();
}

function updateFcHcAttritionPct(dept, raw) {
  ensureFcHcState();
  fcHcState.attritionPct[dept] = Math.max(0, Math.min(40, Math.round(Number(raw) || 0)));
  refresh();
}

/** Spread ceil(BOP × annual%) across forecast months (actuals stay locked). */
function fcHcAttritionSchedule(bop) {
  const sched = {};
  ALL_P.forEach(p => {
    sched[p] = {};
    FC_HC_DEPTS.forEach(d => { sched[p][d.key] = 0; });
  });
  const nFc = Math.max(1, FC_P.length);
  FC_HC_DEPTS.forEach(d => {
    const pct = Math.max(0, Number(fcHcState.attritionPct[d.key]) || 0) / 100;
    const annual = Math.ceil((bop[d.key] || 0) * pct);
    if (!annual) return;
    const base = Math.floor(annual / nFc);
    let rem = annual - base * nFc;
    FC_P.forEach((p, i) => {
      sched[p][d.key] = base + (i < rem ? 1 : 0);
    });
  });
  return sched;
}

function fcHcRifsForPeriod(period) {
  return (fcHcState.rifs || []).filter(r => r.period === period);
}

function computeFcHcPlan() {
  ensureFcHcState();
  const bop = fcHcCloseBop();
  const close = getCloseMonth();
  const closeIdx = parseInt(close.slice(5), 10) - 1;
  const attrSched = fcHcAttritionSchedule(bop);
  const plan = {};
  let running = {};
  FC_HC_DEPTS.forEach(d => { running[d.key] = bop[d.key]; });

  ALL_P.forEach((p, i) => {
    const hires = {};
    const rifExits = {};
    const attrition = {};
    const ending = {};
    let hireTot = 0;
    let rifTot = 0;
    let attrTot = 0;

    FC_HC_DEPTS.forEach(d => {
      let h = 0;
      let rifH = 0;
      let attrH = 0;
      if (p <= close) {
        h = fcHcHistHires(d.key, i);
        ending[d.key] = FC_HC_FY26_MONTHLY[d.key][i];
        if (i === closeIdx) running[d.key] = ending[d.key];
      } else {
        h = Number((fcHcState.hires[p] && fcHcState.hires[p][d.key]) || 0);
        // Hire freeze: block growth hires; exits / RIF / attrition still apply
        if (fcHcState.freeze && fcHcState.freeze[d.key] && h > 0) h = 0;
        rifH = fcHcRifsForPeriod(p)
          .filter(r => r.dept === d.key)
          .reduce((s, r) => s + (Number(r.heads) || 0), 0);
        attrH = Number((attrSched[p] && attrSched[p][d.key]) || 0);
        running[d.key] = Math.max(0, (running[d.key] || 0) + h - rifH - attrH);
        ending[d.key] = running[d.key];
      }
      hires[d.key] = h;
      rifExits[d.key] = rifH;
      attrition[d.key] = attrH;
      hireTot += h;
      rifTot += rifH;
      attrTot += attrH;
    });

    const headsTotal = FC_HC_DEPTS.reduce((s, d) => s + (ending[d.key] || 0), 0);
    plan[p] = { hires, rifExits, attrition, ending, hireTot, rifTot, attrTot, headsTotal, isActual: p <= close };
  });
  plan._bop = bop;
  return plan;
}

function setFcHcFocus(focus) {
  fcHcState.focus = focus || 'total';
  refresh();
}

function updateFcHcHire(period, dept, raw) {
  ensureFcHcState();
  if (period <= getCloseMonth()) return;
  const n = Math.max(-20, Math.min(20, Math.round(Number(raw) || 0)));
  if (!fcHcState.hires[period]) fcHcState.hires[period] = {};
  fcHcState.hires[period][dept] = n;
  refresh();
}

function addFcHcRif() {
  ensureFcHcState();
  const id = 'rif_' + Date.now();
  const period = FC_P[0] || ALL_P[ALL_P.length - 1];
  fcHcState.rifs.push({ id, period, dept: 'rd', heads: 3, weeks: 12 });
  refresh();
}

function updateFcHcRif(id, field, value) {
  const rif = (fcHcState.rifs || []).find(r => r.id === id);
  if (!rif) return;
  if (field === 'heads' || field === 'weeks') rif[field] = Math.max(0, Math.round(Number(value) || 0));
  else rif[field] = value;
  refresh();
}

function removeFcHcRif(id) {
  fcHcState.rifs = (fcHcState.rifs || []).filter(r => r.id !== id);
  refresh();
}

function resetFcHcFromOpenReqs() {
  seedFcHcFromOpenReqs(true);
  refresh();
}

function fcHcHireClass(n) {
  if (n > 0) return 'pos';
  if (n < 0) return 'neg';
  return '';
}

function fcHcHireInput(period, dept, value) {
  const locked = period <= getCloseMonth();
  const n = Number(value) || 0;
  if (locked) {
    return `<span class="act-c">${n ? ((n > 0 ? '+' : '') + n) : '—'}</span>`;
  }
  return `<input class="hc-hire ${fcHcHireClass(n)}" type="number" min="-20" max="20" step="1" value="${n}"
    onchange="updateFcHcHire('${period}','${dept}',this.value)" title="Positive = hire, negative = exit" />`;
}

function fcHcMonthHeaders() {
  return ALL_P.map(p => {
    const mo = MO12[parseInt(p.slice(5), 10) - 1];
    const isFc = p > getCloseMonth();
    return `<th class="${isFc ? 'fc-h' : 'act-h'}"><span class="hc-mo">${mo}</span><span class="hc-tag">${isFc ? 'Fcst' : 'Act'}</span></th>`;
  }).join('') + '<th class="fy-h">FY</th>';
}

function fcHcSum(vals) {
  return vals.reduce((s, v) => s + (Number(v) || 0), 0);
}

function renderFcHcHireRow(label, dept, plan, editable) {
  const cells = ALL_P.map(p => {
    const v = plan[p].hires[dept] || 0;
    if (editable) return `<td class="fc-c">${fcHcHireInput(p, dept, v)}</td>`;
    const cls = p > getCloseMonth() ? 'fc-c' : 'act-c';
    return `<td class="${cls}">${v ? ((v > 0 ? '+' : '') + v) : '—'}</td>`;
  }).join('');
  const fy = fcHcSum(ALL_P.map(p => plan[p].hires[dept] || 0));
  return `<tr class="${editable ? 'adj' : ''}"><td>${label}</td>${cells}<td class="fy-c">${fy ? ((fy > 0 ? '+' : '') + fy) : '—'}</td></tr>`;
}

function fcHcTable(inner) {
  return `<div class="hc-wrap"><table class="hc-tbl">${inner}</table></div>`;
}

function fcHcBridgeTable(inner) {
  return `<div class="hc-wrap"><table class="hc-tbl bridge">${inner}</table></div>`;
}

  const res=getResults();

  const dec=FC_P[FC_P.length-1];
  const dec_arr=res[dec].arr.arr_eop;
  const dec_cash=res[dec].cfs.end_cash;
  const h2_ebitda=FC_P.reduce((s,p)=>s+(res[p]?.is?.ebitda||0),0);
  const name=prompt(`Name this ${status==='final'?'FINAL':'draft'} version:`,`${hz.replace('p','+')} ${status==='final'?'Final':'Draft'} ${new Date().toLocaleDateString()}`);

  if(status==='final'){

  const vid='V'+Date.now();
  versions.unshift({

  if(status==='final'){

}

function toCSV(rows){
  if(!rows.length) return '';
  const keys=Object.keys(rows[0]);
  const escape=v=>{const s=String(v??'');return s.includes(',')||s.includes('"')||s.includes('\n')?`"${s.replace(/"/g,'""')}"`:s;};
  return [keys.join(','),...rows.map(r=>keys.map(k=>escape(r[k])).join(','))].join('\n');
}

function downloadAllCSVs(csvs,vid,name){
  Object.entries(csvs).forEach(([filename,content],i)=>{
    setTimeout(()=>{
      const blob=new Blob([content],{type:'text/csv'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    },i*300);
  });
  alert(`\u2713 Promoted to FINAL: "${name}"\n\n${Object.keys(csvs).length} CSV files downloading now.\nLoad them into your warehouse using forecast_versions_registry.csv as the manifest.`);
}

function downloadDraftCSV(vid){
  const v=versions.find(x=>x.id===vid);
  if(!v) return;
  const csvs=generateAllCSVs(v.results,v.lv,vid);
  Object.entries(csvs).forEach(([filename,content],i)=>{
    setTimeout(()=>{
      const blob=new Blob([content],{type:'text/csv'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    },i*300);
  });
}

      <span style="font-size:10px;color:var(--text3)">Final versions lock assumptions and download all Forecast_* CSVs automatically</span>
    </div>
    ${versions.length===0?`<div style="padding:30px;text-align:center;color:var(--text3);font-size:13px">No versions saved yet.<br>Save a draft to iterate, or promote to final when you're ready to report.</div>`:`
    <div>
      ${versions.map(v=>`<div class="ver-row">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="ver-name">${v.name}</span>
            <span class="badge ${v.status==='final'?'badge-final':v.status==='superseded'?'badge-super':'badge-draft'}">${v.status==='final'?'\u2713 Final':v.status==='superseded'?'Superseded':'Draft'}</span>
            <span style="font-size:9.5px;padding:2px 7px;border-radius:10px;background:var(--bg2);border:0.5px solid var(--border);color:var(--text3)">${v.horizon.replace('p','+')} horizon</span>
          </div>
          <div class="ver-meta">${v.ts} . NB ${Math.round(v.nb_att*100)}% . Churn ${Math.round(v.churn*100)}% . ${v.active_reqs} reqs . Ren adj ${v.ren_adj>=0?'+':''}${Math.round(v.ren_adj*100)}pp</div>
        </div>
        <div class="ver-stats">
          <div style="color:var(--teal)">${fM(v.dec_arr,1)} ARR</div>
          <div>${fM(v.dec_cash,1)} cash</div>
          <div style="color:${v.h2_ebitda>=0?'var(--teal)':'var(--red)'}">${fM(v.h2_ebitda,1)} EBITDA</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;margin-left:8px">
          ${v.status!=='final'?`<button class="act-btn success" style="font-size:10px;padding:4px 10px" onclick="promoteVersion('${v.id}')">\u2191 Promote</button>`:''}
          <button class="act-btn outline" style="font-size:10px;padding:4px 10px" onclick="downloadDraftCSV('${v.id}')">\u2193 CSVs</button>
          ${v.status!=='final'?`<button class="act-btn outline" style="font-size:10px;padding:4px 10px;color:var(--red)" onclick="deleteVersion('${v.id}')">\u2715</button>`:''}
        </div>
      </div>`).join('')}
    </div>`}
  </div>`;
}

function promoteVersion(id){
  const v=versions.find(x=>x.id===id);
  if(!v||!confirm(`Promote "${v.name}" to FINAL? This will supersede the current final version and download CSVs.`)) return;
  versions.forEach(x=>{if(x.status==='final') x.status='superseded';});
  v.status='final';
  const csvs=generateAllCSVs(v.results,v.lv,id);
  downloadAllCSVs(csvs,id,v.name);
  showTab('versions');
}

function deleteVersion(id){
  if(!confirm('Delete this draft version?')) return;
  versions=versions.filter(v=>v.id!==id);
  showTab('versions');
}

// \u2500\u2500 INIT \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// Open-req hire toggles removed — Sales/CS hires seed from open_reqs into the Headcount grid.
updLabels();

// ─── SKIN ENGINE (shared with Board Platform) ───────────────────────────────
(function () {
  SMPLSkin.init("skinSelect", function () {
    if (document.getElementById("slideArea")?.children.length > 0) {
      showTab(curTab);
    }
  });
  if (window.SMPLOutlook && outlookDataReady() && window.SMPLOutlook.buildAlignmentReport) {
    console.info("[forecast-engine] demo alignment", window.SMPLOutlook.buildAlignmentReport(ALL_P, getCloseMonth()));
  } else if (!outlookDataReady()) {
    console.error("[forecast-engine] Demo seed missing — check /shared/smpl-bootstrap-demo.js");
  }
  showTab("overview");
})();

</script>
</div>

<script>
/* SMPL warehouse hydration + draft/promote API wiring */
(function(){
  async function smplOrgId(){
    return window.SMPLOutlook.resolveOrgId({ waitForParent: true });
  }
  function setWarehouseStatus(text, tone) {
    var el = document.getElementById('warehouseStatus');
    if (!el) return;
    el.textContent = text;
    el.style.color = tone === 'ok' ? 'var(--teal)' : tone === 'warn' ? 'var(--amber)' : 'var(--text2)';
  }
  async function smplHydrate(){
    if (!outlookDataReady()) {
      setWarehouseStatus('Demo seed unavailable — hard refresh (Ctrl+Shift+R)', 'warn');
    } else {
      setWarehouseStatus('Demo data (embedded seed)', 'warn');
    }
    await window.SMPLOutlook.hydrate({
      endpoint: 'reporting/outlook',
      hooks: {
        SRC: SRC,
        TS_DATA: window.SMPL_DEMO_TS_DATA,
        WF_TABLE: window.SMPL_DEMO_WF_TABLE,
      },
      onStatus: setWarehouseStatus,
      onApplied: function (data) {
        if (window.SMPLProvenance && typeof window.SMPLProvenance.ingestOutlook === 'function') {
          window.SMPLProvenance.ingestOutlook(data);
        }
        // Warehouse actuals (e.g. June ARR) land in SRC after first paint — must
        // bust the compute cache or Overview keeps the demo-seed Dec ARR ($91.1M).
        if (typeof markScenarioDirty === 'function') markScenarioDirty();
        else if (typeof invalidateCfsChain === 'function') invalidateCfsChain();
        if (typeof refresh === 'function') refresh({ skipDirty: true });
        if (window.SMPLProvenance) {
          try {
            window.SMPLProvenance.annotateDom(document);
            window.SMPLProvenance.runTieOut();
          } catch (e) { console.warn('[forecast-engine] provenance', e); }
        }
        if (window.SMPLOutlook && window.SMPLOutlook.buildAlignmentReport) {
          console.info('[forecast-engine] alignment', window.SMPLOutlook.buildAlignmentReport(ALL_P, getCloseMonth()));
        }
      },
    });
  }
  window.saveVersion=async function(status){
    const orgId=await smplOrgId();
    if(!orgId){alert('Sign in to save forecast versions.');return;}
    if (status === 'final' && window.SMPLProvenance && typeof window.SMPLProvenance.gatePublish === 'function') {
      var gate = window.SMPLProvenance.gatePublish({ closeMonth: window.SMPL_CLOSE_MONTH || CLOSE_MONTH });
      if (gate.blocked) {
        alert('FINAL promote blocked — tie-out failed (forceBlock).\n\n' + (gate.message || '') + '\n\nClient HTML tie-out report downloaded when available.');
        return;
      }
      if (gate.result && !gate.result.passed) {
        console.warn('[forecast-engine] tie-out advisory (FINAL promote proceeds)', gate.message);
        alert(
          'FINAL promote proceeding.\n\nClient tie-out report downloaded (advisory). ' +
            'Forecast gaps are OK to review; production actuals should be fixed at import/close.\n\n' +
            (gate.message || ''),
        );
      }
    }
    const res=getResults();
    const lv=getLevers();
    const name=prompt('Name this '+(status==='final'?'FINAL':'draft')+' version:','Forecast '+new Date().toLocaleDateString());
    if(!name) return;
    const vid='V'+Date.now();
    const asOf=window.SMPL_CLOSE_MONTH||CLOSE_MONTH;
    const tables=typeof buildForecastTableRows==='function'?buildForecastTableRows(res,lv,vid,orgId,asOf):{};
    const body={
      version_name:name,
      as_of_period:asOf,
      levers:lv,
      req_active:reqActive,
      results:{engine:res},
      tables:tables
    };
    const draftRes=await fetch('/api/v1/forecast/versions/draft?organization_id='+encodeURIComponent(orgId),{
      method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
    });
    if(!draftRes.ok){alert('Draft save failed: '+await draftRes.text());return;}
    const draft=await draftRes.json();
    if(status==='final'){
      const promoteRes=await fetch('/api/v1/forecast/versions/'+draft.id+'/promote?organization_id='+encodeURIComponent(orgId),{
        method:'POST',credentials:'include'
      });
      if(!promoteRes.ok){alert('Promote failed: '+await promoteRes.text());return;}
      alert('Promoted to FINAL and loaded into warehouse.');
      await smplHydrate();
    } else {
      alert('Draft saved server-side.');
    }
    if(typeof showTab==='function') showTab('versions',null);
  };
  window.SMPL_ON_ORG_READY=function(){void smplHydrate();};
  window.addEventListener('load',()=>{void smplHydrate();});

  /**
   * Plan Assurance Forecast adapter — same /assess engine as Budget.
   * Packet built from live Forecast SoT (see buildForecastAssurancePacket).
   */
  window.buildForecastAssurancePacket = function() {
    if (typeof buildFcAssurancePacket === 'function') return buildFcAssurancePacket();
    return null;
  };

  window.runForecastPlanAssessment = async function(opts) {
    opts = opts || {};
    const packet = opts.packet || window.buildForecastAssurancePacket();
    if (!packet) { console.warn('[forecast-assurance] no packet'); return null; }
    let orgId = opts.orgId;
    if (!orgId && window.SMPLOutlook && window.SMPLOutlook.resolveOrgId) {
      try { orgId = await window.SMPLOutlook.resolveOrgId({ waitForParent: true }); } catch (e) { orgId = null; }
    }
    if (!orgId) { console.warn('[forecast-assurance] no org'); return null; }
    const forecastVersionId = opts.forecast_version_id != null
      ? opts.forecast_version_id
      : (window._warehouseForecastVersionId || null);
    const simulation = opts.simulation !== undefined
      ? opts.simulation
      : (typeof fcSimulationSummaryFromMc === 'function'
        ? fcSimulationSummaryFromMc(window._forecastServerMc)
        : null);
    const body = {
      plan_ref: {
        organization_id: orgId,
        forecast_version_id: forecastVersionId,
        scenario: 'forecast',
        period_label: packet.period_label,
        budget_year: packet.budget_year,
      },
      packet,
      persist: !!forecastVersionId,
      include_passing_conditions: false,
    };
    if (simulation) body.simulation = simulation;
    const res = await fetch('/api/v1/predictive-planning/assess', {
      method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) { console.warn('[forecast-assurance] /assess failed', res.status, await res.text()); return null; }
    const assessment = await res.json();
    window._forecastPlanAssessment = assessment;
    window._forecastPlanAssessmentAt = Date.now();
    return assessment;
  };
})();
</script>
