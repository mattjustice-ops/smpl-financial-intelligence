/**
 * Client packet Monte Carlo — mirrors backend run_packet_monte_carlo so Forecast
 * Generate scenarios works on localhost even when /simulate is unreachable.
 * Stress frequencies under stated priors — not calibrated PoA.
 */
function fcMcPctl(sorted, q) {
  if (!sorted || !sorted.length) return 0;
  if (sorted.length === 1) return sorted[0];
  const idx = q * (sorted.length - 1);
  const lo = Math.floor(idx);
  const hi = Math.ceil(idx);
  if (lo === hi) return sorted[lo];
  const w = idx - lo;
  return sorted[lo] * (1 - w) + sorted[hi] * w;
}
function fcMcMean(vals) {
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
}
function fcMcSd(vals, mu) {
  if (vals.length < 2) return 0;
  return Math.sqrt(vals.reduce((s, v) => s + (v - mu) * (v - mu), 0) / (vals.length - 1));
}
function fcMcHist(samples, bins) {
  bins = bins || 16;
  if (!samples.length) return { bins: [], counts: [], mean: 0, n: 0 };
  let lo = Math.min.apply(null, samples);
  let hi = Math.max.apply(null, samples);
  if (hi <= lo) hi = lo + 1;
  const width = (hi - lo) / bins;
  const counts = Array(bins).fill(0);
  samples.forEach(v => {
    const i = Math.min(bins - 1, Math.floor((v - lo) / width));
    counts[i] += 1;
  });
  const edges = Array.from({ length: bins + 1 }, (_, i) => lo + i * width);
  return { bins: edges, counts, mean: fcMcMean(samples), n: samples.length };
}
/** Mulberry32 seeded RNG — deterministic like Python random.Random(seed) enough for UI. */
function fcMcRng(seed) {
  let t = (seed >>> 0) || 1;
  return function() {
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function fcMcGauss(rand) {
  // Box-Muller
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

const FC_MC_DEFAULT_PRIORS = { yoyPp: 3.2, cplLog: 0.28, attrPp: 2.5, pipe: 0.55, cashResidMo: 0.04 };
const FC_MC_METHOD = 'monte_carlo_packet_lever_shocks_open_month_cash_flow';
const FC_DEMO_ORG_ID = '8571e520-0687-4516-bdee-379f37c58c1f';

function runFcPacketMonteCarlo(packet, opts) {
  opts = opts || {};
  const n = opts.n || 1000;
  const seed = opts.seed != null ? opts.seed : 42;
  const sig = Object.assign({}, FC_MC_DEFAULT_PRIORS, opts.priors || {});
  const priorSource = opts.prior_source || 'client_packet_fallback';
  const rand = fcMcRng(seed);

  const bop = Number(packet.bopArr) || 0;
  const target = Number(packet.targetArr) || 0;
  const baseYoy = Number(packet.yoyGrowthPct) || 20;
  const endCash = Number(packet.endCash) || 0;
  const cashFloor = Number(packet.cashFloor) || 1e7;
  const salesEnd = Number(packet.salesEnd) || 0;
  const aeNeeded = Number(packet.aeNeeded) || 0;
  let cashByMonth = (packet.cashByMonth || []).map(v => Number(v) || 0);
  if (cashByMonth.length < 12) {
    while (cashByMonth.length < 12) cashByMonth.push(endCash);
    cashByMonth = cashByMonth.slice(0, 12);
  }

  const arrSamples = [];
  const cashSamples = [];
  const troughSamples = [];
  const paths = [];
  let pArr = 0, pCash = 0, pAe = 0, pOps = 0, pTrough = 0, pWatch25 = 0;

  for (let i = 0; i < n; i++) {
    const dy = fcMcGauss(rand) * sig.yoyPp;
    const dcpl = Math.exp(fcMcGauss(rand) * sig.cplLog);
    const hirePct = Number(packet.hirePct) || 10;
    const dattr = Math.max(0, hirePct + fcMcGauss(rand) * sig.attrPp);
    const basePipe = Number(packet.pipelineCoverage) || 3;
    const dpipe = Math.max(1, basePipe + fcMcGauss(rand) * sig.pipe);

    const shockedYoy = Math.max(0, baseYoy + dy);
    const cplDrag = Math.min(0.25, Math.max(-0.05, (dcpl - 1) * 0.15));
    const pipeBoost = Math.min(0.08, Math.max(-0.12, (dpipe - 3) * 0.02));
    const decArr = bop * (1 + shockedYoy / 100) * (1 - cplDrag + pipeBoost);

    const aeNeedShock = aeNeeded * (1 + Math.max(0, (dattr - 10) / 100) * 0.2);
    const aeShort = salesEnd < aeNeedShock;

    // Pin closed months; shock open-month net change (not the whole cash stock).
    let flowScale = 1 - (dy / 100) * 1.15 - (dcpl - 1) * 0.45;
    flowScale = Math.max(0.25, Math.min(1.85, flowScale));
    const closeIdx = Math.max(0, Math.min(10,
      packet.closeMonthIdx != null ? Number(packet.closeMonthIdx)
        : (typeof CLOSE_MO_IDX === 'number' ? CLOSE_MO_IDX : 5)));
    const residSd = Math.max(250000, Math.abs(endCash) * (sig.cashResidMo != null ? sig.cashResidMo : 0.04));
    const path = cashByMonth.slice();
    for (let m = closeIdx + 1; m < 12; m++) {
      const planDelta = cashByMonth[m] - cashByMonth[m - 1];
      const step = fcMcGauss(rand) * residSd;
      path[m] = Math.max(0, path[m - 1] + planDelta * flowScale + step);
    }
    const trialEnd = path[path.length - 1];
    const openSlice = path.slice(closeIdx);
    const trialTrough = Math.min.apply(null, openSlice.length ? openSlice : path);

    arrSamples.push(decArr);
    cashSamples.push(trialEnd);
    troughSamples.push(trialTrough);
    paths.push(path);

    if (decArr < target * 0.995) pArr += 1;
    if (trialEnd < cashFloor) pCash += 1;
    if (aeShort) pAe += 1;
    const drop = (endCash - trialEnd) / Math.max(1, endCash);
    if (trialEnd < cashFloor || drop >= 0.5) pOps += 1;
    if (trialEnd <= endCash * 0.75) pWatch25 += 1;
    if (trialTrough < cashFloor) pTrough += 1;
  }

  const monthly = [];
  for (let m = 0; m < 12; m++) {
    const col = paths.map(p => p[m]).sort((a, b) => a - b);
    monthly.push({
      month_index: m,
      p10: fcMcPctl(col, 0.10),
      p25: fcMcPctl(col, 0.25),
      p50: fcMcPctl(col, 0.50),
      p75: fcMcPctl(col, 0.75),
      p90: fcMcPctl(col, 0.90),
      pBelowFloor: col.filter(v => v < cashFloor).length / n,
    });
  }

  const arrSorted = arrSamples.slice().sort((a, b) => a - b);
  const cashSorted = cashSamples.slice().sort((a, b) => a - b);
  const troughSorted = troughSamples.slice().sort((a, b) => a - b);
  const arrMu = fcMcMean(arrSamples);
  const cashMu = fcMcMean(cashSamples);
  const troughMu = fcMcMean(troughSamples);

  const result = {
    n,
    seed,
    sig: { yoyPp: sig.yoyPp, cplLog: sig.cplLog, attrPp: sig.attrPp, pipe: sig.pipe, cashResidMo: sig.cashResidMo },
    method: FC_MC_METHOD,
    prior_source: priorSource,
    p_arr_miss: pArr / n,
    p_cash_below_floor: pCash / n,
    p_ops_liquidity: pOps / n,
    p_ae_short: pAe / n,
    p_trough_breach: pTrough / n,
    arr: {
      hist: fcMcHist(arrSamples),
      mean: arrMu,
      sd: fcMcSd(arrSamples, arrMu),
      p10: fcMcPctl(arrSorted, 0.10),
      p50: fcMcPctl(arrSorted, 0.50),
      p90: fcMcPctl(arrSorted, 0.90),
      pMiss: pArr / n,
    },
    cash: {
      hist: fcMcHist(cashSamples),
      mean: cashMu,
      sd: fcMcSd(cashSamples, cashMu),
      p10: fcMcPctl(cashSorted, 0.10),
      p50: fcMcPctl(cashSorted, 0.50),
      p90: fcMcPctl(cashSorted, 0.90),
      pBreak: pCash / n,
      pWatch25: pWatch25 / n,
    },
    p_cash_watch_25: pWatch25 / n,
    trough: {
      hist: fcMcHist(troughSamples),
      mean: troughMu,
      sd: fcMcSd(troughSamples, troughMu),
      p10: fcMcPctl(troughSorted, 0.10),
      p50: fcMcPctl(troughSorted, 0.50),
      p90: fcMcPctl(troughSorted, 0.90),
      pBreachAnyMonth: pTrough / n,
    },
    cash_path: { monthly, trough: null },
    method_notes: [
      `Client packet Monte Carlo n=${n}, seed=${seed}, method=${FC_MC_METHOD}.`,
      `Priors source: ${priorSource}.`,
      'Stress frequency under stated priors — not calibrated Probability of Attainment.',
      'Closed months pinned; open months re-roll net cash change under lever flow shocks + residual WC noise so the Jul–Dec fan opens.',
    ],
    simulation_summary: {
      trials: n,
      breaks: [],
      watches: [],
      p_arr_miss: pArr / n,
      p_cash_below_floor: pCash / n,
      p_ops_liquidity: pOps / n,
      p_ae_short: pAe / n,
      priors: {
        yoyPp: sig.yoyPp, cplLog: sig.cplLog, attrPp: sig.attrPp, pipe: sig.pipe,
        source: priorSource, seed, method: FC_MC_METHOD, p_trough_breach: pTrough / n,
      },
    },
  };
  result.trough = result.trough;
  result.cash_path.trough = result.trough;
  return result;
}

async function fetchForecastMonteCarlo(opts){
  opts = opts || {};
  const packet = opts.packet || buildFcAssurancePacket();
  const n = opts.n || 1000;
  const seed = opts.seed != null ? opts.seed : (window._forecastMcSeed || 42);
  const allowClient = opts.allowClient !== false;
  const serverTimeoutMs = opts.serverTimeoutMs != null ? opts.serverTimeoutMs : 8000;

  const applyResult = (result, methodCard, source) => {
    window._forecastMcSeed = seed;
    window._forecastServerMc = result;
    window._forecastMcMethodCard = methodCard || {
      source: source || 'client_packet_fallback',
      priors: (result && result.sig) || FC_MC_DEFAULT_PRIORS,
      notes: (result && result.method_notes) || [],
      not_claimed: ['calibrated Probability of Attainment', 'AutoML forecasting'],
    };
    window._forecastMcAt = Date.now();
    window._forecastMcSource = source || 'server';
    return { result, method_card: window._forecastMcMethodCard, prior_source: source };
  };

  let orgId = opts.orgId;
  if (!orgId && window.SMPLOutlook && window.SMPLOutlook.resolveOrgId) {
    try { orgId = await window.SMPLOutlook.resolveOrgId({ waitForParent: false }); } catch (e) { orgId = null; }
  }
  if (!orgId) orgId = FC_DEMO_ORG_ID;

  try {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), serverTimeoutMs) : null;
    const res = await fetch('/api/v1/predictive-planning/simulate', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({
        plan_ref: {
          organization_id: orgId,
          forecast_version_id: window._warehouseForecastVersionId || null,
          scenario: 'forecast',
          period_label: packet.period_label,
          budget_year: packet.budget_year,
        },
        packet,
        n_trials: n,
        seed,
        history: null,
        breaks: [],
        watches: [],
      }),
    });
    if (timer) clearTimeout(timer);
    if (res.ok) {
      const data = await res.json();
      return applyResult(data.result || null, data.method_card || null, data.prior_source || 'server');
    }
    console.warn('[forecast-assurance] /simulate failed — client MC fallback', res.status);
  } catch (e) {
    console.warn('[forecast-assurance] /simulate unreachable — client MC fallback', e && e.message);
  }

  if (!allowClient) return null;
  // Yield so progress UI can paint before sync MC work
  await new Promise(r => setTimeout(r, 20));
  const result = runFcPacketMonteCarlo(packet, { n, seed, prior_source: 'client_packet_fallback' });
  return applyResult(result, null, 'client_packet_fallback');
}

function renderFcCorridorSvg(packet, mc){
  const plan = (packet.cashByMonth || []).map(v => Number(v) || 0);
  const monthly = (((mc || {}).cash_path || {}).monthly) || [];
  const floor = packet.cashFloor != null ? packet.cashFloor : 1e7;
  if (!plan.length) return '<div class="pa-meta">No cash path on packet.</div>';

  const W = 900, H = 260, PL = 48, PR = 16, PT = 16, PB = 36;
  const n = Math.max(plan.length, 12);
  const p10 = [], p50 = [], p90 = [];
  for (let i = 0; i < n; i++) {
    const m = monthly[i] || {};
    p10.push(m.p10 != null ? m.p10 : plan[i]);
    p50.push(m.p50 != null ? m.p50 : plan[i]);
    p90.push(m.p90 != null ? m.p90 : plan[i]);
  }
  const all = plan.concat(p10, p90, [floor]);
  let lo = Math.min.apply(null, all.filter(v => v != null));
  let hi = Math.max.apply(null, all.filter(v => v != null));
  if (!(hi > lo)) { lo = lo * 0.9; hi = hi * 1.1 || 1; }
  const pad = (hi - lo) * 0.08;
  lo -= pad; hi += pad;
  const xAt = (i) => PL + (i / Math.max(1, n - 1)) * (W - PL - PR);
  const yAt = (v) => PT + (1 - ((v - lo) / (hi - lo || 1))) * (H - PT - PB);
  const linePath = (arr) => arr.map((v, i) => `${i ? 'L' : 'M'}${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
  const band = p90.map((v, i) => `${i ? 'L' : 'M'}${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ')
    + ' ' + p10.slice().reverse().map((v, j) => {
      const i = n - 1 - j;
      return `L${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`;
    }).join(' ') + ' Z';
  const labels = (typeof MO12 !== 'undefined' ? MO12 : ['J','F','M','A','M','J','J','A','S','O','N','D']).slice(0, n);
  const floorY = yAt(floor);
  let ticks = '';
  labels.forEach((lab, i) => {
    ticks += `<text x="${xAt(i).toFixed(1)}" y="${H - 10}" text-anchor="middle" fill="var(--text3)" font-size="10">${lab}</text>`;
  });
  const hasMc = !!(monthly && monthly.length);
  return `<svg class="pa-corridor-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Forecast cash corridor">
    ${hasMc ? `<path d="${band}" fill="var(--accent)" opacity="0.12"></path>` : ''}
    <line x1="${PL}" x2="${W - PR}" y1="${floorY.toFixed(1)}" y2="${floorY.toFixed(1)}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="4,3"/>
    ${hasMc ? `<path d="${linePath(p50)}" fill="none" stroke="var(--text3)" stroke-width="1.25" stroke-dasharray="3,2"/>` : ''}
    <path d="${linePath(plan)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    ${ticks}
    <text x="${W - PR}" y="${Math.max(PT + 10, floorY - 4).toFixed(1)}" text-anchor="end" fill="var(--red)" font-size="10">floor ${fM(floor, 1)}</text>
  </svg>`;
}

/* Forecast Plan Assurance · lane 3 predictive suite (Budget craft parity, packet shocks).
   Plain JS globals — spliced into forecast-engine/index.html. Do not redefine fM/fV/fcPctLbl/MO12/
   buildFcAssurancePacket/fetchForecastMonteCarlo/curTab/renderAnalytics. */

const FC_PA_CHIP_ORDER = [
  'top_deal_slip', 'commit_slip', 'renewal_miss', 'nb_attain_soft',
  'exp_stall', 'churn_wave', 'late_book_miss', 'pipe_cover_thin',
];

const FC_CASH_WATCH_PCT = 0.03;           // relative Dec cash drop → watch
const FC_MATERIAL_WATCH_$ = 1e6;        // ≥$1M on ARR / cash / EBITDA → amber watch
const FC_MATERIAL_BREAK_$ = 2.5e6;      // ≥$2.5M → break / red (renewal-scale hits)
const FC_MATERIAL_CASH_$ = FC_MATERIAL_WATCH_$;
const FC_MATERIAL_ARR_$ = FC_MATERIAL_WATCH_$;
const FC_MATERIAL_EBITDA_$ = FC_MATERIAL_WATCH_$;

function fcEsc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
}

function fcClonePacket(p) {
  try { return JSON.parse(JSON.stringify(p || {})); }
  catch (e) { return Object.assign({}, p || {}); }
}

function fcFmtDeal$(n) {
  const v = Number(n) || 0;
  if (Math.abs(v) >= 1e6) return '$' + (v / 1e6).toFixed(2) + 'M';
  if (Math.abs(v) >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'k';
  return '$' + v.toFixed(0);
}

function fcMoLbl(p) {
  const mo = (typeof MO12 !== 'undefined' ? MO12 : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']);
  const i = parseInt(String(p).slice(5), 10) - 1;
  return mo[i] || String(p);
}

/** Open-month opportunity + renewal book — the Forecast SoT for PA scenarios. */
function fcCollectOpenDeals() {
  const close = (typeof getCloseMonth === 'function' ? getCloseMonth() : (typeof CLOSE_MONTH !== 'undefined' ? CLOSE_MONTH : '2026-06'));
  const periods = (typeof FC_P !== 'undefined' && FC_P.length) ? FC_P.slice()
    : (typeof ALL_P !== 'undefined' ? ALL_P.filter(p => p > close) : []);
  const oppTypes = ['New Business', 'Expansion', 'Reactivation', 'Contraction', 'Churn'];
  const deals = [];
  const byPeriod = {};
  let wtdNb = 0, wtdExp = 0, wtdReact = 0, wtdCont = 0, wtdChurn = 0;
  let renGross = 0, renWtd = 0, renCount = 0;

  periods.forEach(p => {
    byPeriod[p] = { nb: 0, exp: 0, ren: 0, deals: [] };
    const opps = (typeof SRC !== 'undefined' && SRC.opp_pipeline && SRC.opp_pipeline[p]) || {};
    oppTypes.forEach(typ => {
      const bucket = opps[typ] || {};
      const w = Number(bucket.weighted) || 0;
      if (typ === 'New Business') { wtdNb += w; byPeriod[p].nb += w; }
      else if (typ === 'Expansion') { wtdExp += w; byPeriod[p].exp += w; }
      else if (typ === 'Reactivation') wtdReact += w;
      else if (typ === 'Contraction') wtdCont += w;
      else if (typ === 'Churn') wtdChurn += w;
      (bucket.deals || []).forEach(d => {
        const arr = Number(d.arr) || 0;
        const prob = Number(d.prob) != null ? Number(d.prob) : 50;
        const weighted = Number(d.weighted) != null ? Number(d.weighted) : arr * (prob / 100);
        // Risk $ = ARR we still need to win (or stop losing) — high ARR + low win prob.
        const loseRisk = typ === 'Churn' || typ === 'Contraction'
          ? weighted
          : arr * Math.max(0, 1 - prob / 100);
        const row = {
          period: p, periodLbl: fcMoLbl(p), type: typ,
          customer: d.customer || 'Deal', stage: d.stage || '',
          segment: d.segment || '', channel: d.channel || '',
          arr, prob, weighted, loseRisk,
          kind: 'opp',
        };
        deals.push(row);
        byPeriod[p].deals.push(row);
      });
    });
    const ren = (typeof SRC !== 'undefined' && SRC.renewals && SRC.renewals[p]) || {};
    renGross += Number(ren.arr) || 0;
    renWtd += Number(ren.weighted) || 0;
    renCount += Number(ren.count) || 0;
    byPeriod[p].ren = Number(ren.weighted) || 0;
    (ren.deals || []).forEach(d => {
      const arr = Number(d.arr) || 0;
      const prob = Number(d.prob) != null ? Number(d.prob) : 95;
      const riskScore = Number(d.risk) != null ? Number(d.risk) : 50;
      const health = Number(d.health) != null ? Number(d.health) : 75;
      const loseRisk = arr * Math.max(0.05, (100 - prob) / 100) * (0.5 + riskScore / 200);
      const row = {
        period: p, periodLbl: fcMoLbl(p), type: 'Renewal',
        customer: d.customer || 'Renewal', stage: d.stage || 'Renewal',
        segment: '', channel: d.csm || '',
        arr, prob, weighted: arr * (prob / 100), loseRisk,
        riskScore, health, kind: 'renewal',
      };
      deals.push(row);
      byPeriod[p].deals.push(row);
    });
  });

  const topByArr = deals.slice().sort((a, b) => b.arr - a.arr).slice(0, 8);
  // Win-path risk for scenario chips: NB/Exp/Renewal still to convert — not churn events.
  const topLoseRisk = deals
    .filter(d => d.type === 'New Business' || d.type === 'Expansion' || d.kind === 'renewal')
    .sort((a, b) => b.loseRisk - a.loseRisk).slice(0, 8);
  const topChurnRisk = deals
    .filter(d => d.type === 'Churn' || d.type === 'Contraction')
    .sort((a, b) => b.loseRisk - a.loseRisk).slice(0, 5);
  const commitSlip = deals.filter(d => /commit|negotiation|proposal/i.test(d.stage || '') && d.kind === 'opp' && (d.type === 'New Business' || d.type === 'Expansion'))
    .sort((a, b) => b.weighted - a.weighted).slice(0, 6);
  const peakPeriod = periods.slice().sort((a, b) => {
    const sa = (byPeriod[a].nb || 0) + (byPeriod[a].exp || 0);
    const sb = (byPeriod[b].nb || 0) + (byPeriod[b].exp || 0);
    return sb - sa;
  })[0] || periods[0];

  return {
    periods,
    close,
    deals,
    byPeriod,
    wtdNb, wtdExp, wtdReact, wtdCont, wtdChurn,
    renGross, renWtd, renCount,
    renRate: renGross > 0 ? renWtd / renGross : 0.95,
    topByArr,
    topLoseRisk,
    topChurnRisk,
    commitSlip,
    peakPeriod,
    peakLbl: peakPeriod ? fcMoLbl(peakPeriod) : '',
    peakPipe: peakPeriod ? ((byPeriod[peakPeriod].nb || 0) + (byPeriod[peakPeriod].exp || 0)) : 0,
    openWtdPipe: wtdNb + wtdExp + wtdReact,
  };
}

function fcHorizonCtx(packet) {
  const ctx = fcCollectOpenDeals();
  ctx.packet = packet || {};
  ctx.coverX = Number((packet && packet.pipelineCoverage) || 3);
  ctx.decArr = Number((packet && packet.decArr) || 0);
  ctx.endCash = Number((packet && packet.endCash) || 0);
  return ctx;
}

/** Scale / burn a 12-mo cash path. Prefer open-month flow shock when closeIdx known. */
function fcScaleCashPath(cashByMonth, scale, burnPerMonth) {
  const src = (cashByMonth || []).map(v => Number(v) || 0);
  const n = Math.max(12, src.length);
  const sc = scale != null ? Number(scale) : 1;
  const burn = burnPerMonth || 0;
  const out = [];
  let cum = 0;
  for (let i = 0; i < n; i++) {
    const base = src[i] != null ? src[i] : (src[src.length - 1] || 0);
    cum += burn * Math.pow(i / Math.max(1, n - 1), 1.25);
    out.push(base * sc - cum);
  }
  return out.slice(0, 12);
}

/** ARR $ miss → open-month cash path (collections / WC follow the book). */
function fcCashPathFromArrMiss(base, arrMiss$, intensity) {
  const src = (base.cashByMonth || []).map(v => Number(v) || 0);
  const closeIdx = base.closeMonthIdx != null ? Number(base.closeMonthIdx)
    : (typeof CLOSE_MO_IDX === 'number' ? CLOSE_MO_IDX : 5);
  const miss = Math.max(0, Number(arrMiss$) || 0);
  const k = intensity != null ? intensity : 0.42; // ~portion of ARR that shows in H2 cash
  const cashHit = miss * k;
  const path = src.slice();
  const openN = Math.max(1, 11 - closeIdx);
  let prev = closeIdx >= 0 ? (path[closeIdx] != null ? path[closeIdx] : path[0]) : path[0];
  for (let m = 0; m < 12; m++) {
    if (m <= closeIdx) { prev = path[m]; continue; }
    const planDelta = (src[m] != null ? src[m] : prev) - (src[m - 1] != null ? src[m - 1] : prev);
    const u = (m - closeIdx) / openN;
    const hit = cashHit * (u * u); // late-year weighted
    // redistribute so total Dec hit ≈ cashHit
    path[m] = prev + planDelta - (cashHit / openN) * (0.55 + 0.9 * u);
    prev = path[m];
  }
  // renormalize Dec delta toward -cashHit for interpretability
  if (path.length >= 12 && src.length >= 12) {
    const rawDecDelta = path[11] - src[11];
    if (Math.abs(rawDecDelta) > 1 && cashHit > 0) {
      const scale = (-cashHit) / rawDecDelta;
      prev = path[closeIdx];
      for (let m = closeIdx + 1; m < 12; m++) {
        const planDelta = src[m] - src[m - 1];
        const shockedDelta = (path[m] - path[m - 1]);
        const adj = planDelta + (shockedDelta - planDelta) * Math.min(1.8, Math.max(0.4, scale));
        path[m] = path[m - 1] + adj;
      }
    }
  }
  return path.slice(0, 12);
}

function fcPathStats(cashByMonth) {
  const path = (cashByMonth || []).map(v => Number(v) || 0);
  let minCash = null, minIdx = 0;
  for (let i = 0; i < path.length; i++) {
    if (minCash == null || path[i] < minCash) { minCash = path[i]; minIdx = i; }
  }
  const endCash = path.length ? path[path.length - 1] : null;
  const mo = (typeof MO12 !== 'undefined' ? MO12 : null);
  return {
    endCash,
    minCash,
    minCashPeriod: mo && mo[minIdx] != null ? mo[minIdx] : String(minIdx + 1),
    cashByMonth: path,
  };
}

function fcMergeShock(base, fields) {
  const s = fcClonePacket(base);
  Object.keys(fields || {}).forEach(k => { s[k] = fields[k]; });
  if (fields && fields.cashByMonth) {
    const st = fcPathStats(fields.cashByMonth);
    if (fields.endCash == null) s.endCash = st.endCash;
    if (fields.minCash == null) s.minCash = st.minCash;
    if (fields.minCashPeriod == null) s.minCashPeriod = st.minCashPeriod;
  }
  return s;
}

function fcArrFromYoy(base, yoyPct) {
  const bop = Number(base.bopArr) || 0;
  if (bop > 0) return bop * (1 + yoyPct / 100);
  const baseYoy = Number(base.yoyGrowthPct) || 0;
  const ratio = (1 + yoyPct / 100) / Math.max(0.01, 1 + baseYoy / 100);
  return (Number(base.decArr) || 0) * ratio;
}

function fcNnBridge(base, decArr) {
  const bop = Number(base.bopArr) || 0;
  const fyNn = decArr - bop;
  const oldNn = Number(base.fyNn) || 0;
  const scale = oldNn !== 0 ? fyNn / oldNn : 1;
  return {
    fyNn,
    fyNb: (Number(base.fyNb) || 0) * Math.max(0.2, scale),
    fyChurn: Number(base.fyChurn) || 0,
  };
}

function fcShockFromArrMiss(base, arrMiss$, opts) {
  opts = opts || {};
  const miss = Math.max(0, Number(arrMiss$) || 0);
  const decArr = Math.max(0, (Number(base.decArr) || 0) - miss);
  const path = fcCashPathFromArrMiss(base, miss, opts.cashPerArr != null ? opts.cashPerArr : 0.42);
  const st = fcPathStats(path);
  const bridge = fcNnBridge(base, decArr);
  return {
    decArr,
    endCash: st.endCash,
    minCash: st.minCash,
    minCashPeriod: st.minCashPeriod,
    cashByMonth: path,
    fyEbitda: (Number(base.fyEbitda) || 0) - miss * (opts.ebitdaPerArr != null ? opts.ebitdaPerArr : 0.55),
    fyMkt: Number(base.fyMkt) || 0,
    yoyGrowthPct: Number(base.yoyGrowthPct) || 0,
    pipelineCoverage: opts.pipe != null ? opts.pipe : (Number(base.pipelineCoverage) || 3),
    fyNn: bridge.fyNn,
    fyNb: opts.fyNb != null ? opts.fyNb : bridge.fyNb,
    fyChurn: opts.fyChurn != null ? opts.fyChurn : bridge.fyChurn,
    evidence: opts.evidence || null,
  };
}

/**
 * Forecast-native stress cases — built from this horizon's opp_pipeline + renewals.
 * Not Budget CPL / paid-channel grammar.
 */
function buildFcScenarioCaseDefs(packet) {
  const ctx = fcHorizonCtx(packet);
  const topRisk = ctx.topLoseRisk[0];
  const top2 = ctx.topLoseRisk.slice(0, 3);
  const topRiskMiss = top2.reduce((s, d) => s + (d.arr || 0), 0);
  const commitMiss = ctx.commitSlip.slice(0, 4).reduce((s, d) => s + (d.weighted || 0), 0);
  const renHaircut = Math.max(ctx.renGross * 0.08, ctx.renGross - ctx.renWtd * 0.9);
  const nbSoft = ctx.wtdNb * 0.25;
  const expSoft = ctx.wtdExp * 0.30;
  const churnHit = Math.max(ctx.wtdChurn, ctx.wtdCont) * 1.15;
  const peakMiss = ctx.peakPipe * 0.45;
  const coverNow = ctx.coverX;

  const nameTop = topRisk
    ? (topRisk.customer.length > 28 ? topRisk.customer.slice(0, 26) + '…' : topRisk.customer)
    : 'Top open deal';
  const topsLbl = top2.length
    ? top2.map(d => d.customer.split(' ')[0] + ' ' + fcFmtDeal$(d.arr)).join(', ')
    : 'largest open opps';

  return [
    {
      id: 'top_deal_slip', family: 'pipeline',
      chipPlain: topRisk ? ((topRisk.kind === 'renewal' ? 'Renewal at risk: ' : 'Miss ') + nameTop) : 'Largest open deals slip',
      chipTech: 'Top unconverted NB/Exp/Renewal ARR',
      label: topRisk ? ((topRisk.kind === 'renewal' ? 'Renewal at risk: ' : 'Miss ') + nameTop) : 'Largest open deals slip',
      plain: topRisk
        ? (nameTop + ' (' + topRisk.type + ', ' + topRisk.periodLbl + ', ' + topRisk.prob + '% win) is the biggest unconverted ARR still in the open book. Stack the next-riskiest win-path deals and Dec ARR moves.')
        : 'The largest open opportunities miss — Forecast ARR is weighted pipeline, not a growth rate lever.',
      apply: (base) => fcShockFromArrMiss(base, topRiskMiss || ctx.wtdNb * 0.2, {
        evidence: { deals: top2, kind: 'top_lose_risk' },
        fyNb: Math.max(0, (Number(base.fyNb) || 0) - topRiskMiss * 0.7),
      }),
    },
    {
      id: 'commit_slip', family: 'pipeline',
      chipPlain: 'Commit / late-stage slips',
      chipTech: 'Commit+Negotiation+Proposal weighted miss',
      label: 'Commit / late-stage slips',
      plain: ctx.commitSlip.length
        ? ('Late-stage book (' + ctx.commitSlip.slice(0, 2).map(d => d.customer.split(' ')[0]).join(', ') + '…) looks won in the forecast — if stage slips, weighted ARR of ' + fcFmtDeal$(commitMiss) + ' does not land.')
        : 'Late-stage opportunities that carry forecast weight slip out of Commit.',
      apply: (base) => fcShockFromArrMiss(base, commitMiss || ctx.wtdNb * 0.18, {
        evidence: { deals: ctx.commitSlip.slice(0, 4), kind: 'commit' },
        cashPerArr: 0.48,
      }),
    },
    {
      id: 'renewal_miss', family: 'retention',
      chipPlain: 'Renewal book softens',
      chipTech: 'Open-month renewal rate / risk haircut',
      label: 'Renewal book softens',
      plain: 'Open-month renewals are ' + fcFmtDeal$(ctx.renGross) + ' gross / ' + fcFmtDeal$(ctx.renWtd) + ' weighted (' +
        ((ctx.renRate * 100).toFixed(0)) + '%). A soft cohort takes cash and forces NB to refill the hole.',
      apply: (base) => {
        const miss = renHaircut || (Number(base.fyChurn) || 0) * 0.35;
        const shock = fcShockFromArrMiss(base, miss, {
          evidence: { renGross: ctx.renGross, renWtd: ctx.renWtd, renRate: ctx.renRate },
          fyChurn: (Number(base.fyChurn) || 0) + miss,
          cashPerArr: 0.55,
        });
        return shock;
      },
    },
    {
      id: 'nb_attain_soft', family: 'pipeline',
      chipPlain: 'NB attainment −25%',
      chipTech: 'NB lever 1.0 → 0.75 on weighted NB',
      label: 'NB attainment −25%',
      plain: 'New-business weighted pipeline in open months is ' + fcFmtDeal$(ctx.wtdNb) +
        '. The Forecast NB lever cutting 25% is how ops usually miss — not a CPL story.',
      apply: (base) => fcShockFromArrMiss(base, nbSoft, {
        evidence: { wtdNb: ctx.wtdNb, lever: 0.75 },
        fyNb: (Number(base.fyNb) || 0) * 0.75,
        cashPerArr: 0.40,
      }),
    },
    {
      id: 'exp_stall', family: 'pipeline',
      chipPlain: 'Expansion stalls',
      chipTech: 'Expansion weighted −30%',
      label: 'Expansion stalls',
      plain: 'Expansion weighted book is ' + fcFmtDeal$(ctx.wtdExp) +
        ' across open months. CS-led upsell slowing shows up in Dec ARR before the P&L fully feels it.',
      apply: (base) => fcShockFromArrMiss(base, expSoft, {
        evidence: { wtdExp: ctx.wtdExp },
        cashPerArr: 0.38,
      }),
    },
    {
      id: 'churn_wave', family: 'retention',
      chipPlain: 'Churn / contraction lands',
      chipTech: 'Open churn+contraction pipeline realizes',
      label: 'Churn / contraction lands',
      plain: 'Open churn/contraction weighted risk is about ' + fcFmtDeal$(ctx.wtdChurn + ctx.wtdCont) +
        '. If those deals close against us, GRR and cash both move.',
      apply: (base) => {
        const miss = churnHit || (Number(base.fyChurn) || 0) * 0.4;
        return fcShockFromArrMiss(base, miss, {
          evidence: { wtdChurn: ctx.wtdChurn, wtdCont: ctx.wtdCont },
          fyChurn: (Number(base.fyChurn) || 0) + miss,
          cashPerArr: 0.50,
        });
      },
    },
    {
      id: 'late_book_miss', family: 'pipeline',
      chipPlain: ctx.peakLbl ? (ctx.peakLbl + ' book misses') : 'Peak-month book misses',
      chipTech: 'Peak open-month pipe ×0.55',
      label: ctx.peakLbl ? (ctx.peakLbl + ' book misses') : 'Peak-month book misses',
      plain: (ctx.peakLbl || 'Peak') + ' carries ' + fcFmtDeal$(ctx.peakPipe) +
        ' of weighted NB+Expansion — the heaviest single month in the remainder of the year.',
      apply: (base) => fcShockFromArrMiss(base, peakMiss || ctx.openWtdPipe * 0.15, {
        evidence: { peakPeriod: ctx.peakPeriod, peakPipe: ctx.peakPipe },
        cashPerArr: 0.45,
      }),
    },
    {
      id: 'pipe_cover_thin', family: 'pipeline',
      chipPlain: 'Coverage slips a turn',
      chipTech: 'Pipeline cover −1.0× vs ' + coverNow.toFixed(1) + '×',
      label: 'Coverage slips a turn',
      plain: 'Horizon coverage is about ' + coverNow.toFixed(1) +
        '× on weighted open pipe of ' + fcFmtDeal$(ctx.openWtdPipe) +
        '. Losing a full turn means NB attainment cannot clear the Dec ARR plan.',
      apply: (base) => {
        const pipe = Math.max(1, coverNow - 1);
        const drag = Math.min(0.14, Math.max(0.04, (coverNow - pipe) * 0.045));
        const miss = (Number(base.decArr) || 0) * drag;
        return fcShockFromArrMiss(base, miss, {
          pipe,
          evidence: { coverFrom: coverNow, coverTo: pipe },
          fyNb: (Number(base.fyNb) || 0) * (1 - drag),
          cashPerArr: 0.36,
        });
      },
    },
  ];
}

function fcClassifyScenarioOutcome(base, shock) {
  const breaks = [];
  const watches = [];
  const baseCash = Math.max(1, Number(base.endCash) || 1);
  const dCash = (Number(shock.endCash) || 0) - (Number(base.endCash) || 0);
  const cashDropPct = -dCash / baseCash; // positive = cash down vs plan
  const dArr = (Number(shock.decArr) || 0) - (Number(base.decArr) || 0);
  const dEbitda = (Number(shock.fyEbitda) || 0) - (Number(base.fyEbitda) || 0);
  const floor = Number(base.cashFloor) || 1e7;
  const impact$ = Math.max(Math.abs(dCash), Math.abs(dArr), Math.abs(dEbitda));

  if ((Number(shock.endCash) || 0) < floor) {
    breaks.push('Dec cash floor');
  } else if (shock.minCash != null && Number(shock.minCash) < floor) {
    watches.push('Mid-year cash trough vs floor');
  }
  if (cashDropPct >= 0.50) {
    breaks.push('Cash down ≥50% vs plan');
  }

  // Material $ bands (dynamic): ≥$2.5M break, ≥$1M watch, else hold — not every tiny ARR miss.
  if (impact$ >= FC_MATERIAL_BREAK_$) {
    if (Math.abs(dCash) >= FC_MATERIAL_BREAK_$) breaks.push('Dec cash move ≥$2.5M');
    else if (Math.abs(dArr) >= FC_MATERIAL_BREAK_$) breaks.push('Dec ARR move ≥$2.5M');
    else breaks.push('FY EBITDA move ≥$2.5M');
  } else if (impact$ >= FC_MATERIAL_WATCH_$ || cashDropPct >= FC_CASH_WATCH_PCT) {
    if (Math.abs(dCash) >= FC_MATERIAL_WATCH_$) watches.push('Dec cash move ≥$1M');
    else if (Math.abs(dArr) >= FC_MATERIAL_WATCH_$) watches.push('Dec ARR move ≥$1M');
    else if (Math.abs(dEbitda) >= FC_MATERIAL_WATCH_$) watches.push('FY EBITDA move ≥$1M');
    else if (cashDropPct >= FC_CASH_WATCH_PCT) watches.push('Cash down ≥3% vs plan');
  }

  if (shock.salesEnd != null && shock.aeNeeded != null && shock.salesEnd < shock.aeNeeded) breaks.push('NB AE cover');
  if (shock.csEnd != null && shock.csNeeded != null && shock.csEnd < shock.csNeeded) breaks.push('CS cover');
  if ((Number(shock.fyEbitda) || 0) < 0 && (Number(base.fyEbitda) || 0) >= 0 && impact$ >= FC_MATERIAL_WATCH_$) {
    watches.push('EBITDA turns negative');
  }
  // Pipeline cover alone is a watch only when the $ impact already clears the bar.
  if (impact$ >= FC_MATERIAL_WATCH_$ &&
      shock.pipelineCoverage != null && base.pipelineMin != null &&
      Number(shock.pipelineCoverage) + 1e-9 < Number(base.pipelineMin)) {
    watches.push('Pipeline cover vs min');
  }

  let status = 'ok';
  if (breaks.length) status = 'break';
  else if (watches.length) status = 'watch';
  return { status, breaks, watches, cashDropPct, dCash, dArr, dEbitda, impact$ };
}

function fcExplainScenarioCase(base, c, def) {
  const bits = [];
  if (def && def.plain) bits.push(def.plain);
  if (c.yoyGrowthPct != null && base.yoyGrowthPct != null &&
      Math.abs(c.yoyGrowthPct - base.yoyGrowthPct) >= 0.05) {
    const d = c.yoyGrowthPct - base.yoyGrowthPct;
    bits.push(
      `YoY ending-ARR growth moves from ${Number(base.yoyGrowthPct).toFixed(1)}% to ${Number(c.yoyGrowthPct).toFixed(1)}% ` +
      `(${d > 0 ? '+' : ''}${d.toFixed(1)} percentage points — not a −5% cut to revenue).`
    );
  }
  if (Math.abs(c.dArr || 0) >= 1000) {
    bits.push(`Dec ARR ${fM(base.decArr, 1)} → ${fM(c.decArr, 1)} (${fV(c.dArr)} vs plan).`);
  }
  if (Math.abs(c.dCash || 0) >= 1000) {
    const vsFloor = (c.endCash || 0) - (base.cashFloor || 0);
    const dropPct = base.endCash > 0 ? (base.endCash - c.endCash) / base.endCash : 0;
    bits.push(
      `Dec cash ${fM(base.endCash, 1)} → ${fM(c.endCash, 1)} (${fV(c.dCash)}, ${(dropPct * 100).toFixed(0)}% vs plan); ` +
      `${vsFloor >= 0 ? fM(vsFloor, 1) + ' above' : fM(Math.abs(vsFloor), 1) + ' below'} the ${fM(base.cashFloor, 1)} floor` +
      (c.minCash < c.endCash ? `; trough ${fM(c.minCash, 1)}` : '') + '.'
    );
  }
  if (Math.abs(c.dMkt || 0) >= 1000) {
    bits.push(`Marketing program spend ${fM(c.fyMkt - c.dMkt, 1)} → ${fM(c.fyMkt, 1)} (${fV(c.dMkt)}).`);
  }
  if (Math.abs(c.dEbitda || 0) >= 1000) {
    bits.push(`FY EBITDA ${fM(c.fyEbitda - c.dEbitda, 1)} → ${fM(c.fyEbitda, 1)} (${fV(c.dEbitda)}).`);
  }
  if (c.breaks && c.breaks.length) bits.push(`Flags: ${c.breaks.join('; ')}.`);
  else if (c.watches && c.watches.length) bits.push(`Watch: ${c.watches.join('; ')}.`);
  return bits.join(' ');
}

function evaluateFcScenarioShock(def, base) {
  const fields = def.apply(base) || {};
  const shock = fcMergeShock(base, fields);
  const cls = fcClassifyScenarioOutcome(base, shock);
  const row = {
    id: def.id,
    label: def.label,
    family: def.family,
    status: cls.status,
    breaks: cls.breaks,
    watches: cls.watches,
    cashDropPct: cls.cashDropPct,
    decArr: shock.decArr,
    dArr: (shock.decArr || 0) - (base.decArr || 0),
    endCash: shock.endCash,
    dCash: (shock.endCash || 0) - (base.endCash || 0),
    minCash: shock.minCash,
    cashByMonth: (shock.cashByMonth || []).slice(),
    cashPathM: (shock.cashByMonth || []).map(v => Number(v || 0) / 1e6),
    fyEbitda: shock.fyEbitda,
    dEbitda: (shock.fyEbitda || 0) - (base.fyEbitda || 0),
    fyMkt: shock.fyMkt,
    dMkt: (shock.fyMkt || 0) - (base.fyMkt || 0),
    yoyGrowthPct: shock.yoyGrowthPct,
    pipelineCoverage: shock.pipelineCoverage,
    fyNn: shock.fyNn,
    fyNb: shock.fyNb,
    fyChurn: shock.fyChurn,
    chipPlain: def.chipPlain || def.label,
    chipTech: def.chipTech || def.label,
    evidence: shock.evidence || null,
    xp: def.plain || '',
    plain: def.plain || '',
  };
  row.explain = fcExplainScenarioCase(base, row, def);
  return row;
}

function buildFcScenarioNarrativeFromSuite(suite) {
  const cases = (suite && suite.cases) || [];
  const base = (suite && suite.base) || {};
  const ctx = fcCollectOpenDeals();
  const lines = [];
  const top = ctx.topLoseRisk[0];
  lines.push(
    'This Forecast stress run uses the open-month opportunity pipeline and renewal book ' +
    '(not Budget growth/CPL levers). Weighted open NB+Exp is ' + fcFmtDeal$(ctx.openWtdPipe) +
    '; renewals ' + fcFmtDeal$(ctx.renGross) + ' gross / ' + fcFmtDeal$(ctx.renWtd) + ' weighted.'
  );
  if (top) {
    lines.push(
      'Highest single miss on the board: ' + top.customer + ' — ' + top.type + ' in ' + top.periodLbl +
      ', ' + fcFmtDeal$(top.arr) + ' ARR at ' + top.prob + '% win (risk $ ' + fcFmtDeal$(top.loseRisk) + ').'
    );
  }
  if (ctx.peakPeriod) {
    lines.push(
      'Heaviest remaining month: ' + ctx.peakLbl + ' with ' + fcFmtDeal$(ctx.peakPipe) + ' weighted NB+Expansion.'
    );
  }
  const breaks = cases.filter(c => c.status === 'break');
  const watches = cases.filter(c => c.status === 'watch');
  if (breaks.length) {
    lines.push('Break cases (' + breaks.length + '): ' + breaks.map(c => c.chipPlain || c.label).join('; ') +
      ' — Dec cash or ≥50% cash drop vs plan.');
  } else if (watches.length) {
    lines.push('No floor breaks. Watch cases: ' + watches.map(c => c.chipPlain || c.label).join('; ') + '.');
  } else {
    lines.push('Named pipeline/renewal shocks stayed inside cash rails on this plan path.');
  }
  const ranked = cases.slice().sort((a, b) => Math.abs(b.dCash || 0) - Math.abs(a.dCash || 0)).slice(0, 3);
  if (ranked.length) {
    lines.push(
      'Largest cash movers: ' +
      ranked.map(c => (c.chipPlain || c.label) + ' ' +
        ((c.dCash || 0) >= 0 ? '+' : '') + ((c.dCash || 0) / 1e6).toFixed(1) + 'M').join(', ') + '.'
    );
  }
  if (suite.mc) {
    const mc = suite.mc;
    const pArr = mc.arr && mc.arr.pMiss != null ? mc.arr.pMiss : mc.p_arr_miss;
    const pCash = mc.cash && mc.cash.pBreak != null ? mc.cash.pBreak : mc.p_cash_below_floor;
    lines.push(
      'Monte Carlo (' + ((mc.n || 0).toLocaleString()) + ' draws) under Forecast priors: P(ARR miss) ' +
      (((pArr || 0) * 100).toFixed(1)) + '%, P(cash < floor) ' + (((pCash || 0) * 100).toFixed(1)) +
      '%. Stress frequency — not calibrated PoA.'
    );
  }
  lines.push('Cases are diagnostic on the live Forecast packet — nothing is written into the operating forecast.');
  return lines.join('\n\n');
}

function fcNormalizeMc(mc) {
  if (!mc) return null;
  const out = Object.assign({}, mc);
  out.arr = out.arr || {};
  out.cash = out.cash || {};
  if (out.arr.pMiss == null && out.p_arr_miss != null) out.arr.pMiss = out.p_arr_miss;
  if (out.cash.pBreak == null && out.p_cash_below_floor != null) out.cash.pBreak = out.p_cash_below_floor;
  if (out.cash.pWatch25 == null && out.p_cash_watch_25 != null) out.cash.pWatch25 = out.p_cash_watch_25;
  // Last resort: infer from Dec cash distribution vs 75% of plan mean/p50
  if (out.cash.pWatch25 == null) {
    const plan = (out.cash.p50 != null ? out.cash.p50 : out.cash.mean) || 0;
    const p10 = out.cash.p10;
    if (plan > 0 && p10 != null && p10 <= plan * 0.75) {
      // At least the lower tail sits on/under the −25% rail
      const sd = out.cash.sd || Math.max(1, (out.cash.p90 || plan) - (out.cash.p10 || plan)) / 2.56;
      const z = (plan * 0.75 - (out.cash.mean || plan)) / Math.max(1, sd);
      // rough one-sided normal CDF
      const t = 1 / (1 + 0.2316419 * Math.abs(z));
      const d = 0.3989423 * Math.exp(-z * z / 2);
      const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
      out.cash.pWatch25 = z < 0 ? Math.min(0.95, Math.max(0.02, 1 - p)) : Math.min(0.95, Math.max(0.02, p));
    } else {
      out.cash.pWatch25 = 0;
    }
  }
  if (out.pOpsRisk == null) out.pOpsRisk = out.p_ops_liquidity || 0;
  return out;
}


function fcCaseSeverityRank(c) {
  if (!c) return 9;
  if (c.status === 'break') return 0;
  if (c.status === 'watch') return 1;
  return 2;
}
function fcCaseImpactScore(c) {
  // Prefer cash pain, then ARR, then EBITDA (absolute $)
  return Math.max(
    Math.abs(c.dCash || 0),
    Math.abs(c.dArr || 0) * 0.55,
    Math.abs(c.dEbitda || 0) * 0.55
  );
}
/** Worst → best: breaks, then watches by |impact|, then holds. */
function fcSortCasesWorstFirst(cases) {
  return (cases || []).slice().sort((a, b) => {
    const rd = fcCaseSeverityRank(a) - fcCaseSeverityRank(b);
    if (rd) return rd;
    const sa = fcCaseImpactScore(a);
    const sb = fcCaseImpactScore(b);
    if (Math.abs(sb - sa) > 1) return sb - sa;
    // Within similar impact, more negative cash first
    return (a.dCash || 0) - (b.dCash || 0);
  });
}

async function runFcScenarioStressSuite(opts) {
  opts = opts || {};
  const onProgress = opts.onProgress;
  const base = opts.packet || (typeof buildFcAssurancePacket === 'function' ? buildFcAssurancePacket() : {});
  const defs = buildFcScenarioCaseDefs(base);
  const cases = [];
  if (onProgress) onProgress('cases', 0, defs.length);
  for (let i = 0; i < defs.length; i++) {
    cases.push(evaluateFcScenarioShock(defs[i], base));
    if (onProgress) onProgress('cases', i + 1, defs.length);
    await new Promise(r => setTimeout(r, 0));
  }
  let mc = null;
  if (opts.monteCarlo !== false && typeof fetchForecastMonteCarlo === 'function') {
    if (onProgress) onProgress('mc', 0, opts.mcN || 1000);
    const data = await fetchForecastMonteCarlo({ packet: base, n: opts.mcN || 1000 });
    mc = fcNormalizeMc(data && data.result);
    if (onProgress) onProgress('mc', opts.mcN || 1000, opts.mcN || 1000);
  } else if (window._forecastServerMc) {
    mc = fcNormalizeMc(window._forecastServerMc);
  }
  const suite = {
    at: Date.now(),
    surface: 'forecast',
    base: {
      decArr: base.decArr,
      targetArr: base.targetArr,
      endCash: base.endCash,
      cashFloor: base.cashFloor,
      fyEbitda: base.fyEbitda,
      fyMkt: base.fyMkt,
      yoyGrowthPct: base.yoyGrowthPct,
      pipelineCoverage: base.pipelineCoverage,
      cashByMonth: (base.cashByMonth || []).slice(),
    },
    cases: fcSortCasesWorstFirst(cases),
    mc,
  };
  suite.narrative = buildFcScenarioNarrativeFromSuite(suite);
  window._forecastScenarioSuite = suite;
  window._forecastScenarioNarrative = suite.narrative;
  if (mc) {
    window._forecastServerMc = mc;
    window._forecastMcAt = suite.at;
  }
  return suite;
}

function fcPaAnalyticsVerdict(suite, packet) {
  if (!suite || !suite.mc) {
    return {
      sev: 'watch',
      big: 'Run scenarios to stress this forecast.',
      small: 'Named packet shocks + Monte Carlo populate likelihoods, the corridor fan, and stress chips.',
    };
  }
  const mc = suite.mc;
  const breakN = (suite.cases || []).filter(c => c.status === 'break').length;
  const pWatch25 = mc.cash && mc.cash.pWatch25 != null ? mc.cash.pWatch25 : 0;
  const pArr = (mc.arr && mc.arr.pMiss != null) ? mc.arr.pMiss : (mc.p_arr_miss || 0);
  const pCash = (mc.cash && mc.cash.pBreak != null) ? mc.cash.pBreak : (mc.p_cash_below_floor || 0);
  const pOps = mc.pOpsRisk != null ? mc.pOpsRisk : (mc.p_ops_liquidity || 0);
  const pHold = Math.max(0, 1 - Math.max(pArr, pCash, pOps, pWatch25 * 0.5));
  let sev = 'hold';
  if (breakN >= 2 || pCash >= 0.15 || pWatch25 >= 0.35) sev = 'break';
  else if (breakN >= 1 || pCash >= 0.05 || pWatch25 >= 0.12 || pArr >= 0.25) sev = 'watch';
  const cplCase = (suite.cases || []).find(c => /cpl|lead|paid/i.test(c.label || '') || /cpl|ops_cash/i.test(c.id || ''));
  const lean = cplCase && (cplCase.status === 'break' || cplCase.status === 'watch')
    ? 'what it costs to buy demand'
    : 'a few named lever shocks';
  return {
    sev,
    big: sev === 'hold'
      ? 'The forecast holds under stated priors — still watch the levers that swing cash.'
      : `The forecast works, but it leans on ${lean}.`,
    small: `In about ${(pHold * 100).toFixed(0)}% of tested years the main rails hold. ` +
      `P(cash ≥25% below plan) ${(pWatch25 * 100).toFixed(0)}% · P(cash under floor) ${(pCash * 100).toFixed(0)}% · P(ARR miss) ${(pArr * 100).toFixed(0)}%` +
      (breakN ? ` · ${breakN} named case${breakN === 1 ? '' : 's'} break` : '') +
      `. Dec cash plan ${fM(packet.endCash, 1)} vs floor ${fM(packet.cashFloor, 1)}.`,
  };
}

function fcCashRailsM(planM, floorM) {
  return {
    plan: planM,
    floor: floorM,
    watch: planM.map(v => +(v * 0.75).toFixed(2)),
    alarm: planM.map(v => +(v * 0.50).toFixed(2)),
  };
}


/** P(Dec cash ≤ 75% of plan) implied by a displayed P10 fan edge (normal-ish). */
function fcPWatch25FromFan(planDecM, p10DecM) {
  const plan = Number(planDecM) || 0;
  const p10 = Number(p10DecM);
  if (!(plan > 0) || p10 == null || isNaN(p10)) return 0;
  const rail = plan * 0.75;
  // P10 at/under the −25% rail ⇒ at least ~10% of years land that hard; deeper ⇒ more.
  if (p10 <= rail) {
    const depth = (rail - p10) / Math.max(1e-6, plan * 0.25);
    return Math.min(0.40, 0.10 + 0.10 * Math.max(0, depth));
  }
  // Fan stays above the rail — small residual chance from the far tail.
  const gap = (p10 - rail) / Math.max(1e-6, plan * 0.25);
  return Math.max(0, Math.min(0.08, 0.08 * (1 - Math.min(1, gap))));
}

/** Budget-parity cash fan: open around the plan mean so −25% sits near the outer lower edge. */
function fcApproxCashBands(planM, floorM, decSdM, opts) {
  opts = opts || {};
  const plan = (planM || []).map(v => Number(v) || 0);
  const n = plan.length;
  const floor = floorM != null ? Number(floorM) : 10;
  if (!n) return { p10: [], p25: [], p75: [], p90: [], floor, illustrative: true };
  const dec = plan[n - 1];
  const sd = Math.max(0, Number(decSdM) || 0);
  // Same grammar as Budget approxCashBands: meaningful outer width even when MC sd is tiny.
  // Outer ≈ 25% of Dec so the −25% rail sits on the P10 edge (not past it with a fake 0% readout).
  const outer = Math.max(sd > 0.05 ? sd * 2.4 : 0, Math.abs(dec) * 0.25, 5);
  const inner = outer * 0.42;
  const closeRel = opts.closeRel != null ? opts.closeRel : -1; // index in this slice after which uncertainty opens
  const tAt = (j) => {
    if (n <= 1) return 1;
    // Open-months-only slice: already past close — start partly open, finish fully open at Dec
    if (closeRel < 0) return 0.35 + 0.65 * (j / (n - 1));
    if (j <= closeRel) return 0.04; // near-zero on closed months in FY view
    const j0 = closeRel + 1;
    const span = Math.max(1, n - 1 - j0);
    const u = (j - j0) / span;
    return 0.35 + 0.65 * Math.max(0, Math.min(1, u));
  };
  return {
    p10: plan.map((v, j) => Math.max(0, +(v - outer * tAt(j)).toFixed(2))),
    p25: plan.map((v, j) => Math.max(0, +(v - inner * tAt(j)).toFixed(2))),
    p75: plan.map((v, j) => +(v + inner * tAt(j)).toFixed(2)),
    p90: plan.map((v, j) => +(v + outer * tAt(j)).toFixed(2)),
    floor,
    outer,
    illustrative: !(sd > 0.05),
  };
}

function fcCashToM(v) {
  if (v == null || isNaN(Number(v))) return null;
  const n = Number(v);
  // Dollars (≥ ~$1k) → $M; already-$M stay as-is.
  return Math.abs(n) >= 1000 ? n / 1e6 : n;
}

/** Resolve the corridor fan + display P(cash ≤75% plan) so readouts match the chart. */
function fcResolveCorridorBands(packet, suite) {
  const planFull$ = (packet.cashByMonth || []).map(v => Number(v) || 0);
  const planFull = planFull$.map(v => v / 1e6);
  const floor = (packet.cashFloor != null ? Number(packet.cashFloor) : 1e7) / 1e6;
  const empty = { ok: false, planFull, floor, plan: [], p10: [], p25: [], p75: [], p90: [], usedMcPath: false, pWatch25: 0, i0: 0, n: 0, last: 0, horizon: 'fc', closeIdx: 5 };
  if (!planFull.length) return empty;

  const horizon = window._fcPaCashHorizon === 'fy' ? 'fy' : 'fc';
  const closeIdx = (typeof CLOSE_MO_IDX === 'number' ? CLOSE_MO_IDX : 5);
  const i0 = horizon === 'fc' ? Math.min(closeIdx + 1, planFull.length - 1) : 0;
  const n = planFull.length - i0;
  const last = n - 1;
  const plan = planFull.slice(i0);
  const mc = suite && suite.mc;
  const monthlyFull = (((mc || {}).cash_path || {}).monthly) || (((mc || {}).cashPath || {}).monthly) || [];
  const decSdM = mc && mc.cash && mc.cash.sd != null ? fcCashToM(mc.cash.sd) : 0;

  const approx = fcApproxCashBands(plan, floor, decSdM, { closeRel: horizon === 'fy' ? closeIdx : -1 });
  let p10 = approx.p10.slice();
  let p25 = approx.p25.slice();
  let p75 = approx.p75.slice();
  let p90 = approx.p90.slice();
  let usedMcPath = false;

  if (monthlyFull.length >= 12) {
    const mcP10 = [], mcP25 = [], mcP75 = [], mcP90 = [];
    let ok = true;
    for (let j = 0; j < n; j++) {
      const m = monthlyFull[i0 + j] || {};
      const lo = fcCashToM(m.p10);
      const hi = fcCashToM(m.p90);
      const q1 = fcCashToM(m.p25);
      const q3 = fcCashToM(m.p75);
      if (lo == null || hi == null) { ok = false; break; }
      mcP10.push(lo);
      mcP90.push(hi);
      mcP25.push(q1 != null ? q1 : (lo + plan[j]) / 2);
      mcP75.push(q3 != null ? q3 : (hi + plan[j]) / 2);
    }
    if (ok) {
      const width = mcP90[last] - mcP10[last];
      if (width >= Math.max(3, Math.abs(plan[last]) * 0.12)) {
        p10 = mcP10; p25 = mcP25; p75 = mcP75; p90 = mcP90;
        usedMcPath = true;
      }
    }
  }

  const fanPWatch = fcPWatch25FromFan(plan[last], p10[last]);
  const mcPWatch = mc && mc.cash && mc.cash.pWatch25 != null ? Number(mc.cash.pWatch25) : null;
  // Live MC path → trust trial count. Illustrative/Budget fan → use fan-implied (never show 0% past the rail).
  const pWatch25 = usedMcPath && mcPWatch != null
    ? mcPWatch
    : Math.max(mcPWatch || 0, fanPWatch);
  if (mc && mc.cash) mc.cash.pWatch25 = pWatch25;

  return {
    ok: true, planFull, floor, plan, p10, p25, p75, p90,
    usedMcPath, pWatch25, fanPWatch, mcPWatch, i0, n, last, horizon, closeIdx,
  };
}

function renderFcPredictiveCorridor(packet, suite, selectedIdx) {
  const bands = fcResolveCorridorBands(packet, suite);
  if (!bands.ok) return '<div class="pa-meta">No cash path on packet.</div>';
  const { planFull, floor, plan, p10, p25, p75, p90, usedMcPath, pWatch25, i0, n, last, horizon, closeIdx } = bands;
  const monthsAll = (typeof MO12 !== 'undefined' ? MO12 : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']);
  const months = monthsAll.slice(i0);
  const mc = suite && suite.mc;
  window._fcPaCorridorMeta = {
    usedMcPath,
    illustrative: !usedMcPath,
    pWatch25,
    fanPWatch25: bands.fanPWatch,
    mcPWatch25: bands.mcPWatch,
  };

  const rails = fcCashRailsM(plan, floor);
  const W = 900, H = 320, PL = 52, PR = 168, PT = 18, PB = 30;
  const ymax = Math.max(floor * 1.5, Math.max.apply(null, plan.concat(p90, rails.watch, [40])) * 1.08, 40);
  const denom = Math.max(1, n - 1);
  const xs = (j) => PL + j * (W - PL - PR) / denom;
  const ys = (v) => PT + (1 - v / ymax) * (H - PT - PB);
  const pts = (a) => a.map((v, j) => `${xs(j)},${ys(v)}`).join(' ');
  const band = (lo, hi) => {
    const top = hi.map((v, j) => `${xs(j)},${ys(v)}`).join('L');
    const bot = lo.slice().reverse().map((v, j) => `${xs(n - 1 - j)},${ys(v)}`).join('L');
    return `M${top}L${bot}Z`;
  };

  const cs = getComputedStyle(document.documentElement);
  const teal = (cs.getPropertyValue('--teal').trim() || cs.getPropertyValue('--accent').trim() || '#5fa878');
  const red = cs.getPropertyValue('--red').trim() || '#b8705f';
  const amber = cs.getPropertyValue('--amber').trim() || '#b89060';
  const muted = cs.getPropertyValue('--text3').trim() || '#72826a';
  const border = cs.getPropertyValue('--border').trim() || '#2e3f31';

  let g = '';
  const tickStep = ymax > 80 ? 20 : 10;
  for (let v = 0; v <= ymax * 1.01; v += tickStep) {
    g += `<line x1="${PL}" y1="${ys(v)}" x2="${W - PR}" y2="${ys(v)}" stroke="${border}" stroke-width="1"/>`;
    g += `<text x="${PL - 8}" y="${ys(v) + 4}" fill="${muted}" font-size="12" text-anchor="end">$${v}M</text>`;
  }
  g += `<path d="${band(p10, p90)}" fill="${teal}" fill-opacity="0.17"/>`;
  g += `<path d="${band(p25, p75)}" fill="${teal}" fill-opacity="0.42"/>`;
  g += `<polyline points="${pts(rails.watch)}" fill="none" stroke="${amber}" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.9"/>`;
  g += `<polyline points="${pts(rails.alarm)}" fill="none" stroke="${red}" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.75"/>`;
  g += `<text x="${PL + 6}" y="${ys(rails.watch[0]) - 6}" fill="${amber}" font-size="11">25% below plan</text>`;
  g += `<text x="${PL + 6}" y="${ys(rails.alarm[0]) - 6}" fill="${red}" font-size="11">50% below plan</text>`;
  const fy = ys(floor);
  g += `<line x1="${PL}" y1="${fy}" x2="${W - PR}" y2="${fy}" stroke="${red}" stroke-width="2.2" stroke-dasharray="7 5"/>`;
  g += `<text x="${W - PR}" y="${fy - 8}" fill="${red}" font-size="12" text-anchor="end">Cash floor $${floor.toFixed(1)}M</text>`;
  g += `<polyline points="${pts(plan)}" fill="none" stroke="${teal}" stroke-width="2.5" stroke-linejoin="round"/>`;
  g += `<circle cx="${xs(last)}" cy="${ys(plan[last])}" r="4" fill="${teal}"/>`;
  g += `<text x="${xs(last) + 10}" y="${ys(plan[last]) + 4}" fill="${teal}" font-size="12">Plan Dec $${plan[last].toFixed(1)}M</text>`;
  g += `<polyline id="fcPaCaseLine" points="" fill="none" stroke="none" stroke-width="2.5" stroke-linejoin="round"/>`;
  g += `<g id="fcPaCaseMark"></g><g id="fcPaCaseEoy"></g>`;
  months.forEach((m, j) => {
    g += `<text x="${xs(j)}" y="${H - 8}" fill="${muted}" font-size="12" text-anchor="middle">${m}</text>`;
  });
  if (!usedMcPath) {
    g += `<text x="${PL + 8}" y="${PT + 12}" fill="${muted}" font-size="11">${mc ? 'Likelihood fan from Dec cash SD (Budget grammar)' : 'Illustrative fan — Generate scenarios for live likelihood'}</text>`;
  }
  if (horizon === 'fc' && i0 > 0) {
    g += `<text x="${PL + 8}" y="${PT + (usedMcPath && mc ? 12 : 26)}" fill="${muted}" font-size="11">Open months only · actuals through ${monthsAll[closeIdx]}</text>`;
  }

  window._fcPaCorridor = { plan, planFull, floor, rails, ymax, W, H, PL, PR, PT, PB, xs, ys, i0, n, last, labels: months, horizon, p10, p90 };
  const sel = selectedIdx != null ? selectedIdx : window._fcPaCaseSel;
  if (sel != null) setTimeout(() => { try { selectFcPaCase(sel, true); } catch (e) { /* */ } }, 0);

  return `<svg id="fcPaCorridorSvg" class="pa-corridor-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Forecast cash corridor">${g}</svg>`;
}

function renderFcLeverLedger(suite, mode) {
  const modeKey = mode === 'tech' ? 'tech' : 'plain';
  const cases = (suite && suite.cases) || [];
  if (!cases.length) return '<div style="color:var(--text3);font-size:12px">Generate scenarios to rank levers.</div>';
  // Worst → best by multi-metric impact (cash / ARR / EBITDA), same $1M bar as watches.
  const levers = cases.slice().sort((a, b) => {
    const ia = Math.max(Math.abs(a.dCash || 0), Math.abs(a.dArr || 0), Math.abs(a.dEbitda || 0));
    const ib = Math.max(Math.abs(b.dCash || 0), Math.abs(b.dArr || 0), Math.abs(b.dEbitda || 0));
    if (Math.abs(ib - ia) > 1) return ib - ia;
    return (a.dCash || 0) - (b.dCash || 0);
  }).map(c => {
    const dn = Math.min(0, (c.dCash || 0) / 1e6);
    const up = Math.max(0, Math.abs(dn) * 0.45);
    const impactM = Math.max(
      Math.abs(c.dCash || 0),
      Math.abs(c.dArr || 0),
      Math.abs(c.dEbitda || 0)
    ) / 1e6;
    // Watch these = break + watch (≥$1M); Stop worrying = hold (&lt;$1M).
    let tier = 'flat';
    if (c.status === 'break' || c.status === 'watch' || impactM >= 1.0) tier = 'break';
    else if ((c.dCash || 0) > 0 && up >= Math.abs(dn) * 0.9) tier = 'up';
    return {
      plain: c.chipPlain || c.label,
      tech: c.chipTech || c.label,
      mp: c.plain || c.explain || '',
      mt: ((c.breaks || []).concat(c.watches || [])).slice(0, 2).join(', ') || c.id,
      dn, up, tier, impactM,
      status: c.status,
    };
  });
  // Illustrative upside column (Budget parity) from the biggest watch cases' reverse swing.
  const upLevers = levers.filter(l => l.tier === 'break').slice(0, 3).map(l => Object.assign({}, l, {
    tier: 'up',
    up: Math.max(l.up, Math.abs(l.dn) * 0.55),
  }));

  const maxSwing = Math.max(8, ...levers.map(l => Math.max(Math.abs(l.dn || 0), Math.abs(l.up || 0))));
  const ledger = `<div class="pa-ledger-head">
      <div>Lever</div>
      <div style="text-align:center">${modeKey === 'tech' ? 'Δ Dec cash' : 'Worse ← plan → better'}</div>
      <div style="text-align:right">Cash swing</div>
    </div>
    <div class="pa-lever-ledger">${levers.map(l => {
      const name = modeKey === 'tech' ? l.tech : l.plain;
      const meta = modeKey === 'tech' ? l.mt : l.mp;
      const dnPct = Math.min(50, Math.abs(l.dn || 0) / maxSwing * 50);
      const upPct = Math.min(50, Math.abs(l.up || 0) / maxSwing * 50);
      return `<div class="pa-lrow"><div class="pa-lname">${fcEsc(name)}
        <span class="meta">${fcEsc(meta)}</span></div>
        <div class="pa-ltrack"><div class="pa-laxis"></div>
        ${dnPct ? `<div class="pa-lbar dn" style="width:${dnPct}%"></div>` : ''}
        ${upPct ? `<div class="pa-lbar up" style="width:${upPct}%"></div>` : ''}
        </div><div class="pa-lval"><b>${(l.dn || 0).toFixed(1)}M</b> / +${(l.up || 0).toFixed(1)}M</div></div>`;
    }).join('')}</div>`;

  const by = (t) => levers.filter(l => l.tier === t);
  const watchItems = by('break').slice(0, 4);
  const nWatch = watchItems.length;
  const watchWord = nWatch === 4 ? ' four' : nWatch === 3 ? ' three' : nWatch === 2 ? ' two' : '';
  const G = [
    { c: 'g-break', h: { plain: 'Watch these' + watchWord, tech: 'Load-bearing levers' },
      s: { plain: 'Every scenario that breaks the year starts with one of these. They deserve a named owner and a monthly read.',
        tech: 'Downside Δ Dec cash / ARR / EBITDA dominates the break and watch set.' },
      items: watchItems,
      val: (l) => `−$${Math.abs(l.dn).toFixed(1)}M at risk` },
    { c: 'g-up', h: { plain: 'Pull these to get ahead', tech: 'Upside levers' },
      s: { plain: 'These give back more than they take away. If we need to buy room, this is where to look first.',
        tech: 'Illustrative reverse of the largest downside cases — best return per unit of attention.' },
      items: upLevers,
      val: (l) => `+$${l.up.toFixed(1)}M upside` },
    { c: 'g-flat', h: { plain: 'Stop worrying about these', tech: 'Immaterial levers' },
      s: { plain: 'Worth less than a million either way. Whatever we decide here, the year lands the same.',
        tech: 'Total swing below the $1M / 3% watch bar.' },
      items: by('flat'),
      val: (l) => `±$${Math.max(Math.abs(l.dn), l.up).toFixed(1)}M` },
  ];
  const groups = `<div class="pa-groups">${G.map(g => {
    if (!g.items.length) return '';
    return `<div class="pa-group ${g.c}"><h4>${g.h[modeKey]}</h4><p class="gs">${g.s[modeKey]}</p>
      <ul>${g.items.map(l => {
        const liCls = (g.c === 'g-break' && l.status === 'watch') ? ' class="watch"' : '';
        return `<li${liCls}><span>${fcEsc(modeKey === 'tech' ? l.tech : l.plain)}</span><span>${g.val(l)}</span></li>`;
      }).join('')}</ul></div>`;
  }).join('')}</div>`;
  return ledger + groups;
}

function buildFcTheRead(packet, suite, mode) {
  const modeKey = mode === 'tech' ? 'tech' : 'plain';
  const ctx = fcHorizonCtx(packet);
  const plan$ = (packet.cashByMonth || []).map(v => Number(v) || 0);
  const closeIdx = packet.closeMonthIdx != null ? Number(packet.closeMonthIdx)
    : (typeof CLOSE_MO_IDX === 'number' ? CLOSE_MO_IDX : 5);
  const open0 = plan$[Math.min(closeIdx + 1, plan$.length - 1)] || plan$[0] || 0;
  const dec = (plan$[11] != null ? plan$[11] : Number(packet.endCash) || 0) / 1e6;
  const open0M = open0 / 1e6;
  const floor = (Number(packet.cashFloor) || 1e7) / 1e6;
  const watchCush = Math.max(0.5, dec * 0.25);
  const alarmCush = Math.max(1, dec * 0.50);
  const mc = suite && suite.mc;
  const breakN = suite ? suite.cases.filter(c => c.status === 'break').length : 0;
  const pCash = mc ? ((((mc.cash && mc.cash.pBreak) != null ? mc.cash.pBreak : mc.p_cash_below_floor) || 0) * 100).toFixed(0) : '—';
  const bands = mc ? fcResolveCorridorBands(packet, suite) : null;
  const pWatchNum = bands && bands.ok ? bands.pWatch25 : (mc && mc.cash && mc.cash.pWatch25 != null ? mc.cash.pWatch25 : 0);
  const pWatch = mc ? ((pWatchNum || 0) * 100).toFixed(0) : '—';
  const pArr = mc ? ((((mc.arr && mc.arr.pMiss) != null ? mc.arr.pMiss : mc.p_arr_miss) || 0) * 100).toFixed(1) : '—';
  const pHold = mc
    ? ((Math.max(0, 1 - Math.max(
      (mc.arr && mc.arr.pMiss) || mc.p_arr_miss || 0,
      (mc.cash && mc.cash.pBreak) || mc.p_cash_below_floor || 0,
      mc.pOpsRisk || mc.p_ops_liquidity || 0
    ))) * 100).toFixed(0)
    : '—';
  const narr = (window._forecastScenarioNarrative || (suite && suite.narrative) || '').trim();
  const top = ctx.topLoseRisk[0];
  const topDealLine = top
    ? (top.customer + ' · ' + top.type + ' · ' + top.periodLbl + ' · ' + fcFmtDeal$(top.arr) + ' at ' + top.prob + '%')
    : 'No open deals loaded';

  if (modeKey === 'tech') {
    return [
      ['Forecast book',
        'Open-month weighted NB ' + fcFmtDeal$(ctx.wtdNb) + ' · Exp ' + fcFmtDeal$(ctx.wtdExp) +
        ' · Renewals ' + fcFmtDeal$(ctx.renWtd) + ' / ' + fcFmtDeal$(ctx.renGross) +
        ' · Cover ' + ctx.coverX.toFixed(2) + '×. Peak month ' + (ctx.peakLbl || '—') + ' ' + fcFmtDeal$(ctx.peakPipe) + '.'],
      ['Plan cash',
        'Open path ' + fM(open0, 1) + ' → Dec ' + fM(dec * 1e6, 1) + ' vs floor ' + fM(packet.cashFloor, 1) +
        '. Rails −25% = $' + watchCush.toFixed(1) + 'M · −50% = $' + alarmCush.toFixed(1) + 'M.'],
      ['Top miss', topDealLine],
      ['Distribution',
        mc
          ? ('MC n=' + ((mc.n || 0).toLocaleString()) + ': P(cash ≤75% plan) ' + pWatch + '%, P(floor) ' + pCash +
            '%, P(ARR miss) ' + pArr + '%. Named breaks: ' + breakN + '. Shocks are pipeline/renewal packet moves.')
          : 'Generate scenarios for MC frequencies and deal-linked shocks.'],
      ['Response', narr ? fcEsc(narr).slice(0, 900) : 'Offsets scale to this forecast cushion; concurrent deal slips share one cushion.'],
    ];
  }
  const sections = [
    ['What this forecast is built from',
      'Remainder-of-year ARR comes from <b>weighted open pipeline</b> (' + fcFmtDeal$(ctx.openWtdPipe) +
      ' NB+Exp) and the <b>renewal book</b> (' + fcFmtDeal$(ctx.renGross) + ' gross, ' +
      ((ctx.renRate * 100).toFixed(0)) + '% weighted). Cash rides the CFS from about <b>$' +
      open0M.toFixed(1) + 'M</b> after close to <b>$' + dec.toFixed(1) + 'M</b> in Dec (floor <b>$' +
      floor.toFixed(0) + 'M</b>).'],
    ['Where the risk sits in the book',
      top
        ? ('Biggest miss on the board is <b>' + fcEsc(top.customer) + '</b> — ' + top.type + ' in ' +
          top.periodLbl + ', ' + fcFmtDeal$(top.arr) + ' at ' + top.prob +
          '% win. Heaviest month still open: <b>' + (ctx.peakLbl || '—') + '</b> (' +
          fcFmtDeal$(ctx.peakPipe) + ' weighted).')
        : 'Generate with live SRC.opp_pipeline / renewals to rank deals by period.'],
    ['What the stress run says',
      mc
        ? ('About <b>' + pHold + '%</b> of tested years hold the main rails. Cash falls hard in roughly <b>' +
          pWatch + '%</b> of draws; floor breach ~<b>' + pCash + '%</b>. <b>' + breakN +
          '</b> named deal/pipeline scenario' + (breakN === 1 ? '' : 's') + ' break.')
        : 'Generate scenarios to shock this horizon’s deals, renewals, and coverage — not Budget lead-cost cases.'],
    ['What to watch',
      'Trip-wires that match this engine: late-stage win rate, NB attainment vs weighted pipe, renewal rate vs ' +
      ((ctx.renRate * 100).toFixed(0)) + '%, and coverage staying near ' + ctx.coverX.toFixed(1) +
      '×. Paid-channel CPL is a Budget lever — here the book is opportunities and renewals.'],
  ];
  if (narr) sections.push(['From this stress run', fcEsc(narr).replace(/\n/g, '<br>')]);
  return sections;
}

window.selectFcPaCase = function(idx, silent) {
  const suite = window._forecastScenarioSuite;
  const cases = suite && suite.cases || [];
  const c = cases[idx];
  const callout = document.getElementById('fcPaCaseCallout');
  const line = document.getElementById('fcPaCaseLine');
  const mark = document.getElementById('fcPaCaseMark');
  const modeKey = window._fcPaMode === 'tech' ? 'tech' : 'plain';
  document.querySelectorAll('.pa-chip[data-pa-case]').forEach(el => {
    el.setAttribute('aria-pressed', String(+el.getAttribute('data-pa-case') === idx));
  });
  if (!c || !window._fcPaCorridor) {
    if (callout && !silent) {
      callout.innerHTML = modeKey === 'tech'
        ? 'Select a named case to overlay its cash path on the corridor.'
        : 'Pick a scenario below to see how that year would have gone.';
    }
    return;
  }
  window._fcPaCaseSel = idx;
  const corr = window._fcPaCorridor;
  const plan = corr.plan;
  const i0 = corr.i0 || 0;
  const n = corr.n || plan.length;
  const last = corr.last != null ? corr.last : (n - 1);
  const pathFull = (c.cashPathM && c.cashPathM.length >= 12)
    ? c.cashPathM
    : (corr.planFull || plan).map((v, i) => +(v + ((c.dCash || 0) / 1e6) * Math.pow(i / 11, 1.35)).toFixed(2));
  const path = pathFull.slice(i0, i0 + n);
  const PL = corr.PL || 52, PR = corr.PR || 168, PT = corr.PT || 18, PB = corr.PB || 30;
  const W = corr.W || 900, H = corr.H || 320;
  const floor = corr.floor;
  const ymax = corr.ymax || Math.max(floor * 1.5, Math.max.apply(null, plan.concat(path, [40])) * 1.08, 40);
  const denom = Math.max(1, n - 1);
  const xs = (j) => PL + j * (W - PL - PR) / denom;
  const ys = (v) => PT + (1 - v / ymax) * (H - PT - PB);
  const col = c.status === 'break' ? 'var(--red)' : c.status === 'watch' ? 'var(--amber)' : 'var(--teal)';
  if (line) {
    line.setAttribute('points', path.map((v, j) => `${xs(j)},${ys(v)}`).join(' '));
    line.setAttribute('stroke', col);
  }
  if (mark) {
    const rails = corr.rails || fcCashRailsM(plan, floor);
    let bi = path.reduce((best, v, j) => (v < path[best] ? j : best), 0);
    const crossIdx = path.findIndex((v, j) => v < rails.alarm[j] || v < floor);
    if (crossIdx >= 0) bi = crossIdx;
    else {
      const wIdx = path.findIndex((v, j) => v < rails.watch[j]);
      if (wIdx >= 0) bi = wIdx;
    }
    const months = corr.labels || (typeof MO12 !== 'undefined' ? MO12.slice(i0) : []);
    mark.innerHTML = `<circle cx="${xs(bi)}" cy="${ys(path[bi])}" r="5" fill="${col}"/>` +
      (bi === last ? '' :
        `<text x="${xs(bi)}" y="${ys(path[bi]) - 10}" fill="${col}" font-size="11" text-anchor="middle">${months[bi] || ''} $${path[bi].toFixed(1)}M</text>`);
  }
  const eoy = document.getElementById('fcPaCaseEoy');
  if (eoy) {
    const planDec = plan[last];
    const end = path[last];
    const d = end - planDec;
    const yOff = Math.abs(ys(end) - ys(planDec)) < 34 ? (end <= planDec ? 24 : -24) : 0;
    const lx = xs(last) + 10;
    eoy.innerHTML =
      `<circle cx="${xs(last)}" cy="${ys(end)}" r="4" fill="${col}"/>` +
      `<text x="${lx}" y="${ys(end) - 2 + yOff}" fill="${col}" font-size="12">This path $${end.toFixed(1)}M</text>` +
      `<text x="${lx}" y="${ys(end) + 12 + yOff}" fill="${col}" font-size="11" opacity="0.85">${d >= 0 ? '+' : ''}${d.toFixed(1)} vs plan</text>`;
  }
  if (callout) {
    const title = fcEsc(modeKey === 'tech' ? (c.chipTech || c.label) : (c.chipPlain || c.label));
    const body = fcEsc(modeKey === 'tech' ? (c.explain || c.xp || '') : (c.xp || c.plain || c.explain || ''));
    const dCash = (c.dCash || 0) / 1e6;
    const dArr = (c.dArr || 0) / 1e6;
    const planDec = plan[last];
    const end = path[last];
    const dropPct = c.cashDropPct != null ? c.cashDropPct : (planDec > 0 ? (planDec - end) / planDec : 0);
    const breaks = c.breaks || [];
    const watches = c.watches || [];
    const cashFloorBreak = breaks.some(b => /cash floor/i.test(b));
    const cash50 = breaks.some(b => /50%/i.test(b)) || dropPct >= 0.50;
    const cash25 = watches.some(b => /5%|25%/i.test(b)) || dropPct >= 0.25;
    const arrMiss = [...breaks, ...watches].some(b => /ARR|YoY/i.test(b));
    let cashBit;
    if (modeKey === 'tech') {
      cashBit = `Δ cash ${dCash >= 0 ? '+' : ''}${dCash.toFixed(1)}M (${(dropPct * 100).toFixed(0)}% vs plan) · Δ ARR ${dArr >= 0 ? '+' : ''}${dArr.toFixed(1)}M · ${c.status}`;
    } else if (cashFloorBreak) {
      cashBit = `Crosses the $${floor.toFixed(0)}M floor — ends $${end.toFixed(1)}M vs plan $${planDec.toFixed(1)}M.`;
    } else if (cash50) {
      cashBit = `Alarm — ends $${end.toFixed(1)}M (~${(dropPct * 100).toFixed(0)}% below plan $${planDec.toFixed(1)}M).`;
    } else if (cash25) {
      cashBit = `Watch — ends $${end.toFixed(1)}M vs plan $${planDec.toFixed(1)}M (still above the floor).`;
    } else if (arrMiss && Math.abs(dCash) < 1 && Math.abs(dropPct) < FC_CASH_WATCH_PCT) {
      cashBit = `Misses the growth number (ARR ${dArr >= 0 ? '+' : ''}${dArr.toFixed(1)}M). Cash ends $${end.toFixed(1)}M vs plan $${planDec.toFixed(1)}M — under the ±3% / $1M watch.`;
    } else if (Math.abs(dCash) < 1 && Math.abs(dropPct) < FC_CASH_WATCH_PCT) {
      cashBit = `Cash barely moves — ends $${end.toFixed(1)}M vs plan $${planDec.toFixed(1)}M (under ±3% / $1M).`;
    } else {
      cashBit = `Holds the cash rails — ends $${end.toFixed(1)}M vs plan $${planDec.toFixed(1)}M (${dCash >= 0 ? '+' : ''}${dCash.toFixed(1)}M).`;
    }
    let dealBit = '';
    if (c.evidence && c.evidence.deals && c.evidence.deals.length) {
      dealBit = ' Deals: ' + c.evidence.deals.slice(0, 3).map(d => fcEsc(d.customer) + ' (' + fcFmtDeal$(d.arr) + ', ' + d.prob + '%)').join('; ') + '.';
    }
    const met = `<div class="pa-readouts" style="margin:8px 0 0;grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="pa-ro"><div class="lab">Δ Dec ARR</div><div class="val ${(c.dArr||0)<0?'warn':''}">${fV(c.dArr)}</div></div>
      <div class="pa-ro"><div class="lab">Δ Dec cash</div><div class="val ${(c.dCash||0)<0?'warn':''}">${fV(c.dCash)}</div></div>
      <div class="pa-ro"><div class="lab">Δ FY EBITDA</div><div class="val ${(c.dEbitda||0)<0?'warn':''}">${fV(c.dEbitda)}</div></div>
    </div>`;
    callout.innerHTML = `<strong>${title}</strong> — ${body || cashBit}${body ? ` ${cashBit}` : ''}${dealBit}${met}`;
  }
};

function renderFcPredictiveHtml(packet, suite, mode) {

  if (suite && mc && !suite.mc) suite = Object.assign({}, suite, { mc: fcNormalizeMc(mc) });

  const verdict = suite && suite.mc
    ? (() => { const v = fcPaAnalyticsVerdict(suite, packet); return { big: v.big, small: v.small, tone: v.sev || 'watch' }; })()
    : {
      big: 'Run scenarios to test what could break this forecast.',
      small: `Plan cash ${fM(packet.endCash, 1)} vs floor ${fM(packet.cashFloor, 1)}. Generate scenarios for the corridor fan, chips, and The Read.`,

    };

    : `<div class="pa-banner" style="margin:12px 0 4px">We would never actually hit the $${((Number(packet.cashFloor) || 1e7) / 1e6).toFixed(0)}M floor — someone would make us cut first. The corridor still shows −25% / −50% rails. Big hits (≥$2.5M) are red breaks; ≥$1M (or ≥3% cash) are amber watches; smaller moves stay green — ranked worst to best.</div>`;

    ${readoutHtml}

    <div class="pa-section pa-h1" style="margin-top:8px">

            ? (cashHz === 'fc' ? 'Open-month cash corridor — plan vs draw' : 'FY Dec cash corridor — plan vs draw distribution')

          <p class="pa-section-sub">${corrSub}</p>
        </div>
        <div class="pa-toggle" role="group" aria-label="Cash corridor horizon">
          <button type="button" aria-pressed="${cashHz === 'fc'}" onclick="setFcPaCashHorizon('fc')">Open months</button>

        ? 'Packet-field shocks ranked worst → best. Break ≥$2.5M · watch ≥$1M / ≥3% cash · else hold — on ARR / Dec cash / FY EBITDA.'

      <h3 class="pa-section-hd">${modeKey === 'tech' ? 'Lever sensitivity — Δ Dec cash' : 'Which levers actually move the year'}</h3>

      <h3 class="pa-section-hd">${modeKey === 'tech' ? 'Commentary' : 'The read'}</h3>
