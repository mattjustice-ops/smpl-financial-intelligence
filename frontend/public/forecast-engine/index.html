async function refreshForecastScenarios(useLlm){
  const setProg = (msg, pct) => {
    const el = document.getElementById('fcAssureScenarioProg');
    if (!el) return;
    el.hidden = false;
    el.innerHTML = `${String(msg || '').replace(/</g, '&lt;')}${
      pct != null ? `<span class="bar"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></span>` : ''
    }`;
  };
  const paintAnalytics = () => {
    if (curTab === 'analytics') {
      const area = document.getElementById('slideArea');
      if (area) renderAnalytics(area);
    }
  };
  try {
    window._forecastScenarioRunning = { msg: 'Starting named stress cases…', pct: 5 };
    paintAnalytics();
    const suite = await runFcScenarioStressSuite({
      monteCarlo: true,
      mcN: 1000,
      onProgress: (phase, done, total) => {
        if (phase === 'cases') {
          const pct = 5 + (done / Math.max(1, total)) * 35;
          window._forecastScenarioRunning = { msg: `Named stress cases ${done}/${total}…`, pct };
          setProg(`Named stress cases ${done}/${total}…`, pct);
        } else if (phase === 'mc') {
          const pct = 40 + (done / Math.max(1, total)) * 45;
          window._forecastScenarioRunning = { msg: `Monte Carlo ${done}/${total}…`, pct };
          setProg(`Monte Carlo ${done.toLocaleString()} / ${total.toLocaleString()}…`, pct);
        }
      },
    });
    let textNarr = suite.narrative;
    if (useLlm) {
      setProg('Drafting commentary from stress packet…', 92);
      const allow = buildFcAssuranceEvidenceAllowlist({
        soT: textNarr,
        packet: buildFcAssurancePacket(),
        mc: suite.mc,
        lane: 'predictive',
      });
      // include case money moves
      (suite.cases || []).forEach(c => {
        [c.dArr, c.dCash, c.dEbitda, c.decArr, c.endCash].forEach(v => {
          if (typeof fcAssurePushMoney === 'function') fcAssurePushMoney(allow.money, v);
        });
      });
      textNarr = await resolveFcAssuranceGenerate(
        textNarr,
        allow,
        (buildFcAssurancePacket().period_label || 'Forecast') + ' scenarios'
      );
      suite.narrative = textNarr;
      window._forecastScenarioNarrative = textNarr;
    }
    window._forecastScenarioRunning = null;
    window._forecastMcAt = Date.now();
    paintAnalytics();
    try {
      const sim = fcSimulationSummaryFromMc(suite.mc);
      await ensureForecastAssessment({ render: false, simulation: sim });
    } catch (e) {
      console.warn('[forecast-assurance] post-suite assess skipped', e && e.message);
    }
    paintAnalytics();
    return suite;
  } catch (e) {
    console.warn('[forecast-assurance] scenarios', e);
    window._forecastScenarioRunning = null;
    setProg('Scenario run failed: ' + String(e.message || e), null);
    paintAnalytics();
    return null;
  }
}
window.refreshForecastScenarios = refreshForecastScenarios;


function fcSumSeries(arr) {
  let s = 0, n = 0;
  for (const v of arr || []) {
    if (v != null && !isNaN(v)) { s += v; n += 1; }
  }
  return n ? s : null;
}

function fcYoyPct(curr, prior) {
  if (prior == null || prior === 0 || curr == null) return null;
  return (curr - prior) / Math.abs(prior);
}

/**
 * Outlier review: actuals-through-close vs open-month forecast pace + Dec vs base plan.
 * Forecast-surface framing — not Budget prior-year vs plan.
 */
function runFcHistoryOutlierReview(h1, h2, fy, deltas, plan) {
  const findings = [];
  const pp = (r) => r == null ? '—' : `${(r * 100).toFixed(1)}%`;
  let inLine = 0;
  const push = (f) => findings.push(f);
  const noteInLine = () => { inLine += 1; };

  const paceChecks = [
    { id: 'nn', label: 'Net new ARR', h1: h1.nn, h2: h2.nn, d: deltas.nnH2vsH1, highPp: 40, medPp: 20 },
    { id: 'rev', label: 'Revenue', h1: h1.rev, h2: h2.rev, d: deltas.revH2vsH1, highPp: 35, medPp: 18 },
    { id: 'ebitda', label: 'EBITDA', h1: h1.ebitda, h2: h2.ebitda, d: deltas.ebitdaH2vsH1, highPp: 50, medPp: 25 },
    { id: 'mkt', label: 'Marketing spend', h1: h1.mkt, h2: h2.mkt, d: deltas.mktH2vsH1, highPp: 40, medPp: 20 },
    { id: 'nb', label: 'New Business ARR', h1: h1.nb, h2: h2.nb, d: deltas.nbH2vsH1, highPp: 45, medPp: 22 },
  ];
  paceChecks.forEach(m => {
    if (m.d == null || m.h1 == null) return;
    const stepPp = m.d * 100;
    const abs = Math.abs(stepPp);
    if (abs >= m.highPp) {
      push({
        id: `pace_${m.id}`,
        severity: abs >= m.highPp + 15 ? 'high' : 'medium',
        title: `${m.label}: H2 forecast pace ${stepPp > 0 ? 'accelerates' : 'decelerates'} vs H1 actuals`,
        detail: `H2 ${fM(m.h2, 1)} vs H1 ${fM(m.h1, 1)} (${stepPp > 0 ? '+' : ''}${stepPp.toFixed(1)}pp).`,
        citation: `H1 actuals through close · H2 open-month forecast · ${m.label}`,
        lens: 'intra_year',
      });
    } else if (abs >= m.medPp) {
      push({
        id: `pace_tilt_${m.id}`,
        severity: 'info',
        title: `${m.label}: mild H1→H2 pace shift`,
        detail: `H2 vs H1 ${pp(m.d)}.`,
        citation: `Intra-year · ${m.label}`,
        lens: 'intra_year',
      });
    } else {
      noteInLine();
    }
  });

  if (deltas.arrVsPlan != null) {
    const gapPp = deltas.arrVsPlan * 100;
    const abs = Math.abs(gapPp);
    if (abs >= 3) {
      push({
        id: 'dec_vs_base',
        severity: abs >= 6 ? 'high' : 'medium',
        title: gapPp < 0
          ? 'Dec ARR path short of base plan'
          : 'Dec ARR path above base plan',
        detail: `Forecast Dec ${fM(fy.decArr, 1)} vs base ${fM(fy.targetArr, 1)} (${gapPp > 0 ? '+' : ''}${gapPp.toFixed(1)}%).`,
        citation: 'Forecast Dec EOP vs Plan Summary base-plan line',
        lens: 'vs_plan',
      });
    } else {
      noteInLine();
    }
  }

  if (deltas.arrFromClose != null) {
    const g = deltas.arrFromClose * 100;
    if (Math.abs(g) >= 12) {
      push({
        id: 'close_to_dec',
        severity: Math.abs(g) >= 18 ? 'high' : 'medium',
        title: `Close→Dec ARR move ${g > 0 ? 'steep' : 'compressed'}`,
        detail: `${fM(h1.endArr, 1)} at close → Dec ${fM(fy.decArr, 1)} (${g > 0 ? '+' : ''}${g.toFixed(1)}%).`,
        citation: 'Ending ARR at close vs Dec forecast',
        lens: 'intra_year',
      });
    } else {
      noteInLine();
    }
  }

  if (plan.minCash != null && plan.cashFloor != null && plan.minCash < plan.cashFloor) {
    push({
      id: 'hist_cash_floor',
      severity: 'high',
      title: 'Cash trough below floor on linked path',
      detail: `Min ${fM(plan.minCash, 1)} in ${plan.minCashPeriod || '—'} vs floor ${fM(plan.cashFloor, 1)}.`,
      citation: 'Display CFS ending cash · Plan Assurance floor',
      lens: 'cross_metric',
    });
  } else {
    noteInLine();
  }

  if (deltas.mktH2vsH1 != null && deltas.nnH2vsH1 != null && deltas.mktH2vsH1 > deltas.nnH2vsH1 + 0.20) {
    push({
      id: 'cross_mkt_nn',
      severity: 'medium',
      title: 'Marketing H2 pace outruns net-new ARR',
      detail: `Mkt H2vsH1 ${pp(deltas.mktH2vsH1)} vs net-new ${pp(deltas.nnH2vsH1)}.`,
      citation: 'Program spend vs ARR net new · H1/H2',
      lens: 'cross_metric',
    });
  }

  if (plan.pipelineCoverage != null && plan.pipelineMin != null && plan.pipelineCoverage + 1e-9 < plan.pipelineMin) {
    push({
      id: 'hist_pipe',
      severity: 'medium',
      title: 'Pipeline / NB coverage thin vs min',
      detail: `${Number(plan.pipelineCoverage).toFixed(1)}× vs min ${Number(plan.pipelineMin).toFixed(1)}×.`,
      citation: 'GTM horizon · Pipeline $ / NB ARR',
      lens: 'cross_metric',
    });
  } else if (plan.pipelineCoverage != null) {
    noteInLine();
  }

  push({
    id: 'fc_review_basis',
    severity: 'info',
    title: 'Review basis',
    detail: `Scanned H1 actuals through ${h1.label.replace(/^Actuals through /, '')} vs H2 forecast pace, Dec path vs base plan, cash floor, and pipeline cover. This is actuals↔forecast shape — not prior-year vs next-year plan.`,
    citation: 'runFcHistoryOutlierReview · buildFcAssuranceHistoryPacket',
    lens: 'meta',
  });

  if (inLine > 0) {
    push({
      id: 'in_line_summary',
      severity: 'ok',
      title: `${inLine} checks in line with history / intra-year shape`,
      detail: 'Suppressed from the list above — no material outlier vs thresholds.',
      citation: 'Outlier thresholds in runFcHistoryOutlierReview',
      lens: 'meta',
    });
  }

  const rank = { high: 0, medium: 1, info: 2, low: 3, ok: 4 };
  findings.sort((a, b) => (rank[a.severity] ?? 9) - (rank[b.severity] ?? 9));
  return findings;
}

function buildFcAssuranceHistoryPacket(planPacket) {
  const plan = planPacket || buildFcAssurancePacket();
  const close = getCloseMonth();
  const closeLbl = typeof getCloseMoLabel === 'function' ? getCloseMoLabel() : CLOSE_MO_LABEL;
  const actN = ACT_P.length;

  if (typeof ensureFcGtmState === 'function') {
    try { ensureFcGtmState(); } catch (e) { /* optional */ }
  }

  const nn = ALL_P.map(p => fcArrComponent(p, 'nn'));
  const nb = ALL_P.map(p => fcArrComponent(p, 'nb'));
  const rev = ALL_P.map(p => Number((getDisplayIS(p) || {}).revenue) || 0);
  const ebitda = ALL_P.map(p => Number((getDisplayIS(p) || {}).ebitda) || 0);
  const mkt = ALL_P.map(p => {
    try {
      if (typeof fcGtmAllocate === 'function') return Number(fcGtmAllocate(p).spendTot) || 0;
    } catch (e) { /* optional */ }
    return 0;
  });
  const cash = ALL_P.map(p => {
    const cfs = getDisplayCFS(p) || {};
    return cfs.end_cash != null ? Number(cfs.end_cash) : null;
  });
  const eop = ALL_P.map(p => {
    const a = getForecastARR(p);
    return a && a.arr_eop != null ? Number(a.arr_eop) : null;
  });

  const h1 = {
    label: `Actuals through ${closeLbl}`,
    source: `Locked actuals · Jan–${closeLbl}`,
    nn: fcSumSeries(nn.slice(0, actN)),
    nb: fcSumSeries(nb.slice(0, actN)),
    rev: fcSumSeries(rev.slice(0, actN)),
    ebitda: fcSumSeries(ebitda.slice(0, actN)),
    mkt: fcSumSeries(mkt.slice(0, actN)),
    endArr: eop[actN - 1],
    endCash: cash[actN - 1],
  };
  const h2 = {
    label: `Forecast ${FC_START_LABEL}–Dec`,
    source: 'Open-month forecast path',
    nn: fcSumSeries(nn.slice(actN)),
    nb: fcSumSeries(nb.slice(actN)),
    rev: fcSumSeries(rev.slice(actN)),
    ebitda: fcSumSeries(ebitda.slice(actN)),
    mkt: fcSumSeries(mkt.slice(actN)),
    endArr: plan.decArr,
    endCash: plan.endCash,
  };
  const fy = {
    label: plan.period_label,
    source: 'Actual + Forecast linked path',
    decArr: plan.decArr,
    fyNn: plan.fyNn,
    fyNb: plan.fyNb,
    fyRev: plan.fyRev,
    fyEbitda: plan.fyEbitda,
    fyMkt: plan.fyMkt,
    decCash: plan.endCash,
    targetArr: plan.targetArr,
  };
  const deltas = {
    nnH2vsH1: fcYoyPct(h2.nn, h1.nn),
    nbH2vsH1: fcYoyPct(h2.nb, h1.nb),
    revH2vsH1: fcYoyPct(h2.rev, h1.rev),
    ebitdaH2vsH1: fcYoyPct(h2.ebitda, h1.ebitda),
    mktH2vsH1: fcYoyPct(h2.mkt, h1.mkt),
    arrVsPlan: fcYoyPct(plan.decArr, plan.targetArr),
    arrFromClose: fcYoyPct(plan.decArr, h1.endArr),
  };
  const findings = runFcHistoryOutlierReview(h1, h2, fy, deltas, plan);
  return { closeMonth: close, closeLbl, h1, h2, fy, deltas, findings, plan };
}

function buildDeterministicFcHistoryNarrative(hist) {
  const h = hist || buildFcAssuranceHistoryPacket();
  const d = h.deltas;
  const pp = (r) => r == null ? '—' : `${(r * 100).toFixed(1)}%`;
  const lines = [];
  lines.push(
    `Outlier review vs locked actuals (${h.h1.source}): close ending ARR ${fM(h.h1.endArr, 1)} → Dec forecast ${fM(h.fy.decArr, 1)} (${pp(d.arrFromClose)}), ` +
    `H1 net new ${fM(h.h1.nn, 1)} → H2 ${fM(h.h2.nn, 1)} (${pp(d.nnH2vsH1)}), revenue ${fM(h.h1.rev, 1)} → ${fM(h.h2.rev, 1)} (${pp(d.revH2vsH1)}).`,
  );
  lines.push(
    `Base plan Dec ${fM(h.fy.targetArr, 1)} vs forecast path ${fM(h.fy.decArr, 1)} (${pp(d.arrVsPlan)}). ` +
    `Cash at close ${fM(h.h1.endCash, 1)} → Dec ${fM(h.fy.decCash, 1)}; H1 EBITDA ${fM(h.h1.ebitda, 1)} → H2 ${fM(h.h2.ebitda, 1)}; ` +
    `marketing ${fM(h.h1.mkt, 1)} → ${fM(h.h2.mkt, 1)}. This is actuals-through-close vs open-month forecast — not prior year vs next-year plan.`,
  );
  const flags = (h.findings || []).filter(f => f.severity === 'high' || f.severity === 'medium');
  const infos = (h.findings || []).filter(f => f.severity === 'info' && f.lens !== 'meta');
  if (flags.length) {
    lines.push(`Review items (${flags.length}): ${flags.map(f => f.title).join('; ')}.`);
  } else {
    lines.push('No high/medium outliers vs actuals / forecast shape thresholds.');
  }
  if (infos.length) {
    lines.push(`${infos.length} milder notes (pace / ratio) also listed for optional review.`);
  }
  return lines.join('\n\n');
}

function buildDeterministicFcAssuranceNarrative(packet, risks) {
  const p = packet || buildFcAssurancePacket();
  const rs = risks || getForecastAssuranceRisks(p);
  const highs = rs.filter(r => r.severity === 'high');
  const meds = rs.filter(r => r.severity === 'medium' || r.severity === 'med');
  const assessment = window._forecastPlanAssessment;
  const verdict = (assessment && assessment.feasibility && assessment.feasibility.verdict)
    || (assessment && assessment.feasibility_verdict)
    || null;
  const lines = [];
  lines.push(
    `${p.period_label} targets Dec ARR ${fM(p.targetArr, 1)} from Jan BOP ${fM(p.bopArr, 1)}` +
    (p.closeArrEop != null ? ` (close EOP ${fM(p.closeArrEop, 1)})` : '') +
    (p.yoyGrowthPct != null ? ` (${Number(p.yoyGrowthPct).toFixed(1)}% close→plan)` : '') +
    `. Current Dec path is ${fM(p.decArr, 1)} with FY net new ${fM(p.fyNn, 1)}, FY revenue ${fM(p.fyRev, 1)}, and FY EBITDA ${fM(p.fyEbitda, 1)}.` +
    (verdict ? ` Feasibility verdict: ${String(verdict).toUpperCase()}.` : ''),
  );
  lines.push(
    `ARR bridge (FY): NB ${fM(p.fyNb || 0, 1)}, expansion ${fM(p.fyExp || 0, 1)}, ` +
    `reactivation ${fM(p.fyReact || 0, 1)}, contraction ${fM(p.fyCont || 0, 1)}, ` +
    `churn ${fM(p.fyChurn || 0, 1)}` +
    (p.avgGrr != null ? `; avg GRR ${(p.avgGrr * 100).toFixed(1)}%` : '') +
    (p.minGrr != null ? ` (min month ${(p.minGrr * 100).toFixed(1)}%)` : '') +
    '.',
  );
  const cover = p.pipelineCoverage != null ? Number(p.pipelineCoverage).toFixed(1) + '×' : '—';
  const mktBit = p.fyMkt != null
    ? `GTM sizes ${p.fyMql != null ? Math.round(p.fyMql).toLocaleString() : '—'} MQLs on ${fM(p.fyMkt, 1)} program spend at ${cover} pipeline cover. `
    : `Pipeline / NB cover ${cover}. `;
  const hcBit = (p.janHc != null || p.decHc != null)
    ? `HC ${p.janHc != null ? Math.round(p.janHc) : '—'} → ${p.decHc != null ? Math.round(p.decHc) : '—'}. `
    : '';
  lines.push(
    mktBit + hcBit +
    `Dec ending cash ${fM(p.endCash, 1)} vs floor ${fM(p.cashFloor, 1)} (liquidity cushion, not collections)` +
    (p.minCash != null ? `; trough ${fM(p.minCash, 1)}${p.minCashPeriod ? ' in ' + p.minCashPeriod : ''}` : '') +
    '.',
  );
  if (highs.length) {
    lines.push(`Priority risks: ${highs.map(x => x.title).join('; ')}.`);
  } else if (meds.length) {
    lines.push(`Watch items: ${meds.map(x => x.title).join('; ')}. No high-severity blockers on hard checks.`);
  } else {
    lines.push('Hard checks are clear against current commitments. Review History for H1 actuals vs H2 forecast shape.');
  }
  return lines.join('\n\n');
}

function renderFcAssureFindingRows(items) {
  if (!items || !items.length) return '';
  return items.map(r => {
    const sev = r.severity === 'high' ? 'high'
      : r.severity === 'ok' ? 'ok'
      : r.severity === 'low' ? 'low'
      : r.severity === 'info' ? 'info'
      : 'med';
    const label = r.severity === 'ok' ? 'OK'
      : r.severity === 'info' ? 'note'
      : r.severity;
    const cite = r.citation ? `<div class="assure-cite">${String(r.citation).replace(/</g, '&lt;')}</div>` : '';
    return `<div class="assure-risk"><span class="assure-sev ${sev}">${label}</span><div><strong>${String(r.title).replace(/</g, '&lt;')}</strong><br><span style="color:var(--text3)">${String(r.detail).replace(/</g, '&lt;')}</span>${cite}</div></div>`;
  }).join('');
}

function renderFcMethodCardHtml(card) {
  card = card || window._forecastMcMethodCard || (window._forecastPlanAssessment && window._forecastPlanAssessment.method_card) || null;
  if (!card) return '';
  const priors = card.priors || {};
  const priorBits = Object.keys(priors).map(k => `${k}=${priors[k]}`).join(' · ');
  const notClaimed = (card.not_claimed || []).slice(0, 3).join('; ');
  return `<div class="pa-method-card"><div class="pa-card-lbl" style="margin-bottom:6px">Method & limits</div>
    <div style="font-size:12px;color:var(--text2)">${String(card.source || '').replace(/</g, '&lt;')} — ${(card.notes && card.notes[0] || '').replace(/</g, '&lt;')}</div>
    <div style="font-size:11px;color:var(--text3);margin-top:4px">Priors: ${priorBits.replace(/</g, '&lt;') || '—'}</div>
    <div style="font-size:11px;color:var(--text3);margin-top:2px">Not claimed: ${notClaimed.replace(/</g, '&lt;') || 'PoA / AutoML forecasting'}</div>
  </div>`;
}

function formatFcAssureRunAt(ts) {
  if (!ts) return null;
  try {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
    });
  } catch (e) {
    return null;
  }
}

function fcAssureRunMetaHtml(ts, stale) {
  const when = formatFcAssureRunAt(ts);
  if (!when) return '<span class="assure-run-meta">Not run yet</span>';
  return `<span class="assure-run-meta">${stale ? '<b>Stale</b> · ' : ''}Last run <b>${when}</b></span>`;
}

const FC_ASSURE_TOL_MONEY = 1.0;
const FC_ASSURE_TOL_RATIO = 0.0005;
const FC_ASSURE_TOL_PP = 0.05;

function fcAssurePushMoney(list, v) {
  const n = Number(v);
  if (v == null || isNaN(n)) return;
  list.push(n);
  list.push(Math.abs(n));
}

function fcAssurePushPct(list, v) {
  const n = Number(v);
  if (v == null || isNaN(n)) return;
  if (Math.abs(n) <= 1.5) {
    list.push(n * 100);
    list.push(n);
  } else {
    list.push(n);
    list.push(n / 100);
  }
}

function buildFcAssuranceEvidenceAllowlist(opts) {
  const money = [];
  const pct = [];
  const mult = [];
  const soT = String(opts.soT || '');
  const lane = opts.lane || 'status';
  const packet = opts.packet || null;
  const hist = opts.hist || null;
  const mc = opts.mc || null;

  const addFromText = (text) => {
    const reMoney = /\$?\s*(-?\d{1,3}(?:,\d{3})*(?:\.\d+)?|\d+(?:\.\d+)?)\s*([KkMmBb])?\b/g;
    let m;
    while ((m = reMoney.exec(text))) {
      let v = parseFloat(String(m[1]).replace(/,/g, ''));
      if (isNaN(v)) continue;
      const u = (m[2] || '').toUpperCase();
      if (u === 'K') v *= 1e3;
      else if (u === 'M') v *= 1e6;
      else if (u === 'B') v *= 1e9;
      fcAssurePushMoney(money, v);
    }
    const rePct = /(-?\d+(?:\.\d+)?)\s*%/g;
    while ((m = rePct.exec(text))) fcAssurePushPct(pct, parseFloat(m[1]));
    const reNx = /(-?\d+(?:\.\d+)?)\s*[×xX]\b/g;
    while ((m = reNx.exec(text))) {
      const v = parseFloat(m[1]);
      if (!isNaN(v)) mult.push(v);
    }
  };

  addFromText(soT);

  if (packet) {
    [
      packet.bopArr, packet.decArr, packet.targetArr, packet.fyNn, packet.fyNb, packet.fyExp,
      packet.fyReact, packet.fyCont, packet.fyChurn, packet.fyRev, packet.fyEbitda, packet.endCash,
      packet.cashFloor, packet.fyMkt, packet.minCash,
    ].forEach(v => fcAssurePushMoney(money, v));
    fcAssurePushPct(pct, packet.yoyGrowthPct);
    fcAssurePushPct(pct, packet.avgGrr != null ? packet.avgGrr * 100 : null);
    fcAssurePushPct(pct, packet.minGrr != null ? packet.minGrr * 100 : null);
    if (packet.pipelineCoverage != null) mult.push(Number(packet.pipelineCoverage));
    money.push(packet.fyMql, packet.salesEnd, packet.csEnd, packet.janHc, packet.decHc);
  }

  if (hist) {
    [
      hist.h1 && hist.h1.endArr, hist.h1 && hist.h1.nn, hist.h1 && hist.h1.rev, hist.h1 && hist.h1.ebitda,
      hist.h1 && hist.h1.mkt, hist.h1 && hist.h1.endCash,
      hist.h2 && hist.h2.nn, hist.h2 && hist.h2.rev, hist.h2 && hist.h2.ebitda, hist.h2 && hist.h2.mkt,
      hist.fy && hist.fy.decArr, hist.fy && hist.fy.targetArr, hist.fy && hist.fy.decCash,
    ].forEach(v => fcAssurePushMoney(money, v));
    if (hist.deltas) {
      Object.keys(hist.deltas).forEach(k => {
        fcAssurePushPct(pct, hist.deltas[k] != null ? hist.deltas[k] * 100 : null);
      });
    }
  }

  if (mc) {
    fcAssurePushPct(pct, mc.p_arr_miss != null ? mc.p_arr_miss * 100 : null);
    fcAssurePushPct(pct, mc.p_cash_below_floor != null ? mc.p_cash_below_floor * 100 : null);
    fcAssurePushPct(pct, mc.p_trough_breach != null ? mc.p_trough_breach * 100 : null);
    money.push(mc.n);
    if (mc.cash && mc.cash.p50 != null) fcAssurePushMoney(money, mc.cash.p50);
    if (mc.arr && mc.arr.p50 != null) fcAssurePushMoney(money, mc.arr.p50);
  }

  return { lane, money: money.filter(v => v != null && !isNaN(v)), pct, mult, packet, soT };
}

function extractFcAssuranceMoneyClaims(text) {
  const out = [];
  const re = /\$\s*(-?\d{1,3}(?:,\d{3})*(?:\.\d+)?|\d+(?:\.\d+)?)\s*([KkMmBb])?\b/g;
  let m;
  while ((m = re.exec(text))) {
    let v = parseFloat(String(m[1]).replace(/,/g, ''));
    if (isNaN(v)) continue;
    const u = (m[2] || '').toUpperCase();
    if (u === 'K') v *= 1e3;
    else if (u === 'M') v *= 1e6;
    else if (u === 'B') v *= 1e9;
    out.push(v);
  }
  return out;
}

function extractFcAssurancePctClaims(text) {
  const out = [];
  const re = /(-?\d+(?:\.\d+)?)\s*%/g;
  let m;
  while ((m = re.exec(text))) {
    const v = parseFloat(m[1]);
    if (!isNaN(v)) out.push(v);
  }
  return out;
}

function extractFcAssuranceMultClaims(text) {
  const out = [];
  const re = /(-?\d+(?:\.\d+)?)\s*[×xX]\b/g;
  let m;
  while ((m = re.exec(text))) {
    const v = parseFloat(m[1]);
    if (!isNaN(v)) out.push(v);
  }
  return out;
}

function fcAssureMoneyMatches(claim, allow) {
  for (let i = 0; i < allow.length; i++) {
    const a = allow[i];
    if (Math.abs(a - claim) <= FC_ASSURE_TOL_MONEY) return true;
    const denom = Math.max(1, Math.abs(a));
    if (Math.abs(a - claim) / denom <= FC_ASSURE_TOL_RATIO) return true;
  }
  return false;
}

function fcAssurePctMatches(claim, allow) {
  for (let i = 0; i < allow.length; i++) {
    const a = allow[i];
    if (Math.abs(a - claim) <= FC_ASSURE_TOL_PP) return true;
    if (Math.abs(a * 100 - claim) <= FC_ASSURE_TOL_PP) return true;
    if (Math.abs(a - claim * 100) <= FC_ASSURE_TOL_PP) return true;
  }
  return false;
}

function fcAssuranceStructuralOk(text, allowlist) {
  const t = String(text || '');
  const p = allowlist && allowlist.packet;
  if (p) {
    if ((p.fyChurn || 0) > 1 && /zero\s+churn|no\s+churn|churn[^.!?]{0,48}\b(zero|0(?:\.0+)?)\b/i.test(t)) return false;
    if ((p.fyExp || 0) > 1 && /zero\s+expansion|no\s+expansion|expansion[^.!?]{0,48}\b(zero|0(?:\.0+)?)\b/i.test(t)) return false;
    if ((p.fyCont || 0) > 1 && /zero\s+contraction|no\s+contraction|contraction[^.!?]{0,48}\b(zero|0(?:\.0+)?)\b/i.test(t)) return false;
    if (/collections\s+of\s*\$/i.test(t) && /% of (forecasted )?revenue/i.test(t)) return false;
  }
  if (allowlist.lane === 'history' && /\bprior\s+year\s+vs\s+plan\b/i.test(t) && !/not prior year/i.test(t)) return false;
  return true;
}

function fcAssuranceClaimsVerified(text, allowlist) {
  if (!text || !allowlist) return false;
  if (!fcAssuranceStructuralOk(text, allowlist)) return false;
  const moneyClaims = extractFcAssuranceMoneyClaims(text);
  for (let i = 0; i < moneyClaims.length; i++) {
    if (!fcAssureMoneyMatches(moneyClaims[i], allowlist.money)) return false;
  }
  const pctClaims = extractFcAssurancePctClaims(text);
  for (let i = 0; i < pctClaims.length; i++) {
    if (!fcAssurePctMatches(pctClaims[i], allowlist.pct)) return false;
  }
  const multClaims = extractFcAssuranceMultClaims(text);
  for (let i = 0; i < multClaims.length; i++) {
    const claim = multClaims[i];
    const ok = (allowlist.mult || []).some(a => Math.abs(a - claim) <= FC_ASSURE_TOL_PP || Math.abs(a - claim) / Math.max(0.01, Math.abs(a)) <= FC_ASSURE_TOL_RATIO);
    if (!ok) return false;
  }
  return true;
}

function polishFcAssuranceCommentaryInputs(soT, allowlist, laneLabel) {
  const notes = [

async function polishFcAssuranceNarrative(soT, allowlist, laneLabel) {
  const res = await fetch('/api/v1/commentary/generate', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(polishFcAssuranceCommentaryInputs(soT, allowlist, laneLabel)),
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err.slice(0, 160) || `HTTP ${res.status}`);
  }
  const data = await res.json();
  const exec = data.executive_summary && data.executive_summary.narrative;
  if (exec) return exec;
  if (data.revenue_commentary && data.revenue_commentary.narrative) return data.revenue_commentary.narrative;
  throw new Error('empty_polish');
}

async function resolveFcAssuranceGenerate(soT, allowlist, laneLabel) {
  try {
    const polished = await polishFcAssuranceNarrative(soT, allowlist, laneLabel);
    if (fcAssuranceClaimsVerified(polished, allowlist)) return polished;
    console.warn('[forecast-assurance] polish failed claim verify — keeping engine SoT', laneLabel);
    return soT;
  } catch (e) {
    console.warn('[forecast-assurance] polish unavailable — keeping engine SoT', laneLabel, e && e.message);
    return soT;
  }
}

// ── OVERVIEW · risk strip + same-month YoY (Budget parity) ───────────────────

function fcOvPadMo(i) {
  return String(i).padStart(2, '0');
}
function fcOvYearPeriods(year) {
  return MO12.map((_, i) => `${year}-${fcOvPadMo(i + 1)}`);
}
function fcOvTsIsRow(period) {
  const ts = window.SMPLOutlook && window.SMPLOutlook.getOutlookTsData
    ? window.SMPLOutlook.getOutlookTsData()
    : (window.SMPL_DEMO_TS_DATA || window.TS_DATA);
  if (!ts) return null;
  for (const b of ['Actual', 'Forecast', 'Budget']) {
    if (ts[b] && ts[b].is && ts[b].is[period]) return ts[b].is[period];
  }
  return null;
}
function fcOvTsStmtRow(period, kind) {
  const ts = window.SMPLOutlook && window.SMPLOutlook.getOutlookTsData
    ? window.SMPLOutlook.getOutlookTsData()
    : (window.SMPL_DEMO_TS_DATA || window.TS_DATA);
  if (!ts) return null;
  for (const b of ['Actual', 'Forecast', 'Budget']) {
    if (ts[b] && ts[b][kind] && ts[b][kind][period]) return ts[b][kind][period];
  }
  return null;
}
function fcOvBackcastFromLater(laterEop, laterJanBop) {
  const mom = [];
  let prev = laterJanBop > 0 ? laterJanBop : (laterEop[0] || 1);
  for (let i = 0; i < 12; i++) {
    const cur = laterEop[i] != null ? laterEop[i] : prev;
    mom.push(prev > 0 ? cur / prev : 1);
    prev = cur;
  }
  let prod = mom.reduce((a, b) => a * b, 1) || 1;
  const start = laterJanBop / prod;
  const eop = [];
  let x = start;
  for (let i = 0; i < 12; i++) {
    x *= mom[i];
    eop.push(x);
  }
  eop[11] = laterJanBop;
  const nn = eop.map((v, i) => v - (i === 0 ? start : eop[i - 1]));
  return { eop, nn, bop0: start };
}
function fcOvScaleSeries(base, factor) {
  return base.map(v => v == null ? null : v * factor);
}
function fcOvGrainSeries(monthly12, grain, mode) {
  if (grain === 'm') return monthly12;
  const out = [];
  for (let q = 0; q < 4; q++) {
    const slice = monthly12.slice(q * 3, q * 3 + 3);
    if (mode === 'end') out.push(slice[2]);
    else out.push(slice.reduce((a, b) => a + (b || 0), 0));
  }
  return out;
}

/**
 * Hist ARR for a period only when that calendar year exists in WF/outlook.
 * WF tables are indexed 0..11 for the close year — NEVER pass a prior-year
 * period list into getCombinedArr (that mis-reads FY26 as FY25 and duplicates lines).
 */
function fcOvHistArrRow(period) {
  const y = parseInt(String(period).slice(0, 4), 10);
  const closeY = parseInt(String(getCloseMonth()).slice(0, 4), 10) || parseInt(YEAR, 10) || 2026;
  if (!y || y !== closeY) return null; // prior years → caller backcasts
  try {
    if (window.SMPLOutlook && window.SMPLOutlook.getCombinedArr) {
      const raw = window.SMPLOutlook.getCombinedArr(period, ALL_P, getCloseMonth());
      if (raw && (raw.arr_eop != null || raw.arr_bop != null)) {
        const nb = raw.arr_nb || 0, exp = raw.arr_exp || 0, react = raw.arr_react || 0;
        const cont = raw.arr_cont || 0, churn = raw.arr_nr_churn || raw.arr_churn || 0;
        const nn = raw.arr_nn != null ? raw.arr_nn : (nb + exp + react - cont - churn);
        return { bop: raw.arr_bop, eop: raw.arr_eop, nn };
      }
    }
  } catch (e) { /* optional */ }
  const wf = window.SMPL_ARR_WATERFALL || window.SMPL_DEMO_WF_TABLE || window.WF_TABLE;
  if (wf && wf.Ending) {
    const mo = parseInt(String(period).slice(5, 7), 10);
    const i = (wf.periods && wf.periods.indexOf(period) >= 0)
      ? wf.periods.indexOf(period)
      : (mo >= 1 && mo <= 12 ? mo - 1 : -1);
    if (i >= 0 && i < wf.Ending.length && wf.Ending[i] != null) {
      const eop = Number(wf.Ending[i]);
      const bop = wf.Beginning && wf.Beginning[i] != null ? Number(wf.Beginning[i]) : null;
      const nn = bop != null ? eop - bop : null;
      return { bop, eop, nn };
    }
  }
  return null;
}

/**
 * Same-month YoY series for Overview charts.
 * FY{year} = linked actuals+forecast path; prior years from hist or scaled backcast.
 */
function buildFcYoyCompare() {
  const year = parseInt(YEAR, 10) || 2026;
  const fyCurId = 'fy' + String(year).slice(2);
  const fyPrevId = 'fy' + String(year - 1).slice(2);
  const fyPrev2Id = 'fy' + String(year - 2).slice(2);

  const curEop = ALL_P.map(p => {
    const a = getForecastARR(p);
    return a && a.arr_eop != null ? Number(a.arr_eop) : null;
  });
  const curNn = ALL_P.map(p => fcArrComponent(p, 'nn'));
  const curRev = ALL_P.map(p => Number((getDisplayIS(p) || {}).revenue) || 0);
  const curEbitda = ALL_P.map(p => Number((getDisplayIS(p) || {}).ebitda) || 0);
  const curOpex = ALL_P.map(p => {
    const is = getDisplayIS(p) || {};
    if (is.opex != null) return Number(is.opex);
    return (Number(is.sm) || 0) + (Number(is.rd) || 0) + (Number(is.ga) || 0);
  });
  const curMkt = ALL_P.map(p => {
    try {
      if (typeof fcGtmAllocate === 'function') return Number(fcGtmAllocate(p).spendTot) || 0;
    } catch (e) { /* optional */ }
    return 0;
  });
  const curMqls = ALL_P.map(p => {
    try {
      if (typeof fcGtmAllocate === 'function') return Number(fcGtmAllocate(p).mqlSum) || 0;
    } catch (e) { /* optional */ }
    return 0;
  });
  const curCash = ALL_P.map(p => {
    const cfs = getDisplayCFS(p) || {};
    return cfs.end_cash != null ? Number(cfs.end_cash) : null;
  });
  let curHc = (window.WF_TOTAL_HC || DEMO_TOTAL_HC || []).slice(0, 12);
  if (typeof computeFcHcPlan === 'function') {
    try {
      const plan = computeFcHcPlan();
      curHc = ALL_P.map(p => {
        const row = plan[p];
        return row && row.headsTotal != null ? row.headsTotal : null;
      });
    } catch (e) { /* keep demo */ }
  }
  curHc = curHc.map((v, i) => v != null ? v : (DEMO_TOTAL_HC[i] || 130));

  const janBop = (() => {
    const a = getForecastARR(ALL_P[0]);
    return (a && a.arr_bop != null) ? Number(a.arr_bop) : (curEop[0] || 75e6);
  })();

  const prevP = fcOvYearPeriods(year - 1);
  const prevEopRaw = prevP.map(p => {
    const r = fcOvHistArrRow(p);
    return r && r.eop != null ? r.eop : null;
  });
  const prevNnRaw = prevP.map(p => {
    const r = fcOvHistArrRow(p);
    return r && r.nn != null ? r.nn : null;
  });
  const prevComplete = prevEopRaw.every(v => v != null && v > 0);
  const prevBop0 = (fcOvHistArrRow(prevP[0]) || {}).bop || prevEopRaw[0] || (janBop / 1.16);
  const prev = prevComplete
    ? {
        eop: prevEopRaw,
        nn: prevNnRaw.map((v, i) => v != null ? v : (prevEopRaw[i] - (i ? prevEopRaw[i - 1] : prevBop0))),
        bop0: prevBop0,
      }
    : fcOvBackcastFromLater(curEop.map(v => v != null ? v : janBop), janBop);

  const prev2 = fcOvBackcastFromLater(prev.eop, prev.bop0);

  const prevRevRaw = prevP.map(p => {
    const row = fcOvTsIsRow(p);
    return row && row.revenue != null ? row.revenue : null;
  });
  const prevEbitdaRaw = prevP.map(p => {
    const row = fcOvTsIsRow(p);
    return row && row.ebitda != null ? row.ebitda : null;
  });
  const prevOpexRaw = prevP.map(p => {
    const row = fcOvTsIsRow(p);
    if (!row) return null;
    if (row.total_opex != null) return row.total_opex;
    return (Number(row.sm) || 0) + (Number(row.rd) || 0) + (Number(row.ga) || 0) || null;
  });
  const prevCashRaw = prevP.map(p => {
    const cfs = fcOvTsStmtRow(p, 'cfs');
    if (cfs && (cfs.ending_cash != null || cfs.end_cash != null)) return cfs.ending_cash != null ? cfs.ending_cash : cfs.end_cash;
    const bs = fcOvTsStmtRow(p, 'bs');
    return bs && bs.cash != null ? bs.cash : null;
  });

  const arrScalePrev = prev.eop[11] / (curEop[11] || prev.eop[11] || 1);
  const arrScalePrev2 = prev2.eop[11] / (curEop[11] || prev2.eop[11] || 1);
  const fillPrev = (raw, curSeries, factor) =>
    raw.map((v, i) => (v != null ? v : (curSeries[i] || 0)) * factor);

  const prevRevFill = prevRevRaw.map((v, i) => v != null ? v : curRev[i] * arrScalePrev);
  const prevEbitdaFill = prevEbitdaRaw.map((v, i) => v != null ? v : curEbitda[i] * arrScalePrev);
  const prevOpexFill = prevOpexRaw.map((v, i) => v != null ? v : curOpex[i] * arrScalePrev);
  const openCash = curCash.find(v => v != null) || 46e6;
  // Budget parity: scale the operating-year cash *shape* for priors — never fill a flat
  // constant (openCash * scale), which flattens FY25 across all quarters.
  const curCashFill = curCash.map(v => v != null ? v : openCash);
  const scaleCashPrior = (factor) =>
    prevCashRaw.map((v, i) => (v != null ? v : curCashFill[i]) * factor);
  const prevCashFill = scaleCashPrior(arrScalePrev);
  const prev2CashFill = scaleCashPrior(arrScalePrev2);
  const prevMkt = fcOvScaleSeries(curMkt, arrScalePrev);
  const prevMqls = fcOvScaleSeries(curMqls, arrScalePrev);
  const prevHc = curHc.map(v => Math.max(1, Math.round(v * (prev.bop0 / janBop))));
  const prev2Hc = curHc.map(v => Math.max(1, Math.round(v * (prev2.bop0 / janBop))));
  prevHc[11] = Math.round(curHc[0] || prevHc[11]);
  prev2Hc[11] = prevHc[0];

  const closeLbl = typeof getCloseMoLabel === 'function' ? getCloseMoLabel() : CLOSE_MO_LABEL;
  const years = [
    {
      id: fyPrev2Id, label: 'FY' + String(year - 2).slice(2), color: '#72826a', dash: [4, 3], width: 1.5, optional: true,
      eop: prev2.eop, nn: prev2.nn,
      rev: fcOvScaleSeries(prevRevFill, arrScalePrev2 / arrScalePrev),
      hc: prev2Hc,
      ebitda: fillPrev(prevEbitdaRaw, curEbitda, arrScalePrev2),
      opex: fillPrev(prevOpexRaw, curOpex, arrScalePrev2),
      mkt: fcOvScaleSeries(curMkt, arrScalePrev2),
      mqls: fcOvScaleSeries(curMqls, arrScalePrev2),
      cash: prev2CashFill,
    },

/** Plan/commit gaps are notes on Forecast; historical shape risks stay elevated. */
function fcRemapOverviewRisk(r) {
  if (!r) return r;
  const id = String(r.id || '');
  const title = String(r.title || '');
  const isPlanGap = id === 'arr_path'
    || /YoY target/i.test(title)
    || /vs base plan/i.test(title)
    || /short of base plan/i.test(title)
    || id === 'dec_vs_base';
  if (isPlanGap && (r.severity === 'high' || r.severity === 'medium' || r.severity === 'med')) {
    return Object.assign({}, r, {
      severity: 'info',
      title: /YoY target/i.test(title) ? 'Dec ARR vs base plan' : title.replace(/YoY target/i, 'base plan'),
      detail: (r.detail || '') + (/historical/i.test(r.detail || '') ? '' : ' · forecast vs plan (not a historical shape risk)'),
    });
  }
  return r;
}

/** Historical shape checks for Overview — YoY growth / funnel conversion vs prior. */
function buildFcHistShapeRisks(packet) {
  const out = [];
  try {
    const years = buildFcYoyCompare();
    const cur = years.find(y => !y.optional && String(y.id).indexOf(String((packet && packet.budget_year) || YEAR).slice(2)) >= 0)
      || years[years.length - 1];
    const prev = years.filter(y => y !== cur && !y.optional).pop() || years.find(y => y.optional === false);
    if (cur && prev && cur.eop && prev.eop) {
      const curG = prev.eop[11] > 0 ? (cur.eop[11] / prev.eop[11] - 1) : null;
      // Prior YoY ≈ growth into prev Dec from backcast start (rough): prev Dec / prev Jan
      const prevJan = prev.eop[0] != null && prev.nn ? (prev.eop[0] - (prev.nn[0] || 0)) : null;
      const prevG = prevJan > 0 ? (prev.eop[11] / prevJan - 1) : null;
      if (curG != null && prevG != null) {
        const deltaPp = (curG - prevG) * 100;
        if (Math.abs(deltaPp) >= 12) {
          out.push({
            id: 'yoy_growth_shape',
            severity: Math.abs(deltaPp) >= 20 ? 'high' : 'medium',
            title: `YoY ARR growth ${deltaPp > 0 ? 'accelerates' : 'decelerates'} vs prior year`,
            detail: `FY path ${(curG * 100).toFixed(1)}% vs prior ${(prevG * 100).toFixed(1)}% (${deltaPp > 0 ? '+' : ''}${deltaPp.toFixed(1)}pp).`,
            citation: 'Same-month YoY · Ending ARR Dec / prior Dec',
          });
        } else {
          out.push({
            id: 'yoy_growth_shape',
            severity: 'ok',
            title: 'YoY ARR growth vs prior',
            detail: `FY ${(curG * 100).toFixed(1)}% vs prior ${(prevG * 100).toFixed(1)}% — in line.`,
            citation: 'Same-month YoY · Ending ARR',
          });
        }
      }
      // MQL conversion proxy: closed NB ARR / MQLs when both sides present
      const sum = (arr) => (arr || []).reduce((s, v) => s + (Number(v) || 0), 0);
      const curMql = sum(cur.mqls), prevMql = sum(prev.mqls);
      const curNb = sum(cur.nn) > 0 ? (packet.fyNb != null ? Number(packet.fyNb) : sum(cur.nn) * 0.55) : null;
      // Prefer live NB from packet for current; scale prior NB by ARR ratio
      const liveNb = packet.fyNb != null ? Number(packet.fyNb) : null;
      const prevNb = liveNb != null && cur.eop[11] > 0
        ? liveNb * (prev.eop[11] / cur.eop[11])
        : null;
      if (liveNb != null && curMql > 0 && prevNb != null && prevMql > 0) {
        const curCnv = liveNb / curMql;
        const prevCnv = prevNb / prevMql;
        const ratio = prevCnv > 0 ? curCnv / prevCnv : null;
        if (ratio != null && (ratio < 0.7 || ratio > 1.45)) {
          out.push({
            id: 'mql_conversion_shape',
            severity: (ratio < 0.55 || ratio > 1.7) ? 'high' : 'medium',
            title: 'MQL conversion vs prior year',
            detail: `NB/MQL $${(curCnv).toFixed(0)} vs prior $${(prevCnv).toFixed(0)} (${((ratio - 1) * 100) > 0 ? '+' : ''}${((ratio - 1) * 100).toFixed(0)}%).`,
            citation: 'GTM MQLs · New Business ARR · same-month YoY',
          });
        } else if (ratio != null) {
          out.push({
            id: 'mql_conversion_shape',
            severity: 'ok',
            title: 'MQL conversion vs prior year',
            detail: `NB/MQL in line with prior (${(ratio * 100).toFixed(0)}% of prior).`,
            citation: 'GTM MQLs · New Business ARR',
          });
        }
      }
    }
  } catch (e) { /* optional */ }
  return out;
}

/** Priority order for Plan Assurance /assess risk strips: high → med → low → note → OK. */
function fcRiskSeverityRank(sev) {
  const s = String(sev || '').toLowerCase();
  if (s === 'high' || s === 'must_close') return 0;
  if (s === 'medium' || s === 'med' || s === 'must_confirm') return 1;
  if (s === 'low') return 2;
  if (s === 'info' || s === 'note' || s === 'advisory') return 3;
  if (s === 'ok' || s === 'must_hold' || s === 'pass') return 4;
  return 5;
}
function fcSortRisksBySeverity(risks) {
  return (risks || []).slice().sort((a, b) => {
    const d = fcRiskSeverityRank(a && a.severity) - fcRiskSeverityRank(b && b.severity);
    if (d !== 0) return d;
    return String((a && a.title) || '').localeCompare(String((b && b.title) || ''));
  });
}

function getFcOverviewRisks(packet) {
  const p = packet || buildFcAssurancePacket();
  const assess = (getForecastAssuranceRisks(p) || []).map(fcRemapOverviewRisk);
  let handoff = [];
  try {
    const hist = buildFcAssuranceHistoryPacket(p);
    handoff = (hist.findings || [])
      .filter(f => f && (f.severity === 'high' || f.severity === 'medium'))
      .map(fcRemapOverviewRisk);
  } catch (e) { /* optional */ }
  const shape = buildFcHistShapeRisks(p);
  const seen = new Set();
  const merged = [];
  [shape, assess, handoff].forEach(list => {
    (list || []).forEach(r => {
      const key = String(r.id || r.title);
      if (seen.has(key)) return;
      seen.add(key);
      merged.push({
        id: r.id,
        severity: r.severity,
        title: r.title,
        detail: r.detail,
        citation: r.citation || '',
      });
    });
  });
  return fcSortRisksBySeverity(merged);
}

function renderFcOverviewRiskRows(risks) {
  if (!risks || !risks.length) return '<div style="color:var(--text3)">No checks yet.</div>';
  return fcSortRisksBySeverity(risks).map(r => {
    const sev = r.severity === 'high' ? 'high'
      : r.severity === 'ok' ? 'ok'
      : r.severity === 'low' ? 'low'
      : r.severity === 'info' ? 'info'
      : 'med';
    const label = r.severity === 'ok' ? 'OK'
      : r.severity === 'info' ? 'note'
      : (r.severity === 'medium' || r.severity === 'med') ? 'medium'
      : r.severity;
    const cite = r.citation ? `<div class="assure-cite">${String(r.citation).replace(/</g, '&lt;')}</div>` : '';
    return `<div class="assure-risk"><span class="assure-sev ${sev}">${label}</span><div><strong>${String(r.title || '').replace(/</g, '&lt;')}</strong><br><span style="color:var(--text3)">${String(r.detail || '').replace(/</g, '&lt;')}</span>${cite}</div></div>`;
  }).join('');
}

function buildGtmHorizonSummary(){
  const lv=getLevers();
  let wtdNb=0,wtdExp=0,grossRen=0,wtdRen=0,dealN=0,renN=0;
  let pipelineDollar=0; // gross NB CRM pipe — Budget: pipeline / NB ARR
  FC_P.forEach(p=>{
    const opps=SRC.opp_pipeline[p]||{};
    const nb=opps['New Business']||{};
    const exp=opps['Expansion']||{};
    pipelineDollar+=(nb.total||0);
    wtdNb+=(nb.weighted||0)*(lv.nb||1);
    wtdExp+=(exp.weighted||0)*(lv.exp||1);
    dealN+=(nb.count||0)+(exp.count||0);
    const ren=SRC.renewals[p]||{};
    grossRen+=ren.arr||0;
    wtdRen+=(ren.weighted||0)*(1+(lv.ren_adj||0));
    renN+=ren.count||0;
  });
  // Budget parity: coverage = Pipeline $ / New Business ARR (not vs Dec ARR gap).
  const coverX=wtdNb>0?pipelineDollar/wtdNb:null;
  return {wtdNb,wtdExp,grossRen,wtdRen,dealN,renN,pipelineDollar,coverX,coverPool:pipelineDollar};
}

    if(!janBop) return null;
    var totExp=0, totReact=0, totCont=0, totChurn=0;
    ALL_P.forEach(function(p){
      var d=getARR(p);
      if(!d) return;
      totExp+=d.arr_exp||0;
      totReact+=d.arr_react||0;
      totCont+=d.arr_cont||0;
      totChurn+=(d.arr_nr_churn||0)+(d.ren_churn||0);
    });
    if(key==='grr') return (janBop-totCont-totChurn)/janBop;
    if(key==='nrr') return (janBop+totExp+totReact-totCont-totChurn)/janBop;
    return null;
  }

  var stmtTable=buildStmtTable(allP,cfg,rows,getARR,{
    fyTotal:true,
    colorMode:'is',
    getFyTotal:function(r){
      if(r.pct&&(r.key==='nrr'||r.key==='grr')) return fyArrRetention(r.key);
      if(r.pct||r.color===false) return null;
      if(r.key==='arr_bop'){
        var jan=getARR(ALL_P[0]);
        return jan&&jan.arr_bop!=null?jan.arr_bop:null;
      }
      if(r.key==='arr_eop'){
        var dec=getARR(FC_P[FC_P.length-1]);
        return dec&&dec.arr_eop!=null?dec.arr_eop:null;
      }
      if(r.churn){
        return ALL_P.reduce(function(s,p){
          var d=getARR(p);
          return d?s+(d.arr_nr_churn||0)+(d.ren_churn||0):s;
        },0);
      }
      if(r.key){
        return ALL_P.reduce(function(s,p){
          var d=getARR(p);
          return d?s+(d[r.key]||0):s;
        },0);
      }
      return null;
    }
  });

  // Cumulative bridge — same pipeline source as ARR Waterfall Detail table
  var junArr=getForecastARR(CLOSE_MONTH);
  var bop_arr=junArr&&junArr.arr_eop!=null?junArr.arr_eop:0;
  function sumFcArr(field){
    return FC_P.reduce(function(s,p){
      var d=getForecastARR(p);
      if(!d) return s;
      if(field==='churn') return s+(d.arr_nr_churn||0)+(d.ren_churn||0);
      return s+(d[field]||0);
    },0);
  }
  var nb_cum=sumFcArr('arr_nb');
  var exp_cum=sumFcArr('arr_exp');
  var react_cum=sumFcArr('arr_react');
  var cont_cum=-sumFcArr('arr_cont');
  var churn_cum=-sumFcArr('churn');
  var decArr=getForecastARR(FC_P[FC_P.length-1]);
  var dec_eop=decArr&&decArr.arr_eop!=null?decArr.arr_eop:bop_arr;
  var net_change=dec_eop-bop_arr;

  // Build waterfall steps
  var steps=[];
  var running=bop_arr;
  function addAnchor(lbl,val){steps.push({lbl:lbl,val:val,running:val,offset:0,isAnchor:true,isNeg:false});running=val;}
  function addBar(lbl,val){var isNeg=val<0;var offset=isNeg?running+val:running;steps.push({lbl:lbl,val:val,running:running+val,offset:offset,isAnchor:false,isNeg:isNeg});running+=val;}
  addAnchor(CLOSE_MO_LABEL+'\nAct',bop_arr);
  addBar('New\nBusiness',nb_cum);
  addBar('Expansion',exp_cum);
  addBar('Reactivation',react_cum);
  addBar('Contraction',cont_cum);
  addBar('Churn',churn_cum);
  addAnchor('Dec\nFcst',dec_eop);

  var offsets=steps.map(function(s){return+(s.offset/1e6).toFixed(3);});
  var barVals=steps.map(function(s){return+(Math.abs(s.val)/1e6).toFixed(3);});

  area.innerHTML='<div class="slide">'+
    '<div class="slide-title">ARR Waterfall · '+hz.replace('p','+')+' Horizon</div>'+
    '<div class="slide-sub">'+cfg.label+' · Read-only bridge from GTM / renewals — edit attainment on GTM</div>'+

    });
    var labelPlugin={
      id:'wfLabels',
      afterDatasetsDraw:function(chart){

        if(!stps||!stps.length) return;
        var ctx=chart.ctx;
        var meta=chart.getDatasetMeta(1);
        var yAxis=chart.scales.y;
        ctx.save();
        ctx.textAlign='center';
        ctx.font='bold 10px system-ui,sans-serif';
        stps.forEach(function(s,i){
          var bar=meta.data[i];
          if(!bar) return;
          var barTop=Math.min(bar.y,bar.base);
          var barBot=Math.max(bar.y,bar.base);
          var barH=barBot-barTop;
          var mid=(barTop+barBot)/2;
          var label=s.isAnchor?fM(Math.abs(s.val),1):(s.isNeg?'-':'+')+fM(Math.abs(s.val),1);
          if(s.isAnchor){
            ctx.textBaseline='top';
            ctx.fillStyle=i===0?tokens.cPos:tokens.cAmber;
            ctx.fillText(label,bar.x,barTop+8);
          } else if(barH>=18){

            ctx.fillStyle='rgba(255,255,255,0.95)';
            ctx.fillText(label,bar.x,mid);
          } else {
            ctx.textBaseline='bottom';
            ctx.font='bold 9px system-ui,sans-serif';
            ctx.fillStyle=s.isNeg?tokens.cNeg:tokens.cPos;
            ctx.fillText(label,bar.x,s.isNeg?barBot+10:barTop-8);
            ctx.font='bold 10px system-ui,sans-serif';
          }
          if(i<stps.length-1){
            var nextBar=meta.data[i+1];
            if(nextBar){
              var runY=yAxis.getPixelForValue(s.running/1e6);
              ctx.beginPath();
              ctx.strokeStyle='rgba(120,120,120,0.3)';
              ctx.setLineDash([3,3]);
              ctx.lineWidth=1;
              ctx.moveTo(bar.x+bar.width/2+2,runY);

            }
          }
        });
        ctx.restore();

    };
    mk('arrBridgeC',{

          {data:offsets,backgroundColor:'rgba(0,0,0,0)',borderColor:'rgba(0,0,0,0)',borderWidth:0,stack:'wf'},

          x:{stacked:true,...tokens.baseScaleX,ticks:{...tokens.baseScaleX.ticks,maxRotation:0}},

            ...tokens.baseScaleY(function(v){return '$'+v.toFixed(0)+'M';})
          }
        }
      },
      plugins:[labelPlugin]
    });

  },60);
}

function ensureFcPlState() {
  if (!fcPlSpend) fcPlSpend = {};
  FC_PL_DEPTS.forEach(d => {
    if (!fcPlSpend[d.key]) fcPlSpend[d.key] = {};
    d.sections.forEach(sec => {
      sec.lines.forEach(line => {
        if (line.from === 'flat' && !fcPlSpend[d.key][line.k]) fcPlSpend[d.key][line.k] = {};
      });
    });
  });
}

function fcPlFlatAmt(deptKey, lineKey, period, flatMonthly) {
  ensureFcPlState();
  const row = (fcPlSpend[deptKey] && fcPlSpend[deptKey][lineKey]) || {};
  if (row[period] != null && !isNaN(Number(row[period]))) return Math.max(0, Number(row[period]));
  return Math.max(0, Number(flatMonthly) || 0);
}

function fcPlGtmProgram(period) {
  if (typeof ensureFcGtmState === 'function' && typeof fcGtmAllocate === 'function') {
    ensureFcGtmState();
    return Math.max(0, Number(fcGtmAllocate(period).spendTot) || 0);
  }
  return 0;
}

/**
 * HC cost layer on top of headcount plan — wages / benefits / bonus / severance / OTE.
 * Uses avg loaded rates (Budget-aligned) until roster-level comp is wired.
 */
function computeFcHcComp() {
  if (typeof computeFcHcPlan !== 'function') return null;
  const plan = computeFcHcPlan();
  const loadPct = FC_PL_TAX_PCT + FC_PL_BEN_PCT + FC_PL_K401_PCT;
  ALL_P.forEach(p => {
    const row = plan[p];
    if (!row) return;
    row.wages = {};
    row.employeeBenefits = {};
    row.bonusAccrual = {};
    row.severance = {};
    row.ote = {};
    row.payroll = {};
    (typeof FC_HC_DEPTS !== 'undefined' ? FC_HC_DEPTS : []).forEach(d => {
      const heads = Number(row.ending && row.ending[d.key]) || 0;
      const annual = FC_PL_AVG_ANNUAL[d.key] || 120000;
      const wages = heads * (annual / 12);
      const employeeBenefits = wages * loadPct;
      const bonusAccrual = FC_PL_CORP_BONUS[d.key] ? wages * FC_PL_BONUS_PCT : 0;
      let ote = 0;
      if (d.key === 'sales') ote = heads * (FC_PL_NB_OTE / 12);
      if (d.key === 'cs') ote = heads * (FC_PL_CS_OTE / 12);
      let sev = 0;
      if (typeof fcHcRifsForPeriod === 'function') {
        fcHcRifsForPeriod(p).filter(r => r.dept === d.key).forEach(r => {
          const weekly = annual / 52;
          sev += (Number(r.heads) || 0) * weekly * (Number(r.weeks) || 0);
        });
      }
      row.wages[d.key] = wages;
      row.employeeBenefits[d.key] = employeeBenefits;
      row.bonusAccrual[d.key] = bonusAccrual;
      row.severance[d.key] = sev;
      row.ote[d.key] = ote;
      row.payroll[d.key] = wages + employeeBenefits + bonusAccrual + ote;
    });
  });
  return plan;
}

function fcPlLineAmt(spec, sec, line, period, hcRow) {
  const hcKey = sec.hcKey;
  const h = hcRow || {};
  const share = (sec.payShare != null && sec.payShare > 0)
    ? sec.payShare
    : (sec.payShare === 0 ? 0 : 1);
  if (line.from === 'hc_wages') return Number(h.wages && h.wages[hcKey]) || 0;
  if (line.from === 'hc_benefits') return Number(h.employeeBenefits && h.employeeBenefits[hcKey]) || 0;
  if (line.from === 'hc_bonus') return Number(h.bonusAccrual && h.bonusAccrual[hcKey]) || 0;
  if (line.from === 'hc_severance') return Number(h.severance && h.severance[hcKey]) || 0;
  if (line.from === 'hc_wages_share') return (Number(h.wages && h.wages[hcKey]) || 0) * share;
  if (line.from === 'hc_benefits_share') return (Number(h.employeeBenefits && h.employeeBenefits[hcKey]) || 0) * share;
  if (line.from === 'hc_bonus_share') return (Number(h.bonusAccrual && h.bonusAccrual[hcKey]) || 0) * share;
  if (line.from === 'hc_severance_share') return (Number(h.severance && h.severance[hcKey]) || 0) * share;
  if (line.from === 'ote_nb') return Number(h.ote && h.ote.sales) || 0;
  if (line.from === 'ote_cs') return Number(h.ote && h.ote.cs) || 0;
  if (line.from === 'gtm_program') return fcPlGtmProgram(period);
  if (line.from === 'flat') return fcPlFlatAmt(spec.key, line.k, period, line.flatMonthly);
  return 0;
}

function computeFcDeptPlPeriod(period, opts) {
  opts = opts || {};
  const close = getCloseMonth();
  const isAct = period <= close;
  let revenue = opts.revenue;
  if (isAct && SRC.actuals && SRC.actuals[period]) {
    revenue = SRC.actuals[period].revenue;
  } else if (revenue == null) {
    const arr = (typeof getForecastARR === 'function') ? getForecastARR(period) : null;
    const sub = arr && arr.arr_eop != null ? arr.arr_eop / 12 : 0;
    revenue = sub * 1.033;
  }

  const hcPlan = computeFcHcComp();
  const hcRow = hcPlan && hcPlan[period] ? hcPlan[period] : {
    wages: {}, employeeBenefits: {}, bonusAccrual: {}, severance: {}, ote: {},
  };

  const depts = {};
  let sm = 0, rd = 0, ga = 0;
  let salesPl = 0, mktPl = 0, salesNb = 0, salesCs = 0;

  FC_PL_DEPTS.forEach(spec => {
    const sections = {};
    let total = 0;
    const linesAgg = {};
    spec.sections.forEach(sec => {
      const secLines = {};
      let secTot = 0;
      sec.lines.forEach(line => {
        const amt = fcPlLineAmt(spec, sec, line, period, hcRow);
        secLines[line.k] = amt;
        linesAgg[line.k] = (linesAgg[line.k] || 0) + amt;
        secTot += amt;
        total += amt;
      });
      sections[sec.key] = { label: sec.label, total: secTot, lines: secLines };
      if (sec.key === 'nb') salesNb = secTot;
      if (sec.key === 'cs') salesCs = secTot;
    });
    depts[spec.key] = { total, lines: linesAgg, sections };
    if (spec.isLine === 'sm') sm += total;
    else if (spec.isLine === 'rd') rd += total;
    else if (spec.isLine === 'ga') ga += total;
    if (spec.key === 'sales') salesPl = total;
    if (spec.key === 'marketing') mktPl = total;
  });

  // Actual months: keep IS opex from books; dept detail is the HC/flat estimate.
  if (isAct && SRC.actuals && SRC.actuals[period]) {
    const a = SRC.actuals[period];
    sm = a.sm || sm;
    rd = a.rd || rd;
    ga = a.ga || ga;
  }

  return {
    revenue: revenue || 0,
    depts,
    sm, rd, ga,
    opex: sm + rd + ga,
    salesPl, mktPl, salesNb, salesCs,
    is_actual: isAct,
  };
}

function resolveFcPlOpex(period, revenue, lv) {
  const pl = computeFcDeptPlPeriod(period, { revenue, lv });
  return { sm: pl.sm, rd: pl.rd, ga: pl.ga, pl };
}

function setFcPlDept(key) {
  fcPlDept = key || 'total';
  showTab('pnl');
}

function updateFcPlSpend(deptKey, lineKey, period, rawM) {
  ensureFcPlState();
  if (!fcPlSpend[deptKey]) fcPlSpend[deptKey] = {};
  if (!fcPlSpend[deptKey][lineKey]) fcPlSpend[deptKey][lineKey] = {};
  fcPlSpend[deptKey][lineKey][period] = Math.max(0, Math.round((Number(rawM) || 0) * 1e6));
  markScenarioDirty();
  refresh();
}

function fcPlSpendInput(deptKey, lineKey, period, amt) {
  const m = (amt || 0) / 1e6;
  const v = m >= 10 ? m.toFixed(2) : m.toFixed(3);
  return `<input class="hc-hire" style="width:58px;color:var(--amber)" value="${v}" title="Edit $M"
    onchange="updateFcPlSpend('${deptKey}','${lineKey}','${period}',this.value)"
    onclick="event.stopPropagation()">`;
}

function fcPlMonthHeaders(periods) {
  if (typeof fcGtmMonthHeaders === 'function') return fcGtmMonthHeaders(periods, { selectable: false });
  return periods.map(p => {
    const mo = MO12[parseInt(p.slice(5), 10) - 1];
    const isFc = p > getCloseMonth();
    return `<th class="${isFc ? 'fc-h' : 'act-h'}"><span class="hc-mo">${mo}</span><span class="hc-tag">${isFc ? 'Fcst' : 'Act'}</span></th>`;
  }).join('') + '<th class="fy-h">FY</th>';
}

  const dept = fcPlDept || 'total';
  const lv = getLevers();

  const revenueByPeriod = {};
  allP.forEach(p => {
    if (p <= close && SRC.actuals && SRC.actuals[p]) {
      revenueByPeriod[p] = SRC.actuals[p].revenue;
    } else {
      const arr = getForecastARR(p);
      const sub = arr && arr.arr_eop != null ? arr.arr_eop / 12 : 0;
      revenueByPeriod[p] = sub * 1.033;
    }
  });

  const plAll = {};
  allP.forEach(p => {
    plAll[p] = computeFcDeptPlPeriod(p, { revenue: revenueByPeriod[p], lv });
  });

  const fy = (fn) => allP.reduce((s, p) => s + (fn(plAll[p], p) || 0), 0);
  const fyRev = fy(r => r.revenue);
  const fySm = fy(r => r.sm);
  const fyRd = fy(r => r.rd);
  const fyGa = fy(r => r.ga);
  const fySales = fy(r => r.salesPl);
  const fyMkt = fy(r => r.mktPl);
  const fyEbitda = allP.reduce((s, p) => s + (getDisplayIS(p)?.ebitda || 0), 0);
  const fyCogs = allP.reduce((s, p) => {
    const is = getDisplayIS(p);
    if (is && is.cogs != null) return s + is.cogs;
    return s + (revenueByPeriod[p] || 0) * (lv.cogs || 0.29);
  }, 0);
  const fyGp = fyRev - fyCogs;

  const tabs = [{ key: 'total', label: 'Total' }].concat(FC_PL_DEPTS.map(d => ({ key: d.key, label: d.label })));

  let html = `<div class="slide">
    <div class="slide-title">P&amp;L · Act + Fcst</div>

    <div class="hc-toolbar">
      ${tabs.map(t => `<button type="button" class="hc-tog${dept === t.key ? ' on' : ''}" onclick="setFcPlDept('${t.key}')">${t.label}</button>`).join('')}
    </div>`;

  if (dept === 'total') {
    html += `
    <div class="kpi-strip ks5">
      <div class="kpi"><div class="kpi-lbl">Gross margin</div><div class="kpi-val">${fyRev ? fP(fyGp / fyRev) : '—'}</div></div>
      <div class="kpi"><div class="kpi-lbl">S&amp;M % rev</div><div class="kpi-val">${fyRev ? fP(fySm / fyRev) : '—'}</div></div>
      <div class="kpi"><div class="kpi-lbl">R&amp;D % rev</div><div class="kpi-val">${fyRev ? fP(fyRd / fyRev) : '—'}</div></div>
      <div class="kpi"><div class="kpi-lbl">G&amp;A % rev</div><div class="kpi-val">${fyRev ? fP(fyGa / fyRev) : '—'}</div></div>
      <div class="kpi"><div class="kpi-lbl">EBITDA margin</div><div class="kpi-val" style="color:${fyEbitda >= 0 ? 'var(--teal)' : 'var(--amber)'}">${fyRev ? fP(fyEbitda / fyRev) : '—'}</div></div>
    </div>
    <div class="hc-banner">Sales ${fM(fySales)} + Marketing ${fM(fyMkt)} = S&amp;M ${fM(fySm)} · R&amp;D ${fM(fyRd)} · G&amp;A ${fM(fyGa)}. Open a department tab for salaries, benefits, bonus, severance, and T&amp;E.</div>
    <div class="hc-wrap"><table class="hc-tbl"><thead><tr><th class="act-h line-h" aria-hidden="true"></th>${fcPlMonthHeaders(allP)}</tr></thead><tbody>`;

    const totalRows = [
      { sec: 'Revenue & gross profit' },
      { k: 'revenue', label: 'Total revenue', tot: true },
      { k: 'cogs', label: 'Cost of revenue' },
      { k: 'gp', label: 'Gross profit', tot: true },
      { k: 'gm', label: 'Gross margin %', pct: true },
      { sec: 'Department opex (feeds IS)' },
      { k: 'salesNb', label: 'Sales - New Business', open: 'sales' },
      { k: 'salesCs', label: 'Sales - Customer Success', open: 'sales' },
      { k: 'mktPl', label: 'Marketing', open: 'marketing' },
      { k: 'sm', label: 'S&M', tot: true },
      { k: 'rd', label: 'R&D / Product', open: 'rd' },
      { k: 'ga', label: 'G&A', open: 'ga' },
      { k: 'opex', label: 'Total OpEx', tot: true },
      { sec: 'Bottom line' },
      { k: 'ebitda', label: 'EBITDA', tot: true },
      { k: 'ni', label: 'Net income', tot: true },
    ];

    totalRows.forEach(row => {
      if (row.sec) {
        html += `<tr class="sec"><td colspan="${allP.length + 2}">${row.sec}</td></tr>`;
        return;
      }
      const openBtn = row.open
        ? ` <button type="button" class="hc-tog" style="padding:1px 7px;font-size:9px;margin-left:6px" onclick="setFcPlDept('${row.open}')">open</button>`

      html += `<tr class="${row.tot ? 'tot' : ''}"><td>${row.label}${openBtn}</td>`;
      let fySum = 0;
      allP.forEach(p => {
        const is = getDisplayIS(p) || {};
        const pl = plAll[p];
        const isFc = p > close;
        let val = 0;
        if (row.k === 'revenue') val = is.revenue != null ? is.revenue : pl.revenue;
        else if (row.k === 'cogs') val = is.cogs != null ? is.cogs : (pl.revenue * (lv.cogs || 0.29));
        else if (row.k === 'gp') {
          val = is.gross_profit != null ? is.gross_profit
            : ((is.revenue != null ? is.revenue : pl.revenue) - (is.cogs != null ? is.cogs : pl.revenue * (lv.cogs || 0.29)));
        } else if (row.k === 'gm') {
          const rev = is.revenue != null ? is.revenue : pl.revenue;
          const gp = is.gross_profit != null ? is.gross_profit
            : (rev - (is.cogs != null ? is.cogs : rev * (lv.cogs || 0.29)));
          html += `<td class="${isFc ? 'fc-c' : 'act-c'}">${rev ? fP(gp / rev) : '—'}</td>`;
          return;
        } else if (row.k === 'salesNb') val = pl.salesNb;
        else if (row.k === 'salesCs') val = pl.salesCs;
        else if (row.k === 'mktPl') val = pl.mktPl;
        else if (row.k === 'sm') val = is.sm != null ? is.sm : pl.sm;
        else if (row.k === 'rd') val = is.rd != null ? is.rd : pl.rd;
        else if (row.k === 'ga') val = is.ga != null ? is.ga : pl.ga;
        else if (row.k === 'opex') val = is.total_opex != null ? is.total_opex : pl.opex;
        else if (row.k === 'ebitda') val = is.ebitda != null ? is.ebitda : 0;
        else if (row.k === 'ni') val = is.net_income != null ? is.net_income : 0;
        fySum += val;
        html += `<td class="${isFc ? 'fc-c' : 'act-c'}">${fM(val)}</td>`;
      });
      if (row.pct) {
        html += `<td class="fy-c">${fyRev ? fP(fyGp / fyRev) : '—'}</td>`;
      } else {
        html += `<td class="fy-c">${fM(fySum)}</td>`;
      }
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
    area.innerHTML = html;
    return;
  }

  const spec = FC_PL_DEPTS.find(d => d.key === dept);
  const fyDept = fy(r => (r.depts[spec.key] && r.depts[spec.key].total) || 0);
  html += `
    <div class="hc-banner"><strong>${spec.label}</strong> → IS · ${spec.isLabel} · FY ${fM(fyDept)}.
      Salaries, benefits, bonus, and severance come from ${typeof showTab === 'function' ? 'Headcount' : 'HC'} (heads × loaded rates).
      ${spec.key === 'marketing'
        ? 'Program spend is the GTM total (edit channels on the GTM tab). Martech is discretionary here.'
        : 'Amber cells are forecast discretionary ($M) — use them to model spending changes for the rest of the year.'}
    </div>
    <div class="hc-legend"><i></i> Amber = forecast discretionary ($M). Comp lines follow Headcount. Actual months are locked.</div>
    <div class="hc-wrap"><table class="hc-tbl"><thead><tr><th class="act-h line-h" aria-hidden="true"></th>${fcPlMonthHeaders(allP)}</tr></thead><tbody>`;

  spec.sections.forEach(sec => {
    html += `<tr class="sec"><td colspan="${allP.length + 2}">${sec.label}</td></tr>`;
    sec.lines.forEach(line => {
      const editable = line.from === 'flat';
      const tag = line.from === 'gtm_program' ? ' · from GTM'
        : (line.from && line.from.indexOf('hc_') === 0) || line.from === 'ote_nb' || line.from === 'ote_cs' ? ' · from HC'
        : editable ? ' · $M' : '';
      html += `<tr class="${editable ? 'adj' : ''}"><td>${line.label}${tag}</td>`;
      let fyLine = 0;
      allP.forEach(p => {
        const isFc = p > close;
        const secRow = plAll[p].depts[spec.key].sections[sec.key];
        const amt = (secRow && secRow.lines[line.k]) || 0;
        fyLine += amt;
        if (isFc && editable) {
          html += `<td class="fc-c">${fcPlSpendInput(spec.key, line.k, p, amt)}</td>`;
        } else {

        }
      });
      html += `<td class="fy-c">${fM(fyLine)}</td></tr>`;
    });
    html += `<tr class="tot"><td>${sec.label} total</td>`;
    let fySec = 0;
    allP.forEach(p => {
      const isFc = p > close;
      const tot = (plAll[p].depts[spec.key].sections[sec.key] && plAll[p].depts[spec.key].sections[sec.key].total) || 0;
      fySec += tot;
      html += `<td class="${isFc ? 'fc-c' : 'act-c'}">${fM(tot)}</td>`;
    });
    html += `<td class="fy-c">${fM(fySec)}</td></tr>`;

  html += `<tr class="tot"><td>${spec.label} total → ${spec.isLabel}</td>`;
  allP.forEach(p => {
    const isFc = p > close;
    const tot = (plAll[p].depts[spec.key] && plAll[p].depts[spec.key].total) || 0;
    html += `<td class="${isFc ? 'fc-c' : 'act-c'}">${fM(tot)}</td>`;
  });
  html += `<td class="fy-c">${fM(fyDept)}</td></tr>`;
  html += '</tbody></table></div></div>';
  area.innerHTML = html;
}

function renderIS(area){
  const res=getResults();
  const cfg=HORIZON[hz];
  const allP=[...cfg.act,...cfg.fc];

  function getIS(p){
    return getDisplayIS(p);
  }

  // Prove IS net_income === CFS ni (after tieIsNiToCfs).
  let tieOk=true;
  let tieMiss=0;
  allP.forEach(p=>{
    const is=getDisplayIS(p);
    const cfs=getDisplayCFS(p);
    if(!is||!cfs) return;
    const isNi=is.net_income!=null?is.net_income:is.ni;
    const cfsNi=cfs.ni!=null?cfs.ni:cfs.net_income;
    if(isNi==null||cfsNi==null) return;
    if(Math.abs(Number(isNi)-Number(cfsNi))>=1){ tieOk=false; tieMiss++; }
  });

  const rows=[
    {type:'sec',lbl:'Revenue'},
    {lbl:'Subscription Revenue',compute:r=>{const pct=(fcCostState.svcPct!=null?fcCostState.svcPct:3.3)/100;return r.revenue/(1+pct);},indent:true},
    {lbl:'Services Revenue',compute:r=>{const pct=(fcCostState.svcPct!=null?fcCostState.svcPct:3.3)/100;return r.revenue-r.revenue/(1+pct);},indent:true},
    {lbl:'Total Revenue',key:'revenue',type:'sub',fy:true},
    {type:'sec',lbl:'Cost of Revenue'},
    {lbl:'Cost of Revenue',key:'cogs',inv:true,indent:true},
    {lbl:'Gross Profit',key:'gross_profit',type:'sub',fy:true},
    {lbl:'Gross Margin %',compute:r=>r.gross_profit/r.revenue,pct:true,indent:true,color:false},
    {type:'sec',lbl:'Operating Expenses'},
    {lbl:'Sales & Marketing',key:'sm',inv:true,fy:true,indent:true},
    {lbl:'Research & Development',key:'rd',inv:true,fy:true,indent:true},
    {lbl:'General & Administrative',key:'ga',inv:true,fy:true,indent:true},
    {lbl:'Total OpEx',key:'total_opex',type:'sub',inv:true,fy:true},
    {lbl:'EBITDA',key:'ebitda',type:'sub',fy:true},
    {lbl:'EBITDA Margin %',compute:r=>r.ebitda/r.revenue,pct:true,indent:true,color:false},
    {type:'sec',lbl:'Below-the-Line'},
    {lbl:'Depreciation & Amortization',key:'da',inv:true,indent:true},
    {lbl:'Interest Expense',key:'interest',inv:true,indent:true},
    {lbl:'Operating Income',key:'op_income',type:'sub',indent:true},
    {lbl:'Pretax Income',key:'pretax',indent:true},
    {lbl:'Tax Expense',key:'tax',inv:true,indent:true},
    {lbl:'Net Income',key:'net_income',type:'tot',fy:true},
  ];

  function isFyRowVal(r, d) {
    if (!d) return 0;
    if (r.key === 'total_opex') return d.total_opex != null ? d.total_opex : (d.sm || 0) + (d.rd || 0) + (d.ga || 0);
    if (r.key) return d[r.key] || 0;
    if (r.compute) return r.compute(d);
    return 0;
  }

  function sumFyRow(r) {
    return ALL_P.reduce((s, p) => s + isFyRowVal(r, getIS(p)), 0);
  }

  const fyAgg = {
    revenue: sumFyRow({ key: 'revenue' }),
    gross_profit: sumFyRow({ key: 'gross_profit' }),
    ebitda: sumFyRow({ key: 'ebitda' }),
    net_income: sumFyRow({ key: 'net_income' }),
  };

  function getIsFyTotal(r) {
    if (r.type === 'sec') return null;
    if (r.pct) {
      if (!fyAgg.revenue) return null;
      if (r.lbl === 'Gross Margin %') return fyAgg.gross_profit / fyAgg.revenue;
      if (r.lbl === 'EBITDA Margin %') return fyAgg.ebitda / fyAgg.revenue;
      return null;
    }
    return sumFyRow(r);
  }

  const stmtTable=buildStmtTable(allP,cfg,rows,getIS,{
    fyTotal:true,
    getFyTotal:getIsFyTotal
  });
  const tieBadge=tieOk
    ? `<span class="ts-stmt-badge ts-tie-ok">✓ NI = CFS</span>`
    : `<span class="ts-stmt-badge" style="color:var(--amber)">⚠ NI ≠ CFS in ${tieMiss} period${tieMiss===1?'':'s'}</span>`;

  area.innerHTML=`<div class="slide">
    <div class="slide-title">Income Statement · ${hz.replace('p','+')} Horizon</div>
    <div class="slide-sub">Net income ties to cash flow statement ${tieOk?'<span class="tie-ok">✓ Tied</span>':'<span style="color:var(--amber)">⚠</span>'} · Warehouse IS when available (Board / prior forecast SoT)</div>
    ${buildKPIs(res)}
    <div>
        <div class="two-col" style="margin-bottom:12px">
          <div class="card">
            <div class="card-title">Revenue vs EBITDA — full year</div>
            <div class="chart-wrap" style="height:180px"><canvas id="isRevC" role="img" aria-label="Revenue and EBITDA full year chart">Revenue and EBITDA by month full year 2026.</canvas></div>
          </div>
          <div class="card">
            <div class="card-title">OpEx mix — forecast period</div>
            <div class="chart-wrap" style="height:180px"><canvas id="isOpexC" role="img" aria-label="OpEx mix donut chart">OpEx split: S&M, R&D, G&A.</canvas></div>
          </div>
        </div>
        <div class="ts-stmt-hdr">
          <div class="ts-stmt-title">Income Statement</div>
          ${tieBadge}
        </div>
        ${stmtTable}
      </div>
    </div>`;
  setTimeout(()=>{
    const { cPos, cBlue, cAmber, fade, baseScaleX, baseScaleY, tickColor } = chartSkinTokens();
    const allRev=allP.map(p=>+(getIS(p)?.revenue/1e6||0).toFixed(2));
    const allEbit=allP.map(p=>+(getIS(p)?.ebitda/1e6||0).toFixed(2));
    const cols=allP.map(p=>cfg.fc.includes(p)?fade(cAmber,0.5):fade(cBlue,0.15));
    mk('isRevC',{data:{labels:MO12.slice(allP[0].slice(5)-1),datasets:[
      {type:'bar',data:allRev,backgroundColor:cols,borderWidth:0,label:'Revenue',yAxisID:'y1'},
      {type:'line',data:allEbit,borderColor:cPos,borderWidth:2.5,pointRadius:3,fill:false,label:'EBITDA',yAxisID:'y2'},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:9},boxWidth:10}}},scales:{y1:{type:'linear',position:'left',...baseScaleY(v=>'$'+v.toFixed(1)+'M')},y2:{type:'linear',position:'right',ticks:{callback:v=>'$'+v.toFixed(1)+'M',font:{size:10,weight:'500'},color:tickColor},grid:{display:false}},x:baseScaleX}}});
    const smTotal=FC_P.reduce((s,p)=>s+(getDisplayIS(p)?.sm||0),0);
    const rdTotal=FC_P.reduce((s,p)=>s+(getDisplayIS(p)?.rd||0),0);
    const gaTotal=FC_P.reduce((s,p)=>s+(getDisplayIS(p)?.ga||0),0);
    mk('isOpexC',{type:'doughnut',data:{labels:[`S&M ${fM(smTotal,1)}`,`R&D ${fM(rdTotal,1)}`,`G&A ${fM(gaTotal,1)}`],datasets:[{data:[smTotal,rdTotal,gaTotal],backgroundColor:[cBlue,cPos,cAmber],borderWidth:2,borderColor:tickColor}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'bottom',labels:{font:{size:10},padding:10}}}}});
  },40);
}
