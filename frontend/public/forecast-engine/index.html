<!DOCTYPE html>
<html lang="en" style="height:100%">
<head>
<!-- forecast-engine stability v20260519d -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMPL · Rolling Forecast Engine · June 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#18241b;--bg2:#23332699;--bg3:#2b3c2e;--text:#dde8d6;--text2:#aab8a2;--text3:#72826a;--border:#2e3f31;--border2:rgba(56,75,60,0.25);--teal:#5fa878;--teal-light:rgba(95,168,120,0.12);--navy:#23332699;--blue:#5fa878;--red:#b8705f;--red-light:rgba(184,112,95,0.1);--amber:#b89060;--amber-light:rgba(184,144,96,0.1);--green:#5fa878;--green-light:rgba(95,168,120,0.1);--gray:#72826a;--lgray:#2e3f31;--accent:#c4855a;--shadow:0 1px 2px rgba(0,0,0,0.3),0 12px 32px -8px rgba(0,0,0,0.4);--r:12px;--r2:18px;--mono:'Inter',-apple-system,sans-serif;--serif:'Inter',-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;transition:background .25s}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 24px;border-bottom:0.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100}
.logo{font-family:var(--serif);font-size:17px;font-weight:300;letter-spacing:-0.3px}
.logo em{font-style:italic;color:var(--text2)}
.period-badge{font-family:var(--mono);font-size:11px;color:var(--text2);background:var(--bg2);padding:4px 12px;border-radius:20px;border:0.5px solid var(--border)}
.skin-select{font-family:'Inter',-apple-system,sans-serif;font-size:11px;font-weight:500;padding:5px 10px;border:0.5px solid var(--border);border-radius:20px;background:var(--bg2);color:var(--text2);cursor:pointer;outline:none;transition:all .15s}
.skin-select:hover{color:var(--text)}
.skin-select option{background:#1a1a1a;color:#eee}
.topbar-right{display:flex;align-items:center;gap:10px}
.nav{display:flex;padding:0 24px;border-bottom:0.5px solid var(--border);overflow-x:auto;background:var(--bg);gap:0}
.nav-btn{padding:10px 15px;font-size:12px;color:var(--text2);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;font-family:inherit}
.nav-btn:hover:not(.active){color:var(--text)}
.nav-btn.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.slide{padding:20px 24px;max-width:100%}
.slide-title{font-family:var(--serif);font-size:20px;font-weight:300;font-style:italic;color:var(--text);margin-bottom:4px}
.slide-sub{font-size:11.5px;color:var(--text2);margin-bottom:14px}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:16px}
.ks5{grid-template-columns:repeat(5,1fr)}.ks4{grid-template-columns:repeat(4,1fr)}.ks6{grid-template-columns:repeat(6,1fr)}
.kpi{background:var(--bg2);border-radius:var(--r2);padding:12px 15px;border:0.5px solid var(--border);box-shadow:var(--shadow)}
.kpi-lbl{font-size:9.5px;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.kpi-val{font-size:20px;font-weight:500;font-family:var(--mono);line-height:1;color:var(--text)}
.kpi-delta{font-size:10px;margin-top:4px;font-family:var(--mono)}
.pos{color:var(--teal)}.neg{color:var(--red)}.amb{color:var(--amber)}.neu{color:var(--text3)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r2);padding:14px;box-shadow:var(--shadow)}
.card-title{font-size:11.5px;font-weight:500;color:var(--text);margin-bottom:2px}
.card-sub{font-size:10px;color:var(--text2);margin-bottom:10px}
.chart-wrap{position:relative}
.sec-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--text2);padding:9px 0 5px;font-weight:500}
.var-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:12px}
.var-row:last-child{border-bottom:none}
.var-lbl{color:var(--text2)}.var-act{color:var(--text);font-family:var(--mono);font-weight:500}
.var-bud{color:var(--text3);font-family:var(--mono);font-size:11px}
.snav{display:flex;gap:5px;margin-bottom:13px;flex-wrap:wrap}
.snav-btn{font-size:11px;padding:4px 10px;border-radius:20px;border:0.5px solid var(--border);cursor:pointer;background:none;color:var(--text2);font-family:inherit;transition:all .15s}
.snav-btn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:8px;font-weight:500}
.badge-hi{background:var(--teal-light);color:var(--blue)}
.badge-med{background:var(--amber-light);color:var(--amber)}
.badge-lo{background:rgba(136,135,128,.2);color:var(--text3)}
.badge-green{background:var(--teal-light);color:var(--teal)}
.badge-final{background:var(--teal-light);color:var(--teal);font-size:10px;padding:3px 9px}
.badge-draft{background:var(--amber-light);color:var(--amber);font-size:10px;padding:3px 9px}
.badge-super{background:var(--bg3);color:var(--text3);font-size:10px;padding:3px 9px}
/* LAYOUT: left panel + right output */
.engine-layout{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
.lever-panel{background:var(--bg2);border-radius:var(--r2);padding:14px;border:0.5px solid var(--border)}
.lever-section{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);font-weight:500;padding:10px 0 6px;border-bottom:0.5px solid var(--border);margin-bottom:8px}
.lever-section:first-child{padding-top:0}
.lever{margin-bottom:9px}
.lever-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.lever-lbl{font-size:12px;color:var(--text2)}
.lever-val{font-size:12px;font-weight:500;color:var(--text);font-family:var(--mono);min-width:48px;text-align:right}
.lever-hint{font-size:9.5px;color:var(--text3);margin-top:1px}
.engine-shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.engine-content{display:flex;flex:1;min-height:0;overflow:hidden}
.lever-sidebar{width:290px;flex-shrink:0;overflow-y:auto;min-height:0;border-right:0.5px solid var(--border);background:var(--bg2);padding:14px}
.lever-sidebar .lever-section{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);font-weight:500;padding:0 0 8px;border-bottom:0.5px solid var(--border);margin-bottom:8px}
.lever-sidebar .lever-section + .lever-section{padding-top:10px;margin-top:4px}
input[type=range]{width:100%;height:4px;appearance:none;background:var(--lgray);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}


/* Forecast HC / GTM — Budget-inspired sticky headers + fixed col widths for alignment */
.hc-wrap{overflow:auto;max-height:min(70vh,820px);margin:0 0 18px;border:0.5px solid var(--border);border-radius:12px;background:var(--bg2)}
/* GTM: no nested vertical scroll — use the main slide scrollbar; keep sticky thead vs slideArea */
.hc-wrap.gtm-flow{overflow-x:auto;overflow-y:visible;max-height:none}
.hc-tbl{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:10.5px;margin:0;table-layout:fixed}
.hc-tbl th,.hc-tbl td{padding:4px 7px;border-bottom:0.5px solid var(--border);text-align:right;white-space:nowrap;font-family:var(--mono);font-size:10px;color:var(--text2);box-sizing:border-box}
.hc-tbl thead th{font-size:9px;font-weight:500;color:var(--text3);position:sticky;top:0;z-index:5;background:var(--bg);box-shadow:inset 0 -1px 0 var(--border2)}
.hc-tbl th:first-child,.hc-tbl td:first-child{text-align:left;font-family:inherit;font-size:11px;color:var(--text);width:220px;min-width:220px;max-width:220px;white-space:normal;line-height:1.25;position:sticky;left:0;z-index:2;background:var(--bg);box-shadow:inset -1px 0 0 var(--border2)}
.hc-tbl thead th:first-child{z-index:6;left:0;box-shadow:inset -1px 0 0 var(--border2),inset 0 -1px 0 var(--border2);background:var(--bg)}
.hc-tbl thead th:first-child.act-h,
.hc-tbl thead th:first-child.line-h{background:#1c281f;color:var(--text)}
.ts-tbl thead th.line-h,
.ts-tbl thead th.act-col{background:#1c281f;color:var(--text);border-bottom-color:var(--border2)}
.ts-tbl thead th.fc-col{background:rgba(186,117,23,0.08)}
.hc-tbl th.act-h,.hc-tbl th.fc-h,.hc-tbl th.fy-h{position:sticky;top:0;z-index:5}
.hc-tbl th.act-h,.hc-tbl th.fc-h{width:64px;min-width:64px;max-width:64px;padding-top:6px;padding-bottom:6px;vertical-align:bottom}
.hc-tbl td.act-c,.hc-tbl td.fc-c{width:64px;min-width:64px;max-width:64px}
.hc-tbl th.act-h{color:var(--text);background:#1c281f}
.hc-tbl th.fc-h{color:var(--amber);background:rgba(186,117,23,0.08)}
.hc-tbl th.fy-h{color:var(--text);width:72px;min-width:72px;max-width:72px;font-weight:600;background:var(--bg)}
.hc-tbl td.fy-c{width:72px;min-width:72px;max-width:72px}
.hc-tbl th .hc-mo{display:block;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.03em;line-height:1.15}
.hc-tbl th.act-h .hc-mo{color:var(--text)}
.hc-tbl th.fc-h .hc-mo{color:var(--amber)}
.hc-tbl th .hc-tag{display:block;font-family:inherit;font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:2px;opacity:1}
.hc-tbl th.act-h .hc-tag{color:var(--text2)}
.hc-tbl th.fc-h .hc-tag{color:var(--amber)}
.hc-tbl td.act-c{color:var(--text3)}
.hc-tbl td.fc-c{color:var(--amber)!important;background:rgba(186,117,23,0.03)}
.hc-tbl td.fy-c{color:var(--text);font-weight:500}
.hc-attr-pct{width:42px;background:transparent;border:0.5px solid var(--border);border-radius:4px;color:var(--amber);font-family:var(--mono);font-size:10px;text-align:right;padding:2px 4px;margin-left:6px}

.hc-tbl th.act-h,.hc-tbl th.fc-h{cursor:default}
.hc-tbl.gtm-pipe th.act-h,.hc-tbl.gtm-pipe th.fc-h{cursor:pointer}
.hc-tbl.gtm-pipe th.act-h:hover,.hc-tbl.gtm-pipe th.fc-h:hover{filter:brightness(1.15)}
.hc-tbl.gtm-pipe th.sel{box-shadow:inset 0 -3px 0 var(--accent)}
.hc-tbl.gtm-pipe th.sel .hc-mo{color:var(--accent)}
.gtm-pa-note{font-size:11.5px;color:var(--text2);background:var(--bg2);border:0.5px solid var(--border);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 12px;margin:10px 0 12px;line-height:1.45}
.gtm-pa-note strong{color:var(--text)}
.gtm-band{font-size:9px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:8px;margin-left:6px}
.gtm-band.must{background:rgba(29,158,117,0.15);color:var(--teal)}
.gtm-band.fence{background:rgba(184,144,96,0.2);color:var(--amber)}
.gtm-band.stretch{background:rgba(184,112,95,0.15);color:var(--red)}
.hc-tbl tr.sec td{background:var(--bg2);font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);font-weight:500;padding:7px 8px;font-family:inherit;text-align:left}
.hc-tbl tr.sec td:first-child{background:var(--bg2)}
.hc-tbl tr.tot td{font-weight:600;color:var(--text);border-top:1px solid var(--border2)}
.hc-tbl tr.tot td:first-child{background:var(--bg)}
.hc-tbl tr.adj td{background:rgba(184,144,96,0.07)}
.hc-tbl tr.adj td:first-child{background:rgba(184,144,96,0.07);color:var(--amber)}
.hc-tbl.bridge{width:100%;min-width:0}
.hc-tbl.bridge th:first-child,.hc-tbl.bridge td:first-child{position:static;box-shadow:none;min-width:180px}
.hc-hire{width:44px;background:transparent;border:0.5px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:10px;text-align:right;padding:2px 4px}
.hc-hire.pos{color:var(--teal);border-color:rgba(95,168,120,0.45)}
.hc-hire.neg{color:var(--red);border-color:rgba(184,112,95,0.45)}
.hc-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px;align-items:center}
.hc-tog{font-size:11px;padding:4px 11px;border-radius:20px;border:0.5px solid var(--border);background:none;color:var(--text2);cursor:pointer;font-family:inherit}
.hc-tog.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.hc-banner{font-size:11.5px;color:var(--text2);background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.45}
.hc-banner strong{color:var(--amber);font-family:var(--mono)}
.hc-legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2);margin:0 0 12px;padding:7px 11px;border-radius:8px;border:0.5px solid rgba(184,144,96,0.4);background:rgba(184,144,96,0.1)}
.hc-legend i{display:inline-block;width:14px;height:14px;border-radius:3px;background:rgba(184,144,96,0.35);border:1px solid rgba(184,144,96,0.7);flex:0 0 auto}
.hc-legend strong{color:#f0d4a0;font-weight:600}

/* Three-statement tables — match Board Platform 3-Statement tab */
.ts-tbl{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.ts-tbl col.ts-label-col{width:240px}
.ts-tbl th{padding:5px 8px;font-size:9.5px;font-weight:500;color:var(--text3);white-space:nowrap;border-bottom:1px solid var(--border2);text-align:right}
.ts-tbl th:first-child{text-align:left;width:240px;min-width:240px;max-width:240px;white-space:nowrap}
.ts-tbl th:not(:first-child){min-width:80px}
.ts-tbl td{padding:4px 8px;border-bottom:0.5px solid var(--border);white-space:nowrap;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis}
.ts-tbl td:first-child{text-align:left;font-family:inherit;color:var(--text);font-size:11px;width:240px;min-width:240px;max-width:240px;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.ts-tbl tr.ts-sec td{background:var(--bg2);font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);font-weight:500;padding:6px 8px;font-family:inherit;border-top:0.5px solid var(--border2);text-align:left;overflow:visible;white-space:normal}
.ts-tbl tr.ts-sub td{font-weight:600;color:var(--text);border-top:0.5px solid var(--border2)}
.ts-tbl tr.ts-tot td{font-weight:600;color:var(--text);border-top:1.5px solid var(--border2);background:var(--bg2)}
.ts-tbl tr.ts-indent td:first-child{padding-left:20px;color:var(--text2);font-size:10.5px}
.ts-tbl .fc-col{color:var(--amber)!important;background:rgba(186,117,23,0.03)}
.ts-tbl .act-col{color:var(--text2)}
.ts-pos{color:var(--teal)!important}
.ts-neg{color:var(--red)!important}
.ts-stmt-hdr{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding-bottom:6px;border-bottom:1.5px solid var(--border2)}
.ts-stmt-title{font-family:var(--serif);font-size:17px;font-style:italic;font-weight:300;color:var(--text)}
.ts-stmt-badge{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:500}
.ts-tie-ok{background:rgba(29,158,117,0.1);color:var(--teal)}
/* Legacy alias — ARR waterfall still references stmt-tbl */
.stmt-tbl{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.stmt-tbl th{text-align:right;padding:5px 8px;font-size:9.5px;font-weight:500;color:var(--text3);border-bottom:1px solid var(--border2);white-space:nowrap}
.stmt-tbl th:first-child{text-align:left;min-width:185px;width:1%;white-space:nowrap}
.stmt-tbl th:not(:first-child){min-width:80px}
.stmt-tbl td{padding:4px 8px;border-bottom:0.5px solid var(--border);white-space:nowrap;font-size:10.5px;text-align:right;font-family:var(--mono);color:var(--text2)}
.stmt-tbl td:first-child{text-align:left;font-family:inherit;color:var(--text);font-size:11px;overflow:visible;text-overflow:clip;max-width:none}
.stmt-tbl tr.sec-hdr td{background:var(--bg2);font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);font-weight:500;font-family:inherit;padding:6px 8px;border-top:0.5px solid var(--border2);text-align:left}
.stmt-tbl tr.sub-row td{font-weight:600;color:var(--text);border-top:0.5px solid var(--border2)}
.stmt-tbl tr.tot-row td{font-weight:600;color:var(--text);border-top:1.5px solid var(--border2);background:var(--bg2)}
.stmt-tbl td.act-col{color:var(--text2)}
.stmt-tbl td.fc-col{color:var(--amber);background:rgba(186,117,23,0.03)}
.stmt-tbl th.fc-col{color:var(--amber)}
.stmt-tbl td.pos-v{color:var(--teal)}.stmt-tbl td.neg-v{color:var(--red)}
.stmt-tbl tr.indent-row td:first-child{padding-left:20px;color:var(--text2);font-size:10.5px}
.stmt-tbl tr.indent-row td{font-size:10.5px;color:var(--text2)}
/* horizon tabs */
.hz-tabs{display:flex;gap:3px;background:var(--bg2);padding:3px;border-radius:8px;border:0.5px solid var(--border)}
.hz-tab{font-size:11px;padding:4px 11px;border:none;background:transparent;border-radius:6px;cursor:pointer;color:var(--text2);font-family:inherit;transition:all .15s}
.hz-tab.on{background:var(--accent);color:var(--bg);font-weight:600;box-shadow:none}
/* version list */
.ver-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border)}
.ver-row:last-child{border-bottom:none}
.ver-name{font-size:12px;font-weight:500;color:var(--text)}
.ver-meta{font-size:10px;color:var(--text3);margin-top:2px}
.ver-stats{font-size:11px;font-family:var(--mono);color:var(--text2);text-align:right;white-space:nowrap}
/* opp deal rows */
.deal-row{padding:5px 0;border-bottom:0.5px solid var(--border);font-size:11px}
.deal-row:last-child{border-bottom:none}
/* action buttons */
.act-btn{font-size:11px;padding:6px 14px;border-radius:20px;cursor:pointer;border:0.5px solid var(--border);background:var(--bg2);color:var(--text2);font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.act-btn.primary{background:var(--accent);color:var(--bg);border:none}
.act-btn.primary:hover{opacity:.85}
.act-btn.success{background:var(--teal);color:var(--bg);border:none}
.act-btn.success:hover{opacity:.85}
.act-btn.outline{background:none;color:var(--text2);border:0.5px solid var(--border2)}
.act-btn.outline:hover{background:var(--bg2)}
.act-btn.danger{background:none;color:var(--red);border:0.5px solid rgba(216,90,48,.3)}
/* gap alert */
.gap-alert{background:var(--amber-light);border:0.5px solid var(--amber);border-radius:var(--r);padding:10px 13px;margin-top:12px;font-size:11.5px;color:var(--text2)}
.gap-alert strong{color:var(--amber);font-family:var(--mono)}
/* demo loop / Plan Assurance callout */
.pa-loop{border:0.5px solid var(--border);border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;background:var(--bg2);padding:12px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.pa-loop-copy{font-size:12px;color:var(--text2);line-height:1.5;max-width:52rem}
.pa-loop-copy strong{color:var(--text);font-weight:500}
.pa-loop a,.pa-link{font-size:11.5px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap;background:none;border:0;cursor:pointer;padding:0;font-family:inherit}
.pa-loop a:hover,.pa-link:hover{opacity:.85}
.pa-analytics{max-width:1180px;margin:0 auto}
.assure-panel{border:0.5px solid var(--border);border-radius:var(--r);background:var(--bg2);padding:14px 16px;margin-bottom:18px}
.assure-wide{border:0.5px solid var(--border);border-radius:8px;padding:12px 14px;background:var(--bg);margin-bottom:12px}
.assure-wide:last-child{margin-bottom:0}

.assure-sev{flex:0 0 auto;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:4px}

.assure-sev.medium,.assure-sev.med,.assure-sev.must_confirm{background:var(--amber-light);color:var(--amber)}
.assure-sev.low,.assure-sev.ok,.assure-sev.must_hold{background:var(--teal-light);color:var(--teal)}
.assure-sev.info{background:rgba(61,126,166,0.15);color:#7a9fc2}
.assure-cite{font-size:10.5px;color:var(--text3);margin-top:3px}
.pa-whtt{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pa-whtt-group{margin-bottom:10px}
.pa-whtt-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-bottom:6px;font-weight:500}
.pa-method-card{margin-top:12px;padding:10px 12px;border:0.5px solid var(--border);border-radius:8px;background:var(--bg)}
.pa-verdict{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--text)}
.pa-meta{font-size:10.5px;color:var(--text3)}
.pa-banner{border:0.5px solid var(--border);border-radius:var(--r);background:var(--bg);padding:10px 12px;font-size:12px;color:var(--text2);line-height:1.45;margin-bottom:10px}

.pa-readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.pa-ro{border:0.5px solid var(--border);border-radius:var(--r);padding:10px 12px;background:var(--bg)}
.pa-ro .lab{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin-bottom:4px}
.pa-ro .val{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--text)}
.pa-ro .val.bad{color:var(--red)}
.pa-ro .val.warn{color:var(--amber)}
.pa-ro .val.ok{color:var(--teal)}
.pa-ro .note{font-size:10px;color:var(--text3);margin-top:3px;line-height:1.35}
.pa-corridor-svg{display:block;width:100%;height:auto;max-height:340px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r)}

.pa-corridor-legend i.band{height:8px;opacity:.35;background:var(--accent)}
.pa-corridor-legend i.floor{background:var(--red)}
.pa-corridor-legend i.plan{background:var(--accent)}

.gtm-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}

.gtm-tile{border:0.5px solid var(--border);border-radius:var(--r);background:var(--bg2);padding:10px 12px}
.gtm-tile-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);font-weight:500;margin-bottom:4px}
.gtm-tile-val{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--text);letter-spacing:-.02em}
.gtm-tile-sub{font-size:10px;color:var(--text3);margin-top:3px;line-height:1.4}

.pa-group{border-top:2px solid var(--border);padding-top:12px}

.pa-group h4{margin:0 0 4px;font-size:14px;font-weight:500;color:var(--text)}

function enrichForecastIS(is){
  if(!is) return null;
  var da=is.da||0;
  var interest=is.interest||0;
  var ebitda=is.ebitda!=null?is.ebitda:null;
  var op_income=is.op_income!=null?is.op_income:(ebitda!=null?ebitda-da:null);
  var pretax=is.pretax!=null?is.pretax:(op_income!=null?op_income-interest:null);
  var ni=is.net_income!=null?is.net_income:is.ni;
  return Object.assign({},is,{
    total_opex:is.total_opex!=null?is.total_opex:(is.sm||0)+(is.rd||0)+(is.ga||0),
    op_income:op_income,
    pretax:pretax,
    net_income:ni,
    tax:is.tax!=null?is.tax:(pretax!=null&&ni!=null?pretax-ni:null),
  });
}

/** C1-style: IS Net Income must equal CFS Net Income (CFS is Forecast SoT). */
function tieIsNiToCfs(is, cfs){
  if(!is) return null;
  if(!cfs) return is;
  var ni=cfs.ni!=null?cfs.ni:cfs.net_income;
  if(ni==null) return is;
  var out=Object.assign({},is);
  var old=out.net_income!=null?out.net_income:out.ni;
  out.net_income=ni;
  if(out.pretax!=null) out.tax=out.pretax-ni;
  out._niTiedToCfs=true;
  if(old!=null) out._niTieDelta=ni-old;
  return out;
}

function enrichForecastBS(bs,cfs){
  if(!bs) return null;
  var ppe=bs.ppe!=null?bs.ppe:(bs.property_and_equipment_net!=null?bs.property_and_equipment_net:null);
  var prepaids=bs.prepaids!=null?bs.prepaids:(bs.prepaids_and_other_current_assets!=null?bs.prepaids_and_other_current_assets:null);
  // Do not treat other_assets as prepaids — in this model other_assets is PPE.
  if(prepaids==null && bs.other_assets!=null && ppe==null){
    ppe=bs.other_assets;
  }
  if(prepaids==null) prepaids=2100000;
  if(ppe==null) ppe=SRC.opening_bs.other_assets!=null?SRC.opening_bs.other_assets:6000000;
  return Object.assign({},bs,{
    // Prefer CFS ending cash when provided; getDisplayBS also runs tieBsCashToCfs.
    cash:(cfs&&cfs.end_cash!=null)?cfs.end_cash:(bs.cash!=null?bs.cash:null),
    // Prefer statement DR on BS; never fall back to CFS RPO/waterfall end_dr.
    dr:bs.dr!=null?bs.dr:(bs.deferred_rev!=null?bs.deferred_rev:null),
    prepaids:prepaids,
    ppe:ppe,
    total_assets:bs.total_assets,
    total_liab:bs.total_liab,
    equity:bs.equity,
  });
}

/**
 * C1 continuity: BS cash line must equal the CFS ending cash shown on Cash Flow.
 * When we overwrite cash, shift total_assets / equity / total_le by the same delta
 * so Assets = Liabilities + Equity still foots.
 */
function tieBsCashToCfs(bs, cfs){
  if(!bs) return null;
  if(!cfs || cfs.end_cash==null) return bs;
  var tied=Object.assign({},bs);
  var newCash=Number(cfs.end_cash);
  var oldCash=tied.cash!=null?Number(tied.cash):null;
  if(oldCash!=null && Math.abs(oldCash-newCash)<0.5){
    tied.cash=newCash;
    tied._cashTiedToCfs=true;
    return tied;
  }
  var delta=oldCash!=null?(newCash-oldCash):0;
  tied.cash=newCash;
  if(oldCash!=null){
    if(tied.total_assets!=null) tied.total_assets=Number(tied.total_assets)+delta;
    if(tied.equity!=null) tied.equity=Number(tied.equity)+delta;
    if(tied.total_le!=null) tied.total_le=Number(tied.total_le)+delta;
  }
  tied._cashTiedToCfs=true;
  tied._cashTieDelta=delta;
  return tied;
}

}

const fM=(v,d=2)=>{if(v===null||v===undefined)return'--';d=Math.min(d,2);const neg=v<0,abs=Math.abs(v);if(abs>=1e6)return(neg?'-$':'$')+(abs/1e6).toFixed(d)+'M';if(abs>=1e3)return(neg?'-$':'$')+(abs/1e3).toFixed(0)+'k';return(neg?'-$':'$')+Math.round(abs);};
const fP=v=>(v*100).toFixed(1)+'%';
const fV=v=>(v>=0?'+':'')+fM(v);
const fPct=(a,b)=>b?((a-b)/Math.abs(b)*100).toFixed(1)+'%':'--';
const vc=(v,inv=false)=>{const g=inv?v<0:v>0;return Math.abs(v)<1000?'':g?'ts-pos':'ts-neg';};

function stmtFmtVal(v, opts) {
  if (v === null || v === undefined) return '—';
  if (opts && opts.pct) return (v * 100).toFixed(1) + '%';
  const d = 1, abs = Math.abs(v), neg = v < 0;
  let s;
  if (abs >= 1e6) s = '$' + (abs / 1e6).toFixed(Math.min(d, 2)) + 'M';
  else if (abs >= 1e3) s = '$' + (abs / 1e3).toFixed(0) + 'k';
  else s = '$' + abs.toFixed(0);
  return neg ? '(' + s + ')' : s;
}

function stmtValCls(v, inv) {
  if (v === null || Math.abs(v) < 1) return '';
  const good = inv ? v < 0 : v > 0;
  return good ? 'ts-pos' : 'ts-neg';
}

function stmtColHdrs(allP, cfg) {
  return allP.map(p => {
    const mo = MO12[parseInt(p.slice(5), 10) - 1];
    const isFc = p > CLOSE_MONTH;
    const colCls = isFc ? 'fc-col' : 'act-col';
    return `<th class="${colCls}" style="min-width:82px">${mo}<div style="font-size:8.5px;margin-top:1px;opacity:.7">${isFc ? 'Fcst' : 'Act'}</div></th>`;
  }).join('');
}

function stmtColorCls(r, v, mode) {
  if (r.color === false || r.pct) return '';
  if (mode === 'cfs') return r.highlight ? stmtValCls(v, false) : '';
  if (mode === 'bs') return '';
  if (r.highlight) return stmtValCls(v, false);
  return stmtValCls(v, r.inv);
}

function buildStmtTable(allP, cfg, rows, getPeriodData, options) {
  options = options || {};
  const colorMode = options.colorMode || 'is';
  const extraCols = options.fyTotal ? 1 : 0;
  const dataColCount = allP.length + extraCols;
  const labelW = 240;
  const dataW = 82;
  const tableMinW = labelW + dataColCount * dataW;
  const colSpan = allP.length + 1 + extraCols;
  const colgroup = `<colgroup><col class="ts-label-col"><col span="${dataColCount}"></colgroup>`;
  const fyHdr = options.fyTotal ? '<th class="fc-col" style="min-width:82px">FY Total<div style="font-size:8.5px;margin-top:1px;opacity:.7">Full year</div></th>' : '';
  const body = rows.map(r => {
    if (r.type === 'sec') return `<tr class="ts-sec"><td colspan="${colSpan}">${r.lbl}</td></tr>`;
    const cls = r.type === 'tot' ? 'ts-tot' : r.type === 'sub' ? 'ts-sub' : (r.indent ? 'ts-indent' : '');
    const vals = allP.map(p => {
      const d = getPeriodData(p);
      const isFc = p > CLOSE_MONTH;
      const colCls = isFc ? 'fc-col' : '';
      if (!d) return `<td class="${colCls}">—</td>`;
      const v = r.compute ? r.compute(d) : d[r.key];
      if (v === null || v === undefined) return `<td class="${colCls}">—</td>`;
      if (r.pct) return `<td class="${colCls}">${stmtFmtVal(v, { pct: true })}</td>`;
      const colorCls = stmtColorCls(r, v, colorMode);
      return `<td class="${colCls} ${colorCls}">${stmtFmtVal(v)}</td>`;
    }).join('');
    let fyCell = '';
    if (options.fyTotal) {
      const fyVal = options.getFyTotal ? options.getFyTotal(r) : null;
      const fyFmt = fyVal !== null && fyVal !== undefined
        ? stmtFmtVal(fyVal, r.pct ? { pct: true } : null)
        : '—';
      const fyColorCls = stmtColorCls(r, fyVal, colorMode);
      fyCell = `<td class="fc-col ${fyColorCls}">${fyFmt}</td>`;
    }
    return `<tr class="${cls}"><td>${r.lbl}</td>${vals}${fyCell}</tr>`;
  }).join('');
  return `<div style="overflow-x:auto"><table class="ts-tbl" style="min-width:${tableMinW}px">${colgroup}<thead><tr><th class="act-col line-h" aria-hidden="true"></th>${stmtColHdrs(allP, cfg)}${fyHdr}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/** Read live skin CSS tokens at chart-build time (never cache at module load). */
function chartSkinTokens() {
  if (window.SMPLSkin && window.SMPLSkin.chartSkinTokens) {
    return window.SMPLSkin.chartSkinTokens();
  }
  const cs = getComputedStyle(document.documentElement);
  const C = k => cs.getPropertyValue(k).trim();
  const cPos = C('--teal');
  const cNeg = C('--red');
  const cAmber = C('--amber');
  const cAccent = C('--accent');
  const cText = C('--text');
  const cText2 = C('--text2');
  const cText3 = C('--text3');
  const cBorder = C('--border');
  const cBlue = '#7a9fc2';
  const fade = (hex, a) => {
    hex = (hex || '').replace('#', '');
    if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    const r = parseInt(hex.slice(0, 2), 16) || 122;
    const g = parseInt(hex.slice(2, 4), 16) || 159;
    const b = parseInt(hex.slice(4, 6), 16) || 194;
    return `rgba(${r},${g},${b},${a})`;
  };
  const gridColor = 'rgba(255,255,255,0.14)';
  const tickFont = { size: 10, family: "'Inter',-apple-system,sans-serif", weight: '500' };
  const tickColor = cText2;
  const baseScaleX = { ticks: { font: tickFont, color: tickColor }, grid: { display: false } };
  const baseScaleY = (cb) => ({ ticks: { callback: cb, font: tickFont, color: tickColor }, grid: { color: gridColor, drawTicks: false } });
  const bubblePalette = ['#7a9fc2', '#74b88a', '#c2a07a', '#a07ab8', '#7ab8b0', '#b87a7a', '#b8a87a', '#7a8ab8', '#8ab87a', '#b87aa0', '#7ab8c2'];
  return { cPos, cNeg, cAmber, cAccent, cText, cText2, cText3, cBorder, cBlue, fade, gridColor, tickFont, tickColor, baseScaleX, baseScaleY, bubblePalette };
}

function budgetBarStyle(label, data) {
  const { cText3, fade } = chartSkinTokens();
  return { type: 'bar', label, data, backgroundColor: fade(cText3, 0.2), borderColor: cText3, borderWidth: 1, borderRadius: 3 };
}

function patchChartCfg(cfg) {
  if (window.SMPLSkin && window.SMPLSkin.patchChartCfg) {
    return window.SMPLSkin.patchChartCfg(cfg);
  }
  const { tickFont, tickColor, gridColor, cText2 } = chartSkinTokens();
  const opts = cfg.options || (cfg.options = {});
  if (opts.scales) {
    Object.values(opts.scales).forEach(scale => {
      if (!scale) return;
      if (scale.grid && scale.grid.display !== false) {
        scale.grid.color = gridColor;
        scale.grid.drawTicks = false;
      }
      if (scale.ticks) {
        scale.ticks.font = { ...tickFont, ...(scale.ticks.font || {}) };
        if (!scale.ticks.color) scale.ticks.color = tickColor;
      }
    });
  }
  if (opts.plugins?.legend?.labels && !opts.plugins.legend.labels.color) {
    opts.plugins.legend.labels.color = cText2;
  }
  return cfg;
}

function computePeriod(p, bop_arr, prev_cash, prev_ar, prev_ap, prev_dr, prev_eq, lv){
  const cfg=HORIZON[hz];
  const isAct=cfg.act.includes(p);

  // ── ARR waterfall (forecast months → SMPLPipeline SoT; actuals from SRC) ──
  let arr={};
  if(isAct && SRC.actuals[p]){
    const a=SRC.actuals[p];
    arr={arr_bop:a.arr_bop,gross_ren:0,arr_ren:0,ren_churn:a.arr_churn,
         arr_nb:a.arr_nb,arr_exp:a.arr_exp,arr_react:a.arr_react,
         arr_cont:a.arr_cont,arr_churn:a.arr_churn,arr_nn:a.arr_nn,
         arr_eop:a.arr_eop,grr:a.grr||0,nrr:a.nrr||0,is_actual:true};
  } else if(typeof SMPLPipeline!=='undefined' && typeof SMPLPipeline.computeForecastMonth==='function'){
    arr=SMPLPipeline.computeForecastMonth(p,bop_arr,SRC,{
      nb:lv.nb,exp:lv.exp,churn:lv.churn,ren_adj:lv.ren_adj
    });
  } else {
    const opps=SRC.opp_pipeline[p]||{};
    const ren_p=SRC.renewals[p]||{arr:0,weighted:0,count:0};
    const gross_ren=ren_p.arr||0;
    const ren_rate=Math.min(1,Math.max(0,(ren_p.weighted/Math.max(1,gross_ren))+lv.ren_adj));
    const arr_ren=gross_ren*ren_rate;
    const ren_churn=gross_ren-arr_ren;
    const nb=(opps['New Business']?.weighted||0)*lv.nb;
    const exp=(opps['Expansion']?.weighted||0)*lv.exp;
    const react=opps['Reactivation']?.weighted||0;
    const cont=opps['Contraction']?.weighted||0;
    const nr_churn=(opps['Churn']?.weighted||0)*lv.churn;
    const arr_nn=(arr_ren-gross_ren)+nb+exp+react-cont-nr_churn;
    const arr_eop=bop_arr+arr_nn;
    const grr=bop_arr>0?(bop_arr-ren_churn-nr_churn)/bop_arr:0;
    const nrr=bop_arr>0?(bop_arr+arr_nn-nb)/bop_arr:0;
    arr={arr_bop:bop_arr,gross_ren,arr_ren,ren_churn,arr_nb:nb,arr_exp:exp,
         arr_react:react,arr_cont:cont,arr_nr_churn:nr_churn,
         arr_churn:ren_churn+nr_churn,arr_nn,arr_eop,grr,nrr,is_actual:false};
  }

  // \u2500\u2500 Income Statement \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  let is={};
  if(isAct && SRC.actuals[p]){
    const a=SRC.actuals[p];
    is={revenue:a.revenue,cogs:a.cogs,gross_profit:a.gross_profit,
        sm:a.sm,rd:a.rd,ga:a.ga,
        total_opex:a.sm+a.rd+a.ga,ebitda:a.ebitda,da:a.da,
        interest:a.interest,net_income:a.net_income,is_actual:true};
  } else {
    // Payroll from active reqs
    let req_sm=0,req_rd=0,req_ga=0;
    SRC.open_reqs.forEach(r=>{
      if(!reqActive[r.id]||r.start>p) return;
      const mo=r.cash_annual/12;
      if(['Sales','Marketing'].includes(r.dept)) req_sm+=mo;
      else if(['R&D','Product'].includes(r.dept)) req_rd+=mo;
      else req_ga+=mo;
    });
    const sub_rev=arr.arr_eop/12;
    const svc_rev=sub_rev*(lv.svcPct != null ? lv.svcPct : 0.033);
    const revenue=sub_rev+svc_rev;
    const cogs=revenue*lv.cogs;
    let sm,rd,ga;
    if(typeof resolveFcPlOpex==='function'){
      const plx=resolveFcPlOpex(p,revenue,lv);
      sm=plx.sm; rd=plx.rd; ga=plx.ga;
    } else {
      sm=revenue*lv.sm+req_sm;
      rd=revenue*lv.rd+req_rd;
      ga=revenue*lv.ga+req_ga;
    }
    const gross_profit=revenue-cogs;
    const total_opex=sm+rd+ga;
    const ebitda=gross_profit-total_opex;
    const da=125000+FC_P.indexOf(p)*4000;
    const interest=35000;
    const net_income=ebitda-da-interest;
    is={revenue,cogs,gross_profit,sm,rd,ga,total_opex,ebitda,da,interest,net_income,is_actual:false};
  }

  // \u2500\u2500 Cash Flow Statement \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  let cfs={};
  if(isAct && SRC.actuals[p]){
    const a=SRC.actuals[p];
    cfs={beg_cash:a.beginning_cash,ni:a.net_income,da:a.da,sbc:80000,
         chg_ar:a.chg_ar||0,chg_dr:a.chg_dr||0,chg_ap:a.chg_ap||0,chg_pre:-15000,
         cfo:a.cfo,capex:a.cfi,cfi:a.cfi,cff:0,
         net_change:a.net_change_cash,end_cash:a.ending_cash,
         ar:a.ar,ap:a.ap,end_dr:a.dr,billings:0,is_actual:true};
  } else {
    const dr_row=SRC.dr_waterfall[p]||{};
    const billings=dr_row.billings||is.revenue*1.05;
    const recognized=dr_row.recognized||is.revenue;
    // CFO still uses waterfall billings − recognition (collections timing).
    const chg_dr=billings-recognized;
    // BS deferred revenue is the statement balance (~$1–1.5M), NOT waterfall RPO end_dr (~$40M).
    // Prefer warehouse BS DR when present; else roll gently from close-month statement DR.
    var whBsDr=null;
    try{
      var whB=typeof getOutlookBS==='function'?getOutlookBS(p):null;
      if(whB) whBsDr=whB.dr!=null?whB.dr:whB.deferred_rev;
    }catch(e){ /* */ }
    const end_dr=whBsDr!=null?Number(whBsDr):(prev_dr+55000);
    const rpo_end=dr_row.end_dr!=null?dr_row.end_dr:null;
    const ar=is.revenue*(lv.dso/30);
    const chg_ar=-(ar-prev_ar);
    const ap=(is.cogs+is.total_opex)*(lv.dpo/30);
    const chg_ap=ap-prev_ap;
    const sbc=80000;
    const chg_pre=-15000;
    const cfo=is.net_income+is.da+sbc+chg_ar+chg_dr+chg_ap+chg_pre;
    const capexPct = lv.capexPct != null ? lv.capexPct : 0.02;
    const capex=-(is.revenue * capexPct);
    const net_change=cfo+capex;
    const end_cash=prev_cash+net_change;
    cfs={beg_cash:prev_cash,ni:is.net_income,da:is.da,sbc,chg_ar,chg_dr,chg_ap,chg_pre,
         cfo,capex,cfi:capex,cff:0,net_change,end_cash,ar,ap,end_dr,rpo_end,billings,is_actual:false};
  }

  // \u2500\u2500 Balance Sheet \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  let bs={};
  if(isAct && SRC.actuals[p]){
    const a=SRC.actuals[p];
    bs={cash:a.cash_bs,ar:a.ar,other_assets:SRC.opening_bs.other_assets,
        total_assets:a.cash_bs+a.ar+SRC.opening_bs.other_assets,
        ap:a.ap,dr:a.dr,debt:5000000,other_liab:SRC.opening_bs.other_liab,
        equity:a.equity,is_actual:true,balance_check:0};
  } else {
    const cash=cfs.end_cash;
    const ar=cfs.ar;
    // opening_bs.other_assets is PPE (net), not prepaids — match Board BS shape.
    const ppe=SRC.opening_bs.other_assets!=null?SRC.opening_bs.other_assets:6000000;
    const prepaids=2100000;
    const total_assets=cash+ar+prepaids+ppe;
    const ap=cfs.ap;
    const dr=cfs.end_dr; // statement deferred (rolled from close), not RPO waterfall
    const debt=5000000;
    const ol=SRC.opening_bs.other_liab!=null?SRC.opening_bs.other_liab:2500000;
    const total_liab=ap+dr+debt+ol;
    const equity=total_assets-total_liab;
    bs={cash,ar,prepaids,ppe,other_assets:ppe,total_assets,ap,dr,debt,other_liab:ol,
        total_liab,equity,balance_check:Math.round(total_assets-(total_liab+equity)),is_actual:false};
  }

  return{p,arr,is,cfs,bs};
}

function compute(){
  const lv=getLevers();
  const cfg=HORIZON[hz];
  const close=getCloseMonth();
  const lastAct=SRC.actuals[close];
  let bop=lastAct.arr_eop;
  const closeCfs=getOutlookCFS(close);
  let cash=(closeCfs&&closeCfs.end_cash!=null)?closeCfs.end_cash:lastAct.ending_cash;
  let ar=lastAct.revenue*(lv.dso/30);
  let ap=(lastAct.cogs+lastAct.sm+lastAct.rd+lastAct.ga)*(lv.dpo/30);
  // Seed BS deferred from close-month statement DR — never waterfall RPO beg_dr (~$40M).
  let dr=lastAct.dr!=null?lastAct.dr:(SRC.opening_bs.dr||0);
  let eq=lastAct.equity;
  const results={};
  FC_P.forEach(p=>{
    const r=computePeriod(p,bop,cash,ar,ap,dr,eq,lv);
    results[p]=r;
    bop=r.arr.arr_eop;
    cash=r.cfs.end_cash;
    ar=r.cfs.ar;
    ap=r.cfs.ap;
    dr=r.cfs.end_dr;
    eq=r.bs.equity;
  });
  return results;
}

var _resultsCache=null;
var _computeLock=false;
function getResults(){
  // Open forecast is always client-computed from levers / HC / P&L / WC.
  // Promote-to-final is what lands in the warehouse for Board reporting.
  // Re-entrancy guard: compute/P&L/GTM must not call getDisplayIS → getResults → compute.
  if(_computeLock) return _resultsCache || {};
  if(_resultsCache!=null && !_scenarioDirty) return _resultsCache;
  _computeLock=true;
  try{
    _resultsCache=compute();
    _scenarioDirty=false;
    return _resultsCache;
  } finally {
    _computeLock=false;
  }
}

/** When levers/reqs are untouched, prefer warehouse Forecast CFS (Board SoT) over client rollforward. */
function fcPreferWarehouseCfs(){
  try {
    if (typeof leversAtDefault === 'function' && !leversAtDefault()) return false;
    if (typeof allReqsActive === 'function' && !allReqsActive()) return false;
    return true;
  } catch (e) {
    return true;
  }
}

// Shared sequential CFS: each month's beg_cash = prior month's end_cash
function buildCFSChain(cfg, resOverride){
  var res=resOverride||getResults();
  var allP=[...cfg.act,...cfg.fc];
  var chain={};
  var prev_end=null;
  var preferWh = fcPreferWarehouseCfs();
  allP.forEach(function(p){
    if(p<=getCloseMonth()){
      var whRow=cfsFromWarehouse(p);
      if(whRow){
        if(whRow.beg_cash==null&&prev_end!=null) whRow.beg_cash=prev_end;
        if(whRow.net_change==null&&whRow.beg_cash!=null) whRow.net_change=whRow.end_cash-whRow.beg_cash;
        chain[p]=whRow;
        prev_end=whRow.end_cash;
        return;
      }
      var a=SRC.actuals[p];
      if(!a) return;
      var eb=(a.gross_profit||0)-((a.sm||0)+(a.rd||0)+(a.ga||0));
      var pt=eb-(a.da||0)-(a.interest||0);
      var tax=pt>0?Math.round(pt*0.30):0;
      var ni=pt-tax;
      var sbc=80000,pre=-15000;
      var car=a.chg_ar||0,cdr=a.chg_dr||0,cap=a.chg_ap||0;
      var cfo=ni+a.da+sbc+car+cdr+cap+pre;
      var capex=a.cfi;
      var net=cfo+capex;
      var beg=prev_end!=null?prev_end:(a.beginning_cash||0);
      // Prefer source ending_cash (Board/TS SoT) over recomputed beg+net drift.
      var end=(a.ending_cash!=null)?a.ending_cash:(beg+net);
      prev_end=end;
      chain[p]={beg_cash:beg,ni:ni,da:a.da,sbc:sbc,chg_ar:car,chg_dr:cdr,
                chg_ap:cap,chg_pre:pre,cfo:cfo,capex:capex,cfi:capex,
                cff:0,net_change:end-beg,end_cash:end,is_actual:true};
    } else {
      // Open months: warehouse Forecast CFS when levers at default (matches Board / promoted SoT).
      if(preferWh){
        var whFc=cfsFromWarehouse(p);
        if(whFc && whFc.end_cash!=null){
          var begW=prev_end!=null?prev_end:(whFc.beg_cash!=null?whFc.beg_cash:null);
          var endW=whFc.end_cash;
          var rowW={};
          for(var kw in whFc) rowW[kw]=whFc[kw];
          if(begW!=null){ rowW.beg_cash=begW; rowW.net_change=endW-begW; }
          rowW.end_cash=endW;
          rowW.is_actual=false;
          rowW._src='warehouse';
          chain[p]=rowW;
          prev_end=endW;
          return;
        }
      }
      var fc=res[p]&&res[p].cfs?res[p].cfs:null;
      if(!fc) return;
      var beg=prev_end!=null?prev_end:(fc.beg_cash||0);
      var net=fc.cfo+(fc.cfi||0)+(fc.cff||0);
      var end=beg+net;
      var row={};
      for(var k in fc) row[k]=fc[k];
      row.beg_cash=beg; row.net_change=net; row.end_cash=end;
      row._src='client';
      chain[p]=row;
      prev_end=end;
    }
  });
  return chain;
}

function fcArrComponent(p, key){
  const a = getForecastARR(p);
  if (!a) {
    const act = (SRC.actuals && SRC.actuals[p]) || {};
    if (key === 'churn') return Number(act.arr_churn) || 0;
    return Number(act['arr_' + key]) || 0;
  }
  if (key === 'churn') return Number(a.arr_churn != null ? a.arr_churn : a.arr_nr_churn) || 0;
  if (key === 'nn') return Number(a.arr_nn) || (
    (Number(a.arr_nb)||0)+(Number(a.arr_exp)||0)+(Number(a.arr_react)||0)
    -(Number(a.arr_cont)||0)-(Number(a.arr_churn != null ? a.arr_churn : a.arr_nr_churn)||0)
  );
  return Number(a['arr_' + key]) || 0;
}

/**
 * Plan Assurance packet from live Forecast SoT (Budget field parity).
 * getResults() is period-keyed — do not read res.engine.*.
 */
function buildFcAssurancePacket(){
  const close = getCloseMonth();
  const decP = ALL_P[ALL_P.length - 1];
  const janP = ALL_P[0];
  const janArr = getForecastARR(janP);
  const closeArr = getForecastARR(close);
  const decArrRow = getForecastARR(decP);
  // Assess arr_bridge identity is Jan BOP + FY NN = Dec EOP (Budget contract).
  // Do NOT use close-month EOP here — that double-counts H1 NN and invents a fake ~$100M bridge.
  const bopArr = janArr && janArr.arr_bop != null
    ? Number(janArr.arr_bop)
    : (janArr && janArr.arr_eop != null ? Number(janArr.arr_eop) : 0);
  const closeArrEop = closeArr && closeArr.arr_eop != null ? Number(closeArr.arr_eop) : null;
  const decArr = decArrRow && decArrRow.arr_eop != null ? Number(decArrRow.arr_eop) : 0;
  const targetArr = fcDecBasePlanArr();
  const yoyGrowthPct = bopArr > 0 ? ((targetArr / bopArr) - 1) * 100 : null;

  let fyNn = 0, fyNb = 0, fyExp = 0, fyReact = 0, fyCont = 0, fyChurn = 0;
  let fyRev = 0, fyEbitda = 0, fyIsSm = 0;
  const cashByMonth = [];
  let minCash = null;
  let minCashPeriod = null;
  const grrVals = [];

  ALL_P.forEach(p => {
    fyNb += fcArrComponent(p, 'nb');
    fyExp += fcArrComponent(p, 'exp');
    fyReact += fcArrComponent(p, 'react');
    fyCont += fcArrComponent(p, 'cont');
    fyChurn += fcArrComponent(p, 'churn');
    fyNn += fcArrComponent(p, 'nn');
    const is = getDisplayIS(p) || {};
    fyRev += Number(is.revenue) || 0;
    fyEbitda += Number(is.ebitda) || 0;
    fyIsSm += Number(is.sm) || 0;
    const cfs = getDisplayCFS(p) || {};
    const cash = cfs.end_cash != null ? Number(cfs.end_cash) : null;
    cashByMonth.push(cash != null ? cash : 0);
    if (cash != null && (minCash == null || cash < minCash)) {
      minCash = cash;
      minCashPeriod = p;
    }
    const arr = getForecastARR(p);
    if (arr && arr.grr != null && !isNaN(arr.grr)) grrVals.push(Number(arr.grr));
  });

  const endCfs = getDisplayCFS(decP) || {};
  const endCash = endCfs.end_cash != null ? Number(endCfs.end_cash) : minCash;
  if (minCash == null) minCash = endCash;

  let salesEnd = null, csEnd = null, decHc = null, janHc = null;
  if (typeof computeFcHcPlan === 'function') {
    try {
      const plan = computeFcHcPlan();
      const decRow = plan[decP] || {};
      salesEnd = decRow.ending && decRow.ending.sales != null ? decRow.ending.sales : null;
      csEnd = decRow.ending && decRow.ending.cs != null ? decRow.ending.cs : null;
      decHc = decRow.headsTotal != null ? decRow.headsTotal : null;
      const closeRow = plan[close] || {};
      janHc = typeof getCloseHc === 'function' ? getCloseHc() : (closeRow.headsTotal || null);
    } catch (e) { /* HC optional */ }
  }

  let pipelineCoverage = 3;
  let fyMkt = null, fyMql = null;
  if (typeof buildGtmHorizonSummary === 'function') {
    try {
      const gtm = buildGtmHorizonSummary();
      if (gtm && gtm.coverX != null) pipelineCoverage = gtm.coverX;
    } catch (e) { /* optional */ }
  }
  if (typeof ensureFcGtmState === 'function' && typeof fcGtmAllocate === 'function') {
    try {
      ensureFcGtmState();
      fyMkt = ALL_P.reduce((s, p) => s + (fcGtmAllocate(p).spendTot || 0), 0);
      fyMql = ALL_P.reduce((s, p) => s + (fcGtmAllocate(p).mqlSum || 0), 0);
    } catch (e) { /* optional */ }
  }

  const avgGrr = grrVals.length ? grrVals.reduce((a, b) => a + b, 0) / grrVals.length : null;
  const minGrr = grrVals.length ? Math.min.apply(null, grrVals) : null;
  const year = parseInt(String(decP).slice(0, 4), 10) || 2026;

  return {
    period_label: 'FY' + year + ' Forecast',
    budget_year: year,
    yoyGrowthPct,
    bopArr,
    closeArrEop,
    decArr,
    targetArr,
    fyNn,
    fyNb,
    fyExp,
    fyReact,
    fyCont,
    fyChurn,
    fyRev,
    fyEbitda,
    endCash,
    cashSrc: (endCfs && endCfs._src) || (typeof fcPreferWarehouseCfs === 'function' && fcPreferWarehouseCfs() ? 'warehouse' : 'client'),
    closeMonthIdx: (typeof CLOSE_MO_IDX === 'number' ? CLOSE_MO_IDX : 5),
    cashFloor: 10000000,
    minCash,
    minCashPeriod,
    cashByMonth,
    avgGrr,
    minGrr,
    salesEnd,
    csEnd,
    aeNeeded: null,
    csNeeded: null,
    coverPct: null,
    hirePct: null,
    benchTarget: null,
    janHc,
    janHcExpected: janHc,
    decHc,
    pipelineCoverage,
    pipelineMin: 2.5,
    fyMkt,
    fyMql,
    fyIsSm,
    surface: 'forecast',
  };
}

/** Offline fallback when /assess is unavailable. */
function runForecastRiskChecks(packet){
  const p = packet || buildFcAssurancePacket();
  const out = [];
  // Forecast vs base-plan line is context (Budget/commit gap), not a historical shape risk.
  const arrGap = (p.decArr || 0) - (p.targetArr || 0);
  if (Math.abs(arrGap) <= Math.max(1000, (p.targetArr || 0) * 0.002)) {
    out.push({ id: 'arr_path', severity: 'ok', title: 'Dec ARR vs base plan', detail: `Tracks base plan ${fM(p.targetArr, 1)}.` });
  } else if (arrGap < 0) {
    out.push({ id: 'arr_path', severity: 'info', title: 'Dec ARR vs base plan', detail: `${fM(p.decArr, 1)} vs base ${fM(p.targetArr, 1)} (${fV(arrGap)}) — forecast vs plan, not a historical outlier.` });
  } else {
    out.push({ id: 'arr_path', severity: 'info', title: 'Dec ARR vs base plan', detail: `${fM(p.decArr, 1)} vs base ${fM(p.targetArr, 1)} — forecast vs plan.` });
  }
  // ARR bridge: Jan BOP + FY NN must equal Dec EOP.
  const bridge = (Number(p.bopArr) || 0) + (Number(p.fyNn) || 0);
  const bridgeGap = Math.abs(bridge - (Number(p.decArr) || 0));
  if (bridgeGap <= Math.max(500, Math.abs(Number(p.decArr) || 0) * 0.001)) {
    out.push({ id: 'arr_bridge', severity: 'ok', title: 'ARR bridge identity', detail: `Jan BOP ${fM(p.bopArr, 1)} + FY NN ${fM(p.fyNn, 1)} = Dec ${fM(p.decArr, 1)}.` });
  } else {
    out.push({ id: 'arr_bridge', severity: 'high', title: 'ARR bridge broken', detail: `Jan+NN ${fM(bridge, 1)} vs Dec EOP ${fM(p.decArr, 1)} (gap ${fV(bridge - (Number(p.decArr) || 0))}).` });
  }
  const floor = p.cashFloor != null ? p.cashFloor : 1e7;
  if (p.minCash != null && p.minCash < floor) {
    out.push({ id: 'cash_floor', severity: 'high', title: 'Cash dips below floor', detail: `Min ${fM(p.minCash, 1)} in ${p.minCashPeriod || '—'} vs floor ${fM(floor, 1)}.` });
  } else if (p.endCash != null) {
    out.push({ id: 'cash_floor', severity: 'ok', title: 'Cash vs floor', detail: `Ending ${fM(p.endCash, 1)} · min ${fM(p.minCash, 1)} ≥ floor ${fM(floor, 1)}.` });
  }
  if (p.pipelineCoverage != null && p.pipelineMin != null) {
    if (p.pipelineCoverage + 1e-9 >= p.pipelineMin) {
      out.push({ id: 'pipeline', severity: 'ok', title: 'Pipeline / NB coverage', detail: `${Number(p.pipelineCoverage).toFixed(1)}× (min ${p.pipelineMin.toFixed(1)}×).` });
    } else {
      out.push({ id: 'pipeline', severity: 'medium', title: 'Pipeline / NB coverage thin', detail: `${Number(p.pipelineCoverage).toFixed(1)}× vs min ${p.pipelineMin.toFixed(1)}×.` });
    }
  }
  return out;
}
