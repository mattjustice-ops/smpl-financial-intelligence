// ─── CHART BUILDER ─────────────────────────────────────────────────────────
function buildCharts(slide) {
  if (typeof Chart !== 'function') {
    console.warn('[board] Chart.js unavailable');
    return;
  }
  destroyCharts();
  if (typeof boardRefreshAllSeries === 'function') boardRefreshAllSeries();
  const chartMo = (MO && MO.length) ? MO : (window.MO12 || []).slice(0, ACT_MONTHS_COUNT);
  const nnAct = (NN_ACT || []).slice(0, chartMo.length);
  const nnBud = (NN_BUD || []).slice(0, chartMo.length);
  const arrAct = (ARR_ACT || []).slice(0, chartMo.length);
  const arrBud = (ARR_BUD || []).slice(0, chartMo.length);
  const revAct = (REV_ACT || []).slice(0, chartMo.length);
  const revBud = (REV_BUD || []).slice(0, chartMo.length);
  const gpAct = (GP_ACT || []).slice(0, chartMo.length);
  const cashAct = (CASH_ACT || []).slice(0, chartMo.length);
  const cashBud = (CASH_BUD || []).slice(0, chartMo.length);
  const collData = (COLL || []).slice(0, chartMo.length);
  const skin = (window.SMPLSkin && window.SMPLSkin.chartSkinTokens) ? window.SMPLSkin.chartSkinTokens() : null;
  const cs = getComputedStyle(document.documentElement);
  const C = k => cs.getPropertyValue(k).trim();
  const cPos    = skin ? skin.cPos : C('--teal');
  const cNeg    = skin ? skin.cNeg : C('--red');
  const cAmber  = skin ? skin.cAmber : C('--amber');
  const cText3  = skin ? skin.cText3 : C('--text3');
  const cText2  = skin ? skin.cText2 : C('--text2');
  const cAccent = skin ? skin.cAccent : C('--accent');
  const cBlue   = skin ? skin.cBlue : '#7a9fc2';
  const fade    = skin ? skin.fade : ((hex, a) => {
    hex = hex.replace('#','');
    if(hex.length===3) hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    const r=parseInt(hex.slice(0,2),16)||122;
    const g=parseInt(hex.slice(2,4),16)||159;
    const b=parseInt(hex.slice(4,6),16)||194;
    return `rgba(${r},${g},${b},${a})`;
  });
  const gridColor  = skin ? skin.gridColor : 'rgba(255,255,255,0.14)';
  const tickFont   = skin ? skin.tickFont : { size: 10, family: "'Inter',-apple-system,sans-serif", weight: '500' };
  const tickColor  = skin ? skin.tickColor : cText2;
  const baseScaleX = skin ? skin.baseScaleX : { ticks:{ font:tickFont, color:tickColor }, grid:{ display:false } };
  const baseScaleY = skin ? skin.baseScaleY : ((cb) => ({ ticks:{ callback:cb, font:tickFont, color:tickColor }, grid:{ color:gridColor, drawTicks:false } }));
  const bubblePalette = skin ? skin.bubblePalette : ['#7a9fc2','#74b88a','#c2a07a','#a07ab8','#7ab8b0','#b87a7a','#b8a87a','#7a8ab8','#8ab87a','#b87aa0','#7ab8c2'];
  const patchChart = (cfg) => (window.SMPLSkin && window.SMPLSkin.patchChartCfg) ? window.SMPLSkin.patchChartCfg(cfg) : cfg;
  const mkChart = (el, cfg) => {
    if (!el) return null;
    return (typeof boardMkChart === 'function' ? boardMkChart(el, cfg) : new Chart(el, patchChart(cfg)));
  };

  if(slide==='exec') {
    charts.exec=mkChart(document.getElementById('execChart'),{
      type:'bar',
      data:{labels:chartMo,datasets:[
        {type:'bar', label:'Net New ARR', data:nnAct, backgroundColor:fade(cPos,0.25), borderColor:cPos, borderWidth:1.5, yAxisID:'y2', order:2, borderRadius:3},
        {type:'line',label:'ARR Act',    data:arrAct, borderColor:cAccent, borderWidth:2.5, pointRadius:4, pointBackgroundColor:cAccent, yAxisID:'y1', fill:false, order:1, tension:0.3},
        {type:'line',label:'ARR Bud',   data:arrBud, borderColor:cText3, borderDash:[4,3], borderWidth:1.5, pointRadius:2, yAxisID:'y1', fill:false, order:1, tension:0.3},
        {type:'line',label:'Revenue',   data:revAct, borderColor:cAmber, borderWidth:2, pointRadius:3, yAxisID:'y2', fill:false, order:1, tension:0.3},
      ]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:false}},
        scales:{
          y1:{type:'linear',position:'left',  ticks:{callback:v=>'$'+v+'M', font:tickFont, color:tickColor}, grid:{color:gridColor}},
          y2:{type:'linear',position:'right', ticks:{callback:v=>'$'+v.toFixed(1)+'M', font:tickFont, color:tickColor}, grid:{display:false}},
          x: baseScaleX,
        }
      }
    });
  } else if(slide==='arr') {
    const wfLabels=['Begin ARR','New Business','Expansion','Reactivation','Contraction','Churn','End ARR'];
    const wf = (typeof boardWfTable === 'function' ? boardWfTable() : null) || window.SMPL_DEMO_WF_TABLE || SMPL_DEMO_WF_TABLE;
    const wIdx = ACT_MONTHS_COUNT - 1;
    const w = (typeof boardWaterfallMonthM === 'function' ? boardWaterfallMonthM(wf, wIdx) : null) || { bop:0,nb:0,exp:0,react:0,con:0,churn:0,eop:0,wfOffsets:[0],wfHeights:[0],wfLabelsTop:[0],afterChurn:0 };
    const wfOffsets = w.wfOffsets;
    const wfHeights = w.wfHeights;
    const wfLabelsTop = w.wfLabelsTop;
    const yMin = Math.floor(Math.min(w.bop, w.eop) * 0.97);
    const yMax = Math.ceil(Math.max(w.bop, w.eop) * 1.02);
    const wfColors=[cBlue,cPos,cPos,cPos,cNeg,cNeg,cBlue];
    charts.wf=mkChart(document.getElementById('arrWF'),{
      type:'bar',
      data:{labels:wfLabels,datasets:[
        {label:'offset',data:wfOffsets,backgroundColor:'rgba(0,0,0,0)',borderColor:'rgba(0,0,0,0)',borderWidth:0},
        {label:'value', data:wfHeights,backgroundColor:wfColors.map(c=>fade(c,0.7)),borderColor:wfColors,borderWidth:1.5,borderRadius:3},
      ]},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{if(ctx.datasetIndex===0)return null;const v=wfLabelsTop[ctx.dataIndex];return(v>=0?'+$':'-$')+Math.abs(v).toFixed(2)+'M';} }}},
        scales:{
          x:{stacked:true,...baseScaleX},
          y:{stacked:true,min:yMin,max:yMax,...baseScaleY(v=>'$'+v.toFixed(0)+'M')}
        }
      },
      plugins:[{afterDatasetsDraw(chart){
        const ctx2=chart.ctx,ds1=chart.getDatasetMeta(1);
        ctx2.save();
        ctx2.font='bold '+tickFont.size+'px '+tickFont.family;
        ctx2.textAlign='center';
        ds1.data.forEach((bar,i)=>{
          const v=wfLabelsTop[i];
          const isBase=i===0||i===wfLabels.length-1;
          const displayLabel=isBase?'$'+Math.abs(v).toFixed(2)+'M':(v>=0?'+$':'-$')+Math.abs(v).toFixed(2)+'M';
          const yPos=v>=0?bar.y-6:bar.y+bar.height+13;
          const finalY=isBase?bar.y-6:yPos;
          ctx2.fillStyle=v<0?cNeg:(isBase?cBlue:cPos);
          ctx2.fillText(displayLabel,bar.x,finalY);
        });
        ctx2.restore();
      }}]
    });
    charts.nn=mkChart(document.getElementById('arrNN'),{
      type:'bar',data:{labels:chartMo,datasets:[
        {label:'Actual',data:nnAct,backgroundColor:fade(cPos,0.55),borderColor:cPos,borderWidth:1.5,borderRadius:3},
        {label:'Budget',data:nnBud,backgroundColor:fade(cText3,0.2),borderColor:cText3,borderWidth:1,borderRadius:3},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:baseScaleX,y:baseScaleY(v=>'$'+v.toFixed(1)+'M')}}
    });
    if (!charts.nn && nnAct.length) console.warn('[board] arrNN chart failed — check canvas/data');
    const WF_TABLE=(typeof boardWfTable==='function'?boardWfTable():null)||window.SMPL_DEMO_WF_TABLE||SMPL_DEMO_WF_TABLE;
    const WF_ROWS=['Beginning','New Business','Expansion','Contraction','Churn','Reactivation','Ending'];
    const actN=ACT_MONTHS_COUNT;
    const fDollarWhole=v=>{const neg=v<0;const abs=Math.round(Math.abs(v));return(neg?'-$':'$')+abs.toLocaleString('en-US');};
    setTimeout(()=>{
      const tb=document.getElementById('arrWFTbody');
      if(!tb)return;
      tb.innerHTML='';
      WF_ROWS.forEach((rowName,ri)=>{
        const vals=WF_TABLE[rowName];
        const isTotal=rowName==='Beginning'||rowName==='Ending';
        const tr=document.createElement('tr');
        if(ri%2===0)tr.style.background='var(--bg2)';
        if(isTotal){tr.style.fontWeight='500';tr.style.borderTop='1px solid var(--border2)';}
        const labelCell=`<td style="padding:7px 10px;font-size:11.5px;color:var(--text);font-weight:${isTotal?'500':'400'};position:sticky;left:0;background:inherit;border-right:0.5px solid var(--border)">▸ ${rowName}</td>`;
        const wfMove={'New Business':'New Business','Expansion':'Expansion','Reactivation':'Reactivation','Contraction':'Contraction','Churn':'Churn'};
        const year=String(CLOSE_MONTH).slice(0,4);
        const dataCells=vals.map((v,ci)=>{
          const color=isTotal?'var(--text)':v<0?'var(--red)':'var(--teal)';
          const isFc=ci>=actN;
          const colCls=isFc?'fc-col':'act-col';
          const movement=wfMove[rowName];
          const period=year+'-'+String(ci+1).padStart(2,'0');
          const text=fDollarWhole(v);
          const inner=movement
            ? `<button type="button" class="src-num" title="Deals behind ${rowName} for ${period}" onclick="SMPLSourceTrace.open({period:'${period}',grain:'opportunities',dealType:'${movement}',title:'${rowName}'})">${text}</button>`
            : text;
          return `<td class="${colCls}" style="padding:7px 10px;text-align:right;font-family:var(--mono);font-size:11px;color:${color}">${inner}</td>`;
        }).join('');
        tr.innerHTML=labelCell+dataCells;
        tb.appendChild(tr);
      });
    },80);
  } else if(slide==='revenue') {
    charts.rev=mkChart(document.getElementById('revChart'),{
      type:'bar',
      data:{labels:chartMo,datasets:[
        {type:'bar', data:gpAct, backgroundColor:fade(cPos,0.2), borderColor:cPos, borderWidth:1, label:'GP', borderRadius:3},
        {type:'line',data:revAct, borderColor:cAccent, borderWidth:2.5, pointRadius:3, pointBackgroundColor:cAccent, fill:false, label:'Act', tension:0.3},
        {type:'line',data:revBud, borderColor:cText3, borderDash:[4,3], borderWidth:1.5, pointRadius:0, fill:false, label:'Bud', tension:0.3},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:baseScaleX,y:baseScaleY(v=>'$'+v.toFixed(1)+'M')}}
    });
    charts.revArr=mkChart(document.getElementById('revARR'),{
      type:'line',data:{labels:chartMo,datasets:[
        {label:'Actual',data:arrAct,borderColor:cPos,borderWidth:2.5,pointRadius:4,pointBackgroundColor:cPos,fill:false,tension:0.3},
        {label:'Budget',data:arrBud,borderColor:cText3,borderDash:[4,3],borderWidth:1.5,pointRadius:2,fill:false,tension:0.3},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:baseScaleX,y:baseScaleY(v=>'$'+v.toFixed(0)+'M')}}
    });
  } else if(slide==='gtm') {
    const year=window._boardGtmYear;
    const trend=document.getElementById('gtmTrend');
    if (year && trend) {
      charts.gtmTrend=mkChart(trend,{
        data:{labels:year.months.map(m=>m.label), datasets:[
          {type:'bar', label:'MQLs', data:year.months.map(m=>m.mqls), backgroundColor:year.months.map(m=>fade(m.actual?cPos:cAccent,0.45)), borderColor:year.months.map(m=>m.actual?cPos:cAccent), borderWidth:1, borderRadius:3, yAxisID:'y'},
          {type:'line', label:'Opportunities', data:year.months.map(m=>m.opps), borderColor:cAmber, borderWidth:2, pointRadius:3, pointBackgroundColor:cAmber, fill:false, tension:0.3, yAxisID:'y1'},
        ]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
          scales:{x:baseScaleX, y:baseScaleY(v=>Math.round(v).toLocaleString()), y1:{position:'right', grid:{display:false}, ticks:{font:tickFont, color:tickColor}}}}
      });
    }
    const gtm=boardGtmSummary();
    const gtmCh=gtm.ch;
    const sortedKeys=Object.keys(gtmCh).sort((a,b)=>gtmCh[b].wr-gtmCh[a].wr);
    const wrTone=k=>{const wr=+gtmCh[k].wr||0;return wr<=0?'neg':gtm.blendedWr!=null&&wr>=+gtm.blendedWr.toFixed(1)?'pos':'amber';};
    const toneColor={pos:cPos,amber:cAmber,neg:cNeg};
    charts.gtmWR=mkChart(document.getElementById('gtmWR'),{
      type:'bar',data:{labels:sortedKeys,datasets:[{
        data:sortedKeys.map(k=>gtmCh[k].wr),
        backgroundColor:sortedKeys.map(k=>fade(toneColor[wrTone(k)],0.5)),
        borderColor:sortedKeys.map(k=>toneColor[wrTone(k)]),
        borderWidth:1.5,borderRadius:3
      }]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{ticks:{callback:v=>v+'%',font:tickFont,color:tickColor},grid:{color:gridColor}},y:{ticks:{font:tickFont,color:tickColor},grid:{display:false}}}}
    });
  } else if(slide==='cash') {
    var walk = window._boardCashWalk;
    var mo = window.MO12 || [];
    var labels = walk ? walk.funded.map(function (m) { return mo[parseInt(m.period.slice(5), 10) - 1] || m.period; }) : chartMo;
    var fundedCash = walk ? walk.funded.map(function (m) { return m.ending != null ? +(m.ending / 1e6).toFixed(2) : null; }) : cashAct;
    var datasets = [
      {type:'line', label:'Ending cash', data:fundedCash, borderColor:cPos, backgroundColor:fade(cPos,0.1), borderWidth:2.5, pointRadius:4, pointBackgroundColor:cPos, fill:true, tension:0.3},
    ];
    if (walk && window.SMPLFinancing && SMPLFinancing.loadRounds().length) {
      datasets.push({type:'line', label:'No round', data:walk.unfunded.map(function (m) { return m.ending != null ? +(m.ending / 1e6).toFixed(2) : null; }), borderColor:cAmber, borderDash:[4,3], borderWidth:1.5, pointRadius:0, fill:false, tension:0.3});
    }
    datasets.push({type:'line', label:'Budget', data:labels.map(function (_, i) { return i < cashBud.length ? cashBud[i] : null; }), borderColor:cText3, borderDash:[4,3], borderWidth:1.5, pointRadius:2, fill:false, tension:0.3});
    charts.cashT=mkChart(document.getElementById('cashTrend'),{
      data:{labels:labels, datasets:datasets},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:baseScaleX,y:baseScaleY(v=>'$'+v.toFixed(1)+'M')}}
    });
    charts.coll=mkChart(document.getElementById('cashColl'),{
      type:'bar',data:{labels:chartMo,datasets:[{
        data:collData,
        backgroundColor:fade(cPos,0.5),
        borderColor:cPos,borderWidth:1.5,borderRadius:3
      }]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:baseScaleX,y:baseScaleY(v=>'$'+v.toFixed(1)+'M')}}
    });

  }
}

function boardCommentaryText(key) {
  return typeof window.boardDataCommentary === 'function' ? window.boardDataCommentary(key) : '';
}
const AI_CTX = {
  get exec() { return boardCommentaryText('exec'); },
  get arr() { return boardCommentaryText('arr'); },
  get revenue() { return boardCommentaryText('revenue'); },
  get gtm() { return boardGtmNarrative(boardGtmSummary()); },
  get cash() { return boardCommentaryText('cash'); },
  get headcount() { return boardCommentaryText('headcount'); },
  get risks() { return boardCommentaryText('risks'); },
};

window.AI_CTX = AI_CTX;

async function openMdaDeck() {
  var live = await window.SMPLBoardLive.openBoardExport("pptx");
  if (live === "no-org") {
    window.alert("No organization data is loaded, so there is no MD&A deck to export.");
  }
}

async function openVarianceCommentary() {
  if (window.boardDownloadStatementStory) {
    window.boardDownloadStatementStory();
    return;
  }
  var live = await window.SMPLBoardLive.openBoardExport("xlsx");
  if (live === "no-org") {
    window.alert("No organization data is loaded, so there is no variance commentary to export.");
  }
}

function renderThreeStmt(area) {
  area.innerHTML = `<div class="slide">
  <div class="slide-title">3 &#8209; Statement Model</div>
  <div class="slide-sub">Income Statement &middot; Cash Flow Statement &middot; Balance Sheet &middot; Toggle scenario and period</div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <div style="display:flex;gap:3px;background:var(--bg2);border-radius:8px;padding:3px;border:0.5px solid var(--border)">
      <button class="ts-sc-btn on" data-sc="Combined" onclick="tsSetScenario('Combined',this)">Act + Forecast</button>
      <button class="ts-sc-btn" data-sc="Actual" onclick="tsSetScenario('Actual',this)">Actual</button>
      <button class="ts-sc-btn" data-sc="Budget" onclick="tsSetScenario('Budget',this)">Budget</button>
    </div>
    <div style="font-size:10px;color:var(--text3)" id="tsScenarioLabel">${typeof boardArrPeriodLabel==='function'?boardArrPeriodLabel():'Actual through '+CLOSE_LABEL}</div>
  </div>
  <div id="tsKpis" class="ts-kpi-row"></div>
  <div style="overflow-x:auto"><div id="tsContent"></div></div>
</div>`;
  window._tsScenario = 'Combined';
  setTimeout(function(){ tsRender(); }, 30);
}

function tsSetScenario(sc, btn) {
  window._tsScenario = sc;
  document.querySelectorAll('.ts-sc-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const labels = {
    Combined: typeof boardArrPeriodLabel === 'function' ? boardArrPeriodLabel() : 'Actual through ' + CLOSE_LABEL,
    Actual:   'Jan–'+CLOSE_MO+' '+CLOSE_MONTH.slice(0,4)+' Actuals only',
    Budget:   'Jan–Dec '+CLOSE_MONTH.slice(0,4)+' Full-Year Budget',
  };
  const lbl = document.getElementById('tsScenarioLabel');
  if(lbl) lbl.textContent = labels[sc] || sc;
  tsRender();
}

function boardTsSource() {
  if (window.SMPL_LIVE_OUTLOOK && window.SMPLOutlook && typeof window.SMPLOutlook.getOutlookTsData === "function") {
    var live = window.SMPLOutlook.getOutlookTsData();
    if (live) return live;
  }
  return window.TS_DATA || TS_DATA;
}

function tsGetPeriods(sc) {
  const ts = boardTsSource();
  if(sc === 'Combined') {
    const act = ts.Actual?.periods || [];
    const fc = ts.Forecast?.periods || [];
    const periods = act.concat(fc);
    return {
      periods,
      isFc: periods.map((_, i) => i >= act.length),
      sources: periods.map((_, i) => (i < act.length ? 'Actual' : 'Forecast')),
    };
  }
  const pd = ts[sc]?.periods || [];
  // Budget = plan, not forecast — isFc false so Bdgt label renders, not Fcst
  const isFcFlag = sc==='Budget' ? false : sc!=='Actual';
  return { periods: pd, isFc: pd.map(()=>isFcFlag), sources: pd.map(()=>sc) };
}

function tsGet(sc, src, period, stmt, key) {
  const ts = boardTsSource();
  const s = src || sc;
  return ts[s]?.[stmt]?.[period]?.[key] ?? null;
}

const tsFmt = (v, d=1) => {
  if(v===null||v===undefined) return '—';
  const d2=Math.min(d,2), abs=Math.abs(v), neg=v<0;
  let s;
  if(abs>=1e6) s='$'+(abs/1e6).toFixed(d2)+'M';
  else if(abs>=1e3) s='$'+(abs/1e3).toFixed(0)+'K';
  else s='$'+abs.toFixed(0);
  return neg?'('+s+')':s;
};
const tsFmtPct = v => v==null?'—':(v*100).toFixed(1)+'%';
const tsCls = (v, inv=false) => {
  if(v===null||Math.abs(v)<1) return '';
  const good = inv ? v<0 : v>0;
  return good ? 'ts-pos' : 'ts-neg';
};

/** Usage meter for the month on screen, from the warehouse rows on the outlook payload. */
function boardVendorMeterHtml(scenario, period) {
  const block = window.SMPL_OUTLOOK_PAYLOAD && window.SMPL_OUTLOOK_PAYLOAD.VENDOR_USAGE;
  const rows = block && block.scenarios && block.scenarios[scenario] && block.scenarios[scenario][period];
  if (!period || !rows || !rows.length) {
    return `<div class="card" style="margin:8px 0 14px"><div class="card-title">Usage meter</div><div class="card-sub">Hosting, third-party product services, and development cloud. The meter is the vendor rows in the warehouse, and it shows here when those rows are loaded.</div></div>`;
  }
  const accounts = block.accounts || {};
  const num = 'text-align:right;font-family:var(--mono)';
  const body = rows.map(r => {
    const acct = accounts[r.account] ? accounts[r.account] + ' · ' + r.account : r.account;
    const units = Number(r.units).toLocaleString(undefined, { maximumFractionDigits: 2 });
    const cost = Number(r.unit_cost).toLocaleString(undefined, { maximumFractionDigits: 6 });
    return `<tr><td>${plEsc(acct)}</td><td>${plEsc(r.vendor)}</td><td>${plEsc(r.driver)}</td><td style="${num}">${units}</td><td style="${num}">${cost}</td><td style="${num}">${tsFmt(Number(r.amount))}</td></tr>`;
  }).join('');
  return `<div class="card" style="margin:8px 0 14px">
    <div class="card-title">Usage meter — ${plEsc(period)}</div>
    <div class="card-sub">${plEsc(block.note || '')}</div>
    <div style="overflow-x:auto"><table class="ts-tbl"><thead><tr><th>Account</th><th>Vendor</th><th>Driver</th><th style="text-align:right">Units</th><th style="text-align:right">Unit cost</th><th style="text-align:right">Amount</th></tr></thead><tbody>${body}</tbody></table></div>
  </div>`;
}

function wfBuildTab(name) {
  destroyCharts();
  const el = document.getElementById('wfContent');
  if(!el) return;
  const w = boardWf();
  if(!w.months.length) { el.innerHTML = wfEmpty('No workforce data loaded. Load the Employees, Headcount Plan and GL files.'); return; }
  if(name==='overview') wfOverview(el, w);
  else if(name==='bridge') wfBridge(el, w);
  else if(name==='capacity') wfCapacity(el, w);
  else if(name==='payroll') wfPayroll(el, w);
  else if(name==='reqs') wfReqs(el, w);
  else if(name==='roster') wfRoster(el, w);
}

    const arr = wf && wf.Ending ? wf.Ending[i] : null;

}

}

function wfLaborSection(w) {
  const list = w.d && w.d.labor_bridges;
  if (!Array.isArray(list) || !list.length) return '';
  return list.map(wfLaborCard).join('');
}

function wfDrawLaborCharts(w) {
  const list = (w.d && w.d.labor_bridges) || [];
  list.filter(b => b && b.available).forEach(b => {
    const canvas = document.getElementById('wfLabor-' + b.id);
    if (!canvas || typeof boardMkChart !== 'function') return;
    const steps = [{ label: b.from_label, total: b.beginning, base: true }];
    let run = b.beginning;
    (b.bars || []).forEach(bar => {
      const next = Math.round((run + bar.amount) * 100) / 100;
      steps.push({ label: bar.label, amount: bar.amount, from: run, total: next, key: bar.key });
      run = next;
    });
    steps.push({ label: b.to_label, total: b.ending, base: true });
    const offsets = [];
    const heights = [];
    const colors = [];
    steps.forEach(step => {
      if (step.base) {
        offsets.push(Math.min(0, step.total));
        heights.push(Math.abs(step.total));
        colors.push('#185FA5');
      } else {
        offsets.push(Math.min(step.from, step.total));
        heights.push(Math.abs(step.amount));
        colors.push(WF_LABOR_COLOR[step.key] || '#888780');
      }
    });
    const totals = steps.map(step => step.base ? step.total : step.total);
    const lo = Math.min(0, ...totals, ...offsets);
    const hi = Math.max(...totals, ...offsets.map((v, i) => v + heights[i]));
    const pad = Math.max(1, (hi - lo) * 0.12);
    charts['wfLabor' + b.id] = boardMkChart(canvas, {
      type: 'bar',
      data: { labels: steps.map(step => step.label), datasets: [
        { data: offsets, backgroundColor: 'rgba(0,0,0,0)', borderWidth: 0, stack: 'b' },
        { data: heights, backgroundColor: colors, borderWidth: 0, stack: 'b', borderRadius: 3 },
      ]},
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false },
        tooltip: { filter: item => item.datasetIndex === 1, callbacks: { label: ctx => {
          const step = steps[ctx.dataIndex];
          return step.base ? wfCents(step.total) : wfCents(step.amount);
        } } } },
        scales: { x: { stacked: true, ticks: { font: { size: 9 }, maxRotation: 30 }, grid: { display: false } },
          y: { stacked: true, min: lo - pad, max: hi + pad, ticks: { callback: v => '$' + Math.round(v / 1000) + 'k', font: { size: 9 } }, grid: { color: 'rgba(0,0,0,0.04)' } } } },
    });
  });
}

function wfBridge(el, w) {
  if(!w.loaded){ el.innerHTML = wfEmpty('No employee roster or headcount plan loaded.'); return; }
  const n = w.total.length;
  const closeIdx = w.closeIdx >= 0 ? w.closeIdx : n - 1;
  const from = Math.max(0, closeIdx - 1);
  const priorHc = w.total[from];
  const closeHc = w.total[closeIdx];
  const budHc = w.budget && w.budget[closeIdx] != null ? w.budget[closeIdx] : null;
  const budVar = budHc != null && closeHc != null ? closeHc - budHc : null;
  const BRIDGE = [{label:`${w.labels[from]} ending`, hc:w.total[from], adds:w.total[from], isBase:true}];
  for (let i = from + 1; i < n; i++) {
    const adds = w.total[i] - w.total[i - 1];
    const hire = w.hires && w.hires[i] != null ? w.hires[i] : null;
    const exit = w.exits && w.exits[i] != null ? w.exits[i] : null;
    const detail = hire != null ? `+${hire}${exit ? ' / −' + exit : ''}` : `${adds >= 0 ? '+' : ''}${adds}`;
    BRIDGE.push({ label: `${w.labels[i]} ${detail}`, hc: w.total[i], adds, actual: w.months[i] <= w.close });
  }
  const offsets=[],bars=[],colors=[],borders=[];
  BRIDGE.forEach((b,i)=>{
    if(b.isBase){offsets.push(0);bars.push(b.hc);colors.push('#185FA5');borders.push('#185FA5');}
    else{const prior=BRIDGE[i-1].hc;offsets.push(Math.min(prior,b.hc));bars.push(Math.abs(b.adds));
      colors.push(b.actual?'#1D9E75':'#BA7517');borders.push(b.actual?'#0F6E56':'#854F0B');}
  });
  const lo = Math.min(...BRIDGE.map(b => b.hc)), hi = Math.max(...BRIDGE.map(b => b.hc));
  const yMin = Math.max(0, Math.floor((lo - Math.max(5,(hi-lo)*0.5))/5)*5), yMax = Math.ceil((hi + Math.max(3,(hi-lo)*0.15))/5)*5;
  const after = w.months.map((p,i)=>i).filter(i=>w.months[i] > w.close);
  const aria = BRIDGE.map(b=>b.isBase?`${b.label} ${b.hc}`:`${b.label}=${b.hc}`).join(', ');
  el.innerHTML = `
  <div class="card" style="margin-bottom:12px">
    <div class="card-title">Headcount bridge — ${w.labels[from]} ending through ${w.labels[n-1]}</div>
    <div class="card-sub">${w.labels[from]} ending ${priorHc} · ${w.labels[closeIdx]} ending ${closeHc}${budHc != null ? ` · budget ${budHc} (${budVar >= 0 ? '+' : ''}${budVar})` : ''} · green is the close month · amber is the rest of the year</div>
    <div class="legend">
      <span class="li"><span class="ls" style="background:#185FA5"></span>Start / end total</span>
      <span class="li"><span class="ls" style="background:#1D9E75"></span>Actual net change</span>
      <span class="li"><span class="ls" style="background:#BA7517"></span>Forecast net change</span>
    </div>
    <div class="chart-wrap" style="height:240px"><canvas id="wfBridgeChart" role="img" aria-label="Headcount bridge. ${aria}.">Headcount ${w.total[0]} to ${w.total[n-1]}.</canvas></div>
  </div>
  ${wfLaborSection(w)}
  <div class="two-col">
    <div class="card">
      <div class="card-title">HC adds by department — forecast period</div>
      <div class="card-sub">Monthly net adds after ${CLOSE_MO} · employee roster planned starts</div>
      ${after.length?`<div class="chart-wrap" style="height:180px"><canvas id="wfDeptAdds" role="img" aria-label="Monthly headcount adds by department after close">Department adds after close.</canvas></div>`:'<div class="card-sub">No forecast months after close.</div>'}
    </div>
    <div class="card">
      <div class="card-title">Department mix — ${w.labels[0]} vs ${w.labels[n-1]}</div>
      <div class="card-sub">Start vs end heads by department</div>
      ${w.depts.map((d,i)=>{const a=w.heads[d][0],b=w.heads[d][n-1],delta=b-a;
        return `<div class="var-row"><span class="var-lbl"><span class="ls" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${wfColor(d,i)};margin-right:5px;vertical-align:middle"></span>${d}</span><span class="var-act">${b}</span><span class="var-bud">${a} ${w.labels[0]}</span><span class="var-diff ${delta>0?'pos':delta<0?'neg':'neu'}">${delta>0?'+':''}${delta}</span></div>`;}).join('')}
    </div>
  </div>`;
  setTimeout(()=>{
    charts.wfBridge = boardMkChart(document.getElementById('wfBridgeChart'),{
      type:'bar',data:{labels:BRIDGE.map(b=>b.label),datasets:[
        {data:offsets,backgroundColor:'rgba(0,0,0,0)',borderColor:'rgba(0,0,0,0)',borderWidth:0,stack:'b'},
        {data:bars,backgroundColor:colors,borderColor:borders,borderWidth:1,
          borderRadius:{topLeft:3,topRight:3,bottomLeft:0,bottomRight:0},stack:'b'},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
        tooltip:{filter:item=>item.datasetIndex===1,callbacks:{label:ctx=>{const b=BRIDGE[ctx.dataIndex];return b.isBase?`Total: ${b.hc}`:`${b.adds>=0?'+':''}${b.adds} → ${b.hc}`;}}},
      },scales:{x:{stacked:true,ticks:{font:{size:9},maxRotation:30},grid:{display:false}},
        y:{stacked:true,min:yMin,max:yMax,ticks:{font:{size:9}},grid:{color:'rgba(0,0,0,0.04)'}}}},
      plugins:[{id:'wfVals',afterDatasetsDraw(chart){
        const ctx2=chart.ctx,meta=chart.getDatasetMeta(1);
        ctx2.save();ctx2.textAlign='center';
        meta.data.forEach((bar,i)=>{
          const b=BRIDGE[i];
          ctx2.font='bold 10px system-ui,sans-serif';
          ctx2.fillStyle=b.isBase?'#185FA5':b.actual?'#0F6E56':'#854F0B';
          ctx2.fillText(b.isBase?String(b.hc):`${b.adds>=0?'+':''}${b.adds}`,bar.x,bar.y-4);
        });ctx2.restore();
      }}]
    });
    wfDrawLaborCharts(w);
    if(!after.length) return;
    charts.wfDeptAdds = boardMkChart(document.getElementById('wfDeptAdds'),{type:'bar',data:{labels:after.map(i=>w.labels[i]),
      datasets:w.depts.map((d,di)=>({label:d,data:after.map(i=>Math.max(0,w.heads[d][i]-w.heads[d][i-1])),backgroundColor:wfColor(d,di)+'bb',stack:'a',borderWidth:0}))},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{stacked:true,ticks:{font:{size:9}},grid:{display:false}},y:{stacked:true,ticks:{font:{size:9},stepSize:1},grid:{color:'rgba(0,0,0,0.04)'}}}}});
  }, 50);
}

function wfRoster(el, w) {
  if(!w.roster.length){ el.innerHTML = wfEmpty('No employee roster loaded. Load the Employees file.'); return; }
  const planned = w.roster.filter(e=>String(e.status).toLowerCase()==='planned').length;
  let lastDept='';
  el.innerHTML = `
  <div class="full-card">
    <div class="card-title" style="margin-bottom:8px">Employee roster — ${w.roster.length} people at ${CLOSE_LABEL}${planned?` (${planned} planned hires started)`:''} · Employees file</div>
    <div style="overflow-x:auto;max-height:420px;overflow-y:auto">
    <table class="roster-tbl">
      <thead style="position:sticky;top:0;background:var(--bg)"><tr>
        <th style="text-align:left;width:12%">ID</th>
        <th style="text-align:left;width:20%">Role</th>
        <th style="text-align:left">Dept</th>
        <th>Level</th><th>Region</th><th>Status</th>
        <th>Base Salary</th><th>Variable</th><th>SBC/yr</th>
        <th>Roster Cost/yr</th><th>Quota ARR</th><th>Ramp</th>
      </tr></thead>
      <tbody>${w.roster.map(e=>{
        let hdr='';
        if(e.dept!==lastDept){lastDept=e.dept;hdr=`<tr class="dept-sep"><td colspan="12"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${wfColor(e.dept,w.depts.indexOf(e.dept))};margin-right:6px;vertical-align:middle"></span>${e.dept}</td></tr>`;}
        return hdr+`<tr>
          <td>${e.id}</td><td>${e.role}</td><td style="color:var(--text2)">${e.dept}</td>
          <td style="font-family:inherit;text-align:left"><span class="badge badge-gray">${e.lvl||'—'}</span></td>
          <td style="font-family:inherit;text-align:left;color:var(--text2)">${e.region||'—'}</td>
          <td style="font-family:inherit;text-align:left;color:var(--text2)">${e.status||'—'}</td>
          <td>${pFmt(e.base)}</td><td>${pFmt(e.variable)}</td><td>${pFmt(e.sbc)}</td>
          <td>${pFmt(e.cost)}</td>
          <td style="color:${e.quota>0?'#1D9E75':'var(--text3)'};font-weight:${e.quota>0?'500':'400'}">${e.quota>0?'$'+(e.quota/1e6).toFixed(2)+'M':'—'}</td>
          <td>${e.ramp!=null?e.ramp+' mo':'—'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
    <div class="card-sub" style="margin-top:6px">Roster cost is the fully loaded cash cost in the Employees file. Payroll on this page and in the statements comes from the GL.</div>
  </div>`;
}

function _salesTerritoryMapColors() {
  const cs = getComputedStyle(document.documentElement);
  const C = k => cs.getPropertyValue(k).trim();
  return {
    cBg: C('--bg') || '#18241b',
    cBg2: C('--bg2') || '#233326',
    cBg3: C('--bg3') || '#3a4d3e',
    cBorder: C('--border') || '#2e3f31',
    cText: C('--text') || '#dde8d6',
    cHighlightStroke: '#5a7a64',
  };
}

function _salesTerritoryPinColor(attPct) {
  const cs = getComputedStyle(document.documentElement);
  const C = k => cs.getPropertyValue(k).trim();
  if (attPct == null) return C('--text3') || '#888780';
  if (attPct >= 100) return C('--teal') || '#5fa878';
  if (attPct >= 90) return C('--accent') || '#c4855a';
  return C('--red') || '#b8705f';
}

function _salesTerritoryPinData() {
  const regions = boardSalesData().regions || {};
  return Object.keys(regions).filter(function(name) { return SALES_TERRITORY_PIN_XY[name]; }).map(function(name) {
    const d = regions[name];
    const att = d.close_quota ? (d.close_attained / d.close_quota) * 100 : null;
    const xy = SALES_TERRITORY_PIN_XY[name];
    return { name: name, x: xy.x, y: xy.y, reps: d.reps, att: att, color: _salesTerritoryPinColor(att) };
  });
}

function _salesTerritoryApplySkin(svgRoot) {
  const colors = _salesTerritoryMapColors();
  svgRoot.querySelectorAll('path[data-country]').forEach(function(path) {
    const n = path.getAttribute('data-country');
    const highlight = n === 'United States of America' || SALES_TERRITORY_EU_NAMES.has(n) || SALES_TERRITORY_APAC_NAMES.has(n);
    path.setAttribute('fill', highlight ? colors.cBg3 : colors.cBg2);
    path.setAttribute('stroke', highlight ? colors.cHighlightStroke : colors.cBorder);
    path.setAttribute('stroke-width', highlight ? '0.9' : '0.5');
  });
}

function _salesTerritoryRenderPins(svgRoot, pins) {
  const colors = _salesTerritoryMapColors();
  const ns = 'http://www.w3.org/2000/svg';
  svgRoot.querySelectorAll('#territory-pins').forEach(function(node) { node.remove(); });
  const layer = document.createElementNS(ns, 'g');
  layer.setAttribute('id', 'territory-pins');
  pins.forEach(function(p) {
    const r = 14 + p.reps * 2.6;
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')');

    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('r', String(r));
    circle.setAttribute('fill', p.color);
    circle.setAttribute('fill-opacity', '0.92');
    circle.setAttribute('stroke', colors.cText);
    circle.setAttribute('stroke-width', '2.5');
    g.appendChild(circle);

    const count = document.createElementNS(ns, 'text');
    count.setAttribute('text-anchor', 'middle');
    count.setAttribute('dy', '0.35em');
    count.setAttribute('font-size', String(11 + Math.min(p.reps, 8)));
    count.setAttribute('font-weight', '600');
    count.setAttribute('fill', colors.cBg);
    count.textContent = String(p.reps);
    g.appendChild(count);

    const label = document.createElementNS(ns, 'text');
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('y', String(r + 20));
    label.setAttribute('font-size', '14');
    label.setAttribute('font-weight', '600');
    label.setAttribute('fill', colors.cText);
    label.textContent = p.name;
    g.appendChild(label);

    const att = document.createElementNS(ns, 'text');
    att.setAttribute('text-anchor', 'middle');
    att.setAttribute('y', String(r + 38));
    att.setAttribute('font-size', '13');
    att.setAttribute('font-family', 'monospace');
    att.setAttribute('fill', p.color);
    att.textContent = p.att == null ? 'n/a' : p.att.toFixed(1) + '%';
    g.appendChild(att);

    layer.appendChild(g);
  });
  svgRoot.appendChild(layer);
}

function _salesTerritoryMountBasemap(container, svgText, pins) {
  container.innerHTML = svgText;
  const svg = container.querySelector('svg');
  if (!svg) throw new Error('basemap missing svg root');
  // Keep visual style but zoom out enough to show APAC pin.
  svg.setAttribute('viewBox', '-30 -8 1810 680');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.setAttribute('width', '100%');
  svg.style.display = 'block';
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Sales territory map with attainment pins for loaded regions');
  _salesTerritoryApplySkin(svg);
  _salesTerritoryRenderPins(svg, pins);
}

function renderSalesTerritoryMap(containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const pins = _salesTerritoryPinData();
  el.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:12px">Loading territory map…</div>';

  function done(svgText) {
    if (!document.getElementById(containerId)) return;
    try {
      _salesTerritoryMountBasemap(el, svgText, pins);
    } catch (err) {
      console.warn('[board] territory map mount failed', err);
      el.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:12px">Territory map unavailable</div>';
    }
  }

  if (_salesTerritoryBasemapCache) {
    done(_salesTerritoryBasemapCache);
    return;
  }

  fetch(SALES_TERRITORY_BASEMAP_URL)
    .then(function(res) {
      if (!res.ok) throw new Error('basemap HTTP ' + res.status);
      return res.text();
    })
    .then(function(svgText) {
      if (!svgText || svgText.indexOf('world-countries') < 0) throw new Error('invalid basemap payload');
      _salesTerritoryBasemapCache = svgText;
      done(svgText);
    })
    .catch(function(err) {
      console.warn('[board] territory basemap fetch failed', err);
      if (!document.getElementById(containerId)) return;
      el.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:12px">Territory map unavailable (basemap could not load)</div>';
    });
}

function _sBuckets(reps) {
  const bkts = {'<80%':0,'80-90%':0,'90-100%':0,'100-110%':0,'>110%':0};
  let missing = 0;
  reps.forEach(r => {
    if (r.pct == null || !isFinite(r.pct)) { missing++; return; }
    const p = r.pct * 100;
    if (p < 80) bkts['<80%']++; else if (p < 90) bkts['80-90%']++; else if (p < 100) bkts['90-100%']++; else if (p < 110) bkts['100-110%']++; else bkts['>110%']++;
  });
  return { bkts, missing };
}

function _sRank(obj) {
  return Object.keys(obj || {}).filter(k => obj[k] && obj[k].ytd_pct != null).sort((a, b) => obj[b].ytd_pct - obj[a].ytd_pct);
}

function _sRankSub(obj, disp) {
  const rank = _sRank(obj);
  if (!rank.length) return 'Not loaded';
  const top = rank[0], low = rank[rank.length - 1];
  if (rank.length === 1) return `${disp(top)} at ${_sp(obj[top].ytd_pct)}`;
  return `${disp(top)} highest at ${_sp(obj[top].ytd_pct)} · ${disp(low)} lowest at ${_sp(obj[low].ytd_pct)}`;
}

function boardSalesKpis() {
  const SD = boardSalesData();
  const monthly = SD.monthly || {};
  const periods = Object.keys(monthly).filter(p => p <= CLOSE_MONTH).sort();
  const sum = key => periods.length && periods.every(p => monthly[p][key] != null)
    ? periods.reduce((t, p) => t + monthly[p][key], 0) : null;
  const close = monthly[CLOSE_MONTH] || null;
  const pipe = (SD.pipeline || {})[CLOSE_MONTH] || null;
  const reps = SD.reps || [];
  const comm = reps.filter(r => r.comm != null && isFinite(r.comm));
  const regions = new Set(reps.map(r => r.region).filter(Boolean));
  const q = sum('quota'), a = sum('attained');
  return {
    team: SD.team_quota_type ? `${SD.team_quota_type} quota` : 'all quota carriers',
    periods, range: _sRange(periods), quota: q, attained: a, pct: q && a != null ? a / q : null,
    closePct: close && close.pct != null ? close.pct : null,
    pipeline: pipe && pipe.ending != null ? pipe.ending : null,
    coverage: pipe && pipe.coverage != null ? pipe.coverage : null,
    comm: comm.length ? comm.reduce((t, r) => t + r.comm, 0) : null,
    commReps: comm.length, reps: reps.length, regions: regions.size,
  };
}

function showSTab(name, btn) {
  Object.values(_sCharts).forEach(c=>{try{c.destroy();}catch(e){}});
  _sCharts={};
  document.querySelectorAll('.subnav .snav-btn').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  _sTab = name;
  _buildSTab(name);
}

function _buildSTab(name) {
  const el = document.getElementById('sContent');

  else if(name==='map') _sMap(el);

}

function _sPipeline(el) {
  const SD = boardSalesData();

  const wf = {
    beg: act.length ? pipe[act[0]].beginning : null,

async function cpSend() {
  var msgs = document.getElementById('cpMessages');
  if (msgs) {
    msgs.innerHTML += '<div class="cp-msg assistant"><div class="cp-avatar">S</div><div class="cp-bubble" style="color:var(--text2)">SMPL Copilot is loading — try again in a moment.</div></div>';
    msgs.scrollTop = msgs.scrollHeight;
  }
}
window.cpSend = cpSend;

function formatCopilotReply(text) {
  // Format the three structured sections
  let out = text
    .replace(/1\.\s*PRIMARY DRIVER[^:]*:/gi, '<div class="cp-section">1. Primary Driver + Variance Context</div>')
    .replace(/2\.\s*FINANCIAL AND OPERATIONAL[^:]*:/gi, '<div class="cp-section">2. Financial & Operational Root Cause</div>')
    .replace(/3\.\s*RECOMMENDED ACTION[^:]*:/gi, '<div class="cp-section">3. Recommended Action + Board Summary</div>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');

  // Extract source citations if present
  const srcMatch = out.match(/Source[s]?:([^<]+)/i);
  if(srcMatch) {
    out = out.replace(/Source[s]?:[^<]+/i, `<div class="cp-source">Sources: ${srcMatch[1].trim()}</div>`);
  }
  return out;
}

  const s = SKINS[id] || SKINS.canvas;
  const r = document.documentElement.style;
  r.setProperty('--bg',           s.bg);
  r.setProperty('--bg2',          s.bg2);
  r.setProperty('--bg3',          s.bg3);
  r.setProperty('--panel',        s.bg2);
  r.setProperty('--text',         s.text);
  r.setProperty('--text2',        s.text2);
  r.setProperty('--text3',        s.text3);
  r.setProperty('--border',       s.border);
  r.setProperty('--border2',      s.border2);
  r.setProperty('--accent',       s.accent);
  r.setProperty('--teal',         s.teal);
  r.setProperty('--red',          s.red);
  r.setProperty('--amber',        s.amber);
  r.setProperty('--navy',         s.bg2);
  r.setProperty('--blue',         s.teal);
  r.setProperty('--green',        s.teal);
  r.setProperty('--gray',         s.text3);
  r.setProperty('--lgray',        s.border);
  r.setProperty('--shadow',       s.shadow);
  r.setProperty('--teal-light',   s.teal + '22');
  r.setProperty('--red-light',    s.red  + '18');
  r.setProperty('--amber-light',  s.amber + '18');
  r.setProperty('--green-light',  s.teal + '18');

  if (typeof smplBoardRefreshView === 'function') {
    smplBoardRefreshView();

    const activeTab = document.querySelector('.nav-btn.active');

      const tabName = activeTab.getAttribute('onclick')?.match(/show\('(\w+)'/)?.[1];
